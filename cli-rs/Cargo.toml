[package]
name = "tuist-rs"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "tuist"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
incurs = { path = "../../incurs/crates/incurs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
