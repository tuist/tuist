# Struo workspace for the monorepo. Discovery is limited to the projects that
# build with Struo so the rest of the repository is never scanned or loaded.
[workspace]
include = [
  "struo.toml",
  "atlas/mix.exs",
]
exclude = [
  "Package.swift",
]

[infrastructure.cache]
provider = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
project = "atlas"

# `struo build --remote` runs Atlas's actions on Tuist remote execution, in the
# image the service advertises, as tuist/atlas. Builds without `--remote` stay
# local. The paths are the worker image's toolchain
# (`infra/sandbox-image/Dockerfile`, `elixir-toolchain`), which pins the same
# Erlang and Elixir as the root mise.toml.
[infrastructure.execution]
provider = "tuist"

[infrastructure.execution.properties.elixir]
schema_version = 1
os = "linux"
arch = "x86_64"
elixir_bin = "/opt/elixir/bin"
erlang_bin = "/opt/erlang/bin"
mix_home = "/opt/mix"
rebar3 = "/opt/mix/rebar3"

# The Atlas image has its own project so its layer snapshots and insights stay
# separate from the Mix build. Select it with `STRUO_CACHE_PROVIDER=tuist-oci`.
[infrastructures.tuist-oci]
kind = "tuist"
account = "tuist"
project = "atlas-oci"

# The build context is the repository root because Atlas depends on `../noora`
# through a Mix path dependency, matching the release workflow. Instructions are
# cached individually: base images are pinned by digest in the Dockerfile, so a
# result only changes when an instruction or the files it copies change.
[[target]]
name = "atlas_image"
kind = "dockerfile_image"

[target.attrs]
dockerfile = "atlas/Dockerfile"
context = "."
platform = "linux/amd64"
cacheable = true
pull = false
tag = "ghcr.io/tuist/atlas:ci"
