# Preparation overlay: apply only after both cache hosts are ordered, installed,
# and marked with this exact production adoption prefix. Not part of the default
# production values. Keep ovh-gra-runners unavailable and its account flag off
# until private-path qualification succeeds. Requires the updated CAPI provider.
# Existing runner Machines need explicit, one-at-a-time vRack enrollment after
# their jobs drain; OnDelete does not copy a changed template onto them.
ovhFleets:
  gra-runners-cache:
    enabled: true
    replicas: 2
    endpoint: ovh-us
    nodePool: kura-ovh-gra-runners
    machine:
      adoptDisplayNamePrefix: tuist-kura-ovh-production-gra-runners
      offer: advance-1
      datacenter: gra
      os: ubuntu_24.04
      # Retain a conservative aggregate shaping budget during qualification.
      # The catalog's physical private link is 25 Gbps; this does not benchmark it.
      egressBudgetMbps: 3000
    sshExternalSecret:
      enabled: true
      item: OVH_FLEET_SSH
  runners-linux:
    machine:
      vRackID: pn-2024093
