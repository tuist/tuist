# Prepare isolated runner shape pools for the account flag runner_linux_vrack.
# No hosts or cache instances are ordered; production defaults do not load this.
# Before enabling the flag, partition existing idle hosts into disjoint CAPI
# node pools and enroll only the vRack cohort Machines in pn-2024093.
# Never set vRackID on the ordinary fleet template: unflagged jobs must keep
# using unenrolled hosts. Template changes do not migrate existing Machines.
runnersFleetLinux:
  vrack:
    enabled: true
    nodePool: runners-linux-vrack
