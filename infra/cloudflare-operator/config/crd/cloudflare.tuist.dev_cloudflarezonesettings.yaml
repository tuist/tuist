apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflarezonesettings.cloudflare.tuist.dev
spec:
  group: cloudflare.tuist.dev
  scope: Cluster
  names:
    plural: cloudflarezonesettings
    singular: cloudflarezonesetting
    kind: CloudflareZoneSetting
    shortNames: [cfzs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Zone, type: string, jsonPath: .spec.zoneId}
        - {name: Setting, type: string, jsonPath: .spec.settingId}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [zoneId, settingId, value]
              properties:
                zoneId: {type: string}
                settingId: {type: string}
                value:
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedValue:
                  x-kubernetes-preserve-unknown-fields: true
                observedGeneration: {type: integer, format: int64}
                message: {type: string}
                lastReconciledAt: {type: string, format: date-time}
