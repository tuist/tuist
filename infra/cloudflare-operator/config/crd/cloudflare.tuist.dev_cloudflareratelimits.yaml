apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflareratelimits.cloudflare.tuist.dev
spec:
  group: cloudflare.tuist.dev
  scope: Cluster
  names:
    plural: cloudflareratelimits
    singular: cloudflareratelimit
    kind: CloudflareRateLimit
    shortNames: [cfrl]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Zone, type: string, jsonPath: .spec.zoneId}
        - {name: Mode, type: string, jsonPath: .spec.mode}
        - {name: Paused, type: boolean, jsonPath: .spec.paused}
        - {name: Action, type: string, jsonPath: .spec.action}
        - {name: Requests, type: integer, jsonPath: .spec.ratelimit.requestsPerPeriod}
        - {name: Period, type: integer, jsonPath: .spec.ratelimit.period}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [zoneId, description, expression, action, ratelimit]
              x-kubernetes-validations:
                - rule: "self.zoneId == oldSelf.zoneId"
                  message: "spec.zoneId is immutable"
                - rule: "'cf.colo.id' in self.ratelimit.characteristics"
                  message: "ratelimit.characteristics must include 'cf.colo.id' (Cloudflare Advanced Rate Limiting requires it for correct per-datacenter counting)"
                - rule: "has(self.adopt) || self.createNewRule == true"
                  message: "either spec.adopt.ruleId (to adopt an existing Cloudflare rule) or spec.createNewRule=true (to create a new one) must be set"
                - rule: "!has(oldSelf.adopt) || (has(self.adopt) && self.adopt.ruleId == oldSelf.adopt.ruleId)"
                  message: "spec.adopt is immutable once set"
              properties:
                zoneId:
                  type: string
                description: {type: string}
                expression: {type: string}
                action:
                  type: string
                  enum: [block, managed_challenge, js_challenge, log]
                enabled: {type: boolean, default: true}
                mode:
                  type: string
                  enum: [read_only, active]
                  default: read_only
                paused: {type: boolean, default: false}
                createNewRule: {type: boolean, default: false}
                retainOnDelete: {type: boolean, default: true}
                adopt:
                  type: object
                  required: [ruleId]
                  properties:
                    ruleId: {type: string}
                ratelimit:
                  type: object
                  required: [characteristics, requestsPerPeriod, period, mitigationTimeoutSeconds]
                  properties:
                    characteristics:
                      type: array
                      items: {type: string}
                    requestsPerPeriod:
                      type: integer
                      minimum: 1
                    period:
                      type: integer
                      enum: [10, 60, 600, 3600]
                    mitigationTimeoutSeconds: {type: integer}
                    countingExpression: {type: string}
            status:
              type: object
              properties:
                ref: {type: string}
                ruleId: {type: string}
                rulesetId: {type: string}
                managedZoneId: {type: string}
                mode: {type: string}
                proposedChanges: {type: string}
                observedGeneration: {type: integer, format: int64}
                message: {type: string}
                lastReconciledAt: {type: string, format: date-time}
                # Standard Kubernetes conditions. Ready is what
                # kstatus-based gating (Flux Kustomization health,
                # kubectl wait --for=condition=Ready) watches. It is
                # True only after a successful active reconcile has
                # applied the current spec — read_only, paused, and
                # error paths hold Ready=False.
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type: {type: string, maxLength: 316}
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
                      reason:
                        type: string
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768
