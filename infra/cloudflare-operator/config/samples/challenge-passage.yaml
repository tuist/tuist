# Extend how long a visitor's Managed Challenge stays passing before
# Cloudflare re-runs it. Default is 30 minutes; bumping to 6 hours
# keeps a returning visitor within a working day off the interstitial
# even if their browser context is atypical.
apiVersion: cloudflare.tuist.dev/v1alpha1
kind: CloudflareZoneSetting
metadata:
  name: challenge-passage-6h
spec:
  zoneId: REPLACE_WITH_ZONE_ID
  settingId: challenge_ttl
  value: 21600
