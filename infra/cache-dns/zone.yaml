AWSTemplateFormatVersion: '2010-09-09'
Description: Delegated Tuist managed-cache DNS zone and separate least-privilege runtime policies.
Resources:
  QueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/route53/cache.tuist.dev
      RetentionInDays: 14
  QueryLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: route53-query-logging-cache-tuist-dev
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"Service": "route53.amazonaws.com"},
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${QueryLogGroup.Arn}",
              "Condition": {
                "StringEquals": {"aws:SourceAccount": "${AWS::AccountId}"},
                "ArnLike": {"aws:SourceArn": "arn:${AWS::Partition}:route53:::hostedzone/*"}
              }
            }
          ]
        }
  CacheZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: QueryLogResourcePolicy
    Properties:
      Name: cache.tuist.dev
      HostedZoneConfig:
        Comment: Per-account latency-steered cache endpoints across managed environments
      QueryLoggingConfig:
        CloudWatchLogsLogGroupArn: !GetAtt QueryLogGroup.Arn
  RecordWriterPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: external-dns cache zone record writer
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [route53:ListHostedZones, route53:ListHostedZonesByName]
            Resource: '*'
          - Effect: Allow
            Action: [route53:ListResourceRecordSets, route53:ChangeResourceRecordSets, route53:ListTagsForResource]
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${CacheZone}'
          - Effect: Allow
            Action: route53:GetChange
            Resource: !Sub 'arn:${AWS::Partition}:route53:::change/*'
  SolverPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: cert-manager DNS01 challenges in the cache zone
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: route53:ListResourceRecordSets
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${CacheZone}'
          - Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${CacheZone}'
            Condition:
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes: [TXT]
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames: ['_acme-challenge.cache.tuist.dev', '_acme-challenge.*.cache.tuist.dev']
          - Effect: Allow
            Action: route53:GetChange
            Resource: !Sub 'arn:${AWS::Partition}:route53:::change/*'
  ControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Observe cache DNS records and manage shared box TCP health checks
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: route53:ListResourceRecordSets
            Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${CacheZone}'
          - Effect: Allow
            Action: [route53:ListHealthChecks, route53:CreateHealthCheck]
            Resource: '*'
          - Effect: Allow
            Action: route53:DeleteHealthCheck
            Resource: !Sub 'arn:${AWS::Partition}:route53:::healthcheck/*'
Outputs:
  HostedZoneId:
    Value: !Ref CacheZone
  NameServers:
    Value: !Join [',', !GetAtt CacheZone.NameServers]
  WriterPolicyArn:
    Value: !Ref RecordWriterPolicy
  SolverPolicyArn:
    Value: !Ref SolverPolicy
  ControllerPolicyArn:
    Value: !Ref ControllerPolicy
  QueryLogGroupName:
    Value: !Ref QueryLogGroup
