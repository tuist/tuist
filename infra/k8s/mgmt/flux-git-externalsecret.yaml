# Syncs Flux's git credential (a dedicated single-repo GitHub App) from the
# tuist-k8s-mgmt 1Password vault into the secret the bootstrap-created
# `flux-system` GitRepository reads (spec/72 Decision 8: Flux's git secret
# is ESO-synced, not hand-created; the App key rotates on the production-
# secret cadence).
#
# creationPolicy: Owner — ESO creates and owns this Secret outright. `Merge`
# would require the target to already exist, so a break-glass reseed (delete the
# Secret, re-apply from git without re-bootstrapping) would leave ESO in
# SecretSyncedError, the GitRepository failing auth, and Flux silently stopped.
# Owner makes the recovery path just "re-apply". The bootstrap PAT that briefly
# populates this Secret is not needed afterwards: with `provider: github` the
# App fields below are what source-controller authenticates with. Requires the `onepassword` ClusterSecretStore
# (external-secrets.yaml) and a `FLUX_GITHUB_APP` item in tuist-k8s-mgmt
# with fields app_id / installation_id (underscores — these must match the
# 1Password item EXACTLY) plus the `private-key.pem` FILE attachment. A 1Password
# secret reference resolves an attachment by filename just like a field, and the
# onepasswordSDK provider uses the same resolver — verified end to end against
# this store, so the App key is stored once, as the attachment, not duplicated
# into a second concealed field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-system-git-auth
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-system
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # Flux source-controller GitHub App auth keys.
        githubAppID: "{{ .appID }}"
        githubAppInstallationID: "{{ .installationID }}"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - secretKey: appID
      remoteRef:
        key: FLUX_GITHUB_APP/app_id
    - secretKey: installationID
      remoteRef:
        key: FLUX_GITHUB_APP/installation_id
    - secretKey: privateKey
      remoteRef:
        key: FLUX_GITHUB_APP/private-key.pem
