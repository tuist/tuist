# Joins each management control-plane node to the Tailscale tailnet as a
# regular tailnet node, so operators reach talosd on :50000 via a stable
# tailnet IP / MagicDNS name (the node name, e.g. `tuist-mgmt`) instead of a
# hand-maintained operator-IP allowlist on the Hetzner firewall.
#
# Architecture: tailscaled runs in a DaemonSet with hostNetwork=true, one
# Pod per control-plane node. The WireGuard interface lives on the host, so
# inbound tailnet traffic is routed by the host kernel to whatever's
# listening on :50000 (talosd). Each node has its own tailnet identity: the
# device name is the node name, and its state lives in the Secret
# `tailscale-state-<node name>`. etcd and the kubelet do not use the tailnet;
# they are pinned to the Hetzner private network
# (infra/k8s/mgmt/talos/patches/40-private-addressing.yaml).
#
# Namespace: mgmt-tailscale holds only Tailscale's Secrets, so the Role can
# grant access to every Secret in it. The per-node state Secret names are
# not known in advance, and RBAC cannot match a name prefix.
#
# Authentication: OAuth client credentials, NOT a regular auth key.
# OAuth clients don't have the 90-day rotation cap that auth keys do
# (Tailscale UI caps auth-key expiry at 90 days), and they're the
# pattern Tailscale recommends for unattended Kubernetes deployments.
# The `tailscale/tailscale` container detects an OAuth secret by the
# `tskey-client-` prefix on TS_AUTHKEY and uses it to mint a
# short-lived auth key on the fly at registration time.
#
# Operator onboarding (one-time per operator):
#   1. Install tailscale (https://tailscale.com/download).
#   2. Be added to the Tuist tailnet by an admin.
#   3. `talosctl config endpoint tuist-mgmt` (replaces the public IP).
#   4. `talosctl health` should return clean.
#
# Tenant bootstrap (one-time, ever):
#   1. Create / use the tuist.dev Tailscale tenant.
#   2. In the ACL editor (Access Controls → Edit file), add a tag
#      definition for the mgmt VMs. The owner restricts who can mint
#      keys for this tag — keep it to admins only:
#        "tagOwners": {
#          "tag:tuist-mgmt": ["autogroup:admin"]
#        }
#      (Merge with any existing `tagOwners` block; don't replace.)
#   3. Settings → Trust credentials → Credential → OAuth, then
#      Generate credential. (Not "Settings → OAuth clients", and not
#      the Keys page, which holds only auth keys and API tokens.)
#      https://login.tailscale.com/admin/settings/trust-credentials
#      - Description: `mgmt-cluster tailscaled (manifest: infra/k8s/mgmt/tailscale.yaml)`
#      - Scopes: Keys → Auth Keys → Write
#      - Tags: `tag:tuist-mgmt` (required for the write scope, and
#        limits what the client can mint)
#      Copy the secret (starts with `tskey-client-`); shown once.
#   4. Store the secret in 1Password as
#      `tailscale-mgmt-oauth-client-secret`.
#   5. On the mgmt cluster:
#        kubectl apply -f infra/k8s/mgmt/tailscale.yaml
#        kubectl -n mgmt-tailscale create secret generic tailscale-oauth \
#          --from-literal=TS_AUTHKEY="tskey-client-PASTE?ephemeral=false&preauthorized=true"
#      `ephemeral=false&preauthorized=true` keep the device long-lived
#      and skip manual approval. Don't add `&tag=` here — containerboot
#      rejects it as an unknown attribute. The tag is set instead by
#      `--advertise-tags=tag:tuist-mgmt` in TS_EXTRA_ARGS below, which
#      OAuth flow requires regardless.
#   6. Wait for the Pods to come up, confirm each node shows up in the
#      Tailscale admin console under its node name with `tag:tuist-mgmt`.
#   7. For each new device, Machines → <node name> → ⋯ → Disable key
#      expiry if it shows one. A node key that expires silently cuts
#      that node off the tailnet.
#   8. Test from an operator machine: `talosctl --endpoints tuist-mgmt
#      --nodes tuist-mgmt version` returns the expected Talos version.
#
# Rotation: the OAuth client itself doesn't expire. Revoke it via the
# admin console if compromised; create a replacement, update the
# `tailscale-oauth` Secret in mgmt-tailscale, restart the DaemonSet.
#
# Failure mode: if Tailscale's coordination server is unreachable,
# already-paired peers keep working over their last-known direct path
# or DERP relay. If tailscaled crashes on a node, operators briefly lose
# `:50000` access to that node until it restarts (a few seconds). `:6443`
# is unaffected — that's still public + cert auth, so the cluster keeps
# reconciling and CI keeps deploying.
#
# Expects Secret `tailscale-oauth` in mgmt-tailscale (TS_AUTHKEY field, OAuth
# client secret prefixed with `tskey-client-`), created per the bootstrap
# steps above.

---
apiVersion: v1
kind: Namespace
metadata:
  name: mgmt-tailscale
  labels:
    # hostNetwork and NET_ADMIN, see the DaemonSet below.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: mgmt-tailscale

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale
  namespace: mgmt-tailscale
rules:
  # tailscaled persists its node key + machine state in the Secret named by
  # TS_KUBE_SECRET, one per node.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale
  namespace: mgmt-tailscale
subjects:
  - kind: ServiceAccount
    name: tailscale
    namespace: mgmt-tailscale
roleRef:
  kind: Role
  name: tailscale
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale
  namespace: mgmt-tailscale
  labels:
    app: tailscale
spec:
  updateStrategy:
    # Replaces one node's Pod at a time, removing the old Pod before the new
    # one starts, so two tailscaled never share a node's identity.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      serviceAccountName: tailscale
      # hostNetwork: WireGuard interface created by tailscaled lives
      # on the host so inbound traffic on the tailnet IP can reach
      # services already listening on the host (talosd on :50000).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.84.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: $(NODE_NAME)
            - name: TS_KUBE_SECRET
              value: tailscale-state-$(NODE_NAME)
            - name: TS_USERSPACE
              # false = kernel WireGuard. Talos ships with the
              # wireguard module loaded; if a future Talos release
              # drops it we'll see this pod fail and can flip to
              # userspace mode (small perf hit, no functional change
              # for the low traffic on a mgmt session).
              value: "false"
            - name: TS_ACCEPT_DNS
              # Don't override the host's DNS resolver (Talos manages
              # /etc/resolv.conf). Set as env var, NOT in
              # TS_EXTRA_ARGS — containerboot already passes
              # --accept-dns based on this env var, and adding the
              # same flag to TS_EXTRA_ARGS causes "flag provided
              # multiple times" and a crashloop.
              value: "false"
            - name: TS_EXTRA_ARGS
              # OAuth flow requires --advertise-tags here in addition
              # to the `?tag=` query param on TS_AUTHKEY (containerboot
              # rejects OAuth auth keys without --advertise-tags).
              value: "--advertise-tags=tag:tuist-mgmt"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
