# Least-privilege identity for the `flux diff` PR job (spec/72 Decision 3).
#
# `flux diff kustomization --server-side` runs a server-side-apply DRY RUN
# of the workload Cluster CRs against the live mgmt API. A dry-run apply is
# still authorized by RBAC as create/update/patch (there is no "dry-run"
# verb), so this SA is NOT read-only — but it can only PREVIEW. Applying
# stays Flux's alone.
#
# Scope discipline:
#   - WRITE (create/update/patch, exercised only as dry-run) is granted on
#     `clusters` alone — the only kind present in
#     infra/k8s/clusters/workloads/, so the only kind the diff ever applies.
#   - READ (get/list) covers the related CAPI kinds the diff/CAPI defaulting
#     may consult, plus `clusterclasses` (never writable here). Everything is
#     namespaced to org-tuist; nothing cluster-wide except read-only CRD
#     discovery.
#
# The SA token is rendered into a kubeconfig and stored in the dedicated
# `tuist-k8s-mgmt-ci` 1Password vault, which holds ONLY that kubeconfig — NOT
# the general `tuist-k8s-mgmt` vault. This matters more than it looks: the
# flux-diff job runs on `pull_request`, and GitHub executes the workflow file
# from the PR branch, so a token scoped to `tuist-k8s-mgmt` would let any
# pushable branch read the break-glass cluster-admin kubeconfig sitting in that
# vault and bypass every restriction above. Scoping the CI service account to a
# vault containing a single least-privilege credential is what makes the RBAC
# here meaningful. Never exposed to fork PRs. Owned + rotated by the mgmt owner
# (Decision 8).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-diff
  namespace: org-tuist
  labels:
    app.kubernetes.io/name: flux-diff
    app.kubernetes.io/managed-by: tuist-bootstrap
---
# Long-lived token (SA controller no longer auto-creates one in k8s >=1.24).
# Rendered into the kubeconfig stored in 1Password.
apiVersion: v1
kind: Secret
metadata:
  name: flux-diff-token
  namespace: org-tuist
  annotations:
    kubernetes.io/service-account.name: flux-diff
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-diff
  namespace: org-tuist
rules:
  # The only kind the diff applies (dry-run): the workload Cluster CRs.
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Read-only context for a faithful diff. Never writable by this SA.
  - apiGroups: ["cluster.x-k8s.io"]
    resources:
      ["clusterclasses", "machinedeployments", "machinesets", "machines"]
    verbs: ["get", "list"]
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["kubeadmcontrolplanes"]
    verbs: ["get", "list"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["kubeadmconfigtemplates"]
    verbs: ["get", "list"]
  # caph infrastructure CRDs are v1beta1 (not v1beta2).
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources:
      - "hcloudmachinetemplates"
      - "hetznerclustertemplates"
      - "hetznerbaremetalmachinetemplates"
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-diff
  namespace: org-tuist
roleRef:
  kind: Role
  name: flux-diff
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: flux-diff
    namespace: org-tuist
---
# The only unavoidable cluster-scoped grant: read CRD definitions so the
# dry-run apply can resolve the Cluster's schema. get/list only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-diff-crd-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-diff-crd-read
roleRef:
  kind: ClusterRole
  name: flux-diff-crd-read
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: flux-diff
    namespace: org-tuist
---
# `flux diff kustomization` reads the in-cluster Kustomization to resolve the
# source and reconciliation settings before building. Without this the diff
# fails with Forbidden, which the workflow's `|| true` would have swallowed —
# reporting "no changes" for a job that never ran. Cluster-scoped read (rather
# than a Role in flux-system) because that namespace does not exist until
# bootstrap, and these objects carry no secret material.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-diff-kustomization-read
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-diff-kustomization-read
roleRef:
  kind: ClusterRole
  name: flux-diff-kustomization-read
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: flux-diff
    namespace: org-tuist
---
# RBAC CANNOT express "may only preview". Kubernetes authorizes a dry-run write
# exactly like a real one, so the create/update/patch grants above would let any
# PR-controlled workflow drop `--dry-run=server` and mutate live Clusters — e.g.
# scale a production worker pool — before review. The narrow verbs are necessary
# but not sufficient; admission is where the dry-run restriction is enforceable.
#
# This denies any non-dry-run write to a Cluster from the flux-diff identity.
# Applying stays Flux's alone, which is the property the whole design depends on.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-diff-dry-run-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cluster.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        # Deliberately broader than the Role above. If the Role is ever widened
        # (a subresource like clusters/status to make `flux diff` behave better,
        # or another kind), a policy scoped to exactly `clusters` would let those
        # non-dry-run writes slip past admission. Matching the whole group keeps
        # the guard ahead of the grant instead of trailing it.
        resources: ["*"]
  matchConditions:
    - name: only-the-flux-diff-identity
      expression: "request.userInfo.username == 'system:serviceaccount:org-tuist:flux-diff'"
  validations:
    - expression: "has(request.dryRun) && request.dryRun"
      message: "flux-diff may only issue dry-run writes; applying is Flux's alone"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-diff-dry-run-only
spec:
  policyName: flux-diff-dry-run-only
  validationActions: ["Deny"]
