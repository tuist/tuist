# Helm values for External Secrets Operator on the management cluster
# (chart external-secrets/external-secrets, version pinned in
# mgmt-cluster-apply.yml). The kubectl job installs or upgrades it on every
# run; see external-secrets.yaml for the 1Password store it backs.
installCRDs: true
webhook:
  # The webhook validates every ExternalSecret and SecretStore with
  # failurePolicy: Fail, so it runs two replicas, spread across control-plane
  # nodes. Its PodDisruptionBudget lives in controller-pdbs.yaml alongside
  # the clusterctl-managed webhook budgets.
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: external-secrets
                app.kubernetes.io/name: external-secrets-webhook
