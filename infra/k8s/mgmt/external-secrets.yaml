# External Secrets Operator (ESO) on the MANAGEMENT cluster.
#
# spec/72 Decision 8: landing ESO on the mgmt cluster is a bootstrap
# prerequisite for Flux. Management-cluster secrets are hand-created today;
# once ESO is here, Flux's git credential and the Grafana Cloud tokens are
# synced from the `tuist-k8s-mgmt` 1Password vault instead.
#
# --- Before you begin -------------------------------------------------------
# Every command below targets the MANAGEMENT cluster, which is NOT in the
# usual kubeconfig (those contexts are all workload clusters, and a `view`
# identity there cannot even list Secrets). Load the break-glass kubeconfig
# and confirm you are on mgmt first — only the mgmt cluster serves CAPI:
#
#   op document get "kubeconfig: tuist-mgmt" --vault tuist-k8s-mgmt \
#     --output ./mgmt.kubeconfig && chmod 600 ./mgmt.kubeconfig
#   export KUBECONFIG=./mgmt.kubeconfig
#   kubectl get clusters.cluster.x-k8s.io -A   # errors on a workload cluster
#
# Keep that file out of git — it is a cluster-admin credential sitting in a
# public repo's worktree.
#
# --- 1. Install ESO ---------------------------------------------------------
# ESO is NOT installed by the platform chart here — the mgmt cluster does
# not run `infra/helm/platform/`. Install the same pinned chart standalone
# (matches the workload-cluster version so the onepasswordSDK provider
# behaves identically):
#
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     --version 2.3.0 \
#     -n external-secrets --create-namespace \
#     --set installCRDs=true
#
# --- 2. Apply this file, THEN seed the token --------------------------------
# Order matters: the `onepassword` Namespace below is where the seed Secret
# goes, so this file must be applied BEFORE creating it.
#
#   kubectl apply -f infra/k8s/mgmt/external-secrets.yaml
#
# The seed credential is a 1Password service account scoped read-only to the
# tuist-k8s-mgmt vault. It CANNOT live in that vault — you would need the
# token to read the token — so, like every per-env token in
# `mise/tasks/k8s/bootstrap-workload.sh`, it lives in `Founders` and is
# referenced by UUID. The mgmt one is `tuist-mgmt-k8s`; if it is missing,
# create it (read-only on tuist-k8s-mgmt) and save its token to Founders:
#
#   op item list --account tuist.1password.com --vault Founders | grep mgmt-k8s
#   OP_TOKEN=$(op read --account tuist.1password.com \
#     "op://Founders/sfbjwcktutbhtilzjatwx3rkdy/credential")
#   kubectl -n onepassword create secret generic onepassword-sa-token \
#     --from-literal=token="$OP_TOKEN" --dry-run=client -o yaml \
#     | kubectl -n onepassword apply -f -
#   unset OP_TOKEN
#
# Note `-n onepassword` on BOTH halves: `kubectl create --dry-run=client -o
# yaml` does not always emit metadata.namespace, so a bare `apply -f -` can
# silently land the token in `default`.
#
# --- 3. Validate ------------------------------------------------------------
# The store is created (step 2) before its token exists, so its first
# reconciles fail and ESO backs off exponentially to ~7-minute retries. A
# plain `kubectl wait --timeout=2m` is therefore unreliable on a fresh
# install — nudge it rather than waiting out the backoff:
#
#   kubectl annotate clustersecretstore onepassword \
#     force-sync="$(date +%s)" --overwrite
#   kubectl get clustersecretstore onepassword \
#     -o jsonpath='{.status.conditions[*].reason}'   # want: Valid
#
# Everything else (Flux git creds, Grafana Cloud tokens) is then an
# ExternalSecret against this store.
---
apiVersion: v1
kind: Namespace
metadata:
  name: onepassword
  labels:
    app.kubernetes.io/managed-by: tuist-bootstrap
---
# 1Password-backed ClusterSecretStore for the mgmt cluster. Same shape as
# the per-workload store in `bootstrap/onepassword-secretstore.yaml`, but
# the vault is fixed to tuist-k8s-mgmt (no envsubst — there is one mgmt
# cluster). Uses the 1Password SDK provider, which authenticates against
# the 1P API directly with a service-account token; no in-cluster Connect.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: tuist-k8s-mgmt
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa-token
          namespace: onepassword
          key: token
