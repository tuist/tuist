# Talos machine config patch for every management control-plane node.
# See ../README.md.
#
# Talos's userspace OOM controller skips any cgroup with a memory limit, so
# these limits keep it from picking the control-plane static pods. Requests
# match the values Talos sets when resources are unset.
cluster:
  apiServer:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 3Gi
  controllerManager:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
  scheduler:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
