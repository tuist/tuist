# ServiceAccount used by GitHub Actions to deploy the Atlas Helm chart
# into the workload cluster. Its long-lived token is rendered into a
# kubeconfig and stored as the KUBECONFIG GitHub Environment secret on
# the `production` environment.
#
# RBAC is cluster-admin. The chart provisions cluster-scoped resources
# (CNPG Cluster CRs are namespaced, but ESO ClusterSecretStore lookups
# and the platform charts the deployer maintains in steady state aren't),
# and the platform bootstrap (cert-manager / ingress-nginx / external-dns
# / ESO / cnpg) lives behind the same SA. Once the platform is stable
# we can carve a tighter role. Until then the deployer's blast radius
# is no wider than the charts it installs.

apiVersion: v1
kind: Namespace
metadata:
  name: atlas-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: atlas-production
---
# k8s ≥1.24 stopped auto-creating SA token Secrets — create one explicitly
# so we get a stable, long-lived token to embed in the CI kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  namespace: atlas-production
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-github-actions-deployer
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: atlas-production
