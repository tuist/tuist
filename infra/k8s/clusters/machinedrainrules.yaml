# Cluster API drain behaviour for Tuist runner Pods.
#
# A runner Pod is running a customer's CI job. Cluster API's default
# drain behaviour is to *evict* Pods, which kills those jobs — the
# customer sees the "lost communication" failure — every time a Machine
# is replaced: a template roll, a MachineHealthCheck remediation, a
# scale-down. There is no PodDisruptionBudget in `tuist-runners`, and a
# PDB could not express this correctly anyway (see below).
#
# `WaitCompleted` replaces eviction with waiting. Cluster API leaves the
# Pod alone and holds the drain until the Pod reaches a terminal phase.
# That fits the runner shape exactly: a runner Pod is single-shot
# (`RestartPolicy: Never`, one `workflow_job`, then exit), so a Pod
# running a job completes on its own and the drain proceeds — bounded by
# the job's own duration rather than by a disruption budget.
#
# This alone would never converge, and the other half lives in the
# controller. An *idle* runner Pod is a dispatch poller with nothing to
# finish: it polls for as long as it exists, so `WaitCompleted` would
# wait on it forever. The cordon that starts a drain stops new Pods
# landing but does not remove the ones already bound, so nothing else
# clears them either. `reapIdlePodsOnCordonedNodes` in
# `infra/runners-controller/controllers/node_drain.go` retires idle Pods
# on a draining node — free to do, since no customer work is attached —
# leaving only job-running Pods, each of which completes and releases
# the drain.
#
# Why not a PodDisruptionBudget: a PDB selects on labels, and the only
# "this Pod has claimed a job" label — `tuist.dev/runner-pool-owner` —
# is best-effort. The server degrades to running the job *without* the
# label rather than dropping the job when the apiserver patch fails, so
# a label-keyed PDB would evict exactly the jobs it exists to protect.
# The controller-side reap reads `isIdle`, which also treats a
# terminated `poller` init container as proof of a claim and therefore
# holds when the label never landed.
#
# `machines` is deliberately omitted: the rule then applies to every
# Machine in this namespace, which is where every environment's Machines
# live. Runner Pods should survive a drain regardless of which cluster,
# pool, or operating system hosts them, so scoping this to the
# bare-metal Linux pools would leave the same defect in place for the
# macOS fleet.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDrainRule
metadata:
  name: runner-jobs-wait-completed
  namespace: org-tuist
spec:
  drain:
    behavior: WaitCompleted
  pods:
    - selector:
        matchLabels:
          tuist.dev/runner: "true"
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tuist-runners
