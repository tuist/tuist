# Canary workload Cluster, topology mode against tuist-hcloud.
# Mirrors staging shape, plus a small Kura pool so the canary-only
# managed Kura region exposed in account settings can actually schedule.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: tuist-canary
  namespace: org-tuist
spec:
  clusterNetwork:
    services:
      cidrBlocks:
        - 10.128.0.0/12
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    serviceDomain: cluster.local
  topology:
    classRef:
      name: tuist-hcloud
    version: v1.34.6
    controlPlane:
      replicas: 3
    variables:
      - name: region
        value: fsn1
      - name: hcloudControlPlaneMachineType
        value: cpx32
      # Roll out the kubeadm compatibility fallback in canary first. With the
      # local-mode feature enabled, new control-plane kubelets point at their
      # own not-yet-running control-plane endpoint and never start the etcd
      # learner.
      - name: disableControlPlaneKubeletLocalMode
        value: true
      - name: hcloudWorkerMachineType
        value: cpx32
      - name: hcloudSSHKeyName
        value:
          - name: tuist-ops
      # The kubelet must expose the real systemd-resolved resolver file to
      # pods, not Ubuntu's loopback stub at /etc/resolv.conf.
      - name: workerResolvConf
        value: /run/systemd/resolve/resolv.conf
      # Scopes bare-metal HBM claims to this cluster (see the
      # `HetznerBareMetalMachineTemplateClusterSelector` patch in
      # `clusterclass-tuist.yaml`). Matches the `--clusters` entry
      # on the `hetzner-robot-controller` Deployment and the
      # cluster prefix in the Robot panel server name
      # (`tuist-bm-canary-…`).
      - name: bareMetalCluster
        value: canary
      # Insert InternalIP so the apiserver can reach kubelets on nodes with no
      # ExternalIP and an unresolvable Hostname (the Scaleway Elastic Metal kura
      # node + the macOS-PN fleet) for `kubectl logs`/`exec`. Flipping this
      # re-renders the apiserver patch and rolls this cluster's control plane.
      - name: kubeletPreferredAddressTypes
        value: ExternalIP,InternalIP,Hostname,InternalDNS,ExternalDNS
    workers:
      machineDeployments:
        - class: hcloud-worker
          name: md-0
          replicas: 2
          failureDomain: fsn1
          rollout:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
        # Stable-egress gateway pool (HA, ≥2 nodes) — mirrors prod/staging so the
        # failover controller + cutover are exercised in the deployment cascade
        # before production. Nodes self-apply the candidate label; the controller
        # keeps the Floating IP + active label on one Ready node.
        - class: hcloud-worker
          name: md-egress
          replicas: 2
          failureDomain: fsn1
          rollout:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
          metadata:
            labels:
              node.cluster.x-k8s.io/pool: egress
          # HA floor for the 2-node egress gateway pool. Overrides the
          # hcloud-worker class default (unhealthyInRange "[0-2]", which permits
          # remediating BOTH nodes at once). Never auto-remediate the whole pair:
          # a single bad node is replaced, but if both go unhealthy the cause is
          # almost always systemic (control-plane blip, network partition), so
          # CAPI holds and pages instead of deleting the pool — the failure that
          # left canary with no egress gateway on 2026-07-30, when both nodes
          # were remediated and an expired CAPI webhook then blocked recreation.
          healthCheck:
            remediation:
              triggerIf:
                unhealthyInRange: "[0-1]"
              # Belt-and-suspenders: even within range, only one replacement in
              # flight so a rolling remediation always keeps a gateway serving.
              maxInFlight: 1
          variables:
            overrides:
              - name: hcloudWorkerMachineType
                value: cpx32
              - name: workerNodeLabels
                value: tuist.dev/stable-egress-candidate=server
              # Isolate the gateway pool: only cilium, hcloud-csi, the egress
              # host-configurer and the (tolerating) monitoring agents run here.
              # Keeps ingress-nginx/CoreDNS/Redis off these 4 GB nodes so they
              # can't OOM the egress gateway.
              - name: workerNodeTaints
                value: tuist.dev/stable-egress=true:NoSchedule
        # Linux runner pool on Hetzner Robot bare metal. The
        # `hetzner-robot-controller` reflects `tuist-bm-canary-*`
        # Robot servers into HBM CRs stamped
        # `tuist.dev/cluster=canary`; caph claims them through the
        # patched HBMM hostSelector. Each node ends up labeled
        # `node.cluster.x-k8s.io/pool=runners-linux` +
        # `tuist.dev/kata-runtime=true` and tainted
        # `tuist.dev/runner-tier=bare-metal:NoSchedule`.
        #
        # Host count is operator-managed: order another
        # `tuist-bm-canary-*` server in the Robot panel and bump
        # `replicas:` here to grow capacity.
        - class: bare-metal-worker
          name: runners-linux
          failureDomain: fsn1
          metadata:
            labels:
              node.cluster.x-k8s.io/pool: runners-linux
              # See cluster-staging.yaml for the rationale — keeps
              # bare-metal Nodes out of HCCM's LB target set so a
              # bad providerID can't break the ingress.
              node.kubernetes.io/exclude-from-external-load-balancers: ""
