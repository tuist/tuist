# Production workload Cluster, topology mode against tuist-hcloud.
# Three worker pools: md-0 general (ccx23, dedicated vCPU for the
# Phoenix server's predictable p99 latency), md-processor (cpx62
# shared-vCPU, 16 vCPU / 32 GiB each, optimized for xcactivitylog
# parsing throughput-per-euro), and kura (ccx13 dedicated vCPU for
# Kura cache replicas). Pool labels propagate from MachineDeployment
# metadata to nodes via CAPI's machine-to-node label sync (only the
# node-role.kubernetes.io/, node-restriction.kubernetes.io/, and
# node.cluster.x-k8s.io/ prefixes are allowed through).
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: tuist
  namespace: org-tuist
spec:
  clusterNetwork:
    services:
      cidrBlocks:
        - 10.128.0.0/12
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    serviceDomain: cluster.local
  topology:
    classRef:
      name: tuist-hcloud
    version: v1.34.6
    controlPlane:
      replicas: 3
    variables:
      - name: region
        value: fsn1
      - name: hcloudControlPlaneMachineType
        value: cpx22
      # Default for pools without an override (md-0).
      - name: hcloudWorkerMachineType
        value: ccx23
      - name: hcloudSSHKeyName
        value:
          - name: tuist-ops
      # The kubelet must expose the real systemd-resolved resolver file to
      # pods, not Ubuntu's loopback stub at /etc/resolv.conf.
      - name: workerResolvConf
        value: /run/systemd/resolve/resolv.conf
      # Scopes bare-metal HBM claims to this cluster (see the
      # `HetznerBareMetalMachineTemplateClusterSelector` patch in
      # `clusterclass-tuist.yaml`). Matches the `--clusters` entry
      # on the `hetzner-robot-controller` Deployment and the
      # cluster prefix in the Robot panel server name
      # (`tuist-bm-production-…`).
      - name: bareMetalCluster
        value: production
      # Declared in every cluster, including those with no stateful pool. See
      # the variable's definition in `clusterclass-tuist.yaml`: a defaulted
      # ClusterClass variable left implicit here makes the post-apply drift
      # check in `mgmt-cluster-apply.yml` fail permanently.
      #
      # 10 rather than the default 1, and this has to be right before the
      # ClickHouse host's first rescue boot rather than after it: installimage
      # applies the level across the whole disk set, and the partition layout
      # is fixed at install. The production box carries four disks, so level 1
      # there is a four-way mirror — 3.84 TB of usable space instead of 7.68,
      # on a machine bought for its disk — and the only way back is a
      # reinstall. Canary's two-disk AX42-1 keeps 1, where the two levels mean
      # the same thing.
      - name: statefulRaidLevel
        value: 10
      # Insert InternalIP so the apiserver can reach kubelets on nodes with no
      # ExternalIP and an unresolvable Hostname (the Scaleway Elastic Metal kura
      # node + the macOS-PN fleet) for `kubectl logs`/`exec`. Flipping this
      # re-renders the apiserver patch and rolls this cluster's control plane.
      - name: kubeletPreferredAddressTypes
        value: ExternalIP,InternalIP,Hostname,InternalDNS,ExternalDNS
      # Codify the fallback used to restore production after validation in
      # canary and staging. New control-plane kubelets bootstrap through the
      # load-balanced endpoint until their local endpoint is available.
      - name: disableControlPlaneKubeletLocalMode
        value: true
    workers:
      machineDeployments:
        # ClickHouse's own pool: bare metal, tainted so nothing else lands on
        # it, with the database's data on the host's XFS `/data` behind a local
        # PV. The `stateful-worker` class and this whole layout were exercised
        # on staging first, which is the same cascade every deploy follows.
        #
        # replicas 0 until the machines are ordered. Declaring the pool with no
        # replicas creates the MachineDeployment and its templates and claims
        # no host, so this is inert until someone raises the count, and raising
        # it is then the only cluster-side step. A replica with no host to claim
        # would not wedge anything either — caph parks the Machine as
        # `NoAvailableHost` — but zero keeps it obvious that nothing is
        # expected yet.
        #
        # `statefulRaidLevel` is 10 here, set above, and has to be right
        # before this host's first rescue boot: installimage applies the level
        # across the whole disk set, the layout is fixed at install, and level
        # 1 on a four-disk box is a four-way mirror rather than a pair of
        # mirrors striped.
        #
        # PREREQ: the Robot server must be named `tuist-bm-production-ch-1` so
        # `hetzner-robot-controller` reflects it as a HetznerBareMetalHost
        # stamped for this cluster.
        - class: stateful-worker
          name: md-clickhouse
          replicas: 0
          metadata:
            labels:
              node.cluster.x-k8s.io/pool: clickhouse
        # General-purpose pool: Phoenix server, redis, system DaemonSets,
        # plus the 3-instance CloudNativePG cluster — its hard pod
        # anti-affinity (`topologyKey: kubernetes.io/hostname,
        # podAntiAffinityType: required`) needs one CNPG instance per
        # host, so the pool size has to match the configured instance
        # count to avoid leaving a CNPG pod permanently Pending.
        - class: hcloud-worker
          name: md-0
          replicas: 3
          failureDomain: fsn1
          rollout:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
          metadata:
            labels:
              node.cluster.x-k8s.io/pool: general
        # Dedicated stable-egress gateway pool (HA, ≥2 nodes). The Phoenix
        # server's public egress is SNAT'd through the active node's Hetzner
        # Floating IP by the CiliumEgressGatewayPolicy in the platform chart.
        # Every node here self-applies the candidate label
        # `tuist.dev/stable-egress-candidate=server` at kubelet registration
        # via `workerNodeLabels` (survives MachineHealthCheck remediation,
        # unlike CAPI metadata-label sync). The stable-egress failover
        # controller picks one Ready candidate as active — moving the Floating
        # IP (Hetzner API) and the active `tuist.dev/stable-egress-gateway`
        # label together — and fails over to the other on node loss. The
        # host-configurer DaemonSet configures eth0 on the active node.
        #
        # An outage on 2026-06-14 traced to this binding being a single
        # hand-labelled node: it got remediated, neither the label nor the IP
        # migrated, and server egress black-holed. Two candidates + automated
        # failover removes both the SPOF and the manual runbook.
        - class: hcloud-worker
          name: md-egress
          replicas: 2
          failureDomain: fsn1
          rollout:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
          metadata:
            labels:
              node.cluster.x-k8s.io/pool: egress
          # HA floor for the 2-node egress gateway pool. Overrides the
          # hcloud-worker class default (unhealthyInRange "[0-2]", which permits
          # remediating BOTH nodes at once). Never auto-remediate the whole pair:
          # a single bad node is replaced, but if both go unhealthy the cause is
          # almost always systemic (control-plane blip, network partition), so
          # CAPI holds and pages instead of deleting the pool — the failure mode
          # behind the 2026-07-30 canary outage, which is fleet-wide (this pool
          # backs customer egress-allowlist IPs in production).
          healthCheck:
            remediation:
              triggerIf:
                unhealthyInRange: "[0-1]"
              # Belt-and-suspenders: even within range, only one replacement in
              # flight so a rolling remediation always keeps a gateway serving.
              maxInFlight: 1
          variables:
            overrides:
              # Forwards/SNATs server egress only — runs no application
              # workload, so it doesn't need the general pool's dedicated
              # vCPU shape.
              - name: hcloudWorkerMachineType
                value: cpx22
              - name: workerNodeLabels
                value: tuist.dev/stable-egress-candidate=server
              # Isolate the gateway pool: only cilium, hcloud-csi, the egress
              # host-configurer and the (tolerating) monitoring agents run here.
              # Keeps ingress-nginx/CoreDNS/Redis off these nodes so they can't
              # OOM the egress gateway that serves customer allowlist IPs.
              - name: workerNodeTaints
                value: tuist.dev/stable-egress=true:NoSchedule
        # Dedicated processor pool: xcactivitylog parsing.
        # CA annotations declared here propagate to the rendered
        # MachineDeployment via topology mode. Without them the
        # classRef swap to tuist-hcloud would re-render the MD
        # without the autoscaler bounds, dropping cluster-autoscaler's
        # node-group registration mid-flight.
        #
        # `replicas` is deliberately UNSET on this pool (spec/72 footgun):
        # it is autoscaled between the min/max annotations below, and CAPI's
        # topology controller only manages replicas when the field is
        # present. Under Flux (10-min reconcile) a pinned `replicas` would
        # be re-asserted on every sync and fight cluster-autoscaler; leaving
        # it unset lets CAPI default within [min,max] and hands replica
        # control to the autoscaler (see the CAPI Autoscaling docs). Before
        # enabling the production Flux Kustomization, confirm the live MD's
        # replicas are preserved:
        #   kubectl -n org-tuist get md tuist-md-processor \
        #     -o jsonpath='{.spec.replicas}{"\n"}{.metadata.annotations}'
        - class: hcloud-worker
          name: md-processor
          failureDomain: fsn1
          rollout:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
          metadata:
            labels:
              node.cluster.x-k8s.io/pool: processor
            annotations:
              cluster.x-k8s.io/cluster-autoscaler-node-group-min-size: "2"
              cluster.x-k8s.io/cluster-autoscaler-node-group-max-size: "6"
          variables:
            overrides:
              - name: hcloudWorkerMachineType
                value: cpx62
        # US East / US West Kura capacity moved off Hetzner to OVH bare-metal
        # boxes (Vint Hill VA / Hillsboro OR), provisioned as the kura-us-east /
        # kura-us-west fleets in the tuist chart (ovhFleets) and self-joined via
        # the CAPI provider — they are no longer Hetzner worker pools here, so the
        # region catalog reports no Hetzner location for them.
