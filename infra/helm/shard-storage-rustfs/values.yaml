# No resources or workflow integration until explicitly enabled.
enabled: false
image: rustfs/rustfs:1.0.6
existingSecret: rustfs-root
storageClass: hcloud-volumes
volumeSize: 10Gi
nodeSelector:
  node.cluster.x-k8s.io/pool: general
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
gateway:
  image: nginxinc/nginx-unprivileged:1.28-alpine
ingress:
  enabled: false
  className: nginx
  controllerNamespace: platform
  host: ""
  tlsSecret: ""
  # Leave empty when an operator already provisioned the TLS Secret.
  clusterIssuer: ""
