{{- if .Values.enabled }}
{{- range .Values.gateway.buckets }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" .) }}
{{- fail (printf "gateway.buckets entry %q must be a lowercase bucket name without dots" .) }}
{{- end }}
{{- end }}
{{- if not .Values.gateway.buckets }}
{{- fail "gateway.buckets must name at least one bucket" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway
data:
  {{- include "rustfs.gatewayConfig" . | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: gateway
      annotations:
        # nginx reads its config only at start, so a config change rolls the pods.
        checksum/config: {{ include "rustfs.gatewayConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Release.Name }}
                  component: gateway
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: {{ .Values.gateway.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector:
    app: {{ .Release.Name }}
    component: gateway
  ports:
    - name: http
      port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  minAvailable: {{ max 0 (sub (int .Values.gateway.replicas) 1) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: gateway
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- include "rustfs.streamingIngressAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tlsSecret is required" .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.gateway.buckets }}
          - path: /{{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-gateway
                port: {number: 8080}
          {{- end }}
{{- end }}
{{- end }}
