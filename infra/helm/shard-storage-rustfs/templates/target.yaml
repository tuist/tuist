{{- if and .Values.enabled .Values.target.id }}
{{- $public := and .Values.ingress.enabled .Values.ingress.host }}
{{- if not (and .Values.generateCredentials (or $public .Values.runnerEntrances)) }}
{{- fail "target.id needs generateCredentials and a public ingress host or runnerEntrances" }}
{{- end }}
{{- if and .Values.target.privateNetworkReady (not .Values.privateNetwork.enabled) }}
{{- fail "target.privateNetworkReady needs privateNetwork.enabled" }}
{{- end }}
{{- if and .Values.runnerEntrances (not .Values.privateNetwork.enabled) }}
{{- fail "runnerEntrances need privateNetwork.enabled: the server reaches the store in-cluster" }}
{{- end }}
{{- if and .Values.actionsCache.bucket (le (int64 .Values.actionsCache.maxGB) 0) }}
{{- fail "actionsCache.bucket needs a maxGB quota" }}
{{- end }}
{{- $reader := printf "%s-target-reader" .Release.Name }}
{{- $inCluster := printf "http://%s-s3.%s.svc.cluster.local:9000" .Release.Name .Release.Namespace }}
{{- /* Without a public ingress the store is private: the server and the runners
  its entrances admit are its only callers. */}}
{{- $config := dict
  "access" (ternary "public" "private" (not (empty $public)))
  "site" .Values.target.site
  "enabled" true
  "private_network_ready" (and .Values.privateNetwork.enabled .Values.target.privateNetworkReady)
  "endpoint" (ternary (printf "https://%s" .Values.ingress.host) $inCluster (not (empty $public)))
  "region" "us-east-1"
  "bucket" "shards"
  "access_key_id" "{{ .access_key_id }}"
  "secret_access_key" "{{ .secret_access_key }}" }}
{{- if .Values.privateNetwork.enabled }}
{{- if $public }}
{{- $_ := set $config "private_endpoint" $inCluster }}
{{- end }}
{{- with .Values.archiveBucket }}
{{- $_ := set $config "archive_bucket" . }}
{{- $_ := set $config "archive_budget_bytes" (mul (int64 $.Values.archiveBudgetGiB) 1073741824) }}
{{- $_ := set $config "archive_capacity" "rustfs" }}
{{- end }}
{{- with .Values.actionsCache.bucket }}
{{- $_ := set $config "actions_cache_bucket" . }}
{{- $_ := set $config "actions_cache_bytes" (mul (int64 $.Values.actionsCache.maxGB) 1000000000) }}
{{- end }}
{{- end }}
{{- /* Every entrance at once: a plan placed at the store's site is read by shard
  jobs at whichever site claims them, so publishing one site's entrance alone
  would fail the others' reads. */}}
{{- if and .Values.runnerEntrances .Values.target.runnerEntrancesReady }}
{{- $endpoints := dict }}
{{- range .Values.runnerEntrances }}
{{- $_ := set $endpoints .site (printf "https://%s" .host) }}
{{- end }}
{{- $_ := set $config "runner_endpoints" $endpoints }}
{{- end }}
{{- $targets := dict .Values.target.id $config }}
{{- range .Values.target.aliases }}
{{- if not $.Values.privateNetwork.enabled }}
{{- fail "target.aliases needs privateNetwork.enabled" }}
{{- end }}
{{- /* A retired store's ID, whose objects were copied here: rows that name it
  resolve to the same buckets in-cluster, and it never takes placements. */}}
{{- $alias := merge (dict "access" "private" "endpoint" $inCluster "private_network_ready" false) (omit $config "access" "endpoint" "private_endpoint" "private_network_ready") }}
{{- $_ := set $targets . $alias }}
{{- end }}
# Publishes this store to the server as Secret <release>-targets (key
# targets.json) in serverNamespace, copied from the service Secret through a
# SecretStore that may only get that one Secret. The ID is immutable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ .Values.serverNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $reader }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - {{ printf "%s-service" .Release.Name | quote }}
      {{- if .Values.dockerMirror.bucket }}
      - {{ printf "%s-docker-mirror-service" .Release.Name | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $reader }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $reader }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ .Values.serverNamespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $reader }}
  namespace: {{ .Values.serverNamespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $reader }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-targets
  namespace: {{ .Values.serverNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $reader }}
  target:
    name: {{ .Release.Name }}-targets
    template:
      engineVersion: v2
      data:
        targets.json: {{ $targets | toJson | quote }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: {{ .Release.Name }}-service
        property: access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: {{ .Release.Name }}-service
        property: secret-access-key
{{- if .Values.dockerMirror.bucket }}
---
# The Docker Hub mirror's credentials for the main chart's registryCache, as
# Secret <release>-docker-mirror (keys access-key-id, secret-access-key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-docker-mirror
  namespace: {{ .Values.serverNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $reader }}
  target:
    name: {{ .Release.Name }}-docker-mirror
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ .Release.Name }}-docker-mirror-service
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: {{ .Release.Name }}-docker-mirror-service
        property: secret-access-key
{{- end }}
{{- end }}
