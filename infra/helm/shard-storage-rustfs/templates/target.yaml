{{- if and .Values.enabled .Values.target.id }}
{{- if not (and .Values.generateCredentials .Values.ingress.enabled .Values.ingress.host) }}
{{- fail "target.id needs generateCredentials and a public ingress host" }}
{{- end }}
{{- $reader := printf "%s-target-reader" .Release.Name }}
{{- $config := dict
  "access" "public"
  "site" .Values.target.site
  "enabled" true
  "private_network_ready" false
  "endpoint" (printf "https://%s" .Values.ingress.host)
  "region" "us-east-1"
  "bucket" "shards"
  "access_key_id" "{{ .access_key_id }}"
  "secret_access_key" "{{ .secret_access_key }}" }}
# Publishes this store to the server as Secret <release>-targets (key
# targets.json) in serverNamespace, copied from the service Secret through a
# SecretStore that may only get that one Secret. The ID is immutable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ .Values.serverNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $reader }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-service" .Release.Name | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $reader }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $reader }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ .Values.serverNamespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $reader }}
  namespace: {{ .Values.serverNamespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $reader }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-targets
  namespace: {{ .Values.serverNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $reader }}
  target:
    name: {{ .Release.Name }}-targets
    template:
      engineVersion: v2
      data:
        targets.json: {{ dict .Values.target.id $config | toJson | quote }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: {{ .Release.Name }}-service
        property: access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: {{ .Release.Name }}-service
        property: secret-access-key
{{- end }}
