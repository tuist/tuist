{{- if and .Values.enabled .Values.generateCredentials }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Release.Name }}-seed
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# RustFS keeps the root and service credentials it was set up with, so both
# Secrets are created once and never refreshed or owned by this release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        root-user: rustfs-admin
        root-password: '{{ `{{ .password }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-seed
---
# The restricted user the server signs shard URLs with. Separate from the root
# Secret so the target reader in the server namespace never sees root.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-service
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Release.Name }}-service
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        access-key-id: {{ .Release.Name }}-shards
        secret-access-key: '{{ `{{ .password }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-seed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-setup
data:
  lifecycle.json: |
    {"Rules":[{"ID":"shard-retention","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":{{ int .Values.setup.expirationDays }}},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":{{ int .Values.setup.abortMultipartDays }}}}]}
  policy.json: |
    {{- .Files.Get "shards-policy.json" | fromJson | toJson | nindent 4 }}
---
# Creates the shards bucket, its expiry and the restricted user, and reapplies
# them hourly: every step is idempotent, and a recreated bucket recovers.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-setup
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}
            component: setup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: setup
              image: {{ .Values.setup.image | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export MC_HOST_admin="http://$ROOT_USER:$ROOT_PASSWORD@{{ .Release.Name }}-s3:9000"
                  mc mb --ignore-existing admin/shards
                  mc ilm import admin/shards </setup/lifecycle.json
                  mc admin policy create admin shard-artifacts /setup/policy.json
                  # On stdin, so the key is not in the process arguments.
                  printf '%s\n%s\n' "$SERVICE_USER" "$SERVICE_PASSWORD" | mc admin user add admin
                  mc admin policy attach admin shard-artifacts --user "$SERVICE_USER" ||
                    mc admin user info admin "$SERVICE_USER" | grep -q shard-artifacts
              env:
                - name: HOME
                  value: /tmp
                - name: MC_CONFIG_DIR
                  value: /tmp/mc
                - name: ROOT_USER
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: root-user}}
                - name: ROOT_PASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: root-password}}
                - name: SERVICE_USER
                  valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-service, key: access-key-id}}
                - name: SERVICE_PASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-service, key: secret-access-key}}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: setup
                  mountPath: /setup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: setup
              configMap:
                name: {{ .Release.Name }}-setup
            - name: tmp
              emptyDir: {}
{{- end }}
