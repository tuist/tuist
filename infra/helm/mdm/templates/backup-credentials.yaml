{{- /*
MDM's own Tigris key, scoped by an IAM policy to the `mdm/` prefix of the
backup bucket (infra/mdm/README.md "Backup key"). Never the shared
S3_BACKUP_CREDENTIALS: the server archives to the bucket root with it, so it
reads and deletes customer Postgres backups.
*/}}
{{- if .Values.postgresql.backup.enabled }}
{{- if eq .Values.postgresql.backup.credentialsItem "S3_BACKUP_CREDENTIALS" }}
{{- fail "postgresql.backup.credentialsItem must be this app's own prefix-scoped key, never S3_BACKUP_CREDENTIALS (it can read and delete the server's backups)" }}
{{- end }}
{{- if not (hasSuffix "/mdm" (trimSuffix "/" .Values.postgresql.backup.destinationPath)) }}
{{- fail "postgresql.backup.destinationPath must be the mdm/ prefix its key is scoped to" }}
{{- end }}
{{- if .Values.runtimeSecrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.backup.credentialsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-backup
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresql.backup.credentialsSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: '{{ `{{ .access_key_id | trim }}` }}'
        ACCESS_SECRET_KEY: '{{ `{{ .secret_access_key | trim }}` }}'
  dataFrom:
    - extract:
        key: {{ .Values.postgresql.backup.credentialsItem | quote }}
{{- end }}
{{- end }}
