{{- if .Values.postgresql.backup.enabled }}
{{- if .Values.runtimeSecrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.backup.credentialsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-backup
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresql.backup.credentialsSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: '{{ `{{ .access_key_id | trim }}` }}'
        ACCESS_SECRET_KEY: '{{ `{{ .secret_access_key | trim }}` }}'
  dataFrom:
    - extract:
        key: S3_BACKUP_CREDENTIALS
{{- end }}
{{- end }}
