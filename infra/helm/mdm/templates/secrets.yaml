{{- $fullname := include "mdm.fullname" . -}}
{{- if .Values.runtimeSecrets.externalSecret.enabled }}
{{- $item := .Values.runtimeSecrets.externalSecret.item -}}
{{- /* All fields come from one 1Password item in the env's vault.
Required fields reference the item field directly so a missing field
fails the sync visibly; fields that only exist after a manual ceremony
(push topic, account hash, bootstrap pkg) default to empty. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $fullname }}-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        nanomdm-api-key: '{{ `{{ index . "nanomdm-api-key" | trim }}` }}'
        nanodep-api-key: '{{ `{{ index . "nanodep-api-key" | trim }}` }}'
        scep-challenge: '{{ `{{ index . "scep-challenge" | trim }}` }}'
        push-topic: '{{ `{{ index . "push-topic" | default "" | trim }}` }}'
        enroll-token: '{{ `{{ index . "enroll-token" | default "" | trim }}` }}'
        svc-account-password-hash-b64: '{{ `{{ index . "svc-account-password-hash-b64" | default "" | trim }}` }}'
  dataFrom:
    - extract:
        key: {{ $item | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-scep-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $fullname }}-scep-ca
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca.pem: '{{ `{{ index . "scep-ca-cert-pem" | trim }}` }}'
        ca.key: '{{ `{{ index . "scep-ca-key-pem" | trim }}` }}'
  dataFrom:
    - extract:
        key: {{ $item | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-assets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $fullname }}-assets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        bootstrap.pkg.b64: '{{ `{{ index . "bootstrap-pkg-b64" | default "" | trim }}` }}'
  dataFrom:
    - extract:
        key: {{ $item | quote }}
{{- else }}
{{- $inline := .Values.runtimeSecrets.inline -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-runtime
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
type: Opaque
stringData:
  nanomdm-api-key: {{ required "runtimeSecrets.inline.nanomdmAPIKey is required without ESO" $inline.nanomdmAPIKey | quote }}
  nanodep-api-key: {{ required "runtimeSecrets.inline.nanodepAPIKey is required without ESO" $inline.nanodepAPIKey | quote }}
  scep-challenge: {{ required "runtimeSecrets.inline.scepChallenge is required without ESO" $inline.scepChallenge | quote }}
  push-topic: {{ $inline.pushTopic | quote }}
  enroll-token: {{ $inline.enrollToken | quote }}
  svc-account-password-hash-b64: {{ $inline.svcAccountPasswordHashB64 | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-scep-ca
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.pem: {{ required "runtimeSecrets.inline.scepCACertPEM is required without ESO" $inline.scepCACertPEM | quote }}
  ca.key: {{ required "runtimeSecrets.inline.scepCAKeyPEM is required without ESO" $inline.scepCAKeyPEM | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-assets
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap.pkg.b64: {{ $inline.bootstrapPkgB64 | quote }}
{{- end }}
