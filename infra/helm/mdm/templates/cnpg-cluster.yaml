{{- /*
CNPG cluster shared by nanomdm and nanodep (their pgsql schemas have no
overlapping objects). The NanoMDM/NanoDEP schema files are vendored
under files/schema/ from the pinned upstream tags and applied once at
initdb via postInitApplicationSQLRefs; upstream pgsql schema changes
are rare and land as manual migrations documented in infra/mdm/README.md.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mdm.pgClusterName" . }}-init-sql
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  01-nanomdm.sql: |
{{ .Files.Get "files/schema/nanomdm-pgsql-schema.sql" | indent 4 }}
  02-nanodep.sql: |
{{ .Files.Get "files/schema/nanodep-pgsql-schema.sql" | indent 4 }}
  # Rendered rather than read from files/ so the role always matches
  # .Values.postgresql.owner. Hardcoding it meant overriding the owner
  # produced an initdb script referencing a role that does not exist,
  # and the cluster would never finish bootstrapping.
  03-grants.sql: |
    -- The schema files above run as the superuser at initdb, so the
    -- objects are postgres-owned; grant the application role what it
    -- needs.
    GRANT ALL ON ALL TABLES IN SCHEMA public TO {{ .Values.postgresql.owner }};
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO {{ .Values.postgresql.owner }};
---
{{- if and .Values.postgresql.backup.enabled (not .Values.runtimeSecrets.externalSecret.enabled) }}
{{- fail "postgresql.backup.enabled requires runtimeSecrets.externalSecret.enabled: the barman ObjectStore references a credentials Secret that only the ExternalSecret path creates, and CNPG would wait on it forever while WAL archiving stalls" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "mdm.pgClusterName" . }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  instances: {{ .Values.postgresql.instances }}
  imageName: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
  primaryUpdateStrategy: unsupervised

  {{- with .Values.postgresql.parameters }}
  postgresql:
    parameters:
      {{- range $key, $value := . }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.postgresql.database | quote }}
      owner: {{ .Values.postgresql.owner | quote }}
      encoding: UTF8
      localeCType: C
      localeCollate: C
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: {{ include "mdm.pgClusterName" . }}-init-sql
            key: 01-nanomdm.sql
          - name: {{ include "mdm.pgClusterName" . }}-init-sql
            key: 02-nanodep.sql
          - name: {{ include "mdm.pgClusterName" . }}-init-sql
            key: 03-grants.sql

  storage:
    size: {{ .Values.postgresql.storageSize | quote }}
    {{- with .Values.postgresql.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.postgresql.resources | nindent 4 }}

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  {{- if .Values.postgresql.backup.enabled }}
  plugins:
    - name: {{ .Values.postgresql.backup.plugin.name | quote }}
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "mdm.pgClusterName" . }}-backup-store
        serverName: {{ include "mdm.pgClusterName" . | quote }}
  {{- end }}
{{- if .Values.postgresql.backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "mdm.pgClusterName" . }}-backup-store
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  retentionPolicy: {{ .Values.postgresql.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ required "postgresql.backup.destinationPath is required when backups are enabled" .Values.postgresql.backup.destinationPath | quote }}
    endpointURL: {{ .Values.postgresql.backup.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.postgresql.backup.credentialsSecretName }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.postgresql.backup.credentialsSecretName }}
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 8
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "mdm.pgClusterName" . }}-daily
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  # Daily at 03:20 UTC, offset from the other clusters' 03:00 so the
  # backup jobs do not all contend for the same upload window.
  schedule: "0 20 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: {{ .Values.postgresql.backup.plugin.name | quote }}
  cluster:
    name: {{ include "mdm.pgClusterName" . }}
{{- end }}
