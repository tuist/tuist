{{- if .Values.ingress.enabled }}
{{- $host := required "host is required when ingress.enabled is true" .Values.host -}}
{{- $fullname := include "mdm.fullname" . -}}
{{- /*
The public surface is exactly the paths a Mac fetches: enrollment
profile, SCEP, the MDM check-in endpoint, and the bootstrap package.
Devices reach these from home, office and colo, woken by Apple push, so
they have to be internet-facing.

Everything else stays off the internet. nanodep's API holds the ABM
OAuth tokens and nanomdm's /v1 can enqueue commands to every enrolled
machine; neither is ever called by a device, so both are published on
the tailnet by their Services instead. The enroller's /webhook is
cluster-internal and appears nowhere.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /mdm
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-nanomdm
                port: { number: 9000 }
          - path: /scep
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-scep
                port: { number: 8080 }
          - path: /enroll
            pathType: Exact
            backend:
              service:
                name: {{ $fullname }}-enroller
                port: { number: 9004 }
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-enroller
                port: { number: 9004 }
{{- end }}
