{{- $fullname := include "mdm.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-nanodep
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: nanodep
spec:
  replicas: {{ .Values.nanodep.replicaCount }}
  selector:
    matchLabels:
      {{- include "mdm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nanodep
  template:
    metadata:
      labels:
        {{- include "mdm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nanodep
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "mdm.podScheduling" . | nindent 6 }}
      containers:
        - name: depserver
          image: "{{ .Values.images.nanodep.repository }}:{{ .Values.images.nanodep.tag }}"
          imagePullPolicy: {{ .Values.images.nanodep.pullPolicy }}
          # Secrets by environment rather than argv; depserver maps
          # NANODEP_<FLAG> onto every flag.
          args:
            - -listen
            - :9001
            - -storage
            - pgsql
          env:
            - name: NANODEP_API
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-runtime
                  key: nanodep-api-key
            {{- include "mdm.storageDSNEnv" (dict "root" . "name" "NANODEP_STORAGE_DSN") | nindent 12 }}
          ports:
            - name: http
              containerPort: 9001
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.nanodep.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nanodep
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: nanodep
  {{- if .Values.tailnet.enabled }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.tailnet.nanodepHostname | quote }}
    tailscale.com/tags: {{ required "tailnet.tags is required when tailnet.enabled" .Values.tailnet.tags | quote }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9001
      targetPort: http
  selector:
    {{- include "mdm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nanodep
{{- if .Values.nanodep.syncer.enabled }}
---
{{- /* depsyncer polls Apple's DEP sync endpoint and auto-assigns the
stored assigner profile UUID to newly added devices. Same image and
storage as depserver, different entrypoint. */}}
{{- /*
Deliberately one replica and no probes, unlike the rest of the chart.
depsyncer holds a sync cursor per DEP name: a second replica would fetch
and assign the same devices twice. It also serves no HTTP, so there is
nothing for a readiness or liveness probe to ask — a crash-looping
syncer shows up as the pod restarting and as the absence of "device
sync" lines, not as an unready endpoint.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-depsyncer
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: depsyncer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mdm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: depsyncer
  template:
    metadata:
      labels:
        {{- include "mdm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: depsyncer
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "mdm.podScheduling" . | nindent 6 }}
      containers:
        - name: depsyncer
          image: "{{ .Values.images.nanodep.repository }}:{{ .Values.images.nanodep.tag }}"
          imagePullPolicy: {{ .Values.images.nanodep.pullPolicy }}
          command: ["/app/depsyncer"]
          # Unlike depserver, depsyncer does not read flags from the
          # environment upstream, so the DSN has to stay on the command
          # line here. Its password is the same one the depserver and
          # nanomdm pods hold, so this is the weakest link in that
          # treatment rather than an independent exposure.
          args:
            - -storage
            - pgsql
            - -storage-dsn
            - $(STORAGE_DSN)
            # depsyncer takes the DEP names to sync as trailing positional
            # arguments and exits non-zero without at least one.
            - {{ required "nanodep.depName is required" .Values.nanodep.depName | quote }}
          env:
            {{- include "mdm.storageDSNEnv" (dict "root" . "name" "STORAGE_DSN") | nindent 12 }}
          resources:
            {{- toYaml .Values.nanodep.resources | nindent 12 }}
{{- end }}
