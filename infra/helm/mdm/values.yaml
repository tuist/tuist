global:
  commonLabels: {}
  podLabels: {}
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

nameOverride: ""
fullnameOverride: ""

# Public hostnames. `host` is the device-facing MDM endpoint and is
# effectively immutable once devices enroll: the MDM protocol has no
# way to change an enrollment's ServerURL, so a hostname change means
# re-enrolling (DFU-reprovisioning) every device.
host: ""

# The operator-facing APIs — all of nanodep, and nanomdm's /v1 (push cert
# upload, enqueue, push) — are never called by a device and hold the ABM
# OAuth tokens and APNs push credentials. They are published on the
# tailnet rather than through the public ingress, the same way tuist-ops
# keeps its policy endpoint off the internet.
tailnet:
  enabled: false
  # Tag the Tailscale operator is permitted to mint in THIS cluster; it
  # follows the cluster, not the release (see the operator's defaultTags).
  tags: ""
  nanomdmHostname: mdm-api
  nanodepHostname: mdm-dep

ingress:
  enabled: true
  className: nginx
  tlsSecretName: mdm-tls
  annotations: {}

images:
  nanomdm:
    repository: ghcr.io/micromdm/nanomdm
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  nanodep:
    repository: ghcr.io/micromdm/nanodep
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  # Built from infra/mdm/scep (no upstream image exists); tag set by the
  # deploy workflow.
  scep:
    repository: ghcr.io/tuist/scepserver
    tag: ""
    pullPolicy: IfNotPresent
  # Built from infra/mdm/enroller; tag set by the deploy workflow.
  enroller:
    repository: ghcr.io/tuist/mdm-enroller
    tag: ""
    pullPolicy: IfNotPresent

nanomdm:
  replicaCount: 1
  # delete=1 removes acknowledged commands/results so the queue tables
  # do not grow forever.
  storageOptions: "delete=1"
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

nanodep:
  replicaCount: 1
  # The DEP name is the key every nanodep API path and token ceremony is
  # scoped by (/v1/tokenpki/<name>, /v1/assigner/<name>, the syncer's
  # positional argument). One ABM organization, one name.
  depName: tuist
  syncer:
    enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

scep:
  replicaCount: 1
  # Device identity certificate validity in days. Long-lived on purpose:
  # the fleet is reprovisioned by DFU restore, not kept alive for years,
  # and macOS does not renew the MDM identity on its own.
  certValidityDays: 3650
  # Days before expiry that re-issuing a certificate for an existing
  # subject is permitted; 0 means always. Re-enrolling a machine after a
  # DFU restore requests the same subject it had before (the subject is
  # derived from the hardware UUID), and at the upstream default of 14
  # the CA would refuse until the old certificate was nearly expired —
  # which, at the validity above, is a decade. Reprovisioning is the
  # fleet's routine recovery path, so it must never be gated on this.
  allowRenewDays: 0
  depotSize: 1Gi
  depotStorageClass: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

enroller:
  replicaCount: 1
  serviceAccount:
    shortName: tuist
    fullName: Tuist Runner Operator
  organization: Tuist
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Renewal alarms. Two of the three credentials this server depends on
# cannot be renewed by any API — Apple exposes none for the Push
# Certificates Portal or for Apple Business Manager — so the only
# available mitigation is being told early and reliably. Each one stops
# enrollment silently when it lapses: no error, no alert, devices simply
# never enroll again.
expiryCheck:
  enabled: false
  schedule: "0 9 * * *"
  # Days remaining at which to warn, and at which to also fail the job so
  # it surfaces as a failed CronJob even if Slack delivery is broken.
  warnDays: 60
  critDays: 14
  slack:
    # Channel to post to. Empty disables posting; the job still logs and
    # still fails on a critical threshold.
    channel: ""
    # 1Password item and field holding the bot token, referenced rather
    # than copied onto the MDM item so rotating it in one place is
    # enough. Needs chat:write for the channel above.
    tokenItem: TUIST_OPS_BOT
    tokenField: slack_bot_token
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgresql:
  clusterName: ""
  # Two instances, not one: CNPG's `<cluster>-primary` PDB makes a
  # single-instance cluster undrainable and wedges CAPI node drains
  # (see infra/helm/tuist-ops/values.yaml for the incident writeup).
  instances: 2
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.5"
  database: mdm
  owner: mdm
  storageSize: 5Gi
  storageClass: ""
  parameters: {}
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Losing this database does not stop enrolled machines working, but it
  # does lose the enrollment records that let the server address them —
  # and the only way back from that is DFU-reprovisioning every mini. Off
  # by default (a throwaway bench has nothing worth restoring); on for
  # any instance that owns real hardware.
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: https://t3.storage.dev
    retentionPolicy: "30d"
    credentialsSecretName: mdm-backup-credentials
    # Barman Cloud Plugin (CNPG-I); requires the plugin installed in the
    # operator namespace. See infra/cnpg/README.md.
    plugin:
      name: barman-cloud.cloudnative-pg.io

# Secrets. With externalSecret.enabled the three runtime Secrets are
# synced by ESO from a single 1Password item in the env's vault;
# otherwise they are rendered inline from the values below (CI /
# local-lint only — do not put real secrets in values files).
runtimeSecrets:
  externalSecret:
    enabled: false
    item: MDM
  inline:
    nanomdmAPIKey: ""
    nanodepAPIKey: ""
    scepChallenge: ""
    webhookHMACKey: ""
    pushTopic: ""
    enrollToken: ""
    svcAccountPasswordHashB64: ""
    scepCACertPEM: ""
    scepCAKeyPEM: ""
    bootstrapPkgB64: ""
