{{- $apiItem := required "credentials.omadaApiItem is required: the 1Password item holding the Open API client" .Values.credentials.omadaApiItem }}
{{- $accountItem := required "credentials.deviceAccountItem is required: the 1Password item holding the site's device account" .Values.credentials.deviceAccountItem }}
# The onepassword ClusterSecretStore fixes the vault, so a key is
# "<item>/<field>" with no property, as every other ExternalSecret here.
#
# Both are pre-install and pre-upgrade hooks so the Secrets exist before the
# Deployment's pod mounts them; otherwise the pod can sit in
# ContainerCreating past helm --atomic --wait and roll the release back.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rack-switch-controller-omada-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rack-switch-controller.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreRef.name }}
    kind: {{ .Values.credentials.secretStoreRef.kind }}
  target:
    name: rack-switch-controller-omada-api
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: "{{ $apiItem }}/client-id"
    - secretKey: client-secret
      remoteRef:
        key: "{{ $apiItem }}/client-secret"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rack-switch-controller-device-account
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rack-switch-controller.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreRef.name }}
    kind: {{ .Values.credentials.secretStoreRef.kind }}
  target:
    name: rack-switch-controller-device-account
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "{{ $accountItem }}/username"
    - secretKey: password
      remoteRef:
        key: "{{ $accountItem }}/password"
