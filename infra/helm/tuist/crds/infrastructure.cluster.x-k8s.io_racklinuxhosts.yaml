---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: racklinuxhosts.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
      - cluster-api
    kind: RackLinuxHost
    listKind: RackLinuxHostList
    plural: racklinuxhosts
    shortNames:
      - rlh
    singular: racklinuxhost
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.hostname
          name: Hostname
          type: string
        - jsonPath: .spec.role
          name: Role
          type: string
        - jsonPath: .status.provisioning.state
          name: State
          type: string
        - jsonPath: .status.tailnet.address
          name: Tailnet
          type: string
        - jsonPath: .status.tailnet.connected
          name: Connected
          type: boolean
        - jsonPath: .status.power.state
          name: Power
          type: string
        - jsonPath: .spec.location.site
          name: Site
          priority: 1
          type: string
        - jsonPath: .status.bootMAC
          name: BootMAC
          priority: 1
          type: string
        - jsonPath: .status.tailnet.deviceID
          name: Device
          priority: 1
          type: string
        - jsonPath: .status.install.keyID
          name: Install
          priority: 1
          type: string
        - jsonPath: .status.amt.controlMode
          name: AMT
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: RackLinuxHost is one x86 Linux machine in a rack we operate.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                RackLinuxHostSpec is one x86 Linux machine we own, in a rack we operate. It
                is named after the machine's SMBIOS UUID, so the object is the box whatever
                it is called; the name it runs under is spec.hostname. The host joins the
                tailnet by itself from its install, netbooted or from a stick, and the
                operator makes it a node through the CAPI Machine it keeps for it.
              properties:
                amt:
                  description: |-
                    AMT is what the operator does with the host's Intel AMT, which shares
                    the management port and can power a host whose OS is gone.
                  properties:
                    activate:
                      description: |-
                        Activate has the operator activate AMT in admin control mode, with the
                        fleet's provisioning certificate and an admin password it generates and
                        keeps in the Secret <name>-amt. Unset, the operator activates the AMT of
                        the hardware models the fleet lists (--rack-linux-amt-products).
                        Turning it off does not deactivate AMT.
                      type: boolean
                    address:
                      description: |-
                        Address is the static IPv4 address, with its prefix length, the
                        operator gives activated AMT on the management segment, so AMT keeps
                        one address whatever happens to the host. Unset, the operator takes
                        one from the fleet's AMT address range.
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                      type: string
                    gateway:
                      description: |-
                        Gateway is the segment's gateway, which a static address needs. Unset,
                        the fleet's is used.
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}$
                      type: string
                  type: object
                bootMAC:
                  description: |-
                    BootMAC is the MAC address of the NIC the host netboots from, on the
                    rack's management segment. Unset, the operator takes the one the
                    machine announced as its management port (status.bootMAC).
                  pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
                  type: string
                hostname:
                  description: |-
                    Hostname is the name the host runs under: its operating system's, its
                    tailnet device's and its Node's. Changing it rejoins the host under the
                    new name.
                  pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                  type: string
                location:
                  description: Location is where the box is. `site` composes the providerID.
                  properties:
                    positionU:
                      description: PositionU is the lowest rack unit the mount occupies.
                      type: integer
                    rack:
                      description: Rack identifies the rack within the site.
                      type: string
                    shelf:
                      description: |-
                        Shelf identifies the mount within the rack (a 3-up tray, in the BER1
                        build).
                      type: string
                    site:
                      description: |-
                        Site is the rack site (e.g. `ber1`). Load-bearing: it composes the
                        providerID, so it must be stable for the life of the host.
                      type: string
                  type: object
                node:
                  description: Node is what the host's Node registers with.
                  properties:
                    labels:
                      additionalProperties:
                        type: string
                      description: |-
                        Labels are registered on top of the labels every rack Linux node
                        carries.
                      type: object
                    taints:
                      description: Taints are registered with the Node.
                      items:
                        description: |-
                          The node this Taint is attached to has the "effect" on
                          any pod that does not tolerate the Taint.
                        properties:
                          effect:
                            description: |-
                              Required. The effect of the taint on pods
                              that do not tolerate the taint.
                              Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                            type: string
                          key:
                            description: Required. The taint key to be applied to a node.
                            type: string
                          timeAdded:
                            description: |-
                              TimeAdded represents the time at which the taint was added.
                              It is only written for NoExecute taints.
                            format: date-time
                            type: string
                          value:
                            description: The taint value corresponding to the taint key.
                            type: string
                        required:
                          - effect
                          - key
                        type: object
                      type: array
                  type: object
                online:
                  default: true
                  description: |-
                    Online is whether the host should be powered on. The operator powers it
                    on or off through AMT to match.
                  type: boolean
                reinstallGeneration:
                  description: |-
                    ReinstallGeneration reinstalls the host whenever it is raised above
                    status.provisioning.installedGeneration, which records the generation
                    the host's current install ran for.
                  format: int64
                  minimum: 0
                  type: integer
                role:
                  description: Role decides the disk layout the install lays down.
                  enum:
                    - edge
                    - services
                    - storage
                  type: string
                sshUser:
                  default: tuist
                  description: |-
                    SSHUser is the account the install creates, with the rack's fleet key
                    and passwordless sudo.
                  type: string
                tailnet:
                  description: Tailnet is the identity the host joins the tailnet as.
                  properties:
                    tags:
                      description: |-
                        Tags the host's device must carry, the tags its install key is minted
                        with. A device with the host's hostname and without all of them is not
                        this host.
                      items:
                        type: string
                      minItems: 1
                      type: array
                  required:
                    - tags
                  type: object
              required:
                - hostname
                - location
                - online
                - role
                - tailnet
              type: object
            status:
              description: RackLinuxHostStatus is the observed state of one host.
              properties:
                amt:
                  description: AMT is the host's Intel AMT as rpc reports it on the host.
                  properties:
                    activationError:
                      description: ActivationError is why that attempt failed.
                      type: string
                    address:
                      description: Address is AMT's own IPv4 address on the management port.
                      type: string
                    assignedAddress:
                      description: |-
                        AssignedAddress is the static address the operator gives AMT, with its
                        prefix length: spec.amt.address, or one from the fleet's range.
                      type: string
                    configurationError:
                      type: string
                    controlMode:
                      description: |-
                        ControlMode is AMT's activation state: pre-provisioning, client or
                        admin.
                      type: string
                    lastActivation:
                      description: LastActivation is when the operator last tried to activate AMT.
                      format: date-time
                      type: string
                    lastConfiguration:
                      description: |-
                        LastConfiguration is when the operator last configured activated AMT
                        (its MEBx password, its address), and ConfigurationError why that
                        failed.
                      format: date-time
                      type: string
                    lastPowerAction:
                      description: LastPowerAction is the last power change the operator asked AMT for.
                      properties:
                        action:
                          description: 'Action is on, off, or a tuist.dev/reboot value: cycle, reset or pxe.'
                          type: string
                        at:
                          description: At is when the operator asked.
                          format: date-time
                          type: string
                        error:
                          description: Error is why the change was not made.
                          type: string
                        via:
                          description: Via is the host whose SSH session reached AMT.
                          type: string
                      required:
                        - action
                        - at
                      type: object
                    link:
                      description: 'Link is the wired link AMT sees on the management port: up or down.'
                      type: string
                    mebxPasswordSet:
                      description: |-
                        MEBxPasswordSet reports that the operator replaced MEBx's factory
                        password with the one it keeps in the host's AMT Secret.
                      type: boolean
                    observedAt:
                      description: ObservedAt is when the operator last read AMT's state.
                      format: date-time
                      type: string
                    uuid:
                      description: UUID is the machine's SMBIOS UUID as AMT reports it.
                      type: string
                    version:
                      description: Version is the AMT firmware's.
                      type: string
                  type: object
                bootMAC:
                  description: |-
                    BootMAC is the boot MAC in effect: spec.bootMAC, or the management port
                    the machine announced.
                  type: string
                conditions:
                  description: Conditions provide observations of the operational state of a Cluster API resource.
                  items:
                    description: Condition defines an observation of a Cluster API resource operational state.
                    properties:
                      lastTransitionTime:
                        description: |-
                          Last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed. If that is not known, then using the time when
                          the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A human readable message indicating details about the transition.
                          This field may be empty.
                        type: string
                      reason:
                        description: |-
                          The reason for the condition's last transition in CamelCase.
                          The specific API may choose whether or not this field is considered a guaranteed API.
                          This field may be empty.
                        type: string
                      severity:
                        description: |-
                          severity provides an explicit classification of Reason code, so the users or machines can immediately
                          understand the current situation and act accordingly.
                          The Severity field MUST be set only when Status=False.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: |-
                          type of condition in CamelCase or in foo.example.com/CamelCase.
                          Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                          can be useful (see .node.status.conditions), the ability to deconflict is important.
                        type: string
                    required:
                      - lastTransitionTime
                      - status
                      - type
                    type: object
                  type: array
                hardware:
                  description: Hardware is what the machine announced about itself.
                  properties:
                    product:
                      description: Product is the machine's SMBIOS vendor and product name.
                      type: string
                    serial:
                      description: Serial is the machine's SMBIOS serial number.
                      type: string
                  type: object
                install:
                  description: |-
                    Install is the install published for the host, until a new tailnet
                    device shows it has run.
                  properties:
                    bootMAC:
                      description: BootMAC is the MAC address the install is published for.
                      type: string
                    expiresAt:
                      description: |-
                        ExpiresAt is when the join key expires; an install still needed then is
                        published again with a new key.
                      format: date-time
                      type: string
                    generation:
                      description: Generation is the reinstallGeneration the install is for.
                      format: int64
                      type: integer
                    hostKeyFingerprint:
                      description: |-
                        HostKeyFingerprint is the SHA-256 fingerprint of the SSH host key the
                        install gives the host, which the operator trusts the new install by.
                      type: string
                    keyID:
                      description: KeyID is the ID of the single-use join key the install carries.
                      type: string
                    offeredAt:
                      format: date-time
                      type: string
                    previousDeviceID:
                      description: |-
                        PreviousDeviceID is the host's tailnet device when the install was
                        published; a different device is the install having run.
                      type: string
                    servableAt:
                      description: |-
                        ServableAt is when a boot server holding the site's provisioning address
                        first served the install's boot script.
                      format: date-time
                      type: string
                    servedAt:
                      description: |-
                        ServedAt is when a boot server handed the install's seed out, which it
                        does once, to the machine whose DHCP lease is on one of the host's
                        NICs.
                      format: date-time
                      type: string
                    servedTo:
                      description: ServedTo is the address and MAC the seed went to.
                      type: string
                    triggeredAt:
                      description: TriggeredAt is when the operator rebooted the host into the install.
                      format: date-time
                      type: string
                  required:
                    - bootMAC
                    - expiresAt
                    - keyID
                    - offeredAt
                  type: object
                power:
                  description: Power is the host's power state as AMT reports it.
                  properties:
                    observedAt:
                      description: ObservedAt is when AMT reported it.
                      format: date-time
                      type: string
                    state:
                      description: State is On or Off.
                      type: string
                  type: object
                provisioning:
                  description: |-
                    Provisioning is where the host is in its life: registering,
                    provisioning an install, provisioned, or deprovisioning.
                  properties:
                    installedGeneration:
                      description: |-
                        InstalledGeneration is the reinstallGeneration the host's current
                        install ran for.
                      format: int64
                      type: integer
                    lastTransitionTime:
                      description: LastTransitionTime is when State last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message says what the host is waiting for.
                      type: string
                    state:
                      description: State is Registering, Provisioning, Provisioned or Deprovisioning.
                      type: string
                  type: object
                tailnet:
                  description: |-
                    Tailnet is the host's current tailnet device. Every install registers a
                    new device, so a new deviceID means the box was reinstalled.
                  properties:
                    address:
                      description: |-
                        Address is the device's tailnet IPv4 address: what the operator dials
                        and what the kubelet advertises as the node's InternalIP.
                      type: string
                    connected:
                      description: Connected reports whether the device is connected to the tailnet now.
                      type: boolean
                    created:
                      description: Created is when the device registered.
                      format: date-time
                      type: string
                    deviceID:
                      description: DeviceID is the Tailscale device ID.
                      type: string
                    lastSeen:
                      description: LastSeen is when the device was last connected.
                      format: date-time
                      type: string
                    name:
                      description: Name is the device's MagicDNS name.
                      type: string
                  type: object
              type: object
          type: object
          x-kubernetes-validations:
            - message: a RackLinuxHost is named after the machine's SMBIOS UUID, in lowercase
              rule: self.metadata.name.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
            - message: spec.location.site is required; it composes the providerID
              rule: self.spec.location.site != ''
      served: true
      storage: true
      subresources:
        status: {}
