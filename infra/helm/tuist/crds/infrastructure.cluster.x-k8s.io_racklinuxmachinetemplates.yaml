---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: racklinuxmachinetemplates.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
      - cluster-api
    kind: RackLinuxMachineTemplate
    listKind: RackLinuxMachineTemplateList
    plural: racklinuxmachinetemplates
    shortNames:
      - rlmt
    singular: racklinuxmachinetemplate
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            RackLinuxMachineTemplate is the template a rack Linux MachineDeployment
            clones RackLinuxMachines from.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: RackLinuxMachineTemplateSpec holds the template.
              properties:
                template:
                  description: RackLinuxMachineTemplateResource is what a MachineSet clones.
                  properties:
                    spec:
                      description: |-
                        RackLinuxMachineSpec is the workload shape of one rack Linux node. The box
                        comes from the RackLinuxHost it claims, so a MachineDeployment can clone it.
                      properties:
                        adoptPool:
                          description: AdoptPool is the RackLinuxHost pool this machine claims from.
                          type: string
                        fleetName:
                          description: |-
                            FleetName names the `<fleetName>-ssh` Secret holding the key the
                            install stick authorizes. It is read, never minted.
                          type: string
                        nodeLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            NodeLabels are registered with the Node on top of the labels every rack
                            Linux node carries.
                          type: object
                        nodeTaints:
                          description: NodeTaints are registered with the Node.
                          items:
                            description: |-
                              The node this Taint is attached to has the "effect" on
                              any pod that does not tolerate the Taint.
                            properties:
                              effect:
                                description: |-
                                  Required. The effect of the taint on pods
                                  that do not tolerate the taint.
                                  Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                                type: string
                              key:
                                description: Required. The taint key to be applied to a node.
                                type: string
                              timeAdded:
                                description: |-
                                  TimeAdded represents the time at which the taint was added.
                                  It is only written for NoExecute taints.
                                format: date-time
                                type: string
                              value:
                                description: The taint value corresponding to the taint key.
                                type: string
                            required:
                              - effect
                              - key
                            type: object
                          type: array
                        providerID:
                          description: ProviderID is rack-linux://<site>/<host>, set once a host is claimed.
                          type: string
                      type: object
                  required:
                    - spec
                  type: object
              required:
                - template
              type: object
          type: object
      served: true
      storage: true
