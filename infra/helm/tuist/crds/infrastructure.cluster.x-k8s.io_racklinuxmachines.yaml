---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: racklinuxmachines.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
      - cluster-api
    kind: RackLinuxMachine
    listKind: RackLinuxMachineList
    plural: racklinuxmachines
    shortNames:
      - rlm
    singular: racklinuxmachine
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.rackLinuxHost
          name: Host
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.ready
          name: Ready
          type: boolean
        - jsonPath: .status.lastConvergeTime
          name: LastConverge
          type: date
        - jsonPath: .spec.providerID
          name: ProviderID
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            RackLinuxMachine is one rack Linux node, joined over the tailnet and kept
            converged afterwards.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                RackLinuxMachineSpec is the workload shape of one rack Linux node. The box
                comes from the RackLinuxHost it claims, so a MachineDeployment can clone it.
              properties:
                adoptPool:
                  description: AdoptPool is the RackLinuxHost pool this machine claims from.
                  type: string
                fleetName:
                  description: |-
                    FleetName names the `<fleetName>-ssh` Secret holding the key the
                    install stick authorizes. It is read, never minted.
                  type: string
                nodeLabels:
                  additionalProperties:
                    type: string
                  description: |-
                    NodeLabels are registered with the Node on top of the labels every rack
                    Linux node carries.
                  type: object
                nodeTaints:
                  description: NodeTaints are registered with the Node.
                  items:
                    description: |-
                      The node this Taint is attached to has the "effect" on
                      any pod that does not tolerate the Taint.
                    properties:
                      effect:
                        description: |-
                          Required. The effect of the taint on pods
                          that do not tolerate the taint.
                          Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                        type: string
                      key:
                        description: Required. The taint key to be applied to a node.
                        type: string
                      timeAdded:
                        description: |-
                          TimeAdded represents the time at which the taint was added.
                          It is only written for NoExecute taints.
                        format: date-time
                        type: string
                      value:
                        description: The taint value corresponding to the taint key.
                        type: string
                    required:
                      - effect
                      - key
                    type: object
                  type: array
                providerID:
                  description: ProviderID is rack-linux://<site>/<host>, set once a host is claimed.
                  type: string
              type: object
            status:
              description: RackLinuxMachineStatus is the observed state of one rack Linux node.
              properties:
                addresses:
                  items:
                    description: MachineAddress contains information for the node's address.
                    properties:
                      address:
                        description: The machine address.
                        type: string
                      type:
                        description: Machine address type, one of Hostname, ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                        type: string
                    required:
                      - address
                      - type
                    type: object
                  type: array
                conditions:
                  description: Conditions provide observations of the operational state of a Cluster API resource.
                  items:
                    description: Condition defines an observation of a Cluster API resource operational state.
                    properties:
                      lastTransitionTime:
                        description: |-
                          Last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed. If that is not known, then using the time when
                          the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A human readable message indicating details about the transition.
                          This field may be empty.
                        type: string
                      reason:
                        description: |-
                          The reason for the condition's last transition in CamelCase.
                          The specific API may choose whether or not this field is considered a guaranteed API.
                          This field may be empty.
                        type: string
                      severity:
                        description: |-
                          severity provides an explicit classification of Reason code, so the users or machines can immediately
                          understand the current situation and act accordingly.
                          The Severity field MUST be set only when Status=False.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: |-
                          type of condition in CamelCase or in foo.example.com/CamelCase.
                          Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                          can be useful (see .node.status.conditions), the ability to deconflict is important.
                        type: string
                    required:
                      - lastTransitionTime
                      - status
                      - type
                    type: object
                  type: array
                convergeFailures:
                  description: ConvergeFailures counts consecutive failed converges.
                  format: int32
                  type: integer
                hostConfigHash:
                  description: |-
                    HostConfigHash fingerprints the configuration last converged onto the
                    host.
                  type: string
                lastConvergeAttemptTime:
                  description: LastConvergeAttemptTime is when a converge was last attempted.
                  format: date-time
                  type: string
                lastConvergeTime:
                  description: LastConvergeTime is when the host last converged successfully.
                  format: date-time
                  type: string
                phase:
                  type: string
                rackLinuxHost:
                  description: RackLinuxHost is the host this machine holds.
                  type: string
                ready:
                  description: Ready is true while the Node is Ready.
                  type: boolean
                tailnetDeviceID:
                  description: |-
                    TailnetDeviceID is the host's tailnet device at the last successful
                    converge. A host on a different device was reinstalled.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
