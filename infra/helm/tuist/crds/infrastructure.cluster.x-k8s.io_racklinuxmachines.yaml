---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: racklinuxmachines.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
      - cluster-api
    kind: RackLinuxMachine
    listKind: RackLinuxMachineList
    plural: racklinuxmachines
    shortNames:
      - rlm
    singular: racklinuxmachine
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.nodeName
          name: Node
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.ready
          name: Ready
          type: boolean
        - jsonPath: .status.lastConvergeTime
          name: LastConverge
          type: date
        - jsonPath: .status.agent.appliedAt
          name: Agent
          type: date
        - jsonPath: .spec.providerID
          name: ProviderID
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            RackLinuxMachine is one rack Linux node, joined over the tailnet and kept
            converged afterwards.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                RackLinuxMachineSpec is one rack Linux host as a node. The operator creates
                it, and the CAPI Machine that owns it, for each RackLinuxHost, under the
                host's name.
              properties:
                host:
                  description: Host is the RackLinuxHost this machine is.
                  type: string
                providerID:
                  description: ProviderID is rack-linux://<site>/<host UUID>.
                  type: string
              required:
                - host
              type: object
            status:
              description: RackLinuxMachineStatus is the observed state of one rack Linux node.
              properties:
                addresses:
                  items:
                    description: MachineAddress contains information for the node's address.
                    properties:
                      address:
                        description: The machine address.
                        type: string
                      type:
                        description: Machine address type, one of Hostname, ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                        type: string
                    required:
                      - address
                      - type
                    type: object
                  type: array
                agent:
                  description: |-
                    Agent is what the host's node agent last did. The agent writes it, and
                    nothing else.
                  properties:
                    appliedAt:
                      description: |-
                        AppliedAt is when it last applied the configuration, whether or not
                        anything changed.
                      format: date-time
                      type: string
                    appliedHash:
                      description: AppliedHash is the configuration the agent last applied in full.
                      type: string
                    changed:
                      description: |-
                        Changed and Restarted are what its last apply that changed anything
                        changed and restarted.
                      items:
                        type: string
                      type: array
                    error:
                      description: Error is why its last apply failed.
                      type: string
                    restarted:
                      items:
                        type: string
                      type: array
                  type: object
                conditions:
                  description: Conditions provide observations of the operational state of a Cluster API resource.
                  items:
                    description: Condition defines an observation of a Cluster API resource operational state.
                    properties:
                      lastTransitionTime:
                        description: |-
                          Last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed. If that is not known, then using the time when
                          the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A human readable message indicating details about the transition.
                          This field may be empty.
                        type: string
                      reason:
                        description: |-
                          The reason for the condition's last transition in CamelCase.
                          The specific API may choose whether or not this field is considered a guaranteed API.
                          This field may be empty.
                        type: string
                      severity:
                        description: |-
                          severity provides an explicit classification of Reason code, so the users or machines can immediately
                          understand the current situation and act accordingly.
                          The Severity field MUST be set only when Status=False.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: |-
                          type of condition in CamelCase or in foo.example.com/CamelCase.
                          Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                          can be useful (see .node.status.conditions), the ability to deconflict is important.
                        type: string
                    required:
                      - lastTransitionTime
                      - status
                      - type
                    type: object
                  type: array
                convergeFailures:
                  description: ConvergeFailures counts consecutive failed converges.
                  format: int32
                  type: integer
                hostConfigHash:
                  description: |-
                    HostConfigHash fingerprints the configuration last converged onto the
                    host over SSH.
                  type: string
                lastConvergeAttemptTime:
                  description: LastConvergeAttemptTime is when a converge was last attempted.
                  format: date-time
                  type: string
                lastConvergeTime:
                  description: LastConvergeTime is when the host last converged successfully.
                  format: date-time
                  type: string
                nodeConfig:
                  description: |-
                    NodeConfig is the configuration the host runs as a node, which its
                    node agent keeps applied.
                  properties:
                    absent:
                      description: Absent are paths removed when they exist.
                      items:
                        description: |-
                          RackNodeFile is one file on a rack node. Group names what a change to it
                          takes: modules, sysctl, network (networkd reloaded), systemd (systemd
                          re-executed), containerd or kubelet (restarted), or none.
                        properties:
                          content:
                            type: string
                          group:
                            type: string
                          mode:
                            type: string
                          path:
                            type: string
                        required:
                          - path
                        type: object
                      type: array
                    containerd:
                      description: |-
                        Containerd is installed, and its configuration is its default with the
                        systemd cgroup driver.
                      properties:
                        configPath:
                          type: string
                      required:
                        - configPath
                      type: object
                    files:
                      description: Files are written, in order, when their content or mode differs.
                      items:
                        description: |-
                          RackNodeFile is one file on a rack node. Group names what a change to it
                          takes: modules, sysctl, network (networkd reloaded), systemd (systemd
                          re-executed), containerd or kubelet (restarted), or none.
                        properties:
                          content:
                            type: string
                          group:
                            type: string
                          mode:
                            type: string
                          path:
                            type: string
                        required:
                          - path
                        type: object
                      type: array
                    hash:
                      description: |-
                        Hash fingerprints the configuration. The node records the one it last
                        applied, and restarts containerd and the kubelet when it changes.
                      type: string
                    hostname:
                      description: Hostname is the host's OS hostname, its Node's name.
                      type: string
                    kubelet:
                      description: Kubelet is the exact kubelet release installed, never downgraded.
                      properties:
                        channel:
                          description: Channel is the pkgs.k8s.io minor channel, such as v1.34.
                          type: string
                        version:
                          description: Version is the release, without the `v`.
                          type: string
                      required:
                        - channel
                        - version
                      type: object
                    modules:
                      description: Modules are loaded once the files are written.
                      items:
                        type: string
                      type: array
                    sysctl:
                      description: Sysctl files are applied once the files are written.
                      items:
                        description: |-
                          RackNodeSysctl is a sysctl file applied with `sysctl -p`. An optional one
                          may hold keys the kernel lacks.
                        properties:
                          optional:
                            type: boolean
                          path:
                            type: string
                        required:
                          - path
                        type: object
                      type: array
                  required:
                    - containerd
                    - hash
                    - hostname
                    - kubelet
                  type: object
                nodeConfigTime:
                  description: |-
                    NodeConfigTime is when NodeConfig last changed. A node agent that has
                    not applied it a few minutes later leaves it to a converge over SSH.
                  format: date-time
                  type: string
                nodeName:
                  description: |-
                    NodeName is the name the host joined the cluster under: its hostname
                    when it joined. A host whose hostname changed joins again under the
                    new one.
                  type: string
                phase:
                  type: string
                ready:
                  description: Ready is true while the Node is Ready.
                  type: boolean
                tailnetDeviceID:
                  description: |-
                    TailnetDeviceID is the host's tailnet device at the last converge
                    attempt. A host on a different device was reinstalled, and is converged
                    without waiting out the previous device's failure backoff.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
