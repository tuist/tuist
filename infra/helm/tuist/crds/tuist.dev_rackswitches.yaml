# RackSwitch: a rack's switches as objects, so their state is visible next to
# the RackHosts behind them rather than only in someone's terminal.
#
# GENERATED by `mise run rack-switch-controller:generate` from the Go types in
# infra/rack-switch-controller/api/v1alpha1/. Edit those, not this file; the
# `generated` job in .github/workflows/rack-switch-controller-image.yml fails
# when the two disagree.
#
# It lives in `crds/` for the same reasons as tuist.dev_runnerpools.yaml: helm
# applies crds/ before any CR the chart renders, and does NOT touch crds/ on
# upgrade, so server-deployment.yml, omada-deployment.yml and
# rack-switch-fleet.yml apply it on every run.
#
# Spec is rendered from infra/rack-switch-fleet/sites/<site>.json by
# `mise run rack:fleet render`. A switch with `managedBy: controller` is
# adopted and converged by infra/rack-switch-controller through the Omada
# controller's Open API; a standalone one is changed over SSH by rack:fleet,
# and `mise run rack:fleet publish` writes its status.
#
# There used to be no controller, for two reasons, and neither applies to this
# one. A switch accepts about eight SSH connections per boot, so an observation
# loop over SSH would wedge it; this controller never opens SSH, and the Omada
# controller keeps its own management channel to each switch. And a controller
# in a cluster behind these switches would reconcile its own route to them;
# this one's pod never schedules onto a rack node. See
# infra/rack-switch-controller/AGENTS.md.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: rackswitches.tuist.dev
spec:
  group: tuist.dev
  names:
    kind: RackSwitch
    listKind: RackSwitchList
    plural: rackswitches
    shortNames:
    - rsw
    singular: rackswitch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.site
      name: Site
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.managementAddress
      name: Address
      type: string
    - jsonPath: .spec.applyOrder
      name: Order
      type: integer
    - jsonPath: .status.drift
      name: Drift
      type: string
    - jsonPath: .status.reachable
      name: Reachable
      type: boolean
    - jsonPath: .status.lastVerified
      name: Verified
      type: date
    - jsonPath: .spec.managedBy
      name: Managed By
      type: string
    - jsonPath: .status.controllerStatus
      name: State
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RackSwitch is one of a rack's switches, so its state is visible next to the
          RackHosts behind it rather than only in someone's terminal.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RackSwitchSpec is rendered from the site definition.
            properties:
              applyNote:
                description: Why this switch sits where it does in the order, in prose.
                type: string
              applyOrder:
                description: |-
                  Ascending, and strictly one switch at a time. The lowest has the
                  smallest blast radius and is the only one a change is tried on.
                type: integer
              config:
                description: The desired configuration of a switch the controller
                  manages.
                properties:
                  gateway:
                    description: |-
                      The management interface's gateway: the site's edge node, which is also
                      the path to the Omada controller.
                    type: string
                  hostname:
                    type: string
                  lags:
                    items:
                      description: LAG is a link aggregation group.
                      properties:
                        id:
                          minimum: 1
                          type: integer
                        name:
                          description: |-
                            The group's name, which its members carry as their description. Unset
                            means lag<id>; the controller refuses an empty one.
                          pattern: ^[A-Za-z0-9 ._-]{1,32}$
                          type: string
                        ports:
                          items:
                            type: integer
                          minItems: 1
                          type: array
                      required:
                      - id
                      - ports
                      type: object
                    type: array
                  lldp:
                    description: 'Site-wide in the controller: every switch of a site
                      has to agree.'
                    type: boolean
                  managementPrefixLength:
                    type: integer
                  managementVlan:
                    description: The VLAN of the management interface, which carries
                      spec.managementAddress.
                    type: integer
                  ports:
                    description: Every port the model has.
                    items:
                      description: PortConfig is the desired configuration of one
                        port.
                      properties:
                        description:
                          description: |-
                            Description the port carries. Empty means the controller's own
                            "Port<n>". The controller refuses parentheses in it.
                          pattern: ^[A-Za-z0-9 ._-]{0,32}$
                          type: string
                        nativeVlan:
                          description: VLAN carried untagged. Unset means the management
                            VLAN.
                          type: integer
                        port:
                          minimum: 1
                          type: integer
                        spanningTree:
                          description: |-
                            Whether spanning tree runs on the port. Unset follows the port's
                            profile.
                          type: boolean
                        taggedVlans:
                          description: VLANs carried tagged.
                          items:
                            type: integer
                          type: array
                      required:
                      - port
                      type: object
                    type: array
                  snmp:
                    description: 'Site-wide in the controller: every switch of a site
                      has to agree.'
                    type: boolean
                  spanningTree:
                    description: SpanningTreeMode is the switch-wide spanning-tree
                      protocol.
                    enum:
                    - "off"
                    - stp
                    - rstp
                    - mstp
                    type: string
                  vlans:
                    description: Networks this switch carries beyond management.
                    items:
                      description: VLAN is a network the switch carries beyond management.
                      properties:
                        id:
                          maximum: 4094
                          minimum: 1
                          type: integer
                        name:
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    type: array
                type: object
              configRevision:
                description: |-
                  Digest of the configuration rendered from the site definition. Status
                  is reported against this, so an observation can never be read as
                  applying to a revision it did not see.
                type: string
              credentialItem:
                description: |-
                  The 1Password item holding the local admin login. Named, not inlined:
                  the credential never belongs in an object or in git.
                type: string
              mac:
                description: |-
                  The switch's MAC address, lower case and colon separated. It is how
                  the Omada controller knows the switch.
                pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
                type: string
              managedBy:
                default: standalone
                description: |-
                  Who changes the switch: the rack switch controller through the Omada
                  controller, or rack:fleet over SSH.
                enum:
                - controller
                - standalone
                type: string
              managementAddress:
                type: string
              model:
                description: Key into infra/rack-switch-fleet/models.json.
                type: string
              ports:
                description: What is plugged into each port, as far as the site definition
                  knows.
                items:
                  description: |-
                    PortAssignment is what is plugged into a port, as far as the site
                    definition knows.
                  properties:
                    detail:
                      type: string
                    peer:
                      type: string
                    port:
                      type: integer
                    purpose:
                      type: string
                  type: object
                type: array
              role:
                description: tor or mgmt. Decides blast radius, and therefore apply
                  order.
                type: string
              site:
                description: The rack this switch belongs to.
                type: string
            required:
            - applyOrder
            - configRevision
            - managementAddress
            - model
            - role
            - site
            type: object
            x-kubernetes-validations:
            - message: a switch the controller manages needs its mac
              rule: '!has(self.managedBy) || self.managedBy != ''controller'' || has(self.mac)'
          status:
            description: |-
              RackSwitchStatus is written by the rack switch controller for a switch it
              manages, and by `rack:fleet publish` for a standalone one.
            properties:
              adopted:
                description: Whether the switch is adopted into the site's Omada controller.
                type: boolean
              conditions:
                description: Adopted, Converged and Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionsUsedSinceBoot:
                description: |-
                  How many SSH connections this boot has spent, of roughly seven before
                  the daemon stops accepting. Visible because it is a consumable, and
                  running out looks like a healthy switch.
                type: integer
              controllerStatus:
                description: The Omada controller's name for the device's state.
                type: string
              drift:
                description: Drift is how the switch compared with its spec when last
                  verified.
                enum:
                - unknown
                - none
                - drifted
                type: string
              lastVerified:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                description: The metadata.generation the controller last wrote everything
                  for.
                format: int64
                type: integer
              observedRevision:
                description: The configRevision this status was produced against.
                type: string
              reachable:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
