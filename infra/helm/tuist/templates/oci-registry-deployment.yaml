{{- if .Values.ociRegistry.enabled }}
# VM image registry (CNCF distribution, store of record — not a proxy).
# Holds the large Tart images the macOS fleet boots from, which GHCR is
# a poor fit for: pushing a ~50 GB image there means ~17,000 chunked
# requests (GHCR rejects chunks of 4 MB and up), which trips its
# secondary rate limit, while monolithic uploads time out mid-disk. See
# the measurements in `.github/actions/tart-push/action.yml`. Backed by
# the same object store as the Docker Hub mirror, under its own prefix.
#
# Blob GETs are answered with a redirect to a presigned object-store URL,
# so image bytes go straight from the store to the puller and never
# transit this pod. That is what keeps a single small replica viable in
# front of terabytes of images.
#
# Reachable over the tailnet only (see the Service's tailscale
# annotations): every puller is our own hardware, which joins the tailnet
# at bootstrap before kubelet. Customers select a runner profile via
# `runs-on:` labels and never pull these images.
#
# Runs on the elastic pool, NOT the bare-metal runner fleet, and pulls its
# own image from a non-Hub registry — this registry serves the runner
# image, so hosting it on hardware that needs the runner image to boot
# would be a bootstrap deadlock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: oci-registry
spec:
  replicas: {{ .Values.ociRegistry.replicaCount }}
  selector:
    matchLabels:
      {{- include "tuist.componentLabels" (dict "root" . "component" "oci-registry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tuist.componentLabels" (dict "root" . "component" "oci-registry") | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.ociRegistry.auth.enabled }}
      annotations:
        # Roll the Pod when the proxy config changes. A ConfigMap update
        # rewrites the mounted file, but nginx keeps its parsed config
        # until it restarts, so without this a change to the buffering
        # directives or the realm would look applied and not be.
        #
        # The htpasswd is deliberately not covered: it is ESO-managed, so
        # its content isn't knowable at render time. Rotating the
        # credential needs a Pod restart for the same reason.
        checksum/proxy-config: {{ include (print $.Template.BasePath "/oci-registry-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
{{ include "tuist.podScheduling" . | nindent 6 }}
      {{- if .Values.ociRegistry.tailscale.enabled }}
      serviceAccountName: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry") }}
      {{- end }}
      containers:
        - name: oci-registry
          image: "{{ .Values.ociRegistry.image.repository }}:{{ .Values.ociRegistry.image.tag }}"
          imagePullPolicy: {{ .Values.ociRegistry.image.pullPolicy }}
          {{- if not .Values.ociRegistry.auth.enabled }}
          ports:
            - name: registry
              containerPort: 5000
          {{- end }}
          env:
            # Bind the loopback when the proxy is in front, so the only
            # route in is through it. Listening on the Pod IP would leave
            # the registry writable by anything in the cluster that can
            # reach the Pod directly — the Service pointing at the proxy
            # does not prevent that — which would make the read/write
            # split trivially bypassable.
            - name: REGISTRY_HTTP_ADDR
              value: {{ ternary "127.0.0.1:5000" ":5000" .Values.ociRegistry.auth.enabled | quote }}
            - name: REGISTRY_LOG_LEVEL
              value: {{ .Values.ociRegistry.logLevel | quote }}
            # Retiring an Xcode profile should be able to reclaim its
            # blobs. Deletion only marks them unreferenced; an offline
            # garbage-collect pass is what frees the object-store space.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # Tart splits a VM disk into layers of at most 512 MiB. The S3
            # driver buffers each multipart part in memory, so this trades
            # pod memory against request count on a push; it must stay
            # comfortably under the container memory limit below.
            # int64 before quoting: Helm reads the value as a float and
            # would otherwise render it in scientific notation, which the
            # storage driver rejects at startup.
            - name: REGISTRY_STORAGE_S3_CHUNKSIZE
              value: {{ .Values.ociRegistry.s3.chunkSize | int64 | quote }}
            # Signs upload state, so it has to be identical everywhere a
            # given upload session might land. Left unset the registry
            # invents one per process, which breaks in-flight chunked
            # uploads across any restart — and across a rolling update
            # even at one replica, since the surge Pod overlaps the old
            # one behind the same Service.
            {{- if .Values.ociRegistry.externalSecret.enabled }}
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-secrets") }}
                  key: httpSecret
            {{- else if .Values.ociRegistry.httpSecret }}
            - name: REGISTRY_HTTP_SECRET
              value: {{ .Values.ociRegistry.httpSecret | quote }}
            {{- else }}
            {{- fail "ociRegistry requires a stable httpSecret: set ociRegistry.externalSecret.enabled, or supply ociRegistry.httpSecret" }}
            {{- end }}
            {{- include "tuist.registryStorageEnv" (dict "root" . "s3" .Values.ociRegistry.s3) | nindent 12 }}
            {{- with .Values.ociRegistry.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # With the registry on the loopback the kubelet can't reach it
          # directly, so probe through the proxy — containers in a Pod
          # share a network namespace, so this port is the sidecar's.
          # It also means a probe covers the whole chain rather than just
          # the registry answering to itself.
          readinessProbe:
            httpGet:
              path: {{ ternary "/healthz" "/v2/" .Values.ociRegistry.auth.enabled }}
              port: {{ ternary (int .Values.ociRegistry.auth.proxy.port) 5000 .Values.ociRegistry.auth.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" (and .Values.ociRegistry.auth.enabled .Values.ociRegistry.tls.enabled) }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ ternary "/healthz" "/v2/" .Values.ociRegistry.auth.enabled }}
              port: {{ ternary (int .Values.ociRegistry.auth.proxy.port) 5000 .Values.ociRegistry.auth.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" (and .Values.ociRegistry.auth.enabled .Values.ociRegistry.tls.enabled) }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ociRegistry.resources | nindent 12 }}
        {{- if .Values.ociRegistry.auth.enabled }}
        # Read/write split; see the ConfigMap for why it lives here and
        # not in the registry's own htpasswd realm. The registry's port
        # is not in the Service, so this is the only way in.
        - name: auth-proxy
          image: "{{ .Values.ociRegistry.auth.proxy.image.repository }}:{{ .Values.ociRegistry.auth.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.ociRegistry.auth.proxy.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: {{ .Values.ociRegistry.auth.proxy.port }}
          volumeMounts:
            - name: auth-proxy-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: registry-auth
              mountPath: /etc/nginx/registry-auth
              readOnly: true
            {{- if .Values.ociRegistry.tls.enabled }}
            - name: registry-tls
              mountPath: /etc/nginx/registry-tls
              readOnly: true
            {{- end }}
          {{- if .Values.ociRegistry.tailscale.enabled }}
          # The certificate is fetched at runtime by the cert sidecar, not
          # mounted from a Secret, so on a cold start it does not exist
          # when this container is created. nginx exits immediately if its
          # `ssl_certificate` is missing, which would crash-loop the Pod
          # until the fetch happened to win the race. Wait for the file
          # instead, and let the readiness probe below govern traffic.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for i in $(seq 1 120); do
                if [ -s /etc/nginx/registry-tls/tls.crt ] && [ -s /etc/nginx/registry-tls/tls.key ]; then
                  exec nginx -g 'daemon off;'
                fi
                sleep 5
              done
              echo "no certificate at /etc/nginx/registry-tls after 10m; the tailscale-cert sidecar never produced one" >&2
              exit 1
          {{- end }}
          readinessProbe:
            # The unauthenticated health path, since every registry path
            # now needs a credential a probe cannot carry. It still
            # proxies through to the registry, so a broken config or a
            # dead backend takes the Pod out of the Service.
            httpGet:
              path: /healthz
              port: proxy
              scheme: {{ ternary "HTTPS" "HTTP" .Values.ociRegistry.tls.enabled }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ociRegistry.auth.proxy.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.ociRegistry.tailscale.enabled }}
        # The Pod joins the tailnet itself rather than being fronted by an
        # operator-managed proxy, because it needs to *own* the tailnet
        # name: only the node a name belongs to can obtain a certificate
        # for it, and that certificate is what lets the Mac hosts reach
        # this registry over TLS by a name they can resolve.
        #
        # The alternative was to let the Tailscale proxy terminate TLS. It
        # would have been less machinery, but the hop from that proxy into
        # this Pod crosses the cluster network, which carries no transparent
        # encryption — and that hop would be carrying the registry's Basic
        # credential.
        - name: tailscale
          image: "{{ .Values.ociRegistry.tailscale.image.repository }}:{{ .Values.ociRegistry.tailscale.image.tag }}"
          imagePullPolicy: {{ .Values.ociRegistry.tailscale.image.pullPolicy }}
          env:
            - name: TS_HOSTNAME
              value: {{ required "ociRegistry.tailscale.hostname is required" .Values.ociRegistry.tailscale.hostname | quote }}
            # Kubernetes Secret rather than a volume: the node identity has
            # to survive a restart. On ephemeral state Tailscale would mint
            # a new node each time, the name would come back as
            # `<hostname>-1`, and the certificate — which follows the name
            # actually assigned — would stop matching what clients dial.
            - name: TS_KUBE_SECRET
              value: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-tailscale-state") | quote }}
            - name: TS_USERSPACE
              value: "false"
            # An OAuth client secret, not a static auth key. The same
            # credential the fleet moved to in #12312 after an expired key
            # took the xcresult processors down: `tailscale up
            # --auth-key=<oauth-client-secret>` mints a fresh key on every
            # join, so there is nothing with an expiry date to rotate.
            # Keys minted this way carry no tags of their own, which is why
            # the tag below is not optional.
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-secrets") }}
                  key: tailscaleAuthKey
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags={{ required "ociRegistry.tailscale.tags is required when the Pod joins the tailnet" .Values.ociRegistry.tailscale.tags }}"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: tailscale-socket
              mountPath: /var/run/tailscale
          resources:
            {{- toYaml .Values.ociRegistry.tailscale.resources | nindent 12 }}

        # Separate from the container above because `tailscale cert` is a
        # client call against the daemon, and the daemon's own container
        # runs containerboot as PID 1. Sharing the socket directory is
        # enough to reach it.
        - name: tailscale-cert
          image: "{{ .Values.ociRegistry.tailscale.image.repository }}:{{ .Values.ociRegistry.tailscale.image.tag }}"
          imagePullPolicy: {{ .Values.ociRegistry.tailscale.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              FQDN="{{ .Values.ociRegistry.tailscale.hostname }}.{{ required "ociRegistry.tls.dns.tailnet is required for the certificate name" .Values.ociRegistry.tls.dns.tailnet }}"
              # Tailscale issues 90-day certificates and renews on request
              # rather than on a schedule, so this has to keep asking. A
              # one-shot fetch works for three months and then takes the
              # registry down on a day nobody changed anything.
              while true; do
                if tailscale --socket=/var/run/tailscale/tailscaled.sock cert \
                     --cert-file /certs/tls.crt \
                     --key-file /certs/tls.key \
                     "$FQDN"; then
                  echo "certificate for $FQDN written"
                  sleep 24h
                else
                  # Early on this is just the daemon not having finished
                  # joining; later it is worth retrying quickly because the
                  # existing certificate is still on disk and still valid.
                  echo "cert fetch for $FQDN failed; retrying" >&2
                  sleep 60
                fi
              done
          volumeMounts:
            - name: tailscale-socket
              mountPath: /var/run/tailscale
            - name: registry-tls
              mountPath: /certs
          resources:
            {{- toYaml .Values.ociRegistry.tailscale.certResources | nindent 12 }}
        {{- end }}
      {{- if or .Values.ociRegistry.auth.enabled .Values.ociRegistry.tailscale.enabled }}
      volumes:
        {{- if .Values.ociRegistry.auth.enabled }}
        - name: auth-proxy-config
          configMap:
            name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-proxy") }}
        - name: registry-auth
          secret:
            {{- if .Values.ociRegistry.externalSecret.enabled }}
            secretName: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-secrets") }}
            {{- else if .Values.ociRegistry.auth.existingSecret }}
            secretName: {{ .Values.ociRegistry.auth.existingSecret }}
            {{- else }}
            {{- fail "ociRegistry.auth.enabled requires ociRegistry.externalSecret.enabled, or auth.existingSecret naming a Secret with htpasswdReaders and htpasswdWriters keys" }}
            {{- end }}
            items:
              - key: htpasswdReaders
                path: readers
              - key: htpasswdWriters
                path: writers
        {{- end }}
        {{- if .Values.ociRegistry.tls.enabled }}
        - name: registry-tls
          {{- if .Values.ociRegistry.tailscale.enabled }}
          # Written by the cert sidecar, not mounted from cert-manager: the
          # certificate is for a `.ts.net` name, and only Tailscale can
          # issue for a zone we do not control.
          emptyDir: {}
          {{- else }}
          secret:
            secretName: {{ .Values.ociRegistry.tls.existingSecret | default (include "tuist.componentName" (dict "root" . "component" "oci-registry-tls")) }}
          {{- end }}
        {{- end }}
        {{- if .Values.ociRegistry.tailscale.enabled }}
        - name: tailscale-socket
          emptyDir: {}
        {{- end }}
      {{- end }}
{{- end }}
