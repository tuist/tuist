{{- if and .Values.server.enabled .Values.agents.enabled }}
{{- if not .Values.server.cluster.enabled }}
{{- fail "agents.enabled requires server.cluster.enabled=true: agents pods join the server's Erlang cluster for session wakes and the Condukt session registry." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "agents") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  replicas: {{ .Values.agents.replicaCount }}
  strategy:
    {{- toYaml .Values.agents.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "tuist.componentLabels" (dict "root" . "component" "agents") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tuist.componentLabels" (dict "root" . "component" "agents") | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.agents.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/port-name: metrics
        {{- with .Values.agents.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tuist.componentServiceAccountName" (dict "root" . "component" "server") }}
      automountServiceAccountToken: {{ .Values.server.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.agents.terminationGracePeriodSeconds }}
      {{- include "tuist.podScheduling" . | nindent 6 }}
      {{- with .Values.agents.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agents.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agents.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agents
          # The server's image and environment, booted into agents mode: no
          # Phoenix endpoint, no Oban queues, only the session runner
          # (`Tuist.Agents.Runner`) and what sessions use.
          image: {{ include "tuist.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /app/bin/tuist
            - start
          ports:
            - name: metrics
              containerPort: 9091
            - name: epmd
              containerPort: 4369
            - name: erlang-dist
              containerPort: {{ .Values.server.cluster.distributionPort }}
          env:{{ include "tuist.serverContainerEnv" . }}
            - name: TUIST_MODE
              value: agents
            # The runner stops claiming sessions as the VM nears this.
            - name: TUIST_AGENTS_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: agents
                  resource: limits.memory
            {{- with .Values.agents.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $serverConfigEnvFrom := include "tuist.serverConfigEnvFrom" . | trim }}
          {{- if or $serverConfigEnvFrom .Values.server.extraEnvFrom }}
          envFrom:
            {{- with $serverConfigEnvFrom }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.server.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # Ready once the release is up (PromEx serves /metrics from the
          # application tree), so a rolling deploy terminates the old pod,
          # which drains its sessions, only after the new one can claim them.
          # No liveness probe: a wedged pod stops renewing its leases, and
          # other pods take its sessions after 20 s.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          # No preStop: there is no Service to drain. SIGTERM stops the
          # runner first, which drains and releases every session.
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
{{- end }}
