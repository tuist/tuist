{{- if and .Values.server.enabled .Values.agents.enabled .Values.agents.autoscaling.enabled }}
{{- $requests := (.Values.agents.resources.requests | default dict) }}
{{- $limits := (.Values.agents.resources.limits | default dict) }}
{{- if or (not $limits.memory) (ne (toString $requests.memory) (toString $limits.memory)) }}
{{- fail "agents.autoscaling requires agents.resources.requests.memory to equal limits.memory: the autoscaler measures memory against requests, and pods stop claiming sessions at a share of their limit." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "agents") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tuist.componentName" (dict "root" . "component" "agents") }}
  minReplicas: {{ .Values.agents.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agents.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.agents.autoscaling.targetMemoryUtilizationPercentage }}
  {{- with .Values.agents.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
