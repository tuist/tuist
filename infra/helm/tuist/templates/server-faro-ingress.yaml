{{- if and .Values.server.enabled .Values.server.faro.gateway.enabled }}
{{- if or (ne .Values.server.faro.collectorUrl "/-/faro/collect") (not .Values.server.faro.receiverHost) }}
{{- fail "server.faro.gateway requires receiverHost and collectorUrl /-/faro/collect" }}
{{- end }}
{{- end }}
{{- if and .Values.server.enabled .Values.server.ingress.enabled .Values.server.faro.receiverHost (hasPrefix "/" .Values.server.faro.collectorUrl) }}
{{- /*
In direct mode Alloy's faro.receiver serves POST on /collect and nothing else,
so the collector path is rewritten before it reaches the receiver. Gateway
mode preserves the path for Phoenix, which forwards to Alloy itself.
rewrite-target is a per-Ingress annotation, which is why this is a separate object from the server
Ingress rather than another path on it: applied there it would rewrite "/" too
and take the whole site down.

ingress-nginx merges rules for a host across Ingress objects, so this adds the
collector path to the same host the server Ingress already serves. It also
denies an Ingress whose host and path another Ingress already defines, so
collectorUrl must differ from every path the server Ingress lists.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "faro") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: faro
  {{- if not .Values.server.faro.gateway.enabled }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /collect
  {{- end }}
spec:
  {{- with .Values.server.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.server.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.server.ingress.host | quote }}
      secretName: {{ .Values.server.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.server.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.server.faro.collectorUrl | quote }}
            pathType: Prefix
            backend:
              service:
                {{- if .Values.server.faro.gateway.enabled }}
                name: {{ include "tuist.componentName" (dict "root" . "component" "server") }}
                port:
                  number: {{ .Values.server.service.port }}
                {{- else }}
                name: {{ include "tuist.componentName" (dict "root" . "component" "faro-receiver") }}
                port:
                  number: {{ .Values.server.faro.receiverPort }}
                {{- end }}
{{- end }}
