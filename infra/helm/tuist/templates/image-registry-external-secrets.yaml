{{- if and .Values.imageRegistry.enabled .Values.imageRegistry.auth.enabled .Values.imageRegistry.auth.externalSecret.enabled }}
# The push credential, as a ready-made htpasswd line. The hash is stored
# rather than derived here because the value only exists at runtime, and
# nginx wants a file. Rotating is an `op item edit` plus a pod restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "image-registry-auth") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-registry
spec:
  refreshInterval: {{ .Values.imageRegistry.auth.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.imageRegistry.auth.externalSecret.storeRef.name | default "onepassword" }}
    kind: {{ .Values.imageRegistry.auth.externalSecret.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "tuist.componentName" (dict "root" . "component" "image-registry-auth") }}
    creationPolicy: Owner
    # `| trim` for the same reason the object-storage and registry-cache
    # secrets do it: a 1P paste appends a newline, and nginx reads the
    # htpasswd file line-wise.
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ `{{ .htpasswd | trim }}` }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: "{{ .Values.imageRegistry.auth.externalSecret.htpasswd.item }}/{{ .Values.imageRegistry.auth.externalSecret.htpasswd.field }}"
{{- end }}
