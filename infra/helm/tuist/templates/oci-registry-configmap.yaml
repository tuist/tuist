{{- if and .Values.ociRegistry.enabled .Values.ociRegistry.auth.enabled }}
# Read/write split in front of the registry.
#
# `distribution`'s own htpasswd realm authenticates but does not
# authorize: any account that can pull can also push. A pull credential
# handed to the fleet would therefore also be a push credential on every
# host, which is worse than no credential at all. Splitting on method
# instead keeps pullers anonymous and gates only mutations, which maps
# exactly onto the registry API — reads are GET/HEAD, writes are POST,
# PATCH, PUT and DELETE.
#
# Putting HTTP in the path costs nothing on the hot path: a blob GET is
# answered with a redirect to the object store, so image bytes never
# reach this proxy. It only ever handles small control requests and the
# upload stream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-proxy") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: oci-registry
data:
  default.conf: |
    server {
      {{- if .Values.ociRegistry.tls.enabled }}
      # TLS terminates here rather than at the tailnet proxy. The hop
      # from that proxy into this Pod crosses the cluster network, which
      # carries no transparent encryption, and it is the hop that would
      # otherwise carry Basic credentials in the clear.
      listen {{ .Values.ociRegistry.auth.proxy.port }} ssl;
      http2 on;
      ssl_certificate /etc/nginx/registry-tls/tls.crt;
      ssl_certificate_key /etc/nginx/registry-tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_cache shared:SSL:4m;
      {{- else }}
      listen {{ .Values.ociRegistry.auth.proxy.port }};
      {{- end }}
      server_name _;

      # Layer blobs are large and the upload is a single streamed
      # request. Unset the cap, and forward the body as it arrives
      # rather than spooling the whole request to disk first.
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_http_version 1.1;

      # The registry builds absolute upload-session URLs from the
      # inbound Host, so it has to survive the hop or clients get sent
      # back to the loopback address.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # An upload can sit while the registry flushes a part to the
      # object store.
      proxy_connect_timeout {{ .Values.ociRegistry.auth.proxy.timeoutSeconds }}s;
      proxy_send_timeout {{ .Values.ociRegistry.auth.proxy.timeoutSeconds }}s;
      proxy_read_timeout {{ .Values.ociRegistry.auth.proxy.timeoutSeconds }}s;

      # Probes cannot carry a credential, and every registry path now
      # needs one, so they get an exact-match path of their own. It still
      # proxies to the registry rather than answering locally, so a
      # probe continues to cover the whole chain instead of just nginx.
      location = /healthz {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:5000/v2/;
      }

      # Two tiers rather than one. The outer realm gates every request,
      # so nothing is readable without a credential — the tailnet is not
      # a closed set, and the .xip mirror carries Xcode, which we may use
      # but not redistribute. The inner realm gates mutations against a
      # narrower file, so a pull credential handed to the fleet is not
      # also a push credential. `auth_basic` is valid in `limit_except`,
      # and the inner directive wins for the methods it covers.
      location / {
        auth_basic "{{ .Values.ociRegistry.auth.realm }}";
        auth_basic_user_file /etc/nginx/registry-auth/readers;
        limit_except GET HEAD {
          auth_basic "{{ .Values.ociRegistry.auth.realm }}";
          auth_basic_user_file /etc/nginx/registry-auth/writers;
        }
        proxy_pass http://127.0.0.1:5000;
      }
    }
{{- end }}
