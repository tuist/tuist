{{- if and .Values.capi.enabled .Values.rackFleet.enabled }}
{{- $fleetName := include "tuist.rackFleetName" . }}
{{- $clusterName := include "tuist.componentName" (dict "root" . "component" "capi") }}
{{- /*
Rack-owned Mac mini fleet (the BER1 colo programme): one RackHost per box,
rendered from `rackFleet.hosts`, so adding a mini to the rack is a values PR
reviewed like any other. The operator keeps a CAPI Machine and a
RackAppleSiliconMachine for each host, named `<fleet>-<host>`, which make it a
node.

A RackHost is kept by Helm: retiring a box is removing it from the values and
`kubectl delete rackhost <name>`, which deletes its Machine and its Node.
*/ -}}
{{- $machine := dict }}
{{- range $field := list "hostCPU" "hostMemoryMB" "guestCapacity" "maxPods" }}
{{- with get $.Values.rackFleet.machine $field }}
{{- $_ := set $machine $field . }}
{{- end }}
{{- end }}
{{- /*
Presence, not truthiness: 0 means "cache volumes off on this host" and `with`
would swallow it, leaving the host on the operator's non-zero global. `hasKey`
alone is not enough: the documented placeholder in values.yaml is an explicit
null, i.e. a present key with no value.
*/}}
{{- if and (hasKey .Values.rackFleet.machine "runnerCacheVolumeGiB") (not (kindIs "invalid" .Values.rackFleet.machine.runnerCacheVolumeGiB)) }}
{{- $_ := set $machine "runnerCacheVolumeGiB" .Values.rackFleet.machine.runnerCacheVolumeGiB }}
{{- end }}
{{- range $host := .Values.rackFleet.hosts }}
{{- $hostName := required "each rackFleet.hosts entry needs a name" $host.name }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: RackHost
metadata:
  name: {{ $hostName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rack-fleet
spec:
  {{- with $host.serial }}
  serial: {{ . | quote }}
  {{- end }}
  address: {{ required (printf "rackFleet.hosts[%s].address is required; there is nothing to dial without it" $hostName) $host.address | quote }}
  {{- /* The subnet routers the address is dialled through, admitted by the
  host's SSH ingress guard. Required because without them a host that loses
  its own tailnet device can only be recovered from its console: the guard
  drops the router's LAN address, and a rack host has no public path.
  `empty` rather than `required`: `required` only rejects nil and "", and the
  values default is an empty list. */}}
  {{- $sshIngressAllowCIDRs := $host.sshIngressAllowCIDRs | default $.Values.rackFleet.sshIngressAllowCIDRs }}
  {{- if empty $sshIngressAllowCIDRs }}
  {{- fail (printf "rackFleet.sshIngressAllowCIDRs (or rackFleet.hosts[%s].sshIngressAllowCIDRs) is required: list the LAN address of every subnet router that advertises the host's address, as a /32" $hostName) }}
  {{- end }}
  sshIngressAllowCIDRs:
    {{- toYaml $sshIngressAllowCIDRs | nindent 4 }}
  sshUser: {{ $host.sshUser | default $.Values.rackFleet.sshUser | default "tuist" }}
  {{- if $host.parked }}
  parked: true
  {{- end }}
  location:
    {{- /* site composes the providerID, so the controller does not bootstrap a
    host without one. Required here rather than in the CRD: a required CRD
    field breaks a Helm rollback to a revision predating it. */}}
    site: {{ required (printf "rackFleet.hosts[%s].site is required; it composes the providerID" $hostName) (coalesce $host.site $.Values.rackFleet.site) | quote }}
    {{- with $host.rack }}
    rack: {{ . | quote }}
    {{- end }}
    {{- with $host.shelf }}
    shelf: {{ . | quote }}
    {{- end }}
    {{- with $host.positionU }}
    positionU: {{ . }}
    {{- end }}
  {{- with $host.power }}
  power:
    driver: {{ .driver | default "shelly" }}
    host: {{ required (printf "rackFleet.hosts[%s].power.host is required when power is set" $hostName) .host | quote }}
    {{- if eq (.driver | default "shelly") "eaton" }}
    outlet: {{ required (printf "rackFleet.hosts[%s].power.outlet is required for the eaton driver: the outlet's 1-based number on the PDU" $hostName) .outlet | quote }}
    {{- else }}
    outlet: {{ .outlet | default "0" | quote }}
    {{- end }}
    {{- with .credentialsSecret }}
    credentialsSecretRef:
      name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $machine }}
  machine:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- /*
Remediation for a host that dies AFTER it has joined.

The reconciler's own failure handling is bootstrap-only: it power-cycles, then
quarantines, on a host that never reaches Ready. Once a host is serving, nothing
in this provider watches it, so a wedged tart-kubelet on a box that is otherwise
up leaves a NotReady Node and a Running Machine indefinitely. The check marks
such a Machine, and the RackHost controller, which owns it, deletes it and makes
a new one that bootstraps the host again.

The timeouts deliberately diverge from the provider-backed fleets, which
remediate after 600s. A rack mini is not rented capacity that gets reinstalled:
it restarts itself on power restore (`pmset autorestart 1`) and rejoins in about
20 seconds, measured on the prototype during a real power cut. Remediating at
ten minutes would convert that free recovery into a full re-bootstrap, because
deleting the Machine revokes the host's kubelet identity and drops its Node, and
the new Machine then has to push the whole config back over SSH. So the check
waits 30m, which is the same window a quarantined host waits before bootstrap
starts over: one timescale for "this host has had long enough to sort itself
out" rather than two.

`nodeStartupTimeout` stays at the siblings' 90m for a sharper reason here. It has
to sit past a full bootstrap cycle (attempts, then a power cycle, then a 30m
quarantine, then expiry and retry), because a shorter one would delete Machines
the reconciler is still working through and leave two remediation loops fighting
over the same failure.

`unhealthyRange` keeps the siblings' `[0-1]` and matters more on a rack: these
hosts share a PDU and a switch, so several going NotReady at once is
infrastructure rather than hardware, and re-bootstrapping the whole rack is the
worst available response to it.

Deleting a Machine never dials the host, so remediation cannot wedge on an
unreachable box: every stage of the delete path is an apiserver operation.
*/ -}}
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: {{ $fleetName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-fleet
    tuist.dev/fleet: {{ $fleetName }}
spec:
  clusterName: {{ $clusterName }}
  nodeStartupTimeout: 90m
  unhealthyRange: "[0-1]"
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      tuist.dev/fleet: {{ $fleetName }}
  unhealthyConditions:
    - type: Ready
      status: Unknown
      timeout: 1800s
    - type: Ready
      status: "False"
      timeout: 1800s
{{- end }}
