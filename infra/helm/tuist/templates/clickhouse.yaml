{{- if eq .Values.clickhouse.mode "embedded" }}
{{- $systemLogLevel := .Values.clickhouse.embedded.systemLogs.level }}
{{- $systemLogTTLDays := .Values.clickhouse.embedded.systemLogs.ttlDays }}
{{- /*
  System log tables that ship with no TTL and exist in every ClickHouse version
  the chart supports. Deliberately an intersection, not a superset: a table
  present in only some versions (latency_log in 25.x, background_schedule_pool_log
  in 26.x) is left to ClickHouse's own retention, so that operators who override
  image.tag keep a config that preprocesses on every version.

  The retention Job must only ALTER tables that appear here. ClickHouse
  reconciles each managed system log table against this config on startup, so a
  TTL applied to a table the config does not declare is rotated away on the next
  restart, leaving the live table unbounded again.

  opentelemetry_span_log is excluded because the shipped config declares it with
  an explicit <engine> spec that a separate <ttl> cannot coexist with.

  Tables that already ship with a TTL (processors_profile_log,
  blob_storage_log, asynchronous_insert_log, and the 26.x zookeeper logs) are
  deliberately absent: they are already bounded, and declaring a different
  window would rotate them for no gain.
*/}}
{{- $systemLogTables := list "text_log" "query_log" "query_thread_log" "query_views_log" "trace_log" "metric_log" "asynchronous_metric_log" "part_log" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "clickhouse-config") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
data:
  {{- with $systemLogLevel }}
  log-level.xml: |
    <clickhouse>
      <logger>
        <level>{{ . }}</level>
      </logger>
      <text_log>
        <level>{{ . }}</level>
      </text_log>
    </clickhouse>
  {{- end }}
  {{- with $systemLogTTLDays }}
  log-ttl.xml: |
    <clickhouse>
      {{- $ttlDays := . }}
      {{- range $systemLogTables }}
      <{{ . }}>
        <ttl>event_date + INTERVAL {{ $ttlDays }} DAY DELETE</ttl>
      </{{ . }}>
      {{- end }}
    </clickhouse>
  {{- end }}
  users.xml: |
    <clickhouse>
      <users>
        <default>
          <password>{{ .Values.clickhouse.embedded.password }}</password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </default>
      </users>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "clickhouse") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tuist.componentLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: {{ .Values.clickhouse.embedded.service.nativePort }}
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "clickhouse") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "tuist.componentName" (dict "root" . "component" "clickhouse") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tuist.componentLabels" (dict "root" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tuist.componentLabels" (dict "root" . "component" "clickhouse") | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
{{ include "tuist.podScheduling" . | nindent 6 }}
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.embedded.image.repository }}:{{ .Values.clickhouse.embedded.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.embedded.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            {{- with $systemLogLevel }}
            - name: config
              mountPath: /etc/clickhouse-server/config.d/tuist-log-level.xml
              subPath: log-level.xml
            {{- end }}
            {{- with $systemLogTTLDays }}
            - name: config
              mountPath: /etc/clickhouse-server/config.d/tuist-log-ttl.xml
              subPath: log-ttl.xml
            {{- end }}
            - name: config
              mountPath: /etc/clickhouse-server/users.d/users.xml
              subPath: users.xml
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.clickhouse.embedded.resources | nindent 12 }}
      volumes:
        {{- if not .Values.clickhouse.embedded.persistence.create }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "tuist.componentName" (dict "root" . "component" "clickhouse-config") }}
  {{- if .Values.clickhouse.embedded.persistence.create }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.clickhouse.embedded.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.embedded.persistence.size }}
        {{- if .Values.clickhouse.embedded.persistence.storageClassName }}
        storageClassName: {{ .Values.clickhouse.embedded.persistence.storageClassName }}
        {{- end }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "clickhouse-init") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "tuist.componentLabels" (dict "root" . "component" "clickhouse-init") | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
{{ include "tuist.podScheduling" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: clickhouse-init
          image: "{{ .Values.clickhouse.embedded.image.repository }}:{{ .Values.clickhouse.embedded.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.embedded.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until clickhouse-client --host {{ include "tuist.componentName" (dict "root" . "component" "clickhouse") }} --port {{ .Values.clickhouse.embedded.service.nativePort }} --query "SELECT 1"; do
                sleep 2
              done
              clickhouse-client --host {{ include "tuist.componentName" (dict "root" . "component" "clickhouse") }} --port {{ .Values.clickhouse.embedded.service.nativePort }} --query "CREATE DATABASE IF NOT EXISTS {{ .Values.clickhouse.embedded.database }}"
{{- if ne .Values.clickhouse.embedded.systemLogs.rotatedTables "ignore" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tuist.componentName" (dict "root" $ "component" "clickhouse-rotated-log-tables") }}
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: clickhouse-rotated-log-tables
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "tuist.componentLabels" (dict "root" $ "component" "clickhouse-rotated-log-tables") | nindent 8 }}
        {{- with $.Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
{{ include "tuist.podScheduling" $ | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: clickhouse-rotated-log-tables
          image: "{{ $.Values.clickhouse.embedded.image.repository }}:{{ $.Values.clickhouse.embedded.image.tag }}"
          imagePullPolicy: {{ $.Values.clickhouse.embedded.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_PASSWORD
              value: {{ $.Values.clickhouse.embedded.password | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              CH="clickhouse-client --host {{ include "tuist.componentName" (dict "root" $ "component" "clickhouse") }} --port {{ $.Values.clickhouse.embedded.service.nativePort }} --password $CLICKHOUSE_PASSWORD"
              # ClickHouse is legitimately absent when an operator switches
              # clickhouse.mode from external to embedded, and there is nothing
              # to reclaim on such an install, so skip rather than block the
              # release.
              deadline=$(( $(date +%s) + 120 ))
              until $CH --query "SELECT 1" >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "ClickHouse unreachable after 120s; skipping" >&2
                  exit 0
                fi
                sleep 2
              done
              # Every `<name>_N` table qualifies, not just the ones declared in
              # log-ttl.xml. ClickHouse stops managing a table once it rotates
              # it aside, so these are inert copies no query targets, and the
              # ones it leaves behind for tables we cannot configure at all are
              # exactly the ones worth reclaiming.
              TABLES=$($CH --query "SELECT name FROM system.tables WHERE database = 'system' AND engine = 'MergeTree' AND match(name, '_log_[0-9]+\$')")
              for table in $TABLES; do
                echo "dropping system.$table"
                $CH --query "DROP TABLE system.\`$table\`"
              done
{{- end }}
{{- end }}
