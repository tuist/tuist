{{- if and .Values.macosFleet.enabled .Values.macosFleet.tailscale.enabled .Values.macosFleet.tailscale.externalSecrets.enabled }}
{{- $name := include "tuist.componentName" (dict "root" . "component" "capi-scaleway-applesilicon-tailscale") }}
---
# Tailscale join credential for the Mac mini fleet, and for the
# xcresult processor's Tart VMs which share it. The CAPI provider's
# bootstrap reads this Secret per Machine reconcile (via
# credentials.Manager.GetTailscaleAuthKey) and feeds the value to the
# bootstrap's `tailscale up`.
#
# The value is an OAuth client *secret*, not a pre-auth key, and the
# distinction is the whole point. Tailscale caps pre-auth keys at 90
# days with no way to extend them, so a fleet that joins with one has
# a scheduled outage on the calendar and only a human rotating it on
# time in the way. On 2026-08-12 that key expired and took the entire
# `:process_xcresult` queue offline for ~13h: the processor VMs are
# ephemeral, so unlike the Mac mini hosts (which join once and keep
# their identity) every Pod roll had to perform a fresh join, and the
# guest's launchd chain refuses to start the release without one, so
# every Pod kept reporting `1/1 Running` with no BEAM inside it. ESO
# reported `SecretSynced` / `Ready=True` throughout; sync health says
# nothing about whether the synced value is still valid.
#
# `tailscale up --auth-key=<oauth-client-secret>` mints a fresh key
# per join, and OAuth clients don't expire, so there is no longer a
# date to miss. The consumers pin `ephemeral` and `preauthorized`
# explicitly and name the tag at join time, both of which an
# OAuth-minted key requires; see infra/xcresult-processor-image/
# tailscale-up.sh and infra/macos-host-bootstrap/bootstrap.go.
#
# Provisioning a new env: create an OAuth client in the Tailscale
# admin console with the `auth_keys` write scope, restricted to that
# env's `tag:tuist-macmini-<env>` (declared under tagOwners in
# infra/tailscale/acls.json), and store its secret in the env vault's
# TAILSCALE item. Rotation, if ever needed, is unchanged: bump the
# 1Password item, ESO resyncs within `refreshInterval`, the next
# Machine reconcile picks it up. Existing hosts keep their tailnet
# identity across rotations: the credential only authenticates the
# *initial* join.
#
# Detection for the failure class lives in
# infra/helm/k8s-monitoring/alerts.md; see
# infra/xcresult-processor-image/AGENTS.md for the full failure mode.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: capi-scaleway-applesilicon
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.macosFleet.tailscale.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.macosFleet.tailscale.externalSecrets.storeRef.name | default "onepassword" }}
    kind: {{ .Values.macosFleet.tailscale.externalSecrets.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    - secretKey: auth-key
      remoteRef:
        key: "{{ .Values.macosFleet.tailscale.externalSecrets.item }}/{{ .Values.macosFleet.tailscale.externalSecrets.fields.authKey | default "auth-key" }}"
{{- end }}
