{{- if ne .Release.Namespace "tuist-staging" }}
{{- fail "OpenBao validation RBAC is staging-only" }}
{{- end }}
# Disposable OpenBao validation only. Remove through the same deployment
# workflow after the rehearsal; the operator identity gains no permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kura-openbao-validation-reviewer
  namespace: tuist-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kura-openbao-validation-reviewer
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kura-openbao-validation-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kura-openbao-validation-reviewer
subjects:
  - kind: ServiceAccount
    name: kura-openbao-validation-reviewer
    namespace: tuist-staging
