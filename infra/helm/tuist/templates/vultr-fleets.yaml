{{- /*
Vultr bare-metal fleets, keyed by purpose, one per node pool. Same shape as
ovh-fleets.yaml: a VultrMachineTemplate plus a MachineDeployment named
tuist-tuist-vultr-fleet-<key>, all sharing the env's VULTR_API and
VULTR_FLEET_SSH (one Vultr account; the per-fleet tag plus region scope
adoption).

Adoption is by TAG rather than by a name prefix, which is the one structural
difference from the OVH fleets. Vultr's list endpoint filters labels by exact
match, so a fleet prefix returns nothing; the tag is the Dedibox shape and is
what keeps a staging fleet off a prod box.
*/ -}}
{{- if .Values.capi.enabled }}
{{- $clusterName := include "tuist.componentName" (dict "root" . "component" "capi") }}
{{- $bootstrapSecret := include "tuist.componentName" (dict "root" . "component" "noop-bootstrap") }}
{{- range $key, $fleet := .Values.vultrFleets }}
{{- if $fleet.enabled }}
{{- $fleetName := include "tuist.componentName" (dict "root" $ "component" (printf "vultr-fleet-%s" $key)) }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: VultrMachineTemplate
metadata:
  name: {{ $fleetName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vultr-fleet
    tuist.dev/fleet: {{ $fleetName }}
spec:
  template:
    spec:
      adoptTag: {{ required (printf "vultrFleets.%s.machine.adoptTag is required: it is the per-env adoption boundary" $key) $fleet.machine.adoptTag | quote }}
      region: {{ $fleet.machine.region | default "" | quote }}
      plan: {{ $fleet.machine.plan | default "" | quote }}
      osID: {{ $fleet.machine.osID | default 2284 }}
      fleetName: {{ $fleetName | quote }}
      nodeTaints:
        {{- with $fleet.machine.nodeTaints }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - key: tuist.dev/kura-cache
          value: "true"
          effect: NoSchedule
        {{- end }}
      {{- with $fleet.machine.egressBudgetMbps }}
      egressBudgetMbps: {{ . }}
      {{- end }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $fleetName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vultr-fleet
    tuist.dev/fleet: {{ $fleetName }}
    cluster.x-k8s.io/cluster-name: {{ $clusterName }}
spec:
  clusterName: {{ $clusterName }}
  replicas: {{ dig "replicas" 1 $fleet }}
  strategy:
    type: OnDelete
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      tuist.dev/fleet: {{ $fleetName }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $clusterName }}
        tuist.dev/fleet: {{ $fleetName }}
        node.cluster.x-k8s.io/pool: {{ $fleet.nodePool | default (printf "kura-%s" $key) | quote }}
    spec:
      clusterName: {{ $clusterName }}
      version: {{ $fleet.kubernetesVersion | default "v1.34.8" | quote }}
      bootstrap:
        dataSecretName: {{ $bootstrapSecret }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: VultrMachineTemplate
        name: {{ $fleetName }}
{{- end }}
{{- end }}
{{- end }}
