{{- if and .Values.capi.enabled .Values.rackFleet.enabled .Values.rackFleet.sshExternalSecret.enabled }}
{{- $fleetName := include "tuist.rackFleetName" . }}
---
# ESO syncs the rack fleet's SSH keypair and the service account's password.
#
# Unlike every provider-backed fleet, this Secret is not optional and the
# controller will never mint a replacement for it. Rack hosts are keyed and
# given their account by MDM before the cluster ever sees them, so a credential
# generated in-cluster is one no host has heard of: a minted SSH key fails every
# dial forever, and a minted password is XOR'd into /etc/kcpassword, which
# breaks auto-login — so Virtualization.framework has no console and every Tart
# VM on that host fails to start. `ReadFleetSSHCredentials` therefore errors and
# requeues rather than generating, which makes an ESO outage a delay instead of
# a broken fleet.
#
# `sudo-password` is the service account's REAL login password, not a value we
# choose. It is what /etc/kcpassword is built from, so it has to match what MDM
# provisioned.
#
# Deliberately NOT a pre-install hook: a hook's before-hook-creation delete
# policy would GC the Secret for a window on each upgrade, and a fleet whose
# credential briefly vanishes stops converging until the next sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fleetName }}-ssh
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-fleet
spec:
  refreshInterval: {{ .Values.rackFleet.sshExternalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.rackFleet.sshExternalSecret.storeRef.name | default "onepassword" }}
    kind: {{ .Values.rackFleet.sshExternalSecret.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $fleetName }}-ssh
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: "{{ required "rackFleet.sshExternalSecret.item is required when sshExternalSecret.enabled" .Values.rackFleet.sshExternalSecret.item }}/{{ .Values.rackFleet.sshExternalSecret.fields.privateKey | default "private-key" }}"
    - secretKey: id_ed25519.pub
      remoteRef:
        key: "{{ .Values.rackFleet.sshExternalSecret.item }}/{{ .Values.rackFleet.sshExternalSecret.fields.publicKey | default "public-key" }}"
    - secretKey: sudo-password
      remoteRef:
        key: "{{ .Values.rackFleet.sshExternalSecret.item }}/{{ .Values.rackFleet.sshExternalSecret.fields.sudoPassword | default "sudo-password" }}"
{{- end }}
{{- if and .Values.capi.enabled .Values.rackFleet.enabled .Values.rackFleet.powerExternalSecret.enabled }}
{{- $powerSecret := .Values.rackFleet.powerExternalSecret.secretName | default (printf "%s-power" (include "tuist.rackFleetName" .)) }}
---
# ESO syncs the PDU / smart-plug credentials the power driver authenticates
# with. One Secret per endpoint credential, referenced by every RackHost plugged
# into it — a PDU has one credential and many outlets.
#
# Optional: an unauthenticated plug on a management segment needs none, and a
# RackHost with no credentialsSecretRef simply calls the endpoint unauthenticated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $powerSecret }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-fleet
spec:
  refreshInterval: {{ .Values.rackFleet.powerExternalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.rackFleet.powerExternalSecret.storeRef.name | default "onepassword" }}
    kind: {{ .Values.rackFleet.powerExternalSecret.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $powerSecret }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "{{ required "rackFleet.powerExternalSecret.item is required when powerExternalSecret.enabled" .Values.rackFleet.powerExternalSecret.item }}/{{ .Values.rackFleet.powerExternalSecret.fields.username | default "username" }}"
    - secretKey: password
      remoteRef:
        key: "{{ .Values.rackFleet.powerExternalSecret.item }}/{{ .Values.rackFleet.powerExternalSecret.fields.password | default "password" }}"
{{- end }}
