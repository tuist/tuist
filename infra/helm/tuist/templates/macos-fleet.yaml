{{- if and .Values.capi.enabled .Values.macosFleet.enabled }}
{{- $fleetName := include "tuist.macosFleetName" . }}
{{- $clusterName := include "tuist.componentName" (dict "root" . "component" "capi") }}
{{- $bootstrapSecret := include "tuist.componentName" (dict "root" . "component" "noop-bootstrap") }}
{{- /*
Mac mini fleet — declarative.

MachineDeployment owns a MachineSet, which creates Machines per
replica; each Machine.spec.infrastructureRef points at a
per-replica ScalewayAppleSiliconMachine cloned from the
MachineTemplate below. Updates to the template (SKU change, OS
bump) propagate via MachineSet rotation; `OnDelete` strategy
keeps Ready Machines alive across template changes — physical
Mac minis are expensive to churn (Scaleway 24h-floor on server
release), so the operator hand-rolls each Machine via
`kubectl delete` when a planned replacement is wanted.

Per-Machine `hostCPU` / `hostMemoryMB` are stamped on the
MachineTemplate so a single operator instance can manage
heterogeneous fleets (xcresult-fleet + runners-fleet on
different SKUs); falls back to the operator-global
`--tartkubelet-host-{cpu,memory-mb}` defaults when unset.

The template name carries a hash of its own spec, so a spec
change renders a new object rather than an edit to the existing
one. Helm's three-way merge only patches fields that differ
between the previous and current rendered manifest, so a field
added to a template that already exists in-cluster is never
applied and the object stays stale indefinitely — every later
deploy sees the field as unchanged and emits no patch. Creating
a new object instead always writes the full spec.
*/ -}}
{{- $machineSpec := dict
      "type" (.Values.macosFleet.machine.type | default "M2-L")
      "zone" (.Values.macosFleet.machine.zone | default "fr-par-1")
      "os" (.Values.macosFleet.machine.os | default "Tahoe")
      "fleetName" $fleetName
      "adoptPoolPrefix" (required "macosFleet.adoptPoolPrefix is required" .Values.macosFleet.adoptPoolPrefix)
}}
{{- with .Values.macosFleet.machine.hostCPU }}
{{- $_ := set $machineSpec "hostCPU" . }}
{{- end }}
{{- with .Values.macosFleet.machine.hostMemoryMB }}
{{- $_ := set $machineSpec "hostMemoryMB" . }}
{{- end }}
{{- $templateName := printf "%s-%s" $fleetName (toYaml $machineSpec | sha256sum | trunc 8) }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ScalewayAppleSiliconMachineTemplate
metadata:
  name: {{ $templateName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # A superseded template stays referenced by the MachineSet that
    # was cloned from it, which outlives the template under OnDelete.
    helm.sh/resource-policy: keep
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: macos-fleet
    tuist.dev/fleet: {{ $fleetName }}
spec:
  template:
    spec:
      {{- toYaml $machineSpec | nindent 6 }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $fleetName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: macos-fleet
    tuist.dev/fleet: {{ $fleetName }}
    cluster.x-k8s.io/cluster-name: {{ $clusterName }}
spec:
  clusterName: {{ $clusterName }}
  replicas: {{ .Values.macosFleet.replicas | default 1 }}
  # OnDelete: don't auto-roll Ready Mac minis when the template
  # changes — physical churn is expensive (Scaleway 24h-floor)
  # and the existing Mac minis are doing real work. Operator
  # rolls by `kubectl delete` on the Machines they want
  # replaced, MachineSet creates fresh ones from the new template.
  strategy:
    type: OnDelete
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      tuist.dev/fleet: {{ $fleetName }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $clusterName }}
        tuist.dev/fleet: {{ $fleetName }}
    spec:
      clusterName: {{ $clusterName }}
      bootstrap:
        dataSecretName: {{ $bootstrapSecret }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ScalewayAppleSiliconMachineTemplate
        name: {{ $templateName }}
{{- end }}
