{{- if .Values.kuraVolumesCSI.enabled }}
{{- /*
kura-volumes.tuist.dev: the CSI driver behind the kura-encrypted-nvme
StorageClass (infra/kura-volumes-csi). Each Kura data volume is a LUKS2
container on a logical volume in the node's kuraVolumesCSI.volumeGroup, or on a
preallocated file under /data/kura-volumes on a node without one, opened with a
key the node plugin fetches from the server per stage, authenticated by its projected
ServiceAccount token. The server authorizes those requests by the token's
username, so the namespace and ServiceAccount names below are part of the
contract and not configurable.

The provisioner runs as a sidecar on every node (--node-deployment): the volume
is node-local, so the instance on the node the scheduler picked is the one that
creates it.

Nothing provisions on this class until the server places Kura instances on it
through regional LVM enrollment or the legacy account encryption flag, so the
driver can be deployed first.

Every object here is helm.sh/resource-policy: keep. A release whose chart
lacks them (a rollback, or a branch cut before them) would otherwise remove
the driver while volumes exist, and only the driver can unmount, close and
delete those: their mounts and dm-crypt mappings would stay open on the node
and their PVs stay Released. Retiring the driver is a manual step once no PV
of the class is left.
*/ -}}
{{- $namespace := "kura-volumes" }}
{{- $name := "kura-volumes-csi-node" }}
{{- $driver := "kura-volumes.tuist.dev" }}
{{- $imageTag := .Values.kuraVolumesCSI.image.tag }}
{{- if not $imageTag }}
{{- fail "kuraVolumesCSI.image.tag is required: a privileged storage DaemonSet on :latest silently drifts and surfaces in production after the next push to ghcr." }}
{{- end }}
{{- $pools := include "tuist.kuraCachePools" . | fromJsonArray }}
{{- $rackPools := .Values.kuraVolumesCSI.rackPools | default list }}
{{- $pools = without $pools "" }}
{{- range $rackPools }}
{{- $pools = without $pools . }}
{{- end }}
{{- if not (or $pools $rackPools) }}
{{- fail "kuraVolumesCSI.enabled needs at least one Kura cache pool (kuraFleet, ovhFleet, ovhFleets or vultrFleets) to run the node plugin on" }}
{{- end }}
{{- $keyServiceUrl := .Values.kuraVolumesCSI.keyServiceUrl | default .Values.server.appUrl }}
{{- $pluginDir := printf "/var/lib/kubelet/plugins/%s" $driver }}
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
    # Privileged, bidirectional mount propagation and host devices.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
---
# The external-provisioner's runner role (kubernetes-csi/external-provisioner
# v5.3.0, deploy/kubernetes/rbac.yaml). Its namespaced role is not needed: a
# node deployment runs no leader election and this driver publishes no
# CSIStorageCapacity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $name }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots, volumesnapshotcontents]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # The node plugin advertises its volume group's room for Kura volumes as
  # the tuist.dev/kura-disk extended resource.
  - apiGroups: [""]
    resources: [nodes/status]
    verbs: [patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $name }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $driver }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes: [Persistent]
  # The volume is a LUKS container the driver formats itself; kubelet must not
  # chown it on every mount.
  fsGroupPolicy: None
  storageCapacity: false
  requiresRepublish: false
  seLinuxMount: false
---
# Same lifecycle as scw-local-nvme: a volume is carved on the node the Kura pod
# lands on and is disposable cache, so it is deleted with its claim and never
# expanded in place (the controller replaces it one replica at a time instead).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: kura-encrypted-nvme
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
provisioner: {{ $driver }}
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
# Unencrypted Kura volumes as plain XFS logical volumes in the node's volume
# group. Only nodes with the group can hold one, and the region's Kura pods
# request tuist.dev/kura-disk, which only those nodes advertise.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: kura-lvm-nvme
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
provisioner: {{ $driver }}
parameters:
  encryption: none
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
{{- if $pools }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura-volumes-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  # Restarting the plugin leaves live volumes alone: their dm-crypt mappings and
  # mounts belong to the host, not to the container.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kura-volumes-csi
    spec:
      serviceAccountName: {{ $name }}
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.cluster.x-k8s.io/pool
                    operator: In
                    values:
                      {{- toYaml $pools | nindent 22 }}
      tolerations:
        - key: tuist.dev/runner-cache
          operator: Exists
          effect: NoSchedule
        - key: tuist.dev/kura-cache
          operator: Exists
          effect: NoSchedule
      containers:
        - name: driver
          image: "{{ .Values.kuraVolumesCSI.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.kuraVolumesCSI.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            - --state-dir=/data/kura-volumes
            - --key-service-url={{ $keyServiceUrl }}
            - --token-path=/var/run/secrets/kura-volume-keys/token
            {{- with .Values.kuraVolumesCSI.volumeGroup }}
            - --volume-group={{ . }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Loop devices, dm-crypt and mounts that propagate back to kubelet.
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # kubelet sees this path; on fleet boxes it is a bind mount of
            # /data/kubelet, which the hostPath resolves through.
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: state-dir
              mountPath: /data/kura-volumes
            - name: dev
              mountPath: /dev
            # Shared with the host so its LVM tools and the driver take the same
            # metadata locks.
            - name: lvm-lock
              mountPath: /run/lock/lvm
            - name: volume-key-token
              mountPath: /var/run/secrets/kura-volume-keys
              readOnly: true
          resources:
            {{- toYaml .Values.kuraVolumesCSI.resources.driver | nindent 12 }}
        - name: node-driver-registrar
          image: {{ .Values.kuraVolumesCSI.nodeDriverRegistrar.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $pluginDir }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            {{- toYaml .Values.kuraVolumesCSI.resources.sidecar | nindent 12 }}
        - name: csi-provisioner
          image: {{ .Values.kuraVolumesCSI.provisioner.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --node-deployment=true
            # Kura claims are WaitForFirstConsumer; no instance races to own an
            # immediate-binding claim.
            - --node-deployment-immediate-binding=false
            - --strict-topology=true
            - --immediate-topology=false
            - --extra-create-metadata=true
            - --feature-gates=Topology=true
            - --timeout=60s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            {{- toYaml .Values.kuraVolumesCSI.resources.sidecar | nindent 12 }}
      volumes:
        - name: lvm-lock
          hostPath:
            path: /run/lock/lvm
            type: DirectoryOrCreate
        - name: socket-dir
          hostPath:
            path: {{ $pluginDir }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: state-dir
          hostPath:
            path: /data/kura-volumes
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: volume-key-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kura-volume-keys.tuist.dev
                  expirationSeconds: 600
                  path: token
{{- end }}
{{- end }}
