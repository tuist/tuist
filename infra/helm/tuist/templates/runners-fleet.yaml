{{- /*
Per-SKU host knobs, shared by the default group and every
`machineGroups` entry. Each is omitted when unset so the operator
global applies, which is also what keeps an existing fleet's
rendered template byte-identical to what it had before these
fields existed — an inert field still changes the spec hash, and on
this chart a MachineTemplate rename is not free.
*/ -}}
{{- define "tuist.runnersFleet.machineSpec" -}}
{{- $machine := .machine | default dict -}}
{{- /*
`toString` on the string-typed fields restores what the pre-helper form
got from `| quote`. A values file is safe either way — YAML already
hands `type: "26"` over as a Go string and toYaml re-quotes it — but
`--set runnersFleet.machine.type=26` coerces to an integer, which toYaml
emits bare and the CRD's `type: string` then rejects at apply time.
Nothing in the deploy workflow sets these keys, so this is belt and
braces; it leaves today's render byte-identical.
*/ -}}
{{- $spec := dict
      "type" ($machine.type | default "M2-L" | toString)
      "zone" ($machine.zone | default "fr-par-1" | toString)
      "os" ($machine.os | default "Tahoe" | toString)
      "fleetName" (.fleetName | toString)
      "adoptPoolPrefix" (.adoptPoolPrefix | toString)
-}}
{{- /*
`with` is right for the sizing fields: 0 is nonsense for all of them
(a host with no CPU, no memory or no Pod ceiling does not exist), so
falsy-erasure and "unset" mean the same thing.
*/ -}}
{{- with $machine.hostCPU }}{{- $_ := set $spec "hostCPU" . }}{{- end }}
{{- with $machine.hostMemoryMB }}{{- $_ := set $spec "hostMemoryMB" . }}{{- end }}
{{- with $machine.maxPods }}{{- $_ := set $spec "maxPods" . }}{{- end }}
{{- with $machine.guestCapacity }}{{- $_ := set $spec "guestCapacity" . }}{{- end }}
{{- /*
The cache quota is the exception and needs PRESENCE, not truthiness: 0
means "cache volumes off on this host" and `with` would swallow it, so
a group asking to run cold would silently inherit the fleet's non-zero
global instead. `hasKey` alone is not enough either — the documented
placeholder in values.yaml is an explicit null, which is a present key
with no value. The spec field is a pointer for the same reason.
*/ -}}
{{- if and (hasKey $machine "runnerCacheVolumeGiB") (not (kindIs "invalid" $machine.runnerCacheVolumeGiB)) }}
{{- $_ := set $spec "runnerCacheVolumeGiB" $machine.runnerCacheVolumeGiB }}
{{- end }}
{{- toYaml $spec -}}
{{- end -}}
{{- if and .Values.capi.enabled .Values.runnersFleet.enabled }}
{{- $fleetName := include "tuist.runnersFleetName" . }}
{{- $clusterName := include "tuist.componentName" (dict "root" . "component" "capi") }}
{{- $bootstrapSecret := include "tuist.componentName" (dict "root" . "component" "noop-bootstrap") }}
{{- /*
Customer-runner Mac mini fleet. Sibling of macos-fleet.yaml,
provisioned by the same cluster-api-provider-tuist
operator from the same Scaleway IAM credentials.

See macos-fleet.yaml for the rationale on the
MachineDeployment + ScalewayAppleSiliconMachineTemplate shape.
Same primitive — one MachineDeployment per pool; CAPI core
drives Machine lifecycle; our infra-Machine controller
provisions + bootstraps the Scaleway host.

## Mixed-SKU fleets

`machineGroups` renders an ADDITIONAL MachineDeployment +
MachineTemplate per entry, so one fleet can span several Scaleway
SKUs — an M2-L running one guest per host next to an M4-XL running
two. Two labels do the work and they are deliberately different:

  * The MachineTemplate's `fleetName` is the SAME for every group.
    It becomes the `tuist.dev/fleet` NODE label (via the operator's
    machineNodeLabels → tart-kubelet `--node-labels`), which is what
    RunnerPool.fleetSelector matches and what the autoscaler sums
    capacity over. Sharing it is the entire point: every pool can
    schedule onto every group's hosts, and the fleet has one
    capacity domain rather than one per SKU.

  * The Machine OBJECT label `tuist.dev/fleet` is per group
    (`<fleet>-<group>`). CAPI label selectors are subset matches, so
    two MachineDeployments sharing this value would each see the
    other's MachineSets as their own and fight over them. Nothing
    reads this label except the MachineSet/MachineDeployment
    selectors — every scheduling and capacity consumer reads the
    Node label above — so making it unique per group is free.

Capacity is NOT the host count on a mixed fleet. A host admits
`hostMemoryMB / podMemoryMB` guests, so an M2-L at 14336 contributes
one slot and an M4-XL at 28672 contributes two; the autoscaler does
exactly this division (macosFleetAllocatableMemory ÷ perPodCost), so
`maxReplicas` on the Xcode pools bounds SLOTS, not minis.
*/ -}}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ScalewayAppleSiliconMachineTemplate
metadata:
  name: {{ $fleetName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: runners-fleet
    tuist.dev/fleet: {{ $fleetName }}
spec:
  template:
    spec:
      {{- /*
      Fixed template name, unlike macos-fleet.yaml's spec-hashed one.
      Not a preference: this object predates that pattern and a live
      MachineSet references it by name, so renaming it now would have
      Helm delete the template its own Machines are cloned from and
      wedge the next scale-up with InfrastructureTemplateCloningFailed.

      New `machineGroups` below do get hashed names — they have no
      installed base to strand — and carry
      `helm.sh/resource-policy: keep`, which is the half of that
      pattern that makes it safe: hashing renames the object on a spec
      change, and the annotation is what stops Helm pruning the
      superseded one out from under the MachineSet still cloning from
      it.
      */}}
      {{- include "tuist.runnersFleet.machineSpec" (dict
            "machine" .Values.runnersFleet.machine
            "fleetName" $fleetName
            "adoptPoolPrefix" (required "runnersFleet.adoptPoolPrefix is required" .Values.runnersFleet.adoptPoolPrefix)
          ) | nindent 6 }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $fleetName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: runners-fleet
    tuist.dev/fleet: {{ $fleetName }}
    cluster.x-k8s.io/cluster-name: {{ $clusterName }}
spec:
  clusterName: {{ $clusterName }}
  replicas: {{ .Values.runnersFleet.hostCount | default 0 }}
  strategy:
    type: OnDelete
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      tuist.dev/fleet: {{ $fleetName }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $clusterName }}
        tuist.dev/fleet: {{ $fleetName }}
    spec:
      clusterName: {{ $clusterName }}
      bootstrap:
        dataSecretName: {{ $bootstrapSecret }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ScalewayAppleSiliconMachineTemplate
        name: {{ $fleetName }}
{{- range $group := .Values.runnersFleet.machineGroups | default list }}
{{- $groupName := required "runnersFleet.machineGroups[].name is required" $group.name }}
{{- $groupFleet := printf "%s-%s" $fleetName $groupName }}
{{- $machineSpec := include "tuist.runnersFleet.machineSpec" (dict
      "machine" $group.machine
      "fleetName" $fleetName
      "adoptPoolPrefix" ($group.adoptPoolPrefix | default $.Values.runnersFleet.adoptPoolPrefix | required (printf "runnersFleet.machineGroups[%s].adoptPoolPrefix or runnersFleet.adoptPoolPrefix is required" $groupName))
    ) }}
{{- $templateName := printf "%s-%s" $groupFleet ($machineSpec | sha256sum | trunc 8) }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ScalewayAppleSiliconMachineTemplate
metadata:
  name: {{ $templateName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # A superseded template stays referenced by the MachineSet that
    # was cloned from it, which outlives the template under OnDelete.
    # Without this, editing a group's `machine` block renders a new
    # name, Helm prunes the old object, and the MachineSet still
    # holding live Machines can no longer clone — the next
    # replacement or scale-up fails InfrastructureTemplateCloningFailed
    # with nothing short of hand-recreating the template to repair it.
    helm.sh/resource-policy: keep
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runners-fleet
    tuist.dev/fleet: {{ $groupFleet }}
    tuist.dev/fleet-group: {{ $groupName }}
spec:
  template:
    spec:
      {{- $machineSpec | nindent 6 }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $groupFleet }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runners-fleet
    tuist.dev/fleet: {{ $groupFleet }}
    tuist.dev/fleet-group: {{ $groupName }}
    cluster.x-k8s.io/cluster-name: {{ $clusterName }}
spec:
  clusterName: {{ $clusterName }}
  replicas: {{ $group.hostCount | default 0 }}
  strategy:
    type: OnDelete
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $clusterName }}
      tuist.dev/fleet: {{ $groupFleet }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $clusterName }}
        tuist.dev/fleet: {{ $groupFleet }}
    spec:
      clusterName: {{ $clusterName }}
      bootstrap:
        dataSecretName: {{ $bootstrapSecret }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ScalewayAppleSiliconMachineTemplate
        name: {{ $templateName }}
{{- end }}
{{- end }}
