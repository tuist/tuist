{{- if and .Values.server.enabled .Values.server.cluster.enabled (not .Values.server.cluster.cookieExistingSecret) }}
{{- $name := include "tuist.componentName" (dict "root" . "component" "server-cluster") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $cookie := "" }}
{{- if $existing }}
  {{- $encoded := get ($existing.data | default dict) .Values.server.cluster.cookieExistingSecretKey | default "" }}
  {{- if not $encoded }}
    {{- fail "The existing server cluster Secret is missing the configured cookie key. Restore that key or explicitly migrate cookieExistingSecret; do not rotate a live cluster cookie implicitly." }}
  {{- end }}
  {{- $cookie = $encoded | b64dec }}
  {{- if not $cookie }}
    {{- fail "The existing server cluster cookie must not be empty." }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.server.cluster.cookieExistingSecretKey }}: {{ $cookie | default (randAlphaNum 64) | quote }}
{{- end }}
