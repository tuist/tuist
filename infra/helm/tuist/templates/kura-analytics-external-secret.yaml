{{- if and .Values.kuraController.enabled .Values.kuraController.analytics.enabled }}
{{- if not (and .Values.server.enabled .Values.server.config.managedSecrets .Values.kuraController.sharedSecrets.enabled) }}
{{- fail "kuraController.analytics.enabled requires server.enabled, server.config.managedSecrets, and kuraController.sharedSecrets.enabled" }}
{{- end }}
{{- $serverName := include "tuist.componentName" (dict "root" . "component" "server") }}
{{- $externalSecrets := .Values.server.config.externalSecrets }}
# Use the same source and trimming as the server's TUIST_CACHE_API_KEY.
# The controller watches this shared Secret and rolls runtime pods on change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kura-analytics
  namespace: {{ .Values.kuraController.namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: kura
spec:
  refreshInterval: {{ $externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $externalSecrets.storeRef.name | default "onepassword" }}
    kind: {{ $externalSecrets.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: kura-shared-secrets
    creationPolicy: Merge
    template:
      engineVersion: v2
      data:
        # Absolute (trailing dot): `ndots: 5` would otherwise expand this
        # 4-dot name against every search domain first, so a Kura node pays
        # three NXDOMAIN round trips to CoreDNS before the one that answers.
        # Those round trips cross the WAN from a node outside the control
        # plane's region. The webhook is mounted by path on the endpoint, so
        # the trailing dot the Host header carries matches nothing on it.
        KURA_ANALYTICS_SERVER_URL: {{ printf "http://%s.%s.svc.cluster.local.:%v" $serverName .Release.Namespace .Values.server.service.port | quote }}
        KURA_ANALYTICS_SIGNING_KEY: "{{ `{{ .cache_api_key | trim }}` }}"
  data:
    - secretKey: cache_api_key
      remoteRef:
        key: "CACHE_API_KEY/password"
{{- end }}
