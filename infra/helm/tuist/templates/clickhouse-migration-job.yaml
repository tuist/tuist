{{- if and .Values.server.enabled .Values.clickhouse.managed.enabled .Values.clickhouse.managed.migration.enabled }}
{{- $secretName := include "tuist.componentName" (dict "root" . "component" "app-secrets") }}
{{- $objectStorageAccessKey := include "tuist.objectStorageAccessKey" . -}}
{{- $objectStorageSecretKey := include "tuist.objectStorageSecretKey" . -}}
{{- $task := .Values.clickhouse.managed.migration.task | quote }}
{{- $background := .Values.clickhouse.managed.migration.background }}
{{- $m := .Values.clickhouse.managed }}
{{- $chName := include "tuist.componentName" (dict "root" . "component" "clickhouse") }}
{{- $chSecretName := printf "%s-credentials" $chName }}
{{- /*
Runs one step of the ClickHouse migration (spec #73) against the in-cluster
server: cloning the schema from the system of record, backfilling the rows
that already exist, or checking that the two agree.

A `post-upgrade` hook rather than part of the migration Job, for two reasons
that are really the same one. The migration Job is a `pre-upgrade` hook, so it
runs before Helm applies the release's ordinary resources: the ClickHouse
StatefulSet is not running yet and the Secret holding its URL does not exist
yet. Both of those are exactly what this work needs. Running after the upgrade
means the server it talks to is the one the same release just deployed.

It is also the only way to invoke these tasks at all without write access to
the cluster, which is deliberate: the steps are then reviewable configuration
rather than something typed into a shell against production.

`task` selects the step, so an operator moves through the migration by
changing one value and deploying, and each step is recorded in the release
history rather than in someone's terminal.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
{{- if $background }}
  # Suffixed with the release revision, because a background Job is an ordinary
  # release resource and `spec.template` is immutable: without a new name each
  # revision, the next deploy would try to patch a Job it cannot patch.
  name: {{ include "tuist.componentName" (dict "root" . "component" (printf "clickhouse-%s-r%d" .Values.clickhouse.managed.migration.name (int .Release.Revision))) }}
{{- else }}
  # Named for the task, so moving to the next step creates a new Job rather
  # than colliding with the immutable `spec.template` of the previous one.
  name: {{ include "tuist.componentName" (dict "root" . "component" (printf "clickhouse-%s" .Values.clickhouse.managed.migration.name)) }}
{{- end }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-migration
  annotations:
{{- if $background }}
    # Not a hook, so helm does not wait for it: the deploy passes `--wait` but
    # not `--wait-for-jobs`, and a copy of the production dataset would
    # otherwise hold the release for hours and then fail it on the deadline.
    #
    # Kept, so that the deploy which rolls the *next* revision does not delete
    # a copy that is still running. Finished ones remove themselves.
    "helm.sh/resource-policy": keep
{{- else }}
    helm.sh/hook: post-upgrade,post-install
    helm.sh/hook-weight: "5"
    # Kept on failure so its logs can be read. The next deploy of the same
    # task replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
spec:
  backoffLimit: {{ .Values.clickhouse.managed.migration.backoffLimit }}
  # These steps move the whole dataset, so the ceiling is hours rather than
  # the minutes a schema migration takes.
  activeDeadlineSeconds: {{ .Values.clickhouse.managed.migration.activeDeadlineSeconds }}
{{- if $background }}
  ttlSecondsAfterFinished: {{ .Values.clickhouse.managed.migration.ttlSecondsAfterFinished }}
{{- end }}
  template:
    metadata:
      labels:
        {{- include "tuist.componentLabels" (dict "root" . "component" "clickhouse-migration") | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      # Wait for the destination before doing anything, because this Job can be
      # applied at the same moment the server it needs is being replaced.
      #
      # A background step is an ordinary release resource, so Kubernetes starts
      # its pod as soon as Helm applies the release, concurrently with any
      # rolling update of the ClickHouse StatefulSet. The backfill lost that
      # race twice: it began five seconds before the pod was recreated, got
      # `connection refused`, and `backoffLimit: 0` made that final. A hook
      # step does not race in the same way, and waiting costs it nothing.
      #
      # This is a wait, not a retry. Startup stops being a failure; a step that
      # fails once the server is answering still fails, and is re-run
      # deliberately rather than repeated automatically against a database.
      initContainers:
        - name: wait-for-clickhouse
          image: "{{ $m.image.repository }}:{{ $m.image.tag }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            # The `clickhouse` user in the server image, which is what
            # `clickhouse-client` expects to find a home directory for. Stated
            # here rather than inherited, because this pod sets no
            # pod-level security context: the step container is the server
            # image and runs as its own user.
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $chSecretName }}
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              i=0
              until clickhouse-client \
                      --host {{ $chName }} \
                      --port 9000 \
                      --user default \
                      --password "$CLICKHOUSE_PASSWORD" \
                      --query "SELECT 1" >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge {{ $m.migration.waitAttempts }} ]; then
                  echo "ClickHouse did not answer after {{ $m.migration.waitAttempts }} attempts; giving up." >&2
                  exit 1
                fi
                echo "Waiting for ClickHouse at {{ $chName }} (attempt $i)"
                sleep 5
              done
              echo "ClickHouse is answering."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      {{- with .Values.server.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse-migration
          image: {{ include "tuist.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - /app/bin/tuist
            - eval
            - {{ $task }}
          env:
            {{- if eq .Values.postgresql.mode "cnpg" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tuist.cnpgAppSecretName" . }}
                  key: uri
            - name: TUIST_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tuist.cnpgAppSecretName" . }}
                  key: uri
            {{- if .Values.server.managedSecrets }}
            - name: TUIST_DATABASE_RUNTIME_ROLE
              value: {{ .Values.postgresql.cnpg.roles.web.name | quote }}
            - name: TUIST_DATABASE_PROCESSOR_ROLE
              value: {{ .Values.postgresql.cnpg.roles.processor.name | quote }}
            - name: TUIST_DATABASE_SWIFT_REGISTRY_SYNC_ROLE
              value: {{ .Values.postgresql.cnpg.roles.swiftRegistrySync.name | quote }}
            - name: TUIST_DATABASE_GRAFANA_ROLE
              value: {{ .Values.postgresql.cnpg.roles.grafanaRo.name | quote }}
            {{- end }}
            - name: TUIST_USE_SSL_FOR_DATABASE
              value: "0"
            {{- end }}
            - name: TUIST_DATABASE_SCHEMA
              value: {{ .Values.postgresql.schema | quote }}
            {{- if not .Values.server.managedSecrets }}
            {{- if ne .Values.postgresql.mode "cnpg" }}
            {{- include "tuist.externalPostgresqlSecretEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "tuist.databaseUrl" . | quote }}
            - name: TUIST_USE_SSL_FOR_DATABASE
              value: {{ .Values.server.database.ssl | ternary "1" "0" | quote }}
            {{- end }}
            - name: TUIST_CLICKHOUSE_URL
              value: {{ include "tuist.clickhouseUrl" . | quote }}
            - name: TUIST_SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: server-secret-key-base
            {{- end }}
            - name: TUIST_APP_URL
              value: {{ .Values.server.appUrl | quote }}
            - name: TUIST_HOSTED
              value: {{ .Values.server.hosted | ternary "1" "0" | quote }}
            - name: TUIST_SELF_HOSTING_DEVELOPMENT_MODE
              value: {{ .Values.server.license.selfHostingDevelopmentMode | ternary "1" "0" | quote }}
            {{- include "tuist.licenseEnv" . | nindent 12 }}
            # Object-storage boot config must be set unconditionally. The
            # release runtime reads the selected provider at boot even though
            # the migration job does not actively upload or download artifacts.
            {{- include "tuist.serverObjectStorageEnv" . | nindent 12 }}
            - name: TUIST_S3_BUCKET_NAME
              value: {{ include "tuist.objectStorageBucketDefault" . | quote }}
            - name: TUIST_S3_ENDPOINT
              value: {{ include "tuist.objectStorageEndpoint" . | quote }}
            - name: TUIST_S3_REGION
              value: {{ include "tuist.objectStorageRegion" . | quote }}
            - name: TUIST_S3_VIRTUAL_HOST
              value: {{ .Values.server.s3.virtualHost | ternary "1" "0" | quote }}
            - name: TUIST_S3_BUCKET_AS_HOST
              value: {{ .Values.server.s3.bucketAsHost | ternary "1" "0" | quote }}
            {{- if $objectStorageAccessKey }}
            - name: TUIST_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: object-storage-access-key
            {{- end }}
            {{- if $objectStorageSecretKey }}
            - name: TUIST_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: object-storage-secret-key
            {{- end }}
            {{- include "tuist.opsClickHouseEnv" . | nindent 12 }}
            {{- include "tuist.clickhousePoolEnv" . | nindent 12 }}
            {{- include "tuist.clickhouseBareMetalEnv" . | nindent 12 }}
            {{- with .Values.clickhouse.managed.migration.cutoff }}
            - name: TUIST_CLICKHOUSE_BACKFILL_CUTOFF
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $serverConfigEnvFrom := include "tuist.serverConfigEnvFrom" . | trim }}
          {{- if or $serverConfigEnvFrom .Values.server.extraEnvFrom }}
          envFrom:
            {{- with $serverConfigEnvFrom }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.server.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.clickhouse.managed.migration.resources | nindent 12 }}
{{- end }}
