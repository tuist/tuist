{{- if and .Values.server.enabled .Values.server.config.opsClickHouse.enabled (not .Values.server.config.opsClickHouse.existingSecret) }}
{{- $secretName := include "tuist.opsClickHouseSecretName" . }}
{{- $passwordKey := .Values.server.config.opsClickHouse.passwordKey | default "password" }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if and $existingSecret $existingSecret.data }}
  {{- $existingData = $existingSecret.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-ops
  {{- if .Values.server.migrationJob.asHook }}
  annotations:
    # The migration service account is created at -12, managed external
    # secrets at -10, this credential at -5, and the migration job at -1.
    # Rendering happens before before-hook-creation deletes the prior Secret,
    # so lookup preserves the password across upgrades.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{ $passwordKey }}: {{ get $existingData $passwordKey | default "" | b64dec | default (printf "Aa1!%s" (randAlphaNum 60)) | quote }}
{{- end }}
