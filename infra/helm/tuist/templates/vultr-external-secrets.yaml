{{- /* The shared Vultr API credential, rendered when any vultrFleets entry is
   enabled: one Vultr account serves every Vultr fleet. Read from
   vultrFleet.externalSecrets, which is the shared config holder even though
   there is no singular vultrFleet MachineDeployment. */ -}}
{{- $vultrAny := false -}}
{{- range $f := .Values.vultrFleets }}{{- if $f.enabled }}{{- $vultrAny = true -}}{{- end }}{{- end }}
{{- if $vultrAny }}
{{- $name := include "tuist.componentName" (dict "root" . "component" "vultr") }}
---
# ESO syncs the Vultr API key the Vultr reconciler authenticates with, read from
# the env as VULTR_API_KEY, whose presence also gates the reconciler on
# (cmd/manager/main.go).
#
# The key alone is not enough: Vultr gates API keys on a source-IP allowlist the
# other providers have no equivalent of, and a fresh key's allowlist is empty, so
# it authenticates from nowhere. The cluster's egress address has to be on it or
# every call returns 401 with the address it rejected. That address is the
# Floating IP the stable-egress-controller pins to the md-egress pool.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: vultr
  annotations:
    # Pre-install/upgrade hook so Helm blocks on ESO fetching the key before the
    # operator Deployment lands, matching the OVH and Scaleway credentials.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ dig "externalSecrets" "refreshInterval" "1h" .Values.vultrFleet }}
  secretStoreRef:
    name: {{ dig "externalSecrets" "storeRef" "name" "onepassword" .Values.vultrFleet }}
    kind: {{ dig "externalSecrets" "storeRef" "kind" "ClusterSecretStore" .Values.vultrFleet }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: "{{ required "vultrFleet.externalSecrets.item is required when a vultrFleets entry is enabled" (dig "externalSecrets" "item" "" .Values.vultrFleet) }}/{{ dig "externalSecrets" "fields" "apiKey" "api-key" .Values.vultrFleet }}"
{{- end }}
