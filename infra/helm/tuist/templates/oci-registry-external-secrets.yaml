{{- if and .Values.ociRegistry.enabled .Values.ociRegistry.externalSecret.enabled }}
# Runtime secrets for the registry, from one 1P item.
#
# `httpSecret` signs upload state and must be identical across every
# instance an upload session might reach, so it is stored rather than
# generated per process.
#
# `htpasswd` is the push credential, kept as a ready-made htpasswd line
# because the value only exists at runtime and nginx wants a file.
# Rotating either is an `op item edit` plus a Pod restart — a mounted
# file changes, but neither process re-reads it on its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-secrets") }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: oci-registry
spec:
  refreshInterval: {{ .Values.ociRegistry.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.ociRegistry.externalSecret.storeRef.name | default "onepassword" }}
    kind: {{ .Values.ociRegistry.externalSecret.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "tuist.componentName" (dict "root" . "component" "oci-registry-secrets") }}
    creationPolicy: Owner
    # `| trim` for the same reason the object-storage and registry-cache
    # secrets do it: a 1P paste appends a newline. It would corrupt the
    # signing key and break nginx's line-wise htpasswd read.
    template:
      engineVersion: v2
      data:
        httpSecret: "{{ `{{ .httpSecret | trim }}` }}"
        {{- if .Values.ociRegistry.auth.enabled }}
        htpasswdReaders: "{{ `{{ .htpasswdReaders | trim }}` }}"
        htpasswdWriters: "{{ `{{ .htpasswdWriters | trim }}` }}"
        {{- end }}
  data:
    - secretKey: httpSecret
      remoteRef:
        key: "{{ .Values.ociRegistry.externalSecret.item }}/{{ .Values.ociRegistry.externalSecret.fields.httpSecret }}"
    {{- if .Values.ociRegistry.auth.enabled }}
    # Only requested when auth is on: ESO fails the whole ExternalSecret
    # on a missing field, so an install without auth must not ask for it.
    #
    # Readers carries every account, writers only those allowed to push,
    # so the fleet's pull credential cannot mutate the registry.
    - secretKey: htpasswdReaders
      remoteRef:
        key: "{{ .Values.ociRegistry.externalSecret.item }}/{{ .Values.ociRegistry.externalSecret.fields.htpasswdReaders }}"
    - secretKey: htpasswdWriters
      remoteRef:
        key: "{{ .Values.ociRegistry.externalSecret.item }}/{{ .Values.ociRegistry.externalSecret.fields.htpasswdWriters }}"
    {{- end }}
    {{- if .Values.ociRegistry.tailscale.enabled }}
    # A Tailscale OAuth client secret, from the environment's shared
    # TAILSCALE item rather than one of this registry's own fields. The
    # fleet moved to this credential in #12312 after an expired auth key
    # took the xcresult processors down: passed as `--auth-key`, an OAuth
    # client secret mints a fresh key on every join, so nothing here
    # carries an expiry date.
    - secretKey: tailscaleAuthKey
      remoteRef:
        key: "{{ .Values.ociRegistry.tailscale.externalSecret.item }}/{{ .Values.ociRegistry.tailscale.externalSecret.fields.authKey }}"
    {{- end }}
{{- end }}
