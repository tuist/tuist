{{- /* Per-fleet SSH keypair for each vultrFleets entry, mirroring
   ovh-fleets-ssh-external-secret.yaml. All entries share the env's
   VULTR_FLEET_SSH item, synced into tuist-tuist-vultr-fleet-<key>-ssh.
   sudo-password is synced for shape-compatibility with the other fleets even
   though the Vultr install lands on root and the self-join never escalates. */ -}}
{{- range $key, $fleet := .Values.vultrFleets }}
{{- if and $fleet.enabled $fleet.sshExternalSecret $fleet.sshExternalSecret.enabled }}
{{- $fleetName := include "tuist.componentName" (dict "root" $ "component" (printf "vultr-fleet-%s" $key)) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fleetName }}-ssh
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vultr-fleet
spec:
  refreshInterval: {{ $fleet.sshExternalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ dig "storeRef" "name" "onepassword" $fleet.sshExternalSecret }}
    kind: {{ dig "storeRef" "kind" "ClusterSecretStore" $fleet.sshExternalSecret }}
  target:
    name: {{ $fleetName }}-ssh
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: "{{ required (printf "vultrFleets.%s.sshExternalSecret.item is required when enabled" $key) $fleet.sshExternalSecret.item }}/{{ dig "fields" "privateKey" "private-key" $fleet.sshExternalSecret }}"
    - secretKey: id_ed25519.pub
      remoteRef:
        key: "{{ $fleet.sshExternalSecret.item }}/{{ dig "fields" "publicKey" "public-key" $fleet.sshExternalSecret }}"
    - secretKey: sudo-password
      remoteRef:
        key: "{{ $fleet.sshExternalSecret.item }}/{{ dig "fields" "sudoPassword" "sudo-password" $fleet.sshExternalSecret }}"
{{- end }}
{{- end }}
