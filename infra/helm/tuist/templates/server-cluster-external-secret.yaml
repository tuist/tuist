{{- if and .Values.server.enabled .Values.server.cluster.enabled .Values.server.cluster.externalSecret.enabled }}
{{- $cluster := .Values.server.cluster }}
{{- $externalSecret := $cluster.externalSecret }}
{{- $name := required "server.cluster.externalSecret.enabled requires cookieExistingSecret to avoid competing Secret owners" $cluster.cookieExistingSecret }}
{{- $key := required "server.cluster.cookieExistingSecretKey must not be empty" $cluster.cookieExistingSecretKey }}
{{- $item := required "server.cluster.externalSecret.item must not be empty" $externalSecret.item }}
{{- $field := required "server.cluster.externalSecret.field must not be empty" $externalSecret.field }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
spec:
  # Do not propagate source edits into replacement pods on a timer.
  # Coordinated rotation explicitly changes this resource (force-sync).
  refreshPolicy: OnChange
  secretStoreRef:
    name: {{ $externalSecret.storeRef.name }}
    kind: {{ $externalSecret.storeRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        {{ $key | quote }}: '{{ `{{ if eq (.cookie | trim) "" }}{{ fail "The server cluster cookie must not be empty" }}{{ end }}{{ .cookie }}` }}'
  data:
    - secretKey: cookie
      remoteRef:
        key: {{ printf "%s/%s" $item $field | quote }}
{{- end }}
