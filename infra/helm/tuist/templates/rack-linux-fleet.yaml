{{- if and .Values.capi.enabled .Values.rackLinuxFleet.enabled }}
{{- $fleetName := include "tuist.rackLinuxFleetName" . }}
{{- /*
Rack-owned Linux machines: one RackLinuxHost per box, rendered from
`rackLinuxFleet.hosts` and named after the machine's SMBIOS UUID, which
`kubectl get rlc` lists once the box's install stick has announced it. The
operator keeps a CAPI Machine for each host, which makes it a node. A role's
labels and taints come from `rackLinuxFleet.roles.<role>` and reach the Node at
its first registration.
*/ -}}
{{- range $host := .Values.rackLinuxFleet.hosts }}
{{- $uuid := lower (required "each rackLinuxFleet.hosts entry needs the machine's uuid" $host.uuid) }}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $uuid) }}
{{- fail (printf "rackLinuxFleet.hosts[].uuid %q is not an SMBIOS UUID" $host.uuid) }}
{{- end }}
{{- $hostname := required (printf "rackLinuxFleet.hosts[%s].hostname is required" $uuid) $host.hostname }}
{{- $role := required (printf "rackLinuxFleet.hosts[%s].role is required" $hostname) $host.role }}
{{- $roleConfig := get $.Values.rackLinuxFleet.roles $role | default dict }}
{{- $tags := $host.tailnetTags | default $roleConfig.tailnetTags | default $.Values.rackLinuxFleet.tailnetTags }}
{{- if empty $tags }}
{{- fail (printf "rackLinuxFleet.hosts[%s].tailnetTags (or its role's, or rackLinuxFleet.tailnetTags) is required: a device is only this host when it carries them" $hostname) }}
{{- end }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: RackLinuxHost
metadata:
  name: {{ $uuid }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tuist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rack-linux-fleet
spec:
  hostname: {{ $hostname }}
  role: {{ $role }}
  sshUser: {{ $host.sshUser | default $.Values.rackLinuxFleet.sshUser | default "tuist" }}
  location:
    site: {{ required (printf "rackLinuxFleet.hosts[%s].site is required; it composes the providerID" $hostname) (coalesce $host.site $.Values.rackLinuxFleet.site) | quote }}
    {{- with $host.rack }}
    rack: {{ . | quote }}
    {{- end }}
    {{- with $host.positionU }}
    positionU: {{ . }}
    {{- end }}
  tailnet:
    tags:
      {{- toYaml $tags | nindent 6 }}
  {{- with $host.bootMAC }}
  bootMAC: {{ lower . | quote }}
  {{- end }}
  {{- if or $roleConfig.nodeLabels $roleConfig.nodeTaints }}
  node:
    {{- with $roleConfig.nodeLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $roleConfig.nodeTaints }}
    taints:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  online: {{ ternary $host.online true (hasKey $host "online") }}
  {{- with $host.reinstallGeneration }}
  reinstallGeneration: {{ . }}
  {{- end }}
  {{- with $host.amt }}
  amt:
    {{- if hasKey . "activate" }}
    activate: {{ .activate }}
    {{- end }}
    {{- with .address }}
    address: {{ . | quote }}
    {{- end }}
    {{- with .gateway }}
    gateway: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.rackLinuxFleet.sshExternalSecret.enabled }}
---
# The rack's fleet key. The install stick authorizes its public half, and the
# operator logs in with the private half. Never minted in-cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fleetName }}-ssh
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-linux-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $fleetName }}-ssh
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: "{{ required "rackLinuxFleet.sshExternalSecret.item is required when sshExternalSecret.enabled" .Values.rackLinuxFleet.sshExternalSecret.item }}/private-key"
{{- end }}
{{- if .Values.rackLinuxFleet.tailscale.externalSecret.enabled }}
---
# The Tailscale OAuth client (Auth Keys and Devices Core, scoped to the rack
# tags). The operator uses it to find each host's device, remove the device a
# reinstall replaced, name the new one after the host, and mint each netboot
# install's single-use join key; rack:write-install-usb mints each stick's from
# the same 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fleetName }}-tailscale
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-linux-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $fleetName }}-tailscale
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: "{{ required "rackLinuxFleet.tailscale.externalSecret.item is required when enabled" .Values.rackLinuxFleet.tailscale.externalSecret.item }}/client-id"
    - secretKey: client-secret
      remoteRef:
        key: "{{ .Values.rackLinuxFleet.tailscale.externalSecret.item }}/client-secret"
{{- end }}
{{- if .Values.rackLinuxFleet.amt.provisioningExternalSecret.enabled }}
---
# Intel AMT's provisioning certificate, which the operator activates the AMT of
# a host setting amt.activate with, in admin control mode. The key stays in
# 1Password and here; hosts receive it only for the activation, through rpc's
# environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fleetName }}-amt-provisioning
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-linux-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $fleetName }}-amt-provisioning
    creationPolicy: Owner
  data:
    - secretKey: pfx
      remoteRef:
        key: "{{ required "rackLinuxFleet.amt.provisioningExternalSecret.item is required when enabled" .Values.rackLinuxFleet.amt.provisioningExternalSecret.item }}/pfx"
    - secretKey: password
      remoteRef:
        key: "{{ .Values.rackLinuxFleet.amt.provisioningExternalSecret.item }}/pfx-password"
{{- end }}
{{- if .Values.rackLinuxFleet.boot.enabled }}
{{- $boot := .Values.rackLinuxFleet.boot }}
{{- $bootSite := required "rackLinuxFleet.boot runs on the site's edge node; set rackLinuxFleet.site or boot.site" (coalesce $boot.site .Values.rackLinuxFleet.site) }}
{{- $bootName := printf "%s-boot" $fleetName }}
---
# The rack's boot server (cmd/rack-boot in the operator's image), on each edge
# node of the site: TFTP and HTTP on the provisioning address, which the edge
# holding it answers on, serving the installs the operator publishes to the
# <fleet>-boot Secret. The edge node's DHCP points netbooting firmware here
# (management.edge.netboot in the site definition).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $bootName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-boot
---
# It reads the boot Secret and nothing else of the namespace's Secrets; lists
# the machines install sticks announce as RackLinuxCandidates; and reports on a
# host's status.boot that its install is servable and whom its seed went to.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $bootName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-boot
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $bootName }}]
    verbs: [get, list, watch]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [racklinuxcandidates]
    verbs: [get, list, watch, create]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [racklinuxcandidates/status]
    verbs: [patch]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [racklinuxhosts]
    verbs: [get]
  - apiGroups: [infrastructure.cluster.x-k8s.io]
    resources: [racklinuxhosts/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $bootName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-boot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $bootName }}
subjects:
  - kind: ServiceAccount
    name: {{ $bootName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $bootName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-boot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: rack-boot
      tuist.dev/rack-edge: {{ $bootSite }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rack-boot
        tuist.dev/rack-edge: {{ $bootSite }}
    spec:
      serviceAccountName: {{ $bootName }}
      hostNetwork: true
      # The node's own resolvers: a rack node has no route to the cluster's DNS
      # Service, and the ISO comes from releases.ubuntu.com.
      dnsPolicy: Default
      enableServiceLinks: false
      nodeSelector:
        tuist.dev/rack-edge: {{ $bootSite }}
      tolerations:
        - key: tuist.dev/rack-edge
          operator: Equal
          value: {{ $bootSite }}
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: boot
          image: "{{ .Values.macosFleet.image.repository }}:{{ .Values.macosFleet.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.macosFleet.image.pullPolicy }}
          command: [/usr/local/bin/rack-boot]
          args:
            - --address={{ required "rackLinuxFleet.boot.address is the site's provisioning address" $boot.address }}
            - --http-port={{ $boot.httpPort }}
            - --iso-url={{ required "rackLinuxFleet.boot.iso.url is required" $boot.iso.url }}
            - --iso-sha256={{ required "rackLinuxFleet.boot.iso.sha256 is required" $boot.iso.sha256 }}
            - --secret={{ $bootName }}
            - --site={{ $bootSite }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Root for the state directory on the node; the only capability is
            # TFTP's port 69.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          resources:
            {{- toYaml $boot.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/tuist-rack-boot
            - name: kubernetes-api
              mountPath: /etc/tuist/kubernetes-api
              readOnly: true
      volumes:
        # On the node, so a restarted pod does not download the ISO again.
        - name: state
          hostPath:
            path: /var/lib/tuist-rack-boot
            type: DirectoryOrCreate
        # The API server the node's kubelet uses, which the operator's converge
        # writes: a rack node reaches no Service address.
        - name: kubernetes-api
          hostPath:
            path: /etc/tuist/kubernetes-api
            type: File
{{- end }}
{{- end }}
