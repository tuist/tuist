{{- if and .Values.capi.enabled .Values.rackFleet.enabled .Values.rackFleet.cardRootKey.enabled }}
---
# ESO syncs the root key the operator derives every rack power card's
# passwords from (RackPDU, RackATS). The store is read-only: nothing the
# operator sets on a card is written back, since the same key derives the
# same passwords again on a rebuilt cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.rackFleet.cardRootKey.secretName | default "rack-card-root" }}
  labels:
    {{- include "tuist.labels" . | nindent 4 }}
    app.kubernetes.io/component: rack-fleet
spec:
  refreshInterval: {{ .Values.rackFleet.cardRootKey.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.rackFleet.cardRootKey.storeRef.name | default "onepassword" }}
    kind: {{ .Values.rackFleet.cardRootKey.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.rackFleet.cardRootKey.secretName | default "rack-card-root" }}
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: "{{ required "rackFleet.cardRootKey.item is required when cardRootKey.enabled" .Values.rackFleet.cardRootKey.item }}/{{ .Values.rackFleet.cardRootKey.field | default "key" }}"
{{- end }}
