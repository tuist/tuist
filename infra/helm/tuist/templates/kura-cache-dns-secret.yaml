{{- $dns := .Values.kuraController.stableDNS }}
{{- if and .Values.kuraController.enabled $dns.enabled $dns.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $dns.secretName }}
  namespace: {{ .Values.kuraController.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $dns.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $dns.secretName }}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ printf "%s/AWS_ACCESS_KEY_ID" (required "kuraController.stableDNS.externalSecret.item is required" $dns.externalSecret.item) | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ printf "%s/AWS_SECRET_ACCESS_KEY" $dns.externalSecret.item | quote }}
{{- end }}
