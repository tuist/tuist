replicaCount: 1

cluster:
  enabled: false
  # Pre-provisioned in this release's namespace; never generated by the image/chart.
  cookieExistingSecret: ""
  cookieSecretKey: release-cookie
  externalSecret:
    enabled: false
    item: LUFT_SERVER_CLUSTER_COOKIE
    field: password

image:
  repository: ghcr.io/tuist/luft-server
  tag: ""
  pullPolicy: IfNotPresent

# The origin people use. This release serves all of it: the Luft web app
# (built into the image) and its API, as RFC 10017's backend for frontend.
# OAuth callbacks go to <publicUrl>/auth/callback.
publicUrl: https://luft.work
# The Tuist server Luft signs people in with (the OpenID Provider's issuer).
tuistUrl: https://tuist.dev
port: 8080

externalSecret:
  enabled: false
  refreshInterval: "1h"
  item: LUFT_SERVER
  storeRef:
    name: onepassword
    kind: ClusterSecretStore

# Public OAuth client ID for ChatGPT subscription sign-in
# (LUFT_CHATGPT_CLIENT_ID), read through externalSecret's store. Without it
# ChatGPT can't connect. Enable only after the item exists in the
# environment's vault: a missing item fails the ExternalSecret.
chatgptClient:
  enabled: false
  item: CHATGPT_OAUTH
  field: client_id

postgresql:
  instances: 2
  storageSize: 5Gi
  storageClass: ""
  database: luft_server
  owner: luft_server
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16.4"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}

# cert-manager Certificate for ingress.host, stored in ingress.tlsSecretName.
certificate:
  enabled: false
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: ""

networkPolicy:
  enabled: false
  ingressControllerNamespace: platform
  ingressControllerPodLabels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller

resources: {}
nodeSelector: {}
tolerations: []
podAnnotations: {}

probes:
  path: /healthz
