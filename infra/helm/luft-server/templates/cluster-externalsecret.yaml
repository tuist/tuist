{{- if and .Values.cluster.enabled .Values.cluster.externalSecret.enabled }}
{{- $name := required "cluster.externalSecret.enabled requires cluster.cookieExistingSecret" .Values.cluster.cookieExistingSecret }}
{{- $key := required "cluster.cookieSecretKey must not be empty" .Values.cluster.cookieSecretKey }}
{{- $item := required "cluster.externalSecret.item must not be empty" .Values.cluster.externalSecret.item }}
{{- $field := required "cluster.externalSecret.field must not be empty" .Values.cluster.externalSecret.field }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "luft-server.labels" . | nindent 4 }}
spec:
  # Source edits alone must not rotate the cookie during a rolling upgrade.
  refreshPolicy: OnChange
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        {{ $key | quote }}: '{{ `{{ if eq (.cookie | trim) "" }}{{ fail "The Luft cluster cookie must not be empty" }}{{ end }}{{ .cookie }}` }}'
  data:
    - secretKey: cookie
      remoteRef:
        key: {{ printf "%s/%s" $item $field | quote }}
{{- end }}
