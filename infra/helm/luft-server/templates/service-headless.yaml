{{- if .Values.cluster.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "luft-server.fullname" . }}-headless
  labels:
    {{- include "luft-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "luft-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: epmd
      port: 4369
      targetPort: epmd
    - name: erlang-dist
      port: 9100
      targetPort: erlang-dist
{{- end }}
