{{- $imageTag := required "image.tag is required" .Values.image.tag -}}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.cluster.enabled) -}}
{{- fail "Multiple Luft replicas require cluster.enabled=true" -}}
{{- end -}}
{{- if .Values.cluster.enabled -}}
{{- $_ := required "cluster.cookieExistingSecret is required when clustering is enabled" (.Values.cluster.cookieExistingSecret | trim) -}}
{{- $_ := required "cluster.cookieSecretKey is required when clustering is enabled" (.Values.cluster.cookieSecretKey | trim) -}}
{{- if not .Values.networkPolicy.enabled -}}
{{- fail "Clustering requires networkPolicy.enabled=true to keep distribution private" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "luft-server.fullname" . }}
  labels:
    {{- include "luft-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "luft-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "luft-server.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: luft-server
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            # The image's `USER nobody` is a name, which the kubelet can't
            # check against runAsNonRoot; name its numeric ID.
            runAsUser: 65534
            runAsGroup: 65534
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            {{- if .Values.cluster.enabled }}
            - name: epmd
              containerPort: 4369
            - name: erlang-dist
              containerPort: 9100
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: TUIST_URL
              value: {{ .Values.tuistUrl | quote }}
            {{- if .Values.cluster.enabled }}
            - name: DNS_CLUSTER_QUERY
              value: {{ printf "%s-headless.%s.svc" (include "luft-server.fullname" .) .Release.Namespace | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.cookieExistingSecret | quote }}
                  key: {{ .Values.cluster.cookieSecretKey | quote }}
            {{- end }}
            # CNPG's `<cluster>-app` Secret carries a ready postgres:// URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "luft-server.pgClusterName" . }}-app
                  key: uri
          envFrom:
            - secretRef:
                name: {{ include "luft-server.secretName" . }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
