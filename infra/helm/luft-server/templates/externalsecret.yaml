{{- /*
Runtime secrets from the LUFT_SERVER 1Password item: secret_key_base, and the
confidential OpenID Connect client the Tuist server registered for Luft
(TUIST_LUFT_SERVER_OAUTH_* on the Tuist side). Names match config/runtime.exs.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "luft-server.secretName" . }}
  labels:
    {{- include "luft-server.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ include "luft-server.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ `{{ .secret_key_base | trim }}` }}"
        LUFT_SERVER_OAUTH_CLIENT_ID: "{{ `{{ .oauth_client_id | trim }}` }}"
        LUFT_SERVER_OAUTH_CLIENT_SECRET: "{{ `{{ .oauth_client_secret | trim }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.item | quote }}
{{- end }}
