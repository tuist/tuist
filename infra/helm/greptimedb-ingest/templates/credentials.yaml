# Same ESO resource, owner, target and expressions as the old pulse release.
# Never copy/read a Secret or move this into the independent backend release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: onepassword, kind: ClusterSecretStore}
  target:
    name: pulse-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: '{{ "{{ index . \"SECRET_KEY_BASE\" | trim }}" }}'
        PULSE_TENANT_TOKENS: '{{ "{\"tuist\":\"sha256${{ .PULSE_TENANT_TOKENS | trim | sha256sum }}\"}" }}'
        PULSE_S3_ACCESS_KEY_ID: '{{ "{{ index . \"PULSE_S3_ACCESS_KEY_ID\" | trim }}" }}'
        PULSE_S3_SECRET_ACCESS_KEY: '{{ "{{ index . \"PULSE_S3_SECRET_ACCESS_KEY\" | trim }}" }}'
        pulse-username: tuist
        pulse-password: '{{ "{{ .PULSE_TENANT_TOKENS | trim }}" }}'
        tenantId: tuist
  data:
    - {secretKey: SECRET_KEY_BASE, remoteRef: {key: PULSE_SECRET_KEY_BASE/password}}
    - {secretKey: PULSE_TENANT_TOKENS, remoteRef: {key: PULSE_TOKEN/password}}
    - {secretKey: PULSE_S3_ACCESS_KEY_ID, remoteRef: {key: PULSE_S3_CREDENTIALS/access_key_id}}
    - {secretKey: PULSE_S3_SECRET_ACCESS_KEY, remoteRef: {key: PULSE_S3_CREDENTIALS/secret_access_key}}
