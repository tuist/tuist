{{- if .Values.enabled }}
{{- $server := required "serverURL is required" .Values.serverURL }}
{{- $shared := .Values.workers.sharedHosts }}
{{- $slots := int .Values.workers.perNodeConcurrency }}
{{- $floor := int $shared.floorSlots }}
{{- if $shared.enabled }}
{{- $slots = int $shared.ceilingSlots }}
{{- end }}
{{- if not (has .Values.workers.networkBackend (list "iproute2" "netlink")) }}
{{- fail "workers.networkBackend must be iproute2 or netlink" }}
{{- end }}
{{- if or (lt $slots 1) (gt $slots 128) }}
{{- fail "workers.perNodeConcurrency and workers.sharedHosts.ceilingSlots must be between 1 and 128" }}
{{- end }}
{{- if ge (int .Values.workers.blobCacheGiB) (int .Values.workers.diskGiB) }}
{{- fail "workers.blobCacheGiB comes out of workers.diskGiB and must be below it" }}
{{- end }}
{{- /* Firecracker in its own vmm container, and in-place daemon upgrades:
infra/sandboxd/AGENTS.md, "Process model". */}}
{{- $vmm := .Values.workers.vmm.enabled }}
{{- $inPlace := and $vmm .Values.workers.vmm.inPlaceUpgrades }}
{{- if and $inPlace (not .Values.workers.vmm.tag) }}
{{- fail "workers.vmm.tag is required with workers.vmm.inPlaceUpgrades: vmm holds Firecracker under the running VMs, so a daemon upgrade must not move it." }}
{{- end }}
{{- $vmmTag := .Values.workers.vmm.tag | default .Values.workers.tag }}
{{- range $tag := list .Values.gateway.tag .Values.workers.tag .Values.workers.templateTag $vmmTag }}
{{- if not (regexMatch "^sha-[a-f0-9]{12,40}$" $tag) }}
{{- fail "gateway, daemon, vmm and template images must have immutable sha-<commit> tags" }}
{{- end }}
{{- end }}
{{- if $shared.enabled }}
{{- if or (lt $floor 1) (gt $floor $slots) }}
{{- fail "workers.sharedHosts.floorSlots must be between 1 and ceilingSlots" }}
{{- end }}
{{- if empty $shared.nodeSelector }}
{{- fail "workers.sharedHosts.nodeSelector must select the runner hosts the workers share" }}
{{- end }}
{{- else if ne (index .Values.workers.nodeSelector "tuist.dev/workload") "remote-execution" }}
{{- fail "execution workers require the dedicated remote-execution node selector" }}
{{- end }}
{{- /* Whole GiB for the guests' 4160 MiB each plus the daemon's 512 MiB. */}}
{{- $floorGiB := div (add 512 (mul $floor 4160) 1023) 1024 }}
{{- $ceilingGiB := div (add 512 (mul $slots 4160) 1023) 1024 }}
{{- /* The VMs' container: sandboxd, or vmm when it holds Firecracker. */}}
{{- $vmResources := dict "shared" $shared.enabled "floor" $floor "slots" $slots "floorGiB" $floorGiB }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workers
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-gateway"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-gateway", tuist.dev/remote-execution: "true"}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image }}:{{ .Values.gateway.tag }}"
          ports: [{name: grpc, containerPort: 50051}, {name: metrics, containerPort: 9090}]
          env:
            - {name: TUIST_URL, value: {{ $server | quote }}}
            - {name: METRICS_ADDR, value: ":9090"}
          readinessProbe:
            grpc: {port: 50051}
          livenessProbe:
            grpc: {port: 50051}
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector: {app: "{{ .Release.Name }}-gateway"}
  ports: [{name: grpc, port: 50051, targetPort: grpc, appProtocol: kubernetes.io/h2c}]
{{- if $shared.enabled }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Release.Name }}-workers
value: 1000000
preemptionPolicy: Never
globalDefault: false
description: "Remote execution workers on shared runner hosts: scheduled ahead of runner Pods, never preempt them."
{{- end }}
{{- $configData := "" }}
{{- if $vmm }}
{{- /*
With vmm, the daemon's deploy-varying configuration is a ConfigMap file both
containers read (SANDBOXD_CONFIG), so an in-place upgrade can restart the
daemon with new configuration; a Pod's environment cannot change. What a
running VM depends on stays in the Pod's environment, so changing it replaces
the Pod: TEMPLATE_TAG (the template init container installs that tag) and
JAIL_UID_BASE (the jails of handed-over VMs keep their UIDs).
*/}}
{{- $config := dict
  "SERVER_URL" $server
  "TEMPLATE_NAME" "bazel"
  "EXECUTION_SLOTS" ($slots | toString)
  "NETWORK_BACKEND" (.Values.workers.networkBackend | toString)
  "ALLOWED_SHAPES" "1x2048,2x4096,4x8192,8x16384,8x2048,8x4096,8x8192"
  "PREBUILD_SHAPES" "1x2048,2x4096,4x8192,8x4096"
  "TEMPLATE_WORKSPACE_GB" "30"
  "DISK_BUDGET_GIB" (.Values.workers.diskGiB | toString)
  "BLOB_CACHE_GIB" (.Values.workers.blobCacheGiB | toString) }}
{{- if $shared.enabled }}
{{- $_ := set $config "MEMORY_FLOOR_GIB" ($floorGiB | toString) }}
{{- $_ := set $config "MEMORY_CEILING_GIB" ($ceilingGiB | toString) }}
{{- end }}
{{- range $key, $value := $config }}
{{- $configData = printf "%s%s=%s\n" $configData $key $value }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-workers-config
data:
  config.env: |
    {{- $configData | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-workers
spec:
  # A rollout must drain execution first; never kill active VMs automatically.
  # With in-place upgrades the deploy rolls the Pods itself
  # (.github/scripts/sandboxd-upgrade.sh): a daemon image change restarts only
  # the sandboxd container and the VMs stay in vmm; any other change, such as
  # the template tag, replaces the Pod after draining it.
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-workers"}
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-workers"
        tuist.dev/remote-execution: "true"
        {{- if $shared.enabled }}
        # The runners controller keeps this carve-out out of runner seats and
        # publishes its grants as `<node>.remote-execution`.
        tuist.dev/remote-execution-daemon: "true"
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
        {{- /* In place, the kubelet refreshes the mounted ConfigMap and the
        restarted daemon reads it; no checksum marks the Pods stale. */}}
        {{- if and $vmm (not $inPlace) }}
        checksum/config: {{ $configData | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-workers
      automountServiceAccountToken: false
      {{- if $vmm }}
      # The daemon reads the VMs' /proc and signals them; vmm spawns them.
      shareProcessNamespace: true
      {{- end }}
      terminationGracePeriodSeconds: 60
      {{- if $shared.enabled }}
      priorityClassName: {{ .Release.Name }}-workers
      nodeSelector: {{ merge (dict "kubernetes.io/arch" "amd64" "kubernetes.io/os" "linux") $shared.nodeSelector | toYaml | nindent 8 }}
      {{- with $shared.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      nodeSelector: {{ toYaml .Values.workers.nodeSelector | nindent 8 }}
      tolerations:
        - {key: tuist.dev/workload, operator: Equal, value: remote-execution, effect: NoSchedule}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: template
          image: "{{ .Values.workers.templateImage }}:{{ .Values.workers.templateTag }}"
          env:
            - {name: TEMPLATE_NAME, value: bazel}
            - {name: TEMPLATE_TAG, value: {{ .Values.workers.templateTag | quote }}}
            - {name: TEMPLATE_DIR, value: "/host/templates/bazel/{{ .Values.workers.templateTag }}"}
          volumeMounts: [{name: data, mountPath: /host}]
      containers:
        - name: sandboxd
          image: "{{ .Values.workers.image }}:{{ .Values.workers.tag }}"
          securityContext: {privileged: true}
          env:
            {{- if $vmm }}
            # Only what differs per Pod or must not change under running VMs;
            # the rest is in the ConfigMap (SANDBOXD_CONFIG), which an
            # in-place upgrade picks up.
            {{- if $shared.enabled }}
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: NODE_NAME, value: "$(K8S_NODE_NAME).remote-execution"}
            {{- else }}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- end }}
            # The Pod the server resizes, and the handover's own name.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # Jail UIDs apart from the agent daemon's (10000 + slot). Handed-
            # over VMs keep theirs, so changing it replaces the Pod.
            - {name: JAIL_UID_BASE, value: "30000"}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: TOKEN_PATH, value: /var/run/secrets/tuist/token}
            - {name: DATA_DIR, value: /data/sandboxes}
            # The tag the template init container installed: a change
            # replaces the Pod.
            - {name: TEMPLATE_TAG, value: {{ .Values.workers.templateTag | quote }}}
            - {name: METRICS_ADDR, value: "$(POD_IP):9090"}
            - {name: DIRECT_EXEC_ADDR, value: "$(POD_IP):7071"}
            - {name: SANDBOXD_CONFIG, value: /etc/sandboxd/config.env}
            - {name: VMM_SOCKET, value: /run/vmm/vmm.sock}
            {{- if $inPlace }}
            # The deploy annotates the Pod to arm the handover before it
            # patches the daemon image (sandboxd-upgrade.sh).
            - {name: HANDOVER_FILE, value: /etc/podinfo/annotations}
            {{- end }}
            {{- else }}
            {{- if $shared.enabled }}
            # The host's agent sandbox daemon connects as the node itself.
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: NODE_NAME, value: "$(K8S_NODE_NAME).remote-execution"}
            # The server grows this Pod's memory in place from the floor to
            # the ceiling as actions need it, and shrinks it back after.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: MEMORY_FLOOR_GIB, value: {{ $floorGiB | quote }}}
            - {name: MEMORY_CEILING_GIB, value: {{ $ceilingGiB | quote }}}
            {{- else }}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- end }}
            # Jail UIDs apart from the agent daemon's (10000 + slot).
            - {name: JAIL_UID_BASE, value: "30000"}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: SERVER_URL, value: {{ $server | quote }}}
            - {name: TOKEN_PATH, value: /var/run/secrets/tuist/token}
            - {name: DATA_DIR, value: /data/sandboxes}
            - {name: TEMPLATE_NAME, value: bazel}
            - {name: TEMPLATE_TAG, value: {{ .Values.workers.templateTag | quote }}}
            - {name: EXECUTION_SLOTS, value: {{ $slots | quote }}}
            - {name: NETWORK_BACKEND, value: {{ .Values.workers.networkBackend | quote }}}
            # The VM sizes the tuist-memory-gb execution property selects
            # (Tuist.RemoteExecution.Settings), and the same sizes with 8
            # vCPUs that accounts with automatic task sizing burst to. A
            # shape not prebuilt builds its snapshot on its first action.
            - {name: ALLOWED_SHAPES, value: "1x2048,2x4096,4x8192,8x16384,8x2048,8x4096,8x8192"}
            - {name: PREBUILD_SHAPES, value: "1x2048,2x4096,4x8192,8x2048,8x4096"}
            # The workspace every VM gets (Settings.vm_workspace_gb), so
            # creates clone the snapshots' formatted workspace.
            - {name: TEMPLATE_WORKSPACE_GB, value: "30"}
            - {name: DISK_BUDGET_GIB, value: {{ .Values.workers.diskGiB | quote }}}
            - {name: BLOB_CACHE_GIB, value: {{ .Values.workers.blobCacheGiB | quote }}}
            - {name: METRICS_ADDR, value: "$(POD_IP):9090"}
            - {name: DIRECT_EXEC_ADDR, value: "$(POD_IP):7071"}
            {{- end }}
          {{- if $vmm }}
          # The VMs sit in the vmm container's cgroup, which carries the
          # worker's capacity (and the server resizes); the daemon's own
          # memory is fixed.
          resources: {{ toYaml .Values.workers.vmm.daemonResources | nindent 12 }}
          {{- else }}
          {{- include "remote-execution.vmResources" $vmResources | trim | nindent 10 }}
          {{- end }}
          ports: [{name: metrics, containerPort: 9090}, {name: direct-exec, containerPort: 7071}]
          volumeMounts:
            - {name: data, mountPath: /data/sandboxes}
            - {name: kvm, mountPath: /dev/kvm}
            - {name: tun, mountPath: /dev/net/tun}
            - {name: token, mountPath: /var/run/secrets/tuist, readOnly: true}
            {{- if $vmm }}
            - {name: vmm, mountPath: /run/vmm}
            - {name: config, mountPath: /etc/sandboxd, readOnly: true}
            {{- if $inPlace }}
            - {name: podinfo, mountPath: /etc/podinfo, readOnly: true}
            {{- end }}
            {{- end }}
        {{- if $vmm }}
        # Spawns the daemon's Firecracker VMs, which sit in this container's
        # cgroup, so the daemon can restart without them. Its image is pinned
        # apart from the daemon's (workers.vmm.tag): changing it replaces the
        # Pod. See infra/sandboxd/AGENTS.md, "Process model".
        - name: vmm
          image: "{{ .Values.workers.image }}:{{ $vmmTag }}"
          command: ["/usr/local/bin/vmm"]
          env:
            - {name: SANDBOXD_CONFIG, value: /etc/sandboxd/config.env}
            - {name: VMM_SOCKET, value: /run/vmm/vmm.sock}
          securityContext: {privileged: true}
          {{- include "remote-execution.vmResources" $vmResources | trim | nindent 10 }}
          volumeMounts:
            # Firecracker's log and the jail roots.
            - {name: data, mountPath: /data/sandboxes}
            - {name: vmm, mountPath: /run/vmm}
            - {name: config, mountPath: /etc/sandboxd, readOnly: true}
        {{- end }}
      volumes:
        - name: data
          hostPath: {path: /data/remote-execution, type: DirectoryOrCreate}
        - name: kvm
          hostPath: {path: /dev/kvm, type: CharDevice}
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken: {audience: tuist-sandboxes, expirationSeconds: 3600, path: token}
        {{- if $vmm }}
        - name: vmm
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: config
          configMap: {name: {{ .Release.Name }}-workers-config}
        {{- if $inPlace }}
        - name: podinfo
          downwardAPI:
            items:
              - {path: annotations, fieldRef: {fieldPath: metadata.annotations}}
        {{- end }}
        {{- end }}
{{- end }}
{{- define "remote-execution.vmResources" }}
{{- if .shared }}
# Resized in place by the server from the floor toward the ceiling; the
# floor's CPU is reserved and guests above it run on idle cores.
resizePolicy:
  - {resourceName: memory, restartPolicy: NotRequired}
  - {resourceName: cpu, restartPolicy: NotRequired}
resources:
  requests: {cpu: {{ mul .floor 2 | quote }}, memory: "{{ .floorGiB }}Gi"}
  limits: {memory: "{{ .floorGiB }}Gi"}
{{- else }}
resources:
  requests: {cpu: {{ mul .slots 2 | quote }}, memory: "{{ add 512 (mul .slots 4160) }}Mi"}
  limits: {cpu: {{ mul .slots 2 | quote }}, memory: "{{ add 512 (mul .slots 4160) }}Mi"}
{{- end }}
{{- end }}
