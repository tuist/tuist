{{- if .Values.enabled }}
{{- $server := required "serverURL is required" .Values.serverURL }}
{{- $shared := .Values.workers.sharedHosts }}
{{- $slots := int .Values.workers.perNodeConcurrency }}
{{- $floor := int $shared.floorSlots }}
{{- if $shared.enabled }}
{{- $slots = int $shared.ceilingSlots }}
{{- end }}
{{- if not (has .Values.workers.networkBackend (list "iproute2" "netlink")) }}
{{- fail "workers.networkBackend must be iproute2 or netlink" }}
{{- end }}
{{- if or (lt $slots 1) (gt $slots 128) }}
{{- fail "workers.perNodeConcurrency and workers.sharedHosts.ceilingSlots must be between 1 and 128" }}
{{- end }}
{{- range $tag := list .Values.gateway.tag .Values.workers.tag .Values.workers.templateTag }}
{{- if not (regexMatch "^sha-[a-f0-9]{12,40}$" $tag) }}
{{- fail "gateway, daemon and template images must have immutable sha-<commit> tags" }}
{{- end }}
{{- end }}
{{- if $shared.enabled }}
{{- if or (lt $floor 1) (gt $floor $slots) }}
{{- fail "workers.sharedHosts.floorSlots must be between 1 and ceilingSlots" }}
{{- end }}
{{- if empty $shared.nodes }}
{{- fail "workers.sharedHosts.nodes must name the runner hosts the workers share" }}
{{- end }}
{{- else if ne (index .Values.workers.nodeSelector "tuist.dev/workload") "remote-execution" }}
{{- fail "execution workers require the dedicated remote-execution node selector" }}
{{- end }}
{{- /* Whole GiB for the guests' 4160 MiB each plus the daemon's 512 MiB. */}}
{{- $floorGiB := div (add 512 (mul $floor 4160) 1023) 1024 }}
{{- $ceilingGiB := div (add 512 (mul $slots 4160) 1023) 1024 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workers
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-gateway"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-gateway", tuist.dev/remote-execution: "true"}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image }}:{{ .Values.gateway.tag }}"
          ports: [{name: grpc, containerPort: 50051}, {name: metrics, containerPort: 9090}]
          env:
            - {name: TUIST_URL, value: {{ $server | quote }}}
            - {name: METRICS_ADDR, value: ":9090"}
          readinessProbe:
            grpc: {port: 50051}
          livenessProbe:
            grpc: {port: 50051}
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector: {app: "{{ .Release.Name }}-gateway"}
  ports: [{name: grpc, port: 50051, targetPort: grpc, appProtocol: kubernetes.io/h2c}]
{{- if $shared.enabled }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Release.Name }}-workers
value: 1000000
preemptionPolicy: Never
globalDefault: false
description: "Remote execution workers on shared runner hosts: scheduled ahead of runner Pods, never preempt them."
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-workers
spec:
  # A rollout must drain execution first; never kill active VMs automatically.
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-workers"}
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-workers"
        tuist.dev/remote-execution: "true"
        {{- if $shared.enabled }}
        # The runners controller keeps this carve-out out of runner seats and
        # publishes its grants as `<node>.remote-execution`.
        tuist.dev/remote-execution-daemon: "true"
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ .Release.Name }}-workers
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- if $shared.enabled }}
      priorityClassName: {{ .Release.Name }}-workers
      nodeSelector: {kubernetes.io/arch: amd64, kubernetes.io/os: linux}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: {{ toYaml $shared.nodes | nindent 22 }}
      {{- with $shared.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      nodeSelector: {{ toYaml .Values.workers.nodeSelector | nindent 8 }}
      tolerations:
        - {key: tuist.dev/workload, operator: Equal, value: remote-execution, effect: NoSchedule}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: template
          image: "{{ .Values.workers.templateImage }}:{{ .Values.workers.templateTag }}"
          env:
            - {name: TEMPLATE_NAME, value: bazel}
            - {name: TEMPLATE_TAG, value: {{ .Values.workers.templateTag | quote }}}
            - {name: TEMPLATE_DIR, value: "/host/templates/bazel/{{ .Values.workers.templateTag }}"}
          volumeMounts: [{name: data, mountPath: /host}]
      containers:
        - name: sandboxd
          image: "{{ .Values.workers.image }}:{{ .Values.workers.tag }}"
          securityContext: {privileged: true}
          env:
            {{- if $shared.enabled }}
            # The host's agent sandbox daemon connects as the node itself.
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: NODE_NAME, value: "$(K8S_NODE_NAME).remote-execution"}
            # The server grows this Pod's memory in place from the floor to
            # the ceiling as actions need it, and shrinks it back after.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: MEMORY_FLOOR_GIB, value: {{ $floorGiB | quote }}}
            - {name: MEMORY_CEILING_GIB, value: {{ $ceilingGiB | quote }}}
            {{- else }}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- end }}
            # Jail UIDs apart from the agent daemon's (10000 + slot).
            - {name: JAIL_UID_BASE, value: "30000"}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: SERVER_URL, value: {{ $server | quote }}}
            - {name: TOKEN_PATH, value: /var/run/secrets/tuist/token}
            - {name: DATA_DIR, value: /data/sandboxes}
            - {name: TEMPLATE_NAME, value: bazel}
            - {name: TEMPLATE_TAG, value: {{ .Values.workers.templateTag | quote }}}
            - {name: EXECUTION_SLOTS, value: {{ $slots | quote }}}
            - {name: NETWORK_BACKEND, value: {{ .Values.workers.networkBackend | quote }}}
            - {name: ALLOWED_SHAPES, value: "2x4096"}
            - {name: PREBUILD_SHAPES, value: "2x4096"}
            - {name: DISK_BUDGET_GIB, value: {{ .Values.workers.diskGiB | quote }}}
            - {name: BLOB_CACHE_GIB, value: {{ .Values.workers.blobCacheGiB | quote }}}
            - {name: METRICS_ADDR, value: "$(POD_IP):9090"}
            - {name: DIRECT_EXEC_ADDR, value: "$(POD_IP):7071"}
          {{- if $shared.enabled }}
          # The floor's CPU is reserved; guests above it run on idle cores.
          resizePolicy:
            - {resourceName: memory, restartPolicy: NotRequired}
            - {resourceName: cpu, restartPolicy: NotRequired}
          resources:
            requests: {cpu: {{ mul $floor 2 | quote }}, memory: "{{ $floorGiB }}Gi"}
            limits: {memory: "{{ $floorGiB }}Gi"}
          {{- else }}
          resources:
            requests: {cpu: {{ mul $slots 2 | quote }}, memory: "{{ add 512 (mul $slots 4160) }}Mi"}
            limits: {cpu: {{ mul $slots 2 | quote }}, memory: "{{ add 512 (mul $slots 4160) }}Mi"}
          {{- end }}
          ports: [{name: metrics, containerPort: 9090}, {name: direct-exec, containerPort: 7071}]
          volumeMounts:
            - {name: data, mountPath: /data/sandboxes}
            - {name: kvm, mountPath: /dev/kvm}
            - {name: tun, mountPath: /dev/net/tun}
            - {name: token, mountPath: /var/run/secrets/tuist, readOnly: true}
      volumes:
        - name: data
          hostPath: {path: /data/remote-execution, type: DirectoryOrCreate}
        - name: kvm
          hostPath: {path: /dev/kvm, type: CharDevice}
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken: {audience: tuist-sandboxes, expirationSeconds: 3600, path: token}
{{- end }}
