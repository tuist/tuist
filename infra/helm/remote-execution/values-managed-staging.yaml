# Deployed by .github/workflows/remote-execution-deployment.yml into the
# cluster's sandbox namespace (tuist-sandboxes). Image tags come from the
# workflow, which staging runs by hand (workflow_dispatch). Set to false to
# stop installing or upgrading it.
enabled: true
serverURL: http://tuist-tuist-server.tuist-staging.svc.cluster.local:80
serverNamespace: tuist-staging
gateway:
  ingress:
    enabled: true
    host: execution-staging.tuist.dev
workers:
  # Ten slots' ceilings (about 460 GiB) plus the 20 GiB blob cache. The host's
  # data filesystem has less free than that: staging overcommits on purpose,
  # since the workspace and rootfs images are sparse and only fill as VMs write.
  diskGiB: 480
  # Staging's one runners-linux host, beside its CI runners and the agent
  # sandbox daemon: 1 VM always, up to 10 ahead of queued actions, which is
  # what the host's 24 vCPUs hold beside a 2 vCPU runner without oversubscribing.
  sharedHosts:
    enabled: true
    nodes:
      - tuist-tuist-ovh-fleet-runners-linux-h72m4-llfpg
    floorSlots: 1
    ceilingSlots: 10
    tolerations:
      - {key: tuist.dev/runner-tier, operator: Equal, value: bare-metal, effect: NoSchedule}
