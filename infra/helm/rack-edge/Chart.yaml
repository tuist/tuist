apiVersion: v2
name: rack-edge
description: >
  What a rack's edge node runs for the switches behind it: the path from their
  management addresses into the tailnet, where the Omada controller lives, and
  DHCP naming that controller, which is what makes a factory switch zero touch.
  One pod per edge node, with host networking, run as a kubelet static pod
  that the DaemonSet installs, so it comes back after a cold boot with no API
  server in reach. The files it runs are rendered from the site definition by
  `mise run rack:fleet render` into sites/<site>/. See
  infra/rack-switch-fleet/AGENTS.md.

  Installed into the Omada controller's namespace by
  .github/workflows/omada-deployment.yml.
type: application
version: 0.1.0
appVersion: "0.1.0"
