{{- $site := include "rack-edge.site" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rack-edge-{{ $site }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rack-edge.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rack-edge
      tuist.dev/rack-edge: {{ $site }}
  template:
    metadata:
      labels:
        {{- include "rack-edge.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The switches' port, the uplinks and tailscale0 are the node's own.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        tuist.dev/rack-edge: {{ $site }}
      tolerations:
        - key: tuist.dev/rack-edge
          operator: Equal
          value: {{ $site }}
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      # The path first, so keepalived starts with the VRRP bond it talks over
      # already up. What the path installs stays in the node's kernel when the
      # pod goes. The floating addresses go with keepalived, to the other edge,
      # and come back when this one is master again.
      initContainers:
        - name: path
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, /etc/rack-edge/mgmt-path.sh]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          volumeMounts:
            - name: config
              mountPath: /etc/rack-edge
              readOnly: true
      containers:
        - name: path-reapply
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -ec, 'while sleep {{ .Values.reapplySeconds }}; do sh /etc/rack-edge/mgmt-path.sh; done']
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rack-edge
              readOnly: true
        # The site's floating addresses, on whichever edge is master. dnsmasq on
        # every edge has the same configuration and answers only for the
        # ranges whose address this node holds.
        - name: vrrp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -ec, 'exec keepalived --dont-fork --log-console --log-detail --no-syslog --vrrp --use-file "/etc/rack-edge/keepalived-$NODE_NAME.conf"']
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # Addresses and routes, and the raw sockets VRRP and gratuitous
              # ARP go out on.
              add: [NET_ADMIN, NET_RAW]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rack-edge
              readOnly: true
            - name: vrrp
              mountPath: /etc/rack-edge-vrrp
              readOnly: true
        - name: dhcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --no-daemon rather than --keep-in-foreground: it also keeps dnsmasq from
          # changing to a user and group of its own, which it has no capability for.
          command: [dnsmasq, --no-daemon, --conf-file=/etc/rack-edge/dnsmasq.conf]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # Port 67, the ARP entry a unicast reply needs, and the ping that
              # checks an address is free before offering it.
              add: [NET_BIND_SERVICE, NET_ADMIN, NET_RAW]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rack-edge
              readOnly: true
            - name: leases
              mountPath: /var/lib/misc
        # The machines segment's DHCP, a dnsmasq of its own because it must not
        # be authoritative: both edges answer there.
        - name: dhcp-machines
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [dnsmasq, --no-daemon, --conf-file=/etc/rack-edge/dnsmasq-machines.conf]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, NET_ADMIN, NET_RAW]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rack-edge
              readOnly: true
            - name: leases
              mountPath: /var/lib/misc
        # The machines' addresses, advertised to the tailnet by both edges
        # through the node's own tailscaled, so the tailnet fails over between
        # them. tailscaled trusts its socket's caller by uid, and this runs as
        # root, so it needs no capability.
        - name: routes
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -ec, 'while :; do sh /etc/rack-edge/tailnet-routes.sh; sleep {{ .Values.reapplySeconds }}; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rack-edge
              readOnly: true
            - name: tailscale
              mountPath: /run/tailscale
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rack-edge-{{ $site }}
        - name: vrrp
          secret:
            secretName: rack-edge-{{ $site }}-vrrp
            defaultMode: 0400
        # On the node, so a restarted pod hands a switch the lease it had.
        - name: leases
          hostPath:
            path: /var/lib/misc
            type: DirectoryOrCreate
        - name: tailscale
          hostPath:
            path: /run/tailscale
            type: Directory
