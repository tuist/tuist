{{- $site := include "rack-edge.site" . }}
{{- $hash := include "rack-edge.hash" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rack-edge-{{ $site }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rack-edge.labels" . | nindent 4 }}
spec:
  # One edge at a time, and the second only once the first has run the new
  # configuration for longer than keepalived's minute before the preferred
  # edge takes the addresses back. Without it a rollout restarted both edges
  # about 15 s apart (2026-10-05), and every rack node lost its path to the
  # cluster twice. A pod is ready once its edge's static pod has applied the
  # configuration it installed.
  minReadySeconds: 90
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rack-edge
      tuist.dev/rack-edge: {{ $site }}
  template:
    metadata:
      labels:
        {{- include "rack-edge.labels" . | nindent 8 }}
      annotations:
        tuist.dev/rack-edge-hash: {{ $hash | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        tuist.dev/rack-edge: {{ $site }}
      tolerations:
        - key: tuist.dev/rack-edge
          operator: Equal
          value: {{ $site }}
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      # Writes the edge's static pod (templates/_static-pod.tpl) and what it
      # reads onto the node, and keeps them there. The configuration goes
      # first, under a directory named after its hash, and the manifest that
      # names that directory last, each by a rename, so the kubelet never
      # reads a half-written one. A configuration the static pod no longer
      # runs is deleted once it runs the new one. The VRRP password is kept
      # equal to the Secret in a place of its own, and keepalived reads it
      # when the static pod next starts. Going away leaves the static
      # pod running: that is what keeps the edge up while this pod restarts,
      # and taking an edge's workload off it is deleting the manifest.
      containers:
        - name: install
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              config=/host/etc/rack-edge/$RACK_EDGE_HASH
              vrrp=/host/etc/rack-edge-vrrp/authentication.conf
              manifest=/host/etc/kubernetes/manifests/rack-edge-$RACK_EDGE_SITE.yaml
              install() {
                if [ ! -e "$config/.complete" ]; then
                  rm -rf "$config.new"
                  mkdir -p "$config.new"
                  for f in /config/*; do
                    [ "${f##*/}" = rack-edge.yaml ] || cp "$f" "$config.new/"
                  done
                  touch "$config.new/.complete"
                  rm -rf "$config"
                  mv "$config.new" "$config"
                fi
                if ! cmp -s /vrrp/authentication.conf "$vrrp"; then
                  chmod 0700 "${vrrp%/*}"
                  cp /vrrp/authentication.conf "$vrrp.new"
                  chmod 0400 "$vrrp.new"
                  mv "$vrrp.new" "$vrrp"
                fi
                if ! cmp -s /config/rack-edge.yaml "$manifest"; then
                  cp /config/rack-edge.yaml "${manifest%/*}/.rack-edge-$RACK_EDGE_SITE.yaml.new"
                  mv "${manifest%/*}/.rack-edge-$RACK_EDGE_SITE.yaml.new" "$manifest"
                  echo "installed the static pod for configuration $RACK_EDGE_HASH"
                fi
              }
              while :; do
                install
                if [ "$(cat /host/run/rack-edge/started 2>/dev/null)" = "$RACK_EDGE_HASH" ]; then
                  for d in /host/etc/rack-edge/*; do
                    case "$d" in
                      "$config") ;;
                      *) rm -rf "$d"; echo "removed ${d#/host}, which nothing runs any more" ;;
                    esac
                  done
                fi
                sleep 30
              done
          env:
            - name: RACK_EDGE_HASH
              value: {{ $hash | quote }}
            - name: RACK_EDGE_SITE
              value: {{ $site | quote }}
          # Ready once the static pod has applied this configuration's path.
          readinessProbe:
            exec:
              command: [sh, -c, 'test "$(cat /host/run/rack-edge/started 2>/dev/null)" = "$RACK_EDGE_HASH"']
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: vrrp
              mountPath: /vrrp
              readOnly: true
            - name: host-config
              mountPath: /host/etc/rack-edge
            - name: host-vrrp
              mountPath: /host/etc/rack-edge-vrrp
            - name: host-manifests
              mountPath: /host/etc/kubernetes/manifests
            - name: host-state
              mountPath: /host/run/rack-edge
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rack-edge-{{ $site }}
        - name: vrrp
          secret:
            secretName: rack-edge-{{ $site }}-vrrp
            defaultMode: 0400
        - name: host-config
          hostPath:
            path: /etc/rack-edge
            type: DirectoryOrCreate
        - name: host-vrrp
          hostPath:
            path: /etc/rack-edge-vrrp
            type: DirectoryOrCreate
        - name: host-manifests
          hostPath:
            path: /etc/kubernetes/manifests
            type: DirectoryOrCreate
        - name: host-state
          hostPath:
            path: /run/rack-edge
            type: DirectoryOrCreate
