# generated by rack:fleet render from infra/rack-switch-fleet/sites/larch.json
port=0
interface=mgmt0
bind-dynamic
no-hosts
no-resolv
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/tuist-rack-dhcp.leases
log-facility=-
log-dhcp
dhcp-range=set:known,192.168.60.0,static,255.255.255.0,infinite
dhcp-option=tag:known,option:router,192.168.60.10
dhcp-range=set:provisioning,192.168.70.100,192.168.70.150,255.255.255.0,1h
dhcp-option=tag:provisioning,option:router,192.168.70.1
dhcp-option=option:domain-name,rack.tuist.dev
