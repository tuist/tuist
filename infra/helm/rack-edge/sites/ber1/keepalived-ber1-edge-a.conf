  virtual_ipaddress {
    192.168.0.10/24 dev enp87s0 noprefixroute
    192.168.50.1/24 dev enp87s0
    10.10.0.1/32 dev machines0
  }
  virtual_routes {
    192.168.0.13/32 dev enp87s0 src 192.168.0.10
    192.168.0.14/32 dev enp87s0 src 192.168.0.10
    192.168.0.15/32 dev enp87s0 src 192.168.0.10
    192.168.0.16/32 dev enp87s0 src 192.168.0.10
  }
