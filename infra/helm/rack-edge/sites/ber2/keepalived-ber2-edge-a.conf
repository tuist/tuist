# generated by rack:fleet render from infra/rack-switch-fleet/sites/ber2.json
global_defs {
  router_id ber2-edge-a
  vrrp_garp_master_refresh 60
  vrrp_check_unicast_src
}

vrrp_instance ber2_edge {
  state BACKUP
  interface vrrp0
  virtual_router_id 1
  priority 150
  preempt_delay 60
  advert_int 1
  unicast_src_ip 10.255.255.1
  include /etc/rack-edge-vrrp/authentication.conf
  unicast_peer {
    10.255.255.2
  }
  track_interface {
    mgmt0
  }
  virtual_ipaddress {
    192.168.60.10/24 dev mgmt0 noprefixroute
    192.168.70.1/24 dev mgmt0
    10.20.0.1/32 dev machines0
  }
}
