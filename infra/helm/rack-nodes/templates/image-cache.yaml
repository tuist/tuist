{{- $cache := .Values.rackFleet.imageCache | default dict }}
{{- if and .Values.capi.enabled .Values.rackFleet.enabled $cache.enabled }}
{{- $fleetName := include "rackNodes.imageCacheName" . }}
{{- $images := include "rackNodes.imageCacheImages" . | fromJsonArray }}
{{- range $node := (required "rackFleet.imageCache.nodes needs a storage node to run on" $cache.nodes) }}
{{- $name := printf "%s-%s" $fleetName $node.name | trunc 63 | trimSuffix "-" }}
{{- $sizeSuffix := printf "-%dgi" (int $cache.sizeGi) }}
{{- $claimName := printf "%s%s" ($name | trunc (int (sub 63 (len $sizeSuffix))) | trimSuffix "-") $sizeSuffix }}
{{- $address := required (printf "rackFleet.imageCache.nodes[%s].address is required" $node.name) $node.address }}
{{- /*
A plain registry: it serves what the filler below has copied into it and
answers 404 for anything else, at once, so a mini pulls that from the
upstream. It fetches nothing itself. Collection runs often, so the space an
eviction frees reaches the filler's next pass.
*/}}
{{- $config := dict
  "distSpecVersion" "1.1.1"
  "storage" (dict
    "rootDirectory" "/data/zot"
    "dedupe" true
    "gc" true
    "gcDelay" "5m"
    "gcInterval" "10m")
  "http" (dict "address" $address "port" ($cache.port | toString))
  "log" (dict "level" "info")
  "extensions" (dict
    "metrics" (dict "enable" true "prometheus" (dict "path" "/metrics"))) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rackNodes.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rack-image-cache
data:
  config.json: |
    {{- $config | toPrettyJson | nindent 4 }}
---
# The cache's blobs, on the node's XFS /data under a project quota, so a
# cache that fills cannot take the node's Kura region with it. Bound to the
# node by the local-path class's WaitForFirstConsumer once the pod lands.
#
# Named after its size: a claim cannot shrink, so a new size is a new volume,
# which the cache fills again from the upstream, and Helm deletes the old one
# once the Deployment's Recreate has released it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claimName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rackNodes.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rack-image-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $cache.storageClass | quote }}
  resources:
    requests:
      storage: {{ printf "%dGi" (int $cache.sizeGi) }}
---
# One cache per storage node, at that node's machines address, where the
# minis on the same segment pull from it: a rack node's pods reach no
# Service and nothing outside the node reaches a pod off the host network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rackNodes.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rack-image-cache
spec:
  replicas: 1
  # One writer to the volume and one listener on the address at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: rack-image-cache
      tuist.dev/rack-image-cache: {{ $node.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rack-image-cache
        tuist.dev/rack-image-cache: {{ $node.name | quote }}
      annotations:
        checksum/config: {{ $config | toJson | sha256sum }}
    spec:
      hostNetwork: true
      # The node's own resolvers: a rack node has no route to the cluster's
      # DNS Service, and the cache resolves ghcr.io.
      dnsPolicy: Default
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ $node.name | quote }}
      tolerations:
        - key: tuist.dev/rack-storage
          operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: zot
          image: {{ printf "%s:%s" $cache.image.repository $cache.image.tag | quote }}
          imagePullPolicy: {{ $cache.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              host: {{ $address | quote }}
              port: {{ int $cache.port }}
              path: /v2/
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: {{ $address | quote }}
              port: {{ int $cache.port }}
              path: /v2/
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- $resources := deepCopy ($cache.resources | default dict) }}
            {{- $_ := set $resources "requests" (merge (dict "ephemeral-storage" (printf "%dGi" (int $cache.sizeGi))) ($resources.requests | default dict)) }}
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- if $images }}
        # Copies the images into the registry above, from the upstream, under
        # the bounds infra/cluster-api-provider-tuist/internal/rackimagefiller
        # describes: only what fits the volume and the day's budget, blob by
        # blob, backing off a failing image for hours.
        - name: filler
          image: {{ include "rackNodes.image" $ | quote }}
          imagePullPolicy: {{ $.Values.macosFleet.image.pullPolicy }}
          command: [/usr/local/bin/rack-image-filler]
          args:
            - --images={{ join "," $images }}
            - --registry={{ $address }}:{{ int $cache.port }}
            - --state-file=/data/filler/state.json
            - --volume=/data
            - --reserve-gib={{ int $cache.reserveGiB }}
            - --daily-budget-gib={{ int $cache.dailyBudgetGiB }}
            - --interval={{ $cache.fillInterval }}
            - --metrics-address={{ $address }}:{{ int $cache.metricsPort }}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $cache.fillerResources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $claimName }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
{{- end }}
{{- end }}
