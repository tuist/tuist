apiVersion: v1
kind: Service
metadata:
  name: {{ include "pomerium.fullname" . }}
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.orbAccess.enabled }}
    - port: {{ .Values.orbAccess.port }}
      targetPort: orb
      protocol: TCP
      name: orb
    {{- end }}
  selector:
    {{- include "pomerium.selectorLabels" . | nindent 4 }}
