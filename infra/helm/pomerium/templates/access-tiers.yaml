{{- /*
ClusterRoleBindings that grant the impersonated identities the
right tier. Pomerium injects `Impersonate-Group: <name>` based on
the user's tailnet role + active elevation; the bindings here are
what makes those group names mean something to the apiserver.

The chart that introduces the groups (this one) owns the bindings
for them, so deploying this chart to a fresh cluster gets the
identity → RBAC story end-to-end with no external dependency.

LOAD-BEARING BEYOND THIS CHART. In staging, human kubectl no longer
arrives through Pomerium at all — it comes over the tailnet via
Tailscale's API server proxy, which injects these same group names
from the `tailscale.com/cap/kubernetes` grants in
infra/tailscale/acls.json (see
infra/helm/tailscale-operator/values-staging.yaml). The bindings
below are what those grants resolve against, so uninstalling the
Pomerium release in staging would silently drop every human to no
tier at all — through either door. Move this file before removing
that release, don't delete it with it.

Tier shape (matches what tuist-ops's PolicyController returns, and
what the staging ACL grants name):

  tuist-admins         → view   (Owner / Admin tailnet role)
  tuist-eng            → view   (Member tailnet role)
  tuist-<env>-write    → edit   (per-env so a prod elevation
                                 can't unlock canary or vice
                                 versa)

On canary and production the write group is only ever injected
against an active JIT elevation, so every comment below that
talks about "an active elevation" holds there. On STAGING the
policy endpoint injects `tuist-staging-write` unconditionally
(`TuistOps.JIT.Policy.always_write_env?/1`), so everything this
file binds to the write group — including the directly-bound
`tuist-cnpg-decommission`, `tuist-volume-decommission`,
`tuist-fleet-unwedge` and `tuist-fleet-scale` roles — is standing
access for every engineering identity in the staging cluster.
That is intended: staging serves no customers and is the env we
break on purpose.

View tier excludes Secrets by Kubernetes' built-in role definition.
Edit allows reads/writes on Secrets + most resources but cannot
mutate RBAC.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-admins-view
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: tuist-admins
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-eng-view
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: tuist-eng
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-{{ .Values.tuistEnv }}-write-edit
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    name: tuist-{{ .Values.tuistEnv }}-write
    apiGroup: rbac.authorization.k8s.io
---
# Read-only extension to the `view` tier. The upstream `view` ClusterRole
# omits cluster-scoped and custom resources, so a view-tier identity (every
# member + their agents) can't observe the infra it routinely needs to:
# nodes, PersistentVolumes, CAPI machines, our Scaleway provider CRs, the Kura
# CRs, the RunnerPool CRs, the CNPG Postgres clusters, CRDs, and RBAC objects.
# This aggregates into `view` via the label below (no extra binding; both
# tuist-admins and tuist-eng inherit it), and is strictly
# `get`/`list`/`watch` with no `secrets` rule, so the view tier's deliberate
# Secret exclusion is untouched. None of these resource kinds embed secret
# data (CAPI/Kura/CNPG and a CSI PV's `nodePublishSecretRef` all reference
# Secrets by name, never inline).
#
# RBAC read (clusterroles/rolebindings) is the one deliberate widening of the
# upstream `view` shape: it exposes the authorization graph, which `view`
# normally hides as anti-recon. We accept that here because the whole
# cluster-access design contains agents on *mutation*, not reads, and being
# able to diagnose a `NotFound`/misbound RBAC object during a deploy is worth
# more than hiding the grant list from a read-only identity. Still read-only,
# still no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-view-infra-read
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - cluster.x-k8s.io
      - infrastructure.cluster.x-k8s.io
      - kura.tuist.dev
      - tuist.dev
      - postgresql.cnpg.io
      - barmancloud.cnpg.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
# Write extension to the `edit` tier, the mutate analog of
# `tuist-view-infra-read`. The upstream `edit` ClusterRole covers core/apps
# resources but not custom resources, so a JIT-elevated `tuist-<env>-write`
# identity can mutate Pods/StatefulSets/PVCs yet not the server-managed Kura
# CRs (KuraInstance). Those are reconciled from the control plane,
# so operators normally leave them alone — but a region cutover or cleanup
# sometimes needs to recreate them so they re-render (e.g. onto a new node
# pool). This aggregates into `edit` so an active write elevation can do that
# without the break-glass kubeconfig. Scoped to `kura.tuist.dev`. Broader
# CAPI/infra writes stay withheld from the edit tier; the one narrow host-
# recovery exception (`tuist-fleet-unwedge` below) is bound straight to the
# write-elevation group rather than aggregated here, so machine-delete never
# rides along on the generic `edit` tier. Scaling or tearing down a fleet
# remains a break-glass action.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-edit-kura-write
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["kura.tuist.dev"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
# RunnerPool analog of `tuist-edit-kura-write`. RunnerPool specs are
# helm-rendered and autoscaler-patched, but operational corrections
# sometimes need a direct write: healing spec drift the deploy pipeline
# cannot see (helm's three-way merge only patches fields whose rendered
# manifest changed between releases, so a value the apiserver rewrote
# out-of-band persists indefinitely), or nudging a pool while its next
# chart release is still in flight. Scoped to `runnerpools` rather than
# the whole `tuist.dev` group so future kinds in that group don't
# silently inherit write access from the edit tier.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-edit-runners-write
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["tuist.dev"]
    resources: ["runnerpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
# CNPG analog of `tuist-edit-kura-write`, and deliberately narrower. The
# CloudNativePG clusters (`tuist-tuist-pg`, `tuist-ops-pg`, and their per-env
# equivalents) were invisible to every tier until now: `postgresql.cnpg.io` was
# absent from `tuist-view-infra-read` above, and `edit` covers no custom
# resources at all. So an operator holding an active write elevation could not
# read a Cluster's status, let alone patch one, during exactly the incident the
# elevation exists for.
#
# Mutation is limited to verbs that change how a cluster runs, never whether it
# exists:
#   * clusters, poolers, scheduledbackups: update/patch. The real incident
#     actions: bump `instances`, adjust resources, change a `primaryUpdate`
#     strategy, annotate to force a reconcile, flip a pooler.
#   * backups: create. Taking an ad-hoc base backup before a risky change is
#     an incident-time action that cannot destroy anything. No delete: pruning
#     the archive is barman's retention job, not an operator's.
#
# `delete` on `clusters` is withheld from THIS role, which is where it diverges
# from `tuist-edit-kura-write`. A Kura CR is regenerable (the control plane
# re-renders it and the mesh refills), so delete rides along with the other
# verbs there. A CNPG `Cluster` is not: deleting it deletes the PVCs it owns.
# Retiring a cluster is still a real operation, so the capability does exist,
# but it lives in `tuist-cnpg-decommission` below on a direct binding to the
# elevation group rather than in this aggregated role, so it cannot be
# inherited by anything else that later binds `edit`. `create` is withheld
# outright: standing up a datastore is a chart change, not an operator action.
#
# Scoped to named kinds rather than `*` so future kinds in the group (Database,
# Publication, Subscription) do not silently inherit write access, following
# `tuist-edit-runners-write`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-edit-cnpg-write
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers", "scheduledbackups"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "list", "watch", "create"]
---
# Decommission capability for RETIRING a CNPG cluster. Separated from
# `tuist-edit-cnpg-write` above because `delete` on a datastore deserves a
# tighter binding than the rest of the CNPG verbs, and modelled on
# `tuist-fleet-unwedge` below rather than on the aggregated roles.
#
# Why it exists at all: there is no tier between the JIT write elevation and
# the break-glass kubeconfig. Withholding cluster deletion from the elevation
# does not make the operation safer, it makes the only route to it the
# emergency path, so a planned decommission of a dead cluster would be done
# with credentials reserved for incidents. That inverts the access policy.
# Gating it behind an elevation that is requested with a stated intent,
# TTL-bounded, and audited is the stronger control.
#
# Why the blast radius is acceptable: every managed cluster archives WAL
# continuously and takes base backups to Tigris through the Barman Cloud
# Plugin, and the `ObjectStore` CR holding that archive is a separate object
# that a Cluster delete does not touch. The PVCs are `hcloud-volumes`, which
# is `reclaimPolicy: Retain`, so they outlive the Cluster too. Deleting a
# Cluster CR is therefore a severe outage and a restore, not data loss.
#
# Like `tuist-fleet-unwedge`, this is NOT aggregated into `edit`. It binds
# straight to `tuist-<env>-write` below, so the capability is welded to an
# active elevation and cannot be inherited by a service account or a team
# namespace through some later RoleBinding onto the generic `edit` role.
#
# Deliberately narrow: `clusters` only, `delete` only. Poolers, backups and
# scheduled backups keep the non-destructive verbs granted above. Namespaces
# stay untouched, so retiring a cluster leaves an empty namespace behind for
# an admin to sweep; that is inert, and granting namespace deletion here
# would reach every namespace in the cluster, not just a retired one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-cnpg-decommission
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["delete"]
---
# Bind the decommission role straight to this env's write-elevation group, so
# cluster deletion lives ONLY on an active `tuist-<env>-write` elevation and
# never on the generic `edit` tier. Per-env like the bindings above, so a prod
# elevation cannot retire a staging cluster or vice versa.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-{{ .Values.tuistEnv }}-write-cnpg-decommission
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuist-cnpg-decommission
subjects:
  - kind: Group
    name: tuist-{{ .Values.tuistEnv }}-write
    apiGroup: rbac.authorization.k8s.io
---
# Decommission capability for orphaned PersistentVolumes, the volume analog of
# `tuist-cnpg-decommission` and bound the same way.
#
# Two orphan classes accumulate here and an operator has to clear both by hand.
# A node-local (`scw-local-nvme`) PV keeps a `kubernetes.io/hostname` affinity
# to the box that carved it, so once a fleet node is replaced the local-path
# provisioner can never schedule its teardown helper pod and retries the delete
# forever. An `hcloud-volumes` PV is `reclaimPolicy: Retain`, so a deleted PVC
# leaves it Released and the block volume billing; `released-pv-reaper` sweeps
# that class on a grace window, but nothing sweeps the first.
#
# Withholding this from the elevation would not remove the capability, only
# relocate it to break-glass, so routine volume cleanup would run on incident
# credentials. Reads live in `tuist-view-infra-read` above, so this role carries
# the mutating verbs only.
#
# `update`/`patch` ride with `delete` because on a Retain PV they are one
# operation: flipping `persistentVolumeReclaimPolicy` to Delete first is what
# makes the CSI driver reap the backing volume, and deleting without it strands
# the volume with nothing left pointing at it. That is the leak this grant
# exists to clean up, not one to create.
#
# Not aggregated into `edit`, so PV deletion stays welded to an active
# elevation. A Bound PV is still protected: the `pv-protection` finalizer holds
# it until its claim is gone, so a volume in use cannot be removed by mistake.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-volume-decommission
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-{{ .Values.tuistEnv }}-write-volume-decommission
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuist-volume-decommission
subjects:
  - kind: Group
    name: tuist-{{ .Values.tuistEnv }}-write
    apiGroup: rbac.authorization.k8s.io
---
# Host-recovery capability for UN-WEDGING a single fleet host without the
# break-glass kubeconfig. A tart-kubelet host whose drift roll can't reach it
# (the runner-mini SSH accept-backlog wedge) exhausts its retry budget, its
# ScalewayAppleSiliconMachine goes terminal (`TartKubeletUpdateExceededRetries`)
# and the drift loop stops — the host is then stranded on its old config until
# an operator either recreates the CAPI Machine (the MachineSet reprovisions a
# fresh host) or clears the terminal status so the loop resumes. Both were
# break-glass-only because the base `edit` tier keeps CAPI/infra CRs read-only.
#
# Unlike `tuist-edit-kura-write`, this is NOT aggregated into `edit`. It is
# bound directly to the `tuist-<env>-write` elevation group below. `delete
# machines` is sensitive enough that it must not ride along on the generic
# `edit` role, which anyone could later grant to a service account or a team's
# namespace via a RoleBinding — those grantees would silently inherit host
# deletion. A direct binding keeps the capability welded to an active,
# TTL-bounded, audited write elevation and nothing else.
#
# Deliberately narrow: this is host recovery, not fleet management.
#   * `machines` delete only. Every machine in the workload cluster is
#     MachineSet-owned (the control plane lives in the mgmt cluster), so a
#     delete can only recreate a worker host, never a control-plane node.
#     machinesets are untouched, and machinedeployments only through the
#     `/scale` subresource granted by `tuist-fleet-scale` below — tearing down
#     or redefining a fleet stays a break-glass action.
#   * machines/status update/patch — the owning CAPI Machine keeps its own
#     terminal failureReason/failureMessage, and clearing the infra machine's
#     status does not clear the parent's. Without this the Machine reports
#     Failed for a host that has been healthy and Running for weeks, which
#     makes `get machines` useless for spotting the next real failure. Granted
#     on the status subresource only: the spec stays immutable, so this cannot
#     retarget a Machine, only correct what it reports.
#   * scalewayapplesiliconmachines (+/status) update/patch — clear the terminal
#     failure so the drift loop retries. No delete: the CAPI Machine delete
#     cascades to the infra machine on its own.
#   * scalewayapplesiliconmachinetemplates update/patch — heal spec drift on the
#     template a MachineSet clones. Helm patches these CRs manifest-to-manifest,
#     so a field the live object never received is never backfilled, and an
#     invalid clone fails every scale-up. Without this verb the `machines` delete
#     above is a one-way trapdoor: the operator can retire a host but the
#     MachineSet cannot recreate it, and repairing the template needs
#     break-glass. Update/patch only — create/delete would change which template
#     a fleet renders from, which is fleet management.
#   * nodes update/patch/delete + pods/eviction create — cordon and drain a
#     live host before recreating it, or remove a confirmed orphaned Node after
#     its Machine and infrastructure are already gone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-fleet-unwedge
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["scalewayapplesiliconmachines", "scalewayapplesiliconmachines/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["scalewayapplesiliconmachinetemplates"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
# Bind the host-recovery role straight to this env's write-elevation group, so
# the machine-unwedge capability lives ONLY on an active `tuist-<env>-write`
# elevation — never on the generic `edit` tier. Per-env like the edit binding
# above, so a prod elevation can't unwedge a staging host or vice versa.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-{{ .Values.tuistEnv }}-write-fleet-unwedge
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuist-fleet-unwedge
subjects:
  - kind: Group
    name: tuist-{{ .Values.tuistEnv }}-write
    apiGroup: rbac.authorization.k8s.io
---
# Capacity capability for a fleet whose node count is too low to run the deploy
# that would raise it. Bound directly to the write-elevation group, like
# `tuist-fleet-unwedge` above.
#
# Why it is not break-glass: a fleet's replica count is set by the chart, so the
# supported way to change it is a deploy. That deploy runs on the fleet it is
# changing. When a Linux runner fleet is short of nodes, its own release pipeline
# queues behind the jobs the surviving nodes are already saturated with, and the
# release that would add nodes is the one that cannot get a runner. Capacity is
# therefore the one fleet property whose repair path can be blocked by the thing
# it repairs, and an elevation that is requested with a stated intent, TTL-bounded
# and audited is a better control for it than credentials reserved for incidents.
#
# Why the blast radius is small: `/scale` writes `.spec.replicas` and nothing
# else (`specReplicasPath` on the CRD). The machine template, strategy, selector
# and every other field stay immutable, so this cannot retarget a fleet, change
# what a node is, or delete one. Raising it adds nodes from the provider's
# pre-ordered pool; lowering it removes nodes the same way a chart change would,
# through the MachineDeployment's own strategy rather than around it.
#
# The value is still the chart's to own. A scale applied here is reverted by the
# next release that renders a different number, which is the intended behaviour:
# the manual scale restores service, the chart remains the source of truth, and
# the two converge rather than one silently winning.
#
# Deliberately narrow: the `/scale` subresource only, on machinedeployments only.
# `machinesets` are excluded because scaling one directly fights its owning
# MachineDeployment, and full `update` on machinedeployments is excluded because
# that is fleet redefinition rather than capacity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-fleet-scale
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machinedeployments/scale"]
    verbs: ["get", "update", "patch"]
---
# Per-env like the bindings above, so a prod elevation cannot scale a staging
# fleet or vice versa.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuist-{{ .Values.tuistEnv }}-write-fleet-scale
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuist-fleet-scale
subjects:
  - kind: Group
    name: tuist-{{ .Values.tuistEnv }}-write
    apiGroup: rbac.authorization.k8s.io
---
# Live-debug extension to the `edit` tier — the capabilities an operator reaches
# for when a pod or node is misbehaving and reads alone can't narrow the cause.
# The upstream `edit` role already covers `pods/exec` (a shell in the container),
# but two gaps bite during the incidents this elevation exists for:
#
#   * `pods/ephemeralcontainers` → `kubectl debug`. The Kura pods (and most of
#     our images) are distroless, so `exec` lands in a container with no shell
#     and no `curl` — useless for "curl the instance's own metrics/health
#     endpoint from inside." An ephemeral debug container shares the target
#     pod's network namespace, so it can `curl localhost:<port>` against the
#     process even when the pod is not Ready and even though the per-tenant
#     NetworkPolicy blocks the apiserver from pod-proxying it directly.
#
#   * `nodes/proxy` (get) → the kubelet's read endpoints (`/stats/summary`,
#     `/metrics`) on the node hosting the pod. This is the "is it disk, or the
#     algorithm?" question answered without SSH: kubelet stats report the node's
#     filesystem + resource pressure. Host-level, so unaffected by pod
#     NetworkPolicies. Scoped to `get` only — POST/`create` through the kubelet
#     proxy would be a second exec path, and it's not needed to read stats.
#
# Aggregates into `edit`, which only the JIT-elevated `tuist-<env>-write` group
# binds to, so both are gated behind an active `/elevate` (TTL-bounded, audited)
# and never available to the always-on view tier. Both are genuine privilege
# boundaries — `kubectl debug` mutates a running pod, and `nodes/proxy` reaches
# arbitrary kubelet read endpoints — so elevation, not the base tier, is the
# right home for them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuist-edit-live-debug
  labels:
    {{- include "pomerium.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
