{{- if .Values.externalSecrets.enabled }}
{{- /*
ESO syncs every chart-referenced env var from 1Password into a single
`atlas-app` Secret which the Deployment + migration Job consume via
envFrom. A separate Secret (not merged with anything chart-managed)
avoids helm-vs-ESO write conflicts on the same object.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "atlas.appSecretName" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ include "atlas.appSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $env, $cfg := .Values.externalSecrets.items }}
        # Trim scalar credentials by default; multiline key material can
        # opt out so its PEM bytes survive the 1Password-to-Secret handoff.
        {{- if dig "trim" true $cfg }}
        {{ $env }}: "{{ printf "{{ .%s | trim }}" $env }}"
        {{- else }}
        {{ $env }}: "{{ printf "{{ .%s }}" $env }}"
        {{- end }}
        {{- end }}
  data:
    {{- range $env, $cfg := .Values.externalSecrets.items }}
    - secretKey: {{ $env }}
      remoteRef:
        # 1Password SDK provider expects a single `<item>/<field>` string
        # in remoteRef.key. Vault is set at the ClusterSecretStore level.
        key: {{ $cfg.remoteRef | quote }}
    {{- end }}
{{- if .Values.externalSecrets.pullSecret.enabled }}
---
# Image pull secret for the private GHCR repo. The 1P item's notes field
# holds a base64-encoded ~/.docker/config.json snippet:
#   { "auths": { "ghcr.io": { "auth": "<base64 of user:PAT>" } } }
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecretName }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.image.pullSecretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson | b64dec }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: "{{ .Values.externalSecrets.pullSecret.item }}/{{ .Values.externalSecrets.pullSecret.field }}"
{{- end }}

{{- end }}
