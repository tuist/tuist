{{- if and .Values.clickhouse.enabled .Values.clickhouse.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "atlas.clickhouseName" . }}-backup
  labels:
    {{- include "atlas.clickhouseLabels" . | nindent 4 }}
spec:
  # Retention is enforced by an S3 lifecycle rule on the bucket so this
  # CronJob only creates new snapshots. ClickHouse writes the backup
  # directly from the server via `BACKUP DATABASE ... TO S3(...)`, which
  # means the CronJob does not need to mount the data PVC.
  schedule: {{ .Values.clickhouse.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.clickhouse.backup.activeDeadlineSeconds }}
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "atlas.clickhouseLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: clickhouse-backup
              image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
              imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
              command:
                - /bin/sh
                - -euc
                - |
                  TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  {{- if .Values.clickhouse.backup.s3.endpoint }}
                  ENDPOINT="{{ .Values.clickhouse.backup.s3.endpoint }}"
                  ENDPOINT="${ENDPOINT%/}"
                  BACKUP_URL="${ENDPOINT}/{{ .Values.clickhouse.backup.s3.bucket }}/{{ .Values.clickhouse.backup.s3.path }}/${TIMESTAMP}.zip"
                  {{- else }}
                  BACKUP_URL="https://s3.{{ .Values.clickhouse.backup.s3.region }}.amazonaws.com/{{ .Values.clickhouse.backup.s3.bucket }}/{{ .Values.clickhouse.backup.s3.path }}/${TIMESTAMP}.zip"
                  {{- end }}
                  echo "Backing up database {{ .Values.clickhouse.database }} to ${BACKUP_URL}"
                  clickhouse-client \
                    --host "{{ include "atlas.clickhouseName" . }}" \
                    --port "{{ .Values.clickhouse.service.nativePort }}" \
                    --user "{{ .Values.clickhouse.username }}" \
                    --password "$CLICKHOUSE_PASSWORD" \
                    --query "BACKUP DATABASE {{ .Values.clickhouse.database }} TO S3('${BACKUP_URL}', '${AWS_ACCESS_KEY_ID}', '${AWS_SECRET_ACCESS_KEY}')"
              env:
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "atlas.appSecretName" . }}
                      key: SECRET_KEY_BASE
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.clickhouse.backup.credentialsSecretName | quote }}
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.clickhouse.backup.credentialsSecretName | quote }}
                      key: SECRET_ACCESS_KEY
              resources:
                {{- toYaml .Values.clickhouse.backup.resources | nindent 16 }}
{{- end }}
