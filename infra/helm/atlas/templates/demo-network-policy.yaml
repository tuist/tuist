{{- if .Values.demo.enabled }}
# No Internet or production-service egress, even if a future page accidentally
# performs an upstream read. PostgreSQL is isolated in the demo namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas.fullname" . }}-egress
spec:
  podSelector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.demo.databaseNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.demo.databasePodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
