apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "luft-git.name" . }}
  labels:
    {{- include "luft-git.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "luft-git.name" . }}-headless
  # This is the single-node profile, not a replicated ledger. Do not scale it.
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "luft-git.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "luft-git.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: enroute
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "file:///etc/enroute/enroute.toml"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "bucket.existingSecret is required" (.Values.bucket.existingSecret | trim) | quote }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bucket.existingSecret | trim | quote }}
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - { name: api, containerPort: 50051, protocol: TCP }
            - { name: status, containerPort: 7400, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /status, port: status }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /status, port: status }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/enroute, readOnly: true }
            - { name: data, mountPath: /var/lib/enroute }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "luft-git.name" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.className }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
