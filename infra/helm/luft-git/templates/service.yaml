apiVersion: v1
kind: Service
metadata:
  name: {{ include "luft-git.name" . }}
  labels:
    {{- include "luft-git.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "luft-git.selectorLabels" . | nindent 4 }}
  ports:
    - { name: api, port: 50051, targetPort: api, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "luft-git.name" . }}-headless
  labels:
    {{- include "luft-git.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "luft-git.selectorLabels" . | nindent 4 }}
  ports:
    - { name: api, port: 50051, targetPort: api, protocol: TCP }
