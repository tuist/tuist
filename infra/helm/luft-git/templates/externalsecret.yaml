{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "bucket.existingSecret is required" .Values.bucket.existingSecret | quote }}
  labels:
    {{- include "luft-git.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ .Values.bucket.existingSecret | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .access_key_id | trim }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secret_access_key | trim }}` }}"
  dataFrom:
    - extract:
        key: {{ required "externalSecret.item is required" .Values.externalSecret.item | quote }}
{{- end }}
