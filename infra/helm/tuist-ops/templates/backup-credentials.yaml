{{- /*
ESO ExternalSecret syncing the Tigris key barman uses to write WAL and base
backups: tuist-ops's own key, scoped by an IAM policy to the `tuist-ops/`
prefix of tuist-prod-pg-backups (README "Backup key"). Never the shared
S3_BACKUP_CREDENTIALS: the server archives to the bucket root with it, so it
reads and deletes customer Postgres backups.
*/}}
{{- if .Values.postgresql.backup.enabled }}
{{- if eq .Values.postgresql.backup.credentialsItem "S3_BACKUP_CREDENTIALS" }}
{{- fail "postgresql.backup.credentialsItem must be this app's own prefix-scoped key, never S3_BACKUP_CREDENTIALS (it can read and delete the server's backups)" }}
{{- end }}
{{- if not (hasSuffix "/tuist-ops" (trimSuffix "/" .Values.postgresql.backup.destinationPath)) }}
{{- fail "postgresql.backup.destinationPath must be the tuist-ops/ prefix its key is scoped to" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.backup.credentialsSecretName }}
  labels:
    {{- include "tuist-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-backup
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ .Values.postgresql.backup.credentialsSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ `{{ .access_key_id | trim }}` }}"
        ACCESS_SECRET_KEY: "{{ `{{ .secret_access_key | trim }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.postgresql.backup.credentialsItem | quote }}
{{- end }}
