global:
  commonLabels:
    tuist.dev/service: slack
    tuist.dev/stack: managed

ingress:
  enabled: true
  className: nginx
  host: slack.tuist.dev
  tlsSecretName: slack-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare

# Mailgun until sesStartsAt, then SES without a restart, after 30 days'
# notice of the subprocessor change. Afterwards set provider: ses.
mailer:
  provider: mailgun
  sesStartsAt: "2026-12-06T00:00:00Z"
  sesRegion: eu-west-1

runtimeSecrets:
  externalSecret:
    enabled: true
    item: SLACK_INVITATION_APP

networkPolicy:
  enabled: true

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

nodeSelector:
  node.cluster.x-k8s.io/pool: general
