# Overlay for the canary workload cluster.
# Install with:
#   helm dependency update infra/helm/k8s-monitoring
#   helm upgrade --install k8s-monitoring infra/helm/k8s-monitoring \
#     -n observability --create-namespace \
#     -f infra/helm/k8s-monitoring/values-canary.yaml

k8s-monitoring:
  cluster:
    name: tuist-canary

  destinations:
    grafana-cloud-metrics:
      extraLabels:
        env: canary
    grafana-cloud-logs:
      extraLabels:
        env: canary
    # OTLP destinations don't take extraLabels; traces are identified by
    # `cluster = tuist-canary` (auto-set from k8s-monitoring.cluster.name)
    # plus the `deployment.environment` resource attribute below.
    grafana-cloud-traces:
      processors:
        attributes:
          actions:
            - action: insert
              key: deployment.environment
              value: canary

    # Independently deployed in-cluster Pulse. Features leave
    # `destinations` empty, so every feature sends to all compatible
    # destinations: these receive exactly what Grafana Cloud receives, each
    # through its own write queue so a Pulse outage cannot hold back Grafana Cloud delivery. Basic
    # auth carries the tenant as the username.
    pulse-metrics:
      type: prometheus
      url: http://pulse.observability.svc.cluster.local:4000/api/v1/write
      auth:
        type: basic
        usernameKey: pulse-username
        passwordKey: pulse-password
      secret:
        create: false
        name: pulse-credentials
        namespace: observability
      extraLabels:
        env: canary
      # Same restart-scoped label and metric drops as Grafana Cloud.
      metricProcessingRules: |
        write_relabel_config {
          action = "labeldrop"
          regex = "container_id|uid|pod_ip|image_id|image_spec|k8s_pod_uid"
        }
        write_relabel_config {
          source_labels = ["__name__"]
          regex = "node_network_(receive|transmit)_drop_total|traces_service_graph_request_.*"
          action = "drop"
        }
        write_relabel_config {
          source_labels = ["job"]
          regex = "integrations/(process|self)"
          action = "drop"
        }

    pulse-logs:
      type: loki
      url: http://pulse.observability.svc.cluster.local:4000/loki/api/v1/push
      auth:
        type: basic
        usernameKey: pulse-username
        passwordKey: pulse-password
      secret:
        create: false
        name: pulse-credentials
        namespace: observability
      extraLabels:
        env: canary

    pulse-traces:
      type: otlp
      url: http://pulse.observability.svc.cluster.local:4000
      protocol: http
      metrics:
        enabled: false
      logs:
        enabled: false
      traces:
        enabled: true
      auth:
        type: basic
        usernameKey: pulse-username
        passwordKey: pulse-password
      secret:
        create: false
        name: pulse-credentials
        namespace: observability
      # Pulse rejects requests above 10,000 records or 4 MiB; the default
      # 8192-span trigger with no ceiling can exceed both under load.
      processors:
        batch:
          size: 2048
          maxSize: 2048
        attributes:
          actions:
            - action: insert
              key: deployment.environment
              value: canary

  # Put the receiver on the tailnet. See values-production.yaml for the full
  # rationale; the short version is that everything running on a Mac mini —
  # the Tart guests and now the host itself — reaches the cluster only over
  # the tailnet, and the receiver's `loki.source.api` on 3100 is where their
  # logs land (infra/helm/tuist macosFleet.hostLogs.url points here).
  collectors:
    alloy-control-plane:
      includeDestinations:
        - grafana-cloud-metrics
        - pulse-metrics
    alloy-receiver:
      service:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: tuist-alloy-receiver-canary
          tailscale.com/tags: tag:tuist-k8s-canary
