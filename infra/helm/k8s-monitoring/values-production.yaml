# Overlay for the production workload cluster.
# Install with:
#   helm dependency update infra/helm/k8s-monitoring
#   helm upgrade --install k8s-monitoring infra/helm/k8s-monitoring \
#     -n observability --create-namespace \
#     -f infra/helm/k8s-monitoring/values-production.yaml

k8s-monitoring:
  cluster:
    name: tuist-production

  destinations:
    grafana-cloud-metrics:
      extraLabels:
        env: production
    grafana-cloud-logs:
      extraLabels:
        env: production
    # OTLP destinations don't take extraLabels; traces are identified by
    # `cluster = tuist-production` (auto-set from k8s-monitoring.cluster.name)
    # plus the `deployment.environment` resource attribute below.
    grafana-cloud-traces:
      processors:
        attributes:
          actions:
            - action: insert
              key: deployment.environment
              value: production
        tailSampling:
          collector:
            controller:
              replicas: 2


    # In-cluster Pulso (see `pulso` at the top level). Features leave
    # `destinations` empty, so every feature sends to all compatible
    # destinations: these receive exactly what Grafana Cloud receives, each
    # through its own write queue so a Pulso outage cannot hold back Grafana Cloud delivery. Basic
    # auth carries the tenant as the username.
    pulso-metrics:
      type: prometheus
      url: http://pulso.observability.svc.cluster.local:4000/api/v1/write
      auth:
        type: basic
        usernameKey: pulso-username
        passwordKey: pulso-password
      secret:
        create: false
        name: pulso-credentials
        namespace: observability
      extraLabels:
        env: production
      # Same restart-scoped label and metric drops as Grafana Cloud.
      metricProcessingRules: |
        write_relabel_config {
          action = "labeldrop"
          regex = "container_id|uid|pod_ip|image_id|image_spec|k8s_pod_uid"
        }
        write_relabel_config {
          source_labels = ["__name__"]
          regex = "node_network_(receive|transmit)_drop_total|traces_service_graph_request_.*"
          action = "drop"
        }
        write_relabel_config {
          source_labels = ["job"]
          regex = "integrations/(process|self)"
          action = "drop"
        }

    pulso-logs:
      type: loki
      url: http://pulso.observability.svc.cluster.local:4000/loki/api/v1/push
      auth:
        type: basic
        usernameKey: pulso-username
        passwordKey: pulso-password
      secret:
        create: false
        name: pulso-credentials
        namespace: observability
      extraLabels:
        env: production

    pulso-traces:
      type: otlp
      url: http://pulso.observability.svc.cluster.local:4000
      protocol: http
      metrics:
        enabled: false
      logs:
        enabled: false
      traces:
        enabled: true
      auth:
        type: basic
        usernameKey: pulso-username
        passwordKey: pulso-password
      secret:
        create: false
        name: pulso-credentials
        namespace: observability
      # Pulso rejects requests above 10,000 records or 4 MiB; the default
      # 8192-span trigger with no ceiling can exceed both under load.
      processors:
        batch:
          size: 2048
          maxSize: 2048
        attributes:
          actions:
            - action: insert
              key: deployment.environment
              value: production

  # Put the OTLP receiver on the tailnet.
  #
  # The xcresult-processor runs inside macOS Tart VMs whose only network
  # interface is Tailscale (see the comment on postgresql.cnpg.pooler.tailscale
  # in the tuist chart). Those VMs are not on the cluster network and
  # tart-kubelet injects no cluster DNS, so the in-cluster receiver address
  # every workload inherits,
  # `k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4317`,
  # cannot resolve there. Spans were being created and dropped inside the VM:
  # Tempo has never held a single span with `os.type = darwin`.
  #
  # This is the same fix already used for Postgres, where a Tailscale
  # operator-managed proxy fronts the CNPG pooler so the same VMs can reach it.
  # The operator watches Services for `expose=true` and provisions a userspace
  # proxy node on the tailnet in front of the Service's ClusterIP, so no
  # cluster CIDR has to be routed through the subnet router.
  #
  # Linux workloads keep using the in-cluster address; only the Tart VMs are
  # pointed at this hostname (see xcresultProcessor.extraEnv in the tuist
  # chart's production values).
  collectors:
    alloy-control-plane:
      includeDestinations:
        - grafana-cloud-metrics
        - pulso-metrics
    alloy-receiver:
      service:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: tuist-alloy-receiver-production
          tailscale.com/tags: tag:tuist-k8s-production

    # BER1's Linux nodes. Their pods' logs and node-local Kura metrics reach
    # the receiver above over the tailnet; see alloy-rack in values.yaml.
    alloy-rack:
      enabled: true

pulso:
  enabled: true
  storage:
    bucket: tuist-pulso-production
  # Atlas runs in its own cluster and reaches Pulso over MCP only (see the
  # path allowlist in values.yaml), authenticated by the
  # workloadIdentity trust entry below.
  ingress:
    enabled: true
    className: nginx
    host: pulso.tuist.dev
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    tls:
      - secretName: pulso-tls
        hosts: [pulso.tuist.dev]
  # Production ingest volume is far above staging/canary; start with room
  # and resize from Pulso's self-monitoring metrics.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
  # The processor pool is untainted and sized only for the processor's own
  # rollout surge; anything else landing there can deadlock that rollout.
  nodeSelector:
    node.cluster.x-k8s.io/pool: general
  # The values below are what Pulso's production-volume load tests ran with
  # (docs/storage-costs.md): about 32x canary's metric series and 53x its log
  # bytes on one node. Object-store PUTs follow the 2 s coalescing window
  # instead of pushes, which is what keeps Tigris Class A requests flat as
  # ingest grows; acks wait up to 2 s longer.
  ingestBatching:
    flushIntervalMs: 2000
    maxConcurrentRequests: 256
  # Without metrics compaction every remote-write batch stays its own segment
  # and panels beyond ~20 minutes exceed the query segment budget. Finalized
  # hours group rows by metric name and add hourly rollups. No bucket
  # versioning needed; every writer here is 1.30+.
  metricsCompaction:
    enabled: true
    finalize: true
  # Merges per-push log segments, regroups settled hours by service
  # (groupByStream, default on) and builds per-minute rollups for volume panels.
  logCompaction:
    enabled: true
  # Tempo HTTP search/metrics and the MCP TraceQL tools.
  tempoSearch:
    enabled: true
  # Node-local cache of immutable segments: repeated panel reads and
  # maintenance reads of just-uploaded segments skip the billed GET. Production
  # fills about 3.6 GiB/hour, so 8 GiB covers 1h dashboards. Counts against the
  # node's ephemeral storage (emptyDir).
  objectCache:
    disk:
      enabled: true
      sizeMb: 8192
  # Preview only: observe mode computes the retention floor but deletes
  # nothing. Switching to enforce deletes data and needs an explicit decision.
  retention:
    mode: observe
    manifestFormat: paged
    logsDays: 30
    tracesDays: 14
    metricsDays: 90
  # Query budgets from the production load test. Three concurrent queries plus
  # two background workers at 160 MiB heap each stay well under the 4Gi limit;
  # concurrent panels queue up to 5 s for a slot instead of getting 429s.
  extraEnv:
    - name: PULSO_QUERY_MAX_CONCURRENT
      value: "3"
    - name: PULSO_QUERY_QUEUE_MS
      value: "5000"
    - name: PULSO_QUERY_MAX_HEAP_MB
      value: "160"
    - name: PULSO_QUERY_MAX_SAMPLES
      value: "300000"
    - name: PULSO_QUERY_MAX_SCAN_BYTES
      value: "268435456"
    - name: PULSO_QUERY_TIMEOUT_MS
      value: "15000"
  # Atlas (atlas-production cluster) authenticates with its projected
  # ServiceAccount token, audience pulso.tuist.dev. The JWKS is the Atlas
  # cluster's public signing key, the same one the Tuist server pins as
  # TUIST_ATLAS_TOKEN_JWKS; rotate both together. Read-only: no ingest.
  workloadIdentity:
    trust:
      - name: atlas-production
        issuer: https://kubernetes.default.svc.cluster.local
        audiences: [pulso.tuist.dev]
        max_token_ttl_seconds: 3600
        keys:
          type: inline
          jwks: '{"keys":[{"use":"sig","kty":"RSA","kid":"RlVpaMmFrqqIHY46_HT42inm4mfvqBKfwLVJiPCcl7g","alg":"RS256","n":"urnlzTgGSYHPHyc-sjXI7lzdx3ChfMpqUMpwuj1vgBMywpvdjFEKZ-5xWBBfS_GIna4q--YBau4zo21xFw0Jd-Ye8l4daXozFTwB1oOv-xOoIL7YITR8dtXsXzqeGIKx1rt90jE2vgvYQDBnkIf9ohgDIApbLICYGSAko5MfdypYhiO52KOxum8nB5dwIaKhr2-DiLQtFQbl__c6Uk2dFpW0_5u4d-uO6yspp5iVo54sc7XIlFNxPBlx2uVQZe8tvTH9Ipc_sovDjMfoKH7g0fG14q6xQU5CkQD1pNS__6J3xFvFYQEp3wXu4i_Rin65EI9GvNKtbZkH-sQ5e8jzLw","e":"AQAB"}]}'
        bindings:
          - subject: system:serviceaccount:atlas-production:atlas
            tenant: tuist
            capabilities: [read]
