# Overlay for the staging workload cluster.
# Install with:
#   helm dependency update infra/helm/k8s-monitoring
#   helm upgrade --install k8s-monitoring infra/helm/k8s-monitoring \
#     -n observability --create-namespace \
#     -f infra/helm/k8s-monitoring/values-staging.yaml

k8s-monitoring:
  cluster:
    name: tuist-staging

  global:
    # Every staging API server aggregates these labels at the source
    # (`aggregateApiServerMetrics` on the staging Cluster CR), so the
    # collector's legacy labeldrop is no longer needed. Never set this on a
    # cluster whose control plane isn't verified aggregated.
    apiServerMetricsAggregated: true

  destinations:
    grafana-cloud-metrics:
      extraLabels:
        env: staging
    grafana-cloud-logs:
      extraLabels:
        env: staging
    # OTLP destinations don't take extraLabels; traces are identified by
    # `cluster = tuist-staging` (auto-set from k8s-monitoring.cluster.name)
    # plus the `deployment.environment` resource attribute below.
    grafana-cloud-traces:
      processors:
        attributes:
          actions:
            - action: insert
              key: deployment.environment
              value: staging

    # Independently deployed in-cluster Pulse. Features leave
    # `destinations` empty, so every feature sends to all compatible
    # destinations. Metrics/logs share Cloud's processing; traces are unsampled.
    # Separate write queues keep Pulse retries independent of Cloud delivery.
    # Basic auth carries the tenant as the username.
    pulse-metrics:
      type: prometheus
      url: http://pulse.observability.svc.cluster.local:4000/api/v1/write
      auth:
        type: basic
        usernameKey: pulse-username
        passwordKey: pulse-password
      secret:
        create: false
        name: pulse-credentials
        namespace: observability
      extraLabels:
        env: staging

    pulse-logs:
      type: loki
      url: http://pulse.observability.svc.cluster.local:4000/loki/api/v1/push
      auth:
        type: basic
        usernameKey: pulse-username
        passwordKey: pulse-password
      secret:
        create: false
        name: pulse-credentials
        namespace: observability
      extraLabels:
        env: staging

    pulse-traces:
      type: otlp
      url: http://pulse.observability.svc.cluster.local:4000
      protocol: http
      metrics:
        enabled: false
      logs:
        enabled: false
      traces:
        enabled: true
      auth:
        type: basic
        usernameKey: pulse-username
        passwordKey: pulse-password
      secret:
        create: false
        name: pulse-credentials
        namespace: observability
      # Pulse rejects requests above 10,000 records or 4 MiB; the default
      # 8192-span trigger with no ceiling can exceed both under load.
      processors:
        serviceGraphMetrics:
          enabled: true
          destinations: [pulse-metrics]
          receiver:
            otlp:
              grpc:
                maxReceivedMessageSize: 20MB
          collector:
            controller:
              replicas: 1
              nodeSelector:
                node.cluster.x-k8s.io/pool: general
            alloy:
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
        batch:
          size: 2048
          maxSize: 2048
        attributes:
          actions:
            - action: insert
              key: deployment.environment
              value: staging

  # Put the receiver on the tailnet. See values-production.yaml for the full
  # rationale. Staging needs it for the Mac mini fleet's host logs: tart-kubelet
  # writes to /var/log/tart-kubelet.log on the mini, nothing in the cluster can
  # tail a macOS host (a "Pod" there is a Tart VM), so the host pushes to the
  # receiver's `loki.source.api` on 3100 over the tailnet instead. Staging is
  # where that path is proven before canary and production turn it on —
  # infra/helm/tuist macosFleet.hostLogs points here.
  collectors:
    alloy-control-plane:
      includeDestinations:
        - grafana-cloud-metrics
        - pulse-metrics
    alloy-receiver:
      service:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: tuist-alloy-receiver-staging
          tailscale.com/tags: tag:tuist-k8s-staging
