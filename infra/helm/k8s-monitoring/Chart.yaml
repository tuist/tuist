apiVersion: v2
name: tuist-k8s-monitoring
description: >
  Grafana Kubernetes Monitoring for Tuist-managed clusters. Wraps the
  upstream grafana/k8s-monitoring chart. Ships cluster-level metrics
  (kube-state-metrics, node-exporter, kubelet, cAdvisor), events, pod
  logs, and OTLP receivers for managed workload traces only to the
  independently deployed in-cluster Pulse, which Grafana Cloud reads.
type: application
version: 0.1.0
appVersion: "4.0.3"

dependencies:
  - name: k8s-monitoring
    version: 4.0.3
    repository: https://grafana.github.io/helm-charts
