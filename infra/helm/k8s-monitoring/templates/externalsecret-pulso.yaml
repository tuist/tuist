{{- if and .Values.externalSecrets.enabled .Values.pulso.enabled }}
# One Secret feeds both sides of the Pulso wiring: the Pulso Deployment reads
# the four keys its chart expects through `pulso.existingSecret`, and the
# Alloy `pulso-*` destinations authenticate with HTTP Basic
# (`pulso-username` = tenant, `pulso-password` = token). Pulso only stores the
# SHA-256 digest of the tenant token, so the digest is derived here from the
# same 1Password value the collectors send.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.pulso.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.pulso.existingSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ `{{ .SECRET_KEY_BASE | trim }}` }}"
        PULSO_TENANT_TOKENS: '{"{{ .Values.pulsoCredentials.tenant }}":"sha256${{ `{{ .TOKEN | trim | sha256sum }}` }}"}'
        PULSO_S3_ACCESS_KEY_ID: "{{ `{{ .S3_ACCESS_KEY_ID | trim }}` }}"
        PULSO_S3_SECRET_ACCESS_KEY: "{{ `{{ .S3_SECRET_ACCESS_KEY | trim }}` }}"
        pulso-username: {{ .Values.pulsoCredentials.tenant | quote }}
        # Read by the upstream destinations for X-Scope-OrgID; it must match
        # the Basic username or Pulso rejects the request.
        tenantId: {{ .Values.pulsoCredentials.tenant | quote }}
        pulso-password: "{{ `{{ .TOKEN | trim }}` }}"
  data:
    - secretKey: TOKEN
      remoteRef:
        key: {{ printf "%s/%s" .Values.pulsoCredentials.token.item .Values.pulsoCredentials.token.field | quote }}
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: {{ printf "%s/%s" .Values.pulsoCredentials.secretKeyBase.item .Values.pulsoCredentials.secretKeyBase.field | quote }}
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: {{ printf "%s/%s" .Values.pulsoCredentials.storage.item .Values.pulsoCredentials.storage.accessKeyField | quote }}
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ printf "%s/%s" .Values.pulsoCredentials.storage.item .Values.pulsoCredentials.storage.secretKeyField | quote }}
{{- end }}
