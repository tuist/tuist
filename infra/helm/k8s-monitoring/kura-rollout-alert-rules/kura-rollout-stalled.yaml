apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: df5dn1g4rckxsf
  labels:
    grafana.app/folder: df5dn1g4rckxsf
  name: kura-rollout-stalled
  namespace: stacks-1028740
spec:
  annotations:
    description: 'The Kura rollout has spent more than 5.5 of the last six hours running and unpaused.
      Every wave has a one-hour deadline that pauses the rollout, so a healthy one finishes or pauses
      long before this; in the 30 days to 2026-09-24 no rollout ran unpaused for more than 1.3 hours in
      any six-hour window. Reaching this means the reconciler is not advancing the rollout: it is not
      ticking, or it is erroring before the deadline check. Check the server logs for Tuist.Kura.Rollouts
      and the rollout page under /ops/kura/rollouts.'
    runbook_url: https://github.com/tuist/tuist/blob/main/infra/helm/k8s-monitoring/alerts.md#kura-rollout-running-without-progress
    summary: Kura rollout of {{ $labels.image_tag }} has been running for {{ $values.A.Value | printf
      "%.1f" }} of the last 6 hours in {{ $labels.env }}
  execErrState: Error
  expressions:
    A:
      datasourceUID: grafanacloud-prom
      model:
        editorMode: code
        expr: sum_over_time((max by (cluster, env, image_tag, mode) (tuist_kura_rollout_active) - max
          by (cluster, env, image_tag, mode) (tuist_kura_rollout_paused))[6h:5m]) * 5 / 60
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 6h5m0s
        to: 0s
    C:
      model:
        conditions:
        - evaluator:
            params:
            - 5.5
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
      queryType: expression
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: Ok
  title: Kura - rollout running without progress
  trigger:
    interval: 5m
