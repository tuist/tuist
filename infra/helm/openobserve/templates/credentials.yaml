{{- $bucket := required "storage.bucket is required" .Values.storage.bucket }}
{{- $endpoint := required "storage.endpoint is required" .Values.storage.endpoint }}
{{- if ne .Values.storage.prefix "openobserve/" }}
{{- fail "storage.prefix must be openobserve/ to isolate this shadow deployment" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.credentials.storeName }}
    kind: ClusterSecretStore
  target:
    name: openobserve-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ZO_S3_ACCESS_KEY: '{{ "{{ .accessKey | trim }}" }}'
        ZO_S3_SECRET_KEY: '{{ "{{ .secretKey | trim }}" }}'
        ZO_S3_BUCKET_NAME: {{ $bucket | quote }}
        ZO_S3_SERVER_URL: {{ $endpoint | quote }}
        ZO_S3_REGION_NAME: {{ .Values.storage.region | quote }}
        ZO_S3_BUCKET_PREFIX: {{ .Values.storage.prefix | quote }}
  data:
    {{- range $key, $ref := omit .Values.credentials "storeName" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $ref | quote }}
    {{- end }}
