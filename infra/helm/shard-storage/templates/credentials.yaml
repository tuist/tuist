{{- if and .Values.enabled .Values.generateCredentials }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Release.Name }}-seed
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Garage keeps the key it first started with, so the Secret is created once
# and never refreshed or owned by this release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Release.Name }}
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        rpc-secret: '{{ `{{ printf "rpc:%s" .password | sha256sum }}` }}'
        access-key-id: '{{ `{{ printf "access-key:%s" .password | sha256sum | trunc 24 | printf "GK%s" }}` }}'
        secret-access-key: '{{ `{{ printf "secret-key:%s" .password | sha256sum }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Release.Name }}-seed
{{- end }}
