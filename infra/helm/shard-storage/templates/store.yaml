{{- if .Values.enabled }}
{{- if ne .Release.Namespace "kura" }}
{{- fail "shard-storage must be installed in kura so capacity admission counts its reservation" }}
{{- end }}
{{- $replicated := eq (int .Values.replicas) 3 }}
{{- if not (or (eq (int .Values.replicas) 1) $replicated) }}
{{- fail "shard-storage supports replicas=1 or replicas=3; two replicas cannot retain write quorum during maintenance" }}
{{- end }}
{{- $existing := lookup "apps/v1" "StatefulSet" .Release.Namespace .Release.Name }}
{{- if and $existing (ne (int $existing.spec.replicas) (int .Values.replicas)) }}
{{- fail "do not change replication factor on an existing store: install a new release with a new storage target ID" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  garage.toml: |
    metadata_dir = "/storage/meta"
    data_dir = "/storage/data"
    db_engine = "sqlite"
    replication_factor = {{ .Values.replicas }}
    {{- if $replicated }}
    consistency_mode = "consistent"
    metadata_fsync = true
    data_fsync = true
    rpc_bind_addr = "[::]:3901"
    bootstrap_peers = {{ .Values.cluster.bootstrapPeers | toJson }}
    {{- else }}
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"
    {{- end }}
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    [admin]
    api_bind_addr = "[::]:3903"
---
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.storeRef | nindent 4 }}
  target:
    name: {{ .Release.Name }}
  data:
    {{- range $key := list "rpc-secret" "access-key-id" "secret-access-key" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "%s/%s" (required "externalSecrets.item is required" $.Values.externalSecrets.item) $key | quote }}
    {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shard-storage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 3900
      targetPort: s3
---
{{- if $replicated }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-peers
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: shard-storage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shard-storage
      app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}{{ if $replicated }}-peers{{ end }}
  replicas: {{ .Values.replicas }}
  {{- if $replicated }}
  # OrderedReady deadlocks before a fresh cluster has a layout and quorum.
  podManagementPolicy: Parallel
  {{- end }}
  # Singleton restarts interrupt transfers; replicated readiness alone does not
  # prove catch-up. Both require operator-controlled maintenance (see README).
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: shard-storage
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shard-storage
        app.kubernetes.io/instance: {{ .Release.Name }}
        tuist.dev/region: {{ .Values.region | quote }}
      annotations:
        checksum/config: {{ printf "%s/%s/%v/%s" .Values.region .Values.bucket .Values.replicas (toJson .Values.cluster.bootstrapPeers) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if $replicated }}
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: shard-storage
                  app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: {{ .Values.image | quote }}
          command: ["/garage"]
          {{- if $replicated }}
          args: ["server"]
          {{- else }}
          args: ["server", "--single-node", "--default-bucket"]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: rpc-secret
            {{- if not $replicated }}
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: access-key-id
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: secret-access-key
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ .Values.bucket | quote }}
            {{- end }}
          ports:
            - name: s3
              containerPort: 3900
            - name: health
              containerPort: 3903
            {{- if $replicated }}
            - name: rpc
              containerPort: 3901
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
              # Scheduler reservation, matched by the local-path XFS quota.
              # No ephemeral-storage limit: kubelet cannot meter a PV with it.
              ephemeral-storage: {{ .Values.storage.size }}
            limits:
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shard-storage
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  {{- if $replicated }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shard-storage
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3901
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  {{- else }}
  egress: []
  {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.runnerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.serverNamespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shard-storage-lifecycle
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3900
    {{- if $replicated }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shard-storage
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3901
    {{- end }}
{{- end }}
