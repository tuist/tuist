{{- define "shard-storage.awsEnv" -}}
- name: AWS_DEFAULT_REGION
  value: garage
- name: AWS_EC2_METADATA_DISABLED
  value: "true"
- name: AWS_REQUEST_CHECKSUM_CALCULATION
  value: WHEN_REQUIRED
- name: AWS_ACCESS_KEY_ID
  valueFrom:
    secretKeyRef:
      name: {{ .Release.Name }}
      key: access-key-id
- name: AWS_SECRET_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Release.Name }}
      key: secret-access-key
{{- end }}
{{- if .Values.enabled }}
{{- $endpoint := printf "http://%s.%s.svc.cluster.local:3900" .Release.Name .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-lifecycle
data:
  lifecycle.json: |
    {"Rules":[{"ID":"shard-retention-backstop","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":{{ .Values.lifecycle.expirationDays }}},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":{{ .Values.lifecycle.abortMultipartDays }}}}]}
  {{- if .Values.archiveBucket }}
  # Archives are the only copy of an archived Orb: nothing expires them.
  archive-lifecycle.json: |
    {"Rules":[{"ID":"abort-incomplete-uploads","Status":"Enabled","Filter":{"Prefix":""},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":{{ .Values.lifecycle.abortMultipartDays }}}}]}
  {{- end }}
---
# Reapplying the policy is idempotent and recovers automatically if the bucket
# was recreated. It is separate from readiness: do not block server releases.
# The same run creates the archive bucket when it is missing, and the Actions
# cache bucket with its quota.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-lifecycle
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shard-storage-lifecycle
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          {{- if .Values.archiveBucket }}
          initContainers:
            - name: archive-bucket
              image: {{ .Values.lifecycle.image | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" ||
                  aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$BUCKET"
              env:
                - name: ENDPOINT
                  value: {{ $endpoint | quote }}
                - name: BUCKET
                  value: {{ .Values.archiveBucket | quote }}
                {{- include "shard-storage.awsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
            - name: archive-policy
              image: {{ .Values.lifecycle.image | quote }}
              args:
                - --endpoint-url
                - {{ $endpoint }}
                - s3api
                - put-bucket-lifecycle-configuration
                - --bucket
                - {{ .Values.archiveBucket | quote }}
                - --lifecycle-configuration
                - file:///policy/archive-lifecycle.json
              env:
                {{- include "shard-storage.awsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: policy
                  mountPath: /policy
                  readOnly: true
          {{- end }}
          containers:
            {{- if .Values.actionsCache.bucket }}
            # Through the admin API: S3 cannot set a quota, and a bucket the S3
            # API creates has only a key-local alias the admin API cannot find.
            - name: actions-cache
              image: {{ .Values.lifecycle.image | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  admin() { curl -sS -H "Authorization: Bearer $GARAGE_ADMIN_TOKEN" -H 'Content-Type: application/json' "$@"; }
                  # Answers 409 once the bucket exists.
                  admin -o /dev/null -X POST "$ADMIN/v2/CreateBucket" -d "{\"globalAlias\":\"$BUCKET\"}"
                  id=$(admin -f "$ADMIN/v2/GetBucketInfo?globalAlias=$BUCKET" | grep -o '"id": *"[0-9a-f]\{64\}"' | head -n 1 | grep -o '[0-9a-f]\{64\}')
                  admin -f -o /dev/null -X POST "$ADMIN/v2/AllowBucketKey" -d "{\"bucketId\":\"$id\",\"accessKeyId\":\"$AWS_ACCESS_KEY_ID\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}"
                  admin -f -o /dev/null -X POST "$ADMIN/v2/UpdateBucket?id=$id" -d "{\"quotas\":{\"maxSize\":$MAX_SIZE,\"maxObjects\":null}}"
                  echo "$BUCKET is capped at $MAX_SIZE bytes"
              env:
                - name: ADMIN
                  value: {{ printf "http://%s.%s.svc.cluster.local:3903" .Release.Name .Release.Namespace | quote }}
                - name: BUCKET
                  value: {{ .Values.actionsCache.bucket | quote }}
                - name: MAX_SIZE
                  value: {{ mul (int64 .Values.actionsCache.maxGB) 1000000000 | quote }}
                - name: GARAGE_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}
                      key: rpc-secret
                {{- include "shard-storage.awsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
            {{- end }}
            - name: policy
              image: {{ .Values.lifecycle.image | quote }}
              args:
                - --endpoint-url
                - {{ $endpoint }}
                - s3api
                - put-bucket-lifecycle-configuration
                - --bucket
                - {{ .Values.bucket | quote }}
                - --lifecycle-configuration
                - file:///policy/lifecycle.json
              env:
                {{- include "shard-storage.awsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: policy
                  mountPath: /policy
                  readOnly: true
          volumes:
            - name: policy
              configMap:
                name: {{ .Release.Name }}-lifecycle
{{- end }}
