# NEW store on the dedicated OVH Gravelines ADVANCE-4 host (RAID10, ~3.4 TiB
# XFS /data), deployed with the server.
replicas: 1
region: ""
nodeSelector:
  node.cluster.x-k8s.io/pool: shard-storage
privateNetwork: pn-2024093
externalSecrets:
  enabled: false
generateCredentials: true
target:
  id: gra-production-v1
  site: gra
  enabled: true
  privateNetworkReady: true
storage:
  size: 3Ti
lifecycle:
  expirationDays: 3
