# Install as a NEW release/target. Does not enable enrollment or deploy itself.
# Supply the environment's externalSecrets.item separately.
replicas: 1
storage:
  # One storage host with enough allocatable disk, e.g. mirrored 3.84 TB NVMe.
  # Do not place this on the existing space-constrained shared cache hosts.
  size: 3Ti
lifecycle:
  expirationDays: 3
