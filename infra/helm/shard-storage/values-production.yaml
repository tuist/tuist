# NEW store on the dedicated OVH Gravelines ADVANCE-4 host (RAID10, ~3.4 TiB
# XFS /data), deployed with the server.
replicas: 1
region: ""
nodeSelector:
  node.cluster.x-k8s.io/pool: shard-storage
privateNetwork: pn-2024093
externalSecrets:
  enabled: false
generateCredentials: true
target:
  id: gra-production-v1
  site: gra
  enabled: true
  # RustFS (infra/helm/shard-storage-rustfs) takes every new placement. The
  # target stays published so existing shards, Actions cache entries and
  # sandbox archives remain readable until they expire or move.
  privateNetworkReady: false
storage:
  # The PVC (and the XFS quota the provisioner set from it) was created at
  # 3Ti and cannot be resized. The host quota is lowered by hand to hand space
  # to RustFS, which replaces this store; reservation follows that quota.
  # 1200Gi keeps room above Garage's ~734 GiB while it drains.
  size: 3Ti
  reservation: 1200Gi
lifecycle:
  expirationDays: 3
archiveBucket: sandbox-archives
archiveBudgetGiB: 500
sandboxNamespace: tuist-sandboxes
actionsCache:
  bucket: actions-cache
  maxGB: 500
