{{- if .Values.installCRDs -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflarewafcustomrules.cloudflare.tuist.dev
spec:
  group: cloudflare.tuist.dev
  scope: Cluster
  names:
    plural: cloudflarewafcustomrules
    singular: cloudflarewafcustomrule
    kind: CloudflareWAFCustomRule
    shortNames: [cfwaf]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Zone, type: string, jsonPath: .spec.zoneId}
        - {name: Action, type: string, jsonPath: .spec.action}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [zoneId, description, expression, action]
              properties:
                zoneId: {type: string}
                description: {type: string}
                expression: {type: string}
                enabled: {type: boolean, default: true}
                action:
                  type: string
                  enum: [block, managed_challenge, js_challenge, challenge, log, skip, allow]
            status:
              type: object
              properties:
                ref: {type: string}
                ruleId: {type: string}
                rulesetId: {type: string}
                observedGeneration: {type: integer, format: int64}
                message: {type: string}
                lastReconciledAt: {type: string, format: date-time}
{{- end -}}
