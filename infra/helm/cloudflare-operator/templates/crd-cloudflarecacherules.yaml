{{- if .Values.installCRDs -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflarecacherules.cloudflare.tuist.dev
spec:
  group: cloudflare.tuist.dev
  scope: Cluster
  names:
    plural: cloudflarecacherules
    singular: cloudflarecacherule
    kind: CloudflareCacheRule
    shortNames: [cfcr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Zone, type: string, jsonPath: .spec.zoneId}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [zoneId, description, expression, cacheSettings]
              properties:
                zoneId: {type: string}
                description: {type: string}
                expression: {type: string}
                enabled: {type: boolean, default: true}
                cacheSettings:
                  type: object
                  properties:
                    cache: {type: boolean}
                    edgeTTL:
                      type: object
                      required: [mode]
                      properties:
                        mode:
                          type: string
                          enum: [respect_origin, override_origin, bypass_by_default]
                        default: {type: integer}
                    browserTTL:
                      type: object
                      required: [mode]
                      properties:
                        mode:
                          type: string
                          enum: [respect_origin, override_origin, bypass, bypass_by_default]
                        default: {type: integer}
                    respectStrongEtags: {type: boolean}
                    cacheDeceptionArmor: {type: boolean}
                    originErrorPagePassthru: {type: boolean}
                    additionalCacheablePorts:
                      type: array
                      items: {type: integer}
            status:
              type: object
              properties:
                ref: {type: string}
                ruleId: {type: string}
                rulesetId: {type: string}
                observedGeneration: {type: integer, format: int64}
                message: {type: string}
                lastReconciledAt: {type: string, format: date-time}
{{- end -}}
