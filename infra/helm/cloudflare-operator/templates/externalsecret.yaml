{{- if .Values.externalSecret.enabled -}}
# The mgmt cluster's onepassword ClusterSecretStore uses the
# onepasswordSDK provider, which encodes the item + field inside the
# `key` (op://<vault>/<item>/<field> — the store prepends the vault),
# so every other ExternalSecret in this repo writes it as
# `key: "<item>/<field>"` with no `property:`. Matching that shape
# here avoids a silent no-sync followed by a stuck ContainerCreating
# pod. Also on v1 (v1beta1 was dropped from the platform's
# external-secrets version).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-operator-token
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: cloudflare-operator-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "{{ .Values.externalSecret.itemTitle }}/token"
{{- end }}
