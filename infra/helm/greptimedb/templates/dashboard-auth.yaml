{{- if .Values.dashboard.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: greptimedb-dashboard-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: greptimedb-dashboard-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        passwd: |
          dashboard:ro={{ "{{ .token | trim }}" }}
          tuist:wo={{ "{{ .token | trim }}" }}
        # Collectors write as the write-only identity above. This Secret
        # outlives the old pulse release, whose Secret they used before.
        ingest-username: tuist
        ingest-password: '{{ "{{ .token | trim }}" }}'
  data:
    - secretKey: token
      remoteRef:
        key: PULSE_TOKEN/password
{{- end }}
