{{- if .Values.dashboard.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: greptimedb-dashboard-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: greptimedb-dashboard-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        passwd: |
          dashboard:ro={{ "{{ .token | trim }}" }}
          tuist:wo={{ "{{ .token | trim }}" }}
  data:
    - secretKey: token
      remoteRef:
        key: PULSE_TOKEN/password
{{- end }}
