{{- include "greptimedb.validate" . }}
{{- if eq .Values.topology "cluster" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: greptimedb-metasrv-config
data:
  config.toml: |
    {{- include "greptimedb.metasrvConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: greptimedb-datanode-config
data:
  config.toml: |
    {{- include "greptimedb.datanodeConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: greptimedb-frontend-config
data:
  config.toml: |
    {{- include "greptimedb.frontendConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: greptimedb-kafka-config
data:
  # Per-broker node.id and advertised.listeners are appended at start.
  server.properties: |
    {{- include "greptimedb.kafkaServerProperties" . | nindent 4 }}
  log4j2.yaml: |
    {{- include "greptimedb.kafkaLog4j" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: greptimedb-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: greptimedb-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GREPTIMEDB_DATANODE__STORAGE__ACCESS_KEY_ID: '{{ "{{ .accessKey | trim }}" }}'
        GREPTIMEDB_DATANODE__STORAGE__SECRET_ACCESS_KEY: '{{ "{{ .secretKey | trim }}" }}'
  data:
    - secretKey: accessKey
      remoteRef:
        key: PULSE_S3_CREDENTIALS/access_key_id
    - secretKey: secretKey
      remoteRef:
        key: PULSE_S3_CREDENTIALS/secret_access_key
---
# Readers keep http://greptimedb.observability.svc.cluster.local:4000.
apiVersion: v1
kind: Service
metadata:
  name: greptimedb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: greptimedb
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: greptimedb-metasrv
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: greptimedb
    app.kubernetes.io/component: metasrv
  ports:
    - {name: grpc, port: 3002, targetPort: grpc}
{{- range $component := list "etcd" "kafka" "datanode" }}
---
# Peers must resolve each other before they are Ready to form a quorum.
apiVersion: v1
kind: Service
metadata:
  name: greptimedb-{{ $component }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: greptimedb
    app.kubernetes.io/component: {{ $component }}
  ports:
    {{- if eq $component "etcd" }}
    - {name: client, port: 2379}
    - {name: peer, port: 2380}
    {{- else if eq $component "kafka" }}
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
    {{- else }}
    - {name: grpc, port: 3001}
    {{- end }}
{{- end }}
{{- range $component := list "etcd" "kafka" "metasrv" "datanode" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: greptimedb-{{ $component }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: {{ $component }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: greptimedb-etcd
spec:
  serviceName: greptimedb-etcd
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: greptimedb
        app.kubernetes.io/component: etcd
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- include "greptimedb.placement" "etcd" | nindent 6 }}
      securityContext:
        {{- include "greptimedb.podSecurityContext" . | nindent 8 }}
      containers:
        - name: etcd
          image: {{ .Values.cluster.etcd.image | quote }}
          command: [/usr/local/bin/etcd]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).greptimedb-etcd.observability.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).greptimedb-etcd.observability.svc.cluster.local:2380
            - --initial-cluster=greptimedb-etcd-0=http://greptimedb-etcd-0.greptimedb-etcd.observability.svc.cluster.local:2380,greptimedb-etcd-1=http://greptimedb-etcd-1.greptimedb-etcd.observability.svc.cluster.local:2380,greptimedb-etcd-2=http://greptimedb-etcd-2.greptimedb-etcd.observability.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=greptimedb-etcd-{{ .Values.environment }}
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
            - --quota-backend-bytes=4294967296
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: client, containerPort: 2379}
            - {name: peer, containerPort: 2380}
          securityContext:
            {{- include "greptimedb.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.etcd.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: client}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cluster.etcd.storageSize | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: greptimedb-kafka
spec:
  serviceName: greptimedb-kafka
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: greptimedb
        app.kubernetes.io/component: kafka
      annotations:
        checksum/config: {{ printf "%s\n%s" (include "greptimedb.kafkaServerProperties" .) (include "greptimedb.kafkaLog4j" .) | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      {{- include "greptimedb.placement" "kafka" | nindent 6 }}
      securityContext:
        {{- include "greptimedb.podSecurityContext" . | nindent 8 }}
      containers:
        - name: kafka
          image: {{ .Values.cluster.kafka.image | quote }}
          command: [sh, -ec]
          args:
            - |
              config=/tmp/server.properties
              cp /etc/kafka-config/server.properties "$config"
              printf 'node.id=%s\nadvertised.listeners=PLAINTEXT://%s.greptimedb-kafka.observability.svc.cluster.local:9092\n' \
                "$POD_INDEX" "$POD_NAME" >> "$config"
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id "$CLUSTER_ID" --config "$config"
              exec /opt/kafka/bin/kafka-server-start.sh "$config"
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"}}
            - {name: CLUSTER_ID, value: {{ .Values.cluster.kafka.clusterId | quote }}}
            - {name: KAFKA_HEAP_OPTS, value: {{ printf "-Xms%s -Xmx%s" .Values.cluster.kafka.heap .Values.cluster.kafka.heap | quote }}}
            - {name: KAFKA_LOG4J_OPTS, value: -Dlog4j2.configurationFile=/etc/kafka-config/log4j2.yaml}
            # Omit -loggc so the JVM writes no rotating GC files to scratch.
            - {name: EXTRA_ARGS, value: -name kafkaServer}
            - {name: LOG_DIR, value: /tmp/logs}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          securityContext:
            {{- include "greptimedb.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.kafka.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: broker}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: config, mountPath: /etc/kafka-config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: greptimedb-kafka-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cluster.kafka.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greptimedb-metasrv
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: metasrv
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: greptimedb
        app.kubernetes.io/component: metasrv
      annotations:
        checksum/config: {{ include "greptimedb.metasrvConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- include "greptimedb.placement" "metasrv" | nindent 6 }}
      securityContext:
        {{- include "greptimedb.podSecurityContext" . | nindent 8 }}
      containers:
        - name: metasrv
          image: {{ .Values.image | quote }}
          args: [metasrv, start, --config-file, /etc/greptimedb/config/config.toml, --grpc-server-addr, "$(POD_IP):3002"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: grpc, containerPort: 3002}
            - {name: http, containerPort: 4000}
          securityContext:
            {{- include "greptimedb.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.metasrv.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/greptimedb/config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: greptimedb-metasrv-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: greptimedb-datanode
spec:
  serviceName: greptimedb-datanode
  replicas: {{ .Values.cluster.datanode.replicas }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: datanode
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: greptimedb
        app.kubernetes.io/component: datanode
      annotations:
        checksum/config: {{ include "greptimedb.datanodeConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      {{- include "greptimedb.placement" "datanode" | nindent 6 }}
      securityContext:
        {{- include "greptimedb.podSecurityContext" . | nindent 8 }}
      containers:
        - name: datanode
          image: {{ .Values.image | quote }}
          args:
            - datanode
            - start
            - --config-file
            - /etc/greptimedb/config/config.toml
            - --node-id
            - $(POD_INDEX)
            - --grpc-server-addr
            - $(POD_NAME).greptimedb-datanode.observability.svc.cluster.local:3001
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"}}
          envFrom:
            - secretRef:
                name: greptimedb-credentials
          ports:
            - {name: grpc, containerPort: 3001}
            - {name: http, containerPort: 4000}
          securityContext:
            {{- include "greptimedb.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.datanode.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data/greptimedb}
            - {name: config, mountPath: /etc/greptimedb/config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: greptimedb-datanode-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cluster.datanode.cacheSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greptimedb-frontend
spec:
  replicas: {{ .Values.cluster.frontend.replicas }}
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: greptimedb
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include "greptimedb.frontendConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- include "greptimedb.placement" "frontend" | nindent 6 }}
      securityContext:
        {{- include "greptimedb.podSecurityContext" . | nindent 8 }}
      {{- include "greptimedb.authInit" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ .Values.image | quote }}
          args: [frontend, start, --config-file, /etc/greptimedb/config/config.toml, --grpc-server-addr, "$(POD_IP):4001"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: http, containerPort: 4000}
            - {name: grpc, containerPort: 4001}
          securityContext:
            {{- include "greptimedb.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/greptimedb/config, readOnly: true}
            - {name: auth, mountPath: /etc/greptimedb/auth, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: greptimedb-frontend-config}
        {{- include "greptimedb.authVolumes" . | nindent 8 }}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
---
# Components talk only to each other; clients reach the frontends' HTTP API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greptimedb-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: greptimedb
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: greptimedb-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: greptimedb
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    {{- include "greptimedb.apiIngress" . | nindent 4 }}
{{- end }}
