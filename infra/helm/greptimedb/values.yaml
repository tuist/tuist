# Explicit managed environment.
environment: staging
# cluster: frontends, metasrv on etcd, datanodes on a replicated Kafka WAL. Every
# workload cluster (staging, canary, production) runs it.
# standalone: one StatefulSet with a local raft-engine WAL. Only management,
# which has no volume provisioner, runs it.
topology: cluster
# Staging/canary only: moves an installed standalone backend to the cluster
# topology without dropping reads or writes. greptimedb-deployment.yml sets it.
#   serving: the cluster runs beside the standalone pod, which still backs
#     Service `pulse`; Service `pulse-frontend` reaches the cluster for checks.
#   draining: Service `pulse` selects the frontends; standalone stays for rollback.
#   "": standalone is removed; its volume claim is retained.
migration:
  standalone: ""
dashboard:
  enabled: false
# Pulse, Tuist's GreptimeDB fork, built from pulse/ by pulse-release.yml.
image: ghcr.io/tuist/pulse:1.44.0-canary.1
storage:
  bucket: tuist-pulso-staging
  endpoint: https://t3.storage.dev
  region: auto
  prefix: pulse/
persistence:
  storageClass: hcloud-volumes
  size: 10Gi
# Standalone pod.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi
# Distributed topology. Quorum members (etcd, Kafka, metasrv) are fixed at three
# and every component is spread one replica per node. The cluster writes under
# <storage.prefix>distributed/, so it never shares objects with a standalone
# backend that used the same bucket. These requests size staging and canary,
# whose whole standalone backend used about 600 MiB and 0.05 CPU;
# values-production.yaml sizes production.
cluster:
  frontend:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  metasrv:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  datanode:
    replicas: 3
    # Local data is a rebuildable cache: acknowledged writes live in the Kafka
    # WAL until flushed to object storage, so a datanode may start empty.
    cacheSize: 10Gi
    writeCacheSize: 1GB
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
  etcd:
    image: quay.io/coreos/etcd:v3.6.16@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965
    storageSize: 10Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  kafka:
    image: docker.io/apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    # KRaft cluster ID, fixed at first format. Never change it on a live cluster.
    clusterId: BU3lmXwlRG6RgWY0S-ihGg
    heap: 512m
    # Hetzner's smallest volume.
    storageSize: 10Gi
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 1536Mi}
