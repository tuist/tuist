{{- include "pulse.validate" . }}
{{- if not .Values.existingSecret }}
{{- $secretKeyBase := .Values.secretKeyBase }}
{{- if not $secretKeyBase }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pulse.fullname" .) }}
{{- if and $existing $existing.data (index $existing.data "SECRET_KEY_BASE") }}
{{- $secretKeyBase = index $existing.data "SECRET_KEY_BASE" | b64dec }}
{{- else }}
{{- $secretKeyBase = randAlphaNum 64 }}
{{- end }}
{{- end }}
{{- $cookie := "" }}
{{- if .Values.clustering.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pulse.fullname" .) }}
{{- if and $existing $existing.data (index $existing.data "RELEASE_COOKIE") }}
{{- $cookie = index $existing.data "RELEASE_COOKIE" | b64dec }}
{{- else }}
{{- $cookie = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.fullname" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY_BASE: {{ $secretKeyBase | b64enc | quote }}
  PULSE_TENANT_TOKENS: {{ .Values.tenantTokens | toJson | b64enc | quote }}
  PULSE_ADMIN_TOKENS: {{ .Values.admin.tokenHashes | toJson | b64enc | quote }}
  PULSE_S3_ACCESS_KEY_ID: {{ .Values.storage.accessKeyId | b64enc | quote }}
  PULSE_S3_SECRET_ACCESS_KEY: {{ .Values.storage.secretAccessKey | b64enc | quote }}
  {{- if $cookie }}
  RELEASE_COOKIE: {{ $cookie | b64enc | quote }}
  {{- end }}
{{- end }}
