{{- if .Values.dashboard.enabled }}
{{- $sentryWriter := has .Values.environment .Values.sentryWriter.environments }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-dashboard-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pulse-dashboard-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        passwd: |
          dashboard:ro={{ "{{ .token | trim }}" }}
          tuist:wo={{ "{{ .token | trim }}" }}
          {{- if $sentryWriter }}
          sentry:wo={{ "{{ .sentryWriter | trim }}" }}
          {{- end }}
        # Collectors write as the write-only identity above. This Secret
        # outlives the old pulse release, whose Secret they used before.
        ingest-username: tuist
        ingest-password: '{{ "{{ .token | trim }}" }}'
  data:
    - secretKey: token
      remoteRef:
        key: PULSE_TOKEN/password
    {{- if $sentryWriter }}
    # Sentry producers' write-only identity (the tuist chart's sentryPulse),
    # with its own password so their DSNs never carry the dashboard's token.
    - secretKey: sentryWriter
      remoteRef:
        key: PULSE_SENTRY_WRITER/password
    {{- end }}
{{- end }}
