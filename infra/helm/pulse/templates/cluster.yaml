{{- include "pulse.validate" . }}
{{- if eq .Values.topology "cluster" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-metasrv-config
data:
  config.toml: |
    {{- include "pulse.metasrvConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-datanode-config
data:
  config.toml: |
    {{- include "pulse.datanodeConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-frontend-config
data:
  config.toml: |
    {{- include "pulse.frontendConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-flownode-config
data:
  config.toml: |
    {{- include "pulse.flownodeConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-kafka-config
data:
  # Per-broker node.id and advertised.listeners are appended at start.
  server.properties: |
    {{- include "pulse.kafkaServerProperties" . | nindent 4 }}
  log4j2.yaml: |
    {{- include "pulse.kafkaLog4j" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pulse-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PULSE_DATANODE__STORAGE__ACCESS_KEY_ID: '{{ "{{ .accessKey | trim }}" }}'
        PULSE_DATANODE__STORAGE__SECRET_ACCESS_KEY: '{{ "{{ .secretKey | trim }}" }}'
        {{- if .Values.migration.standalone }}
        PULSE_STANDALONE__STORAGE__ACCESS_KEY_ID: '{{ "{{ .accessKey | trim }}" }}'
        PULSE_STANDALONE__STORAGE__SECRET_ACCESS_KEY: '{{ "{{ .secretKey | trim }}" }}'
        {{- end }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: PULSE_S3_CREDENTIALS/access_key_id
    - secretKey: secretKey
      remoteRef:
        key: PULSE_S3_CREDENTIALS/secret_access_key
---
# Readers keep http://pulse.observability.svc.cluster.local:4000.
apiVersion: v1
kind: Service
metadata:
  name: pulse
spec:
  type: ClusterIP
  selector:
    {{- if eq .Values.migration.standalone "serving" }}
    {{- include "pulse.standaloneSelector" . | nindent 4 }}
    {{- else }}
    app.kubernetes.io/instance: pulse
    app.kubernetes.io/component: frontend
    {{- end }}
  ports:
    - name: http
      port: 4000
      targetPort: http
    {{- if include "pulse.postgres" . }}
    - name: postgres
      port: 4003
      targetPort: postgres
    {{- end }}
{{- if .Values.migration.standalone }}
---
# Qualifies the frontends before Service `pulse` moves to them.
apiVersion: v1
kind: Service
metadata:
  name: pulse-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: pulse
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 4000
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-metasrv
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: pulse
    app.kubernetes.io/component: metasrv
  ports:
    - {name: grpc, port: 3002, targetPort: grpc}
{{- range $component := list "etcd" "kafka" "datanode" }}
---
# Peers must resolve each other before they are Ready to form a quorum.
apiVersion: v1
kind: Service
metadata:
  name: pulse-{{ $component }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: pulse
    app.kubernetes.io/component: {{ $component }}
  ports:
    {{- if eq $component "etcd" }}
    - {name: client, port: 2379}
    - {name: peer, port: 2380}
    {{- else if eq $component "kafka" }}
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
    {{- else }}
    - {name: grpc, port: 3001}
    {{- end }}
{{- end }}
{{- range $component := list "etcd" "kafka" "metasrv" "datanode" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulse-{{ $component }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: {{ $component }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulse-etcd
spec:
  serviceName: pulse-etcd
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pulse
        app.kubernetes.io/component: etcd
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- include "pulse.placement" "etcd" | nindent 6 }}
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
      containers:
        - name: etcd
          image: {{ .Values.cluster.etcd.image | quote }}
          command: [/usr/local/bin/etcd]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).pulse-etcd.observability.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).pulse-etcd.observability.svc.cluster.local:2380
            - --initial-cluster=pulse-etcd-0=http://pulse-etcd-0.pulse-etcd.observability.svc.cluster.local:2380,pulse-etcd-1=http://pulse-etcd-1.pulse-etcd.observability.svc.cluster.local:2380,pulse-etcd-2=http://pulse-etcd-2.pulse-etcd.observability.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=pulse-etcd-{{ .Values.environment }}
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
            - --quota-backend-bytes=4294967296
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: client, containerPort: 2379}
            - {name: peer, containerPort: 2380}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.etcd.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: client}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cluster.etcd.storageSize | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulse-kafka
spec:
  serviceName: pulse-kafka
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pulse
        app.kubernetes.io/component: kafka
      annotations:
        checksum/config: {{ printf "%s\n%s" (include "pulse.kafkaServerProperties" .) (include "pulse.kafkaLog4j" .) | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      {{- include "pulse.placement" "kafka" | nindent 6 }}
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
      containers:
        - name: kafka
          image: {{ .Values.cluster.kafka.image | quote }}
          command: [sh, -ec]
          args:
            - |
              config=/tmp/server.properties
              cp /etc/kafka-config/server.properties "$config"
              printf 'node.id=%s\nadvertised.listeners=PLAINTEXT://%s.pulse-kafka.observability.svc.cluster.local:9092\n' \
                "$POD_INDEX" "$POD_NAME" >> "$config"
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id "$CLUSTER_ID" --config "$config"
              exec /opt/kafka/bin/kafka-server-start.sh "$config"
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"}}
            - {name: CLUSTER_ID, value: {{ .Values.cluster.kafka.clusterId | quote }}}
            - {name: KAFKA_HEAP_OPTS, value: {{ printf "-Xms%s -Xmx%s" .Values.cluster.kafka.heap .Values.cluster.kafka.heap | quote }}}
            - {name: KAFKA_LOG4J_OPTS, value: -Dlog4j2.configurationFile=/etc/kafka-config/log4j2.yaml}
            # Omit -loggc so the JVM writes no rotating GC files to scratch.
            - {name: EXTRA_ARGS, value: -name kafkaServer}
            - {name: LOG_DIR, value: /tmp/logs}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.kafka.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: broker}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: config, mountPath: /etc/kafka-config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: pulse-kafka-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cluster.kafka.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-metasrv
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: metasrv
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pulse
        app.kubernetes.io/component: metasrv
      annotations:
        checksum/config: {{ include "pulse.metasrvConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- include "pulse.placement" "metasrv" | nindent 6 }}
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
      initContainers:
        # The metasrv leader creates the WAL topics once, when it starts
        # leading, and does not retry. On a fresh install that can run before
        # all three brokers register, which fails replication factor 3 and
        # leaves every region creation failing. Once the topics exist, a
        # degraded Kafka no longer holds metasrv back.
        - name: wait-for-wal
          image: {{ .Values.cluster.kafka.image | quote }}
          command: [sh, -ec]
          args:
            - |
              servers={{ include "pulse.peers" (list "pulse-kafka" 9092) | replace "\"" "" | trimPrefix "[" | trimSuffix "]" | replace ", " "," }}
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$servers" --list 2>/dev/null | grep -q '^{{ include "pulse.walTopicPrefix" . }}_' ||
                [ "$(/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$servers" 2>/dev/null | grep -c ' (id: ')" -ge 3 ]; do
                echo 'Waiting for the WAL topics or all three Kafka brokers'
                sleep 5
              done
          env:
            - {name: KAFKA_HEAP_OPTS, value: -Xmx128m}
            - {name: LOG_DIR, value: /tmp/logs}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: scratch, mountPath: /tmp}
      containers:
        - name: metasrv
          image: {{ .Values.image | quote }}
          args: [metasrv, start, --config-file, /etc/pulse/config/config.toml, --grpc-server-addr, "$(POD_IP):3002"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: grpc, containerPort: 3002}
            - {name: http, containerPort: 4000}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.metasrv.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/pulse/config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: pulse-metasrv-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulse-datanode
spec:
  serviceName: pulse-datanode
  replicas: {{ .Values.cluster.datanode.replicas }}
  podManagementPolicy: Parallel
  {{- if has .Values.environment .Values.cluster.datanode.drainedRolloutEnvironments }}
  # Held: template changes restart no datanode until
  # .github/scripts/pulse-datanode-rollout.sh moves each one's regions away
  # and lowers the partition to it. Not OnDelete, which never advances
  # status.currentRevision and so would fail pulse-readiness.sh.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: {{ .Values.cluster.datanode.replicas }}
  {{- end }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: datanode
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pulse
        app.kubernetes.io/component: datanode
      annotations:
        checksum/config: {{ include "pulse.datanodeConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      {{- include "pulse.placement" "datanode" | nindent 6 }}
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
      containers:
        - name: datanode
          image: {{ .Values.image | quote }}
          args:
            - datanode
            - start
            - --config-file
            - /etc/pulse/config/config.toml
            - --node-id
            - $(POD_INDEX)
            - --grpc-server-addr
            - $(POD_NAME).pulse-datanode.observability.svc.cluster.local:3001
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"}}
          envFrom:
            - secretRef:
                name: pulse-credentials
          ports:
            - {name: grpc, containerPort: 3001}
            - {name: http, containerPort: 4000}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.datanode.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data/pulse}
            - {name: config, mountPath: /etc/pulse/config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: pulse-datanode-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cluster.datanode.cacheSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-frontend
spec:
  replicas: {{ if .Values.cluster.frontend.stopped }}0{{ else }}{{ .Values.cluster.frontend.replicas }}{{ end }}
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pulse
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include "pulse.frontendConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- include "pulse.placement" "frontend" | nindent 6 }}
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
      {{- if .Values.dashboard.enabled }}
      initContainers:
      {{- include "pulse.authInit" . | nindent 6 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ .Values.image | quote }}
          args: [frontend, start, --config-file, /etc/pulse/config/config.toml, --grpc-server-addr, "$(POD_IP):4001",
            --internal-grpc-server-addr, "$(POD_IP):4010"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: http, containerPort: 4000}
            - {name: grpc, containerPort: 4001}
            - {name: internal-grpc, containerPort: 4010}
            {{- if include "pulse.postgres" . }}
            - {name: postgres, containerPort: 4003}
            {{- end }}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.frontend.resources | nindent 12 }}
          # Keep serving until Service `pulse` drops this endpoint; without it a
          # rollout refuses the requests routed here before the removal lands.
          lifecycle:
            preStop:
              sleep: {seconds: 10}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/pulse/config, readOnly: true}
            - {name: auth, mountPath: /etc/pulse/auth, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: pulse-frontend-config}
        {{- include "pulse.authVolumes" . | nindent 8 }}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
---
# Runs flows: error-issues.sql's `error_issues` keeps `error_issue_hours`
# current. Writes and reads never depend on it, so it has no disruption
# budget and pulse-readiness.sh does not gate collectors on it. Recreate keeps
# its fixed node ID on one pod at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-flownode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: flownode
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pulse
        app.kubernetes.io/component: flownode
      annotations:
        checksum/config: {{ include "pulse.flownodeConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- include "pulse.placement" "flownode" | nindent 6 }}
      securityContext:
        {{- include "pulse.podSecurityContext" . | nindent 8 }}
      containers:
        - name: flownode
          image: {{ .Values.image | quote }}
          args: [flownode, start, --config-file, /etc/pulse/config/config.toml, --grpc-server-addr, "$(POD_IP):3004"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: grpc, containerPort: 3004}
            - {name: http, containerPort: 4000}
          securityContext:
            {{- include "pulse.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cluster.flownode.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/pulse/config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: pulse-flownode-config}
        - name: scratch
          emptyDir: {sizeLimit: 64Mi}
{{- if .Values.migration.standalone }}
---
# Keeps the standalone pod's readers while it runs beside the cluster. Helm
# applies policies in template order: this one exists before pulse-internal
# selects that pod and pulse-private narrows to the frontends.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-standalone
spec:
  podSelector:
    {{- include "pulse.standalonePolicySelector" . | nindent 4 }}
  policyTypes: [Ingress]
  ingress:
    {{- include "pulse.apiIngress" . | nindent 4 }}
{{- end }}
---
# Components talk only to each other; clients reach the frontends' HTTP API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: pulse
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: pulse
---
# k8s-monitoring's metrics collector scrapes the datanodes' /metrics for
# their scan memory and flush health (infra/helm/k8s-monitoring/values.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-datanode-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: datanode
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - {port: 4000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: pulse
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    {{- include "pulse.apiIngress" . | nindent 4 }}
{{- end }}
