{{- if .Values.externalSecrets.enabled }}
{{- $name := required "existingSecret is required when externalSecrets.enabled is true" .Values.existingSecret }}
{{- $items := required "externalSecrets.items is required when externalSecrets.enabled is true" .Values.externalSecrets.items }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $key, $_ := $items }}
        {{ $key }}: {{ printf "{{ index . %q | trim }}" $key | quote }}
        {{- end }}
  data:
    {{- range $key, $remoteRef := $items }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remoteRef | quote }}
    {{- end }}
{{- end }}
