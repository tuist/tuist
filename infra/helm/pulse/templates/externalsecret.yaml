{{- if .Values.externalSecrets.enabled }}
{{- $name := required "existingSecret is required when externalSecrets.enabled is true" .Values.existingSecret }}
{{- $items := required "externalSecrets.items is required when externalSecrets.enabled is true" .Values.externalSecrets.items }}
{{- $data := dict }}
{{- range $key, $_ := $items }}
{{- $_ := set $data $key (printf "{{ index . %q | trim }}" $key) }}
{{- end }}
{{- range $key, $value := .Values.externalSecrets.template }}
{{- $_ := set $data $key $value }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- toYaml $data | nindent 8 }}
  data:
    {{- range $key, $remoteRef := $items }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remoteRef | quote }}
    {{- end }}
{{- end }}
