# Independent management-cluster backend, never a monitoring subchart or a
# dependency on production. Bootstrap the private tuist-pulse-management bucket
# and the three PULSE_* items in tuist-k8s-mgmt before enabling collectors.
# Keep the Flux HelmRelease's inline values in sync: the pinned OCI chart does
# not contain this new overlay, and OCI valuesFiles cannot read the git source.
fullnameOverride: pulse
replicaCount: 1
existingSecret: pulse-credentials
externalSecrets:
  enabled: true
  storeRef:
    name: onepassword
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE: PULSE_SECRET_KEY_BASE/password
    PULSE_TENANT_TOKENS: PULSE_TOKEN/password
    PULSE_S3_ACCESS_KEY_ID: PULSE_S3_CREDENTIALS/access_key_id
    PULSE_S3_SECRET_ACCESS_KEY: PULSE_S3_CREDENTIALS/secret_access_key
  template:
    PULSE_TENANT_TOKENS: '{"tuist":"sha256${{ .PULSE_TENANT_TOKENS | trim | sha256sum }}"}'
    pulse-username: tuist
    pulse-password: '{{ .PULSE_TENANT_TOKENS | trim }}'
    tenantId: tuist
storage:
  bucket: tuist-pulse-management
  region: auto
  endpoint: https://t3.storage.dev
service:
  type: ClusterIP
ingress:
  enabled: false
serviceMonitor:
  enabled: false
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: /metrics
# Management runs on Talos control-plane nodes, not workload general pools.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
autoscaling:
  enabled: false
pools:
  enabled: false
clustering:
  enabled: false
strategy:
  type: Recreate
  rollingUpdate: null
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1536Mi
metricsCompaction:
  enabled: true
  finalize: true
logCompaction:
  enabled: false
traceCompaction:
  enabled: false
ingestBatching:
  flushIntervalMs: 2000
  maxConcurrentRequests: 32
retention:
  mode: observe
