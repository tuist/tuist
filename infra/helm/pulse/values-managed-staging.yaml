# Managed Pulse instance, deployed independently of the monitoring collectors.
# Preserve the existing bucket and credential values during the rename.
fullnameOverride: pulse
replicaCount: 1
nodeSelector:
  node.cluster.x-k8s.io/pool: general
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: /metrics
image:
  repository: ghcr.io/tuist/pulse
  # The deployment selects the same immutable version as the published chart.
  tag: ""
existingSecret: pulse-credentials
externalSecrets:
  enabled: true
  storeRef:
    name: onepassword
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE: PULSE_SECRET_KEY_BASE/password
    PULSE_TENANT_TOKENS: PULSE_TOKEN/password
    PULSE_S3_ACCESS_KEY_ID: PULSE_S3_CREDENTIALS/access_key_id
    PULSE_S3_SECRET_ACCESS_KEY: PULSE_S3_CREDENTIALS/secret_access_key
  template:
    PULSE_TENANT_TOKENS: '{"tuist":"sha256${{ .PULSE_TENANT_TOKENS | trim | sha256sum }}"}'
    pulse-username: tuist
    pulse-password: '{{ .PULSE_TENANT_TOKENS | trim }}'
    tenantId: tuist
storage:
  bucket: tuist-pulso-staging
  region: auto
  endpoint: https://t3.storage.dev
# Ingestion stays private; only the authenticated MCP endpoint is public.
service:
  type: ClusterIP
# Atlas (atlas-production cluster) queries this Pulse over MCP only; see the
# path allowlist in values.yaml. Each environment has its own token audience,
# so a token sent to one Pulse is never accepted by another.
ingress:
  enabled: true
  className: nginx
  host: pulse-staging.tuist.dev
  paths:
    - path: /mcp
      pathType: Exact
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  tls:
    - secretName: pulse-tls
      hosts: [pulse-staging.tuist.dev]
serviceMonitor:
  enabled: false
autoscaling:
  enabled: false
pools:
  enabled: false
clustering:
  enabled: false
# One combined pod, without old/new maintenance fleets overlapping on upgrades.
strategy:
  type: Recreate
  rollingUpdate: null
# Small ingest; keep room on the cpx32 workers for server rollouts.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1536Mi
metricsCompaction:
  enabled: true
logCompaction:
  enabled: true
traceCompaction:
  enabled: true
# Each ingest request waits ~0.5 s on its Tigris write, so concurrency caps
# throughput (32 slots ≈ 50 req/s against ~6 req/s steady). Staging ran at
# ~390Mi with 16 slots saturated, so 32 fits in 1.5Gi, plus Pulse's default
# 64 MiB of pending bytes. Each signal gets its own reserve of slots (default
# an eighth), so a remote-write replay can't starve logs or traces. 1.22.0
# pipelines flushes, so a 20 ms coalescing window keeps latency low.
ingestBatching:
  flushIntervalMs: 20
  maxConcurrentRequests: 32
# Expiry stays non-destructive until an operator approves a retention policy.
retention:
  mode: observe
# Same Atlas cluster key as production (TUIST_ATLAS_TOKEN_JWKS in the tuist
# chart); rotate all copies together. Read-only: no ingest.
workloadIdentity:
  trust:
    - name: atlas-production
      issuer: https://kubernetes.default.svc.cluster.local
      audiences: [pulse-staging.tuist.dev]
      max_token_ttl_seconds: 3600
      keys:
        type: inline
        jwks: '{"keys":[{"use":"sig","kty":"RSA","kid":"RlVpaMmFrqqIHY46_HT42inm4mfvqBKfwLVJiPCcl7g","alg":"RS256","n":"urnlzTgGSYHPHyc-sjXI7lzdx3ChfMpqUMpwuj1vgBMywpvdjFEKZ-5xWBBfS_GIna4q--YBau4zo21xFw0Jd-Ye8l4daXozFTwB1oOv-xOoIL7YITR8dtXsXzqeGIKx1rt90jE2vgvYQDBnkIf9ohgDIApbLICYGSAko5MfdypYhiO52KOxum8nB5dwIaKhr2-DiLQtFQbl__c6Uk2dFpW0_5u4d-uO6yspp5iVo54sc7XIlFNxPBlx2uVQZe8tvTH9Ipc_sovDjMfoKH7g0fG14q6xQU5CkQD1pNS__6J3xFvFYQEp3wXu4i_Rin65EI9GvNKtbZkH-sQ5e8jzLw","e":"AQAB"}]}'
      bindings:
        - subject: system:serviceaccount:atlas-production:atlas
          tenant: tuist
          capabilities: [read]
