# Managed Pulse instance, deployed independently of the monitoring collectors.
# Preserve the existing bucket and credential values during the rename.
fullnameOverride: pulse
replicaCount: 1
# The processor pool is untainted and sized only for the processor's own
# rollout surge; anything else landing there can deadlock that rollout.
nodeSelector:
  node.cluster.x-k8s.io/pool: general
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: /metrics
image:
  repository: ghcr.io/tuist/pulse
  # The deployment selects the same immutable version as the published chart.
  tag: ""
existingSecret: pulse-credentials
externalSecrets:
  enabled: true
  storeRef:
    name: onepassword
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE: PULSE_SECRET_KEY_BASE/password
    PULSE_TENANT_TOKENS: PULSE_TOKEN/password
    PULSE_S3_ACCESS_KEY_ID: PULSE_S3_CREDENTIALS/access_key_id
    PULSE_S3_SECRET_ACCESS_KEY: PULSE_S3_CREDENTIALS/secret_access_key
  template:
    PULSE_TENANT_TOKENS: '{"tuist":"sha256${{ .PULSE_TENANT_TOKENS | trim | sha256sum }}"}'
    pulse-username: tuist
    pulse-password: '{{ .PULSE_TENANT_TOKENS | trim }}'
    tenantId: tuist
storage:
  bucket: tuist-pulso-production
  region: auto
  endpoint: https://t3.storage.dev
# Ingestion stays private; only the authenticated MCP endpoint is public.
service:
  type: ClusterIP
# Atlas runs in its own cluster and reaches Pulse over MCP only (see the
# path allowlist in values.yaml), authenticated by the
# workloadIdentity trust entry below.
ingress:
  enabled: true
  className: nginx
  host: pulse.tuist.dev
  paths:
    - path: /mcp
      pathType: Exact
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  tls:
    - secretName: pulse-tls
      hosts: [pulse.tuist.dev]
serviceMonitor:
  enabled: false
autoscaling:
  enabled: false
pools:
  enabled: false
clustering:
  enabled: false
# One combined pod, without old/new maintenance fleets overlapping on upgrades.
strategy:
  type: Recreate
  rollingUpdate: null
# Production ingest volume is far above staging/canary; start with room
# and resize from Pulse's self-monitoring metrics.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi
# Without metrics compaction every remote-write batch stays its own segment
# and panels beyond ~20 minutes exceed the query segment budget. Finalized
# hours group rows by metric name and add hourly rollups. No bucket
# versioning needed; every writer here is 1.30+.
metricsCompaction:
  enabled: true
  finalize: true
# Merges per-push log segments, regroups settled hours by service
# (groupByStream, default on) and builds per-minute rollups for volume panels.
logCompaction:
  enabled: true
traceCompaction:
  enabled: true
# The values below are what Pulse's production-volume load tests ran with
# (docs/storage-costs.md): about 32x canary's metric series and 53x its log
# bytes on one node. Object-store PUTs follow the 2 s coalescing window
# instead of pushes, which is what keeps Tigris Class A requests flat as
# ingest grows; acks wait up to 2 s longer.
ingestBatching:
  flushIntervalMs: 2000
  maxConcurrentRequests: 256
# Preview only: observe mode computes the retention floor but deletes
# nothing. Switching to enforce deletes data and needs an explicit decision.
retention:
  mode: observe
  manifestFormat: paged
  logsDays: 30
  tracesDays: 14
  metricsDays: 90
# Tempo HTTP search/metrics and the MCP TraceQL tools.
tempoSearch:
  enabled: true
# Node-local cache of immutable segments: repeated panel reads and
# maintenance reads of just-uploaded segments skip the billed GET. Production
# fills about 3.6 GiB/hour, so 8 GiB covers 1h dashboards. Counts against the
# node's ephemeral storage (emptyDir).
objectCache:
  disk:
    enabled: true
    sizeMb: 8192
# Query budgets from the production load test. Three concurrent queries plus
# two background workers at 160 MiB heap each stay well under the 4Gi limit;
# concurrent panels queue up to 5 s for a slot instead of getting 429s.
extraEnv:
  - name: PULSE_QUERY_MAX_CONCURRENT
    value: "3"
  - name: PULSE_QUERY_QUEUE_MS
    value: "5000"
  - name: PULSE_QUERY_MAX_HEAP_MB
    value: "160"
  - name: PULSE_QUERY_MAX_SAMPLES
    value: "300000"
  - name: PULSE_QUERY_MAX_SCAN_BYTES
    value: "268435456"
  - name: PULSE_QUERY_TIMEOUT_MS
    value: "15000"
# Atlas (atlas-production cluster) authenticates with its projected
# ServiceAccount token, audience pulse.tuist.dev. The JWKS is the Atlas
# cluster's public signing key, the same one the Tuist server pins as
# TUIST_ATLAS_TOKEN_JWKS; rotate both together. Read-only: no ingest.
workloadIdentity:
  trust:
    - name: atlas-production
      issuer: https://kubernetes.default.svc.cluster.local
      audiences: [pulse.tuist.dev]
      max_token_ttl_seconds: 3600
      keys:
        type: inline
        jwks: '{"keys":[{"use":"sig","kty":"RSA","kid":"RlVpaMmFrqqIHY46_HT42inm4mfvqBKfwLVJiPCcl7g","alg":"RS256","n":"urnlzTgGSYHPHyc-sjXI7lzdx3ChfMpqUMpwuj1vgBMywpvdjFEKZ-5xWBBfS_GIna4q--YBau4zo21xFw0Jd-Ye8l4daXozFTwB1oOv-xOoIL7YITR8dtXsXzqeGIKx1rt90jE2vgvYQDBnkIf9ohgDIApbLICYGSAko5MfdypYhiO52KOxum8nB5dwIaKhr2-DiLQtFQbl__c6Uk2dFpW0_5u4d-uO6yspp5iVo54sc7XIlFNxPBlx2uVQZe8tvTH9Ipc_sovDjMfoKH7g0fG14q6xQU5CkQD1pNS__6J3xFvFYQEp3wXu4i_Rin65EI9GvNKtbZkH-sQ5e8jzLw","e":"AQAB"}]}'
      bindings:
        - subject: system:serviceaccount:atlas-production:atlas
          tenant: tuist
          capabilities: [read]
