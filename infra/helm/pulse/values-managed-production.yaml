# Tuist's initial managed Pulse instance, deployed independently of the server.
# Provision the bucket and every referenced 1Password field before deployment.
# Use a fresh bucket for this fully renamed instance. Historical data requires
# a validated offline migration, not simply changing the bucket setting.
fullnameOverride: pulse
replicaCount: 1

nodeSelector:
  node.cluster.x-k8s.io/pool: general

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: /metrics

image:
  repository: ghcr.io/tuist/pulse
  # The deployment selects the same immutable version as the published chart.
  tag: ""

existingSecret: pulse-app
externalSecrets:
  enabled: true
  storeRef:
    name: onepassword
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE: pulse-secret-key-base/password
    PULSE_TENANT_TOKENS: pulse-tenant-tokens/password
    PULSE_S3_ACCESS_KEY_ID: pulse-object-storage/username
    PULSE_S3_SECRET_ACCESS_KEY: pulse-object-storage/credential

storage:
  bucket: pulse-production
  region: auto
  endpoint: https://t3.storage.dev

# Keep the first instance private. Collector cutover and a public endpoint are
# separate rollouts; no existing telemetry destination is changed by this chart.
service:
  type: ClusterIP
ingress:
  enabled: false
serviceMonitor:
  enabled: false

autoscaling:
  enabled: false
pools:
  enabled: false
clustering:
  enabled: false

# One combined pod, without old/new maintenance fleets overlapping on upgrades.
strategy:
  type: Recreate
  rollingUpdate: null

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

metricsCompaction:
  enabled: true
logCompaction:
  enabled: true
traceCompaction:
  enabled: true
ingestBatching:
  flushIntervalMs: 2000

# Expiry stays non-destructive until an operator approves a retention policy.
retention:
  mode: observe
