{{- if .Values.networkPolicy.enabled }}
# Accepts traffic only from the ingress controller. Egress is denied outright:
# the pod serves files baked into its image and never dials out, not even DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "luft-web.fullname" . }}
  labels:
    {{- include "luft-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "luft-web.componentLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodLabels | nindent 14 }}
  egress: []
{{- end }}
