apiVersion: v1
kind: Service
metadata:
  name: {{ include "luft-web.fullname" . }}
  labels:
    {{- include "luft-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "luft-web.componentLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
