# Overlay for the canary cluster's tailscale-operator install.
# Canary has its own OAuth client + tag pair so a leaked canary
# credential can't enroll a device under the production tag.

tailscale-operator:
  operatorConfig:
    hostname: tuist-k8s-canary
    defaultTags:
      - "tag:tuist-k8s-canary"

connector:
  hostname: tuist-cluster-router-canary
  tags:
    - "tag:tuist-k8s-canary"

# A ProxyGroup with static UDP endpoints on md-0's public IPs, so the macOS
# xcresult VMs reach the Services it serves over a direct path instead of a
# DERP relay, as in production. See `tailnetIngress` in values.yaml.
tailnetIngress:
  enabled: true
  proxyGroup:
    hostnamePrefix: tailnet-ingress-canary
    tags:
      - "tag:tuist-k8s-canary"

macminiEgress:
  enabled: true
  proxyGroup:
    hostnamePrefix: macmini-egress-canary
    tags:
      - "tag:tuist-k8s-canary"
  # Per-machine Services are created dynamically by the CAPI
  # provider — see macosFleet.tailscaleEgress in the main tuist
  # chart's values-managed-common.yaml.
  machines: []
