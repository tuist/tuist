{{- /*
Runtime credentials from the environment's 1Password vault, consumed through
envFrom. Every field is referenced explicitly so a missing one fails the sync
instead of starting the evaluator without it. Field list: values.yaml
`externalSecret`.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "symptoms.runtimeSecretName" . }}
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-secret
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ include "symptoms.runtimeSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SYMPTOMS_PULSE_TOKEN: "{{ `{{ .pulse_token | trim }}` }}"
        SYMPTOMS_PROMETHEUS_TOKEN: "{{ `{{ .pulse_token | trim }}` }}"
  data:
    - secretKey: pulse_token
      remoteRef:
        key: {{ printf "%s/%s" .Values.pulse.tokenItem .Values.pulse.tokenField | quote }}
