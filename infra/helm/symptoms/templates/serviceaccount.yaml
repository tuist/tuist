# The Tuist server authorizes its state endpoint by this ServiceAccount's
# TokenReview username, system:serviceaccount:<namespace>:<name>
# (TUIST_SYMPTOMS_EVALUATOR_NAMESPACE / _SERVICE_ACCOUNT). Renaming it or the
# namespace locks the evaluator out until the server's values follow.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "symptoms.serviceAccountName" . }}
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
{{- if .Values.eventsReader.enabled }}
---
# Kubernetes events are a source (README "Inputs"): read them in every
# namespace, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "symptoms.fullname" . }}-{{ .Release.Namespace }}-events-reader
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "symptoms.fullname" . }}-{{ .Release.Namespace }}-events-reader
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "symptoms.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "symptoms.fullname" . }}-{{ .Release.Namespace }}-events-reader
{{- end }}
