# Independent of eventsReader: authenticate the exact configured server
# principal with TokenReview for the fixed tuist-symptoms-api audience.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "symptoms.fullname" . }}-{{ .Release.Namespace }}-token-review
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "symptoms.fullname" . }}-{{ .Release.Namespace }}-token-review
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "symptoms.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "symptoms.fullname" . }}-{{ .Release.Namespace }}-token-review
