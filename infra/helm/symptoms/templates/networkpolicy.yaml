{{- if .Values.networkPolicy.enabled }}
{{- $tuistNamespace := required "tuist.namespace is required" .Values.tuist.namespace }}
# The evaluator pods only; the CNPG instances keep the operator's own traffic.
# In-cluster peers are here. DNS and the Kubernetes API are in the
# CiliumNetworkPolicy below, because a Kubernetes NetworkPolicy cannot name
# the API server. Cilium allows
# the union of both, and denies everything else in each direction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "symptoms.fullname" . }}
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluator
spec:
  podSelector:
    matchLabels:
      {{- include "symptoms.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The Tuist server pulls the symptom log.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $tuistNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.tuist.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    # The Tailscale operator's proxy for the tailnet Service.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.tailscaleNamespace | quote }}
      ports:
        - protocol: TCP
          port: http
    {{- if .Values.metrics.enabled }}
    # alloy-metrics scrapes the heartbeat and coverage metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace | quote }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.pulse.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.pulse.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.pulse.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $tuistNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.tuist.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tuist.port }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "symptoms.pgClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "symptoms.fullname" . }}-egress
  labels:
    {{- include "symptoms.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluator
spec:
  endpointSelector:
    matchLabels:
      {{- include "symptoms.selectorLabels" . | nindent 6 }}
  egress:
    # DNS through Cilium's proxy.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.dnsNamespace }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Cluster-wide event watch.
    - toEntities:
        - kube-apiserver
{{- end }}
