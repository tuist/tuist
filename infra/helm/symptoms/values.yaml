# Defaults for the symptoms chart. Each managed environment layers
# values-<env>.yaml on top; image.tag comes from the deploy workflow
# (.github/workflows/symptoms-deployment.yml). The release is `symptoms` in
# the `symptoms-<env>` namespace of that environment's workload cluster.

# staging, canary or production. Required.
environment: ""

replicaCount: 1

image:
  repository: ghcr.io/tuist/symptoms
  tag: ""
  pullPolicy: IfNotPresent

# Phoenix endpoint. `host` is PHX_HOST, the evaluator's tailnet name.
host: ""
port: 4000
poolSize: 10
# The release migrates on boot unless SKIP_MIGRATIONS=true.
skipMigrations: false

# Paging (README "Decision"). It stays off until shadow precision has been
# reviewed; until then `decision.would_page` in the log is the only trace. The
# IRM integration is deferred; no notification credentials are mounted.
# `linkBaseUrl`, when set, is prepended to the symptom id as the page's link.
decision:
  pagingEnabled: false
  linkBaseUrl: ""

# Pulse (infra/helm/pulse dashboard-auth). The evaluator only reads Pulse,
# as its own read-only `symptoms` identity (the pulse chart's
# symptomsReader), whose password is PULSE_SYMPTOMS_READER/password. It never
# holds PULSE_TOKEN: that is also the collectors' `tuist:wo` password, and a
# write-only Pulse user may run DDL as well as inserts.
pulse:
  url: http://pulse.observability.svc.cluster.local:4000
  username: symptoms
  tokenItem: PULSE_SYMPTOMS_READER
  tokenField: password
  namespace: observability
  podLabels:
    app.kubernetes.io/instance: pulse
  port: 4000

# The Tuist server, for GET /api/internal/symptoms/state. The evaluator
# authenticates with a projected ServiceAccount token for `stateToken.audience`,
# which the server verifies with TokenReview against
# TUIST_SYMPTOMS_EVALUATOR_NAMESPACE / TUIST_SYMPTOMS_EVALUATOR_SERVICE_ACCOUNT.
tuist:
  url: ""
  namespace: ""
  # Exact server principal authorized for the evaluator API (not a namespace grant).
  serviceAccount: ""
  podLabels:
    app.kubernetes.io/instance: tuist
    app.kubernetes.io/component: server
  # The server pods' container port (Service port 80 targets it).
  port: 8080

stateToken:
  audience: tuist-symptoms-state
  expirationSeconds: 3600

# Exported for Pulse (heartbeat, coverage, freshness) through the
# cluster's annotation autodiscovery scrape (k8s-monitoring). Served on its own
# container port, which the Service (and so the tailnet) does not expose and
# the NetworkPolicy opens only to the observability namespace.
metrics:
  enabled: true
  path: /metrics
  port: 9568

# Cluster-wide read of Kubernetes events (get, list, watch only).
eventsReader:
  enabled: true

service:
  type: ClusterIP
  port: 80
  # Tailnet only: the Tailscale operator exposes the Service as
  # `<hostname>.<tailnet>.ts.net`. There is no public Ingress.
  tailscale:
    expose: true
    hostname: ""

networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  # Where the Tailscale operator runs the proxy for the tailnet Service.
  tailscaleNamespace: tailscale-operator
  # alloy-metrics scrapes the metrics endpoint from here.
  observabilityNamespace: observability

# Pulse credentials from the environment vault (tuist-k8s-<env>).
externalSecret:
  refreshInterval: "1h"
  storeRef:
    name: onepassword
    kind: ClusterSecretStore

postgresql:
  # Two instances so a node drain can evict the primary (see the comment on
  # postgresql.instances in ../tuist-ops/values.yaml).
  instances: 2
  storageSize: 20Gi
  storageClass: ""
  database: symptoms
  owner: symptoms
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16.6"
  parameters:
    max_connections: "50"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  backup:
    enabled: true
    # Set per environment: s3://tuist-<env>-pg-backups/symptoms.
    destinationPath: ""
    endpointURL: https://t3.storage.dev
    retentionPolicy: "30d"
    # ESO-synced from the evaluator's own Tigris key (fields access_key_id,
    # secret_access_key), scoped by an IAM policy to the `symptoms/` prefix of
    # the environment's backup bucket (README "Backup key"). Never the shared
    # S3_BACKUP_CREDENTIALS: that key reads and deletes the server's customer
    # Postgres backups at the bucket root, and the chart refuses it.
    credentialsItem: SYMPTOMS_PG_BACKUP
    credentialsSecretName: symptoms-backup-credentials
    plugin:
      name: barman-cloud.cloudnative-pg.io

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
podAnnotations: {}

probes:
  path: /healthz
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    periodSeconds: 30
    failureThreshold: 3
