environment: staging
host: symptoms-staging.taild6d7bb.ts.net

tuist:
  url: http://tuist-tuist-server.tuist-staging.svc.cluster.local
  namespace: tuist-staging
  serviceAccount: tuist-server

service:
  tailscale:
    hostname: symptoms-staging

postgresql:
  backup:
    destinationPath: s3://tuist-stag-pg-backups/symptoms
    # symptoms-pg/ holds WAL from the cluster recreated on 2026-11-25, so this
    # cluster archives beside it. Delete symptoms-pg/ once it is no longer
    # needed for recovery.
    serverName: symptoms-pg-2
