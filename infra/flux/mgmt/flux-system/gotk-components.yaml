            - interval
            - prune
            - sourceRef
            type: object
          status:
            default:
              observedGeneration: -1
            description: KustomizationStatus defines the observed state of a kustomization.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              history:
                description: |-
                  History contains a set of snapshots of the last reconciliation attempts
                  tracking the revision, the state and the duration of each attempt.
                items:
                  description: |-
                    Snapshot represents a point-in-time record of a group of resources reconciliation,
                    including timing information, status, and a unique digest identifier.
                  properties:
                    digest:
                      description: Digest is the checksum in the format `<algo>:<hex>`
                        of the resources in this snapshot.
                      type: string
                    firstReconciled:
                      description: FirstReconciled is the time when this revision
                        was first reconciled to the cluster.
                      format: date-time
                      type: string
                    lastReconciled:
                      description: LastReconciled is the time when this revision was
                        last reconciled to the cluster.
                      format: date-time
                      type: string
                    lastReconciledDuration:
                      description: LastReconciledDuration is time it took to reconcile
                        the resources in this revision.
                      type: string
                    lastReconciledStatus:
                      description: LastReconciledStatus is the status of the last
                        reconciliation.
                      type: string
                    metadata:
                      additionalProperties:
                        type: string
                      description: Metadata contains additional information about
                        the snapshot.
                      type: object
                    totalReconciliations:
                      description: TotalReconciliations is the total number of reconciliations
                        that have occurred for this snapshot.
                      format: int64
                      type: integer
                  required:
                  - digest
                  - firstReconciled
                  - lastReconciled
                  - lastReconciledDuration
                  - lastReconciledStatus
                  - totalReconciliations
                  type: object
                type: array
              inventory:
                description: |-
                  Inventory contains the list of Kubernetes resource object references that
                  have been successfully applied.
                properties:
                  entries:
                    description: Entries of Kubernetes resource object references.
                    items:
                      description: ResourceRef contains the information necessary
                        to locate a resource within a cluster.
                      properties:
                        id:
                          description: |-
                            ID is the string representation of the Kubernetes resource object's metadata,
                            in the format '<namespace>_<name>_<group>_<kind>'.
                          type: string
                        v:
                          description: Version is the API version of the Kubernetes
                            resource object's kind.
                          type: string
                      required:
                      - id
                      - v
                      type: object
                    type: array
                required:
                - entries
                type: object
              lastAppliedOriginRevision:
                description: |-
                  The last successfully applied origin revision.
                  Equals the origin revision of the applied Artifact from the referenced Source.
                  Usually present on the Metadata of the applied Artifact and depends on the
                  Source type, e.g. for OCI it's the value associated with the key
                  "org.opencontainers.image.revision".
                type: string
              lastAppliedRevision:
                description: |-
                  The last successfully applied revision.
                  Equals the Revision of the applied Artifact from the referenced Source.
                type: string
              lastAttemptedRevision:
                description: LastAttemptedRevision is the revision of the last reconciliation
                  attempt.
                type: string
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile request value, so a change of the annotation value
                  can be detected.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last reconciled generation.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: kustomize-controller
    app.kubernetes.io/instance: flux-system
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/version: v2.9.5
  name: kustomize-controller
  namespace: flux-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: kustomize-controller
    app.kubernetes.io/instance: flux-system
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/version: v2.9.5
    control-plane: controller
  name: kustomize-controller
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kustomize-controller
  template:
    metadata:
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: kustomize-controller
        app.kubernetes.io/component: kustomize-controller
        app.kubernetes.io/instance: flux-system
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/version: v2.9.5
    spec:
      containers:
      - args:
        - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
        - --watch-all-namespaces=true
        - --log-level=info
        - --log-encoding=json
        - --enable-leader-election
        env:
        - name: RUNTIME_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: manager
              resource: limits.memory
        image: ghcr.io/fluxcd/kustomize-controller:v1.9.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        name: manager
        ports:
        - containerPort: 8080
          name: http-prom
          protocol: TCP
        - containerPort: 9440
          name: healthz
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: temp
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 1337
      serviceAccountName: kustomize-controller
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir: {}
        name: temp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app.kubernetes.io/component: helm-controller
    app.kubernetes.io/instance: flux-system
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/version: v2.9.5
  name: helmreleases.helm.toolkit.fluxcd.io
spec:
  group: helm.toolkit.fluxcd.io
  names:
    categories:
    - all
    - fluxcd
    - fluxcd-appliers
    kind: HelmRelease
    listKind: HelmReleaseList
    plural: helmreleases
    shortNames:
    - hr
    singular: helmrelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Status
      type: string
    name: v2
    schema:
      openAPIV3Schema:
        description: HelmRelease is the Schema for the helmreleases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HelmReleaseSpec defines the desired state of a Helm release.
            properties:
              chart:
                description: |-
                  Chart defines the template of the v1.HelmChart that should be created
                  for this HelmRelease.
                properties:
                  metadata:
                    description: ObjectMeta holds the template for metadata like labels
                      and annotations.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Map of string keys and values that can be used to organize and categorize
                          (scope and select) objects.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
                        type: object
                    type: object
                  spec:
                    description: Spec holds the template for the v1.HelmChartSpec
                      for this HelmRelease.
                    properties:
                      chart:
                        description: The name or path the Helm chart is available
                          at in the SourceRef.
                        maxLength: 2048
                        minLength: 1
                        type: string
                      ignoreMissingValuesFiles:
                        description: IgnoreMissingValuesFiles controls whether to
                          silently ignore missing values files rather than failing.
                        type: boolean
                      interval:
                        description: |-
                          Interval at which to check the v1.Source for updates. Defaults to
                          'HelmReleaseSpec.Interval'.
                        pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                        type: string
                      reconcileStrategy:
                        default: ChartVersion
                        description: |-
                          Determines what enables the creation of a new artifact. Valid values are
                          ('ChartVersion', 'Revision').
                          See the documentation of the values for an explanation on their behavior.
                          Defaults to ChartVersion when omitted.
                        enum:
                        - ChartVersion
                        - Revision
                        type: string
                      sourceRef:
                        description: The name and namespace of the v1.Source the chart
                          is available at.
                        properties:
                          apiVersion:
                            description: APIVersion of the referent.
                            type: string
                          kind:
                            description: Kind of the referent.
                            enum:
                            - HelmRepository
                            - GitRepository
                            - Bucket
                            type: string
                          name:
                            description: Name of the referent.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the referent.
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - kind
                        - name
                        type: object
                      valuesFiles:
                        description: |-
                          Alternative list of values files to use as the chart values (values.yaml
                          is not included by default), expected to be a relative path in the SourceRef.
                          Values files are merged in the order of this list with the last file overriding
                          the first. Ignored when omitted.
                        items:
                          type: string
                        type: array
                      verify:
                        description: |-
                          Verify contains the secret name containing the trusted public keys
                          used to verify the signature and specifies which provider to use to check
                          whether OCI image is authentic.
                          This field is only supported for OCI sources.
                          Chart dependencies, which are not bundled in the umbrella chart artifact,
                          are not verified.
                        properties:
                          provider:
                            default: cosign
                            description: Provider specifies the technology used to
                              sign the OCI Helm chart.
                            enum:
                            - cosign
                            - notation
                            type: string
                          secretRef:
                            description: |-
                              SecretRef specifies the Kubernetes Secret containing the
                              trusted public keys.
                            properties:
                              name:
                                description: Name of the referent.
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - provider
                        type: object
                      version:
                        default: '*'
                        description: |-
                          Version semver expression, ignored for charts from v1.GitRepository and
                          v1beta2.Bucket sources. Defaults to latest when omitted.
                        type: string
                    required:
                    - chart
                    - sourceRef
                    type: object
                required:
                - spec
                type: object
              chartRef:
                description: |-
                  ChartRef holds a reference to a source controller resource containing the
                  Helm chart artifact.
                properties:
                  apiVersion:
                    description: APIVersion of the referent.
                    type: string
                  kind:
                    description: Kind of the referent.
                    enum:
                    - OCIRepository
                    - HelmChart
                    - ExternalArtifact
                    type: string
                  name:
                    description: Name of the referent.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent, defaults to the namespace of the Kubernetes
                      resource object that contains the reference.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              commonMetadata:
                description: |-
                  CommonMetadata specifies the common labels and annotations that are
                  applied to all resources. Any existing label or annotation will be
                  overridden if its key matches a common one.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations to be added to the object's metadata.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to be added to the object's metadata.
                    type: object
                type: object
              dependsOn:
                description: |-
                  DependsOn may contain a DependencyReference slice with
                  references to HelmRelease resources that must be ready before this HelmRelease
                  can be reconciled.
                items:
                  description: |-
                    DependencyReference contains enough information to locate the referenced Kubernetes resource object
                    and optional CEL expression to assess its readiness.
                  properties:
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent, defaults to the namespace of the resource
                        object that contains the reference.
                      type: string
                    readyExpr:
                      description: |-
                        ReadyExpr is a CEL expression that can be used to assess the readiness
                        of a dependency. When specified, the built-in readiness check
                        is replaced by the logic defined in the CEL expression.
                        To make the CEL expression additive to the built-in readiness check,
                        the feature gate `AdditiveCELDependencyCheck` must be set to `true`.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              driftDetection:
                description: |-
                  DriftDetection holds the configuration for detecting and handling
                  differences between the manifest in the Helm storage and the resources
                  currently existing in the cluster.
                properties:
                  ignore:
                    description: |-
                      Ignore contains a list of rules for specifying which changes to ignore
                      during diffing.
                    items:
                      description: |-
                        IgnoreRule defines a rule to selectively disregard specific changes during
                        the drift detection process.
                      properties:
                        paths:
                          description: |-
                            Paths is a list of JSON Pointer (RFC 6901) paths to be excluded from
                            consideration in a Kubernetes object.
                          items:
                            type: string
                          type: array
                        target:
                          description: |-
                            Target is a selector for specifying Kubernetes objects to which this
                            rule applies.
                            If Target is not set, the Paths will be ignored for all Kubernetes
                            objects within the manifest of the Helm release.
                          properties:
                            annotationSelector:
                              description: |-
                                AnnotationSelector is a string that follows the label selection expression
                                https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#api
                                It matches with the resource annotations.
                              type: string
                            group:
                              description: |-
                                Group is the API group to select resources from.
                                Together with Version and Kind it is capable of unambiguously identifying and/or selecting resources.
                                https://github.com/kubernetes/community/blob/master/contributors/design-proposals/api-machinery/api-group.md
                              type: string
                            kind:
                              description: |-
                                Kind of the API Group to select resources from.
                                Together with Group and Version it is capable of unambiguously
                                identifying and/or selecting resources.
                                https://github.com/kubernetes/community/blob/master/contributors/design-proposals/api-machinery/api-group.md
                              type: string
                            labelSelector:
                              description: |-
                                LabelSelector is a string that follows the label selection expression
                                https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/#api
                                It matches with the resource labels.
                              type: string
                            name:
                              description: Name to match resources with.
                              type: string
                            namespace:
                              description: Namespace to select resources from.
                              type: string
                            version:
                              description: |-
                                Version of the API Group to select resources from.
                                Together with Group and Kind it is capable of unambiguously identifying and/or selecting resources.
                                https://github.com/kubernetes/community/blob/master/contributors/design-proposals/api-machinery/api-group.md
                              type: string
                          type: object
                      required:
                      - paths
                      type: object
                    type: array
                  mode:
                    description: |-
                      Mode defines how differences should be handled between the Helm manifest
                      and the manifest currently applied to the cluster.
                      If not explicitly set, it defaults to DiffModeDisabled.
                    enum:
                    - enabled
                    - warn
                    - disabled
                    type: string
                type: object
              healthCheckExprs:
                description: |-
                  HealthCheckExprs is a list of healthcheck expressions for evaluating the
                  health of custom resources using Common Expression Language (CEL).
                  The expressions are evaluated only when the specific Helm action
                  taking place has wait enabled, i.e. DisableWait is false, and the
                  'poller' WaitStrategy is used.
                items:
                  description: CustomHealthCheck defines the health check for custom
                    resources.
                  properties:
                    apiVersion:
                      description: APIVersion of the custom resource under evaluation.
                      type: string
                    current:
                      description: |-
                        Current is the CEL expression that determines if the status
                        of the custom resource has reached the desired state.
                      type: string
                    failed:
                      description: |-
                        Failed is the CEL expression that determines if the status
                        of the custom resource has failed to reach the desired state.
                      type: string
                    inProgress:
                      description: |-
                        InProgress is the CEL expression that determines if the status
                        of the custom resource has not yet reached the desired state.
                      type: string
                    kind:
                      description: Kind of the custom resource under evaluation.
                      type: string
                  required:
                  - apiVersion
                  - current
                  type: object
                type: array
              install:
                description: Install holds the configuration for Helm install actions
                  for this HelmRelease.
                properties:
                  crds:
                    description: |-
                      CRDs upgrade CRDs from the Helm Chart's crds directory according
                      to the CRD upgrade policy provided here. Valid values are `Skip`,
                      `Create` or `CreateReplace`. Default is `Create` and if omitted
                      CRDs are installed but not updated.

                      Skip: do neither install nor replace (update) any CRDs.

                      Create: new CRDs are created, existing CRDs are neither updated nor deleted.

                      CreateReplace: new CRDs are created, existing CRDs are updated (replaced)
                      but not deleted.

                      By default, CRDs are applied (installed) during Helm install action.
                      With this option users can opt in to CRD replace existing CRDs on Helm
                      install actions, which is not (yet) natively supported by Helm.
                      https://helm.sh/docs/chart_best_practices/custom_resource_definitions.
                    enum:
                    - Skip
                    - Create
                    - CreateReplace
                    type: string
                  createNamespace:
                    description: |-
                      CreateNamespace tells the Helm install action to create the
                      HelmReleaseSpec.TargetNamespace if it does not exist yet.
                      On uninstall, the namespace will not be garbage collected.
                    type: boolean
                  disableHooks:
                    description: DisableHooks prevents hooks from running during the
                      Helm install action.
                    type: boolean
                  disableOpenAPIValidation:
                    description: |-
                      DisableOpenAPIValidation prevents the Helm install action from validating
                      rendered templates against the Kubernetes OpenAPI Schema.
                    type: boolean
                  disableSchemaValidation:
                    description: |-
                      DisableSchemaValidation prevents the Helm install action from validating
                      the values against the JSON Schema.
                    type: boolean
                  disableTakeOwnership:
                    description: |-
                      DisableTakeOwnership disables taking ownership of existing resources
                      during the Helm install action. Defaults to false.
                    type: boolean
                  disableWait:
                    description: |-
                      DisableWait disables the waiting for resources to be ready after a Helm
                      install has been performed.
                    type: boolean
                  disableWaitForJobs:
                    description: |-
                      DisableWaitForJobs disables waiting for jobs to complete after a Helm
                      install has been performed.
                    type: boolean
                  remediation:
                    description: |-
                      Remediation holds the remediation configuration for when the Helm install
                      action for the HelmRelease fails. The default is to not perform any action.
                    properties:
                      ignoreTestFailures:
                        description: |-
                          IgnoreTestFailures tells the controller to skip remediation when the Helm
                          tests are run after an install action but fail. Defaults to
                          'Test.IgnoreFailures'.
                        type: boolean
                      remediateLastFailure:
                        description: |-
                          RemediateLastFailure tells the controller to remediate the last failure, when
                          no retries remain. Defaults to 'false'.
                        type: boolean
                      retries:
                        description: |-
                          Retries is the number of retries that should be attempted on failures before
                          bailing. Remediation, using an uninstall, is performed between each attempt.
                          Defaults to '0', a negative integer equals to unlimited retries.
                        type: integer
                    type: object
                  replace:
                    description: |-
                      Replace tells the Helm install action to re-use the 'ReleaseName', but only
                      if that name is a deleted release which remains in the history.
                    type: boolean
                  serverSideApply:
                    description: |-
                      ServerSideApply enables server-side apply for resources during install.
                      Defaults to true (or false when UseHelm3Defaults feature gate is enabled).
                    type: boolean
                  skipCRDs:
                    description: |-
                      SkipCRDs tells the Helm install action to not install any CRDs. By default,
                      CRDs are installed if not already present.

                      Deprecated use CRD policy (`crds`) attribute with value `Skip` instead.
                    type: boolean
                  strategy:
                    description: |-
                      Strategy defines the install strategy to use for this HelmRelease.
                      Defaults to 'RemediateOnFailure', or 'RetryOnFailure' when the
                      DefaultToRetryOnFailure feature gate is enabled.
                    properties:
                      name:
                        description: Name of the install strategy.
                        enum:
                        - RemediateOnFailure
                        - RetryOnFailure
                        type: string
                      retryInterval:
                        description: |-
                          RetryInterval is the interval at which to retry a failed install.
                          Can be used only when Name is set to RetryOnFailure.
                          Defaults to '5m'.
                        pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: .retryInterval cannot be set when .name is 'RemediateOnFailure'
                      rule: '!has(self.retryInterval) || self.name != ''RemediateOnFailure'''
                  timeout:
                    description: |-
                      Timeout is the time to wait for any individual Kubernetes operation (like
                      Jobs for hooks) during the performance of a Helm install action. Defaults to
                      'HelmReleaseSpec.Timeout'.
                    pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                    type: string
                type: object
              interval:
                description: Interval at which to reconcile the Helm release.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              kubeConfig:
                description: |-
                  KubeConfig for reconciling the HelmRelease on a remote cluster.
                  When used in combination with HelmReleaseSpec.ServiceAccountName,
                  forces the controller to act on behalf of that Service Account at the
                  target cluster.
                  If the --default-service-account flag is set, its value will be used as
                  a controller level fallback for when HelmReleaseSpec.ServiceAccountName
                  is empty.
                properties:
                  configMapRef:
                    description: |-
                      ConfigMapRef holds an optional name of a ConfigMap that contains
                      the following keys:

                      - `provider`: the provider to use. One of `aws`, `azure`, `gcp`, or
                         `generic`. Required.
                      - `cluster`: the fully qualified resource name of the Kubernetes
                         cluster in the cloud provider API. Not used by the `generic`
                         provider. Required when one of `address` or `ca.crt` is not set.
                      - `address`: the address of the Kubernetes API server. Required
                         for `generic`. For the other providers, if not specified, the
                         first address in the cluster resource will be used, and if
                         specified, it must match one of the addresses in the cluster
                         resource.
                         If audiences is not set, will be used as the audience for the
                         `generic` provider.
                      - `ca.crt`: the optional PEM-encoded CA certificate for the
                         Kubernetes API server. If not set, the controller will use the
                         CA certificate from the cluster resource.
                      - `audiences`: the optional audiences as a list of
                         line-break-separated strings for the Kubernetes ServiceAccount
                         token. Defaults to the `address` for the `generic` provider, or
                         to specific values for the other providers depending on the
                         provider.
                      -  `serviceAccountName`: the optional name of the Kubernetes
                         ServiceAccount in the same namespace that should be used
                         for authentication. If not specified, the controller
                         ServiceAccount will be used.

                      Mutually exclusive with SecretRef.
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                  secretRef:
                    description: |-
                      SecretRef holds an optional name of a secret that contains a key with
                      the kubeconfig file as the value. If no key is set, the key will default
                      to 'value'. Mutually exclusive with ConfigMapRef.
                      It is recommended that the kubeconfig is self-contained, and the secret
                      is regularly updated if credentials such as a cloud-access-token expire.
                      Cloud specific `cmd-path` auth helpers will not function without adding
                      binaries and credentials to the Pod that is responsible for reconciling
                      Kubernetes resources. Supported only for the generic provider.
