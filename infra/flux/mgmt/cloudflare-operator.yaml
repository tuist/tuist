# Installs the Cloudflare operator into the management cluster from the
# OCI chart published from this repository. The Kustomization waits for the Helm
# release so Cloudflare configuration can depend on the controller and
# its custom resource definition being ready, not on every source resource.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/flux/cloudflare-operator
  prune: true
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudflare-operator
      namespace: flux-system
  force: false
