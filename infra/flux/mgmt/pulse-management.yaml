# Independent reconciliation: missing management-vault items or bucket access
# fail only this child, never Cluster reconciliation or Pillar 2 monitoring.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pulse-management
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/flux/pulse-management
  prune: true
  wait: true
  force: false
