# The same chart the workload clusters install with pulse-deployment.yml,
# read from this repository at Flux's revision; values-management.yaml pins
# it to one node's /var (management has no volume provisioner) and the
# management/ prefix of tuist-pulso-production. Vault items in tuist-k8s-mgmt:
# PULSE_TOKEN/password and PULSE_S3_CREDENTIALS (a key limited to that
# prefix); mgmt-cluster-apply.yml
# creates the in-cluster pulse-auth Secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulse
  namespace: flux-system
spec:
  interval: 10m
  # Held while mgmt-cluster-apply.yml's reset_pulse empties the release's data,
  # so Flux never upgrades the old catalog in place onto the renamed release.
  suspend: true
  releaseName: pulse
  targetNamespace: observability
  storageNamespace: observability
  chart:
    spec:
      chart: ./infra/helm/pulse
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      # Flux drops the chart's values.yaml once valuesFiles is set.
      valuesFiles:
        - ./infra/helm/pulse/values.yaml
        - ./infra/helm/pulse/values-management.yaml
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
