# Keep verified and self-declared automation out of real-user monitoring.
# The explicit user-agent tokens were observed in Faro even with the WebDriver
# guard. They do not classify clients presenting as ordinary Chrome; browser
# versions, operating systems, and viewport sizes are deliberately not used.
apiVersion: cloudflare.tuist.dev/v1alpha1
kind: CloudflareCustomRule
metadata:
  name: browser-telemetry-verified-bots
spec:
  zoneId: 4421110085237b867a891bd0a40da106
  description: "Browser telemetry - exclude verified and self-declared bots"
  expression: |-
    http.host eq "tuist.dev" and
    http.request.method eq "POST" and
    http.request.uri.path eq "/-/faro/collect" and
    (
      cf.client.bot or
      lower(http.user_agent) contains "headlesschrome/" or
      lower(http.user_agent) eq "yisouspider" or
      starts_with(lower(http.user_agent), "sogou web spider/") or
      starts_with(lower(http.user_agent), "meta-externalagent/")
    )
  action: block
  enabled: true
  mode: active
  createNewRule: true
  retainOnDelete: false
