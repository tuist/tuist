# Imported from the live tuist.dev custom firewall entry-point ruleset on
# 2026-09-06.
#
# `public-dashboard-bot-protection` is a leftover from the manual
# response to the crawler-driven ClickHouse OOM incident. Its
# expression enumerates a specific set of `/tuist/**` subpaths, so it
# only ever protected a handful of accounts and never covered any
# other public project on the zone (including future ones).
#
# It is superseded by two mechanisms that landed in #13205:
#   - `CloudflareBotManagement/tuist-dev` sets
#     `sbfm_definitely_automated: managed_challenge` at the edge for
#     every host on the zone, without a path allowlist.
#   - `TuistWeb.PublicPageChallengeController` (armed in production via
#     `server.publicPageChallenge.enabled` in
#     `values-managed-production.yaml`) issues a Turnstile challenge in
#     front of the public dashboard for every public project on any
#     account, keyed on the visibility flag rather than a path prefix.
#
# Both were verified live before this soft-off: `sbfm_definitely_automated`
# reads `managed_challenge` on the zone, the operator pod runs the
# post-#13205 image, and `TUIST_PUBLIC_PAGE_CHALLENGE_ENABLED=1` is
# rendered on the production `tuist-tuist-server` deployment.
#
# The rule stays in git rather than being deleted, so that a rollback
# is just flipping `enabled: true` again — `adopt.ruleId` and
# `retainOnDelete` are preserved so the same Cloudflare rule id gets
# re-armed without recreating it.
apiVersion: cloudflare.tuist.dev/v1alpha1
kind: CloudflareCustomRule
metadata:
  name: public-dashboard-bot-protection
spec:
  zoneId: 4421110085237b867a891bd0a40da106
  description: "Bot protection"
  expression: |-
    (
      http.request.uri.path eq "/tuist" or
      starts_with(http.request.uri.path, "/tuist/projects") or
      starts_with(http.request.uri.path, "/tuist/runners") or
      starts_with(http.request.uri.path, "/tuist/usage") or
      starts_with(http.request.uri.path, "/tuist/tuist") or
      starts_with(http.request.uri.path, "/tuist/gradle-plugin") or
      starts_with(http.request.uri.path, "/tuist/ios_app_with_frameworks") or
      starts_with(http.request.uri.path, "/tuist/android")
    ) and not (
      ends_with(http.request.uri.path, "/manifest.plist") or
      ends_with(http.request.uri.path, "/app.ipa") or
      ends_with(http.request.uri.path, "/app.apk") or
      ends_with(http.request.uri.path, "/qr-code.svg") or
      ends_with(http.request.uri.path, "/qr-code.png") or
      ends_with(http.request.uri.path, "/icon.png") or
      (
        ends_with(http.request.uri.path, "/download") and
        not starts_with(http.request.uri.path, "/tuist/runners/")
      )
    ) and not cf.client.bot
  action: managed_challenge
  enabled: false
  mode: active
  adopt:
    ruleId: 6d023cf1e6b24525af4c727a4ebe730f
  retainOnDelete: true
---
apiVersion: cloudflare.tuist.dev/v1alpha1
kind: CloudflareCustomRule
metadata:
  name: leaked-credentials-challenge
spec:
  zoneId: 4421110085237b867a891bd0a40da106
  description: "Leaked credentials detected - managed challenge"
  expression: "cf.waf.credential_check.password_leaked"
  action: managed_challenge
  enabled: true
  mode: active
  adopt:
    ruleId: b7afe460a4a241cbabe975d698397da9
  retainOnDelete: true
