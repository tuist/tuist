# Imported from the live tuist.dev rate-limiting entry-point ruleset on
# 2026-09-05. Its read-only adoption reconciled without proposed changes
# before active management was enabled.
apiVersion: cloudflare.tuist.dev/v1alpha1
kind: CloudflareRateLimit
metadata:
  name: public-pages-anti-bombardment
spec:
  zoneId: 4421110085237b867a891bd0a40da106
  description: "Public pages – anti-bombardment"
  expression: |-
    http.request.method in {"GET" "HEAD"} and not cf.client.bot
  action: managed_challenge
  enabled: true
  mode: active
  adopt:
    ruleId: 20a7e7c0f002481baa1b6b91af90e3ba
  retainOnDelete: true
  ratelimit:
    characteristics:
      - "ip.src"
      - "cf.colo.id"
    requestsPerPeriod: 60
    period: 10
    mitigationTimeoutSeconds: 0
    # Count public route candidates even on redirects, 404s and responses
    # without x-tuist-public. This also bounds docs and crawler exports.
    # Keep the marketing regex identical to skip-sbfm-marketing-pages.yaml.
    countingExpression: |-
      http.request.method in {"GET" "HEAD"} and not cf.client.bot and (
      http.response.headers["x-tuist-public"][0] eq "1" or
      (http.host eq "tuist.dev" and (
        http.request.uri.path matches r"^/(?:(?:(?:ar|es|ja|ka|ko|ru|tr|yue_Hant|zh_Hans|zh_Hant)/)?(?:about|brand|cache|compute|download|previews|pricing|tests|community|cookies|data-act-addendum|data-processing-addendum|imprint|longevity|openness|privacy|security|service-level-addendum|terms|trademark-guidelines|blog(?:/[0-9]{4}/[0-9]{2}/[0-9]{2}/[^/%]+(?:/iframe[.]html)?)?|changelog(?:/[^/%]+)?|customers(?:/[^/%]+)?|newsletter(?:/issues/[0-9]+)?)|ar|es|ja|ka|ko|ru|tr|yue_Hant|zh_Hans|zh_Hant|compare|build-systems|case-studies(?:/[^/%]+)?|flaky-tests|test-insights|blog/bazel/timeline[.]json|rss[.]xml|(?:blog|changelog)/(?:rss|atom)[.]xml)?$" or
        http.request.uri.path matches r"^/(?:docs(?:/.*)?|(?:ar|en|es|ja|ka|ko|ru|tr|yue_Hant|zh_Hans|zh_Hant)/(?:docs|docs-markdown)(?:/.*)?|marketing-markdown(?:/.*)?|robots[.]txt|llms(?:-full)?[.]txt|sitemap[.]xml|geofeed[.]csv)$"
      ))
      )
