apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  interval: 1m
  type: oci
  url: oci://ghcr.io/tuist/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cloudflare-operator
  targetNamespace: cloudflare-operator
  storageNamespace: cloudflare-operator
  chart:
    spec:
      chart: cloudflare-operator
      # CI publishes 0.2.<workflow-run-number>-<attempt>, with an immutable
      # image digest inside each chart. Include these prerelease versions;
      # selecting a new artifact never needs an image-bump commit in Git.
      version: ">=0.2.0-0 <0.3.0-0"
      interval: 1m
      sourceRef:
        kind: HelmRepository
        name: cloudflare-operator
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
