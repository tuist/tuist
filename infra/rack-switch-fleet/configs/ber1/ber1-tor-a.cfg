  spanning-tree
#
interface ten-gigabitEthernet 1/0/25
  spanning-tree
  switchport general allowed vlan 10 tagged
  switchport general allowed vlan 4000 tagged
#
interface ten-gigabitEthernet 1/0/26
  spanning-tree
