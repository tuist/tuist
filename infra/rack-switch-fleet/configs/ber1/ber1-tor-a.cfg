interface ten-gigabitEthernet 1/0/30
  spanning-tree
#
interface ten-gigabitEthernet 1/0/31
  description "isl ber1-tor-b"
  spanning-tree
  channel-group 1 mode active
  switchport general allowed vlan 10 tagged
  switchport general allowed vlan 4000 tagged
#
interface ten-gigabitEthernet 1/0/32
  description "isl ber1-tor-b"
  spanning-tree
  channel-group 1 mode active
  switchport general allowed vlan 10 tagged
  switchport general allowed vlan 4000 tagged
#
interface port-channel 1
  description "isl ber1-tor-b"
  spanning-tree
  switchport general allowed vlan 10 tagged
  switchport general allowed vlan 4000 tagged
