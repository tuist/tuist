!SX3832
#
vlan 1
 name "System-VLAN"
#
vlan 10
 name "machines"
#
vlan 4000
 name "edge-vrrp"
#
hostname "ber1-tor-a"
serial_port baud_rate 38400
#
no system-time dst
#
telnet disable
no service reset-disable
#
spanning-tree
spanning-tree mode rstp
#
no snmp-server
#
no ip http server
#
lldp
#
no controller cloud-based
no controller cloud-based privacy-policy
#
interface vlan 1
  ip address 192.168.0.11 255.255.255.0 gateway 192.168.0.10
  ipv6 enable
#
interface ten-gigabitEthernet 1/0/1
  spanning-tree
#
interface ten-gigabitEthernet 1/0/2
  spanning-tree
#
interface ten-gigabitEthernet 1/0/3
  spanning-tree
#
interface ten-gigabitEthernet 1/0/4
  spanning-tree
#
interface ten-gigabitEthernet 1/0/5
  spanning-tree
#
interface ten-gigabitEthernet 1/0/6
  spanning-tree
#
interface ten-gigabitEthernet 1/0/7
  spanning-tree
#
interface ten-gigabitEthernet 1/0/8
  spanning-tree
#
interface ten-gigabitEthernet 1/0/9
  spanning-tree
#
interface ten-gigabitEthernet 1/0/10
  spanning-tree
#
interface ten-gigabitEthernet 1/0/11
  spanning-tree
#
interface ten-gigabitEthernet 1/0/12
  spanning-tree
#
interface ten-gigabitEthernet 1/0/13
  spanning-tree
#
interface ten-gigabitEthernet 1/0/14
  spanning-tree
