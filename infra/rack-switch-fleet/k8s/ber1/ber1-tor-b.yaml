apiVersion: tuist.dev/v1alpha1
kind: RackSwitch
metadata:
  name: ber1-tor-b
  labels:
    tuist.dev/site: ber1
    tuist.dev/role: tor
spec:
  site: ber1
  role: tor
  model: sx3832
  managementAddress: 192.168.0.12
  applyOrder: 1
  applyNote: No WAN path lands here, so a bad change costs one half of the rack's redundancy rather than the site's connectivity. Always the first switch changed, and the only one used to try a change out.
  credentialItem: ber1-tor-b switch admin
  configRevision: 5ef04ee11ceedbe0
  ports:
    - port: 25
      purpose: data
      peer: ber1-edge
      detail: edge/sfp28-1
    - port: 32
      purpose: isl
      peer: ber1-tor-a
      detail: dac
