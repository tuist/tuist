apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: RackATS
metadata:
  name: ber1-ats-1
  labels:
    tuist.dev/site: ber1
    tuist.dev/role: power
spec:
  site: ber1
  model: eats16n
  address: 192.168.0.14
  managedBy: controller
  preferredSource: 1
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ber1-ats-1-admin
  labels:
    tuist.dev/site: ber1
    tuist.dev/role: power
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: ber1-ats-1-credentials
  data:
    - match:
        secretKey: admin-username
        remoteRef:
          remoteKey: ber1-ats-1 admin
          property: username
    - match:
        secretKey: admin-password
        remoteRef:
          remoteKey: ber1-ats-1 admin
          property: password
