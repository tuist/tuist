# Host-side KVM in the Kata guest, so a runner can run hardware-accelerated
# guests of its own (x86_64 Android emulators). Built in: the Kata guest
# kernel has no module support.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_AMD=y
CONFIG_KVM_INTEL=y
# The in-kernel I/O APIC and PIC. Without it KVM_CREATE_IRQCHIP fails with
# ENOTTY and the emulator's QEMU stalls before the guest boots. The base is
# allnoconfig, so it has to be asked for here.
CONFIG_KVM_IOAPIC=y
