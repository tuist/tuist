[tools]
erlang = "29.1"
elixir = "1.20.4-otp-29"
# git-cliff must be declared here, not just `mise install`ed inline,
# so mise activates its shim. Without a config-file entry, mise
# installs the binary but refuses to resolve the shim ("No version is
# set for shim: git-cliff"), which silently breaks the release
# workflow's version bump and release-notes generation.
git-cliff = "2.14.2"

[env]
# Sourced by mise on every invocation inside the project (and each worktree).
# Exports PULSE_DEV_INSTANCE, PORT, PULSE_RUSTFS_API_PORT,
# PULSE_RUSTFS_CONSOLE_PORT, and PULSE_S3_ENDPOINT so multiple worktrees do
# not fight over the same TCP ports.
_.source = "{{config_root}}/mise/utilities/dev_instance_env.sh"
