[package]
name = "pulse_codec"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
name = "pulse_codec"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38", features = ["nif_version_2_16"] }
snap = "1.1"
simdutf8 = "0.1"
memchr = "2"
itoa = "1"
ryu = "1"
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
bytes = "1"
# Byte-for-byte compatible with Prometheus's `github.com/cespare/xxhash/v2`,
# which Prometheus's `labels.StableHash` uses — see src/stable_hash.rs.
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
# RE2-flavour regex, used by both the LogQL evaluator (query_filter.rs)
# and the Prometheus remote_write matcher pushdown
# (metric_segment_parquet.rs). The feature set keeps the heavier
# Unicode-case tables out of the build while retaining the DFA perf
# path and the Perl-level character classes LogQL label filters need.
regex = { version = "1", default-features = false, features = ["std", "perf-dfa", "unicode-perl"] }
# Reuse regex's already-locked parser to check nested counted repetition before
# automaton construction, without expanding Unicode classes or repetitions.
regex-syntax = { version = "0.8", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
