[package]
name = "pulse_object_store"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
name = "pulse_object_store"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38", features = ["nif_version_2_16"] }
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
once_cell = "1"
bytes = "1"
futures = "0.3"

[profile.release]
lto = true
