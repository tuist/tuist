# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Pulse releases only its own scoped commits in the monorepo.

[bump]
initial_tag = "1.39.0"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
## What's Changed

{%- if version %} in {{ version }}{%- endif -%}
<!-- RELEASE NOTES START -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  * {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor -%}
{% endfor %}

{% if version %}
    {% if previous.version %}
      **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
    {% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/tuist/tuist
{%- endmacro -%}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
    # Strip the conventional-commit prefix from the rendered line.
    { pattern = '\* (feat|fix|docs?|perf|refactor|style|test|chore|ci)(\([^)]*\))?:\s*', replace = "* " },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    # Linkify (#123) PR refs. [remote.github] is intentionally unset so
    # git-cliff makes no GitHub API calls per release.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tuist/tuist/pull/${1}))" },
]
commit_parsers = [
    { message = "^feat\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 0 -->⛰️  Features" },
    { message = "^fix\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^docs?\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test\\([^)]*\\bpulse\\b[^)]*\\)", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^[a-z]+\\([^)]+\\)", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^pulse@[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = "beta|alpha"
ignore_tags = "rc"
topo_order = false
sort_commits = "newest"
