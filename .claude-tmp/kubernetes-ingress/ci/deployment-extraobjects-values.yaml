extraObjects:
  ## map form: emitted verbatim, namespace injected
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: extra-conf-1
    data:
      extra.conf: |
        example_config_1
  ## map form: a kind with neither 'spec' nor 'data'
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: extra-sa
  ## map form: foreign Go template syntax must survive untouched
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: extra-conf-foreign
    data:
      rules.yaml: |
        - alert: Example
          expr: up == 0
          annotations:
            summary: "{{ $labels.instance }} is down"
  ## string form: opt-in templating, multiple documents
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ .Release.Name }}-extra-conf-2
    data:
      extra.conf: |
        example_config_2
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ .Release.Name }}-extra-conf-3
    data:
      extra.conf: |
        example_config_3
  ## string form: cluster-scoped object opting out of namespace injection
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: {{ .Release.Name }}-extra-clusterrole
      namespace: null
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
