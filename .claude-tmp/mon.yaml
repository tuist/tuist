apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mon-alloy-operator-alloy-manager
  labels:
    helm.sh/chart: alloy-operator-0.5.4
    app.kubernetes.io/name: alloy-operator
    app.kubernetes.io/instance: mon
    app.kubernetes.io/version: "1.7.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups:
      - collectors.grafana.com
    resources:
      - alloys
      - alloys/status
      - alloys/finalizers
    verbs:
      - create
