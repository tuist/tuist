apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: mon-grafana-cloud-traces-sampler
  namespace: default
  annotations:
    helm.sdk.operatorframework.io/uninstall-wait: "true"
spec:
  alloy:
    configMap:
      content: |-
        otelcol.receiver.otlp "sampler_receiver" {
          grpc {
            max_recv_msg_size = "20MB"
          }
  
          output {
            traces = [otelcol.processor.tail_sampling.tail_sampler.input]
          }
        }
        otelcol.processor.tail_sampling "tail_sampler" {
          // https://grafana.com/docs/alloy/latest/reference/components/otelcol.processor.tail_sampling/
  
          decision_wait = "15s"
          num_traces = 5000
          expected_new_traces_per_sec = 100
  
          policy {
            name = "errors"
            type = "status_code"
            status_code {
              status_codes = ["ERROR"]
            }
          }
  
          policy {
            name = "slow"
            type = "and"
            and {
              and_sub_policy {
                name = "slower-than-2s"
                type = "latency"
                latency {
                  threshold_ms = 2000
                }
              }
              and_sub_policy {
                name = "not-a-long-poll"
                type = "string_attribute"
                string_attribute {
                  key = "http.route"
                  values = ["^/_internal/sync/forward$", "^/_internal/backfill/entries$"]
                  enabled_regex_matching = true
                  invert_match = true
                }
              }
              and_sub_policy {
                name = "not-a-probe"
                type = "string_attribute"
                string_attribute {
                  key = "http.route"
                  values = ["^/(up|ready|metrics|status/rollout)$", "^/_internal/status$"]
                  enabled_regex_matching = true
                  invert_match = true
                }
              }
            }
          }
  
          policy {
            name = "healthy-sample"
            type = "and"
            and {
              and_sub_policy {
                name = "sample-5-percent"
                type = "probabilistic"
                probabilistic {
                  sampling_percentage = 5
                }
              }
              and_sub_policy {
                name = "not-a-probe"
                type = "string_attribute"
                string_attribute {
                  key = "http.route"
                  values = ["^/(up|ready|metrics|status/rollout)$", "^/_internal/status$"]
                  enabled_regex_matching = true
                  invert_match = true
                }
              }
            }
          }
  
          output {
            traces = [otelcol.processor.batch.grafana_cloud_traces.input]
          }
        }
  
  
  
  
        // Destination: grafana-cloud-traces (otlp)
        otelcol.processor.batch "grafana_cloud_traces" {
          timeout = "2s"
          send_batch_size = 8192
          send_batch_max_size = 0
  
          output {
            traces = [otelcol.exporter.otlp.grafana_cloud_traces.input]
          }
        }
        otelcol.exporter.otlp "grafana_cloud_traces" {
          client {
            endpoint = "tempo-prod-10-prod-eu-west-2.grafana.net:443"
            auth = otelcol.auth.basic.grafana_cloud_traces.handler
            headers = {
              "X-Scope-OrgID" = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_traces.data["tenantId"]),
            }
