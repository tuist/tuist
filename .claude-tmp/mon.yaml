          key_pem = remote.kubernetes.secret.grafana_cloud_traces.data["key"]
        }
      }
    
      retry_on_failure {
        enabled = true
        initial_interval = "5s"
        max_interval = "30s"
        max_elapsed_time = "5m"
      }
    
      sending_queue {
        enabled = true
      }
    }
    
    otelcol.auth.basic "grafana_cloud_traces" {
      username = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_traces.data["tempo-username"])
