# Source: tuist-k8s-monitoring/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-monitoring-grafana-cloud
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: k8s-monitoring-grafana-cloud
    creationPolicy: Owner
    # Grafana Cloud tokens are byte-strict — a trailing newline from a
    # manually-pasted 1Password value produces a 401 with no useful body.
    # Trim before publishing the Secret.
    template:
      engineVersion: v2
      data:
        prometheus-username: "1774467"
        prometheus-password: "{{ .PROMETHEUS_TOKEN | trim }}"
        loki-username: "986520"
        loki-password: "{{ .LOKI_TOKEN | trim }}"
        tempo-username: "980835"
        tempo-password: "{{ .TEMPO_TOKEN | trim }}"
  data:
    - secretKey: PROMETHEUS_TOKEN
      remoteRef:
        key: "PROMETHEUS_TOKEN/password"
    - secretKey: LOKI_TOKEN
      remoteRef:
        key: "LOKI_TOKEN/password"
    - secretKey: TEMPO_TOKEN
      remoteRef:
        key: "TEMPO_TOKEN/password"
