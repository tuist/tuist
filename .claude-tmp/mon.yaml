kind: ConfigMap
metadata:
  name: mon-kube-state-metrics-customresourcestate-config
  namespace: default
  labels:    
    helm.sh/chart: kube-state-metrics-7.2.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: kube-state-metrics
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: mon
    app.kubernetes.io/version: "2.18.0"
    release: mon
data:
  config.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
      - groupVersionKind:
          group: kura.tuist.dev
          kind: KuraInstance
          version: v1alpha1
        labelsFromPath:
          kurainstance:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
          region:
          - spec
          - region
          tenant_id:
          - spec
          - tenantID
        metrics:
        - each:
            gauge:
              path:
              - status
              - lastReconciledAt
            type: Gauge
          help: Unix time the controller last completed a full reconcile of this instance.
          name: kurainstance_status_last_reconciled
