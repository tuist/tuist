# Source: tuist-k8s-monitoring/charts/k8s-monitoring/templates/alloy-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mon-alloy-receiver
  namespace: default
data:
  config.alloy: |
    // Feature: Application Observability
    declare "application_observability" {
      argument "metrics_destinations" {
        comment = "Must be a list of metrics destinations where collected metrics should be forwarded to"
      }
    
      argument "logs_destinations" {
        comment = "Must be a list of log destinations where collected logs should be forwarded to"
      }
    
      argument "traces_destinations" {
        comment = "Must be a list of trace destinations where collected trace should be forwarded to"
      }
    
      // OTLP Receiver
      otelcol.receiver.otlp "receiver" {
        grpc {
          endpoint = "0.0.0.0:4317"
          include_metadata = false
          max_recv_msg_size = "4MiB"
          read_buffer_size = "512KiB"
          write_buffer_size = "32KiB"
        }
        http {
          endpoint = "0.0.0.0:4318"
          include_metadata = false
          max_request_body_size = "20MiB"
        }
        debug_metrics {
          disable_high_cardinality_metrics = true
        }
        output {
          metrics = [otelcol.processor.resourcedetection.default.input]
          logs = [otelcol.processor.resourcedetection.default.input]
          traces = [otelcol.processor.resourcedetection.default.input]
        }
      }
    
      // Resource Detection Processor
      otelcol.processor.resourcedetection "default" {
        detectors = ["env","system"]
        override = true
    
        system {
          hostname_sources = ["os"]
        }
    
        output {
          metrics = [otelcol.processor.k8sattributes.default.input]
          logs = [otelcol.processor.k8sattributes.default.input]
          traces = [otelcol.processor.k8sattributes.default.input]
        }
      }
    
      // K8s Attributes Processor
      otelcol.processor.k8sattributes "default" {
        passthrough = false
        extract {
          metadata = ["k8s.namespace.name","k8s.pod.name","k8s.deployment.name","k8s.statefulset.name","k8s.daemonset.name","k8s.cronjob.name","k8s.job.name","k8s.node.name","k8s.pod.uid","k8s.pod.start_time"]
        }
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.ip"
          }
        }
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.uid"
          }
        }
        pod_association {
          source {
            from = "connection"
          }
        }
    
        output {
          metrics = [otelcol.processor.transform.default.input]
          logs = [otelcol.processor.transform.default.input]
          traces = [otelcol.processor.transform.default.input, otelcol.connector.host_info.default.input]
        }
      }
    
      // Host Info Connector
      otelcol.connector.host_info "default" {
        host_identifiers = [ "k8s.node.name" ]
    
        output {
          metrics = [otelcol.processor.batch.default.input]
        }
      }
    
      // Transform Processor
      otelcol.processor.transform "default" {
        error_mode = "ignore"
        log_statements {
          context = "resource"
          statements = [
            "set(attributes[\"pod\"], attributes[\"k8s.pod.name\"])",
            "set(attributes[\"namespace\"], attributes[\"k8s.namespace.name\"])",
            "set(attributes[\"loki.resource.labels\"], \"cluster, namespace, job, pod\")",
          ]
        }
        trace_statements {
          context = "span"
          statements = [
           "set_semconv_span_name(\"1.37.0\", \"original_span_name\")",
          ]
        }
    
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs = [otelcol.processor.batch.default.input]
          traces = [otelcol.processor.batch.default.input]
        }
      }
    
      // Batch Processor
      otelcol.processor.batch "default" {
        send_batch_size = 8192
        send_batch_max_size = 0
        timeout = "2s"
    
        output {
          metrics = argument.metrics_destinations.value
          logs = argument.logs_destinations.value
          traces = argument.traces_destinations.value
        }
      }
    }
    application_observability "feature" {
      metrics_destinations = [
        otelcol.exporter.prometheus.grafana_cloud_metrics.input,
      ]
      logs_destinations = [
        otelcol.exporter.loki.grafana_cloud_logs.input,
      ]
      traces_destinations = [
        otelcol.processor.attributes.grafana_cloud_traces.input,
      ]
    }
    
    
    
    loki.source.api "tuist_tart_guests" {
      http {
        listen_address = "0.0.0.0"
        listen_port = 3100
      }
      forward_to = [loki.write.grafana_cloud_logs.receiver]
    }
    
    // Browser real user monitoring for tuist.dev. The Grafana Faro Web SDK
    // bundled into the server's JavaScript posts here through the tuist.dev
    // Ingress (server.faro in the tuist chart routes /-/faro/collect at
    // this port via an ExternalName Service), so the request stays
    // same-origin.
    //
    // Web vitals arrive as `kind=measurement` entries whose logfmt line
    // carries one field per vital (lcp, cls, inp, fcp, ttfb). The LCP alert
    // rules unwrap `lcp` off this stream; see alerts.md.
    faro.receiver "tuist_web" {
      server {
        listen_address = "0.0.0.0"
        listen_port = 12347
        cors_allowed_origins = ["https://tuist.dev"]
      }
    
      extra_log_labels = {
        service_name = "tuist-web",
      }
    
      output {
        logs = [loki.write.grafana_cloud_logs.receiver]
      }
    }
    // Destination: grafana-cloud-logs (loki)
    otelcol.exporter.loki "grafana_cloud_logs" {
      forward_to = [loki.write.grafana_cloud_logs.receiver]
    }
    
    loki.write "grafana_cloud_logs" {
      endpoint {
        url = "https://logs-prod-012.grafana.net/loki/api/v1/push"
        retry_on_http_429 = true
        tenant_id = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["tenantId"])
        basic_auth {
          username = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["loki-username"])
          password = remote.kubernetes.secret.grafana_cloud_logs.data["loki-password"]
        }
        tls_config {
          insecure_skip_verify = false
          ca_pem = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["ca"])
          cert_pem = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_logs.data["cert"])
          key_pem = remote.kubernetes.secret.grafana_cloud_logs.data["key"]
        }
        min_backoff_period = "500ms"
        max_backoff_period = "5m"
        max_backoff_retries = "10"
      }
      external_labels = {
        "cluster" = "tuist-production",
        "k8s_cluster_name" = "tuist-production",
        env = "production",
      }
    }
    
    remote.kubernetes.secret "grafana_cloud_logs" {
      name      = "k8s-monitoring-grafana-cloud"
      namespace = "observability"
    }
    
    
    // Destination: grafana-cloud-metrics (prometheus)
