    // annotationAutodiscovery only scrapes Ready pods: the upstream
    // feature-annotation-autodiscovery template (_pods.alloy.tpl) hardcodes
    // a __meta_kubernetes_pod_ready=true keep with no values knob to relax
    // it. So a Kura replica that is Running but still backfilling (/ready
    // 503s until the backfill readiness gate passes) goes unscraped for the
    // whole pull — exactly when its kura_backfill_* / memory metrics are
    // diagnostic. /metrics, unlike /ready, is not readiness-gated, so
    // scrape those pods here.
    //
    // Under the same job="kura" as the Ready scrape (not a separate job) so
    // existing job="kura" queries/alerts keep covering the catch-up
    // window. The ready="false" label marks the window and keeps these
    // series distinct from the Ready ones (which carry no ready label), so a
    // transient double-match at the readiness flip can't collide.
    discovery.kubernetes "tuist_kura_unready" {
      role = "pod"
      selectors {
        role = "pod"
        label = "app.kubernetes.io/name=kura"
      }
    }
    
    discovery.relabel "tuist_kura_unready" {
      targets = discovery.kubernetes.tuist_kura_unready.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_phase", "__meta_kubernetes_pod_ready"]
        separator = ";"
        regex = "Running;false"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex = "http"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label = "__address__"
        replacement = "$1:4000"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        target_label = "container"
        replacement = "kura"
      }
      rule {
        target_label = "ready"
        replacement = "false"
      }
    }
    
    prometheus.scrape "tuist_kura_unready" {
      targets = discovery.relabel.tuist_kura_unready.output
      forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
      job_name = "kura"
      scrape_interval = "60s"
      scrape_timeout = "10s"
    
      clustering {
        enabled = true
      }
    }
    
    // Regional Kura ingress controllers (`kura-<region>-ingress-nginx`).
    // They run host-network on the Kura boxes and are the only place a
    // malformed response between client and Kura shows up: status `009`
    // or `000` with a healthy upstream, or a 502 on gRPC. Kura's own
    // latency and error metrics stay clean while that happens.
    //
    // Scraped here rather than through annotationAutodiscovery so the
    // metric set can be cut to the request counter. The controller also
    // exports per-Ingress request, response and upstream histograms, and
    // every Kura instance owns two Ingresses, so its full output grows with
    // every account admitted to a region.
    discovery.kubernetes "tuist_kura_ingress_nginx" {
      role = "pod"
      namespaces {
        names = ["platform"]
      }
      selectors {
        role = "pod"
        label = "app.kubernetes.io/component=controller"
      }
    }
    
    discovery.relabel "tuist_kura_ingress_nginx" {
      targets = discovery.kubernetes.tuist_kura_ingress_nginx.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex = "kura-.+-ingress-nginx"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex = "Running"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex = "metrics"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label = "__address__"
        replacement = "$1:10254"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex = "kura-(.+)-ingress-nginx"
        target_label = "kura_gateway"
        replacement = "$1"
      }
    }
    
    prometheus.scrape "tuist_kura_ingress_nginx" {
      targets = discovery.relabel.tuist_kura_ingress_nginx.output
      forward_to = [prometheus.relabel.tuist_kura_ingress_nginx.receiver]
      job_name = "kura-ingress-nginx"
      scrape_interval = "60s"
      scrape_timeout = "10s"
    
      clustering {
        enabled = true
      }
    }
    
    prometheus.relabel "tuist_kura_ingress_nginx" {
      forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
      rule {
        source_labels = ["__name__"]
        regex = "nginx_ingress_controller_requests|up|scrape_samples_scraped"
        action = "keep"
      }
    }
    
    // Regional Kura HAProxy gateways (`kura-<region>-haproxy`), replacing
    // the nginx ones above region by region. Each Kura instance owns two
    // backends, `kura_<instance>-haproxy_http` and
    // `kura_<instance>-haproxy_grpc-h2`. Kept to the response counters and
    // the count of servers passing their /ready check, which is the
    // gateway's own view of whether an instance can serve.
    discovery.kubernetes "tuist_kura_haproxy" {
      role = "pod"
      namespaces {
        names = ["platform"]
      }
      selectors {
        role = "pod"
        label = "tuist.dev/kura-haproxy-gateway=true"
      }
    }
    
    discovery.relabel "tuist_kura_haproxy" {
      targets = discovery.kubernetes.tuist_kura_haproxy.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex = "Running"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex = "stat"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label = "__address__"
        replacement = "$1:1024"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex = "kura-(.+)-haproxy"
        target_label = "kura_gateway"
        replacement = "$1"
      }
    }
    
    prometheus.scrape "tuist_kura_haproxy" {
      targets = discovery.relabel.tuist_kura_haproxy.output
      forward_to = [prometheus.relabel.tuist_kura_haproxy.receiver]
      job_name = "kura-haproxy"
      scrape_interval = "60s"
      scrape_timeout = "10s"
    
      clustering {
        enabled = true
      }
    }
    
    prometheus.relabel "tuist_kura_haproxy" {
      forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
      rule {
        source_labels = ["__name__"]
        regex = "haproxy_backend_http_responses_total|haproxy_backend_active_servers|haproxy_frontend_http_responses_total|up|scrape_samples_scraped"
        action = "keep"
      }
    }
    // Destination: grafana-cloud-metrics (prometheus)
    otelcol.exporter.prometheus "grafana_cloud_metrics" {
      add_metric_suffixes = true
      resource_to_telemetry_conversion = false
      forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
    }
    
    prometheus.remote_write "grafana_cloud_metrics" {
      endpoint {
        url = "https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/push"
        headers = {
          "X-Scope-OrgID" = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["tenantId"]),
        }
        basic_auth {
          username = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["prometheus-username"])
          password = remote.kubernetes.secret.grafana_cloud_metrics.data["prometheus-password"]
        }
        tls_config {
          insecure_skip_verify = false
          ca_pem = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["ca"])
          cert_pem = convert.nonsensitive(remote.kubernetes.secret.grafana_cloud_metrics.data["cert"])
          key_pem = remote.kubernetes.secret.grafana_cloud_metrics.data["key"]
        }
        send_native_histograms = false
    
        queue_config {
          capacity = 10000
          min_shards = 1
          max_shards = 50
          max_samples_per_send = 2000
          batch_send_deadline = "5s"
          min_backoff = "30ms"
          max_backoff = "5s"
          retry_on_http_429 = true
          sample_age_limit = "0s"
        }
    
        write_relabel_config {
          source_labels = ["cluster"]
          regex = ""
          replacement = "tuist-production"
          target_label = "cluster"
        }
        write_relabel_config {
          source_labels = ["k8s_cluster_name"]
          regex = ""
          replacement = "tuist-production"
          target_label = "k8s_cluster_name"
        }
        // StatefulSet pod names survive replacement, but their IPs do not.
        // Normalize both Ready autodiscovery and unready Kura scrapes here,
        // including up/scrape_*; keep cluster and ready labels distinct.
        write_relabel_config {
          source_labels = ["job", "namespace", "pod"]
          separator = ";"
          regex = "kura;([^;]+);([^;]+)"
          target_label = "instance"
          replacement = "$1/$2"
          action = "replace"
        }
        write_relabel_config {
          action = "labeldrop"
          regex = "container_id|uid|pod_ip|image_id|image_spec|k8s_pod_uid"
        }
        write_relabel_config {
          source_labels = ["job"]
          regex = "integrations/(process|self)"
          action = "drop"
        }
        write_relabel_config {
          source_labels = ["cluster", "__name__"]
          separator = ";"
          regex = "tuist-(staging|canary|pentest);.+_bucket"
          action = "drop"
        }
        // Non-production keeps only what validates a deploy. Everything below
        // the `keep` list is dropped for staging, canary and pentest, which
        // together were 39% of all billed series while nothing pages on them.
        //
        // The keep list is not a judgement call: it is every metric read by an
        // alert rule that does NOT pin `cluster="tuist-production"`, so no
        // alert changes scope silently. Recover it with
        //   GET /api/v1/provisioning/alert-rules
        //   jq '[.[] | {e: ([.data[]?|.model.expr? // empty]|join(" "))}
        //        | select(.e|test("tuist-production")|not) | .e]'
        // and re-derive this regex if the alert set changes. `up` and
        // `scrape_*` are outside the dropped prefixes, so the
        // "Kura - cache telemetry missing" alert keeps its staging and canary
        // arms.
        //
        // Two alerts DO change scope, deliberately: the Phoenix route-latency
        // pair carries no cluster matcher, so staging and canary traffic has
        // been folding into what reads as a production SLO. They become
        // production-only.
        write_relabel_config {
          source_labels = ["__name__"]
          regex = "kube_(customresource_.*|job_status_failed|node_labels|node_status_allocatable|node_status_capacity|pod_container_resource_requests|pod_container_status_restarts_total|pod_info|pod_status_unschedulable|statefulset_replicas|statefulset_status_replicas_ready|deployment_spec_replicas|deployment_status_replicas_available)|kura_(node_info|node_geo_info|http_requests_total_total|artifact_reads_total_total|rocksdb_write_buffer_usage_bytes|rocksdb_write_buffer_capacity_bytes|backfill_ring_fullness_percent|memory_pressure_state)|tuist_clickhouse_.*|tuist_repo_.*|tuist_runner_cache_volume_.*|node_(filesystem_avail_bytes|filesystem_size_bytes|network_carrier_changes_total|load1)"
          target_label = "__tmp_nonprod_keep"
          replacement = "keep"
          action = "replace"
        }
        // The PN VLAN alert compares node_load1 against VLAN transmit metrics.
        // Keeping only its liveness anchor makes healthy non-production Macs
        // appear to have no VLAN. Retain one series per VLAN, not every NIC.
        write_relabel_config {
          source_labels = ["job", "__name__", "device"]
          separator = ";"
          regex = "tuist-macos-node-exporter;node_network_transmit_bytes_total;vlan.*"
          target_label = "__tmp_nonprod_keep"
          replacement = "keep"
          action = "replace"
        }
        // `hubble_*` is in the dropped set because its `source` label is a bare
        // remote address for external traffic, so its cardinality is unbounded.
        // The mis-sourced-host runbook in alerts.md that justifies keeping it
        // is production-only.
        write_relabel_config {
          source_labels = ["cluster", "__tmp_nonprod_keep", "__name__"]
          separator = ";"
          regex = "tuist-(staging|canary|pentest);;(kube_.*|kura_.*|tuist_.*|container_.*|node_.*|hubble_.*)"
          action = "drop"
        }
        write_relabel_config {
          regex = "__tmp_nonprod_keep"
          action = "labeldrop"
        }
        // Kura histograms whose buckets no dashboard or alert reads. Their
        // cardinality is pod count x `le`, so it grows with every account
        // admitted to a region. `_count` and `_sum` survive, and a pod's full
        // distribution is readable on demand from
        // /api/ops/kura/pods/:pod/metrics.
        write_relabel_config {
          source_labels = ["__name__"]
          regex = "kura_(analytics_batch_duration_seconds|artifact_egress_duration_seconds|artifact_egress_throughput_bytes_per_second|artifact_write_size_bytes|auth_backend_request_duration_seconds|auth_decision_duration_seconds|file_descriptor_wait_seconds|file_operation_duration_seconds|internal_backfill_http_request_duration_seconds|manifest_index_rebuild_duration_seconds|response_stream_wait_duration_seconds|segment_refresh_duration_seconds)_bucket"
          action = "drop"
        }
        // Kura runs one StatefulSet pod per cache node. Its public latency
        // histograms below therefore multiply every node by 17 classic
        // buckets, even though the dashboards only need an approximate
        // percentile and the count/sum series for rates and mean latency.
        // Keep every other bucket so histogram_quantile remains useful, but
        // remove alternating buckets. This takes the request families from
        // 17 to 10 buckets (and the multipart family from 15 to 8) without
        // changing labels or making duplicate remote-write series.
        //
        // kura_replication_request_duration_seconds keeps every bucket. Since
        // pull replication it only times catch-up passes (backfill_entries,
        // backfill_bodies, backfill_artifact), labelled by operation alone, so
        // it is cheap, and it is the only latency signal when a node is
        // bootstrapping or rejoining. Thinned buckets overstated its p99 by
        // 50-75%.
        write_relabel_config {
          source_labels = ["cluster", "__name__", "le"]
          separator = ";"
          regex = "tuist-production;kura_(http_request_duration_seconds|public_request_latency_seconds|multipart_upload_admission_duration_seconds)_bucket;(0.002|0.008|0.032|0.128|0.512|2.048|8.192)"
          action = "drop"
        }
        // The server's two exponential histograms grow each boundary by a
        // factor of 2 (runs) and 2.15 (HTTP client requests) across 15
        // boundaries, which is finer than any dashboard percentile needs.
        // Dropping alternating buckets keeps each one at 9 buckets (a factor
        // of about 4 and 4.6 apart) and removes roughly 2,800 production
        // series.
        // Scrapes normalize `le`, so these match the stored spelling.
        write_relabel_config {
          source_labels = ["__name__", "le"]
          separator = ";"
          regex = "tuist_runs_duration_milliseconds_bucket;(200.0|800.0|3200.0|12800.0|51200.0|204800.0|819200.0)|tuist_http_request_duration_nanoseconds_bucket;(4.3e\\+06|1.9876749e\\+07|9.1880276e\\+07|4.24716579e\\+08|1.96325239e\\+09|9.075134174e\\+09|4.1949807721e\\+10)"
          action = "drop"
        }
    
      }
    
      wal {
        truncate_frequency = "2h"
        min_keepalive_time = "5m"
        max_keepalive_time = "8h"
      }
      external_labels = {
        env = "production",
      }
    }
    
    remote.kubernetes.secret "grafana_cloud_metrics" {
      name      = "k8s-monitoring-grafana-cloud"
      namespace = "observability"
    }
