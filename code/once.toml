# Tuist Code workspace. Cargo owns the GPUI graph; native frontends share
# the Rust core without pulling GPUI or a second HTTP stack into native builds.
[workspace]
include = ["once.toml", "native-dependencies/once.toml"]
exclude = ["**/Cargo.toml"]

[modules]
paths = ["modules/*.star"]

[infrastructure.cache]
provider = "tuist"

[infrastructure.artifacts]
name = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
project = "code"

[[target]]
name = "TuistCodeDesktop"
kind = "cargo_workspace"
srcs = ["Cargo.toml", "Cargo.lock", "*/Cargo.toml", "crates/*/Cargo.toml", "gpui/src/**/*.rs", "gpui/resources/**/*", "crates/*/src/**/*.rs", "crates/*/src/**/*.txt"]

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "gpui/Cargo.toml", "crates/*/Cargo.toml"]

[target.attrs.build_script_sources."gpui_apple@0.1.0"]
"../gpui/src/scene.rs" = "gpui@0.2.2/src/scene.rs"
"../gpui/src/geometry.rs" = "gpui@0.2.2/src/geometry.rs"
"../gpui/src/color.rs" = "gpui@0.2.2/src/color.rs"
"../gpui/src/window.rs" = "gpui@0.2.2/src/window.rs"
"../gpui/src/platform.rs" = "gpui@0.2.2/src/platform.rs"

[[target]]
name = "TuistCodeCoreIOS"
kind = "rust_library"
srcs = ["crates/core/src/**/*.rs"]
deps = ["native-dependencies/IOS", "./TuistCodeOAuthIOS", "./TuistCodeJWTIOS"]
[target.attrs]
crate_name = "tuist_app_core"
cargo_package = "tuist-app-core"
crate_root = "crates/core/src/lib.rs"
edition = "2024"
target = "aarch64-apple-ios-sim"
crate_type = "staticlib"

[[target]]
name = "TuistCodeCoreIOSDevice"
kind = "rust_library"
srcs = ["crates/core/src/**/*.rs"]
deps = ["native-dependencies/IOSDevice", "./TuistCodeOAuthIOSDevice", "./TuistCodeJWTIOSDevice"]
[target.attrs]
crate_name = "tuist_app_core"
cargo_package = "tuist-app-core"
crate_root = "crates/core/src/lib.rs"
edition = "2024"
target = "aarch64-apple-ios"
crate_type = "staticlib"

[[target]]
name = "TuistCodeCoreMacOS"
kind = "rust_library"
srcs = ["crates/core/src/**/*.rs"]
deps = ["native-dependencies/Host", "./TuistCodeOAuthMacOS", "./TuistCodeJWTMacOS", "./TuistCodeCredentialsMacOS"]
[target.attrs]
crate_name = "tuist_app_core"
cargo_package = "tuist-app-core"
crate_root = "crates/core/src/lib.rs"
edition = "2024"
target = "aarch64-apple-darwin"
crate_type = "staticlib"

[[target]]
name = "TuistCodeCoreAndroid"
kind = "rust_library"
srcs = ["crates/core/src/**/*.rs"]
deps = ["native-dependencies/Android", "./TuistCodeOAuthAndroid", "./TuistCodeJWTAndroid"]
[target.attrs]
crate_name = "tuist_app_core"
cargo_package = "tuist-app-core"
crate_root = "crates/core/src/lib.rs"
edition = "2024"
target = "aarch64-linux-android"
crate_type = "cdylib"
android_abi = "arm64-v8a"
android_api = 26

[[target]]
name = "TuistCodeCoreTests"
kind = "rust_test"
srcs = ["crates/core/src/**/*.rs"]
deps = ["native-dependencies/Host", "./TuistCodeOAuth", "./TuistCodeJWT", "./TuistCodeCredentials"]
[target.attrs]
crate_name = "tuist_app_core_tests"
cargo_package = "tuist-app-core"
crate_root = "crates/core/src/lib.rs"
edition = "2024"

[[target]]
name = "TuistCodeCoreFFI"
kind = "apple_system_module"
[target.attrs]
modulemap = "crates/core/include/module.modulemap"
headers = ["crates/core/include/tuist_app.h"]
header_dirs = ["crates/core/include"]

[[target]]
name = "TuistCodeIOS"
kind = "apple_application"
srcs = ["apple/Sources/**/*.swift", "ios/Sources/**/*.swift"]
deps = ["./TuistCodeCoreIOS", "./TuistCodeCoreFFI"]
[target.attrs]
platform = "ios"
bundle_id = "dev.tuist.code"
product_name = "TuistCode"
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
info_plist_substitutions = { SUPPORTED_PLATFORM = "iPhoneSimulator", PLATFORM_NAME = "iphonesimulator" }
entitlements = "ios/Simulator.entitlements"
asset_catalogs = ["apple/Resources/Assets.xcassets"]
resources = ["apple/Resources/en.lproj/Localizable.strings", "ios/Resources/*.png"]

[[target]]
name = "TuistCodeIOSDevice"
kind = "apple_application"
srcs = ["apple/Sources/**/*.swift", "ios/Sources/**/*.swift"]
deps = ["./TuistCodeCoreIOSDevice", "./TuistCodeCoreFFI"]
[target.attrs]
platform = "ios"
bundle_id = "dev.tuist.code"
product_name = "TuistCode"
minimum_os = "17.0"
sdk_variant = "device"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
info_plist_substitutions = { SUPPORTED_PLATFORM = "iPhoneOS", PLATFORM_NAME = "iphoneos" }
asset_catalogs = ["apple/Resources/Assets.xcassets"]
resources = ["apple/Resources/en.lproj/Localizable.strings", "ios/Resources/*.png"]

[[target]]
name = "TuistCodeMacOS"
kind = "apple_application"
srcs = ["apple/Sources/**/*.swift", "macos/Sources/**/*.swift"]
deps = ["./TuistCodeCoreMacOS", "./TuistCodeCoreFFI"]
[target.attrs]
platform = "macos"
bundle_id = "dev.tuist.code"
product_name = "TuistCode"
minimum_os = "14.0"
info_plist = "macos/Info.plist"
asset_catalogs = ["apple/Resources/Assets.xcassets"]
resources = ["apple/Resources/en.lproj/Localizable.strings", "macos/Resources/AppIcon.icns"]

[[target]]
name = "TuistCodeAndroid"
kind = "android_binary"
srcs = ["android/src/**/*.kt"]
deps = ["./TuistCodeCoreAndroid", "./TuistCodeBrowser"]
[target.attrs]
application_id = "dev.tuist.code"
manifest = "android/AndroidManifest.xml"
resource_files = ["android/res/**"]
resource_dirs = ["android/res"]
compile_sdk = 36
target_sdk_version = 35
min_sdk_version = 26
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"
signing = "debug"

[[target]]
name = "TuistCodeOAuth"
kind = "rust_library"
srcs = ["crates/oauth/src/**/*.rs"]
deps = ["native-dependencies/Host"]
[target.attrs]
crate_name = "tuist_oauth"
crate_root = "crates/oauth/src/lib.rs"
cargo_package = "tuist-oauth"
edition = "2024"

[[target]]
name = "TuistCodeJWT"
