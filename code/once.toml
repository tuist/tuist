[target.attrs]
crate_name = "tuist_jwt"
crate_root = "crates/jwt/src/lib.rs"
cargo_package = "tuist-jwt"
edition = "2024"

# The macOS core shares the Tuist app's refresh lock; iOS and Android do not link it.
[[target]]
name = "TuistCodeCredentials"
kind = "rust_library"
srcs = ["crates/credentials/src/**/*.rs"]
deps = ["native-dependencies/Host"]
[target.attrs]
