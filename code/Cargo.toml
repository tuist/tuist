# Standalone workspace so the monorepo's other Cargo projects are never resolved
# here. Each member is a separate Once action: the leaf crates compile in
# parallel, and only `gpui` depends on gpui.
[workspace]
members = ["gpui", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Versions match what gpui already resolves, so these crates reuse its builds.
[workspace.dependencies]
base64 = "0.22"
getrandom = "0.3"
# Pin the UI and native AccessKit adapters together, rather than tracking main.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
# gpui's own HTTP stack (a reqwest fork); `blocking` keeps the auth crates free
# of an async runtime, and callers run them on background threads.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

tuist-credentials = { path = "crates/credentials" }
tuist-app-core = { path = "crates/core" }
tuist-jwt = { path = "crates/jwt" }
tuist-navigation = { path = "crates/navigation" }
tuist-oauth = { path = "crates/oauth" }
tuist-session = { path = "crates/session" }
tuist-updater = { path = "crates/updater" }
