[tools]
"github:tuist/once" = "0.81.1"
rust = "1.98.1"
jq = "1.8.1"
yq = "4.52.5"
kotlin = "2.4.10"
# Signed device and macOS preview publication only; CI installs them only in those jobs.
"1password-cli" = "2.32.0"
tuist = "4.216.6"

# Desktop tool installation must not run the monorepo's CLI bootstrap hook.
[hooks]
postinstall = "true"

[tasks."prepare:native"]
description = "Derive locked portable Rust dependencies for Once"
run = "python3 prepare-native.py"

[tasks."prepare:android"]
description = "Materialize checksum-locked Android browser libraries"
run = "python3 android/dependencies.py prepare"

[tasks.build]
depends = ["prepare:native"]
description = "Build the desktop app for the host"
run = "once build TuistCodeDesktop"

[tasks.run]
depends = ["prepare:native"]
description = "Build and launch the desktop app"
run = "once run cargo_tuist_desktop_bin_TuistCode"

[tasks.test]
depends = ["prepare:native"]
description = "Test the desktop crates and shared mobile route contract"
run = ["git diff --no-index --exit-code -- ../app/Fixtures/Navigation/routes.json crates/navigation/src/routes.json", "once test --all"]

[tasks.check]
depends = ["prepare:native"]
description = "Validate the graph and check formatting and Clippy warnings"
run = ["once query validate-workspace", "cargo fmt --all -- --check", "cargo clippy --locked --workspace --all-targets -- -D warnings"]

[tasks."build:ios"]
depends = ["prepare:native"]
description = "Build the Tuist Code iOS simulator app"
run = "once build TuistCodeIOS"

[tasks."build:ios-device"]
depends = ["prepare:native"]
description = "Build the ad-hoc signed iOS device app; bundle:ios-device signs an installable copy"
run = "once build TuistCodeIOSDevice"

# No build dependency: signing secrets must never be present while code builds or tools install.
[tasks."bundle:ios-device"]
description = "Sign a copy of the built device app with the Tuist Code ad-hoc profile and package an IPA (needs 1Password access)"
run = "bash ios/distribution/bundle.sh"

[tasks."build:macos"]
depends = ["prepare:native"]
description = "Build the Tuist Code macOS app"
run = "once build TuistCodeMacOS"

[tasks."build:android"]
depends = ["prepare:native", "prepare:android"]
description = "Build the Tuist Code Android debug APK"
run = ["once build TuistCodeAndroid", "python3 android/dependencies.py verify \"$ANDROID_HOME/build-tools/35.0.0/aapt2\" .once/out/TuistCodeBrowser/R.txt .once/out/TuistCodeAndroid/TuistCodeAndroid.apk"]

[tasks."test:core"]
depends = ["prepare:native"]
description = "Test the shared native frontend contract without GPUI"
run = "once test TuistCodeCoreTests"

[tasks."preview:ios"]
depends = ["prepare:native"]
description = "Publish an internal iOS simulator preview to tuist/code"
run = "once artifact publish TuistCodeIOS --track internal"

[tasks."preview:ios-device"]
description = "Publish the signed iOS device IPA to tuist/code's internal track"
# CI exchanges its GitHub OIDC token; local runs reuse an existing `tuist auth login`.
run = 'if [ "${CI:-}" = true ]; then tuist auth login; fi; tuist share delivery/ios-device/TuistCode.ipa --track internal'

# No build dependency: signing secrets must never be present while code builds or tools install.
[tasks."bundle:macos"]
description = "Sign a copy of the built macOS app with Tuist's Developer ID and notarize it (needs 1Password access)"
run = "bash macos/distribution/bundle.sh"

[tasks."preview:macos"]
description = "Publish the Developer ID signed macOS app to tuist/code's internal track"
# A stable signature lets macOS remember Keychain access to the Tuist app's session.
run = 'if [ "${CI:-}" = true ]; then tuist auth login; fi; tuist share delivery/macos/TuistCode.app --track internal'

[tasks."preview:android"]
depends = ["build:android"]
description = "Publish an internal Android debug preview to tuist/code"
run = "once artifact publish TuistCodeAndroid --track internal"
