crate_name = "tuist_jwt"
crate_root = "crates/jwt/src/lib.rs"
cargo_package = "tuist-jwt"
edition = "2024"
target = "aarch64-apple-ios-sim"

[[target]]
name = "LuftOAuthIOSDevice"
kind = "rust_library"
srcs = ["crates/oauth/src/**/*.rs"]
deps = ["native-dependencies/IOSDevice"]
[target.attrs]
crate_name = "tuist_oauth"
crate_root = "crates/oauth/src/lib.rs"
cargo_package = "tuist-oauth"
edition = "2024"
target = "aarch64-apple-ios"

[[target]]
name = "LuftJWTIOSDevice"
kind = "rust_library"
srcs = ["crates/jwt/src/**/*.rs"]
deps = ["native-dependencies/IOSDevice"]
[target.attrs]
crate_name = "tuist_jwt"
crate_root = "crates/jwt/src/lib.rs"
cargo_package = "tuist-jwt"
edition = "2024"
target = "aarch64-apple-ios"

[[target]]
name = "LuftOAuthMacOS"
kind = "rust_library"
srcs = ["crates/oauth/src/**/*.rs"]
deps = ["native-dependencies/Host"]
[target.attrs]
crate_name = "tuist_oauth"
crate_root = "crates/oauth/src/lib.rs"
cargo_package = "tuist-oauth"
edition = "2024"
target = "aarch64-apple-darwin"

[[target]]
name = "LuftJWTMacOS"
kind = "rust_library"
srcs = ["crates/jwt/src/**/*.rs"]
deps = ["native-dependencies/Host"]
[target.attrs]
crate_name = "tuist_jwt"
crate_root = "crates/jwt/src/lib.rs"
cargo_package = "tuist-jwt"
edition = "2024"
target = "aarch64-apple-darwin"

[[target]]
name = "LuftOAuthAndroid"
kind = "rust_library"
srcs = ["crates/oauth/src/**/*.rs"]
deps = ["native-dependencies/Android"]
[target.attrs]
crate_name = "tuist_oauth"
crate_root = "crates/oauth/src/lib.rs"
