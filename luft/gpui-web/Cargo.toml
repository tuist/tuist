[package]
name = "luft-gpui-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Spike: the GPUI views in the browser through Zed's gpui_web, drawn into one
# canvas. Single-threaded, so it builds on stable Rust and needs no
# cross-origin isolation.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1"
gpui.workspace = true
gpui_platform.workspace = true
tuist-app-core.workspace = true
wasm-bindgen = "=0.2.130"
getrandom = { workspace = true, features = ["wasm_js"] }
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
