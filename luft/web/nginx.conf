# Serves the Luft web edge's static build. Installed as conf.d/default.conf,
# inside the base image's http block.
#
# Cloudflare sits in front and caches by these headers: hashed files under
# /assets/ are immutable, other files briefly, and the HTML shell is
# revalidated so a deploy is visible immediately. Errors carry no
# Cache-Control (add_header without `always`), so they are never cached long.

map $uri $luft_cache_control {
    ~^/assets/    "public, max-age=31536000, immutable";
    /index.html   "no-cache";
    default       "public, max-age=300";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind Cloudflare and ingress-nginx, keep redirects relative instead of
    # naming this container's host and port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    add_header Cache-Control $luft_cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing build files are 404s, never the HTML shell under a script URL.
    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # Client-side routes fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
