# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[bump]
initial_tag = "0.1.0"

[changelog]
header = """
# Changelog

All notable changes to Once will be documented in this file.
"""
body = """
## What's Changed{% if version %} in {{ version }}{% endif %}
<!-- RELEASE NOTES START -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  * {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor -%}
{% endfor %}

{% if version %}
    {% if previous.version %}
      **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
    {% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/tuist/tuist
{%- endmacro -%}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
    { pattern = '\* (feat|fix|docs?|perf|refactor|style|test|chore|ci)(\([^)]*\))?:\s*', replace = "* " },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    # Linkify (#123) PR refs straight from commit messages.
    # [remote.github] is intentionally unset so git-cliff makes no GitHub API
    # calls per release (each would paginate the whole repo's commits+PRs).
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tuist/tuist/pull/${1}))" },
]
# Matched by type only. `--include-path once/**/*` is what decides whether a
# commit belongs to Once; requiring the scope to say `once` as well would drop
# commits that changed once/** under another scope. See kura/cliff.toml for
# the same reasoning applied to the kura component.
commit_parsers = [
    { message = "^feat[(:!]", group = "<!-- 0 -->✨ Features" },
    { message = "^fix[(:!]", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor[(:!]", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^docs?[(:!]", group = "<!-- 3 -->📚 Documentation" },
    { message = "^test[(:!]", group = "<!-- 4 -->🧪 Testing" },
    { message = "^perf[(:!]", group = "<!-- 5 -->⚡ Performance" },
    { message = "^style[(:!]", group = "<!-- 6 -->🎨 Styling" },
    { message = "^chore[(:!]", skip = true },
    { message = "^ci[(:!]", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^once@[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = "beta|alpha|rc"
sort_commits = "newest"
