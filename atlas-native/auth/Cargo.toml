[package]
name = "atlas-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
