[package]
name = "atlas-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "=0.103.16", features = ["ring"] }
webpki-roots = "=1.0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
rustls-pemfile = "2"
rcgen = "0.14"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
