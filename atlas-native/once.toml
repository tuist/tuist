[workspace]
include = ["once.toml"]
exclude = ["**/Cargo.toml"]

[infrastructure.cache]
provider = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
project = "atlas-mobile"

[[target]]
name = "AtlasAuthDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthIOSDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-apple-ios-sim"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthAndroidDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-linux-android"
build_script_tools = ["aarch64-linux-android-clang", "clang", "llvm-ar"]
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthIOS"
kind = "rust_library"
srcs = ["auth/src/lib.rs", "auth/src/bridge.rs", "auth/src/transport.rs", "auth/src/accounts.rs", "auth/src/time_off.rs"]
deps = ["./AtlasAuthIOSDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
target = "aarch64-apple-ios-sim"
crate_type = "staticlib"

[[target]]
name = "AtlasAuthAndroid"
kind = "rust_library"
srcs = ["auth/src/lib.rs", "auth/src/bridge.rs", "auth/src/transport.rs", "auth/src/accounts.rs", "auth/src/time_off.rs"]
deps = ["./AtlasAuthAndroidDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
target = "aarch64-linux-android"
crate_type = "cdylib"
android_abi = "arm64-v8a"
android_api = 26

[[target]]
name = "AtlasAuthFFI"
kind = "apple_system_module"

[target.attrs]
modulemap = "auth/include/module.modulemap"
headers = ["auth/include/atlas_auth.h"]
header_dirs = ["auth/include"]

[[target]]
name = "AtlasAuthTests"
kind = "rust_test"
srcs = ["auth/src/**/*.rs"]
deps = ["./AtlasAuthDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasCore"
kind = "rust_mobile_library"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core"
crate_root = "core/src/lib.rs"
edition = "2024"
apple_target = "aarch64-apple-ios-sim"
android_target = "aarch64-linux-android"
android_abi = "arm64-v8a"
android_api = 26

[[target]]
name = "AtlasCoreHost"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core"
crate_root = "core/src/lib.rs"
edition = "2024"

[[target]]
name = "AtlasCLI"
kind = "rust_binary"
srcs = ["cli/src/**/*.rs"]
deps = ["./AtlasCoreHost"]

[target.attrs]
crate_name = "atlas"
crate_root = "cli/src/main.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasCLITests"
kind = "rust_test"
srcs = ["cli/src/**/*.rs"]
deps = ["./AtlasCoreHost"]

[target.attrs]
crate_name = "atlas_cli_tests"
crate_root = "cli/src/main.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasCoreTests"
kind = "rust_test"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core_tests"
crate_root = "core/src/lib.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasSwiftLint"
kind = "swiftlint_lint"
srcs = ["ios/Sources/**/*.swift", "ios/Tests/**/*.swift"]

[target.attrs]
config = ["ios/.swiftlint.yml"]
args = ["--strict"]

[[target]]
name = "AtlasCoreFFI"
kind = "apple_system_module"

[target.attrs]
modulemap = "core/include/module.modulemap"
headers = ["core/include/atlas_core.h"]
header_dirs = ["core/include"]

[[target]]
name = "AtlasAndroid"
kind = "android_binary"
srcs = ["android/src/**/*.kt"]
deps = ["./AtlasCore", "./AtlasAuthAndroid"]

[target.attrs]
application_id = "dev.tuist.atlas"
manifest = "android/AndroidManifest.xml"
resource_files = ["android/res/**"]
resource_dirs = ["android/res"]
compile_sdk = 35
target_sdk_version = 35
min_sdk_version = 26
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"
signing = "debug"

[[target]]
name = "AtlasIOS"
kind = "apple_application"
srcs = ["ios/Sources/**/*.swift"]
deps = ["./AtlasCore", "./AtlasAuthIOS", "./AtlasCoreFFI", "./AtlasAuthFFI"]

[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security"]
bundle_id = "dev.tuist.atlas"
product_name = "Atlas"
asset_catalogs = ["ios/Resources/Assets.xcassets"]
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
entitlements = "ios/AtlasSimulator.entitlements"

[[target]]
name = "AtlasIOSTests"
kind = "apple_test_bundle"
srcs = ["ios/Tests/**/*.swift", "ios/Sources/AtlasCore.swift", "ios/Sources/AtlasAuthentication.swift", "ios/Sources/AtlasSecureStorage.swift", "ios/Sources/AtlasAIAccounts.swift", "ios/Sources/AtlasTimeOff.swift"]
deps = ["./AtlasCore", "./AtlasAuthIOS", "./AtlasCoreFFI", "./AtlasAuthFFI"]

[target.attrs]
platform = "ios"
minimum_os = "17.0"
sdk_variant = "simulator"
bundle_id = "dev.tuist.atlas.tests"
sdk_frameworks = ["AuthenticationServices", "Security"]
swift_testing = true

[[target]]
name = "AtlasSettingsIOSPreview"
kind = "apple_application"
srcs = ["previews/ios/**/*.swift", "ios/Sources/AtlasAIAccounts.swift", "ios/Sources/AtlasAIAccountViews.swift", "ios/Sources/AtlasBrand.swift", "ios/Sources/AtlasAuthentication.swift", "ios/Sources/AtlasSecureStorage.swift", "ios/Sources/AtlasTimeOff.swift", "ios/Sources/AtlasTimeOffView.swift", "ios/Sources/AtlasCore.swift", "ios/Sources/AtlasWorkspaceView.swift"]
deps = ["./AtlasAuthIOS", "./AtlasAuthFFI", "./AtlasCore", "./AtlasCoreFFI"]

[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security"]
bundle_id = "dev.tuist.atlas.settings-preview"
product_name = "AtlasSettingsPreview"
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
info_plist = "previews/ios/Info.plist"

[[target]]
name = "AtlasSettingsUITests"
kind = "apple_test_bundle"
srcs = ["previews/tests/**/*.swift"]
deps = ["./AtlasSettingsIOSPreview"]

[target.attrs]
platform = "ios"
minimum_os = "17.0"
sdk_variant = "simulator"
bundle_id = "dev.tuist.atlas.settings-uitests"
ui_testing = true

[[target]]
name = "AtlasSettingsAndroidPreview"
kind = "android_binary"
srcs = ["previews/android/**/*.kt", "android/src/dev/tuist/atlas/AtlasAIAccountsScreen.kt", "android/src/dev/tuist/atlas/AtlasAIAccountsModel.kt", "android/src/dev/tuist/atlas/AtlasAuthentication.kt", "android/src/dev/tuist/atlas/AtlasTimeOffModel.kt", "android/src/dev/tuist/atlas/AtlasTimeOffScreen.kt", "android/src/dev/tuist/atlas/AtlasCore.kt", "android/src/dev/tuist/atlas/AtlasWorkspaceModel.kt", "android/src/dev/tuist/atlas/AtlasWorkspaceScreen.kt"]
deps = ["./AtlasAuthAndroid", "./AtlasCore"]

[target.attrs]
application_id = "dev.tuist.atlas.preview"
manifest = "previews/android/AndroidManifest.xml"
resource_files = ["android/res/**"]
resource_dirs = ["android/res"]
compile_sdk = 35
target_sdk_version = 35
min_sdk_version = 26
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = "dev.tuist.atlas.preview.SettingsPreviewActivity"
signing = "debug"
