postbuild_actions = ['{"id":"embed-live-activity","argv":["/bin/bash","modules/embed-widget.sh",".once/out/AtlasSettingsIOSPreview/AtlasLiveActivity.appex",".once/out/AtlasSettingsIOSPreview/AtlasSettingsPreview.app/PlugIns/AtlasLiveActivity.appex"],"inputs":["modules/embed-widget.sh",".once/out/AtlasSettingsIOSPreview/AtlasLiveActivity.appex"],"outputs":[".once/out/AtlasSettingsIOSPreview/AtlasSettingsPreview.app/PlugIns/AtlasLiveActivity.appex"],"cacheable":true}']
