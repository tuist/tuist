[workspace]
include = ["once.toml"]
exclude = ["**/Cargo.toml"]

[modules]
paths = ["modules/*.star"]

[infrastructure.cache]
provider = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
project = "atlas-mobile"

[[target]]
name = "AtlasAuthDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthIOSDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-apple-ios-sim"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthIOSDeviceDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-apple-ios"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthAndroidDependencies"
kind = "cargo_dependencies"

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-linux-android"
build_script_tools = ["aarch64-linux-android-clang", "clang", "llvm-ar"]
resolver_inputs = ["Cargo.toml", "Cargo.lock", "auth/Cargo.toml", "core/Cargo.toml", "cli/Cargo.toml"]

[[target]]
name = "AtlasAuthIOS"
kind = "rust_library"
srcs = ["auth/src/lib.rs", "auth/src/bridge.rs", "auth/src/transport.rs", "auth/src/api.rs", "auth/src/form.rs", "auth/src/accounts.rs", "auth/src/time_off.rs", "auth/src/business.rs", "auth/src/presence.rs", "auth/src/themes.rs", "auth/src/push.rs", "auth/src/orbit_activity.rs", "auth/src/orbit.rs", "auth/src/orbit_live.rs", "auth/src/orbit_session.rs", "auth/src/orbit_components.rs"]
deps = ["./AtlasAuthIOSDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
target = "aarch64-apple-ios-sim"
crate_type = "staticlib"

[[target]]
name = "AtlasAuthIOSDevice"
kind = "rust_library"
srcs = ["auth/src/lib.rs", "auth/src/bridge.rs", "auth/src/transport.rs", "auth/src/api.rs", "auth/src/form.rs", "auth/src/accounts.rs", "auth/src/time_off.rs", "auth/src/business.rs", "auth/src/presence.rs", "auth/src/themes.rs", "auth/src/push.rs", "auth/src/orbit_activity.rs", "auth/src/orbit.rs", "auth/src/orbit_live.rs", "auth/src/orbit_session.rs", "auth/src/orbit_components.rs"]
deps = ["./AtlasAuthIOSDeviceDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
target = "aarch64-apple-ios"
crate_type = "staticlib"

[[target]]
name = "AtlasAuthAndroid"
kind = "rust_library"
srcs = ["auth/src/lib.rs", "auth/src/bridge.rs", "auth/src/transport.rs", "auth/src/api.rs", "auth/src/form.rs", "auth/src/accounts.rs", "auth/src/time_off.rs", "auth/src/business.rs", "auth/src/presence.rs", "auth/src/themes.rs", "auth/src/push.rs", "auth/src/orbit_activity.rs", "auth/src/orbit.rs", "auth/src/orbit_live.rs", "auth/src/orbit_session.rs", "auth/src/orbit_components.rs"]
deps = ["./AtlasAuthAndroidDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
target = "aarch64-linux-android"
crate_type = "cdylib"
android_abi = "arm64-v8a"
android_api = 26

[[target]]
name = "AtlasAuthFFI"
kind = "apple_system_module"

[target.attrs]
modulemap = "auth/include/module.modulemap"
headers = ["auth/include/atlas_auth.h"]
header_dirs = ["auth/include"]

[[target]]
name = "AtlasAuthTests"
kind = "rust_test"
srcs = ["auth/src/**/*.rs"]
deps = ["./AtlasAuthDependencies"]

[target.attrs]
crate_name = "atlas_auth"
crate_root = "auth/src/lib.rs"
cargo_package = "atlas-auth"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasCore"
kind = "rust_mobile_library"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core"
crate_root = "core/src/lib.rs"
edition = "2024"
apple_target = "aarch64-apple-ios-sim"
android_target = "aarch64-linux-android"
android_abi = "arm64-v8a"
android_api = 26

[[target]]
name = "AtlasCoreIOSDevice"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core"
crate_root = "core/src/lib.rs"
edition = "2024"
target = "aarch64-apple-ios"
crate_type = "staticlib"

[[target]]
name = "AtlasCoreHost"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core"
crate_root = "core/src/lib.rs"
edition = "2024"

[[target]]
name = "AtlasCLI"
kind = "rust_binary"
srcs = ["cli/src/**/*.rs"]
deps = ["./AtlasCoreHost"]

[target.attrs]
crate_name = "atlas"
crate_root = "cli/src/main.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasCLITests"
kind = "rust_test"
srcs = ["cli/src/**/*.rs"]
deps = ["./AtlasCoreHost"]

[target.attrs]
crate_name = "atlas_cli_tests"
crate_root = "cli/src/main.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasCoreTests"
kind = "rust_test"
srcs = ["core/src/**/*.rs"]

[target.attrs]
crate_name = "atlas_core_tests"
crate_root = "core/src/lib.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "AtlasSwiftLint"
kind = "swiftlint_lint"
srcs = ["ios/Sources/**/*.swift", "ios/Tests/**/*.swift", "ios/LiveActivity/**/*.swift"]

[target.attrs]
config = ["ios/.swiftlint.yml"]
args = ["--strict"]

[[target]]
name = "AtlasCoreFFI"
kind = "apple_system_module"

[target.attrs]
modulemap = "core/include/module.modulemap"
headers = ["core/include/atlas_core.h"]
header_dirs = ["core/include"]

[[target]]
name = "AtlasFirebase"
kind = "atlas_firebase"
srcs = ["android/AndroidManifest.xml", "android/res/**/*", "android/push/resources.py", "android/push/dependencies.lock.json"]

[[target]]
name = "AtlasAndroid"
kind = "android_binary"
srcs = ["android/src/**/*.kt"]
deps = ["./AtlasCore", "./AtlasAuthAndroid", "./AtlasNSHAndroid", "./AtlasFirebase"]

[target.attrs]
asset_dirs = ["cards/assets"]
assets = ["cards/assets/**"]
application_id = "dev.tuist.atlas"
manifest = "android/AndroidManifest.xml"
resource_files = ["android/res/**"]
resource_dirs = ["android/res"]
compile_sdk = 35
target_sdk_version = 35
min_sdk_version = 26
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"
signing = "debug"

[[target]]
name = "AtlasSimulatorSDK"
kind = "atlas_apple_sdk"

[target.attrs]
sdk = "iphonesimulator"

[[target]]
name = "AtlasDeviceSDK"
kind = "atlas_apple_sdk"

[target.attrs]
sdk = "iphoneos"

[[target]]
name = "AtlasNSHSimulator"
kind = "atlas_nsh_apple"
[target.attrs]
sdk = "simulator"

[[target]]
name = "AtlasNSHDevice"
kind = "atlas_nsh_apple"
[target.attrs]
sdk = "device"

[[target]]
name = "AtlasNSHAndroid"
kind = "atlas_nsh_android"

[[target]]
name = "AtlasLiveActivitySimulator"
kind = "atlas_widget_extension"
srcs = ["ios/LiveActivity/*.swift"]

[target.attrs]
sdk_variant = "simulator"
bundle_id = "dev.tuist.atlas.live-activity"
info_plist = "ios/LiveActivity/Info.plist"

[[target]]
name = "AtlasLiveActivityDevice"
kind = "atlas_widget_extension"
srcs = ["ios/LiveActivity/*.swift"]

[target.attrs]
sdk_variant = "device"
bundle_id = "dev.tuist.atlas.live-activity"
info_plist = "ios/LiveActivity/Info.plist"

[[target]]
name = "AtlasLiveActivityPreview"
kind = "atlas_widget_extension"
srcs = ["ios/LiveActivity/*.swift"]

[target.attrs]
sdk_variant = "simulator"
bundle_id = "dev.tuist.atlas.settings-preview.live-activity"
info_plist = "ios/LiveActivity/Info.plist"

[[target]]
name = "AtlasIOS"
kind = "apple_application"
srcs = ["ios/Sources/**/*.swift", "ios/LiveActivity/AtlasActivityAttributes.swift"]
deps = ["./AtlasCore", "./AtlasAuthIOS", "./AtlasCoreFFI", "./AtlasAuthFFI", "./AtlasSimulatorSDK", "./AtlasNSHSimulator", "./AtlasLiveActivitySimulator"]

[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security", "Charts", "SafariServices", "UserNotifications", "AVFoundation", "Speech", "PhotosUI", "QuickLook", "ImageIO", "CoreTransferable", "UniformTypeIdentifiers", "ActivityKit"]
postbuild_actions = ['{"id":"embed-live-activity","argv":["/bin/bash","modules/embed-widget.sh",".once/out/AtlasIOS/AtlasLiveActivity.appex",".once/out/AtlasIOS/Atlas.app/PlugIns/AtlasLiveActivity.appex"],"inputs":["modules/embed-widget.sh",".once/out/AtlasIOS/AtlasLiveActivity.appex"],"outputs":[".once/out/AtlasIOS/Atlas.app/PlugIns/AtlasLiveActivity.appex"],"cacheable":true}']
bundle_id = "dev.tuist.atlas"
product_name = "Atlas"
asset_catalogs = ["ios/Resources/Assets.xcassets"]
app_icon = "AppIcon"
resources = ["ios/Resources/Assets.xcassets/AppIcon.appiconset/*.png", "cards/assets/nsh/*"]
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
info_plist_substitutions = { ATLAS_SUPPORTED_PLATFORM = "iPhoneSimulator", ATLAS_PLATFORM_NAME = "iphonesimulator", ATLAS_PUSH_ENVIRONMENT = "development" }
entitlements = "ios/AtlasSimulator.entitlements"

[[target]]
name = "AtlasIOSDevice"
kind = "apple_application"
srcs = ["ios/Sources/**/*.swift", "ios/LiveActivity/AtlasActivityAttributes.swift"]
deps = ["./AtlasCoreIOSDevice", "./AtlasAuthIOSDevice", "./AtlasCoreFFI", "./AtlasAuthFFI", "./AtlasDeviceSDK", "./AtlasNSHDevice", "./AtlasLiveActivityDevice"]

[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security", "Charts", "SafariServices", "UserNotifications", "AVFoundation", "Speech", "PhotosUI", "QuickLook", "ImageIO", "CoreTransferable", "UniformTypeIdentifiers", "ActivityKit"]
postbuild_actions = ['{"id":"embed-live-activity","argv":["/bin/bash","modules/embed-widget.sh",".once/out/AtlasIOSDevice/AtlasLiveActivity.appex",".once/out/AtlasIOSDevice/Atlas.app/PlugIns/AtlasLiveActivity.appex"],"inputs":["modules/embed-widget.sh",".once/out/AtlasIOSDevice/AtlasLiveActivity.appex"],"outputs":[".once/out/AtlasIOSDevice/Atlas.app/PlugIns/AtlasLiveActivity.appex"],"cacheable":true}']
bundle_id = "dev.tuist.atlas"
product_name = "Atlas"
asset_catalogs = ["ios/Resources/Assets.xcassets"]
app_icon = "AppIcon"
resources = ["ios/Resources/Assets.xcassets/AppIcon.appiconset/*.png", "cards/assets/nsh/*"]
minimum_os = "17.0"
sdk_variant = "device"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
info_plist_substitutions = { ATLAS_SUPPORTED_PLATFORM = "iPhoneOS", ATLAS_PLATFORM_NAME = "iphoneos", ATLAS_PUSH_ENVIRONMENT = "unconfigured" }

[[target]]
name = "AtlasIOSTests"
kind = "apple_test_bundle"
srcs = ["ios/Tests/**/*.swift", "ios/Sources/AtlasAutomationModels.swift", "ios/Sources/AtlasNavigation.swift", "ios/Sources/AtlasCore.swift", "ios/Sources/AtlasAuthentication.swift", "ios/Sources/AtlasSecureStorage.swift", "ios/Sources/AtlasAIAccounts.swift", "ios/Sources/AtlasTimeOff.swift", "ios/Sources/AtlasBusiness.swift", "ios/Sources/AtlasPresence.swift", "ios/Sources/AtlasAppearance.swift", "ios/Sources/AtlasPushNotifications.swift", "ios/Sources/AtlasOrbitLiveActivity.swift", "ios/LiveActivity/AtlasActivityAttributes.swift", "ios/Sources/AtlasOrbit.swift", "ios/Sources/AtlasThreadModels.swift", "ios/Sources/AtlasThreadScrollState.swift", "ios/Sources/AtlasVoiceInput.swift", "ios/Sources/AtlasMarkdown.swift", "ios/Sources/AtlasPipView.swift", "ios/Sources/AtlasThreadAttachments.swift", "ios/Sources/AtlasProfile.swift"]
deps = ["./AtlasCore", "./AtlasAuthIOS", "./AtlasCoreFFI", "./AtlasAuthFFI"]

[target.attrs]
platform = "ios"
minimum_os = "17.0"
sdk_variant = "simulator"
bundle_id = "dev.tuist.atlas.tests"
sdk_frameworks = ["AuthenticationServices", "Security", "UserNotifications", "AVFoundation", "Speech", "PhotosUI", "QuickLook", "ImageIO", "CoreTransferable", "UniformTypeIdentifiers", "ActivityKit"]
swift_testing = true

