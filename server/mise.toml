[env]
_.source = "{{config_root}}/../mise/utilities/dev_instance_env.sh"
TUIST_SECRET_KEY_BASE = "rpux4+W/oBey0drSFOctyIbppOG2A9VUUuTMC1WaM8xZgYxA6gg4yryG/LkOoqkj"
# Stripe price IDs for local dev (test-mode identifiers, not secrets — the keys
# come from fnox/1Password). Environment.stripe_prices/1 reads TUIST_STRIPE_PRICES
# The `runners` map mirrors the managed envs: a macOS Price whose first tier
# covers the free allowance, a Linux Price whose first tier covers its own,
# and cache volume storage left empty until its Meter is provisioned.
# as a JSON string; dev has no chart to render it, so it's inlined here.
TUIST_STRIPE_PRICES = '{"air":{"usage":["price_1PVY2kLWue9IBlPSHCmPX1jp"],"flat_monthly":["price_1PVY21LWue9IBlPSLksRxRos"]},"pro":{"usage":["price_1QMtp7LWue9IBlPSImRePMKa"],"flat_monthly":["price_1QMtzQLWue9IBlPSoRg6kBhr"]},"enterprise":{"flat_monthly":["price_1PWfxuLWue9IBlPSDbc3osiV"],"flat_yearly":[]},"runners":{"runner_linux_compute_unit_milliseconds":"price_1UXk4dLWue9IBlPSSH4N7zOc","runner_macos_compute_unit_milliseconds":"price_1UY5SkLWue9IBlPSODMANgCf","runner_cache_volume_megabyte_months":""},"retired_runners":{"runner_macos_compute_unit_milliseconds":["price_1UXNzRLWue9IBlPS6C8HSgAO"]},"usage_meters":{"cache_egress_megabytes":"price_1UUl2sLWue9IBlPSoYt4ICsM","cache_requests":"price_1UISgOLWue9IBlPSA1FagFUz","passing_test_cases":"price_1UISgPLWue9IBlPSV8Z7plhm"}}'

[hooks]
  postinstall = "{{config_root}}/mise/tasks/install.sh"
  enter = { task = "clickhouse:start" }

[tools]
  # Injects dev-only secrets (e.g. the license) from 1Password at runtime via
  # `fnox exec` in the dev task — see server/fnox.toml. Installed for everyone,
  # but the dev task only invokes it when 1Password access is present, so
  # contributors without a 1Password account still run the server locally.
  fnox = "latest"
  aube = "1.6.2"
  node = "24.11.0"
  sops = "3.9.3"
  age = "1.2.1"
  trivy = "0.69.3"
  helm = "3.16.3"
  kubectl = "1.31.3"
  "npm:prettier" = "3.4.2"
  "npm:appium" = "3.0.1"

[tools."github:minio/minio"]
version = "2025-09-07T16-13-09Z"
version_prefix = "RELEASE."
bin = "minio"

[tools."github:minio/minio".platforms]
macos-arm64 = { asset_pattern = "minio.darwin-arm64.RELEASE.*Z" }
macos-x64 = { asset_pattern = "minio.darwin-amd64.RELEASE.*Z" }
linux-x64 = { asset_pattern = "minio.linux-amd64.RELEASE.*Z" }
linux-arm64 = { asset_pattern = "minio.linux-arm64.RELEASE.*Z" }

# Chrome for Testing renders Open Graph images in dev. Google Chrome clones its
# whole app bundle on every launch and only deletes the clone on a clean exit,
# which the browser pool's kill never gives it; Chrome for Testing has no clone.
[tools."http:chrome-for-testing"]
version = "157.0.8103.38"
os = ["macos"]
strip_components = 1
bin_path = "Google Chrome for Testing.app/Contents/MacOS"

[tools."http:chrome-for-testing".platforms]
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/mac-arm64/chrome-mac-arm64.zip" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/mac-x64/chrome-mac-x64.zip" }

[tools."github:ClickHouse/ClickHouse"]
version = "26.1.2.11-stable"
version_prefix = "v"

[tools."github:ClickHouse/ClickHouse".platforms]
macos-arm64 = { asset_pattern = "clickhouse-macos-aarch64" }
macos-x64 = { asset_pattern = "clickhouse-macos" }
linux-x64 = { asset_pattern = "clickhouse-common-static-*-amd64.tgz" }
linux-arm64 = { asset_pattern = "clickhouse-common-static-*-arm64.tgz" }
