syntax = "proto3";
package once.events.v1;

service RunEventService {
  rpc GetServerCapabilities(GetServerCapabilitiesRequest) returns (ServerCapabilities);
  rpc GetArgvHashKey(GetArgvHashKeyRequest) returns (ArgvHashKey);
  rpc PublishRunEvents(stream RunEventBatch) returns (stream BatchAck);
  rpc GetRunAck(GetRunAckRequest) returns (RunEventAck);
}

message GetServerCapabilitiesRequest {}
message GetRunAckRequest { string run_id = 1; }
message GetArgvHashKeyRequest { string project_id = 1; }

message ServerCapabilities {
  repeated string supported_protocol_versions = 1;
  uint32 max_batch_bytes = 2;
  uint32 max_event_bytes = 3;
  uint32 max_unacked_events = 4;
  uint32 max_log_chunk_bytes = 5;
  repeated string required_features = 6;
  bool log_ingestion_available = 7;
  bool raw_event_retention_available = 8;
  uint32 finalization_grace_ms = 9;
  uint32 dedup_retention_seconds = 10;
  string safe_literal_allowlist_version = 11;
  reserved 12;
  reserved "live_url_template";
}

message ArgvHashKey {
  string key_id = 1;
  bytes key_bytes = 2;
  int64 expires_at_epoch_ms = 3;
  uint32 grace_after_expiry_ms = 4;
}

message RunEventBatch {
  string run_id = 1;
  string batch_id = 2;
  repeated GapAdvance gap_advances = 3;
  uint64 seq_from = 4;
  repeated RunEvent events = 5;
  // Cumulative count dropped by the producer's event bus before assignment
  // of sequence numbers. Unlike gap_advances, these have no sequence range.
  uint64 producer_dropped_events = 6;
}

message GapAdvance {
  uint64 first_dropped_seq = 1;
  uint64 last_dropped_seq = 2;
  string reason = 3;
}

message BatchAck {
  string run_id = 1;
  string batch_id = 2;
  AckDisposition disposition = 3;
  uint64 acked_seq = 4;
  uint64 expected_next_seq = 5;
  uint64 observed_high_water_seq = 6;
  uint32 retry_after_ms = 7;
  uint32 max_in_flight_batches = 8;
  RunFinalization finalization = 9;
  // Canonical absolute dashboard link, available after durable run creation.
  string dashboard_url = 10;
}

message RunEventAck {
  string run_id = 1;
  uint64 acked_seq = 2;
  uint64 expected_next_seq = 3;
  uint64 observed_high_water_seq = 4;
  RunFinalization finalization = 5;
  string dashboard_url = 6;
}

enum AckDisposition {
  ACK_DISPOSITION_UNSPECIFIED = 0;
  ACK_DISPOSITION_ACCEPTED = 1;
  ACK_DISPOSITION_REJECTED_STALE = 2;
  ACK_DISPOSITION_REJECTED_INVALID = 3;
  ACK_DISPOSITION_NEEDS_RESYNC = 4;
}

enum RunFinalization {
  RUN_FINALIZATION_UNSPECIFIED = 0;
  RUN_FINALIZATION_ACTIVE = 1;
  RUN_FINALIZATION_FINALIZING = 2;
  RUN_FINALIZATION_FINALIZED = 3;
  RUN_FINALIZATION_FINALIZATION_PENDING = 4;
  RUN_FINALIZATION_LOST = 5;
}

message ContentRef {
  HashAlgorithm hash_algorithm = 1;
  // Raw digest bytes, not hexadecimal text.
  bytes digest = 2;
  uint64 size_bytes = 3;
  string namespace = 4;
  string media_type = 5;
}

enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;
  HASH_ALGORITHM_BLAKE3 = 1;
  HASH_ALGORITHM_SHA256 = 2;
}

message RunEvent {
  uint64 seq = 1;
  int64 epoch_ms = 2;
  int64 mono_ns = 3;

  oneof payload {
    RunStarted         run_started         = 10;
    RunFinalizing      run_finalizing      = 11;
    RunCompleted       run_completed       = 12;
    RunHeartbeat       run_heartbeat       = 13;

    GraphCompiled      graph_compiled      = 20;
    TargetInstance     target_instance     = 21;

    TargetQueued       target_queued       = 30;
    TargetStarted      target_started      = 31;
    TargetPhase        target_phase        = 32;
    TargetWait         target_wait         = 33;
    TargetCompleted    target_completed    = 34;
    TargetCancelled    target_cancelled    = 35;
    TargetRetried      target_retried      = 36;
    ActionCompleted    action_completed    = 37;
    TargetPhaseCompleted target_phase_completed = 38;
    ActionAttemptStarted action_attempt_started = 39;
    ActionAttemptCompleted action_attempt_completed = 45;

    TestSuiteStarted   test_suite_started  = 40;
    TestSuiteCompleted test_suite_completed = 41;
    TestCaseStarted    test_case_started   = 42;
    TestCaseCompleted  test_case_completed = 43;
    TestCaseRetried    test_case_retried   = 44;

    LogChunk           log_chunk           = 50;
    LogTruncated       log_truncated       = 51;

    CacheProbe         cache_probe         = 60;
    CacheMissReason    cache_miss_reason   = 61;
    CacheUpload        cache_upload        = 62;
    CacheDownload      cache_download      = 63;
    CacheStoreReused   cache_store_reused  = 64;

    ArtifactPublished  artifact_published  = 70;
    DiagnosticEmitted  diagnostic_emitted  = 71;

    SystemSampled      system_sampled      = 80;
  }
}

message RunStarted {
  string once_version = 1;
  string protocol_version = 2;
  string host_class = 3;
  string git_rev = 4;
  bool git_dirty = 5;
  repeated ArgvToken argv_normalized = 6;
  string argv_hash_key_id = 7;
  string safe_literal_allowlist_version = 8;
  string cwd_relative = 9;
  string env_fingerprint = 10;
  ContentRef root_graph_digest = 11;
  string project_id = 12;
  EffectiveLimits effective_limits = 13;
}

message ArgvToken {
  oneof token {
    string safe_literal = 1;
    string flag_key = 2;
    NamedValue named_value = 3;
    string opaque_value_hash = 4;
  }
}

message NamedValue {
  string key = 1;
  string value_shape_hash = 2;
}

message EffectiveLimits {
  uint32 max_batch_bytes = 1;
  uint32 max_event_bytes = 2;
  uint32 max_unacked_events = 3;
  uint32 max_log_chunk_bytes = 4;
  bool log_ingestion_enabled = 5;
  bool raw_event_retention_enabled = 6;
}

message RunFinalizing {
  int64 declared_drain_ms = 1;
}

message RunCompleted {
  RunResult result = 1;
  string cancellation_reason = 2;
  int64 wall_ms = 3;
  RunTotals totals = 4;
  uint64 producer_dropped_events = 5;
}

enum RunResult {
  RUN_RESULT_UNSPECIFIED = 0;
  RUN_RESULT_SUCCEEDED = 1;
  RUN_RESULT_FAILED = 2;
  RUN_RESULT_CANCELLED = 3;
  RUN_RESULT_TIMED_OUT = 4;
  RUN_RESULT_INFRASTRUCTURE_ERROR = 5;
}

message RunTotals {
  map<string, uint32> targets_by_result = 1;
  map<string, uint32> cases_by_result = 2;
  double cache_hit_rate = 3;
  uint64 cache_bytes_downloaded = 4;
  uint64 cache_bytes_uploaded = 5;
  uint64 cache_bytes_saved = 6;
}

message RunHeartbeat {}

message GraphCompiled {
  ContentRef graph_digest = 1;
  uint32 target_count = 2;
  map<string, uint32> kind_histogram = 3;
  repeated string roots = 4;
}

message TargetInstance {
  string target_instance_id = 1;
  string target_id = 2;
  ContentRef configuration_digest = 3;
}

message TargetQueued {
  string target_execution_id = 1;
  string target_instance_id = 2;
  string kind = 3;
  string capability = 4;
  ContentRef action_digest = 5;
  ContentRef input_digest = 6;
  repeated string dep_target_executions = 7;
  uint32 attempt = 8;
}

message TargetStarted {
  string target_execution_id = 1;
  string worker_class = 2;
}

message TargetPhase {
  string target_execution_id = 1;
  Phase phase = 2;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_QUEUED = 1;
  PHASE_CACHE_CHECKING = 2;
  PHASE_PREPARING = 3;
  PHASE_EXECUTING = 4;
  PHASE_CAPTURING = 5;
  PHASE_PUBLISHING = 6;
}

message TargetWait {
  string target_execution_id = 1;
  WaitReason reason = 2;
  string blocking_target_execution_id = 3;
  string resource_kind = 4;
}

enum WaitReason {
  WAIT_REASON_UNSPECIFIED = 0;
  WAIT_REASON_DEPENDENCY_WAIT = 1;
  WAIT_REASON_RESOURCE_WAIT = 2;
  WAIT_REASON_WORKER_WAIT = 3;
  WAIT_REASON_THROTTLED = 4;
  WAIT_REASON_INFRASTRUCTURE = 5;
}

message TargetCompleted {
  string target_execution_id = 1;
  TargetResult result = 2;
  bool was_cached = 3;
  optional int32 exit_code = 4;
  ContentRef evidence_digest = 5;
  int64 duration_ms = 6;
}

enum TargetResult {
  TARGET_RESULT_UNSPECIFIED = 0;
  TARGET_RESULT_SUCCEEDED = 1;
  TARGET_RESULT_FAILED = 2;
  TARGET_RESULT_SKIPPED = 3;
  TARGET_RESULT_CANCELLED = 4;
  TARGET_RESULT_TIMED_OUT = 5;
  TARGET_RESULT_INFRASTRUCTURE_ERROR = 6;
}

message TargetCancelled {
  string target_execution_id = 1;
  string reason = 2;
}

message TargetRetried {
  string previous_target_execution_id = 1;
  string new_target_execution_id = 2;
  uint32 new_attempt = 3;
  string reason = 4;
}

// Exactly one declared action outcome. Identity within a run is the tuple
// (target_execution_id, capability, action_index). The index is zero-based
// declaration order, never completion order; identifier is a display label.
// A new target attempt must use a new target_execution_id. Cached target
// reuse emits the retained actions with current-run timing, not old spans.
message ActionCompleted {
  string target_execution_id = 1;
  string capability = 2;         // "build", "test", ...
  uint32 action_index = 3;       // position within the target's ordered action list
  string identifier = 4;         // Starlark-declared identity, may be empty
  TargetResult result = 5;
  bool was_cached = 6;
  int64 duration_ms = 7;
  int32 exit_code = 8;
  // Wall-clock start time of the action, in epoch milliseconds. When
  // present the projector prefers this over `envelope.epoch_ms -
  // duration_ms`, which collapses many actions that all completed
  // inside one millisecond bucket.
  int64 start_at_epoch_ms = 9;
  // Stable identifier of the worker (tokio task / OS thread / target
  // execution scheduler) that ran this action. The dashboard groups
  // rows in the flame graph by worker, matching Bazel's per-tid
  // rendering.
  string worker_id = 10;
  // Split of `duration_ms` into the two phases the CLI observes.
  // `prepare_ms` covers arg files, input fingerprinting, and action
  // digest; `execute_ms` covers cache probe + (on a miss) command
  // execution and output upload. The server renders each as its own
  // sub-span on the worker's lane so a cache-heavy build shows what
  // filled the wall clock instead of a sea of 1 ms dashes. Zero when
  // unknown (cached-replay actions).
  int64 prepare_ms = 11;
  int64 execute_ms = 12;
  // Hex digest the action probed against the content-addressable store,
  // action_digest. Shown as the "Cache key" column on the Cacheable
  // Actions view of the dashboard.
  string cache_key = 13;
  // Zero means no attempt executed in this run, as with retained target reuse.
  // Otherwise this selects one attempt from the matching tuple below.
  uint32 selected_attempt = 14;
}

// The tuple (target_execution_id, capability, action_index, attempt) is a
// run-local identity. An attempt begins when a worker starts preparing it;
// a later retry uses the next attempt number and may use another worker.
message ActionAttemptStarted {
  string target_execution_id = 1;
  string capability = 2;
  uint32 action_index = 3;
  uint32 attempt = 4;
  string worker_id = 5;
}

message ActionAttemptCompleted {
  string target_execution_id = 1;
  string capability = 2;
  uint32 action_index = 3;
  uint32 attempt = 4;
  TargetResult result = 5;
  int32 exit_code = 6;
  int64 duration_ms = 7;
  bool was_cached = 8;
}

// Observed target-level work, excluded from declared-action counts.
// Phase names are extensible and ecosystem-neutral. Unknown names are shown
// as opaque labels. worker_id identifies a run-local scheduling lane, not a
// physical host or a promise of thread affinity.
message TargetPhaseCompleted {
  string target_execution_id = 1;
  string phase = 2;
  string worker_id = 3;
  int64 start_at_epoch_ms = 4;
  int64 duration_ms = 5;
}

message TestSuiteStarted {
  string target_execution_id = 1;
  string suite_id = 2;
  optional uint32 planned_case_count = 3;
}

message TestSuiteCompleted {
  string target_execution_id = 1;
  string suite_id = 2;
  TestTotals totals = 3;
  ContentRef result_report_digest = 4;
}

message TestTotals {
  uint32 passed = 1;
  uint32 failed = 2;
  uint32 skipped = 3;
  uint32 errored = 4;
  uint32 timed_out = 5;
  uint32 cancelled = 6;
  uint32 flaky_final_pass = 7;
  uint32 flaky_final_fail = 8;
  uint32 unknown = 9;
}

message TestCaseStarted {
  string test_case_execution_id = 1;
  string target_execution_id = 2;
  string case_id = 3;
  string name = 4;
  string class_name = 5;
  string file = 6;
  string parameters = 7;
  repeated string tags = 8;
  uint32 attempt = 9;
}

message TestCaseCompleted {
  string test_case_execution_id = 1;
  TestCaseResult result = 2;
  bool was_flaky = 3;
  int64 duration_ms = 4;
  TestFailure failure = 5;
  // Self-describing so retrospective results do not require a fabricated
  // start event or a server-side join to identify the case.
  string case_id = 6;
  string name = 7;
  string suite_id = 8;
  uint32 attempt = 9;
  // Prefer this presence-aware measurement; the legacy duration_ms is zero
  // when a retrospective report omits timing.
  optional int64 observed_duration_ms = 10;
}

enum TestCaseResult {
  TEST_CASE_RESULT_UNSPECIFIED = 0;
  TEST_CASE_RESULT_PASSED = 1;
  TEST_CASE_RESULT_FAILED = 2;
  TEST_CASE_RESULT_SKIPPED = 3;
  TEST_CASE_RESULT_TIMED_OUT = 4;
  TEST_CASE_RESULT_ERRORED = 5;
  TEST_CASE_RESULT_CANCELLED = 6;
  TEST_CASE_RESULT_UNKNOWN = 7;
}

message TestCaseRetried {
  string previous_test_case_execution_id = 1;
  string new_test_case_execution_id = 2;
  uint32 new_attempt = 3;
  string reason = 4;
}

message TestFailure {
  string message = 1;
  string expected = 2;
  string actual = 3;
  ContentRef stack_digest = 4;
}

message LogChunk {
  LogScope scope = 1;
  Stream stream = 2;
  int64 offset = 3;
  bytes bytes = 4;
}

message LogTruncated {
  LogScope scope = 1;
  Stream stream = 2;
  int64 bytes_dropped = 3;
  int64 since_offset = 4;
}

message LogScope {
  oneof scope {
    RunScope run = 1;
    string target_execution_id = 2;
    string test_case_execution_id = 3;
  }
}

message RunScope {}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

message CacheProbe {
  string cache_decision_id = 1;
  string target_execution_id = 2;
  ContentRef action_digest = 3;
  string tier = 4;
  uint32 tier_index = 5;
  CacheOutcome outcome = 6;
  int64 duration_ms = 7;
  string error_class = 8;
}

enum CacheOutcome {
  CACHE_OUTCOME_UNSPECIFIED = 0;
  CACHE_OUTCOME_HIT = 1;
  CACHE_OUTCOME_MISS = 2;
  CACHE_OUTCOME_ERROR = 3;
  CACHE_OUTCOME_BYPASSED = 4;
}

message CacheMissReason {
  string cache_decision_id = 1;
  string target_execution_id = 2;
  MissReasonKind primary_reason = 3;
  repeated MissReasonKind all_reasons = 4;
  MissAnalysisStatus analysis_status = 5;
  repeated string differing_inputs = 6;
  uint32 differing_inputs_total_count = 7;
  bool differing_inputs_truncated = 8;
  BaselineResolution baseline_resolution = 9;
}

enum MissReasonKind {
  MISS_REASON_KIND_UNSPECIFIED = 0;
  MISS_REASON_KIND_FIRST_SEEN = 1;
  MISS_REASON_KIND_INPUTS_CHANGED = 2;
  MISS_REASON_KIND_COMMAND_CHANGED = 3;
  MISS_REASON_KIND_ENV_CHANGED = 4;
  MISS_REASON_KIND_TOOL_CHANGED = 5;
  MISS_REASON_KIND_SALT_CHANGED = 6;
  MISS_REASON_KIND_UNKNOWN = 7;
}

enum MissAnalysisStatus {
  MISS_ANALYSIS_STATUS_UNSPECIFIED = 0;
  MISS_ANALYSIS_STATUS_COMPLETE = 1;
  MISS_ANALYSIS_STATUS_PARTIAL = 2;
  MISS_ANALYSIS_STATUS_TRUNCATED = 3;
  MISS_ANALYSIS_STATUS_UNAVAILABLE = 4;
}

message BaselineResolution {
  oneof kind {
    BaselineReference reference = 1;
    BaselineNoneAvailable none_available = 2;
    BaselineNotAttempted not_attempted = 3;
    BaselineUnavailable unavailable = 4;
  }
}

message BaselineReference {
  string previous_run_id = 1;
  string previous_target_instance_id = 2;
  string previous_target_execution_id = 3;
  ContentRef previous_action_digest = 4;
  string selection_reason = 5;
}

message BaselineNoneAvailable {}
message BaselineNotAttempted { string skip_reason = 1; }
message BaselineUnavailable { string failure_reason = 1; }

message CacheUpload {
  string cache_decision_id = 1;
  string target_execution_id = 2;
  ContentRef content = 3;
  string tier = 4;
  string kind = 5;
  int64 duration_ms = 6;
  uint64 bytes_transferred = 7;
}

message CacheDownload {
  string cache_decision_id = 1;
  string target_execution_id = 2;
  ContentRef content = 3;
  string tier = 4;
  string kind = 5;
  int64 duration_ms = 6;
  uint64 bytes_transferred = 7;
}

message CacheStoreReused {
  string cache_decision_id = 1;
  string target_execution_id = 2;
  ContentRef content = 3;
  string tier = 4;
  string kind = 5;
  uint64 bytes_saved = 6;
}

message ArtifactPublished {
  string target_execution_id = 1;
  string kind = 2;
  ContentRef content = 3;
  string workspace_relative_path = 4;
}

message DiagnosticEmitted {
  string target_execution_id = 1;
  Severity severity = 2;
  string tool = 3;
  string code = 4;
  string message = 5;
  Location primary = 6;
  repeated Location related = 7;
  string fingerprint = 8;
  ContentRef snippet = 9;
}

message Location {
  string file = 1;
  uint32 start_line = 2;
  uint32 start_column = 3;
  uint32 end_line = 4;
  uint32 end_column = 5;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_NOTE = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
}

// Periodic host-resource sample published while a run executes so the
// dashboard's timeline can plot CPU, memory, and network usage over
// wall-clock. Sampled at a bounded cadence (1 Hz by default) from a
// single background task on the client. The projector stores each
// sample as one row and derives the timeline series at read time.
message SystemSampled {
  // The sample's own wall-clock instant. Enveloping RunEvent.epoch_ms
  // is for display only; RunEvent.seq defines stream order.
  int64 at_epoch_ms = 1;

  // Whole-host CPU utilisation from 0 to 100. Averaged across cores
  // so a 4-core machine at full load reports 100, not 400.
  float cpu_percent = 2;

  // Whole-host memory usage in bytes, matching what a process manager
  // would report as "used".
  uint64 memory_bytes = 3;

  // Network transfer rate at sample time, in bytes per second, summed
  // across all interfaces. Direction is the transport's own point of
  // view: `in` is bytes coming into the host, `out` is bytes leaving.
  uint64 network_in_bytes_per_second = 4;
  uint64 network_out_bytes_per_second = 5;
  // A run-local identity, never a hostname or globally stable device key.
  string resource_id = 6;
  ResourceScope scope = 7;
  // Actual interval used to derive rates; zero means unavailable.
  uint32 interval_ms = 8;
}

enum ResourceScope {
  RESOURCE_SCOPE_UNSPECIFIED = 0;
  RESOURCE_SCOPE_HOST = 1;
  RESOURCE_SCOPE_CONTAINER = 2;
  RESOURCE_SCOPE_PROCESS = 3;
  RESOURCE_SCOPE_WORKER = 4;
}
