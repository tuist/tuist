# Include this file at an immutable commit, then reference the snippet before
# dependency installation. CI variables are arguments, never interpolated code.
# TUIST_VOLUME_PATH holds one path per line; all paths share the volume.
.tuist-cache-volume:
  before_script:
    - |
      : "${TUIST_VOLUME_KEY:?Set TUIST_VOLUME_KEY}"
      : "${TUIST_VOLUME_PATH:?Set TUIST_VOLUME_PATH}"
      tuist_volume_arguments=(--key "$TUIST_VOLUME_KEY")
      while IFS= read -r tuist_volume_path || [ -n "$tuist_volume_path" ]; do
        tuist_volume_path=${tuist_volume_path#"${tuist_volume_path%%[![:space:]]*}"}
        tuist_volume_path=${tuist_volume_path%"${tuist_volume_path##*[![:space:]]}"}
        if [ -n "$tuist_volume_path" ]; then
          tuist_volume_arguments+=(--path "$tuist_volume_path")
        fi
      done <<< "$TUIST_VOLUME_PATH"
      if [ "${#tuist_volume_arguments[@]}" -eq 2 ]; then
        echo "TUIST_VOLUME_PATH must contain at least one path." >&2
        exit 1
      fi
      tuist-cache-volume "${tuist_volume_arguments[@]}"
