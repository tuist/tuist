name: Tuist cache volumes
description: Attach private persistent cache volumes on Tuist Linux and macOS runners.
author: https://github.com/tuist
requirements: [bash, jq, tuist-cache-volume]
configuration:
  type: object
  additionalProperties: false
  required: [volumes]
  properties:
    volumes:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: object
        additionalProperties: false
        required: [path]
        properties:
          key:
            type: string
            minLength: 1
          path:
            oneOf:
              - type: string
                minLength: 1
              - type: array
                minItems: 1
                maxItems: 16
                items:
                  type: string
                  minLength: 1
          size:
            type: string
            pattern: "^[0-9]+[gG][bB]$"
