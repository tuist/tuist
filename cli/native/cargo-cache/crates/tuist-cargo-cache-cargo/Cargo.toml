[package]
name = "tuist-cargo-cache-cargo"
version = "0.3.12"
description = "Unstable Cargo invocation integration for tuist_cargo_cache cache embedders"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
dirs = "7"
tuist-cargo-cache-core = { path = "../tuist-cargo-cache-core", version = "0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["rustls"]
native-tls = ["tuist-cargo-cache-core/native-tls"]
rustls = ["tuist-cargo-cache-core/rustls"]
rustls-native-roots = ["tuist-cargo-cache-core/rustls-native-roots"]
