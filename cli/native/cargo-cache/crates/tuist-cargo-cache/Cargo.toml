[package]
autobins = false
autotests = false
name = "tuist-cargo-cache"
version = "1.23.0"
description = "A build cache for Rust projects"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["cache", "build-cache", "cargo", "rustc", "build"]
categories = ["development-tools::build-utils", "development-tools::cargo-plugins", "command-line-utilities", "caching"]
readme.workspace = true
documentation = "https://docs.tuist.dev"

[[bin]]
name = "tuist-cargo-cache"
path = "src/tuist_main.rs"

[[bin]]
name = "tuist-cargo-cache-model"
path = "src/main.rs"
required-features = ["model-tests"]

[[test]]
name = "tuist_runtime"

[[test]]
name = "build"
required-features = ["model-tests"]

[[test]]
name = "cargo_invocation"
required-features = ["model-tests"]

[[test]]
name = "session_scope"
required-features = ["model-tests"]

[[test]]
name = "storage_placement"
required-features = ["model-tests"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytesize = "2"
cargo-config2 = "0.1.45"
demand = "2"
env_logger = "0.11"
dirs = "7"
eyre = "0.6"
fslock = "0.2"
flate2 = "1"
hex = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }
log = "0.4"
memchr = "2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
portable-pty = "0.9"
tuist-cargo-cache-core = { path = "../tuist-cargo-cache-core", version = "0.20.0", default-features = false }
tuist-cargo-cache-cargo = { path = "../tuist-cargo-cache-cargo", version = "0.3.12", default-features = false }
tuist-cargo-cache-cc = { path = "../tuist-cargo-cache-cc", version = "0.20.0", default-features = false }
tuist-cargo-cache-rustc = { path = "../tuist-cargo-cache-rustc", version = "0.20.0", default-features = false }
tuist-cargo-cache-store = { path = "../tuist-cargo-cache-store", version = "0.1.38", default-features = false }
rand = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reflink-copy = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
toml_edit = "0.25"
url = "2"
usage-rs = { version = "7.0", features = ["config", "completions"] }
usage-config = { version = "7", features = ["toml"] }
which = "8"

[dev-dependencies]
filetime = "0.2"
mockito = "1"
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[features]
model-tests = []
default = ["rustls"]
native-tls = ["tuist-cargo-cache-cargo/native-tls", "tuist-cargo-cache-cc/native-tls", "tuist-cargo-cache-core/native-tls", "tuist-cargo-cache-rustc/native-tls", "tuist-cargo-cache-store/native-tls", "reqwest/native-tls"]
rustls = ["tuist-cargo-cache-cargo/rustls", "tuist-cargo-cache-cc/rustls", "tuist-cargo-cache-core/rustls", "tuist-cargo-cache-rustc/rustls", "tuist-cargo-cache-store/rustls", "reqwest/rustls"]
rustls-native-roots = [
  "tuist-cargo-cache-cargo/rustls-native-roots",
  "tuist-cargo-cache-cc/rustls-native-roots",
  "tuist-cargo-cache-core/rustls-native-roots",
  "tuist-cargo-cache-rustc/rustls-native-roots",
  "tuist-cargo-cache-store/rustls-native-roots",
  "reqwest/rustls",
]
