[package]
name = "tuist-cargo-cache-rustc"
version = "0.20.0"
description = "tuist_cargo_cache internals: conservative rustc action analysis and key construction. No API stability -- use the tuist_cargo_cache CLI or tuist-cargo-cache-protocol."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["cache", "build-cache", "rustc", "cargo"]
categories = ["development-tools::build-utils", "caching"]
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
tuist-cargo-cache-core = { path = "../tuist-cargo-cache-core", version = "0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
shlex = "2"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["rustls"]
native-tls = ["tuist-cargo-cache-core/native-tls"]
rustls = ["tuist-cargo-cache-core/rustls"]
rustls-native-roots = ["tuist-cargo-cache-core/rustls-native-roots"]
