// Wire-compatible cache subset of bazelbuild/remote-apis remote_execution.proto.
// Field numbers and service names are upstream REAPI v2. Remote execution is not exposed.
syntax = "proto3";
package build.bazel.remote.execution.v2;
service ActionCache {
  rpc GetActionResult(GetActionResultRequest) returns (ActionResult) {}
  rpc UpdateActionResult(UpdateActionResultRequest) returns (ActionResult) {}
}
service ContentAddressableStorage {
  rpc FindMissingBlobs(FindMissingBlobsRequest) returns (FindMissingBlobsResponse) {}
}
message Digest { string hash = 1; int64 size_bytes = 2; }
message DigestFunction { enum Value { UNKNOWN = 0; SHA256 = 1; } }
message Action { Digest command_digest = 1; Digest input_root_digest = 2; }
message Command { repeated string arguments = 1; repeated string output_paths = 7; }
message Directory { repeated FileNode files = 1; repeated DirectoryNode directories = 2; repeated SymlinkNode symlinks = 3; }
message FileNode { string name = 1; Digest digest = 2; bool is_executable = 4; }
message DirectoryNode { string name = 1; Digest digest = 2; }
message SymlinkNode { string name = 1; string target = 2; }
message Tree { Directory root = 1; repeated Directory children = 2; }
message OutputFile { string path = 1; Digest digest = 2; bool is_executable = 4; bytes contents = 5; }
message OutputDirectory { string path = 1; Digest tree_digest = 3; bool is_topologically_sorted = 4; Digest root_directory_digest = 5; }
message ActionResult { repeated OutputFile output_files = 2; repeated OutputDirectory output_directories = 3; int32 exit_code = 4; }
message GetActionResultRequest { string instance_name = 1; Digest action_digest = 2; DigestFunction.Value digest_function = 6; }
message UpdateActionResultRequest { string instance_name = 1; Digest action_digest = 2; ActionResult action_result = 3; DigestFunction.Value digest_function = 5; }
message FindMissingBlobsRequest { string instance_name = 1; repeated Digest blob_digests = 2; DigestFunction.Value digest_function = 3; }
message FindMissingBlobsResponse { repeated Digest missing_blob_digests = 2; }
