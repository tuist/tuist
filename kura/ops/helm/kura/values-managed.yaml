# Cross-cutting defaults for Kura on the Tuist-managed Kubernetes cluster
# (Hetzner). Layered with a per-region and a per-account overlay; the
# deploy workflow appends a generated per-instance file last to set
# fullnameOverride and the public host.
#
# See infra/k8s/kura-rollout.md for the rollout flow.

image:
  repository: ghcr.io/tuist/kura
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  # One co-hosted HTTP + gRPC (h2c) listener.
  httpPort: 4000

# Public reachability for the Tuist CLI. The CLI talks plain HTTP cache
# protocol; gRPC (REAPI) is not exposed publicly here. Per-instance host
# and TLS hosts are filled in by the workflow's generated overlay.
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

persistence:
  enabled: true
  # ReadWriteOncePod matches Kura's single-writer fencing contract and is
  # supported by the Hetzner CSI driver on the cluster-stack version we
  # run (>= 1.34). The in-process DataDirLock is the source of truth, so
  # falling back to ReadWriteOnce only weakens the Kubernetes-side
  # belt-and-suspenders.
  accessModes:
    - ReadWriteOncePod

pdb:
  enabled: true
  minAvailable: 2

# All managed clusters today are single-region (one Hetzner location, no
# zones inside it). Spreading by hostname is the strongest constraint we
# can apply: keeps the three replicas on three distinct workers so a node
# drain does not take more than one Kura pod at a time.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    # The selector is filled in by the per-instance overlay so the spread
    # constraint matches this specific release's pods, not every Kura
    # release in the namespace.

resources:
  requests:
    cpu: "500m"
    memory: "1.5Gi"
  limits:
    memory: "2Gi"

# Telemetry endpoint is the same across our managed clusters: each
# cluster runs the k8s-monitoring Helm release in the `observability`
# namespace, exposing alloy at the same in-cluster Service name.
config:
  telemetry:
    otlpTracesEndpoint: http://k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4318/v1/traces
    deploymentEnvironment: production
  # Cache-size overrides for the 2 GiB memory profile. The derived
  # defaults (snapshot 256 MiB, manifest 64 MiB, RocksDB 64+64 MiB)
  # leave too little headroom for heavy tenants, which hit
  # MemoryPressure::Critical at ~1.68 GiB working set and start
  # shedding replication writes. These smaller caches keep steady-state
  # RSS around ~1.4 GiB, well below the 1.74 GiB hard limit where
  # Critical fires. These values apply to Helm-chart deployments; the
  # production custom-resource-provisioned instances receive the same
  # overrides from the Kura controller. Spec #78 will supersede these
  # when it ships the 512 MiB standard compute profile.
  memory:
    snapshotCacheMaxBytes: 67108864
    manifestCacheMaxBytes: 33554432

# RocksDB caches don't have dedicated Helm template knobs, so they go
# through extraEnv. Same rationale as the memory config above.
#
# KURA_METADATA_STORE_WRITE_BUFFER_POOL_BYTES is deliberately NOT pinned here.
# It used to be 32 MiB, set alongside the read cache in #12117 to shrink the
# process's anonymous footprint during a memory-pressure incident, not because
# RocksDB needed it that tight. The write-buffer pool is built with
# `allow_stall = true`, so at 32 MiB a single burst saturated it and blocked
# every writer inside RocksDB (#12556). Left unset, the process derives
# `memory_limit / 32` clamped to [16, 128] MiB, which is 128 MiB at the 4Gi
# limit managed instances run — the sizing the code already reasons about.
#
# The read cache stays pinned at 32 MiB. It only shared the write-buffer pool's
# fate because the two were one allocation; now that the write-buffer manager
# no longer charges memtable growth to the block cache, 32 MiB of read cache is
# not what saturates, and leaving it pinned keeps the added footprint to the
# ~96 MiB of pool. Production pods sit at ~558 MB of a 4Gi limit, and an env
# var does not move `resources.limits`, so node limit-commit is unchanged.
extraEnv:
  - name: KURA_METADATA_STORE_READ_CACHE_BYTES
    value: "33554432"
