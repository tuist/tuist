replicaCount: 3

image:
  repository: ghcr.io/tuist/kura
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Exposes Kura's Prometheus /metrics endpoint to annotation-based
# scrapers. The managed clusters' k8s-monitoring release discovers
# targets via these prometheus.io/* keys (annotationAutodiscovery), and
# the embedded Prometheus self-hosters opt into reads the same keys.
# port-name pins discovery to the `http` container port (the pod also
# declares peer) so /metrics is scraped once per pod.
# Inert when no scraper is present.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port-name: "http"
  prometheus.io/path: "/metrics"
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: ""
  # Kura serves the HTTP cache API and REAPI gRPC (h2c) on one co-hosted
  # listener (KURA_PORT = httpPort). This chart requires a Kura image with
  # the co-hosted listener (releases after kura@0.10.15).
  httpPort: 4000

peerTls:
  enabled: false
  internalPort: 7443
  secretName: ""
  caCertFileName: ca.pem
  certFileName: tls.crt
  keyFileName: tls.key

headlessService:
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kura.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

grpcIngress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kura-grpc.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  # Prefer ReadWriteOncePod to enforce one Kura writer per PVC.
  # Override to ReadWriteOnce only when the CSI driver does not support it.
  accessModes:
    - ReadWriteOncePod
  size: 200Gi
  storageClass: ""
  annotations: {}

# Kura derives every memory budget from the container limit. Keep the request
# equal to the limit so a default install reserves the memory it may consume
# instead of sizing itself from the shared node's physical memory.
resources:
  requests:
    memory: 1Gi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

updateStrategy:
  rollingUpdatePartition: null

podLifecycle:
  # Allow endpoint propagation to remove the pod from public traffic before SIGTERM.
  preStopDelaySeconds: 20
  # Leave a small platform buffer after Kura's own drain deadline for process exit.
  terminationGraceExtraSeconds: 15

pdb:
  enabled: true
  minAvailable: 1

config:
  tenantId: default
  region: fr-par
  tmpDirMaxBytes: 8589934592
  # Artifact-body budget for the CAS segment ring. Leave unset to derive
  # 50% of the data volume's filesystem size at startup; either way the
  # runtime caps the budget at 80% of the filesystem so segment rotation
  # can never run the disk full.
  casCapacityBytes: null
  fileDescriptors:
    # Leave unset to derive from the process RLIMIT_NOFILE after Kura raises
    # the soft limit to the hard limit at startup.
    poolSize: null
    acquireTimeoutMs: 5000
    # Leave unset to derive from the effective file descriptor pool size.
    segmentHandleCacheSize: null
  acceleratedFileServing:
    enabled: true
    mode: splice
    maxConcurrent: 32
    chunkBytes: 1048576
  actionCache:
    # When true, evicting a CAS blob cascades to the action-cache entries that
    # reference it, so an entry never outlives its blobs. The cascade is
    # additionally gated on the node's one-time reverse-map backfill completing,
    # and the serve-side presence gates stay on regardless as the backstop.
    evictionCascadeEnabled: true
  backfill:
    # Boot-time selection of the peer catch-up walker: when true the node
    # runs the recency-first backfill lifecycle instead of the legacy
    # bootstrap walker. Read once at process start, so flipping it rolls the
    # pods; watermarks and index rows are durable and sit inert while the
    # flag is off.
    enabled: false
    # Share of the age-ordered segment ring (counted from the newest) whose
    # boundary segment's seal-time age stat bounds how far back a backfill
    # pass reaches. The margin's share of the ring's time span is the
    # window's structural slack; 40 matches the "new" band under the 1:2:2
    # old/current/new ring ratio.
    marginPercent: 40
    # Segment-ring fullness percent at which a node still running its initial
    # backfill cycle marks itself ready (readiness then latches for the
    # process lifetime). Leave unset to derive half of marginPercent inside
    # the binary — set it only to decouple the readiness point from the
    # margin.
    readyRingPercent: null
    # Byte threshold a backfill pass composes one bodies batch against, and
    # the cutoff above which a listed entry is fetched through the
    # per-artifact endpoint. Must not exceed the compiled 32 MiB response
    # ceiling shared by both sides of the bodies protocol.
    batchBytes: 33554432
  memory:
    # Leave watermarks and cache capacities unset so Kura derives them from
    # the container's effective memory limit. Explicit values must remain below
    # that limit and are intended only for deliberate tuning experiments.
    softLimitBytes: null
    hardLimitBytes: null
    snapshotCacheMaxBytes: null
    manifestCacheMaxBytes: null
    maxKeyvalueBytes: 1048576
  shutdown:
    drainCompletionTimeoutMs: 240000
  metadataStore:
    maxOpenFiles: 1024
    maxBackgroundJobs: 4
  replication:
    # Positive values are adaptive ceilings: Kura lowers the effective sync
    # rate under public inflight load or elevated public request latency.
    # Set to 0 to disable application-level peer artifact body throttling.
    bandwidthLimitBytesPerSecond: 536870912
    # Public request latency target used to further back off peer sync traffic.
    # Set to 0 to disable latency-based pressure.
    publicLatencyTargetMs: 100
  telemetry:
    otlpTracesEndpoint: http://otel-collector:4318/v1/traces
    deploymentEnvironment: production
  discovery:
    enabled: true
  # The Kura image vendors a DB-IP Lite City MMDB at
  # `/opt/geoip/dbip-city-lite.mmdb`, so client geographic attribution
  # (country + ISO 3166-2 subdivision) is on whenever that file is
  # present (Kura soft-fails if it isn't). `refreshIntervalSecs`
  # controls how often the pod re-downloads the monthly dump in the
  # background. Set to 0 to pin to the vendored copy for the pod
  # lifetime.
  geoip:
    refreshIntervalSecs: 86400

# Use extraEnv or extraEnvFrom to inject optional secrets such as KURA_SENTRY_DSN.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# Cache authorization against a Tuist server. The JWT verification key and the
# control-plane credentials are secrets, so they come in through extraEnv or
# extraEnvFrom as KURA_AUTH_JWT_SECRET and KURA_CONTROL_PLANE_CLIENT_ID /
# KURA_CONTROL_PLANE_CLIENT_SECRET.
auth:
  enabled: false
  tuistUrl: ""
