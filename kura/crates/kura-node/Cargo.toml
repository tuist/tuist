# The running node below its REAPI services: AppState, the HTTP API, replication, auth, analytics,
# usage and telemetry. kura-reapi and the kura crate build on it; see src/lib.rs.
[package]
name = "kura-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Exposes the test helpers (test_support) that the tests of the crates above it build on.
test-support = ["dep:tempfile", "kura-core/test-support"]

[dependencies]
kura-core.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bazel-remote-apis.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
moka.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
prost.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
futures-executor.workspace = true
kura-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
