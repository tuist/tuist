# rules_rs 0.0.108's Ubuntu snapshot intermittently returns 503. Launchpad
# retains the identical packages after archive.ubuntu.com supersedes them.
# Preserve the original URL as a fallback and the toolchain's SHA-256 checks.
rewrite (snapshot\.ubuntu\.com/ubuntu/[^/]+/pool/main/z/zlib/(zlib1g_[^/]+\.deb)) https://launchpad.net/ubuntu/+archive/primary/+files/$2
rewrite (snapshot\.ubuntu\.com/ubuntu/[^/]+/pool/main/z/zlib/(zlib1g_[^/]+\.deb)) https://$1
