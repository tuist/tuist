[package]
name = "kura"
version = "0.8.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
arc-swap = "1.9.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
bazel-remote-apis = "0.27.0"
bytes = "1.11.0"
deadpool = { version = "0.13.0", default-features = false, features = ["unmanaged"] }
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = "1.7.0"
hyper-util = "0.1.20"
libc = "0.2.177"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
memmap2 = "0.9.10"
moka = { version = "0.12.16", features = ["future", "sync"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
prost = "0.14.1"
prometheus-client = "0.24.1"
rand = "0.9.4"
rcgen = "0.14.5"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime", "lz4"] }
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
rustix = { version = "1.1.4", features = ["fs", "param"] }
sentry = { version = "0.47.0", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tonic = { version = "0.14.2", features = ["tls-aws-lc"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zstd = "0.13"

# `unprefixed_malloc_on_supported_platforms` builds jemalloc without the `_rjem_` symbol prefix, so
# the binary's own `malloc`/`free` are jemalloc's and interpose libc's for the whole process. Without
# it only Rust allocations reach jemalloc: rocksdb's C++ (and aws-lc's C) went to glibc malloc, whose
# per-thread arenas retain freed memory for the process lifetime, outside the jemalloc decay tuning
# in main.rs and invisible to kura_jemalloc_* (tuist/tuist#12699). The equivalent `rocksdb`
# `jemalloc` cargo feature was not used because under Bazel rocksdb's C++ is compiled as a
# cc_library (MODULE.bazel) that cargo features never reach; the interposition is the actual fix
# and applies identically to both build paths.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.0", features = ["stats", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-sys = "0.6.0"
tikv-jemalloc-ctl = { version = "0.6.0", features = ["stats"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["test-util"] }

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
