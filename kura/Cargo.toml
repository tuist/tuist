form_urlencoded = "1.2.2"
futures-util = "0.3.31"
h2 = "0.4.19"
hex = "0.4.3"
hmac = "0.12.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = "1.7.0"
hyper-util = "0.1.20"
libc = "0.2.177"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
memmap2 = "0.9.10"
moka = { version = "0.12.16", features = ["future", "sync"] }
opentelemetry = "0.32.0"
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
prost = "0.14.1"
prost-types = "0.14.3"
prometheus-client = "0.24.1"
rand = "0.9.4"
rcgen = "0.14.5"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "http2", "json", "query", "rustls", "stream"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime", "lz4"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
rustls-native-certs = "=0.8.3"
webpki = { package = "rustls-webpki", version = "=0.103.16" }
rustix = { version = "1.1.4", features = ["fs", "param"] }
