worker_processes 2;
events { worker_connections 4096; }
http {
access_log off;
keepalive_requests 10000;
error_log /dev/stderr warn;
client_body_buffer_size 4m;
http2_max_concurrent_streams 32;
http2_body_preread_size 4m;
server { listen 8443 ssl default_server; ssl_reject_handshake on; }

upstream backend_http_a {
    server kura-hop-20260910100713-backend-a.kura.svc.cluster.local:4000;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 10s;
}
upstream backend_grpc_a {
    server kura-hop-20260910100713-backend-a.kura.svc.cluster.local:4000;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 10s;
}
server {
    listen 8443 ssl;
    http2 on;
    server_name a.benchmark.test;
    ssl_certificate /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    location ~ ^/(google\.bytestream\.|build\.bazel\.) {
        grpc_pass grpc://backend_grpc_a;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
    }
    location / {
        proxy_pass http://backend_http_a;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

upstream backend_http_b {
    server kura-hop-20260910100713-backend-b.kura.svc.cluster.local:4000;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 10s;
}
upstream backend_grpc_b {
    server kura-hop-20260910100713-backend-b.kura.svc.cluster.local:4000;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 10s;
}
server {
    listen 8443 ssl;
    http2 on;
    server_name b.benchmark.test;
    ssl_certificate /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    location ~ ^/(google\.bytestream\.|build\.bazel\.) {
        grpc_pass grpc://backend_grpc_b;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
    }
    location / {
        proxy_pass http://backend_http_b;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
}
