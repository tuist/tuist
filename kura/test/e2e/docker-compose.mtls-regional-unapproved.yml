services:
  kura-ap:
    environment:
      KURA_PEER_TOPOLOGY: '{"provider":"vultr","private_network":"test-scl","private_url":"https://private-ap.kura.internal:7443","canonical_networks":[]}'
  # A healthy private sibling lets SCL finish bootstrap independently of the
  # deliberately blocked regional links and serves as the positive control.
  kura-ap-sibling:
    extends:
      file: ./docker-compose.yml
      service: kura-ap
    hostname: kura-ap-sibling
    environment:
      KURA_NODE_URL: https://kura-ap-sibling.kura.internal:7443
      KURA_PEERS: https://kura-us.kura.internal:7443,https://kura-eu.kura.internal:7443,https://kura-ap.kura.internal:7443
      KURA_INTERNAL_TLS_CA_CERT_PATH: /etc/kura/mtls/ca.pem
      KURA_INTERNAL_TLS_CERT_PATH: /etc/kura/mtls/peer.pem
      KURA_INTERNAL_TLS_KEY_PATH: /etc/kura/mtls/peer.key
      KURA_PEER_TOPOLOGY: '{"provider":"vultr","private_network":"test-scl","private_url":"https://private-ap-sibling.kura.internal:7443","canonical_networks":[]}'
    ports: !reset []
    volumes: !override
      - kura-ap-sibling-data:/var/cache/kura
      - ${KURA_MTLS_CERT_DIR}:/etc/kura/mtls:ro
    networks: !override
      default:
        aliases: [kura-ap-sibling.kura.internal, kura-ring.kura.internal]
      scl-private:
        aliases: [private-ap-sibling.kura.internal]
volumes:
  kura-ap-sibling-data: {}
