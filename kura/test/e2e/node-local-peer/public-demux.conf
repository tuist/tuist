# The managed region's public peer demux, as PeerDemuxReconciler renders it:
# SNI to the region's gateway, resolved per connection.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events {
  worker_connections 4096;
}
stream {
  resolver 127.0.0.11 valid=10s;
  map $ssl_preread_server_name $kura_peer_backend {
    default "";
    peer.acme-eu-west-1.kura.test kura-ap.kura.internal:7443;
  }
  server {
    listen 7443;
    ssl_preread on;
    proxy_pass $kura_peer_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 10m;
  }
}
