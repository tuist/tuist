# The rack node's demux, as NodeLocalPeerReconciler renders it for the node:
# SNI to the pod's address on the node's bridge, with no resolver.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events {
  worker_connections 4096;
}
stream {
  map_hash_bucket_size 512;
  map_hash_max_size 8192;
  map $ssl_preread_server_name $kura_peer_backend {
    default "";
    kura-acme-ber1-peer.tailscale-operator.svc.cluster.local 10.254.254.17:7443;
  }
  server {
    listen 7443;
    ssl_preread on;
    proxy_pass $kura_peer_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 10m;
  }
}
