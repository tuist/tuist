# Overlay for the in-place restart suite of spec/e2e/sync_spec.sh (B-12):
# region-b's replicas run on the 5-segment floor ring
# (`KURA_CAS_CAPACITY_BYTES=1`, segments seal at 512 MiB), so a few large
# modules pulled from region-a fill it and every later apply evicts — the
# full-ring shape a production restart meets. Layered on
# docker-compose.sync.yml; compose merges `environment` key by key.
services:
  kura-b1:
    environment:
      KURA_CAS_CAPACITY_BYTES: "1"
  kura-b2:
    environment:
      KURA_CAS_CAPACITY_BYTES: "1"
