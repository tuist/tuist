---
components:
  responses: {}
  schemas:
    CompleteMultipartUploadRequest:
      description: Request to complete a multipart upload
      properties:
        checksum_sha256:
          description: Lowercase hex SHA-256 (64 characters) of the assembled artifact. When present, the server refuses the completion with 422 if the assembled bytes do not match, and otherwise serves the digest back as the tuist-checksum-sha256 header on downloads.
          type: string
        parts:
          description: Ordered list of part numbers that were uploaded
          items:
            type: integer
          type: array
      required:
        - parts
      title: CompleteMultipartUploadRequest
      type: object
    Error:
      properties:
        message:
          description: The error message
          type: string
      required:
        - message
      title: Error
      type: object
    KeyValueResponse:
      properties:
        entries:
          description: The list of key-value entries
          items:
            properties:
              value:
                description: The value
                type: string
            required:
              - value
            type: object
          type: array
      required:
        - entries
      title: KeyValueResponse
      type: object
    StartMultipartUploadResponse:
      description: Response from starting a multipart upload
      properties:
        upload_id:
          description: The upload ID to use for subsequent part uploads. Null if artifact already exists.
          nullable: true
          type: string
      required:
        - upload_id
      title: StartMultipartUploadResponse
      type: object
  securitySchemes:
    authorization:
      scheme: bearer
      type: http
info:
  title: Kura HTTP cache API
  version: 0.1.0
openapi: 3.0.0
paths:
  /api/cache/cas/{id}:
    get:
      callbacks: {}
      operationId: downloadXcodeArtifact
      parameters:
        - description: The artifact identifier
          in: path
          name: id
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: The handle of the account
          in: query
          name: account_handle
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: The handle of the project
          in: query
          name: project_handle
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: A single byte range, as `bytes=<first>-`, to resume an interrupted download
          in: header
          name: range
          required: false
          schema:
            type: string
        - description: The `ETag` the interrupted download started from. The range is honoured only while it still matches, and the whole artifact is returned otherwise, so a resume cannot splice two versions together.
          in: header
          name: if-range
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/octet-stream: {}
          description: Artifact content
          headers:
            tuist-checksum-sha256:
              description: Lowercase hex SHA-256 of the whole artifact, as declared by its uploader and verified at upload. Absent for artifacts uploaded without one.
              schema:
                type: string
              style: simple
        '206':
          content:
            application/octet-stream: {}
          description: The requested range of the artifact
          headers:
            content-range:
              description: The range served, as `bytes <first>-<last>/<total>`
              schema:
                type: string
              style: simple
            etag:
              description: The representation served, to be echoed in `If-Range` when resuming
              schema:
                type: string
              style: simple
            tuist-checksum-sha256:
              description: Lowercase hex SHA-256 of the whole artifact, as declared by its uploader and verified at upload. Absent for artifacts uploaded without one.
              schema:
                type: string
              style: simple
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The account has exhausted its plan's free tier
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Artifact not found
        '416':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The requested range lies entirely outside the artifact
          headers:
            content-range:
              description: The artifact's length, as `bytes */<total>`
              schema:
                type: string
              style: simple
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request parameters
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The server is limiting concurrent artifact response streams; retry after the hint
          headers:
            retry-after:
              description: Whole seconds to wait before retrying. Jittered, so clients shed together do not return together.
              schema:
                type: string
              style: simple
      summary: Download a Xcode cache artifact
      tags:
        - Xcode
    post:
      callbacks: {}
      operationId: saveXcodeArtifact
      parameters:
        - description: The artifact identifier
          in: path
          name: id
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: The handle of the account
          in: query
          name: account_handle
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: The handle of the project
          in: query
          name: project_handle
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: Lowercase hex SHA-256 of the request body. When present, a body that does not match is refused with 422, a malformed value with 400, and the digest is served back with the artifact.
          in: header
          name: tuist-checksum-sha256
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream: {}
        description: The Xcode cache artifact data
        required: true
      responses:
        '204':
          description: Upload successful
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The declared tuist-checksum-sha256 is malformed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The account has exhausted its plan's free tier
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request body read timed out
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request body exceeded allowed size
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request parameters, or a body that does not match its declared tuist-checksum-sha256
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Failed to persist artifact
      summary: Save a Xcode cache artifact
      tags:
        - Xcode
