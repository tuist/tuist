                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The account has exhausted its plan's free tier
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Artifact not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request parameters
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The server is limiting concurrent artifact response streams; retry after the hint
          headers:
            retry-after:
              description: Whole seconds to wait before retrying. Jittered, so clients shed together do not return together.
              schema:
                type: string
              style: simple
      summary: Download a Gradle build cache artifact
      tags:
        - Gradle
    put:
      callbacks: {}
      operationId: saveGradleArtifact
      parameters:
        - description: The Gradle build cache key (hash)
          in: path
          name: cache_key
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: The handle of the account
          in: query
          name: account_handle
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: The handle of the project
          in: query
          name: project_handle
          required: true
          schema:
            minLength: 1
            pattern: ^(?!\.{1,2}$)[^/\\\x{0}]+$
            type: string
        - description: Declared body length in bytes. A body that ends before it is rejected as truncated instead of being stored.
          in: header
          name: content-length
          required: true
          schema:
            minimum: 0
            type: integer
        - description: Lowercase hex SHA-256 of the request body. When present, a body that does not match is refused with 422, a malformed value with 400, and the digest is served back with the artifact.
          in: header
          name: tuist-checksum-sha256
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream: {}
        description: The Gradle build cache artifact data
        required: true
      responses:
        '200':
          description: Upload successful (artifact existed)
        '201':
          description: Upload successful (new artifact)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request body was truncated before reaching the declared Content-Length, or the declared tuist-checksum-sha256 is malformed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The account has exhausted its plan's free tier
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '408':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request body read timed out
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Request body exceeded allowed size
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid or missing request parameters (e.g., missing Content-Length header), or a body that does not match its declared tuist-checksum-sha256
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Failed to persist artifact
      summary: Save a Gradle build cache artifact
      tags:
        - Gradle
