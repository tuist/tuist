name: Tuist Gradle cache
description: Keep Gradle's dependency and wrapper caches across jobs on Tuist Linux and macOS runners.
branding:
  icon: package
  color: purple
inputs:
  size:
    description: Cache volume capacity, a whole number of GB from 1gb to 100gb, such as 50gb. New volumes start at 20gb when omitted.
    required: false
    default: ""
outputs:
  cache-hit:
    description: Whether the job attached a previously saved cache.
    value: ${{ steps.setup.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        TUIST_GRADLE_CACHE_SIZE: ${{ inputs.size }}
        TUIST_ACTION_PATH: ${{ github.action_path }}
      run: bash "$TUIST_ACTION_PATH/setup.sh"
