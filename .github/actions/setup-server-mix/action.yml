name: Setup Server Mix
description: Install mise tools, attach Mix cache volumes, and fetch dependencies for server jobs.

inputs:
  mise-install-args:
    description: Tools to install via mise (passed to install_args)
    required: false
    default: erlang elixir
  restore-mix-cache:
    description: Attach one cache volume holding the server deps and _build ("true"), a volume holding only deps ("deps"), or neither ("false") before fetching dependencies
    required: false
    default: "true"
  mise-cache:
    description: Restore and save mise-action's tool archive cache. Disable only for jobs where installing their tools is measured to be faster.
    required: false
    default: "true"
  mix-os-deps-compile-partition-count:
    description: Lower Mix dependency compilation parallelism for CI runners with tighter memory limits.
    required: false
    default: "3"
  github-token:
    description: GitHub token used by mise to fetch tools (avoids rate limits)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Tune Mix dependency compilation parallelism
      shell: bash
      run: echo "MIX_OS_DEPS_COMPILE_PARTITION_COUNT=${{ inputs.mix-os-deps-compile-partition-count }}" >> "$GITHUB_ENV"
    # ERTS sizes each BEAM's port table from the open-files limit (up to 2^27
    # entries) and allocates it at boot. Where job steps get nofile=2^30, every
    # BEAM holds about 2.1 GB before running anything, and deps.compile's
    # parent plus its OS workers ran 8 GB runners out of memory. Pin the table
    # to the 2^20 entries a 1048576 limit gives.
    - name: Bound the BEAM port table
      shell: bash
      run: echo "ERL_MAX_PORTS=1048576" >> "$GITHUB_ENV"
    - uses: ./.github/actions/mise-install
      with:
        install: ${{ inputs.mise-install-args }}
        cache: ${{ inputs['mise-cache'] }}
        working-directory: server
        github-token: ${{ inputs.github-token || env.MISE_GITHUB_TOKEN }}
    - uses: tuist/cache-volume@v1
      if: ${{ inputs['restore-mix-cache'] == 'true' }}
      with:
        path: |
          server/deps
          server/_build
        key: ci-server-${{ github.job }}-mix-v1
    - uses: tuist/cache-volume@v1
      if: ${{ inputs['restore-mix-cache'] == 'deps' }}
      with:
        path: server/deps
        key: ci-server-${{ github.job }}-deps-v2
    - uses: ./.github/actions/mix-deps-get
      with:
        working-directory: server
        github-token: ${{ inputs.github-token || env.MISE_GITHUB_TOKEN }}
