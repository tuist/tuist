name: Setup Server Mix
description: Install mise tools, restore mix deps + _build cache, fetch hex deps for server jobs.

inputs:
  mise-version:
    description: Version of mise to install
    required: true
  mise-install-args:
    description: Tools to install via mise (passed to install_args)
    required: false
    default: erlang elixir
  mix-cache-key:
    description: |
      Primary cache key prefix for deps + _build (mix.lock hash is appended automatically).
      Default is shared across most server jobs; override if a job needs an isolated mix state
      (e.g. test currently uses mix-test-v2 to keep MIX_ENV=test artifacts separate).
    required: false
    default: mix
  mix-cache-restore-key:
    description: Restore-keys prefix for deps + _build cache fallback
    required: false
    default: mix-
  restore-mix-cache:
    description: Restore the cached server deps + _build state before fetching dependencies
    required: false
    default: "true"
  mix-os-deps-compile-partition-count:
    description: Lower Mix dependency compilation parallelism for CI runners with tighter memory limits.
    required: false
    default: "3"
  github-token:
    description: GitHub token used by mise to fetch tools (avoids rate limits)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Tune Mix dependency compilation parallelism
      shell: bash
      run: echo "MIX_OS_DEPS_COMPILE_PARTITION_COUNT=${{ inputs.mix-os-deps-compile-partition-count }}" >> "$GITHUB_ENV"
    - uses: ./.github/actions/mise-install
      with:
        version: ${{ inputs.mise-version }}
        install: ${{ inputs.mise-install-args }}
        cache: "true"
        working-directory: server
        github-token: ${{ inputs.github-token || env.MISE_GITHUB_TOKEN }}
    - name: Restore Mix Cache
      if: ${{ inputs['restore-mix-cache'] == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          server/deps
          server/_build
        key: ${{ inputs.mix-cache-key }}-${{ hashFiles('server/mix.lock') }}
        restore-keys: |
          ${{ inputs.mix-cache-restore-key }}
    # `mix deps.get` fetches the `github:` / `git:` dependencies in mix.exs
    # over anonymous https, which GitHub rate limits per source IP. The whole
    # Linux runner fleet egresses from two bare-metal hosts, so that budget is
    # shared across every job in the repo and, once crossed, whichever
    # dependency happens to be fetched next fails with a credential prompt
    # (`could not read Username for 'https://github.com'`) on a runner that
    # has no tty. It is intermittent by nature: the repos and pinned SHAs are
    # public and fetch fine from an unthrottled address.
    #
    # Authenticating lifts the fetches onto the token's own budget, the same
    # reason `github-token` is already threaded to mise above.
    - name: Authenticate github.com dependency fetches
      shell: bash
      env:
        GH_DEP_TOKEN: ${{ inputs.github-token || env.MISE_GITHUB_TOKEN || github.token }}
      run: |
        if [ -z "${GH_DEP_TOKEN}" ]; then
          echo "::warning::No GitHub token available; dependency fetches stay anonymous."
          exit 0
        fi
        git config --global \
          url."https://x-access-token:${GH_DEP_TOKEN}@github.com/".insteadOf \
          "https://github.com/"
    - name: Install dependencies
      shell: bash
      working-directory: server
      run: mix deps.get
