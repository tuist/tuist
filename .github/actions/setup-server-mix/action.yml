name: Setup Server Mix
description: Install mise tools, attach Mix cache volumes, and fetch dependencies for server jobs.

inputs:
  mise-install-args:
    description: Tools to install via mise (passed to install_args)
    required: false
    default: erlang elixir
  restore-mix-cache:
    description: Restore the cached server deps + _build state before fetching dependencies
    required: false
    default: "true"
  deps-cache-key:
    description: actions/cache key to restore server/deps from before fetching dependencies. Empty skips it.
    required: false
    default: ""
  save-deps-cache:
    description: Also save server/deps under deps-cache-key when the job succeeds without an exact hit
    required: false
    default: "false"
  mix-os-deps-compile-partition-count:
    description: Lower Mix dependency compilation parallelism for CI runners with tighter memory limits.
    required: false
    default: "3"
  github-token:
    description: GitHub token used by mise to fetch tools (avoids rate limits)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Tune Mix dependency compilation parallelism
      shell: bash
      run: echo "MIX_OS_DEPS_COMPILE_PARTITION_COUNT=${{ inputs.mix-os-deps-compile-partition-count }}" >> "$GITHUB_ENV"
    - uses: ./.github/actions/mise-install
      with:
        install: ${{ inputs.mise-install-args }}
        cache: "true"
        working-directory: server
        github-token: ${{ inputs.github-token || env.MISE_GITHUB_TOKEN }}
    - uses: tuist/cache-volume@v1
      if: ${{ inputs['restore-mix-cache'] == 'true' }}
      with:
        path: server/deps
        key: ci-server-${{ github.job }}-deps-v2
    - uses: tuist/cache-volume@v1
      if: ${{ inputs['restore-mix-cache'] == 'true' }}
      with:
        path: server/_build
        key: ci-server-${{ github.job }}-build-v2
    # After the mise install: dependencies ship .tool-versions files, which
    # would change the key mise-action hashes from the workspace's mise configs.
    - uses: actions/cache/restore@v4
      if: ${{ inputs['deps-cache-key'] != '' && inputs['save-deps-cache'] != 'true' }}
      with:
        path: server/deps
        key: ${{ inputs['deps-cache-key'] }}
    - uses: actions/cache@v4
      if: ${{ inputs['deps-cache-key'] != '' && inputs['save-deps-cache'] == 'true' }}
      with:
        path: server/deps
        key: ${{ inputs['deps-cache-key'] }}
    - uses: ./.github/actions/mix-deps-get
      with:
        working-directory: server
        github-token: ${{ inputs.github-token || env.MISE_GITHUB_TOKEN }}
