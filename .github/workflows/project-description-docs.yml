name: ProjectDescription documentation

on:
  push:
    branches:
      - main
    paths:
      - cli/Sources/ProjectDescription/**
      - Package.swift
      - Package.resolved
      - mise/tasks/docs/project-description.sh
      - .github/workflows/project-description-docs.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - cli/Sources/ProjectDescription/**
      - Package.swift
      - Package.resolved
      - mise/tasks/docs/project-description.sh
      - .github/workflows/project-description-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-description-docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  MISE_VERSION: "2026.5.15"
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-deploy:
    name: Build and deploy
    runs-on: tuist-linux
    timeout-minutes: 30
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Restore Swift Package Manager cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: linux-project-description-docc-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-project-description-docc-
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "swift@6.2.4 node@20.12.0 npm:wrangler@4.30.0 caddy"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      # Swift 6.2's FoundationNetworking traps on a redirect served over HTTP/2
      # (see #12229), and the registry answers 303 to storage over h2. Terminating
      # the first hop as plaintext HTTP/1.1 removes the precondition; the redirect
      # target negotiates http/1.1 on its own, so only this hop needs forcing.
      - name: Front the registry with an HTTP/1.1 proxy
        shell: bash
        run: |
          nohup mise exec caddy -- caddy reverse-proxy \
            --from :8080 --to https://tuist.dev --change-host-header \
            > /tmp/registry-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            sleep 1
          done
          echo "::error::registry proxy did not start listening on :8080"
          cat /tmp/registry-proxy.log || true
          exit 1
      - name: Point SwiftPM at the proxy
        run: >-
          mise exec swift@6.2.4 --
          swift package-registry set --allow-insecure-http
          http://localhost:8080/api/registry/swift
      - name: Build ProjectDescription documentation
        run: >-
          MISE_PROJECT_ROOT="$GITHUB_WORKSPACE" mise exec swift@6.2.4 --
          bash mise/tasks/docs/project-description.sh
      - name: Save Swift Package Manager cache
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - uses: 1password/install-cli-action@v2
        if: github.ref == 'refs/heads/main'
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://tuist/Cloudflare/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://tuist/Cloudflare/CLOUDFLARE_ACCOUNT_ID
        run: >-
          mise exec node@20.12.0 npm:wrangler@4.30.0 -- op run --
          wrangler pages deploy --commit-hash ${{ github.sha }} --branch main
          --project-name tuist-projectdescription .build/documentation
