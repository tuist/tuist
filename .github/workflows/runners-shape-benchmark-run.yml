name: Runners Shape Benchmark Run

# One round of runners-shape-benchmark.yml: the same cold workloads in each
# of `slots` at once.

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        required: true
      shape:
        type: string
        required: true
      pass:
        description: Which pass of the benchmark this round belongs to
        type: number
        default: 1
      guests:
        description: Guests running at once on the host
        type: number
        default: 1
      slots:
        description: JSON array of guest slots to run at once, e.g. "[1, 2]"
        type: string
        default: "[1]"
      app_tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.shape }} x${{ inputs.guests }} pass ${{ inputs.pass }} slot ${{ matrix.slot }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.slots) }}
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      MISE_GITHUB_ATTESTATIONS: 0
      MISE_LOCKED: 1
      TUIST_ENABLE_CACHING: "false"
      SHAPE: ${{ inputs.shape }}
      SLOT: ${{ matrix.slot }}
      GUESTS: ${{ inputs.guests }}
      PASS: ${{ inputs.pass }}
    steps:
      - name: Describe the guest
        run: |
          {
            echo "guest_vcpus=$(sysctl -n hw.ncpu)"
            echo "guest_memory_gib=$(( $(sysctl -n hw.memsize) / 1073741824 ))"
          } >> "$RUNNER_TEMP/result.env"
          cat "$RUNNER_TEMP/result.env"
          sysctl -n machdep.cpu.brand_string
      - uses: actions/checkout@v4
      - name: Skip Xcode macro and package validation
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Start the resource sampler
        run: |
          cat > "$RUNNER_TEMP/sampler.sh" <<'EOF'
          #!/bin/bash
          # Every 5s: epoch, CPU as a share of all vCPUs, and
          # active+wired+compressed memory in GiB.
          ncpu=$(sysctl -n hw.ncpu)
          page=$(sysctl -n hw.pagesize)
          while :; do
            cpu=$(ps -A -o %cpu= | awk -v n="$ncpu" '{s+=$1} END {printf "%.1f", s/n}')
            mem=$(vm_stat | awk -v p="$page" '
              /Pages active/ {gsub(/\./, "", $3); a=$3}
              /Pages wired down/ {gsub(/\./, "", $4); w=$4}
              /occupied by compressor/ {gsub(/\./, "", $5); c=$5}
              END {printf "%.2f", (a+w+c)*p/1073741824}')
            echo "$(date +%s) $cpu $mem" >> "$1"
            sleep 5
          done
          EOF
          chmod +x "$RUNNER_TEMP/sampler.sh"
          nohup "$RUNNER_TEMP/sampler.sh" "$RUNNER_TEMP/samples.txt" >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"
      # Each workload runs into an empty DerivedData with no binary or
      # compilation cache, and its window is kept so CPU figures cover it alone.
      - name: Build the CLI cold, twice
        run: |
          tuist generate tuist --cache-profile none --no-open
          times=()
          for i in 1 2; do
            rm -rf "$RUNNER_TEMP/dd-cli"
            start=$(date +%s)
            rc=0
            xcodebuild build -workspace Tuist.xcworkspace -scheme tuist -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$RUNNER_TEMP/dd-cli" \
              COMPILATION_CACHE_ENABLE_CACHING=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              > "$RUNNER_TEMP/cli-build-$i.log" 2>&1 || rc=$?
            end=$(date +%s)
            tail -n 5 "$RUNNER_TEMP/cli-build-$i.log"
            if [ "$rc" -ne 0 ]; then
              tail -n 60 "$RUNNER_TEMP/cli-build-$i.log"
              exit "$rc"
            fi
            echo "$start $end" >> "$RUNNER_TEMP/cli-windows.txt"
            times+=("$(( end - start ))")
            echo "build $i: $(( end - start ))s"
          done
          rm -rf "$RUNNER_TEMP/dd-cli"
          echo "cli_build_seconds=[$(IFS=,; echo "${times[*]}")]" >> "$RUNNER_TEMP/result.env"
      # Every unit test target and the modules under them: a much wider graph
      # than the CLI alone, so it shows how far extra cores carry.
      - name: Build the unit tests cold
        continue-on-error: true
        run: |
          tuist generate --cache-profile none --no-open
          start=$(date +%s)
          rc=0
          xcodebuild build-for-testing -workspace Tuist.xcworkspace -scheme TuistUnitTests -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-unit" \
            COMPILATION_CACHE_ENABLE_CACHING=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/unit-build.log" 2>&1 || rc=$?
          end=$(date +%s)
          tail -n 5 "$RUNNER_TEMP/unit-build.log"
          [ "$rc" -eq 0 ] || tail -n 60 "$RUNNER_TEMP/unit-build.log"
          echo "$start $end" > "$RUNNER_TEMP/unit-windows.txt"
          rm -rf "$RUNNER_TEMP/dd-unit"
          {
            echo "unit_build_seconds=$(( end - start ))"
            echo "unit_build_exit=$rc"
            echo "unit_build_start=$start"
            echo "unit_build_end=$end"
          } >> "$RUNNER_TEMP/result.env"
          exit "$rc"
      - name: Build and test TuistApp cold
        if: ${{ inputs.app_tests }}
        continue-on-error: true
        run: |
          start=$(date +%s)
          set +e
          tuist test TuistApp --no-selective-testing --no-binary-cache -- \
            COMPILATION_CACHE_ENABLE_CACHING=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40
          rc=${PIPESTATUS[0]}
          {
            echo "app_test_seconds=$(( $(date +%s) - start ))"
            echo "app_test_exit=$rc"
          } >> "$RUNNER_TEMP/result.env"
          exit "$rc"
      - name: Record the result
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/sampler.pid")" 2>/dev/null || true
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/result.env"
          # CPU over one workload's windows: average, and share of samples at
          # or above 90%.
          window_stats() {
            awk '
              NR == FNR {ws[NR] = $1; we[NR] = $2; nw = NR; next}
              {for (i = 1; i <= nw; i++) if ($1 >= ws[i] && $1 <= we[i]) {n++; s += $2; if ($2 >= 90) p++; break}}
              END {if (n) printf "%.0f %.0f\n", s/n, p*100/n; else print "null null"}' \
              "$1" "$RUNNER_TEMP/samples.txt" 2>/dev/null || echo "null null"
          }
          read -r cli_cpu cli_pegged <<< "$(window_stats "$RUNNER_TEMP/cli-windows.txt")"
          read -r unit_cpu unit_pegged <<< "$(window_stats "$RUNNER_TEMP/unit-windows.txt")"
          peak=$(awk '{if ($3 > m) m = $3} END {printf "%.1f\n", m + 0}' "$RUNNER_TEMP/samples.txt" 2>/dev/null || echo null)
          mkdir -p bench
          out="bench/$SHAPE-x$GUESTS-p$PASS-$SLOT.json"
          cat > "$out" <<EOF
          {
            "shape": "$SHAPE",
            "guests": $GUESTS,
            "pass": $PASS,
            "slot": $SLOT,
            "guest_vcpus": ${guest_vcpus:-null},
            "guest_memory_gib": ${guest_memory_gib:-null},
            "cli_build_seconds": ${cli_build_seconds:-null},
            "cli_avg_cpu_percent": ${cli_cpu},
            "cli_pegged_percent": ${cli_pegged},
            "unit_build_seconds": ${unit_build_seconds:-null},
            "unit_build_exit": ${unit_build_exit:-null},
            "unit_build_start": ${unit_build_start:-null},
            "unit_build_end": ${unit_build_end:-null},
            "unit_avg_cpu_percent": ${unit_cpu},
            "unit_pegged_percent": ${unit_pegged},
            "app_test_seconds": ${app_test_seconds:-null},
            "app_test_exit": ${app_test_exit:-null},
            "peak_memory_gib": ${peak}
          }
          EOF
          cat "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ inputs.shape }}-x${{ inputs.guests }}-p${{ inputs.pass }}-${{ matrix.slot }}
          path: bench/*.json
