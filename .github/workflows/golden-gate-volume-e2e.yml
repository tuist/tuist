# Temporary: finds which write path corrupts files on a Tuist cache volume
# on a Golden Gate (macOS 27) guest. Round 1 showed plain shell writes read
# back intact while SwiftPM's registry downloads came back corrupt, only on
# Golden Gate with a volume (local disk and Tahoe pass).
name: Golden Gate volume e2e

on:
  push:
    branches: [golden-gate-volume-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.runs_on }} / ${{ matrix.storage }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runs_on: [tuist-macos-golden-gate, tuist-macos]
        storage: [volume]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Report the guest
        run: |
          sw_vers
          xcodebuild -version
      - if: matrix.storage == 'volume'
        uses: tuist/cache-volume@v1
        with:
          key: golden-gate-e2e-${{ github.run_id }}-${{ strategy.job-index }}
          path: ~/.cache/tuist-ci/golden-gate-e2e
      - name: Pick the build root
        run: |
          set -euo pipefail
          root="$HOME/.cache/tuist-ci/golden-gate-e2e"
          mkdir -p "$root"
          echo "E2E_ROOT=$root" >> "$GITHUB_ENV"
          echo "E2E_REAL=$(cd "$root" && pwd -P)" >> "$GITHUB_ENV"
          mount | grep -iE 'tuist' || true
      # Round 9: the fix. tuist-cache-volume built from this branch declines
      # share-backed images on macOS 27 and attaches them as before on 26.
      - name: Patched tuist-cache-volume
        run: |
          set -euo pipefail
          (cd infra/linux-runner-image && mise x go@1.26.10 -- go build -o /tmp/tcv ./cmd/tuist-cache-volume)
          mkdir -p "$HOME/fixcheck" && cd "$HOME/fixcheck"
          /tmp/tcv --key "golden-gate-fix-${{ github.run_id }}" --path ./cached || echo "exit $?"
          ls -la "$HOME/fixcheck"; [ -L ./cached ] && echo "cached -> $(readlink ./cached)" || echo "cached is a plain directory"
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 27 ]; then
            echo "checkout: $(/tmp/tcv --checkout "$HOME/fixws/repo")"
          fi
      - uses: ./.github/actions/mise-install
        with:
          install: "erlang elixir"
          working-directory: server
      # What a gated Golden Gate job does: no image on the share at all.
      - name: Fresh clone on the root disk
        run: |
          git clone -q --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}" "$HOME/src"
          echo "NIF_SRC=$HOME/src/server" >> "$GITHUB_ENV"
          echo "E2E_ROOT=$HOME/nifroot" >> "$GITHUB_ENV"
          echo "MISE_TRUSTED_CONFIG_PATHS=${MISE_TRUSTED_CONFIG_PATHS:-}:$HOME/src" >> "$GITHUB_ENV"
      - name: Build the xcresult NIF
        id: build
        working-directory: ${{ env.NIF_SRC }}
        env:
          TUIST_NIF_BUILD_ROOT: ${{ env.E2E_ROOT }}/nif
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          start=$(date +%s)
          for n in 1 2; do
            rm -rf "$E2E_ROOT"; start=$(date +%s)
            ./native/xcresult_nif/build.sh
            echo "build $n built in $(( $(date +%s) - start )) s"
          done
      - name: Inspect corrupt registry files
        if: always()
        run: |
          set +e
          d="$E2E_ROOT/nif/xcresult_nif/registry/downloads"
          find "$d" -name '.registry-metadata' -o -name 'Package.swift' -maxdepth 6 2>/dev/null | while read -r f; do
            s=$(stat -f %z "$f"); first=$(head -c 1 "$f" | xxd -p)
            if [ "$s" = 0 ] || [ "$first" != "7b" -a "$(basename "$f")" = .registry-metadata ]; then
              echo "== $f size=$s"; ls -la@ "$f"; xxd "$f" | head -4
            fi
          done | head -60
