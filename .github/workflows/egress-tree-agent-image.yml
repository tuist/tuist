name: Egress Tree Agent Image

# PR validation + ad-hoc image build for egress-tree-agent, the DaemonSet
# that enforces the kura per-tenant egress floors/ceilings and the node box
# cap through a shared per-node HTB tree (infra/egress-tree-agent/).
#
# Steady-state image promotion is owned by the deployment pipeline; this
# workflow only handles pre-release iteration via `:sha-<git-sha>` tags.

on:
  push:
    branches:
      - main
    paths:
      - infra/egress-tree-agent/**
      - .github/workflows/egress-tree-agent-image.yml
  pull_request:
    paths:
      - infra/egress-tree-agent/**
      - .github/workflows/egress-tree-agent-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/egress-tree-agent

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/egress-tree-agent/go.mod
          cache-dependency-path: infra/egress-tree-agent/go.sum
      - name: Test
        working-directory: infra/egress-tree-agent
        run: go test ./...
      - name: Vet
        working-directory: infra/egress-tree-agent
        run: go vet ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/egress-tree-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=egress-tree-agent
          cache-to: type=gha,mode=max,scope=egress-tree-agent
