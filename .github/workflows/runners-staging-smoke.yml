name: Xcode 27.1 staging validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/chore/add-release-to-ci'
    runs-on: tuist-linux
    environment: server-k8s-staging
    concurrency:
      group: server-deploy-staging-deploy
      cancel-in-progress: false
    timeout-minutes: 75
    outputs:
      runner_label: ${{ steps.profile.outputs.runner_label }}
      profile_created: ${{ steps.profile.outputs.profile_created }}
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8bd05a85d4e1a33ba2f22ed22b0785d05830aba
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl node yq"
          cache: "false"
      - uses: 1password/install-cli-action@v4
        with:
          version: 2.31.1
      - name: Load staging deployment credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-staging" --vault tuist-k8s-staging --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Preflight exact additive changes against the installed chart
        run: |
          set -euo pipefail
          umask 077
          [ "$(helm status tuist -n tuist-staging -o json | jq -r '.version')" = 816 ]
          [ "$(helm status tuist-xcresult-processor -n tuist-staging -o json | jq -r '.version')" = 2 ]
          helm get values tuist -n tuist-staging -o json > current-values.json
          node <<'JS'
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync('current-values.json'));
          const versions = current.runnersFleet.xcodeVersions;
          if (versions.some(v => v.xcodeVersion === '27.1')) throw new Error('Stable already present: re-plan rather than overwrite');
          versions.splice(1, 0, {xcodeVersion: '27.1'});
          fs.writeFileSync('stable-overlay.json', JSON.stringify({runnersFleet: {
            xcodeVersions: versions,
            xcodeOverrides: {'27.1': {imageTag: 'macos-27-1-0.36.0', autoscaling: {enabled: true, minWarmPoolFloor: 0, maxReplicas: 1}}}
          }}));
          JS
          helm get manifest tuist -n tuist-staging > before-tuist.yaml
          helm upgrade tuist infra/helm/tuist -n tuist-staging --reuse-values --no-hooks --dry-run=server -o json -f stable-overlay.json > plan-tuist.json
          jq -r .manifest plan-tuist.json > after-tuist.yaml
          helm get manifest tuist-xcresult-processor -n tuist-staging > before-processor.yaml
          helm upgrade tuist-xcresult-processor infra/helm/xcresult-processor -n tuist-staging --reuse-values --no-hooks --dry-run=server -o json --set-string xcresultProcessor.image.tag=0.206.0 > plan-processor.json
          jq -r .manifest plan-processor.json > after-processor.yaml
          for file in before-tuist after-tuist before-processor after-processor; do
            yq eval-all -o=json -I=0 '[.]' "$file.yaml" > "$file.json"
          done
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const {isDeepStrictEqual: same} = require('node:util');
          const read = name => new Map(JSON.parse(fs.readFileSync(name + '.json')).filter(Boolean).map(r => [JSON.stringify([r.kind, r.metadata.namespace, r.metadata.name]), r]));
          for (const release of ['tuist', 'processor']) {
            const before = read('before-' + release), after = read('after-' + release);
            assert([...before.keys()].every(k => after.has(k)), 'No removals');
            const added = [...after.keys()].filter(k => !before.has(k));
            const changed = [...before.keys()].filter(k => !same(before.get(k), after.get(k)));
            assert.equal(changed.length, 1);
            const original = structuredClone(before.get(changed[0])), planned = after.get(changed[0]);
            assert.equal(original.kind, 'Deployment');
            if (release === 'tuist') {
              assert.deepEqual(added.map(k => after.get(k).metadata.name).sort(), ['tuist-tuist-runner-pool-macos-27-1', 'tuist-tuist-runner-pool-macos-ber1-27-1']);
              for (const key of added) {
                assert.equal(after.get(key).kind, 'RunnerPool');
                assert.equal(after.get(key).spec.image, 'ghcr.io/tuist/tuist-runner:macos-27-1-0.36.0');
              }
              assert.equal(original.metadata.name, 'tuist-tuist-server');
              original.spec.template.spec.containers.forEach((c, i) => {
                c.env = c.env.map(e => ['TUIST_RUNNER_MACOS_XCODE_VERSIONS', 'TUIST_RUNNERS_SITE_POOLS'].includes(e.name) ? planned.spec.template.spec.containers[i].env.find(n => n.name === e.name) : e);
              });
            } else {
              assert.equal(added.length, 0);
              assert.equal(original.metadata.name, 'tuist-tuist-xcresult-processor');
              const container = original.spec.template.spec.containers.find(c => c.image === 'ghcr.io/tuist/tuist-xcresult-processor:0.196.2');
              assert(container, 'Expected current processor image');
              container.image = 'ghcr.io/tuist/tuist-xcresult-processor:0.206.0';
              // The chart emits this upgrade-only clearing field; the API prunes null.
              if (planned.spec.strategy.type === 'Recreate' && planned.spec.strategy.rollingUpdate === null) delete planned.spec.strategy.rollingUpdate;
            }
            assert(same(original, planned), 'No unrelated resource changes');
          }
          console.log('Preflight passed: exactly two new stable pools, catalog environment, and processor image; nothing else changes.');
          JS
      - name: Apply additive stable pools without changing the experimental chart
        run: |
          set -euo pipefail
          helm upgrade tuist infra/helm/tuist -n tuist-staging --reuse-values --no-hooks --rollback-on-failure --wait --timeout 10m -f stable-overlay.json
          kubectl rollout status deployment/tuist-tuist-server -n tuist-staging --timeout=120s
          helm upgrade tuist-xcresult-processor infra/helm/xcresult-processor -n tuist-staging --reuse-values --no-hooks --rollback-on-failure --wait --timeout 30m --set-string xcresultProcessor.image.tag=0.206.0
          kubectl rollout status deployment/tuist-tuist-xcresult-processor -n tuist-staging --timeout=120s
      - name: Create isolated staging smoke profile
        id: profile
        run: |
          set -euo pipefail
          name="xcode271-smoke-${GITHUB_RUN_ID}"
          kubectl exec -n tuist-staging deployment/tuist-tuist-server -- env SMOKE_PROFILE_NAME="$name" /app/bin/tuist eval '
          Application.load(:tuist)
          {:ok, _, _} = Ecto.Migrator.with_repo(Tuist.Repo, fn _ ->
            account = Tuist.Accounts.get_account_by_handle("tuist") || raise "Missing internal account"
            name = System.fetch_env!("SMOKE_PROFILE_NAME")
            if Tuist.Runners.Profiles.get_by_name(account, name), do: raise("Refuse to reuse an existing profile")
            unless Tuist.Runners.Profile.prefix() == "tuist-staging-", do: raise("Not staging")
            {:ok, _} = Tuist.Runners.Profiles.create(account, %{name: name, platform: "macos", vcpus: 6, memory_gb: 14, xcode_version: "27.1", cache_writer_default_branch: false})
            IO.puts("Created isolated stable smoke profile")
          end)
          '
          echo "runner_label=tuist-staging-${name}" >> "$GITHUB_OUTPUT"
          echo "profile_created=true" >> "$GITHUB_OUTPUT"

  smoke:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner_label }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      test_run_id: ${{ steps.upload.outputs.test_run_id }}
    steps:
      - name: Verify stable toolchain and expected build
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 27.1' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 27A9275' "$RUNNER_TEMP/xcode-version.txt"
          [ "$(xcode-select -p)" = /Applications/Xcode_27.1.app/Contents/Developer ]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked tuist"
          cache: "false"
      - name: Generate isolated macOS library and XCTest project
        run: |
          set -euo pipefail
          echo "TUIST_BIN=$(mise which tuist)" >> "$GITHUB_ENV"
          fixture="$RUNNER_TEMP/xcode271-smoke"
          mkdir -p "$fixture/Sources" "$fixture/Tests"
          cat > "$fixture/Tuist.swift" <<'SWIFT'
          import ProjectDescription
          let tuist = Tuist(fullHandle: "tuist/tuist", url: "https://staging.tuist.dev", project: .tuist())
          SWIFT
          cat > "$fixture/Project.swift" <<'SWIFT'
          import ProjectDescription
          let project = Project(name: "Smoke", targets: [
              .target(name: "Smoke", destinations: [.mac], product: .framework, bundleId: "dev.tuist.xcode271.smoke", infoPlist: .default, sources: ["Sources/**"]),
              .target(name: "SmokeTests", destinations: [.mac], product: .unitTests, bundleId: "dev.tuist.xcode271.smoke.tests", infoPlist: .default, sources: ["Tests/**"], dependencies: [.target(name: "Smoke")])
          ], schemes: [.scheme(name: "Smoke", shared: true, buildAction: .buildAction(targets: ["Smoke"]), testAction: .targets(["SmokeTests"]))])
          SWIFT
          cat > "$fixture/Sources/Smoke.swift" <<'SWIFT'
          public enum Smoke { public static func sum(_ a: Int, _ b: Int) -> Int { a + b } }
          SWIFT
          cat > "$fixture/Tests/SmokeTests.swift" <<'SWIFT'
          import XCTest
          @testable import Smoke
          final class SmokeTests: XCTestCase {
              func testStableToolchain() { XCTAssertEqual(Smoke.sum(2, 3), 5) }
          }
          SWIFT
          "$(mise which tuist)" generate --path "$fixture" --no-open
      - name: Build and run XCTest on stable 27.1
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/xcode271-smoke"
          TUIST_INSPECT_TEST_MODE=off xcodebuild test -workspace "$fixture/Smoke.xcworkspace" -scheme Smoke -destination 'platform=macOS' -derivedDataPath "$fixture/DerivedData" -resultBundlePath "$fixture/Smoke.xcresult" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Upload xcresult for remote staging processing
        id: upload
        env:
          TUIST_INSPECT_TEST_WAIT: "YES"
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/xcode271-smoke"
          "$TUIST_BIN" auth login --url https://staging.tuist.dev
          "$TUIST_BIN" inspect test "$fixture/Smoke.xcresult" --path "$fixture" --mode remote 2>&1 | tee "$RUNNER_TEMP/xcresult-upload.log"
          id=$(grep -Eo 'https://staging.tuist.dev/tuist/tuist/tests/[0-9a-f-]{36}' "$RUNNER_TEMP/xcresult-upload.log" | tail -1 | awk -F/ '{print $NF}')
          [ -n "$id" ]
          echo "test_run_id=$id" >> "$GITHUB_OUTPUT"

  verify-and-cleanup:
    if: always() && needs.prepare.outputs.profile_created == 'true'
    needs: [prepare, smoke]
    runs-on: tuist-linux
    environment: server-k8s-staging
    timeout-minutes: 15
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8bd05a85d4e1a33ba2f22ed22b0785d05830aba
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v4
        with:
          version: 2.31.1
      - name: Load staging deployment credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-staging" --vault tuist-k8s-staging --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify successful server-side processing and persisted test case
        if: needs.smoke.result == 'success'
        env:
          TEST_RUN_ID: ${{ needs.smoke.outputs.test_run_id }}
        run: |
          set -euo pipefail
          kubectl exec -n tuist-staging deployment/tuist-tuist-server -- env SMOKE_TEST_RUN_ID="$TEST_RUN_ID" /app/bin/tuist eval '
          Application.load(:tuist)
          {:ok, _, _} = Ecto.Migrator.with_repo(Tuist.IngestRepo, fn repo ->
            {:ok, id} = Ecto.UUID.cast(System.fetch_env!("SMOKE_TEST_RUN_ID"))
            Enum.reduce_while(1..60, nil, fn _, _ ->
              result = repo.query!("SELECT status, xcode_version FROM test_runs WHERE id = '\''#{id}'\'' ORDER BY inserted_at DESC LIMIT 1")
              case result.rows do
                [["success", xcode]] ->
                  unless String.starts_with?(xcode, "27.1"), do: raise("Unexpected Xcode: #{xcode}")
                  [[count]] = repo.query!("SELECT count() FROM test_case_runs WHERE test_run_id = '\''#{id}'\'' AND status = '\''success'\''").rows
                  if count < 1, do: raise("No persisted passing test case")
                  IO.puts(Jason.encode!(%{test_run_id: id, status: "success", xcode_version: xcode, passing_test_cases: count}))
                  {:halt, :ok}
                [[status, _]] when status in ["failed_processing", "failure"] -> raise "Processing failed: #{status}"
                _ -> Process.sleep(5_000); {:cont, nil}
              end
            end) || raise "Timed out waiting for xcresult processing"
          end)
          '
      - name: Remove only the isolated smoke profile
        if: always()
        run: |
          set -euo pipefail
          kubectl exec -n tuist-staging deployment/tuist-tuist-server -- env SMOKE_PROFILE_NAME="xcode271-smoke-${GITHUB_RUN_ID}" /app/bin/tuist eval '
          Application.load(:tuist)
          {:ok, _, _} = Ecto.Migrator.with_repo(Tuist.Repo, fn _ ->
            account = Tuist.Accounts.get_account_by_handle("tuist") || raise "Missing internal account"
            case Tuist.Runners.Profiles.get_by_name(account, System.fetch_env!("SMOKE_PROFILE_NAME")) do
              nil -> IO.puts("Smoke profile already absent")
              profile ->
                unless profile.xcode_version == "27.1" and not profile.protected and not profile.cache_writer_default_branch, do: raise("Unexpected profile; refusing deletion")
                {:ok, _} = Tuist.Runners.Profiles.delete(profile)
                IO.puts("Removed isolated smoke profile")
            end
          end)
          '
