name: Runner account smoke (temporary)

on:
  push:
    branches:
      - claude/runner-single-account

jobs:
  smoke:
    runs-on: tuist-ber1-smoke
    timeout-minutes: 30
    steps:
      - name: Account
        run: |
          set -euo pipefail
          echo "whoami=$(whoami) uid=$(id -u) home=$HOME"
          [ "$(whoami)" = runner ] && [ "$(id -u)" = 501 ] && [ "$HOME" = /Users/runner ]
          ! id admin >/dev/null 2>&1
          [ "$(dscl . -read /Users/runner NFSHomeDirectory | awk '{ print $2 }')" = /Users/runner ]
          [ "$(readlink /Users/admin)" = /Users/runner ]
          echo "console owner: $(stat -f %Su /dev/console)"
          [ "$(stat -f %Su /dev/console)" = runner ]
          sudo -n true
          stat -f '%Su %N' /opt/homebrew "$HOME/.zprofile" "$HOME/.rbenv" "$HOME/actions-runner"

      - name: Login-shell tooling
        shell: zsh -l {0}
        run: |
          set -euo pipefail
          for tool in brew mise rbenv ruby xcrun; do command -v "$tool"; done
          rbenv versions
          ruby -v
          xcrun metal --version | head -1
          HOMEBREW_NO_AUTO_UPDATE=1 brew install hello >/dev/null && hello && HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall hello >/dev/null

      - name: Login keychain unlocked
        run: |
          security show-keychain-info "$HOME/Library/Keychains/login.keychain-db"

      - name: Finder automation
        run: |
          set -euo pipefail
          osascript -e 'with timeout of 20 seconds' -e 'tell application "Finder" to get name of startup disk' -e 'end timeout'

      - name: create-dmg end to end
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg >/dev/null 2>&1
          mkdir -p /tmp/app/Diag.app/Contents/MacOS
          printf '#!/bin/sh\n' > /tmp/app/Diag.app/Contents/MacOS/Diag && chmod +x /tmp/app/Diag.app/Contents/MacOS/Diag
          rm -f /tmp/Diag-out.dmg
          start=$(date +%s)
          create-dmg --window-size 605 363 --icon Diag.app 139 161 --app-drop-link 467 161 --volname Diag /tmp/Diag-out.dmg /tmp/app
          echo "create-dmg took $(( $(date +%s) - start ))s"
