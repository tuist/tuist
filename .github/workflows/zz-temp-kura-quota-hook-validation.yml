name: TEMP Kura quota hook validation

# TEMPORARY. Delete once it has reported.
#
# Exercises the local-path provisioner's quota hook against a REAL XFS
# filesystem with real xfs_quota, rather than the stubs used locally.
#
# It exists because the stubs validated a model of xfs_quota rather than
# xfs_quota. Review caught one instance of that: `project -c` prints a
# "Processed N ... paths" footer whether or not anything is wrong, the filter
# dropped only the leading line, and setup would have exited 1 on every volume
# of every working box. The same class of risk sits unexercised in `limit -p`,
# the `report -p -N -b` column parsing, the `state -p` grep, and
# `project -s` / `-C`.
#
# The hook is extracted from the RENDERED chart, not from a copy, so this tests
# the bytes that actually ship.

on:
  # Branch-scoped push, because workflow_dispatch only resolves workflows that
  # already exist on the default branch. Goes away with the rest of this file.
  push:
    branches: [claude/kura-per-account-storage-quotas]
  workflow_dispatch: {}

jobs:
  quota-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs and helm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create a real XFS filesystem with project quotas at /data
        run: |
          set -euxo pipefail
          # Non-sparse: a sparse image would let the inner filesystem believe in
          # space the outer one does not have, which is its own failure mode.
          sudo truncate -s 2G /xfs.img
          sudo mkfs.xfs -q /xfs.img
          sudo mkdir -p /data
          sudo mount -o loop,prjquota /xfs.img /data
          findmnt -no FSTYPE,OPTIONS /data
          sudo xfs_quota -x -c "state -p" /data

      - name: Extract the hook exactly as the chart renders it
        run: |
          set -euxo pipefail
          helm template t infra/helm/tuist \
            --set capi.enabled=true --set kuraFleet.enabled=true \
            --set server.license.key=dummy \
            -s templates/kura-fleet-storage.yaml > /tmp/rendered.yaml
          yq 'select(.kind=="ConfigMap") | .data.setup' /tmp/rendered.yaml \
            | sed -n "/^PROGRAM=\$(cat <<'TUIST_QUOTA_EOF'\$/,/^TUIST_QUOTA_EOF\$/p" \
            | sed '1d;$d' > /tmp/program.sh
          test -s /tmp/program.sh
          echo "--- extracted $(wc -l < /tmp/program.sh) lines ---"

      - name: Assign a quota, and prove it is ENFORCED and not merely recorded
        run: |
          set -euxo pipefail
          VOL=/data/vol/pvc-test_kura_acct
          sudo mkdir -p "$VOL"

          # 16 MiB so overrunning it is fast. The hook floors inodes at 65536
          # regardless, which is deliberate.
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota assign "$VOL" $((16 * 1024 * 1024))

          echo "--- /etc/projects ---"; sudo cat /etc/projects
          echo "--- report ---"; sudo xfs_quota -x -c "report -p -N -b" /data

          # The real test: write past the ceiling and require ENOSPC. No stub can
          # prove this, and it is the entire point of the feature.
          if sudo dd if=/dev/zero of="$VOL/blob" bs=1M count=64 2>/tmp/dd.err; then
            echo "FAIL: wrote 64 MiB into a 16 MiB quota; the ceiling is not enforced"
            exit 1
          fi
          grep -qiE "no space left|disk quota exceeded" /tmp/dd.err || {
            echo "FAIL: write failed for the wrong reason:"; cat /tmp/dd.err; exit 1; }
          echo "PASS: write past the quota was refused"
          du -sh "$VOL"

      - name: Re-assigning the same volume is idempotent
        run: |
          set -euxo pipefail
          VOL=/data/vol/pvc-test_kura_acct
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota assign "$VOL" $((16 * 1024 * 1024))
          lines=$(sudo grep -c ":$VOL$" /etc/projects)
          [ "$lines" = "1" ] || { echo "FAIL: /etc/projects has $lines entries for the volume"; exit 1; }
          echo "PASS: one registry entry after a retry"

      - name: Clearing on delete releases the ceiling and the registry entry
        run: |
          set -euxo pipefail
          VOL=/data/vol/pvc-test_kura_acct
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota clear "$VOL"
          sudo rm -rf "$VOL"
          if sudo grep -q ":$VOL$" /etc/projects 2>/dev/null; then
            echo "FAIL: the registry entry survived the clear"; exit 1
          fi
          echo "PASS: registry entry removed"
          sudo xfs_quota -x -c "report -p -N -b" /data

      - name: Colliding project ids are stepped past, not shared
        run: |
          set -euxo pipefail
          A=/data/vol/collide-a
          B=/data/vol/collide-b
          sudo mkdir -p "$A" "$B"
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota assign "$A" $((16 * 1024 * 1024))
          # Force the collision: point B's would-be id at A by hand, so the probe
          # has to step past it rather than sharing one ceiling between tenants.
          idA=$(sudo grep ":$A$" /etc/projects | cut -d: -f1)
          sudo sh -c "printf '%s:%s\n' \"$idA\" \"$B-decoy\" >> /etc/projects"
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota assign "$B" $((32 * 1024 * 1024))
          idB=$(sudo grep ":$B$" /etc/projects | cut -d: -f1)
          [ "$idA" != "$idB" ] || { echo "FAIL: both volumes share project $idA"; exit 1; }
          echo "PASS: distinct projects ($idA vs $idB)"
          # And clearing one must not strip the other's ceiling.
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota clear "$A"
          hard=$(sudo xfs_quota -x -c "report -p -N -b" /data | awk -v p="#$idB" '$1==p {print $4}')
          [ "$hard" = "32768" ] || { echo "FAIL: surviving volume hard limit is '$hard' KiB, want 32768"; exit 1; }
          echo "PASS: clearing one volume left the other bounded at ${hard} KiB"
          sudo rm -rf "$A" "$B"

      - name: A volume on a filesystem without project quotas is left alone
        run: |
          set -euxo pipefail
          # The property that protects boxes installed before the split layout:
          # provisioning must keep working there rather than failing closed.
          sudo truncate -s 512M /plain.img
          sudo mkfs.xfs -q /plain.img
          sudo mkdir -p /plain
          sudo mount -o loop /plain.img /plain
          sudo umount /data
          sudo mount -o loop /xfs.img /data        # remount WITHOUT prjquota
          sudo mkdir -p /data/vol/pvc-legacy
          sudo sh -c "$(cat /tmp/program.sh)" tuist-kura-quota assign /data/vol/pvc-legacy $((16 * 1024 * 1024))
          echo "PASS: exited 0 on a filesystem that cannot enforce"

      - name: Tear down
        if: always()
        run: |
          sudo umount /data /plain 2>/dev/null || true
          sudo rm -f /xfs.img /plain.img
