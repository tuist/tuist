name: S3 Key Rotator Image

# Tests and builds the S3 key rotator (infra/s3-key-rotator), the CronJob that
# mints short-lived Tigris keys for the platform bucket. Pushes to main and
# manual dispatches publish `:sha-<git-sha>`; main also moves `:latest`. Set the
# sha tag as `s3KeyRotation.image.tag`; there is no release tag yet.

on:
  push:
    branches:
      - main
    paths:
      - infra/s3-key-rotator/**
      - .github/workflows/s3-key-rotator-image.yml
  pull_request:
    paths:
      - infra/s3-key-rotator/**
      - .github/workflows/s3-key-rotator-image.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/tuist-s3-key-rotator

jobs:
  test:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/s3-key-rotator/go.mod
          cache-dependency-path: infra/s3-key-rotator/go.sum
      - name: Test
        working-directory: infra/s3-key-rotator
        run: go test ./...
      - name: Vet
        working-directory: infra/s3-key-rotator
        run: go vet ./...

  build:
    needs: test
    if: github.repository == 'tuist/tuist' && github.event_name != 'pull_request'
    runs-on: tuist-linux
    # Only the job that publishes, which never runs pull request code, can
    # write packages.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/s3-key-rotator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=s3-key-rotator
          cache-to: type=gha,mode=max,scope=s3-key-rotator
