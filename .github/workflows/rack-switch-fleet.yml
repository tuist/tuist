# The rack switch fleet's guards, run without a human.
#
# Most of this suite exists to catch an edit that looks like tidying: moving the
# two storage nodes onto one ToR, recording a management link on the MS-01 NIC
# that has no AMT, putting two probes on one Modbus address. Those are made by
# someone who has never read the pull request that introduced them, months from
# now, and a guard that only fires when somebody remembers to run it locally is
# not much better than a comment.
#
# It needs no hardware: everything runs against a committed transcript taken off
# a live switch and against a fake switch on PATH.
#
# Linux, not macOS, because the guards worth running on every pull request are
# pure data and cost seconds here. The handful of cases that drive the TFTP path
# skip themselves: `route -n get`, `ipconfig getifaddr` and a launchd `tftpd` are
# macOS-only, which is fine for a tool run from an operator's laptop. The safety
# property those cases exist for, that a pushed configuration always carries a
# login, is checked separately and runs everywhere.
name: Rack Switches

on:
  push:
    branches:
      - main
    paths:
      - infra/rack-switch-fleet/**
      - infra/rack-switch-prep/**
      - infra/rack-nodes/**
      - infra/cluster-api-provider-tuist/internal/rackinstall/**
      - infra/cluster-api-provider-tuist/cmd/rack-seed/**
      - infra/helm/tuist/values-managed-*.yaml
      - infra/helm/tuist/crds/tuist.dev_rackswitches.yaml
      - infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_rackpdus.yaml
      - infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_rackatses.yaml
      - infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_racksites.yaml
      - infra/helm/omada/**
      - infra/helm/rack-edge/sites/**
      - infra/helm/tuist/rack-sites/**
      - mise/tasks/rack/**
      - .github/workflows/rack-switch-fleet.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - infra/rack-switch-fleet/**
      - infra/rack-switch-prep/**
      - infra/rack-nodes/**
      - infra/cluster-api-provider-tuist/internal/rackinstall/**
      - infra/cluster-api-provider-tuist/cmd/rack-seed/**
      - infra/helm/tuist/values-managed-*.yaml
      - infra/helm/tuist/crds/tuist.dev_rackswitches.yaml
      - infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_rackpdus.yaml
      - infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_rackatses.yaml
      - infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_racksites.yaml
      - infra/helm/omada/**
      - infra/helm/rack-edge/sites/**
      - infra/helm/tuist/rack-sites/**
      - mise/tasks/rack/**
      - .github/workflows/rack-switch-fleet.yml
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: rack-switches-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}

jobs:
  checks:
    name: Render, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    outputs:
      environments: ${{ steps.environments.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          # Only what this needs. Installing the whole toolchain to run jq and
          # bats would cost minutes per pull request.
          install_args: jq bats helm
          cache: "false"

      # The envs whose clusters the sites belong to, by each site's
      # kubernetes.namespace, for the objects job below.
      - name: The rack's envs
        id: environments
        run: |
          set -euo pipefail
          environments="$(for site in infra/rack-switch-fleet/sites/*.json; do
            jq -e '.kubernetes.namespace' "$site" >/dev/null || continue
            infra/rack-switch-fleet/fleet.sh --site "$(basename "$site" .json)" env
          done | sort -u | jq -R . | jq -cs .)"
          echo "$environments"
          echo "environments=$environments" >> "$GITHUB_OUTPUT"

      # The committed configs are the reviewed artefact. If they no longer match
      # what the site definitions render, the diff a reviewer read is not the
      # one that would be applied.
      - name: The rendered configs match the site definitions
        run: |
          set -euo pipefail
          for site in infra/rack-switch-fleet/sites/*.json; do
            echo "::group::$(basename "$site" .json)"
            mise run rack:fleet --site "$(basename "$site" .json)" render --check
            echo "::endgroup::"
          done

      - name: Test the fleet configuration
        run: mise run rack:fleet-test

      # A BIRD configuration that does not parse would leave the edges'
      # BGP container restarting, with the site's prefixes unannounced. Parsed
      # by the runner's own BIRD 2 from the Ubuntu archive, not in a container:
      # anonymous pulls from both Docker Hub and public ECR get refused on
      # shared runners, and a refused pull here skips the objects job on main.
      # Ubuntu's BIRD can be a few minor releases behind the edge image's
      # Alpine one; a configuration that relies on something newer fails here,
      # loudly, rather than passing.
      - name: The edges' BIRD configurations parse
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bird2
          bird --version
          for conf in infra/helm/rack-edge/sites/*/bird.conf; do
            [ -e "$conf" ] || continue
            bird -p -c "$conf"
            echo "parses: $conf"
          done

      # The console bring-up had no tests at all, and it is the one that runs
      # first at a new site, on a machine that is not the one it was written on.
      - name: Test the console bring-up
        run: mise run rack:prep-test

      # The stick renders its seed with the operator's Go renderer.
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/cluster-api-provider-tuist/go.mod
          cache-dependency-path: infra/cluster-api-provider-tuist/go.sum

      - name: Test the rack node installs
        run: mise run rack:nodes-test

      # omada-deployment.yml deploys only to the env the rack is in, so the
      # other env's values would go stale unnoticed until the rack moves.
      - name: The Omada chart renders with every env's values
        run: |
          set -euo pipefail
          helm dependency update infra/helm/omada
          for values in infra/helm/omada/values-*.yaml; do
            helm template omada infra/helm/omada \
              -f infra/helm/omada/values.yaml -f "$values" > /dev/null
            echo "renders with $(basename "$values")"
          done

      - name: Lint the shell
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)
          # From inside the directory, so the sourced libraries resolve.
          (cd infra/rack-switch-fleet && shellcheck -x fleet.sh ztp.sh omada.sh lib/*.sh)
          (cd infra/rack-nodes && shellcheck -x *.sh)
          shellcheck mise/tasks/rack/*.sh

      # A hash in git history cannot be removed without rewriting it, and every
      # export off a switch carries one. backup redacts and probe-tftp writes
      # outside the repository; this is the check that both stay true.
      - name: No credential hash is committed
        run: |
          set -euo pipefail
          # Hash-shaped, not the bare prefix: a test that asserts an object
          # contains no `$1$` writes that literal itself, and flagging it taught
          # nothing. A real crypt hash is the prefix plus a long run of
          # non-quote, non-space characters.
          # shellcheck disable=SC2016  # the pattern is literal, not to be expanded
          if git grep -nE '\$1\$[^ "'"'"']{8,}' -- infra/rack-switch-fleet/ | grep -v EXAMPLEHASHNOTREAL; then
            echo "a credential hash reached infra/rack-switch-fleet; see AGENTS.md" >&2
            exit 1
          fi
          echo "clean"

  # The switches' desired state follows git into the cluster its rack belongs
  # to: kubernetes.namespace in each site definition, `tuist-<env>` or
  # production's `tuist`, which also picks the env's kubeconfig. Status is not
  # written here: rack:fleet publish records what it observed, from a machine
  # that can reach the switches, which CI cannot.
  objects:
    name: RackSwitch, RackPDU and RackATS objects into ${{ matrix.environment }}
    needs: checks
    if: github.repository == 'tuist/tuist' && github.event_name == 'push' && needs.checks.outputs.environments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.checks.outputs.environments) }}
    environment:
      name: server-k8s-${{ matrix.environment }}
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked jq kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v2
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-$ENVIRONMENT" \
            --vault "tuist-k8s-$ENVIRONMENT" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Apply the CRD and the objects of each site in this env
        run: |
          set -euo pipefail
          # server-deployment.yml applies the same file. Applying it here too
          # means the objects never race the first server deploy after it lands.
          kubectl apply -f infra/helm/tuist/crds/tuist.dev_rackswitches.yaml
          kubectl apply -f infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_rackpdus.yaml
          kubectl apply -f infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_rackatses.yaml
          kubectl apply -f infra/helm/tuist/crds/infrastructure.cluster.x-k8s.io_racksites.yaml
          kubectl wait --for condition=established --timeout=60s crd/rackswitches.tuist.dev crd/rackpdus.infrastructure.cluster.x-k8s.io crd/rackatses.infrastructure.cluster.x-k8s.io crd/racksites.infrastructure.cluster.x-k8s.io
          for site in infra/rack-switch-fleet/sites/*.json; do
            name="$(basename "$site" .json)"
            namespace="$(jq -r '.kubernetes.namespace // empty' "$site")"
            [ -n "$namespace" ] || continue
            [ "$(infra/rack-switch-fleet/fleet.sh --site "$name" env)" = "$ENVIRONMENT" ] || continue
            kubectl apply -n "$namespace" -f "infra/rack-switch-fleet/k8s/$name/"
          done
