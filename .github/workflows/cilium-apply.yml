name: Cilium Apply

# Reconcile the Cilium chart values on ONE workload cluster.
#
# Called by cilium-deployment.yml, which owns the ordering. Kept as a
# reusable workflow rather than a matrix because the envs must run in a
# guaranteed order (GitHub does not guarantee matrix execution order, and
# `max-parallel` only caps concurrency), and because `preview` loads its
# kubeconfig differently from the three 1Password-backed envs.
#
# The rollouts are the only steps here with real blast radius. Each is
# gated on that workload genuinely not running its current config, tracked
# durably via a pod-template annotation rather than by diffing the
# ConfigMap across this run — see the "Roll any workload" step for why
# that distinction matters, and why it covers all four workloads rather
# than the agent alone.

on:
  workflow_call:
    inputs:
      environment:
        description: "Workload env to reconcile (staging | canary | production | preview)"
        required: true
        type: string
      kubeconfig_source:
        description: "onepassword (default) or environment_secret (preview)"
        required: false
        default: onepassword
        type: string
      force_restart:
        description: "Roll the agents even if they already run the current config"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apply:
    name: Cilium (${{ inputs.environment }})
    runs-on: tuist-linux
    environment:
      name: server-k8s-${{ inputs.environment }}
    # Shares a lane with hccm-deployment.yml and csi-deployment.yml, which
    # use this exact group. It does NOT serialize against
    # server-deployment.yml: that workflow suffixes its groups
    # (`server-deploy-<env>-deploy`, `-observability`, `-tailscale`,
    # `-platform`) and GitHub matches concurrency groups by exact string.
    # So a server rollout can be in flight while this rolls the CNI, which
    # could plausibly make its `helm --atomic` read the cluster as
    # unhealthy and roll itself back. Closing that needs one shared group
    # across all four workflows rather than a unilateral change here.
    concurrency:
      group: server-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    # Longer than the HCCM/CSI siblings: this can roll up to four
    # workloads, the agent DaemonSet walks the cluster maxUnavailable=2 at
    # a time, and --atomic may add a rollback on top.
    timeout-minutes: 45
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3.2.0
        with:
          install_args: "--locked helm kubectl jq"
          cache: "false"

      - uses: 1password/install-cli-action@v2
        if: inputs.kubeconfig_source == 'onepassword'
      - name: Load kubeconfig from 1Password
        if: inputs.kubeconfig_source == 'onepassword'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-${{ inputs.environment }}" \
            --vault "tuist-k8s-${{ inputs.environment }}" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Load kubeconfig from the environment secret
        # preview's cluster kubeconfig is a base64 env secret rather than a
        # 1P document, matching preview-platform-reconcile.yml.
        if: inputs.kubeconfig_source == 'environment_secret'
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Verify cluster reachability
        # Same pre-flight as server-deployment.yml — fail fast if the
        # stored kubeconfig points at a phantom apiserver instead of
        # letting helm hang for the full --timeout.
        run: |
          set -euo pipefail
          API="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Reaching apiserver at $API"
          kubectl --request-timeout=10s get --raw /version >/dev/null

      - name: Snapshot linux nodes that are already not Ready
        # The post-rollout check compares against this rather than
        # asserting the whole fleet is healthy. An absolute assertion
        # would fail staging over a node that was already sick for
        # unrelated reasons, and the cascade would then keep canary and
        # production from ever receiving the change. Only a node that
        # goes unready *during* this run is evidence about this run.
        #
        # `!~ /^Ready/` rather than `!= "Ready"`: a cordoned node prints
        # `Ready,SchedulingDisabled` and is entirely healthy.
        run: |
          set -euo pipefail
          kubectl get nodes -l kubernetes.io/os=linux --no-headers \
            | awk '$2 !~ /^Ready/ { print $1 }' | sort > "$RUNNER_TEMP/nodes-before.txt"
          echo "Linux nodes not Ready before the rollout:"
          cat "$RUNNER_TEMP/nodes-before.txt" || true

      - name: Resolve chart version and apiserver endpoint
        # The chart version is read out of bootstrap-workload.sh rather
        # than pinned again here, so a fresh cluster and an existing one
        # can never be installed at different Cilium versions. Same
        # single-source-of-truth reasoning as k8s:lint-version-drift.
        # cilium-deployment.yml triggers on that script for the same
        # reason: a version-only bump has to reach existing clusters.
        #
        # k8sServiceHost/Port are per-cluster. Bootstrap reads them from
        # the mgmt Cluster CR's controlPlaneEndpoint; this workflow has no
        # mgmt access, so it derives them from the workload kubeconfig's
        # server URL, which clusterctl minted from that same endpoint. The
        # guard in the next step is what makes that equivalence explicit
        # rather than assumed.
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^\s+--version [0-9]' infra/mise/tasks/k8s/bootstrap-workload.sh \
            | head -1 | awk '{print $2}')"
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not parse the Cilium chart version from infra/mise/tasks/k8s/bootstrap-workload.sh" >&2
            exit 2
          fi

          API="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          API="${API#https://}"
          HOST="${API%:*}"
          PORT="${API##*:}"
          if [ -z "$HOST" ] || [ -z "$PORT" ] || [ "$HOST" = "$PORT" ]; then
            echo "ERROR: could not split host/port out of the kubeconfig server URL: $API" >&2
            exit 2
          fi

          {
            echo "CILIUM_VERSION=$VERSION"
            echo "K8S_SERVICE_HOST=$HOST"
            echo "K8S_SERVICE_PORT=$PORT"
          } >> "$GITHUB_ENV"
          echo "Cilium $VERSION -> ${HOST}:${PORT}"

      - name: Guard against repointing the CNI at a different apiserver
        # If the derived endpoint disagrees with what the live release
        # already runs, something is wrong with the kubeconfig — stop
        # rather than hand the CNI a new apiserver address and take the
        # cluster's networking down. A first-ever install has no prior
        # values, which is not this workflow's job (bootstrap owns that).
        run: |
          set -euo pipefail
          if ! helm -n kube-system status cilium >/dev/null 2>&1; then
            echo "ERROR: no existing 'cilium' release in kube-system." >&2
            echo "This workflow reconciles existing clusters; onboard new ones with mise run k8s:bootstrap-workload." >&2
            exit 1
          fi
          VALUES="$(helm -n kube-system get values cilium -o json)"
          LIVE_HOST="$(echo "$VALUES" | jq -r '.k8sServiceHost // empty')"
          LIVE_PORT="$(echo "$VALUES" | jq -r '.k8sServicePort // empty')"
          if [ -n "$LIVE_HOST" ] && [ "$LIVE_HOST" != "$K8S_SERVICE_HOST" ]; then
            echo "ERROR: derived k8sServiceHost ($K8S_SERVICE_HOST) != live release value ($LIVE_HOST)" >&2
            exit 1
          fi
          if [ -n "$LIVE_PORT" ] && [ "$LIVE_PORT" != "$K8S_SERVICE_PORT" ]; then
            echo "ERROR: derived k8sServicePort ($K8S_SERVICE_PORT) != live release value ($LIVE_PORT)" >&2
            exit 1
          fi
          echo "Endpoint matches the live release."

      - name: helm upgrade --install cilium
        # --atomic so a failed upgrade rolls back to the last known-good
        # release instead of leaving the CNI half-applied for the next
        # job in the cascade to build on.
        run: |
          set -euo pipefail
          helm repo add cilium https://helm.cilium.io >/dev/null
          helm repo update cilium >/dev/null
          helm upgrade --install cilium cilium/cilium \
            --version "$CILIUM_VERSION" \
            --namespace kube-system \
            -f infra/k8s/mgmt/bootstrap/cilium-values.yaml \
            --set "k8sServiceHost=${K8S_SERVICE_HOST}" \
            --set "k8sServicePort=${K8S_SERVICE_PORT}" \
            --atomic --timeout 10m

      - name: Roll any workload not already running its current config
        # Cilium renders three ConfigMaps and none of the four workloads
        # carries a checksum annotation over them, so `helm upgrade` alone
        # rewrites config and leaves the running pods on their old
        # in-memory copy: success reported, nothing changed. That silent
        # no-op is how the #12401 Hubble fix went missing from production
        # for two days. It is not specific to the agent, so this reconciles
        # every (ConfigMap -> workload) pair rather than the agent alone.
        #
        # Desired state is compared against an annotation persisted on each
        # workload's pod template, NOT against a before/after diff of the
        # ConfigMap within this run. A diff would be a correctness bug: if
        # helm writes the ConfigMap and the run then dies, is cancelled, or
        # times out before the rollout, the next run would snapshot the
        # already-new hash, see no change, and skip the rollout forever
        # while the pods still serve the old config. Recording what the
        # pods actually run makes the check durable and self-healing.
        #
        # Writing the annotation is itself what triggers the rolling
        # update, since it mutates the pod template. If helm ever strips
        # it, the next run reads it empty and re-rolls: an extra restart,
        # never a missed one.
        env:
          FORCE_RESTART: ${{ inputs.force_restart }}
        run: |
          set -euo pipefail

          reconcile() {
            local cm="$1" kind="$2" name="$3" desired applied
            if ! kubectl -n kube-system get configmap "$cm" >/dev/null 2>&1; then
              echo "== $kind/$name: configmap/$cm absent, skipping"
              return 0
            fi
            if ! kubectl -n kube-system get "$kind" "$name" >/dev/null 2>&1; then
              echo "== $kind/$name: not deployed here, skipping"
              return 0
            fi

            desired="$(kubectl -n kube-system get configmap "$cm" \
              -o json | jq -S -c '.data' | sha256sum | awk '{print $1}')"
            applied="$(kubectl -n kube-system get "$kind" "$name" -o json \
              | jq -r '.spec.template.metadata.annotations["tuist.dev/config-hash"] // empty')"

            echo "== $kind/$name (from $cm)"
            echo "   desired: $desired"
            echo "   running: ${applied:-<unrecorded>}"

            if [ "$desired" = "$applied" ] && [ "${FORCE_RESTART:-false}" != "true" ]; then
              echo "   already current, skipping rollout"
              return 0
            fi

            kubectl -n kube-system patch "$kind" "$name" --type merge -p \
              "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"tuist.dev/config-hash\":\"${desired}\"}}}}}"
            # A forced roll with an unchanged annotation does not mutate the
            # pod template, so ask for the restart explicitly in that case.
            if [ "$desired" = "$applied" ]; then
              echo "   already current, but force_restart was requested"
              kubectl -n kube-system rollout restart "$kind" "$name"
            fi
            kubectl -n kube-system rollout status "$kind" "$name" --timeout=15m
          }

          # Agent first: it is the dataplane, and the rest are useless if it
          # does not come back. Operator also reads cilium-config; envoy and
          # relay own their own.
          reconcile cilium-config       daemonset  cilium
          reconcile cilium-envoy-config daemonset  cilium-envoy
          reconcile cilium-config       deployment cilium-operator
          reconcile hubble-relay-config deployment hubble-relay

      - name: Verify the dataplane came back
        # Scoped to linux nodes on purpose. The chart's node affinity keeps
        # cilium off the macOS Tart nodes, so their readiness says nothing
        # about this rollout, and gating the cascade on them would let an
        # unrelated Mac mini blocking on its own bootstrap fail a Cilium
        # deploy.
        #
        # Compared against the pre-rollout snapshot rather than asserted
        # absolutely, so a node that was already sick going in cannot fail
        # this run and wedge the cascade. Only a node that went unready
        # during the run is evidence about the run.
        run: |
          set -euo pipefail
          kubectl -n kube-system get daemonset cilium \
            -o custom-columns=DESIRED:.status.desiredNumberScheduled,READY:.status.numberReady,UNAVAILABLE:.status.numberUnavailable
          UNAVAILABLE="$(kubectl -n kube-system get daemonset cilium -o jsonpath='{.status.numberUnavailable}')"
          if [ -n "${UNAVAILABLE:-}" ] && [ "$UNAVAILABLE" != "0" ]; then
            echo "ERROR: $UNAVAILABLE cilium agents still unavailable after rollout" >&2
            exit 1
          fi

          kubectl get nodes -l kubernetes.io/os=linux --no-headers \
            | awk '$2 !~ /^Ready/ { print $1 }' | sort > "$RUNNER_TEMP/nodes-after.txt"
          REGRESSED="$(comm -13 "$RUNNER_TEMP/nodes-before.txt" "$RUNNER_TEMP/nodes-after.txt")"
          if [ -n "$REGRESSED" ]; then
            echo "ERROR: linux nodes became not Ready during the Cilium rollout:" >&2
            echo "$REGRESSED" >&2
            exit 1
          fi

          STILL_DOWN="$(cat "$RUNNER_TEMP/nodes-before.txt")"
          if [ -n "$STILL_DOWN" ]; then
            echo "NOTE: these linux nodes were already not Ready before this run and are not treated as a regression:"
            echo "$STILL_DOWN"
          fi
          echo "All cilium agents ready; no linux node regressed during the rollout."
