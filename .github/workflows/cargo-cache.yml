name: Cargo cache

on:
  pull_request:
    paths:
      - cli/native/cargo-cache/**
      - cli/Sources/TuistCargoCommand/**
      - cli/Tests/Fixtures/CargoCache/**
      - mise/utilities/build_cargo_cache_linux.sh
      - mise/tasks/cli/bundle*.sh
      - .github/workflows/cargo-cache.yml
      - .github/workflows/cli-build-publish.yml
      - cas-plugin/mise.toml
  push:
    branches: [main]
    paths:
      - cli/native/cargo-cache/**
      - cli/Sources/TuistCargoCommand/**
      - cli/Tests/Fixtures/CargoCache/**
      - mise/utilities/build_cargo_cache_linux.sh
      - mise/tasks/cli/bundle*.sh
      - .github/workflows/cargo-cache.yml
      - .github/workflows/cli-build-publish.yml
      - cas-plugin/mise.toml

permissions:
  contents: read

jobs:
  model:
    name: Model and shipped runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
          env: "false"
      - name: Check formatting and test the model and shipped entry
        working-directory: cas-plugin
        run: |
          mise exec -- cargo fmt --manifest-path ../cli/native/cargo-cache/Cargo.toml --all -- --check
          mise exec -- cargo test --locked --manifest-path ../cli/native/cargo-cache/Cargo.toml --workspace --lib
          mise exec -- cargo test --locked --manifest-path ../cli/native/cargo-cache/Cargo.toml -p tuist-cargo-cache --test tuist_runtime
          mise exec -- cargo test --locked --manifest-path ../cli/native/cargo-cache/Cargo.toml -p tuist-cargo-cache --features model-tests --tests

  linux-bundle:
    name: Static helper (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config llvm
      - uses: ./.github/actions/mise
        with:
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
      - uses: ./.github/actions/mise
        with:
          install_args: zig cargo:cargo-zigbuild
          working_directory: cli/native/cargo-cache
          cache: "false"
          env: "false"
      - name: Build and verify the release helper
        run: bash mise/utilities/build_cargo_cache_linux.sh '${{ matrix.arch }}' "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/bundle"
      - name: Check the native Linux entry
        if: matrix.arch == 'x86_64'
        run: test "$("$RUNNER_TEMP/bundle/tuist-cargo-cache" __tuist_protocol)" = 'tuist-cargo-cache 1'
