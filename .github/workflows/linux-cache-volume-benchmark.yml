name: Linux Cache Volume Benchmark

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Linux profile used for every comparison
        default: tuist-linux
        type: string
      cache_key:
        description: Unique experiment key; reuse for cold and warm runs
        required: true
        type: string
      phase:
        description: Run baseline, then cold, then warm after publication completes
        type: choice
        options: [baseline, cold, warm]
        required: true

permissions:
  contents: read

# Reviewed main commit. Keep every phase on this source; accepting a dispatch
# ref would let arbitrary code publish caches under a trusted main-branch job.
env:
  SOURCE_SHA: 92ad9c2d908ca7c2aa12aa1f9559f86e9992f894

concurrency:
  group: volume-benchmark-${{ inputs.cache_key }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.workload }} / ${{ inputs.phase }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - workload: go
            first: tuist-go-mod
            second: tuist-go-build
          - workload: gradle
            first: tuist-gradle
            second: ''
    env:
      GOMODCACHE: ${{ github.workspace }}/../tuist-go-mod
      GOCACHE: ${{ github.workspace }}/../tuist-go-build
      GRADLE_USER_HOME: ${{ github.workspace }}/../tuist-gradle
      FIRST_CACHE: ${{ github.workspace }}/../${{ matrix.first }}
      SECOND_CACHE: ${{ matrix.second != '' && format('{0}/../{1}', github.workspace, matrix.second) || '' }}
      PHASE: ${{ inputs.phase }}
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuist/tuist
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Start cache setup timer
        run: echo "CACHE_START=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: tuist/cache-volume@v1
        if: inputs.phase != 'baseline'
        id: first
        with:
          key: benchmark-${{ inputs.cache_key }}-${{ matrix.workload }}-first
          path: ${{ env.FIRST_CACHE }}
      - uses: tuist/cache-volume@v1
        if: inputs.phase != 'baseline' && matrix.workload == 'go'
        id: second
        with:
          key: benchmark-${{ inputs.cache_key }}-${{ matrix.workload }}-second
          path: ${{ env.SECOND_CACHE }}
      - name: Verify cache state and record attachment time
        env:
          FIRST_HIT: ${{ steps.first.outputs.cache-hit }}
          SECOND_HIT: ${{ steps.second.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "CACHE_MS=$(( ($(date +%s%N) - CACHE_START) / 1000000 ))" >> "$GITHUB_ENV"
          if [ "$PHASE" = baseline ]; then
            test ! -e "$FIRST_CACHE"
            if [ -n "$SECOND_CACHE" ]; then test ! -e "$SECOND_CACHE"; fi
            mkdir -p "$FIRST_CACHE"; if [ -n "$SECOND_CACHE" ]; then mkdir -p "$SECOND_CACHE"; fi
          else
            expected=false
            if [ "$PHASE" = warm ]; then expected=true; fi
            test "$FIRST_HIT" = "$expected"
            if [ -n "$SECOND_CACHE" ]; then test "$SECOND_HIT" = "$expected"; fi
            for path in "$FIRST_CACHE" "$SECOND_CACHE"; do
              [ -n "$path" ] || continue
              test -L "$path"
              target=$(readlink -f "$path")
              test -s "$(dirname "$target")/.tuist-volume"
              if [ "$PHASE" = warm ]; then
                test "$(cat "$path/.benchmark-source")" = "$SOURCE_SHA"
              else
                test ! -e "$path/.benchmark-source"
              fi
              printf '%s' "$SOURCE_SHA" > "$path/.benchmark-source"
              df -h "$path"
            done
          fi
      - name: Resolve Gradle home
        if: matrix.workload == 'gradle'
        run: echo "GRADLE_USER_HOME=$(readlink -f "$GRADLE_USER_HOME")" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        if: matrix.workload == 'go'
        with:
          go-version-file: infra/runners-controller/go.mod
          cache: false
      - uses: actions/setup-java@v5
        if: matrix.workload == 'gradle'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.workload == 'gradle'
        with:
          cache-disabled: true
      - name: Run real tests and measure elapsed time
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          if [ "$WORKLOAD" = go ]; then
            cd infra/runners-controller
            go version
            go test -count=1 ./...
            go vet ./...
          else
            cd gradle
            ./gradlew --no-daemon --no-build-cache clean test
          fi
          echo "WORKLOAD_MS=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_ENV"
      - name: Record results
        env:
          FIRST_HIT: ${{ steps.first.outputs.cache-hit }}
          SECOND_HIT: ${{ steps.second.outputs.cache-hit }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          first_bytes=$(du -sbL "$FIRST_CACHE" | cut -f1)
          second_bytes=0
          if [ -n "$SECOND_CACHE" ]; then second_bytes=$(du -sbL "$SECOND_CACHE" | cut -f1); fi
          mkdir -p "$RUNNER_TEMP/volume-results"
          jq -n --arg source "$SOURCE_SHA" --arg phase "$PHASE" \
            --arg workload "$WORKLOAD" --arg runner "$RUNNER_LABEL" \
            --arg first_hit "$FIRST_HIT" --arg second_hit "$SECOND_HIT" \
            --argjson cache_ms "$CACHE_MS" --argjson workload_ms "$WORKLOAD_MS" \
            --argjson first_bytes "$first_bytes" --argjson second_bytes "$second_bytes" \
            '{source: $source, phase: $phase, workload: $workload, runner: $runner,
              first_hit: $first_hit, second_hit: $second_hit, cache_ms: $cache_ms,
              workload_ms: $workload_ms, first_bytes: $first_bytes, second_bytes: $second_bytes}' \
            > "$RUNNER_TEMP/volume-results/$WORKLOAD-$PHASE.json"
          {
            echo '| Workload | Phase | Cache setup (ms) | Tests + build (ms) | First hit | Second hit |'
            echo '| --- | --- | ---: | ---: | --- | --- |'
            echo "| $WORKLOAD | $PHASE | $CACHE_MS | $WORKLOAD_MS | $FIRST_HIT | $SECOND_HIT |"
            echo
            echo 'Test results are rerun; archive caches and Gradle build-cache results are disabled.'
            echo 'Cache setup includes attachment steps. Runner queue time, tool setup and post-job publication are outside the workload timing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: volume-benchmark-${{ matrix.workload }}-${{ inputs.phase }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volume-results/*.json
