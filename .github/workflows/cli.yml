name: CLI

on:
  push:
    branches:
      - main
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run CLI build/test/acceptance.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "*.swift"
      - ".github/workflows/cli.yml"
      - "mise/tasks/cli/lint.sh"
      - "mise/tasks/cli/ee.sh"
      - "mise/utilities/install_static_linux_sdk.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run CLI build/test/acceptance.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "*.swift"
      - ".github/workflows/cli.yml"
      - "mise/tasks/cli/lint.sh"
      - "mise/tasks/cli/ee.sh"
      - "mise/utilities/install_static_linux_sdk.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  TUIST_EE: ${{ github.event.pull_request.head.repo.fork != true && '1' || '' }}
  TUIST_ENABLE_CACHING: ${{ github.event.pull_request.head.repo.fork != true }}
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1
  TUIST_DEV_INSTANCE: "1"

concurrency:
  group: cli-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Linux archive caches: restore-keys hashes Package.swift (not Package.resolved) so the
# fallback never crosses structural changes. See #10510 / e8fa267 for the incidents
# (stale workspace state pointing at moved local SPM paths; Linux linker failures
# from partial-artifact reuse) that motivate the narrower scope.
jobs:
  cli-lint:
    name: Lint
    runs-on: tuist-macos-27-0
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist swiftlint swiftformat"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Lint
        run: |
          "$(mise which swiftformat)" cli/ app/ --lint
          "$(mise which swiftlint)" lint --quiet --config .swiftlint.yml cli/Sources
          "$(mise which swiftlint)" lint --quiet --config .swiftlint.yml --only-rule no_fatal_error_in_tests cli/Tests
          tuist inspect dependencies --only implicit

  cli-spm-build:
    name: SwiftPM Build
    runs-on: tuist-macos-27-0
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Resolve registry replacements
        run: swift package --cache-path "$PWD/.build/dependency-cache" resolve --replace-scm-with-registry
      - name: Build
        run: swift build --cache-path "$PWD/.build/dependency-cache" --configuration debug --replace-scm-with-registry --force-resolved-versions

  cli-cache:
    name: Cache
    runs-on: tuist-macos-27-0
    # Two warms: the plain one and the coverage one below, which builds every
    # changed repository target a second time, with coverage and without the
    # compilation cache's replay.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Cache
        run: tuist cache
      # The coverage variant of the binary cache, read by the runs that collect
      # coverage: coverage.yml on main, and the unit tests above, which run with
      # `-enableCodeCoverage YES`. Only repository-owned targets are built again,
      # with coverage counters; external packages are the plain warm's. Those
      # builds get no compilation-cache replay: coverage builds leave Xcode's
      # prefix mapping off by default, and `tuist cache` has no xcodebuild
      # passthrough for the override the test runs use. The manifest option
      # (`enableCoveragePrefixMapping`) would turn it on for both, once the
      # backward-compatibility gate's CLI knows it.
      - name: Cache with coverage
        run: tuist cache --coverage

  cli-unit-tests:
    name: Unit Tests
    runs-on: tuist-macos-27-0
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Verify scheme process integration
        run: |
          tuist generate TuistProcessSchemeIntegration --no-open
          bash cli/Tests/Fixtures/ProcessSchemeIntegration/test.sh
      # The derived data path is where the coverage export finds the test
      # products and the run's profile; cached binaries only show up in the
      # coverage when it reads them, never in the result bundle's own report.
      - name: Run tests
        run: tuist test TuistUnitTests --derived-data-path "$RUNNER_TEMP/DerivedData" -- -retry-tests-on-failure -test-iterations 4 -enableCodeCoverage YES
        env:
          # Xcode code coverage is in early access behind this client flag.
          TUIST_FEATURE_FLAG_COVERAGE: "1"

  cli-acceptance-tests-build:
    name: Build Acceptance Tests
    runs-on: tuist-macos-27-0
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request') && github.event.pull_request.head.repo.fork != true
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Build tests
        id: shard
        run: tuist test --build-only --shard-total 2 --shard-granularity suite --shard-reference "$TUIST_ACCEPTANCE_SHARD_REFERENCE" TuistAcceptanceTests
        env:
          TUIST_ACCEPTANCE_SHARD_REFERENCE: github-${{ github.run_id }}-${{ github.sha }}

  cli-acceptance-tests:
    name: Acceptance Tests
    runs-on: tuist-macos-27-0
    timeout-minutes: 60
    needs: cli-acceptance-tests-build
    permissions:
      contents: read
      id-token: write
    if: toJSON(fromJSON(needs.cli-acceptance-tests-build.outputs.matrix).shard) != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.cli-acceptance-tests-build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      # The Xcode compilation-cache acceptance test loads the cas-plugin dylib
      # inside xcodebuild's compilers and routes it to the proxy over a unix
      # socket. Build both from source and hand their paths to the test via the
      # TUIST_CAS_PLUGIN_PATH / TUIST_CAS_PROXY_PATH overrides ResourceLocator
      # honours. Forks skip this: they do not check out the EE submodule, so the
      # suite that needs the plugin is not in the scheme there.
      - uses: ./.github/actions/mise
        if: github.event.pull_request.head.repo.fork != true
        env:
          # The rust pin lives in cas-plugin/mise.toml and has no lockfile entry,
          # so this workflow's MISE_LOCKED=1 refuses to install it. Every other
          # workflow that builds the plugin installs this toolchain unlocked.
          MISE_LOCKED: 0
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
      - uses: Swatinem/rust-cache@v2
        if: github.event.pull_request.head.repo.fork != true
        with:
          shared-key: cas-plugin-rust-${{ runner.os }}
          workspaces: |
            cas-plugin -> target
      - name: Build the cas-plugin
        if: github.event.pull_request.head.repo.fork != true
        working-directory: cas-plugin
        env:
          MISE_LOCKED: 0
        # No GITHUB_ENV export: `xcodebuild test-without-building` runs the test
        # bundle with the environment captured into the xctestrun at build time,
        # so a variable exported here never reaches the test process. The suite
        # resolves both binaries from this path in the source tree instead.
        run: mise run build
      - name: Set up new keychain
        run: |
          TMP_DIRECTORY=$(mktemp -d)
          KEYCHAIN_PATH=$TMP_DIRECTORY/keychain.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
      # -maximum-parallel-testing-workers caps how many test runner processes xcodebuild spawns.
      # Acceptance tests each shell out to their own nested xcodebuild, so every extra runner
      # multiplies into a fresh set of compiler processes. Uncapped on a 6-core runner that reached
      # 78 concurrent swift-frontend processes, which is what starved tests into their time limits.
      # See https://github.com/tuist/tuist/issues/12512 for the measurements behind this number.
      - name: Run shard ${{ matrix.shard }}
        run: tuist test --without-building --platform macOS --shard-reference "$TUIST_ACCEPTANCE_SHARD_REFERENCE" TuistAcceptanceTests -- -retry-tests-on-failure -test-iterations 2 -maximum-parallel-testing-workers 2
        env:
          TUIST_SHARD_INDEX: ${{ matrix.shard }}
          TUIST_ACCEPTANCE_SHARD_REFERENCE: github-${{ github.run_id }}-${{ github.sha }}

  cli-acceptance-tests-fork:
    name: Acceptance Tests (Fork)
    runs-on: tuist-macos-27-0
    timeout-minutes: 60
    if: (github.event.pull_request.draft == false || github.event_name != 'pull_request') && github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-cli-acceptance-tests-build-${{ hashFiles('.xcode-version', 'Package.swift') }}-v2
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Set up new keychain
        run: |
          TMP_DIRECTORY=$(mktemp -d)
          KEYCHAIN_PATH=$TMP_DIRECTORY/keychain.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
      - name: Run tests
        run: tuist test --platform macOS TuistAcceptanceTests -- -retry-tests-on-failure -test-iterations 2

  cli-linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: linux-cli-musl-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-cli-musl-${{ hashFiles('Package.swift') }}-
      - name: Install caddy
        run: apt-get update -qq && apt-get install -y --no-install-recommends caddy
      # Swift 6.2's FoundationNetworking traps on a redirect served over HTTP/2
      # (see #12229), and the registry answers 303 to storage over h2. Terminating
      # the first hop as plaintext HTTP/1.1 removes the precondition; the redirect
      # target negotiates http/1.1 on its own, so only this hop needs forcing.
      - name: Front the registry with an HTTP/1.1 proxy
        shell: bash
        run: |
          nohup caddy reverse-proxy \
            --from :8080 --to https://tuist.dev --change-host-header \
            > /tmp/registry-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            sleep 1
          done
          echo "::error::registry proxy did not start listening on :8080"
          cat /tmp/registry-proxy.log || true
          exit 1
      - name: Point SwiftPM at the proxy
        run: swift package-registry set --allow-insecure-http http://localhost:8080/api/registry/swift
      - name: Resolve dependencies
        run: swift package resolve --replace-scm-with-registry
      # Releases ship a static musl binary, and the musl SDK exposes `Musl`
      # rather than `Glibc`, so build against the same SDK the release uses.
      - name: Install Swift Static Linux SDK
        run: |
          target=$(./mise/utilities/install_static_linux_sdk.sh)
          echo "SWIFT_SDK_TARGET=$target" >> "$GITHUB_ENV"
      - name: Build tuist CLI
        run: swift build --target tuist --replace-scm-with-registry --force-resolved-versions --swift-sdk "$SWIFT_SDK_TARGET"
      - name: Save cache
        if: github.ref == 'refs/heads/main'
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  cli-linux-unit-tests:
    name: Linux Unit Tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: linux-cli-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-cli-${{ hashFiles('Package.swift') }}-
      - name: Install caddy
        run: apt-get update -qq && apt-get install -y --no-install-recommends caddy
      # Swift 6.2's FoundationNetworking traps on a redirect served over HTTP/2
      # (see #12229), and the registry answers 303 to storage over h2. Terminating
      # the first hop as plaintext HTTP/1.1 removes the precondition; the redirect
      # target negotiates http/1.1 on its own, so only this hop needs forcing.
      - name: Front the registry with an HTTP/1.1 proxy
        shell: bash
        run: |
          nohup caddy reverse-proxy \
            --from :8080 --to https://tuist.dev --change-host-header \
            > /tmp/registry-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            sleep 1
          done
          echo "::error::registry proxy did not start listening on :8080"
          cat /tmp/registry-proxy.log || true
          exit 1
      - name: Point SwiftPM at the proxy
        run: swift package-registry set --allow-insecure-http http://localhost:8080/api/registry/swift
      - name: Resolve dependencies
        run: swift package resolve --replace-scm-with-registry
      - name: Run unit tests
        run: swift test --replace-scm-with-registry
      - name: Save cache
        if: github.ref == 'refs/heads/main'
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
