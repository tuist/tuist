name: CLI

on:
  push:
    branches:
      - main
      - 'claude/cache-bisect-**'
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run CLI build/test/acceptance.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "*.swift"
      - ".github/workflows/cli.yml"
      - "mise/tasks/cli/lint.sh"
      - "mise/tasks/cli/ee.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run CLI build/test/acceptance.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "*.swift"
      - ".github/workflows/cli.yml"
      - "mise/tasks/cli/lint.sh"
      - "mise/tasks/cli/ee.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"

permissions:
  contents: read

env:
  MISE_VERSION: "2026.5.15"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  TUIST_EE: ${{ github.event.pull_request.head.repo.fork != true && '1' || '' }}
  TUIST_ENABLE_CACHING: ${{ github.event.pull_request.head.repo.fork != true }}
  # Jobs are ephemeral and persist .build with actions/cache. Keep Tuist metadata
  # outside the per-account runner cache volume so a saturated warm cache cannot
  # prevent authentication before the job starts.
  TUIST_XDG_CACHE_HOME: /tmp/tuist-cache
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1

concurrency:
  group: cli-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# .build cache keys: restore-keys hashes Package.swift (not Package.resolved) so the
# fallback never crosses structural changes. See #10510 / e8fa267 for the incidents
# (stale workspace state pointing at moved local SPM paths; Linux linker failures
# from partial-artifact reuse) that motivate the narrower scope.
jobs:
  cli-cache:
    name: Cache
    runs-on: tuist-macos
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.swift') }}-
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "tuist"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Cache
        run: tuist cache
      - name: Dump CAS and build diagnostics
        if: always()
        run: |
          set +e
          echo "===== cas.log (head) ====="
          head -c 120000 "$HOME/.local/state/tuist/cas.log" 2>/dev/null || echo "(no cas.log)"
          echo
          echo "===== cas.log: unbacked / withheld lines ====="
          grep -c "unbacked association" "$HOME/.local/state/tuist/cas.log" 2>/dev/null
          grep -c "unbacked local hit" "$HOME/.local/state/tuist/cas.log" 2>/dev/null
          grep -a "unbacked association" "$HOME/.local/state/tuist/cas.log" 2>/dev/null | head -20
          echo "===== cas.log: stats lines ====="
          grep -a "backing checks=\|degraded:\|stats" "$HOME/.local/state/tuist/cas.log" 2>/dev/null | tail -40
          echo
          echo "===== scratch directories ====="
          ls -d "$TMPDIR"CacheWarm-* 2>/dev/null || echo "(scratch dir already removed)"
          for dd in "$TMPDIR"CacheWarm-*/derived-data; do
            [ -d "$dd" ] || continue
            echo "----- $dd -----"
            ls -1 "$dd" | head -20
            for bundle in "$dd"/*; do
              [ -d "$bundle" ] || continue
              [ -f "$bundle/Info.plist" ] || continue
              echo "----- xcresult $(basename "$bundle") -----"
              xcrun xcresulttool get build-results --path "$bundle" 2>&1 | head -c 120000
            done
            for log in "$dd"/Logs/Build/*.xcactivitylog; do
              [ -f "$log" ] || continue
              gunzip -c "$log" 2>/dev/null | tr '\r\000' '\n\n' > "$RUNNER_TEMP/activity.txt"
              echo "----- $(basename "$log"): $(wc -c < "$RUNNER_TEMP/activity.txt") bytes -----"
              echo "## context around 'no such module'"
              grep -a -n -B3 -A3 "no such module" "$RUNNER_TEMP/activity.txt" | head -60
              echo "## SnapshotTesting frontend flags of interest"
              grep -a -o -- "-explicit-swift-module-map-file" "$RUNNER_TEMP/activity.txt" | head -1
              grep -a -o "Developer/Library/Frameworks" "$RUNNER_TEMP/activity.txt" | head -1
              grep -a -o -- "-target [A-Za-z0-9._-]*" "$RUNNER_TEMP/activity.txt" | sort -u | head -10
            done
          done
