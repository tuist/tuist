name: CLI

on:
  push:
    branches:
      - main
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      - "e2e/global_flags.bats"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run the CLI builds.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "*.swift"
      - ".github/workflows/cli.yml"
      - "mise/tasks/cli/lint.sh"
      - "mise/tasks/cli/ee.sh"
      - "mise/utilities/install_static_linux_sdk.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      - "e2e/global_flags.bats"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run the CLI builds.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "*.swift"
      - ".github/workflows/cli.yml"
      - "mise/tasks/cli/lint.sh"
      - "mise/tasks/cli/ee.sh"
      - "mise/utilities/install_static_linux_sdk.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  TUIST_EE: ${{ github.event.pull_request.head.repo.fork != true && '1' || '' }}
  TUIST_ENABLE_CACHING: ${{ github.event.pull_request.head.repo.fork != true }}
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1
  TUIST_DEV_INSTANCE: "1"

concurrency:
  group: cli-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Builds, lint and the Linux suite. The macOS test runs (`tuist test`), the
# binary-cache warm and the coverage signal live in tuist-project-tests.yml.
#
# Linux archive caches: restore-keys hashes Package.swift (not Package.resolved) so the
# fallback never crosses structural changes. See #10510 / e8fa267 for the incidents
# (stale workspace state pointing at moved local SPM paths; Linux linker failures
# from partial-artifact reuse) that motivate the narrower scope.
jobs:
  # Lint and SwiftPM Build run on pull requests only: a push to main carries
  # sources its pull request already checked.
  cli-lint:
    name: Lint
    runs-on: tuist-macos-27-0
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist' && github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist swiftlint swiftformat"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}
      - name: Lint
        run: |
          "$(mise which swiftformat)" cli/ app/ --lint
          "$(mise which swiftlint)" lint --quiet --config .swiftlint.yml cli/Sources
          "$(mise which swiftlint)" lint --quiet --config .swiftlint.yml --only-rule no_fatal_error_in_tests cli/Tests
          tuist inspect dependencies --only implicit

  # The originHash is the SHA-256 of the root Package.swift. Runs on pushes too because
  # a squash merge can produce a Package.swift that no branch resolved.
  cli-package-resolved:
    name: Package.resolved
    runs-on: tuist-linux
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check originHash
        run: |
          expected="$(sha256sum Package.swift | cut -d' ' -f1)"
          actual="$(sed -n 's/^ *"originHash" : "\([0-9a-f]*\)",$/\1/p' Package.resolved)"
          if [ "$expected" != "$actual" ]; then
            echo "::error file=Package.resolved,line=2::originHash is ${actual:-missing}, but Package.swift hashes to $expected. Run 'tuist install' and commit Package.resolved."
            exit 1
          fi

  cli-spm-build:
    name: SwiftPM Build
    runs-on: tuist-macos-27-0
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'tuist/tuist' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist bats"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-${{ github.job }}
      - name: Resolve registry replacements
        run: swift package --cache-path "$PWD/.build/dependency-cache" resolve --replace-scm-with-registry
      - name: Build
        run: swift build --cache-path "$PWD/.build/dependency-cache" --configuration debug --replace-scm-with-registry --force-resolved-versions
      - name: Test global flags
        run: |
          bin_path="$(swift build --cache-path "$PWD/.build/dependency-cache" --configuration debug --replace-scm-with-registry --force-resolved-versions --show-bin-path)"
          TUIST_EXECUTABLE="$bin_path/tuist" bats --print-output-on-failure e2e/global_flags.bats
      # Next to the binary: resource bundles, Swift runtime libraries the system
      # may lack, and ProjectDescription built with module interfaces so any
      # Swift compiler can compile manifests against it.
      - name: Package CLI preview
        if: github.event.pull_request.head.repo.fork != true
        run: |
          flags=(--cache-path "$PWD/.build/dependency-cache" --replace-scm-with-registry --force-resolved-versions)
          bin_path="$(swift build "${flags[@]}" --configuration debug --show-bin-path)"
          # The cached scratch path may hold the previous pins, which --force-resolved-versions rejects after a bump.
          swift package --cache-path "$PWD/.build/dependency-cache" --scratch-path .build/project-description \
            resolve --replace-scm-with-registry
          swift build "${flags[@]}" --scratch-path .build/project-description --product ProjectDescription \
            --enable-parseable-module-interfaces -Xswiftc -enable-library-evolution
          pd_path="$(swift build "${flags[@]}" --scratch-path .build/project-description --show-bin-path)"
          dist=build/cli-preview-macos
          mkdir -p "$dist/ProjectDescription.swiftmodule"
          cp "$bin_path/tuist" "$pd_path/libProjectDescription.dylib" "$dist/"
          cp "$pd_path/ProjectDescription.swiftmodule/arm64-apple-macos.swiftinterface" "$dist/ProjectDescription.swiftmodule/"
          find "$bin_path" -maxdepth 1 -name '*.bundle' -exec cp -R {} "$dist/" \;
          xcrun swift-stdlib-tool --copy --platform macosx --destination "$dist" \
            --scan-executable "$dist/tuist" --scan-executable "$dist/libProjectDescription.dylib"
      - if: github.event.pull_request.head.repo.fork != true
        uses: actions/upload-artifact@v4
        with:
          name: cli-preview-macos
          path: build/cli-preview-macos
          retention-days: 1

  cli-linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.1-noble
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: linux-cli-musl-swift-6.4.1-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-cli-musl-swift-6.4.1-${{ hashFiles('Package.swift') }}-
      - name: Resolve dependencies
        run: swift package resolve --replace-scm-with-registry
      # Releases ship a static musl binary, and the musl SDK exposes `Musl`
      # rather than `Glibc`, so build against the same SDK the release uses.
      - name: Install Swift Static Linux SDK
        run: |
          target=$(./mise/utilities/install_static_linux_sdk.sh)
          echo "SWIFT_SDK_TARGET=$target" >> "$GITHUB_ENV"
      - name: Build tuist CLI
        run: swift build --product tuist --replace-scm-with-registry --force-resolved-versions --swift-sdk "$SWIFT_SDK_TARGET"
      # The static binary needs nothing else at runtime, so it is the whole
      # Linux distribution. cli-preview publishes it.
      - name: Package CLI preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        run: |
          bin_path="$(swift build --product tuist --replace-scm-with-registry --force-resolved-versions --swift-sdk "$SWIFT_SDK_TARGET" --show-bin-path)"
          mkdir -p build/cli-preview-linux
          llvm-objcopy --strip-unneeded "$bin_path/tuist" build/cli-preview-linux/tuist
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: actions/upload-artifact@v4
        with:
          name: cli-preview-linux
          path: build/cli-preview-linux
          retention-days: 1
      - name: Save cache
        if: github.ref == 'refs/heads/main'
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  # Publishes the CLI the builds above packaged as one preview, so people and
  # agents can try a pull request with `tuist run <preview-url>`. A preview
  # groups builds uploaded one after another, so one job uploads both. The new
  # Linux client publishes because the pinned release lacks CLI previews.
  cli-preview:
    name: CLI Preview
    needs: [cli-spm-build, cli-linux-build]
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The CLI reads the pull request's head commit from HEAD^2.
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-preview-*
          path: build
      - name: Share
        run: |
          # Artifacts drop executable bits.
          chmod +x build/cli-preview-macos/tuist build/cli-preview-linux/tuist
          # On Linux the CLI reads the project from tuist.toml, not Tuist.swift.
          echo 'project = "tuist/tuist"' > tuist.toml
          build/cli-preview-linux/tuist auth login
          build/cli-preview-linux/tuist share build/cli-preview-macos --executable tuist
          build/cli-preview-linux/tuist share build/cli-preview-linux --executable tuist

  cli-linux-unit-tests:
    name: Linux Unit Tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.1-noble
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: linux-cli-swift-6.4.1-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            linux-cli-swift-6.4.1-${{ hashFiles('Package.swift') }}-
      - name: Install loopback TLS test dependency
        run: apt-get update -qq && apt-get install -y --no-install-recommends openssl
      - name: Resolve dependencies
        run: swift package resolve --replace-scm-with-registry
      - name: Run unit tests
        run: swift test --replace-scm-with-registry
      - name: Save cache
        if: github.ref == 'refs/heads/main'
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
