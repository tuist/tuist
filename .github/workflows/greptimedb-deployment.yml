name: Pulse GreptimeDB Replacement

on:
  pull_request:
    paths:
      - infra/helm/greptimedb/**
      - infra/helm/greptimedb-grafana/**
      - .github/workflows/greptimedb-deployment.yml
      - .github/scripts/greptimedb*
      - .github/scripts/pulse-readiness*
      # The readiness test also pins each environment's Pulse reader account.
      - infra/helm/tuist/values-managed-*.yaml
      - infra/helm/tuist/templates/server-config-external-secrets.yaml
      - .github/workflows/server-deployment.yml
      - infra/helm/k8s-monitoring/values-staging.yaml
      - infra/helm/k8s-monitoring/values-canary.yaml
      - infra/helm/k8s-monitoring/values-production.yaml
      - .github/scripts/openobserve-capacity.mjs
      - .github/scripts/openobserve-storage-check.sh
      - .github/scripts/openobserve-preflight.test.mjs
  push:
    branches: [main]
    paths:
      - infra/helm/greptimedb/**
      - infra/helm/greptimedb-grafana/**
      - .github/workflows/greptimedb-deployment.yml
      - .github/scripts/greptimedb*
      - .github/scripts/pulse-readiness*
      # The readiness test also pins each environment's Pulse reader account.
      - infra/helm/tuist/values-managed-*.yaml
      - infra/helm/tuist/templates/server-config-external-secrets.yaml
      - .github/workflows/server-deployment.yml
      - infra/helm/k8s-monitoring/values-staging.yaml
      - infra/helm/k8s-monitoring/values-canary.yaml
      - infra/helm/k8s-monitoring/values-production.yaml
      - .github/scripts/openobserve-capacity.mjs
      - .github/scripts/openobserve-storage-check.sh
      - .github/scripts/openobserve-preflight.test.mjs
  workflow_dispatch:
    inputs:
      environment:
        description: Managed target (canary/production install the private backend only)
        required: true
        type: choice
        options: [staging, canary, production]
      dashboard:
        description: Enable readonly dashboard and write-only ingestion identities
        type: boolean
        default: false
      verify_telemetry:
        description: Require recent real collector telemetry in Greptime (requires dashboard)
        type: boolean
        default: false
      inspect_readers:
        description: Staging only. Also report non-secret account enrollment and serving images during backend qualification
        type: boolean
        default: false
      uninstall_greptimedb:
        description: Only uninstall the old greptimedb release that Pulse replaces (keeps its PVCs and bucket objects)
        type: boolean
        default: false
      purge_greptimedb:
        description: Staging/canary only. Uninstall the old greptimedb release and delete its PVCs, pilot Secret and greptimedb/ bucket objects
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm jq yq node"
          cache: "false"
      - name: Validate backend and shared prerequisites
        run: |
          set -euo pipefail
          bash infra/helm/greptimedb/test-managed.sh
          helm lint infra/helm/greptimedb-grafana -n observability
          helm template greptime-grafana-staging infra/helm/greptimedb-grafana -n observability > /dev/null
          python3 -m venv "$RUNNER_TEMP/greptime-chart-tests"
          "$RUNNER_TEMP/greptime-chart-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/greptime-chart-tests/bin/python" infra/helm/greptimedb-grafana/test_chart.py
          node --check .github/scripts/greptimedb-smoke.mjs
          node --check .github/scripts/greptimedb-live-smoke.mjs
          node --test .github/scripts/openobserve-preflight.test.mjs
          node --test .github/scripts/greptimedb-storage.test.mjs
          node --test .github/scripts/greptimedb-live-smoke.test.mjs
          node --test .github/scripts/pulse-readiness.test.mjs
          helm repo add grafana https://grafana.github.io/helm-charts
          helm dependency build infra/helm/k8s-monitoring
          bash .github/scripts/greptimedb-collectors.test.sh
          mkdir -p "$RUNNER_TEMP/greptimedb-chart"
          helm package infra/helm/greptimedb --destination "$RUNNER_TEMP/greptimedb-chart"
      - uses: actions/upload-artifact@v4
        with:
          name: greptimedb-chart
          path: ${{ runner.temp }}/greptimedb-chart/*.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'tuist/tuist' && !inputs.uninstall_greptimedb && !inputs.purge_greptimedb
    needs: validate
    runs-on: tuist-linux
    timeout-minutes: 60
    environment:
      name: server-k8s-${{ inputs.environment }}
    concurrency:
      group: server-deploy-${{ inputs.environment }}-observability
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DASHBOARD_ENABLED: ${{ inputs.dashboard }}
      KUBECONFIG: ${{ github.workspace }}/.kube/greptimedb-config
      STORAGE_POD: pulse-storage-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_POD: pulse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl jq yq node"
          cache: "false"
      - uses: actions/download-artifact@v4
        with:
          name: greptimedb-chart
          path: ${{ runner.temp }}/greptimedb-deploy
      - name: Render qualified chart
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/greptimedb-deploy"
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          # The reader inspection reads staging's namespace and account only.
          if [[ "$DEPLOY_ENV" != staging && '${{ inputs.inspect_readers }}' == true ]]; then
            echo '::error::inspect_readers is staging-only.'
            exit 1
          fi
          if [[ '${{ inputs.verify_telemetry }}' == true && "$DASHBOARD_ENABLED" != true ]]; then
            echo '::error::Telemetry verification reads with the dashboard identity.'
            exit 1
          fi
          values=()
          if [[ "$DEPLOY_ENV" == production ]]; then values=(-f infra/helm/greptimedb/values-production.yaml); fi
          helm template pulse "$dir/tuist-pulse-0.1.0.tgz" -n observability \
            "${values[@]}" \
            --set "environment=$DEPLOY_ENV,storage.bucket=tuist-pulso-$DEPLOY_ENV,dashboard.enabled=$DASHBOARD_ENABLED" > "$dir/rendered.yaml"
          yq ea -o=json -I=0 '.' "$dir/rendered.yaml" | jq -s 'map(select(. != null))' > "$dir/resources.json"
      - uses: 1password/install-cli-action@v4
      - name: Load selected deployment identity in CI only
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          op document get "kubeconfig: tuist-$DEPLOY_ENV" --vault "tuist-k8s-$DEPLOY_ENV" --output "$KUBECONFIG"
      - name: Inspect staging reader identity without changing enrollment
        if: inputs.inspect_readers
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENV" == staging ]]
          kubectl -n tuist-staging get deployments -l app.kubernetes.io/component=server \
            -o custom-columns=NAME:.metadata.name,IMAGES:.spec.template.spec.containers[*].image
          pod=$(kubectl -n tuist-staging get pods -l app.kubernetes.io/component=server -o json | jq -er '
            [.items[] | select(.metadata.deletionTimestamp == null and
              any(.status.conditions[]?; .type == "Ready" and .status == "True"))][0].metadata.name')
          # Capture runtime chatter/errors privately; print only typed IDs and
          # booleans. Even a credential-bearing endpoint must not reach logs.
          umask 077
          inspection="$RUNNER_TEMP/greptimedb-deploy/reader-inspection"
          if ! kubectl -n tuist-staging exec "$pod" -c server -- /app/bin/tuist rpc '
            account = Tuist.Accounts.get_account_by_handle("tuist") || raise "staging tuist account missing"
            config = Application.get_env(:tuist, :pulse, [])
            IO.puts("STAGING_READER_INSPECTION=" <> Jason.encode!(%{
              account_id: account.id,
              enrolled_account_id: Keyword.get(config, :account_id),
              pulse_reader_available: Code.ensure_loaded?(Tuist.Pulse) and function_exported?(Tuist.Pulse, :query, 4),
              greptime_adapter_available: Code.ensure_loaded?(Tuist.Pulse.Greptime),
              expected_endpoint: Keyword.get(config, :base_url) == "http://pulse.observability.svc.cluster.local:4000",
              expected_database: Keyword.get(config, :tenant) == "public",
              pulse_flag: FunWithFlags.enabled?(:pulse, for: account)
            }))' > "$inspection.out" 2> "$inspection.err"; then
            echo '::error::Staging reader inspection failed; raw runtime output is withheld.'
            exit 1
          fi
          sed -n 's/^STAGING_READER_INSPECTION=//p' "$inspection.out" | jq -es '
            select(length == 1) | .[0] |
            select((.account_id | type) == "number" and
              (.enrolled_account_id == null or (.enrolled_account_id | type) == "number") and
              ([.pulse_reader_available, .greptime_adapter_available,
                .expected_endpoint, .expected_database, .pulse_flag] | all(type == "boolean"))) |
            {account_id, enrolled_account_id, pulse_reader_available, greptime_adapter_available,
              expected_endpoint, expected_database, pulse_flag}'
          rm -f "$inspection.out" "$inspection.err"
          helm history pulse -n observability -o json | jq '[.[] | {revision, chart, status}]'
      - name: Check prerequisites, ownership and capacity before creating backend resources
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greptimedb-deploy"
          kubectl --request-timeout=10s get --raw /version > /dev/null
          kubectl get namespace observability > /dev/null
          kubectl get storageclass hcloud-volumes > /dev/null
          kubectl wait --for=condition=Ready clustersecretstore/onepassword --timeout=60s
          # Collectors authenticate with the dashboard Secret's ingest identity.
          if [[ "$DASHBOARD_ENABLED" != true ]] &&
            kubectl -n observability get externalsecret pulse-dashboard-auth > /dev/null 2>&1; then
            echo '::error::Cannot remove the identities collectors and readers use.'
            exit 1
          fi
          jq -r '.[] | [.kind, .metadata.name] | @tsv' "$dir/resources.json" > "$dir/resources.tsv"
          while IFS=$'\t' read -r kind name; do
            case "$kind" in ConfigMap|Service|StatefulSet|Deployment|PodDisruptionBudget|ExternalSecret|NetworkPolicy|CiliumNetworkPolicy) ;; *) exit 1 ;; esac
            existing=$(kubectl -n observability get "$kind" "$name" --ignore-not-found \
              -o 'jsonpath={.metadata.name}{"\t"}{.metadata.annotations.meta\.helm\.sh/release-name}{"\t"}{.metadata.annotations.meta\.helm\.sh/release-namespace}{"\t"}{.metadata.labels.app\.kubernetes\.io/managed-by}')
            if [[ -n "$existing" && "$existing" != "$(printf '%s\tpulse\tobservability\tHelm' "$name")" ]]; then
              echo "::error::Pulse resource ownership conflict: $kind/$name"
              exit 1
            fi
          done < "$dir/resources.tsv"
          kubectl -n observability get externalsecrets -o json | jq -e '
            all(.items[]; (.spec.target.name // .metadata.name) != "pulse-credentials" or
              .metadata.name == "pulse-credentials") and
            all(.items[]; (.spec.target.name // .metadata.name) != "pulse-dashboard-auth" or
              .metadata.name == "pulse-dashboard-auth") and
            all(.items[]; (.spec.target.name // .metadata.name) != "pulse-auth")' > /dev/null
          # Helm would delete the other topology's workloads (their PVCs are
          # retained). Moving between topologies is a separate migration.
          if jq -e 'any(.[]; .metadata.name == "pulse-datanode")' "$dir/resources.json" > /dev/null; then
            topology=cluster; other=statefulset/pulse
          else
            topology=standalone; other=statefulset/pulse-datanode
          fi
          if [[ -n "$(kubectl -n observability get "$other" --ignore-not-found -o name)" ]]; then
            echo "::error::Refusing to replace an existing $other with the $topology topology in place."
            exit 1
          fi
          kubectl get nodes -l node.cluster.x-k8s.io/pool=general -o json > "$dir/nodes.json"
          kubectl get pods -A -o json > "$dir/pods.json"
          # The HA topology must stay schedulable after losing any one node.
          if [[ "$topology" == cluster ]]; then export CAPACITY_TOLERATE_NODE_LOSS=1; fi
          # An upgrade replaces this release's running pods; count them once.
          CAPACITY_NAMESPACE=observability \
            node .github/scripts/openobserve-capacity.mjs "$dir/nodes.json" "$dir/pods.json" "$dir/resources.json"
          rm -f "$dir/nodes.json" "$dir/pods.json"
      - name: Verify shared S3 lifecycle, privacy and isolated prefix access
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greptimedb-deploy"
          # The probe gets its own run-scoped copy of the chart's storage keys.
          # It must work before the first install, when pulse-credentials is missing.
          jq -e --arg name "$STORAGE_POD" '
            [.[] | select(.kind == "ExternalSecret" and .metadata.name == "pulse-credentials")] |
            select(length == 1) | .[0] |
            select([.spec.data[].secretKey] == ["accessKey", "secretKey"]) |
            {apiVersion, kind, metadata:{name:$name, namespace:"observability"}, spec:{
              refreshInterval:"0", secretStoreRef:.spec.secretStoreRef, data:.spec.data,
              target:{name:$name, creationPolicy:"Owner", template:{engineVersion:"v2", data:{
                AWS_ACCESS_KEY_ID:"{{ .accessKey | trim }}", AWS_SECRET_ACCESS_KEY:"{{ .secretKey | trim }}"}}}}}
          ' "$dir/resources.json" > "$dir/storage-credentials.json"
          kubectl create -f "$dir/storage-credentials.json" > /dev/null
          kubectl -n observability wait --for=condition=Ready "externalsecret/$STORAGE_POD" --timeout=60s
          jq -n --arg name "$STORAGE_POD" --arg run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$DEPLOY_ENV" --arg environment "$DEPLOY_ENV" \
            --rawfile script .github/scripts/greptimedb-storage-check.sh '
            {apiVersion:"v1",kind:"Pod",metadata:{name:$name,namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:300,automountServiceAccountToken:false,
              nodeSelector:{"node.cluster.x-k8s.io/pool":"general"},
              securityContext:{runAsNonRoot:true,runAsUser:65532,fsGroup:65532,seccompProfile:{type:"RuntimeDefault"}},
              volumes:[{name:"scratch",emptyDir:{sizeLimit:"1Mi"}}],
              containers:[{name:"probe",image:"curlimages/curl:8.12.1",command:["sh","-c",$script],
                securityContext:{allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"]}},
                volumeMounts:[{name:"scratch",mountPath:"/tmp"}],
                resources:{requests:{cpu:"25m",memory:"32Mi"},limits:{memory:"64Mi"}},
                envFrom:[{secretRef:{name:$name}}],
                env:[{name:"DEPLOY_ENV",value:$environment},{name:"STORAGE_PREFIX",value:"pulse"},
                  {name:"CHECK_RUN",value:$run}]
              }]}}
          ' > "$RUNNER_TEMP/greptimedb-deploy/storage.json"
          kubectl create -f "$RUNNER_TEMP/greptimedb-deploy/storage.json" > /dev/null
          deadline=$((SECONDS + 300))
          phase=Pending
          while ((SECONDS < deadline)); do
            phase=$(kubectl --request-timeout=10s -n observability get pod "$STORAGE_POD" -o jsonpath='{.status.phase}')
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 5
          done
          # Only our credential-safe prerequisite output, not application logs.
          kubectl -n observability logs "$STORAGE_POD" || true
          [[ "$phase" == Succeeded ]]
          kubectl -n observability delete pod "$STORAGE_POD" --wait=true --timeout=30s > /dev/null
          kubectl -n observability delete externalsecret "$STORAGE_POD" --wait=true --timeout=30s > /dev/null
      - name: Bootstrap pilot authentication without rotating an existing identity
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/greptimedb-deploy"
          printf 'pilot=%s\n' "$(openssl rand -hex 32)" > "$dir/passwd"
          if ! kubectl -n observability create secret generic pulse-auth --from-file=passwd="$dir/passwd" > "$dir/auth.log" 2>&1; then
            grep -q 'secrets "pulse-auth" already exists' "$dir/auth.log"
          fi
          rm -f "$dir/passwd" "$dir/auth.log"
      - name: Install private backend, retaining state on failure
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greptimedb-deploy"
          values=()
          if [[ "$DEPLOY_ENV" == production ]]; then values=(-f infra/helm/greptimedb/values-production.yaml); fi
          if ! helm upgrade --install pulse "$dir/tuist-pulse-0.1.0.tgz" \
            "${values[@]}" \
            --set "environment=$DEPLOY_ENV,storage.bucket=tuist-pulso-$DEPLOY_ENV,dashboard.enabled=$DASHBOARD_ENABLED" \
            -n observability --timeout 20m --wait > "$dir/helm.log" 2>&1; then
            # Helm's error line names the failing step, not rendered values.
            grep -m1 '^Error' "$dir/helm.log" || true
            echo '::error::Pulse rollout failed; state retained for diagnosis.'
            exit 1
          fi
          kubectl -n observability wait --for=condition=Ready externalsecret/pulse-credentials --timeout=60s
          if [[ "$DASHBOARD_ENABLED" == true ]]; then
            kubectl -n observability wait --for=condition=Ready externalsecret/pulse-dashboard-auth --timeout=60s
          fi
      - name: Require OTLP metrics, error logs and traces, then reread after restart without rewriting
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greptimedb-deploy"
          jq -n --arg name "$SMOKE_POD" --arg run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$DEPLOY_ENV" --arg dashboard "$DASHBOARD_ENABLED" --arg environment "$DEPLOY_ENV" \
            --rawfile script .github/scripts/greptimedb-smoke.mjs '
            {apiVersion:"v1",kind:"Pod",metadata:{name:$name,namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:180,automountServiceAccountToken:false,
              nodeSelector:{"node.cluster.x-k8s.io/pool":"general"},
              securityContext:{runAsNonRoot:true,runAsUser:1000,fsGroup:1000,seccompProfile:{type:"RuntimeDefault"}},
              volumes:([{name:"auth",secret:{secretName:"pulse-auth",defaultMode:288}}] +
                if $dashboard == "true" then [{name:"dashboard",secret:{secretName:"pulse-dashboard-auth",defaultMode:288}}] else [] end),
              containers:[{name:"probe",image:"node:22.14.0-alpine3.21",command:["node","--input-type=module","-e",$script],
                securityContext:{allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"]}},
                volumeMounts:([{name:"auth",mountPath:"/auth",readOnly:true}] +
                  if $dashboard == "true" then [{name:"dashboard",mountPath:"/dashboard",readOnly:true}] else [] end),
                resources:{requests:{cpu:"25m",memory:"32Mi"},limits:{memory:"128Mi"}},
                env:[{name:"GREPTIMEDB_URL",value:"http://pulse.observability:4000"},{name:"DEPLOY_ENV",value:$environment},
                  {name:"SMOKE_RUN",value:$run},{name:"GREPTIMEDB_AUTH_FILE",value:"/auth/passwd"}] +
                  if $dashboard == "true" then [{name:"GREPTIMEDB_DASHBOARD_AUTH_FILE",value:"/dashboard/passwd"}] else [] end
              }]}}
          ' > "$dir/native.json"
          jq --rawfile pipeline infra/helm/greptimedb/loki-otlp.yaml \
            '.spec.containers[0].env += [{name:"GREPTIMEDB_LOKI_PIPELINE",value:$pipeline}]' "$dir/native.json" > "$dir/smoke.json"
          kubectl create -f "$dir/smoke.json" > /dev/null
          kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=180s
          kubectl -n observability logs "$SMOKE_POD"
          kubectl -n observability delete pod "$SMOKE_POD" --wait=true --timeout=30s > /dev/null
          # Reread after restarting every stateful process that held the data.
          if kubectl -n observability get statefulset pulse-datanode > /dev/null 2>&1; then
            workloads=(statefulset/pulse-datanode deployment/pulse-frontend)
          else
            workloads=(statefulset/pulse)
          fi
          for workload in "${workloads[@]}"; do
            kubectl -n observability rollout restart "$workload"
            kubectl -n observability rollout status "$workload" --timeout=600s
          done
          jq '.spec.containers[0].env += [{name:"SMOKE_READ_ONLY",value:"true"}]' "$dir/smoke.json" > "$dir/read.json"
          kubectl create -f "$dir/read.json" > /dev/null
          kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=180s
          kubectl -n observability logs "$SMOKE_POD"
      - name: Verify recent real collector telemetry
        if: inputs.verify_telemetry
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greptimedb-deploy"
          kubectl -n observability delete pod "$SMOKE_POD" --wait=true --timeout=30s > /dev/null
          jq --rawfile script .github/scripts/greptimedb-live-smoke.mjs \
            '.spec.activeDeadlineSeconds = 360 | .spec.containers[0].command = ["node","--input-type=module","-e",$script]' \
            "$dir/smoke.json" > "$dir/live-smoke.json"
          kubectl create -f "$dir/live-smoke.json" > /dev/null
          kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=360s
          kubectl -n observability logs "$SMOKE_POD"
      - name: Install private staging Grafana after backend qualification
        if: inputs.dashboard && inputs.environment == 'staging'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/greptimedb-deploy"
          helm template greptime-grafana-staging infra/helm/greptimedb-grafana -n observability > "$dir/grafana.yaml"
          yq ea -o=json -I=0 '.' "$dir/grafana.yaml" | jq -s 'map(select(. != null))' > "$dir/grafana.json"
          kubectl get nodes -l node.cluster.x-k8s.io/pool=general -o json > "$dir/nodes.json"
          kubectl get pods -A -o json > "$dir/pods.json"
          node .github/scripts/openobserve-capacity.mjs "$dir/nodes.json" "$dir/pods.json" "$dir/grafana.json"
          rm -f "$dir/nodes.json" "$dir/pods.json"
          helm upgrade --install greptime-grafana-staging infra/helm/greptimedb-grafana \
            -n observability --wait --timeout 5m
      - name: Sanitized failure diagnostics
        if: failure()
        run: |
          kubectl -n observability get pods -l app.kubernetes.io/instance=pulse \
            -o custom-columns=NAME:.metadata.name,PHASE:.status.phase --no-headers || true
      - name: Remove disposable probes and CI-local files only
        if: always()
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/greptimedb-deploy"; rm -f "$KUBECONFIG"' EXIT
          if [[ -f "$KUBECONFIG" ]]; then
            kubectl -n observability delete pod "$SMOKE_POD" "$STORAGE_POD" --ignore-not-found --wait=true --timeout=30s
            kubectl -n observability delete externalsecret "$STORAGE_POD" --ignore-not-found --wait=true --timeout=30s
          fi

  uninstall-greptimedb:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'tuist/tuist' && (inputs.uninstall_greptimedb || inputs.purge_greptimedb)
    needs: validate
    runs-on: tuist-linux
    # The purge waits up to 20 minutes for its bucket pod.
    timeout-minutes: 40
    environment: server-k8s-${{ inputs.environment }}
    concurrency:
      group: server-deploy-${{ inputs.environment }}-observability
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      KUBECONFIG: ${{ github.workspace }}/.kube/greptimedb-uninstall-config
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl jq"
          cache: "false"
      - uses: 1password/install-cli-action@v4
      - name: Load selected deployment identity in CI only
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-$DEPLOY_ENV" --vault "tuist-k8s-$DEPLOY_ENV" --output "$KUBECONFIG"
      - name: Uninstall the old greptimedb release, keeping its volumes
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          # --keep-history leaves an "uninstalled" record that helm status still reports.
          status=$(helm status greptimedb -n observability -o json 2>/dev/null | jq -r '.info.status') || status=
          if [[ -z "$status" || "$status" == uninstalled ]]; then
            echo 'PASS: no greptimedb release to uninstall'
          else
            # Alloy fails its whole config load, Grafana Cloud included, when a
            # Secret it references is missing, and a pod cannot start without a
            # Secret it mounts, so refuse while anything outside the release does.
            if grep -Eq 'greptimedb\.observability|greptimedb-(dashboard-auth|credentials|auth)' "infra/helm/k8s-monitoring/values-$DEPLOY_ENV.yaml"; then
              echo '::error::k8s-monitoring still sends to the greptimedb release in this environment.'
              exit 1
            fi
            if kubectl -n observability get configmaps -o json | jq -e '
              any(.items[] | select(.metadata.name | startswith("k8s-monitoring")) | (.data // {})[];
                test("greptimedb\\.observability|greptimedb-(dashboard-auth|credentials|auth)"))' > /dev/null; then
              echo '::error::Live collectors still send to the greptimedb release; deploy the server to this environment first.'
              exit 1
            fi
            if kubectl get pods -A -o json | jq -e '
              any(.items[] | select(.metadata.labels["app.kubernetes.io/instance"] != "greptimedb");
                [.spec.volumes[]?.secret.secretName, .spec.volumes[]?.projected.sources[]?.secret.name,
                  ((.spec.initContainers // [], .spec.containers)[] | .envFrom[]?.secretRef.name, .env[]?.valueFrom.secretKeyRef.name)] |
                any(.[]; . == "greptimedb-credentials" or . == "greptimedb-dashboard-auth"))' > /dev/null; then
              echo '::error::A pod outside the greptimedb release still mounts its Secrets.'
              exit 1
            fi
            pvcs() { kubectl -n observability get pvc -o name | { grep -E '/data-greptimedb' || true; } | sort; }
            pvcs > "$RUNNER_TEMP/greptimedb-pvcs"
            helm history greptimedb -n observability -o json | jq -r '
              .[] | select(.status == "deployed") |
              "Uninstalled greptimedb revision \(.revision), chart \(.chart); history kept for helm rollback."' | tee -a "$GITHUB_STEP_SUMMARY"
            # Helm never deletes StatefulSet volume claims; check they survive.
            helm uninstall greptimedb -n observability --keep-history --wait --timeout 5m
            pvcs | cmp - "$RUNNER_TEMP/greptimedb-pvcs"
            sed 's/^/Kept /' "$RUNNER_TEMP/greptimedb-pvcs" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          [[ -z "$(kubectl -n observability get statefulset,deployment,service greptimedb greptimedb-datanode greptimedb-frontend --ignore-not-found -o name)" ]]
          # Grafana Cloud collection must keep running without it.
          for workload in $(kubectl -n observability get deployment,statefulset,daemonset -o name | grep '/k8s-monitoring-'); do
            kubectl -n observability rollout status "$workload" --timeout=180s
          done
          # The same gate the next routine server deploy runs before collectors.
          bash .github/scripts/pulse-readiness.sh
      - name: Delete the old release's volumes, pilot Secret and bucket objects
        if: inputs.purge_greptimedb
        env:
          PURGE_POD: greptimedb-purge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Production never ran the greptimedb release; its bucket is not touched.
          case "$DEPLOY_ENV" in staging|canary) ;; *) echo '::error::purge_greptimedb is staging/canary only.'; exit 1 ;; esac
          if kubectl get pods -A -o json | jq -e '
            any(.items[]; any(.spec.volumes[]?; (.persistentVolumeClaim.claimName // "") | startswith("data-greptimedb-")))' > /dev/null; then
            echo '::error::A pod still mounts a data-greptimedb volume.'
            exit 1
          fi
          # The hcloud PVs are Retain: switch each to Delete first, or the
          # backing volume is stranded with nothing pointing at it.
          for claim in $(kubectl -n observability get pvc -o name | { grep '/data-greptimedb-' || true; }); do
            pv=$(kubectl -n observability get "$claim" -o jsonpath='{.spec.volumeName}')
            kubectl patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
            kubectl -n observability delete "$claim" --wait=true --timeout=2m
            kubectl wait --for=delete "pv/$pv" --timeout=5m
            echo "Deleted $claim and its volume $pv" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          kubectl -n observability delete secret greptimedb-auth --ignore-not-found
          # Only the greptimedb/ prefix: Pulse's pulse/ data shares this bucket.
          jq -n --arg name "$PURGE_POD" --arg bucket "tuist-pulso-$DEPLOY_ENV" '
            {apiVersion:"v1",kind:"Pod",metadata:{name:$name,namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:1200,automountServiceAccountToken:false,
              nodeSelector:{"node.cluster.x-k8s.io/pool":"general"},
              securityContext:{runAsNonRoot:true,runAsUser:65532,fsGroup:65532,seccompProfile:{type:"RuntimeDefault"}},
              volumes:[{name:"tmp",emptyDir:{sizeLimit:"64Mi"}}],
              containers:[{name:"purge",image:"docker.io/amazon/aws-cli:2.40.2@sha256:acc32af784911165a8e78b63950625d174ba79b800a66a436c974689c87cd755",
                command:["sh","-ec",("p=s3://" + $bucket + "/greptimedb/\n" +
                  "count() { aws s3 ls \"$p\" --recursive || true; }\n" +
                  "echo \"greptimedb/ objects before: $(count | wc -l)\"\n" +
                  "aws s3 rm \"$p\" --recursive --only-show-errors\n" +
                  "left=$(count | wc -l); echo \"greptimedb/ objects after: $left\"; [ \"$left\" = 0 ]")],
                securityContext:{allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"]}},
                volumeMounts:[{name:"tmp",mountPath:"/tmp"}],
                resources:{requests:{cpu:"50m",memory:"128Mi"},limits:{memory:"256Mi"}},
                env:[{name:"HOME",value:"/tmp"},{name:"AWS_ENDPOINT_URL",value:"https://t3.storage.dev"},
                  {name:"AWS_DEFAULT_REGION",value:"auto"},{name:"AWS_REQUEST_CHECKSUM_CALCULATION",value:"when_required"},
                  {name:"AWS_ACCESS_KEY_ID",valueFrom:{secretKeyRef:{name:"pulse-credentials",key:"PULSE_STANDALONE__STORAGE__ACCESS_KEY_ID"}}},
                  {name:"AWS_SECRET_ACCESS_KEY",valueFrom:{secretKeyRef:{name:"pulse-credentials",key:"PULSE_STANDALONE__STORAGE__SECRET_ACCESS_KEY"}}}]
              }]}}' > "$RUNNER_TEMP/purge.json"
          kubectl create -f "$RUNNER_TEMP/purge.json" > /dev/null
          deadline=$((SECONDS + 1200)); phase=Pending
          while ((SECONDS < deadline)); do
            phase=$(kubectl --request-timeout=10s -n observability get pod "$PURGE_POD" -o jsonpath='{.status.phase}')
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 5
          done
          kubectl -n observability logs "$PURGE_POD" | tee -a "$GITHUB_STEP_SUMMARY" || true
          kubectl -n observability delete pod "$PURGE_POD" --wait=true --timeout=30s > /dev/null
          [[ "$phase" == Succeeded ]]
      - name: Remove CI-local identity
        if: always()
        run: rm -f "$KUBECONFIG"
