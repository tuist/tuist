name: Cache Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cache/**
      - tuist_common/**
      - .github/workflows/cache-deploy.yml

concurrency:
  group: cache-deploy
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: cache

env:
  MISE_VERSION: "2026.5.15"
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy-canary:
    # Must stay on a GitHub-hosted runner: kamal SSHes into the cache hosts, and
    # the in-house fleet's runner Pods have no TCP 22 egress (the
    # runners-default-deny NetworkPolicy allows only DNS, 80/443 and Kura 4000),
    # so kamal dies with Net::SSH::ConnectionTimeout there. ubuntu-latest is
    # 4 vCPU / 16 GB on public repos — kamal builds the Elixir release image
    # locally and the 2/8 shape OOMs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cache-canary
    steps:
      - uses: actions/checkout@v4
      - uses: 1password/install-cli-action@v2
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          working_directory: cache
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CACHE_SSH_PRIVATE_KEY }}
      - name: Deploy with Kamal
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.CACHE_OP_SERVICE_ACCOUNT_TOKEN }}
          SECRETS: ${{ secrets.CACHE_KAMAL_SECRETS }}
        run: |
          mise run deploy canary
  deploy-production:
    # Must stay on a GitHub-hosted runner: kamal SSHes into the cache hosts, and
    # the in-house fleet's runner Pods have no TCP 22 egress (the
    # runners-default-deny NetworkPolicy allows only DNS, 80/443 and Kura 4000),
    # so kamal dies with Net::SSH::ConnectionTimeout there. ubuntu-latest is
    # 4 vCPU / 16 GB on public repos — kamal builds the Elixir release image
    # locally and the 2/8 shape OOMs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-canary
    if: ${{ needs.deploy-canary.result == 'success' }}
    environment: cache-production
    steps:
      - uses: actions/checkout@v4
      - uses: 1password/install-cli-action@v2
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          working_directory: cache
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CACHE_SSH_PRIVATE_KEY }}
      - name: Deploy with Kamal
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.CACHE_OP_SERVICE_ACCOUNT_TOKEN }}
          SECRETS: ${{ secrets.CACHE_KAMAL_SECRETS }}
        run: |
          mise run deploy production
