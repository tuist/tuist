name: Gradle Release

# Releases the Tuist Gradle plugin. Extracted from release.yml: the plugin is a
# client artifact independent of the server, so it gets its own lane and is
# never queued behind a server deploy. Gradle releases by commit scope
# (feat(gradle) etc., filtered in gradle/cliff.toml), so the workflow runs on
# gradle source changes and release:check decides whether to publish.

on:
  push:
    branches:
      - main
    paths:
      - gradle/**
      - mise/tasks/release/components.json
      - .github/workflows/gradle-release.yml
      - .github/scripts/gradle-patch-release.sh
      - .github/scripts/gradle-patch-release.test.mjs
  pull_request:
    paths:
      - .github/workflows/gradle-release.yml
      - .github/scripts/gradle-patch-release.sh
      - .github/scripts/gradle-patch-release.test.mjs
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Stable patch only: full SHA at the head of releases/gradle-X.Y.x; supply with patch_version"
        type: string
        required: false
      patch_version:
        description: "Stable patch only: next patch of the latest stable Gradle tag (e.g. 0.18.1)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Serialize gradle publishing through one ref-independent group: it derives
  # the next version from the gradle@ tag set and creates a tag, so two runs
  # must never overlap. Queue rather than cancel so an in-flight publish is
  # never torn.
  group: ${{ github.event_name == 'pull_request' && format('gradle-release-validation-{0}', github.event.pull_request.number) || 'gradle-release' }}
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}

jobs:
  validate:
    name: Validate stable patch controls
    runs-on: tuist-linux
    timeout-minutes: 5
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/gradle-patch-release.test.mjs

  check:
    name: Check for releasable changes
    needs: validate
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.check.outputs.gradle-should-release }}
      next-version: ${{ steps.check.outputs.gradle-next-version }}
      next-version-number: ${{ steps.check.outputs.gradle-next-version-number }}
      source-sha: ${{ steps.check.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PATCH_VERSION: ${{ inputs.patch_version }}
        run: |
          if [[ -n "$SOURCE_SHA" || -n "$PATCH_VERSION" ]]; then
            bash .github/scripts/gradle-patch-release.sh
          else
            mise run --skip-tools release:check gradle
            echo "source-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release Gradle Plugin
    needs: check
    permissions:
      contents: write
    if: needs.check.outputs.should-release == 'true'
    runs-on: tuist-linux
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
      - name: Revalidate stable patch and pin source
        env:
          SOURCE_SHA: ${{ needs.check.outputs.source-sha }}
          PATCH_VERSION: ${{ inputs.patch_version }}
        run: |
          # Execute controls from the workflow revision, never the selected source.
          if [[ -n "$PATCH_VERSION" ]]; then
            bash .github/scripts/gradle-patch-release.sh
          fi
          git checkout --detach "$SOURCE_SHA"
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked java gradle git-cliff 1password-cli"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Test stable patch and build shaded artifact
        if: inputs.patch_version != ''
        working-directory: gradle
        run: ./gradlew test shadowJar -Pversion=${{ needs.check.outputs.next-version-number }} --no-build-cache --no-watch-fs

      - name: Get release notes
        id: release-notes
        run: |
          # Get the latest gradle version tag
          LATEST_VERSION=$(git tag -l | grep -E "^gradle@[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)

          if [ -n "$LATEST_VERSION" ]; then
            RELEASE_NOTES=$(git cliff --config gradle/cliff.toml --repository "." 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2)
          else
            RELEASE_NOTES=$(git cliff --config gradle/cliff.toml --repository "." 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2)
          fi

          if [ -z "$(echo "$RELEASE_NOTES" | tr -d '[:space:]')" ]; then
            echo "Gradle release notes are empty. Refusing to publish a release without notes." >&2
            exit 1
          fi

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        working-directory: gradle
        run: git cliff --include-path "gradle/**/*" --config cliff.toml --repository "../" --tag "${{ needs.check.outputs.next-version }}" -o CHANGELOG.md 2>/dev/null

      - name: Publish to Gradle Plugin Portal
        working-directory: gradle
        run: |
          # Fail before accessing publishing credentials if the version is taken.
          TAG=${{ needs.check.outputs.next-version }}
          REMOTE_TAGS=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$REMOTE_TAGS" ]; then
            echo "Tag $TAG already exists on origin" >&2
            exit 1
          fi
          PUBLISH_KEY=$(op read "op://tuist/GRADLE_PUBLISH_KEY/password")
          PUBLISH_SECRET=$(op read "op://tuist/GRADLE_PUBLISH_SECRET/password")
          ./gradlew publishPlugins -Pversion=${{ needs.check.outputs.next-version-number }} -Pgradle.publish.key="$PUBLISH_KEY" -Pgradle.publish.secret="$PUBLISH_SECRET"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Update version in settings.gradle.kts
        run: |
          sed -i 's/id("dev.tuist") version ".*"/id("dev.tuist") version "${{ needs.check.outputs.next-version-number }}"/' gradle/settings.gradle.kts

      - name: Tag Gradle release
        run: |
          TAG=${{ needs.check.outputs.next-version }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin"
            exit 1
          fi

          git tag "$TAG" "${{ needs.check.outputs.source-sha }}"
          git push origin "refs/tags/$TAG"

      - name: Create Gradle GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          repository: tuist/tuist
          name: Gradle Plugin ${{ needs.check.outputs.next-version-number }}
          tag_name: ${{ needs.check.outputs.next-version }}
          body: |
            Gradle Plugin Portal: `dev.tuist:${{ needs.check.outputs.next-version-number }}`

            ${{ steps.release-notes.outputs.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
