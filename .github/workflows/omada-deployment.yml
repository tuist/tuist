name: Rack Fleet Controller Deployment

# The Omada SDN controller for the rack fleet (infra/helm/omada), and the rack
# switch controller that drives it (infra/helm/rack-switch-controller). One
# Omada controller, because a switch can be adopted by only one; both live in
# the cluster the rack belongs to. The Omada admin account and Open API client
# come from its own first-boot wizard, so nothing here seeds them; the rack
# switch controller reads the API client and the site's device account from
# 1Password through ExternalSecrets.
#
# WHICH CLUSTER. The rack's site definition says: its kubernetes.namespace is
# `tuist-<env>`, or `tuist` for production (`rack:fleet env`), and the deploy
# goes to that env's cluster, with infra/helm/omada/values-<env>.yaml. The rack
# switch controller's namespace, Omada site, controller address and 1Password
# items, and the edge's site, come from the same file (`rack:fleet
# helm-values`), so moving the rack is an edit to the site definition alone.
# A dispatch can name another env, which installs the Omada controller there
# and nothing else: the controller a rack moves to has to be running before the
# switches are pointed at it, while the rack switch controller and the edge
# follow the site definition. See "Production" in infra/rack-nodes/AGENTS.md.
#
# It also applies the RackSwitch CRD to the same cluster. server-deployment.yml
# carries that CRD to every cluster it deploys, but merges only deploy canary
# and production; staging gets a server deploy only when someone dispatches
# one, and the rack's objects need their CRD where the rack is.
#
# And it installs the rack-edge DaemonSet (infra/helm/rack-edge), which puts the
# rack's edge workload on each edge node, a RackLinuxMachine of this cluster, as
# a kubelet static pod: the WAN, the switches' path into the tailnet and their
# DHCP.
#
# THE IMAGES. rack-switch-controller-image.yml and rack-edge-image.yml build
# `sha-<12 sha>` only for a push that changes their image's inputs, so the image
# to deploy is the one of the newest commit at or before DEPLOY_SHA that
# touched them. A merge that changes both an image and its chart starts this
# workflow and the image build together, so the deploy waits for that tag to
# appear in the registry before installing it. A workflow_run trigger on an
# image build would cover only merges that build an image, and a chart or CRD
# change alone would never deploy.

on:
  push:
    branches:
      - main
    paths:
      - infra/helm/omada/**
      - infra/helm/rack-switch-controller/**
      - infra/rack-switch-controller/**
      - infra/helm/tuist/crds/tuist.dev_rackswitches.yaml
      - infra/helm/rack-edge/**
      - infra/rack-switch-fleet/edge/**
      - infra/rack-switch-fleet/sites/**
      - infra/rack-switch-fleet/lib/config.sh
      - .github/workflows/omada-deployment.yml
      - .github/workflows/rack-switch-controller-image.yml
      - .github/workflows/rack-edge-image.yml
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (defaults to github.sha)
        required: false
      environment:
        description: Where to deploy. `rack` deploys everything to the env the rack is in; another env gets only the Omada controller
        required: false
        default: rack
        type: choice
        options:
          - rack
          - staging
          - production

permissions:
  contents: read
  packages: read

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_DEPLOY_GITHUB_TOKEN || github.token }}
  HELM_CHART_PATH: infra/helm/omada
  HELM_RELEASE_NAME: omada
  NAMESPACE: omada
  CONTROLLER_CHART_PATH: infra/helm/rack-switch-controller
  CONTROLLER_RELEASE_NAME: rack-switch-controller
  CONTROLLER_IMAGE: ghcr.io/tuist/rack-switch-controller
  EDGE_CHART_PATH: infra/helm/rack-edge
  EDGE_RELEASE_NAME: rack-edge
  EDGE_IMAGE: ghcr.io/tuist/rack-edge
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  resolve:
    name: Find the rack's cluster
    if: github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.site.outputs.environment }}
      site: ${{ steps.site.outputs.site }}
      rack: ${{ steps.site.outputs.rack }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Read the site definition
        id: site
        env:
          REQUESTED: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # One Omada controller, so one site with a controller.
          sites=()
          for file in infra/rack-switch-fleet/sites/*.json; do
            if jq -e '.management.controller != null' "$file" >/dev/null; then
              sites+=("$(basename "$file" .json)")
            fi
          done
          if [ "${#sites[@]}" -ne 1 ]; then
            echo "::error::expected one site with a management.controller, found ${#sites[@]}: ${sites[*]}"
            exit 1
          fi
          site="${sites[0]}"
          environment="$(infra/rack-switch-fleet/fleet.sh --site "$site" env)"
          rack=true
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != rack ] && [ "$REQUESTED" != "$environment" ]; then
            echo "$site is in $environment; installing only the Omada controller in $REQUESTED"
            environment="$REQUESTED"
            rack=false
          fi
          if [ ! -f "$HELM_CHART_PATH/values-$environment.yaml" ]; then
            echo "::error::$environment has no Omada controller values ($HELM_CHART_PATH/values-$environment.yaml)"
            exit 1
          fi
          echo "$site deploys to $environment (rack switch controller and edge: $rack)"
          {
            echo "environment=$environment"
            echo "site=$site"
            echo "rack=$rack"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: server-k8s-${{ needs.resolve.outputs.environment }}
    concurrency:
      group: omada-deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      SITE: ${{ needs.resolve.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          # History without file contents, for the git log that finds the
          # images' commits.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v2
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-$ENVIRONMENT" \
            --vault "tuist-k8s-$ENVIRONMENT" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability
        run: |
          set -euo pipefail
          API="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Reaching apiserver at $API"
          kubectl --request-timeout=10s get --raw /version >/dev/null
      - name: Apply the RackSwitch CRD
        run: |
          set -euo pipefail
          kubectl apply -f infra/helm/tuist/crds/tuist.dev_rackswitches.yaml
          kubectl wait --for condition=established --timeout=60s crd/rackswitches.tuist.dev
      - name: Fetch the wrapped chart
        run: helm dependency build "$HELM_CHART_PATH"
      - name: helm upgrade --install
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$HELM_CHART_PATH/values.yaml" \
            -f "$HELM_CHART_PATH/values-$ENVIRONMENT.yaml" \
            --atomic --timeout 10m --wait
      - name: Resolve the images
        if: needs.resolve.outputs.rack == 'true'
        id: image
        run: |
          set -euo pipefail
          resolve() {
            local name="$1"; shift
            local commit
            commit="$(git log -1 --format=%H "$DEPLOY_SHA" -- "$@")"
            if [ -z "$commit" ]; then
              echo "::error::no commit at or before $DEPLOY_SHA changes the $name image"
              exit 1
            fi
            echo "${name}_commit=$commit" >> "$GITHUB_OUTPUT"
            echo "${name}_tag=sha-${commit::12}" >> "$GITHUB_OUTPUT"
          }
          resolve controller infra/rack-switch-controller .github/workflows/rack-switch-controller-image.yml
          resolve edge infra/rack-switch-fleet/edge .github/workflows/rack-edge-image.yml
      - uses: docker/login-action@v3
        if: needs.resolve.outputs.rack == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the images
        if: needs.resolve.outputs.rack == 'true'
        env:
          CONTROLLER_TAG: ${{ steps.image.outputs.controller_tag }}
          CONTROLLER_COMMIT: ${{ steps.image.outputs.controller_commit }}
          EDGE_TAG: ${{ steps.image.outputs.edge_tag }}
          EDGE_COMMIT: ${{ steps.image.outputs.edge_commit }}
        run: |
          set -euo pipefail
          wait_for() {
            local image="$1" commit="$2" workflow="$3"
            for attempt in $(seq 1 60); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                echo "$image is published"
                return 0
              fi
              echo "waiting for $image ($attempt/60)"
              sleep 15
            done
            echo "::error::$image did not appear within 15 minutes; see the $workflow run for $commit"
            exit 1
          }
          wait_for "$CONTROLLER_IMAGE:$CONTROLLER_TAG" "$CONTROLLER_COMMIT" "Rack Switch Controller Image"
          wait_for "$EDGE_IMAGE:$EDGE_TAG" "$EDGE_COMMIT" "Rack Edge Image"
      - name: helm upgrade --install the rack switch controller
        if: needs.resolve.outputs.rack == 'true'
        env:
          TAG: ${{ steps.image.outputs.controller_tag }}
        run: |
          set -euo pipefail
          infra/rack-switch-fleet/fleet.sh --site "$SITE" helm-values rack-switch-controller > "$RUNNER_TEMP/controller-site.yaml"
          helm upgrade --install "$CONTROLLER_RELEASE_NAME" "$CONTROLLER_CHART_PATH" \
            --namespace "$NAMESPACE" \
            -f "$CONTROLLER_CHART_PATH/values.yaml" \
            -f "$RUNNER_TEMP/controller-site.yaml" \
            --set image.tag="$TAG" \
            --atomic --timeout 5m --wait
      # Last, and not waited on, like the other releases on rack nodes (see
      # "Deploys and the rack's health" in infra/rack-nodes/AGENTS.md): an edge
      # that is dark would hold the wait forever. The DaemonSet rolls the edges
      # one at a time when they are up, each held 90 s after its static pod
      # applied the new configuration; `kubectl -n omada rollout status
      # ds/rack-edge-<site>` follows it.
      - name: helm upgrade --install the rack edge
        if: needs.resolve.outputs.rack == 'true'
        env:
          TAG: ${{ steps.image.outputs.edge_tag }}
        run: |
          set -euo pipefail
          infra/rack-switch-fleet/fleet.sh --site "$SITE" helm-values rack-edge > "$RUNNER_TEMP/edge-site.yaml"
          helm upgrade --install "$EDGE_RELEASE_NAME" "$EDGE_CHART_PATH" \
            --namespace "$NAMESPACE" \
            -f "$EDGE_CHART_PATH/values.yaml" \
            -f "$RUNNER_TEMP/edge-site.yaml" \
            --set image.tag="$TAG" \
            --wait=hookOnly
      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "::group::helm history"
          helm history "$HELM_RELEASE_NAME" -n "$NAMESPACE" --max 10 || true
          helm history "$CONTROLLER_RELEASE_NAME" -n "$NAMESPACE" --max 10 || true
          helm history "$EDGE_RELEASE_NAME" -n "$NAMESPACE" --max 10 || true
          echo "::endgroup::"
          echo "::group::workload resources"
          kubectl -n "$NAMESPACE" get statefulset,deployment,daemonset,svc,pvc,pods,externalsecret -o wide || true
          echo "::endgroup::"
          echo "::group::logs"
          kubectl -n "$NAMESPACE" logs statefulset/"$HELM_RELEASE_NAME-omada-controller" --tail=200 || true
          kubectl -n "$NAMESPACE" logs deployment/"$CONTROLLER_RELEASE_NAME" --tail=200 || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp 2>&1 | tail -100 || true
          echo "::endgroup::"
