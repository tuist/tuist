name: DMG diagnose (temporary)

on:
  push:
    branches:
      - claude/riverside-create-dmg-macos-f46f2e

jobs:
  diagnose:
    runs-on: tuist-macos
    timeout-minutes: 20
    steps:
      - name: Finder main thread before any AppleEvent
        run: |
          pgrep -l -f 'UserNotificationCenter' || echo "no UserNotificationCenter"
          sample Finder 2 -file /tmp/finder-idle.txt >/dev/null 2>&1 || true
          awk '/Call graph:/{f=1} f' /tmp/finder-idle.txt | head -40

      - name: One AppleEvent, with TCC decisions streamed
        run: |
          log stream --style compact --predicate 'subsystem == "com.apple.TCC" OR process == "UserNotificationCenter"' > /tmp/tcc.log 2>&1 &
          stream=$!
          sleep 2
          ( sleep 10; sample Finder 2 -file /tmp/finder-busy.txt >/dev/null 2>&1 ) &
          start=$(date +%s)
          osascript -e 'with timeout of 20 seconds' -e 'tell application "Finder" to get name of startup disk' -e 'end timeout' \
            || echo "FAILED after $(( $(date +%s) - start ))s"
          sleep 2; kill $stream || true
          pgrep -l -f 'UserNotificationCenter' || echo "no UserNotificationCenter"
          echo "--- TCC"
          grep -i -E 'appleevents|finder|prompt|responsible|AUTHREQ|display' /tmp/tcc.log | cut -c1-400 | head -40
          echo "--- Finder main thread while the event was pending"
          awk '/Call graph:/{f=1} f' /tmp/finder-busy.txt | head -40

