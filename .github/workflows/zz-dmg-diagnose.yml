name: DMG diagnose (temporary)

on:
  push:
    branches:
      - claude/riverside-create-dmg-macos-f46f2e

jobs:
  diagnose:
    runs-on: tuist-macos
    timeout-minutes: 20
    steps:
      - name: Seed Runner.Listener approvals and retry Finder
        run: |
          SYSTEM_DB='/Library/Application Support/com.apple.TCC/TCC.db'
          USER_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          CLIENT=/Users/runner/actions-runner/bin/Runner.Listener
          echo "boot: $(sysctl -n kern.boottime)"
          stat -f 'user db born %SB, modified %Sm' "$USER_DB" || echo "no per-user TCC.db"
          csrutil status || true

          seed() {
            sudo sqlite3 "$1" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, flags, last_modified) VALUES ('kTCCServiceAppleEvents', '$CLIENT', 1, 2, 4, 1, 0, 'com.apple.finder', 0, strftime('%s','now'));" \
              && echo "seeded $1" || echo "seed FAILED for $1"
          }
          try_finder() {
            start=$(date +%s)
            osascript -e 'with timeout of 20 seconds' -e 'tell application "Finder" to get name of startup disk' -e 'end timeout' \
              && echo "OK after $(( $(date +%s) - start ))s" || echo "FAILED after $(( $(date +%s) - start ))s"
          }
          try_dmg() {
            mkdir -p /tmp/dmgsrc && echo hi > /tmp/dmgsrc/file.txt
            hdiutil create -quiet -srcfolder /tmp/dmgsrc -volname diagvol -format UDRW -ov /tmp/diag.dmg
            hdiutil attach -quiet -readwrite -noverify -noautoopen /tmp/diag.dmg
            sleep 3
            for stmt in 'open' 'set current view of container window to icon view' 'get bounds of container window'; do
              start=$(date +%s)
              echo "--- $stmt"
              osascript -e 'with timeout of 20 seconds' -e 'tell application "Finder"' -e 'tell disk "diagvol"' -e "$stmt" -e 'end tell' -e 'end tell' -e 'end timeout' \
                && echo "OK" || echo "FAILED after $(( $(date +%s) - start ))s"
            done
            hdiutil detach /Volumes/diagvol -force >/dev/null || true
          }

          echo "===== stage 1: system database only"
          seed "$SYSTEM_DB"
          try_finder

          echo "===== stage 2: per-user database as well"
          seed "$USER_DB"
          killall UserNotificationCenter 2>/dev/null || true
          try_finder
          echo "--- after restarting the user tccd"
          killall tccd 2>/dev/null || true
          sleep 2
          try_finder
          try_dmg

      - name: Stage 3, create-dmg end to end
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg >/dev/null
          mkdir -p /tmp/app/Diag.app/Contents/MacOS
          printf '#!/bin/sh\n' > /tmp/app/Diag.app/Contents/MacOS/Diag && chmod +x /tmp/app/Diag.app/Contents/MacOS/Diag
          create-dmg --window-size 605 363 --icon Diag.app 139 161 --app-drop-link 467 161 --volname Diag /tmp/Diag.dmg /tmp/app
          ls -la /tmp/Diag.dmg
