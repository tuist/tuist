name: Pulse Instance Deployment (retired)

# Historical callers can receive a notice but cannot restore an old writer.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      chart_sha256:
        required: true
        type: string
      overlay_sha256:
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  retired:
    name: Retired — no runtime deployed
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The old Pulse runtime is retired. Use GreptimeDB Replacement; no deployment was performed.'
