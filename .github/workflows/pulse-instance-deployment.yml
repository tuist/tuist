name: Pulse Instance Deployment

# Called only after publication verification. Never execute historical release
# control code, adopt another Helm release's objects, or restore the old binary.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      chart_sha256:
        required: true
        type: string
      overlay_sha256:
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy and qualify Pulse
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: tuist-linux
    timeout-minutes: 60
    environment:
      name: server-k8s-${{ inputs.environment }}
    # Serialize with monitoring upgrades too, so a wrapper rollout cannot
    # recreate the retired backend while the independent instance is starting.
    concurrency:
      group: server-deploy-${{ inputs.environment }}-observability
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      CHART_SHA256: ${{ inputs.chart_sha256 }}
      OVERLAY_SHA256: ${{ inputs.overlay_sha256 }}
      KUBECONFIG: ${{ github.workspace }}/.kube/pulse-config
      NAMESPACE: observability
      HELM_RELEASE_NAME: pulse
      SMOKE_POD: pulse-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      TELEMETRY_POD: pulse-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate instance inputs and compatibility floor
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # The first renamed release includes backward-compatible storage
          # readers. Never roll production data back into the previous binary.
          [[ "$(printf '%s\n' 1.39.0 "$VERSION" | sort -V | head -1)" == 1.39.0 ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CHART_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OVERLAY_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl jq yq"
          cache: "false"
          github_token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pulse-deployment-inputs
          path: ${{ runner.temp }}/pulse-deploy
      - name: Recheck immutable deployment inputs and render safety contract
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/pulse-deploy"
          overlay="$dir/values-managed-$DEPLOY_ENV.yaml"
          git fetch --no-tags origin "refs/tags/pulse@$VERSION:refs/tags/pulse@$VERSION"
          [[ "$(git rev-parse "refs/tags/pulse@$VERSION^{commit}")" == "$SOURCE_SHA" ]]
          echo "$CHART_SHA256  $dir/pulse-$VERSION.tgz" | sha256sum -c -
          echo "$OVERLAY_SHA256  $overlay" | sha256sum -c -
          git show "$SOURCE_SHA:infra/helm/pulse/values-managed-$DEPLOY_ENV.yaml" | cmp - "$overlay"
          helm template "$HELM_RELEASE_NAME" "$dir/pulse-$VERSION.tgz" --namespace "$NAMESPACE" \
            --values "$overlay" --set-string image.repository=ghcr.io/tuist/pulse \
            --set-string "image.tag=$VERSION@$IMAGE_DIGEST" > "$dir/rendered.yaml"
          yq ea -o=json -I=0 '.' "$dir/rendered.yaml" | jq -s 'map(select(. != null))' > "$dir/resources.json"
          expected_host="pulse-$DEPLOY_ENV.tuist.dev"
          if [[ "$DEPLOY_ENV" == production ]]; then expected_host=pulse.tuist.dev; fi
          jq -e --arg image "ghcr.io/tuist/pulse:$VERSION@$IMAGE_DIGEST" --arg host "$expected_host" \
            --arg version "$VERSION" -f .github/scripts/pulse-render-contract.jq "$dir/resources.json" >/dev/null
      - name: Prepare release-source monitoring chart without historical scripts
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy/source"
          mkdir -p "$dir"
          git archive "$SOURCE_SHA" infra/helm/k8s-monitoring | tar -x -C "$dir"
          chart="$dir/infra/helm/k8s-monitoring"
          # Intentional legacy identifier: historical rollbacks must never
          # reinstall the embedded old storage writer, even at zero replicas.
          legacy_name=pulso
          yq -o=json '.' "$chart/Chart.yaml" \
            | jq -e --arg legacy "$legacy_name" 'all(.dependencies[]?; .name != $legacy)' >/dev/null
          yq -o=json '.' "$chart/values-$DEPLOY_ENV.yaml" \
            | jq -e --arg environment "$DEPLOY_ENV" '
              .["k8s-monitoring"].destinations["pulse-metrics"] |
              .url == "http://pulse.observability.svc.cluster.local:4000/api/v1/write" and
              .auth.type == "basic" and .auth.usernameKey == "pulse-username" and
              .auth.passwordKey == "pulse-password" and .secret.create == false and
              .secret.name == "pulse-credentials" and .secret.namespace == "observability" and
              .extraLabels.env == $environment' >/dev/null
          # Consume Chart.lock, not the newest matching dependency versions.
          helm repo add grafana https://grafana.github.io/helm-charts > "$RUNNER_TEMP/pulse-monitoring.log" 2>&1
          helm dependency build "$chart" >> "$RUNNER_TEMP/pulse-monitoring.log" 2>&1
      - uses: 1password/install-cli-action@v4
      - name: Load deployment kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-$DEPLOY_ENV" \
            --vault "tuist-k8s-$DEPLOY_ENV" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability and refuse ownership conflicts
        run: |
          set -euo pipefail
          kubectl --request-timeout=10s get --raw /version >/dev/null
          # The staging replacement deliberately retains this Helm release's
          # ownership. Ownership alone must not permit a Pulse release to
          # overwrite a qualified Greptime gateway on the next publication.
          live=$(kubectl -n "$NAMESPACE" get deployment pulse --ignore-not-found -o json)
          if [[ -n "$live" ]] && jq -e '.metadata.labels["app.kubernetes.io/name"] == "greptimedb-ingest"' <<< "$live" >/dev/null; then
            echo '::error::This environment uses the independent Greptime replacement; refusing to restore a Pulse writer.'
            exit 1
          fi
          # Only query known namespaced resource kinds. Never read a Secret or
          # permit a chart to expand this deployment into cluster-level writes.
          jq -r '.[] | [.kind, .metadata.name, (.metadata.namespace // "observability")] | @tsv' \
            "$RUNNER_TEMP/pulse-deploy/resources.json" > "$RUNNER_TEMP/pulse-deploy/resources.tsv"
          while IFS=$'\t' read -r kind name namespace; do
            case "$kind" in Deployment|Service|ServiceAccount|ConfigMap|ExternalSecret|PodDisruptionBudget|NetworkPolicy|Ingress) ;; *) exit 1 ;; esac
            [[ "$namespace" == "$NAMESPACE" ]]
            existing=$(kubectl -n "$NAMESPACE" get "$kind" "$name" --ignore-not-found -o json)
            if [[ -n "$existing" ]]; then
              if ! jq -e --arg release "$HELM_RELEASE_NAME" --arg namespace "$NAMESPACE" '
                .metadata.annotations["meta.helm.sh/release-name"] == $release and
                .metadata.annotations["meta.helm.sh/release-namespace"] == $namespace and
                .metadata.labels["app.kubernetes.io/managed-by"] == "Helm"
              ' <<< "$existing" >/dev/null; then
                echo "::error::Pulse resource ownership conflict ($kind/$name); refusing adoption."
                exit 1
              fi
            fi
          done < "$RUNNER_TEMP/pulse-deploy/resources.tsv"
          # An older ESO object may target the new Secret under a different
          # resource name. Stop before touching the writer if two controllers
          # would claim it. Releasing old ownership is a coordinated monitoring
          # migration prerequisite, not permission to adopt or delete Secrets.
          kubectl -n "$NAMESPACE" get externalsecrets -o json \
            | jq -e 'all(.items[];
                (.spec.target.name // .metadata.name) != "pulse-credentials" or .metadata.name == "pulse-credentials")' >/dev/null
      - name: Retire the verified legacy writer before starting Pulse
        run: |
          set -euo pipefail
          # Intentional legacy spelling: identify only the known live 1.38.0
          # backend. Keep its objects and secrets; the wrapper retires them later.
          legacy_name=pulso
          legacy_image=ghcr.io/tuist/pulso:1.38.0
          legacy=$(kubectl -n "$NAMESPACE" get deployment "$legacy_name" --ignore-not-found -o json)
          if [[ -n "$legacy" ]]; then
            jq -e --arg image "$legacy_image" '
              ([.spec.template.spec.containers[].image] == [$image]) and
              ((.spec.template.spec.initContainers // []) | length == 0) and
              .metadata.annotations["meta.helm.sh/release-name"] == "k8s-monitoring" and
              (.spec.selector.matchLabels | length > 0) and
              ((.spec.selector.matchExpressions // []) | length == 0)
            ' <<< "$legacy" >/dev/null
            selector=$(jq -r '.spec.selector.matchLabels | to_entries | sort_by(.key) | map(.key + "=" + .value) | join(",")' <<< "$legacy")
            resource_version=$(jq -r .metadata.resourceVersion <<< "$legacy")
            kubectl -n "$NAMESPACE" scale deployment "$legacy_name" --replicas=0 --resource-version="$resource_version" >/dev/null
            # Count every matching pod, including terminating pods: zero Ready
            # replicas alone does not mean the old maintenance writer has exited.
            for ((attempt=0; attempt<60; attempt++)); do
              remaining=$(kubectl -n "$NAMESPACE" get pods -l "$selector" -o json | jq '.items | length')
              if [[ "$remaining" == 0 ]]; then break; fi
              sleep 5
            done
            [[ "$remaining" == 0 ]]
            kubectl -n "$NAMESPACE" get deployment "$legacy_name" -o json \
              | jq -e --arg image "$legacy_image" '.spec.replicas == 0 and ([.spec.template.spec.containers[].image] == [$image])' >/dev/null
          fi
          # Fail closed on orphaned old pods too, including digest-only images
          # and detached ReplicaSets that do not share the deployment selector.
          kubectl -n "$NAMESPACE" get pods -o json \
            | jq -e --arg repository "${legacy_image%:*}" '
                all(.items[]; all(.spec.containers[];
                  (.image | startswith($repository + ":") or startswith($repository + "@") or . == $repository) | not))' >/dev/null
      - name: Install published chart and exact image without automatic rollback
        run: |
          set -euo pipefail
          # Never automatically resurrect an older storage writer. A failed
          # rollout stays failed; recovery uses a verified compatible Pulse tag.
          if ! helm upgrade --install "$HELM_RELEASE_NAME" "$RUNNER_TEMP/pulse-deploy/pulse-$VERSION.tgz" \
            --values "$RUNNER_TEMP/pulse-deploy/values-managed-$DEPLOY_ENV.yaml" \
            --namespace "$NAMESPACE" --create-namespace \
            --set-string image.repository=ghcr.io/tuist/pulse --set-string "image.tag=$VERSION@$IMAGE_DIGEST" \
            --timeout 15m --wait > "$RUNNER_TEMP/pulse-helm.log" 2>&1; then
            echo '::error::Pulse Helm deployment failed; inspect the sanitized rollout status below.'
            exit 1
          fi
      - name: Verify ExternalSecret synchronization
        run: kubectl -n "$NAMESPACE" wait --for=condition=Ready externalsecret/pulse-credentials --timeout=5m
      - name: Verify combined workload rollout
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deployment/pulse --timeout=5m
          kubectl -n "$NAMESPACE" get deployment pulse -o json \
            | jq -e --arg image "ghcr.io/tuist/pulse:$VERSION@$IMAGE_DIGEST" \
              '.spec.replicas == 1 and .spec.strategy.type == "Recreate" and ([.spec.template.spec.containers[].image] == [$image])' >/dev/null
          kubectl -n "$NAMESPACE" get service pulse -o json \
            | jq -e '.spec.type == "ClusterIP" and ((.spec.externalIPs // []) | length == 0)' >/dev/null
      - name: Verify private in-cluster readiness
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" run "$SMOKE_POD" --restart=Never --image=curlimages/curl:8.12.1 \
            --overrides='{"spec":{"nodeSelector":{"node.cluster.x-k8s.io/pool":"general"}}}' \
            --command -- curl --fail --silent --show-error --max-time 30 --output /dev/null http://pulse.observability:4000/readyz
          kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=2m
      - name: Reconcile collectors only after standalone Pulse is ready
        run: |
          set -euo pipefail
          # Same observability concurrency lane as the server cascade. Keep
          # failures in place: automatic rollback could resurrect the old writer.
          chart="$RUNNER_TEMP/pulse-deploy/source/infra/helm/k8s-monitoring"
          if ! helm upgrade --install k8s-monitoring "$chart" \
            --namespace "$NAMESPACE" --create-namespace \
            --values "$chart/values-$DEPLOY_ENV.yaml" \
            --timeout 10m --wait >> "$RUNNER_TEMP/pulse-monitoring.log" 2>&1; then
            echo '::error::Pulse collector reconciliation failed; refusing promotion.'
            exit 1
          fi
      - name: Require fresh authenticated real collector telemetry
        run: |
          set -euo pipefail
          # Query actual collected up series, never inject a synthetic sample.
          # The pod receives credentials through Secret references; neither CI
          # nor the probe prints credentials, raw responses, or exception bodies.
          minimum_timestamp=$(date +%s)
          probe_script=$(cat <<'JS'
          const authorization = "Basic " + Buffer.from(process.env.PULSE_USERNAME + ":" + process.env.PULSE_PASSWORD).toString("base64");
          const query = 'max(timestamp(up{env="' + process.env.DEPLOY_ENV + '"}))';
          const url = "http://pulse.observability:4000/api/v1/query?" + new URLSearchParams({query});
          const minimum = Number(process.env.MIN_TIMESTAMP);
          const deadline = performance.now() + 300000;
          let qualified = false;
          while (performance.now() < deadline) {
            try {
              const response = await fetch(url, {headers: {Authorization: authorization}, signal: AbortSignal.timeout(10000)});
              if (!response.ok) throw new Error("query unavailable");
              const body = await response.json();
              const result = body.data?.result;
              if (body.status === "success" && body.data?.resultType === "vector" && result?.length === 1) {
                const sampleTimestamp = Number(result[0].value[1]);
                const now = Date.now() / 1000;
                if (Number.isFinite(sampleTimestamp) && sampleTimestamp > minimum && now - 120 <= sampleTimestamp && sampleTimestamp <= now + 60) {
                  qualified = true;
                  break;
                }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          process.exit(qualified ? 0 : 1);
          JS
          )
          jq -n --arg name "$TELEMETRY_POD" --arg namespace "$NAMESPACE" \
            --arg environment "$DEPLOY_ENV" --arg minimum "$minimum_timestamp" --arg script "$probe_script" '
            {apiVersion: "v1", kind: "Pod", metadata: {name: $name, namespace: $namespace}, spec: {
              restartPolicy: "Never", activeDeadlineSeconds: 420, automountServiceAccountToken: false,
              nodeSelector: {"node.cluster.x-k8s.io/pool": "general"},
              securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: "RuntimeDefault"}},
              containers: [{name: "probe", image: "node:22.14.0-alpine3.21", command: ["node", "--input-type=module", "-e", $script],
                securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}},
                resources: {requests: {cpu: "25m", memory: "32Mi"}, limits: {memory: "128Mi"}},
                env: [{name: "DEPLOY_ENV", value: $environment}, {name: "MIN_TIMESTAMP", value: $minimum},
                  {name: "PULSE_USERNAME", valueFrom: {secretKeyRef: {name: "pulse-credentials", key: "pulse-username"}}},
                  {name: "PULSE_PASSWORD", valueFrom: {secretKeyRef: {name: "pulse-credentials", key: "pulse-password"}}}]
              }]}}
          ' > "$RUNNER_TEMP/pulse-deploy/telemetry-pod.json"
          kubectl create -f "$RUNNER_TEMP/pulse-deploy/telemetry-pod.json" >/dev/null
          kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$TELEMETRY_POD" --timeout=7m
      - name: Sanitized failure diagnostics
        if: failure()
        run: |
          # No Secret reads, rendered manifests, describe output, application
          # logs, event messages or Helm descriptions in public CI logs.
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/instance=pulse \
            -o custom-columns=NAME:.metadata.name,PHASE:.status.phase --no-headers || true
          kubectl -n "$NAMESPACE" get deployment pulse \
            -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas || true
          kubectl -n "$NAMESPACE" get externalsecret pulse-credentials \
            -o custom-columns=NAME:.metadata.name,READY:'.status.conditions[?(@.type=="Ready")].status' || true
          kubectl -n "$NAMESPACE" get events --field-selector type=Warning \
            -o custom-columns=REASON:.reason,KIND:.involvedObject.kind --no-headers | tail -20 || true
      - name: Remove readiness probe and local credentials
        if: always()
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/pulse-deploy"; rm -f "$KUBECONFIG" "$RUNNER_TEMP/pulse-helm.log" "$RUNNER_TEMP/pulse-monitoring.log"' EXIT
          if [[ -f "$KUBECONFIG" ]]; then
            kubectl -n "$NAMESPACE" delete pod "$SMOKE_POD" "$TELEMETRY_POD" --ignore-not-found --wait=true --timeout=30s
          fi
