name: Docker Build Cache

on:
  pull_request:
    paths:
      - .github/actions/docker-build-cache/**
      - .github/workflows/docker-build-cache.yml
      - .github/workflows/server-deployment.yml
      - .github/workflows/server-production-deployment.yml
  push:
    branches: [main]
    paths:
      - .github/actions/docker-build-cache/**
      - .github/workflows/docker-build-cache.yml
      - .github/workflows/server-deployment.yml
      - .github/workflows/server-production-deployment.yml

permissions:
  contents: read

jobs:
  test:
    name: Test layer cache export and import
    runs-on: tuist-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Test cache scripts
        run: bash .github/actions/docker-build-cache/test.sh
      - name: Attach the test cache volume
        uses: ./.github/actions/docker-build-cache
        with:
          key: ci-docker-build-cache-smoke-v1
          registry-cache: localhost:5000/cache:smoke
      - name: Test with fresh BuildKit workers and a private registry
        run: bash .github/actions/docker-build-cache/integration_test.sh
