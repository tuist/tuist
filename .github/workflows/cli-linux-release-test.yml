# TEMPORARY: exercises release-cli-linux from cli-build-publish.yml on this
# draft PR without publishing anything. Removed before the PR leaves draft.
name: CLI Linux Release Build (test)

on:
  pull_request:
    paths:
      - .github/workflows/cli-linux-release-test.yml
      - .github/workflows/cli-build-publish.yml
      - mise/tasks/cli/bundle-linux.sh

permissions:
  contents: read

jobs:
  release-cli-linux:
    name: Release CLI (Linux ${{ matrix.arch }})
    runs-on: tuist-linux-large
    container:
      image: swift:6.2
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}

      - name: Stamp the release version
        run: |
          sed -i "s/^let releaseVersion = \".*\"$/let releaseVersion = \"0.0.0-linux-release-test\"/" cli/Sources/tuist/ReleaseVersion.swift
          grep -qxF "let releaseVersion = \"0.0.0-linux-release-test\"" cli/Sources/tuist/ReleaseVersion.swift

      # .build is only valid for the compiler that produced it, and the
      # swift:6.2 tag moves across patch releases.
      - name: Read the Swift version
        id: swift
        run: |
          version="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The checkout gives every source file a new mtime, so SwiftPM still
      # compiles every first-party module from the release commit. The volume
      # keeps the pinned third-party graph (BoringSSL, NIO, gRPC, swift-syntax)
      # and the registry downloads.
      - uses: tuist/cache-volume@v1
        with:
          key: cli-linux-release-build-${{ matrix.arch }}-swift-${{ steps.swift.outputs.version }}
          path: .build
      - uses: tuist/cache-volume@v1
        with:
          key: cli-linux-release-swiftpm
          path: ~/.cache/org.swift.swiftpm

      - name: Install caddy
        run: apt-get update -qq && apt-get install -y --no-install-recommends caddy
      # Swift 6.2's FoundationNetworking traps on a redirect served over HTTP/2
      # (see #12229), and the registry answers 303 to storage over h2. Terminating
      # the first hop as plaintext HTTP/1.1 removes the precondition; the redirect
      # target negotiates http/1.1 on its own, so only this hop needs forcing.
      - name: Front the registry with an HTTP/1.1 proxy
        shell: bash
        run: |
          nohup caddy reverse-proxy \
            --from :8080 --to https://tuist.dev --change-host-header \
            > /tmp/registry-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              exec 3>&-
              exit 0
            fi
            sleep 1
          done
          echo "::error::registry proxy did not start listening on :8080"
          cat /tmp/registry-proxy.log || true
          exit 1
      - name: Point SwiftPM at the proxy
        run: swift package-registry set --allow-insecure-http http://localhost:8080/api/registry/swift
      - name: Resolve dependencies
        run: |
          for attempt in 1 2 3; do
            if swift package resolve --replace-scm-with-registry; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Linux CLI dependency resolution failed after ${attempt} attempts."
              exit 1
            fi

            echo "::warning::Linux CLI dependency resolution attempt ${attempt} failed; clearing SwiftPM state before retrying."
            ACCOUNT_HOME="$(getent passwd "$(id -u)" | cut -d: -f6)"
            # .build and the SwiftPM cache are volume mount points, so they
            # are emptied in place rather than removed.
            for dir in \
              "${BUILD_PATH:-.build}" \
              "$HOME/.cache/org.swift.swiftpm" \
              "$HOME/.swiftpm" \
              "$ACCOUNT_HOME/.cache/org.swift.swiftpm" \
              "$ACCOUNT_HOME/.swiftpm"; do
              if [ -d "$dir" ]; then
                find "$dir" -mindepth 1 -delete
              fi
            done
            sleep $((attempt * 10))
          done
        env:
          # Swift 6.2.4's registry client otherwise downloads up to one package
          # per CPU concurrently, which can trigger FoundationNetworking's
          # redirect handling crash before the CLI starts compiling.
          SWIFTPM_MAX_CONCURRENT_OPERATIONS: 1
      - name: Bundle CLI
        run: ./mise/tasks/cli/bundle-linux.sh
        env:
          TUIST_LINUX_ARCH: ${{ matrix.arch }}

      - name: Upload CLI Linux artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}-artifacts
          path: |
            build/tuist-linux-${{ matrix.arch }}.tar.gz
            build/SHASUMS256.txt
            build/SHASUMS512.txt
          retention-days: 1

      # Measures the warm path in the same job: new mtimes on every tracked
      # file, as a fresh checkout on top of a warm .build volume would give.
      - name: Rebuild with fresh source mtimes
        run: |
          git config --global --add safe.directory "$PWD"
          git ls-files -z | xargs -0 touch
          start=$(date +%s)
          ./mise/tasks/cli/bundle-linux.sh
          echo "::notice::warm rebuild took $(( $(date +%s) - start ))s"
        env:
          TUIST_LINUX_ARCH: ${{ matrix.arch }}
