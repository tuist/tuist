name: TCC build-time seed probe (temporary)

on:
  push:
    branches:
      - claude/tcc-build-seed-probe
    paths:
      - .github/workflows/tcc-build-seed-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: release-shaped probe ${{ matrix.attempt }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [candidate-1]
    runs-on: tuist-staging-macos
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image facts
        shell: bash {0}
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          if [ -x /opt/tuist/tcc-approvals.sh ]; then echo "IMAGE=build-time-approvals"; /opt/tuist/tcc-approvals.sh check; else echo "IMAGE=boot-time-approvals"; fi
          grep -a -E "tcc-approvals|Finder automation|Simulator microphone" /var/log/tuist-runner/poll.log
          sw_vers; xcodebuild -version; uptime
          stat -f "user TCC.db inode=%i birth=%SB" -t "%FT%T" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          nohup /usr/bin/log stream --level debug --style compact --predicate 'subsystem == "com.apple.TCC"' > "$RUNNER_TEMP/diag/tcc.log" 2>&1 &
      - name: Install create-dmg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install create-dmg
      - name: Login keychain
        run: bash repro-sim-media/release-probe.sh login-keychain
      - name: Codesign through a temporary keychain
        run: bash repro-sim-media/release-probe.sh codesign
      - name: create-dmg (early)
        run: bash repro-sim-media/release-probe.sh dmg early
      - name: Generate and build media repro
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v mise >/dev/null; then curl -fsSL https://mise.run | sh; fi
          export PATH="$HOME/.local/bin:$PATH"
          cp -R repro-sim-media/MediaRepro "$RUNNER_TEMP/MediaRepro"
          cd "$RUNNER_TEMP/MediaRepro"
          mise x tuist@4.212.0 -- tuist generate --no-open
          xcodebuild build-for-testing -project MediaRepro.xcodeproj -scheme MediaRepro -destination 'generic/platform=iOS Simulator' -quiet
      - name: Microphone test
        shell: bash {0}
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key)[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          for service in microphone camera; do xcrun simctl privacy "$udid" grant "$service" dev.tuist.MediaRepro; done
          cd "$RUNNER_TEMP/MediaRepro"
          xcodebuild test-without-building -project MediaRepro.xcodeproj -scheme MediaRepro -destination "id=$udid" \
            -only-testing:MediaReproUITests/MediaUITests/test1_baseline \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            > "$RUNNER_TEMP/diag/baseline-test.log" 2>&1
          if grep -q "Test Case.*test1_baseline.*passed" "$RUNNER_TEMP/diag/baseline-test.log"; then v=PASS; else v=FAIL; fi
          echo "RESULT baseline-ui-test $v" | tee -a "$RUNNER_TEMP/diag/results.txt"
          xcodebuild test-without-building -project MediaRepro.xcodeproj -scheme MediaRepro -destination "id=$udid" \
            -only-testing:MediaReproUITests/MediaUITests/test6_mic \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            > "$RUNNER_TEMP/diag/mic-test.log" 2>&1
          if grep -q "Test Case.*test6_mic.*passed" "$RUNNER_TEMP/diag/mic-test.log"; then v=PASS; else v=FAIL; fi
          echo "RESULT mic-test $v" | tee -a "$RUNNER_TEMP/diag/results.txt"
      - name: create-dmg (late)
        run: bash repro-sim-media/release-probe.sh dmg late
      - name: Finder probe (late)
        shell: bash {0}
        run: |
          start=$(date +%s)
          perl -e 'alarm 30; exec @ARGV' osascript -e 'tell application "Finder" to get name of startup disk'
          rc=$?
          if [ $rc -eq 0 ]; then v=PASS; else v=FAIL; fi
          echo "RESULT finder-osascript-late $v rc=$rc $(( $(date +%s) - start ))s" | tee -a "$RUNNER_TEMP/diag/results.txt"
      - name: Summary
        if: always()
        shell: bash {0}
        run: |
          sleep 2
          cat "$RUNNER_TEMP/diag/results.txt"
          echo "AUTHREQ_PROMPTING: $(grep -a -c AUTHREQ_PROMPTING "$RUNNER_TEMP/diag/tcc.log")"
          echo "Prompting lines:"; grep -a "Prompting for access" "$RUNNER_TEMP/diag/tcc.log" | cut -c1-250 | head
          echo "AppleEvents to Finder decisions:"; grep -a "Handling access request: kTCCServiceAppleEvents" "$RUNNER_TEMP/diag/tcc.log" | grep -o "authValue: [0-9]*" | sort | uniq -c
          echo "AUTHREQ results:"; grep -a "AUTHREQ_RESULT" "$RUNNER_TEMP/diag/tcc.log" | grep -o "authValue=[0-9], authReason=[0-9]*" | sort | uniq -c
          ! grep -q -E "RESULT .* (FAIL|TIMEOUT)" "$RUNNER_TEMP/diag/results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-probe-${{ matrix.attempt }}
          path: ${{ runner.temp }}/diag/
