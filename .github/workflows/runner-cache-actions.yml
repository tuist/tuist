name: Runner Cache Actions

on:
  pull_request:
    paths:
      - .github/actions/xcode-cache/**
      - .github/actions/module-cache/**
      - .github/actions/gradle-cache/**
      - ci/runner-caches/**
      - infra/runner-image/tuist-runner-cache
      - infra/runner-image/runner-caches_test.sh
      - .github/workflows/runner-cache-actions.yml
  push:
    branches: [main]
    paths:
      - .github/actions/xcode-cache/**
      - .github/actions/module-cache/**
      - .github/actions/gradle-cache/**
      - ci/runner-caches/**
      - infra/runner-image/tuist-runner-cache
      - infra/runner-image/runner-caches_test.sh
      - .github/workflows/runner-cache-actions.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash .github/actions/xcode-cache/action_test.sh
      - run: bash .github/actions/module-cache/action_test.sh
      - run: bash .github/actions/gradle-cache/action_test.sh
      - run: bash infra/runner-image/runner-caches_test.sh
      - run: bash ci/runner-caches/integrations_test.sh
      - name: Actions share their scripts
        run: |
          cmp .github/actions/xcode-cache/activate.sh .github/actions/module-cache/activate.sh
          cmp .github/actions/xcode-cache/action_test.sh .github/actions/module-cache/action_test.sh
          cmp .github/actions/xcode-cache/scripts/package.sh .github/actions/module-cache/scripts/package.sh
      - name: Install test helper
        run: |
          mkdir "$RUNNER_TEMP/helper-bin"
          cat > "$RUNNER_TEMP/helper-bin/tuist-runner-cache" <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$1" == activate ]]
          printf 'TUIST_TEST_%s_CACHE=on\n' "${2^^}"
          HELPER
          chmod +x "$RUNNER_TEMP/helper-bin/tuist-runner-cache"
          cat > "$RUNNER_TEMP/helper-bin/tuist-cache-volume" <<'CLIENT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$1" == --key && "$2" == gradle ]]
          printf 'cache-hit=true\n' >> "$GITHUB_OUTPUT"
          CLIENT
          chmod +x "$RUNNER_TEMP/helper-bin/tuist-cache-volume"
          echo "$RUNNER_TEMP/helper-bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/xcode-cache
      - uses: ./.github/actions/module-cache
      - uses: ./.github/actions/gradle-cache
        id: gradle
      - name: Verify exported environment
        run: |
          test "$TUIST_TEST_XCODE_CACHE" = on
          test "$TUIST_TEST_MODULE_CACHE" = on
          test "${{ steps.gradle.outputs.cache-hit }}" = true
          test -f "$HOME/.gradle/init.d/tuist-gradle-cache.gradle"
