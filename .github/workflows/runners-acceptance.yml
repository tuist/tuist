name: Runners Acceptance

# End-to-end check of Tuist Runners and the cache path their jobs use, run the
# way a customer's job runs: a job targets a runner label, dispatch places it
# on a runner VM or Pod and hands it a cache endpoint, and the job builds with
# the Xcode compilation cache through that endpoint. Each failure names the
# layer that broke: Dispatch, Runner file limits, Server auth, Kura
# reachability, Kura auth, Kura data path, Xcode cache setup, Xcode build, Cache
# hits or Cache volumes.
#
# The production deploy cascade dispatches this against canary after the
# canary deploy and gates production on it (server-production-deployment.yml,
# job `runners-acceptance`, through scripts/runners-acceptance/gate.sh). The
# hourly schedule runs it against production, which covers breakage that never
# goes through a server deploy, such as infra and network changes.
# Linux covers native image/runtime/toolchain behavior and a real Docker job
# container in separate jobs. Both are required by the promotion gate and
# included in the dispatch watchdog, alongside the macOS probes.
#
# On canary it also round-trips cache volumes between two jobs on its one rack
# host and gates production on them: the macOS job attaches two custom volumes
# (one never changes after its first write) and the managed Xcode and module
# cache volumes, seeds them, and writes a 256 MB payload as its last step;
# `macos-volume` then requires each to be a saved copy holding exactly that.
# Failures are titled `Cache volumes`. A volume refused because GitHub had not
# yet reported the runner's job is a webhook delay, not a regression: it is
# reported as `Cache volumes inconclusive` and does not fail the run. So is a
# volume another probe run saved over this one's because their seed jobs
# overlapped, for example a branch dispatched while a deploy gate runs.

run-name: Runners acceptance (${{ inputs.environment || 'production' }}) ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose runners and caches to exercise
        type: choice
        options: [canary, production]
        default: production
      correlation_id:
        description: Set by gate.sh to find the run it dispatched
        required: false
        default: ""
      expected_linux_image:
        description: Candidate digest required by the cascade; a staged old image must not pass
        type: string
        default: ""
      cache_endpoint:
        description: Overrides the cache endpoint dispatch hands each job, e.g. to prove a broken endpoint fails fast
        required: false
        default: ""
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: runners-acceptance-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan
    if: github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.plan.outputs.server }}
      macos: ${{ steps.plan.outputs.macos }}
      linux: ${{ steps.plan.outputs.linux }}
      volume_label: ${{ steps.plan.outputs.volume_label }}
      probe_jobs: ${{ steps.plan.outputs.probe_jobs }}
    steps:
      - id: plan
        env:
          ENVIRONMENT: ${{ inputs.environment || 'production' }}
        # Canary's macOS jobs run on ber1-runner-b02, which production lends
        # it (`tuist` is on `runner_site` there), and take canary's public
        # cache, since the rack's cache node belongs to production.
        # Production probes the rack: it rents no macOS hosts.
        run: |
          set -euo pipefail
          #
          # The cache volume round trip runs on canary only. Canary has one
          # rack host, so the verify job lands where the seed job published;
          # on production's multi-host fleets it would wait on convergence.
          case "${ENVIRONMENT}" in
            canary)
              server=https://canary.tuist.dev
              macos='[{"name":"BER1 rack","label":"tuist-canary-macos","cache_host":""}]'
              linux='[{"name":"default","label":"tuist-canary-linux"}]'
              volume_label=tuist-canary-macos
              ;;
            production)
              server=https://tuist.dev
              macos='[{"name":"BER1 rack","label":"tuist-ber1-smoke","cache_host":"tuist-ber1-runners.kura.tuist.dev"}]'
              linux='[{"name":"default","label":"tuist-linux"}]'
              volume_label=""
              ;;
            *) echo "::error::unknown environment ${ENVIRONMENT}"; exit 1 ;;
          esac
          # Each Linux target runs native and real job-container probes.
          # Canary adds one macOS volume probe and five Docker cache phases.
          probe_jobs=$(( $(jq length <<< "${macos}") + 2 * $(jq length <<< "${linux}") + (${#volume_label} > 0 ? 6 : 0) ))
          {
            echo "server=${server}"
            echo "macos=${macos}"
            echo "linux=${linux}"
            echo "volume_label=${volume_label}"
            echo "probe_jobs=${probe_jobs}"
          } >> "$GITHUB_OUTPUT"

  dispatch-watchdog:
    name: Dispatch watchdog
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/runners-acceptance
      - name: Wait for every probe to be picked up
        env:
          GH_TOKEN: ${{ github.token }}
          # The rack's acceptance pool starts cold, and a host that has to
          # pull the golden image takes minutes before the VM boots.
          MACOS_PICKUP_MINUTES: 15
          LINUX_PICKUP_MINUTES: 10
          # The volume verify job only exists once the seed job finishes, so
          # the watchdog keeps watching until every expected probe has started.
          DOCKER_CACHE_PROBES: ${{ inputs.environment == 'canary' && 'true' || 'false' }}
          EXPECTED_PROBE_JOBS: ${{ needs.plan.outputs.probe_jobs }}
        run: .github/scripts/runners-acceptance/dispatch-watchdog.sh

  macos:
    name: macOS ${{ matrix.target.name }} (${{ matrix.target.label }})
    needs: plan
    runs-on: ${{ matrix.target.label }}
    # Healthy runs take a few minutes. The incident this guards against stalled
    # every cache lookup wave for ~2 minutes before missing, so the bounds are
    # tight enough that a stall fails here instead of degrading a build.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.macos) }}
    outputs:
      volume_pending: ${{ steps.volumes.outputs.pending }}
    permissions:
      contents: read
      id-token: write
    env:
      TUIST_URL: ${{ needs.plan.outputs.server }}
      ACCOUNT_HANDLE: tuist
      EXPECTED_CACHE_HOST: ${{ inputs.cache_endpoint == '' && matrix.target.cache_host || '' }}
    steps:
      - name: Runner
        run: |
          echo "runner     : ${RUNNER_NAME}"
          echo "macOS      : $(sw_vers -productVersion)"
          echo "Xcode      : $(xcodebuild -version | head -n 1)"
          echo "cache      : ${TUIST_CACHE_ENDPOINT:-<none handed by dispatch>}"
      - name: Override the cache endpoint
        if: inputs.cache_endpoint != ''
        env:
          OVERRIDE: ${{ inputs.cache_endpoint }}
        run: echo "TUIST_CACHE_ENDPOINT=${OVERRIDE}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            mise
      - name: Kura round trip
        timeout-minutes: 3
        run: .github/scripts/runners-acceptance/kura-roundtrip.sh
      - uses: ./.github/actions/mise-install
        with:
          install: tuist
          cache: "false"
      - name: Authenticate with Tuist
        timeout-minutes: 3
        run: tuist auth login
      - name: Xcode cache hits
        timeout-minutes: 10
        run: .github/scripts/runners-acceptance/xcode-cache.sh
      # After the build, so GitHub has reported which job this runner runs: the
      # host gives up authorizing a volume after 25 seconds, and that report can
      # trail the job's start by longer. A volume refused for that reason is
      # inconclusive, never a failure.
      - name: Attach the cache volumes
        if: matrix.target.label == needs.plan.outputs.volume_label
        id: volumes
        timeout-minutes: 3
        run: .github/scripts/runners-acceptance/volume.sh attach
      - name: Seed the cache volumes
        if: matrix.target.label == needs.plan.outputs.volume_label
        timeout-minutes: 1
        run: .github/scripts/runners-acceptance/volume.sh seed
      # Keep this the job's last step: the host saves the volumes right after
      # it, so the large write is what the guest's detach has to flush.
      - name: Write the large payload
        if: matrix.target.label == needs.plan.outputs.volume_label
        timeout-minutes: 2
        run: .github/scripts/runners-acceptance/volume.sh payload

  # The host publishes a finished job's volumes once its VM has stopped, which
  # has taken up to about 90 seconds after the job ends. The wait runs on a
  # GitHub-hosted runner so it does not hold canary's only Mac.
  volume-wait:
    name: Wait for the cache volumes to be published
    needs: [plan, macos]
    if: needs.plan.outputs.volume_label != '' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sleep 120

  # Runs on the same label as the seed job and requires the copies that job
  # saved.
  macos-volume:
    name: macOS cache volumes (${{ needs.plan.outputs.volume_label }})
    needs: [plan, macos, volume-wait]
    if: needs.volume-wait.result == 'success'
    runs-on: ${{ needs.plan.outputs.volume_label }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/runners-acceptance
            .github/actions/cache-volume
            .github/actions/xcode-cache
            .github/actions/module-cache
      - name: Attach the cache volumes
        timeout-minutes: 3
        run: .github/scripts/runners-acceptance/volume.sh attach
      - name: Verify the cache volumes
        timeout-minutes: 2
        env:
          SEED_PENDING: ${{ needs.macos.outputs.volume_pending }}
          # Tells a save lost to an overlapping probe run apart from a stale copy.
          GH_TOKEN: ${{ github.token }}
          VOLUME_LABEL: ${{ needs.plan.outputs.volume_label }}
        run: .github/scripts/runners-acceptance/volume.sh verify

  linux:
    name: Linux native ${{ matrix.target.name }} (${{ matrix.target.label }})
    needs: plan
    runs-on: ${{ matrix.target.label }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.linux) }}
    permissions:
      contents: read
      id-token: write
    env:
      TUIST_URL: ${{ needs.plan.outputs.server }}
      ACCOUNT_HANDLE: tuist
    steps:
      - name: Runner
        run: |
          echo "runner     : ${RUNNER_NAME}"
          echo "kernel     : $(uname -sr)"
          echo "cache      : ${TUIST_CACHE_ENDPOINT:-<none handed by dispatch>}"
      - name: Override the cache endpoint
        if: inputs.cache_endpoint != ''
        env:
          OVERRIDE: ${{ inputs.cache_endpoint }}
        run: echo "TUIST_CACHE_ENDPOINT=${OVERRIDE}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/runners-acceptance
            infra/runners-controller
            infra/runner-cache
      - name: Linux image and runtime
        timeout-minutes: 2
        run: bash .github/scripts/runners-acceptance/linux-runtime.sh
      - name: File limits
        run: .github/scripts/runners-acceptance/file-limits.sh
      - name: Kura round trip
        timeout-minutes: 3
        run: .github/scripts/runners-acceptance/kura-roundtrip.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/runners-controller/go.mod
          cache: false
      - name: Compile and run Go tests
        timeout-minutes: 5
        working-directory: infra/runners-controller
        env:
          GOWORK: "off"
        run: go test -count=1 ./internal/podtemplate
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - name: Execute the installed runtime
        run: elixir -e 'IO.puts("Linux setup action runtime works")'

  # A real job container covers the sidecar's workspace/actions/externals bind
  # mounts and GitHub environment-file handling; docker run in a native job
  # does not exercise that runner integration.
  linux-container:
    name: Linux container ${{ matrix.target.name }} (${{ matrix.target.label }})
    needs: plan
    runs-on: ${{ matrix.target.label }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.linux) }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:22.04@sha256:e0f80c829509ef4df9e76bd8944eb7b8ec25cbb379b112a7f9448b2c77a77c9b
    steps:
      - name: Step and Node runtime mounts
        run: |
          set -euo pipefail
          test -d /__w
          test -x /__e/node20/bin/node || test -x /__e/node24/bin/node
          test -x /__e/tuist-cache-volume
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/runners-acceptance
      - name: Workspace and action mounts
        run: |
          set -euo pipefail
          test -f /__w/_actions/actions/checkout/v4/dist/index.js
          test -f "$GITHUB_WORKSPACE/.github/scripts/runners-acceptance/linux-runtime.sh"
          test -n "${TUIST_CACHE_ENDPOINT:-}"
      - name: Write environment file
        run: echo "TUIST_ACCEPTANCE_ENV=round-trip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Read environment file
        run: test "${TUIST_ACCEPTANCE_ENV:-}" = "round-trip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  docker-cold:
    name: Linux Docker cache cold
    needs: [plan, linux, linux-container]
    if: inputs.environment == 'canary'
    uses: ./.github/workflows/runners-docker-cache-probe.yml
    with:
      phase: cold
      expected_linux_image: ${{ inputs.expected_linux_image }}
    permissions:
      contents: read

  docker-warm-layers:
    name: Linux Docker cache warm-layers
    needs: [plan, docker-cold]
    if: inputs.environment == 'canary'
    uses: ./.github/workflows/runners-docker-cache-probe.yml
    with:
      phase: warm-layers
      expected_linux_image: ${{ inputs.expected_linux_image }}
    permissions:
      contents: read

  docker-changed-source:
    name: Linux Docker cache changed-source
    needs: [plan, docker-warm-layers]
    if: inputs.environment == 'canary'
    uses: ./.github/workflows/runners-docker-cache-probe.yml
    with:
      phase: changed-source
      expected_linux_image: ${{ inputs.expected_linux_image }}
    permissions:
      contents: read

  docker-same-size-write:
    name: Linux Docker cache same-size-write
    needs: [plan, docker-changed-source]
    if: inputs.environment == 'canary'
    uses: ./.github/workflows/runners-docker-cache-probe.yml
    with:
      phase: same-size-write
      expected_linux_image: ${{ inputs.expected_linux_image }}
    permissions:
      contents: read

  docker-verify-final:
    name: Linux Docker cache verify-final
    needs: [plan, docker-same-size-write]
    if: inputs.environment == 'canary'
    uses: ./.github/workflows/runners-docker-cache-probe.yml
    with:
      phase: verify-final
      expected_linux_image: ${{ inputs.expected_linux_image }}
    permissions:
      contents: read
