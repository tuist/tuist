name: Production Deploy Acceptance Plan

# Runs the acceptance plan that gates production promotion, against the
# already-deployed canary, without deploying anything.
#
# server-production-deployment.yml only runs on push to main, so the plan's own
# shape - which targets it covers, and how concurrently they execute - was
# previously first exercised by a live promotion. This runs it on a pull request
# whenever the plan's inputs change, and on demand for a rehearsal.
#
# Deliberately narrow triggers: the plan is a full macOS acceptance run, so it
# would be a poor tax on every CLI change. The tests themselves already run in
# cli.yml as part of TuistAcceptanceTests; what this adds is the plan's own
# composition and concurrency on one runner.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Project.swift
      - Tuist/ProjectDescriptionHelpers/Module.swift
      - cli/Tests/TuistServerAcceptanceTests/**
      - cli/Tests/TuistCacheEEAcceptanceTests/**
      - .github/workflows/server-production-deployment.yml
      - .github/workflows/server-production-deploy-acceptance.yml
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  TUIST_EE: 1
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1

concurrency:
  group: production-deploy-acceptance-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Run the plan against canary
    runs-on: tuist-macos
    timeout-minutes: 60
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - name: Initialize TuistCacheEE submodule
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      # One EE canary case loads the cas-plugin dylib inside xcodebuild's
      # compilers and routes it to the proxy, the same way the deploy job does.
      - uses: ./.github/actions/mise
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
          install_args: rust
          working_directory: cas-plugin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cas-plugin-rust-${{ runner.os }}
          workspaces: |
            cas-plugin -> target
      - name: Build the cas-plugin
        working-directory: cas-plugin
        run: |
          mise run build
          echo "TUIST_CAS_PLUGIN_PATH=$(pwd)/target/release/libtuist_cas_plugin.dylib" >> "$GITHUB_ENV"
          echo "TUIST_CAS_PROXY_PATH=$(pwd)/target/release/tuist-cas-proxy" >> "$GITHUB_ENV"
      # Identical to the Test step in server-production-deployment.yml. Keep the
      # two in sync: the point of this job is that they are the same run.
      - name: Test
        run: |
          tuist test TuistServerProductionDeployAcceptanceTests --no-selective-testing -- \
            -maximum-parallel-testing-workers 2 \
            -retry-tests-on-failure -test-iterations 2
