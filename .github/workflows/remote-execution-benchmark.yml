name: Remote Execution Benchmark

# Times a Kura Bazel build locally or on Tuist/BuildBuddy remote execution.
# Disk/action cache reads are disabled; this does NOT make executor input
# caches cold. Record their state separately, verified outside this workflow.
# Analysis and repository fetches happen in an untimed warm-up first.
# Run one remote benchmark at a time per server: concurrent runs share the
# account's execution capacity.
#
# The defaults are the pinned Tuist vs BuildBuddy comparison: Kura at
# 63881ee3d8 (main), `bazel test //...` (1,089 remote actions), --jobs=64,
# production (the fleet customers use), and for BuildBuddy the guest stage of
# the production bazel template (remote-execution-benchmark-image.yml). For a
# cold Tuist first build, pass a never-used tuist_project linked to this
# repository; tuist/kura already holds these inputs.

on:
  # Throwaway benchmark branches run the defaults below on push.
  push:
    branches:
      - bench/remote-execution
  workflow_dispatch:
    inputs:
      server:
        description: Tuist server whose cache and executor to use
        default: https://tuist.dev
        required: true
      mode:
        description: Where actions execute
        type: choice
        options:
          - remote
          - local
        default: remote
      command:
        description: Bazel command run over //...
        type: choice
        options:
          - test
          - build
        default: test
      runner:
        description: Runner label of a 2 vCPU profile on that server
        default: tuist-linux
        required: true
      bazel_flags:
        description: Extra Bazel flags for the warm-up and the timed run; keep --jobs equal across providers
        required: false
        default: --color=no --jobs=64
      provider:
        description: Remote execution provider (BuildBuddy requires BUILDBUDDY_API_KEY)
        type: choice
        options: [tuist, buildbuddy]
        default: tuist
      source_ref:
        description: Immutable workload revision, independent of the workflow revision
        default: 63881ee3d8012e4e1fb950714af7588ea25fed6c
      buildbuddy_image:
        description: Public guest-stage OCI image, docker://registry/image@sha256:digest (not the template carrier)
        default: ""
      node_cache_state:
        description: Observed worker input-cache state; this label does not reset caches
        type: choice
        options: [unknown, cold, warm]
        default: unknown
      sample:
        description: Trial identifier for grouping repeated measurements
        default: "1"
      workload:
        description: Bazel workspace to build (external ones are pinned below)
        type: choice
        options: [kura, abseil-cpp, protobuf]
        default: kura
      tuist_project:
        description: Tuist project whose CAS scope the run uses; a never-used project makes the first run cold
        default: tuist/kura
      paired:
        description: Run a second timed build in the same CAS scope right after the first (cold then warm pair)
        type: boolean
        default: true

permissions:
  contents: read

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_URL: ${{ inputs.server || 'https://tuist.dev' }}
  MODE: ${{ inputs.mode || 'remote' }}
  PROVIDER: ${{ inputs.provider || 'tuist' }}
  COMMAND: ${{ inputs.command || 'test' }}
  BAZEL_FLAGS: ${{ inputs.bazel_flags || '--color=no --jobs=64' }}
  TUIST_PROJECT: ${{ inputs.tuist_project || 'tuist/kura' }}
  WORKLOAD: ${{ inputs.workload || 'kura' }}
  TARGETS: ${{ (inputs.workload == 'abseil-cpp' && '//absl/...') || (inputs.workload == 'protobuf' && '//src/...') || '//...' }}

jobs:
  benchmark:
    name: Execution benchmark
    if: github.repository == 'tuist/tuist'
    # A runner of the server under test: remote execution reads inputs from
    # the account's runner cache, which only its runners upload into.
    runs-on: ${{ inputs.runner || 'tuist-linux' }}
    timeout-minutes: 120
    defaults:
      run:
        # External workloads are cloned into bench-workload at a pinned commit.
        working-directory: ${{ (inputs.workload || 'kura') == 'kura' && 'kura' || 'bench-workload' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || '63881ee3d8012e4e1fb950714af7588ea25fed6c' }}
          persist-credentials: false

      # Same client for every workload: Kura's pinned Bazel and Tuist (mise),
      # the runner's autodetected C++ toolchain, and the workload's own
      # .bazelrc plus the provider's endpoint configuration.
      - name: Check out the external workload
        if: inputs.workload && inputs.workload != 'kura'
        working-directory: .
        run: |
          set -euo pipefail
          case "$WORKLOAD" in
            abseil-cpp) repo=abseil/abseil-cpp sha=5a15bf2b34b3d929bfb516d59339b3f6ee2aa677 ;;
            protobuf) repo=protocolbuffers/protobuf sha=c0d0827c8d52ab52afdf4ee477b58e78b4c903ef ;;
            *) echo "::error::unknown workload $WORKLOAD"; exit 1 ;;
          esac
          git init -q bench-workload
          git -C bench-workload fetch -q --depth 1 "https://github.com/$repo" "$sha"
          git -C bench-workload checkout -q FETCH_HEAD
          cp kura/mise.toml kura/mise.lock bench-workload/
          rm -f bench-workload/.bazelversion
          printf 'project = "%s"\n' "$TUIST_PROJECT" > bench-workload/tuist.toml
          printf '\ntry-import %%workspace%%/.bazelrc.tuist\n' >> bench-workload/.bazelrc

      - name: Use the requested Tuist project
        if: (!inputs.workload || inputs.workload == 'kura') && inputs.tuist_project && inputs.tuist_project != 'tuist/kura'
        run: printf 'project = "%s"\n' "$TUIST_PROJECT" > tuist.toml

      - name: Validate comparison inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          BUILDBUDDY_IMAGE: ${{ inputs.buildbuddy_image }}
          NODE_CACHE_STATE: ${{ inputs.node_cache_state || 'unknown' }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_REF" ] && ! [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::source_ref must be a full commit SHA"; exit 1
          fi
          if [ "$PROVIDER" = buildbuddy ]; then
            [ "$MODE" = remote ] || { echo "::error::BuildBuddy comparison requires remote mode"; exit 1; }
            [[ "$BUILDBUDDY_IMAGE" =~ ^docker://[a-zA-Z0-9./_-]+@sha256:[a-f0-9]{64}$ ]] || {
              echo "::error::Pin a public guest-stage OCI image by digest"; exit 1;
            }
            [ "$NODE_CACHE_STATE" = unknown ] || {
              echo "::error::Hosted BuildBuddy worker caches are not controlled by this workflow"; exit 1;
            }
            [[ " $BAZEL_FLAGS " =~ [[:space:]]--jobs=[1-9][0-9]*[[:space:]] ]] || {
              echo "::error::Set --jobs explicitly and use the same value for the Tuist comparison"; exit 1;
            }
          fi

      # Only downloaded repositories persist between benchmarks; action
      # outputs never do.
      - uses: tuist/cache-volume@v1
        with:
          key: ci-${{ inputs.workload || 'kura' }}-remote-execution-benchmark-repository-v1
          path: ~/.cache/tuist/bazel/repository

      - uses: ./.github/actions/mise
        with:
          install_args: "rust bazel tuist"
          working_directory: ${{ (inputs.workload || 'kura') == 'kura' && 'kura' || 'bench-workload' }}

      - name: Install C/C++ toolchain for -sys crates (rocksdb/aws-lc bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config

      - name: Set up Tuist
        if: env.PROVIDER == 'tuist'
        run: |
          set -euo pipefail
          if [ "$MODE" = remote ]; then
            ../.github/scripts/tuist-bazel-setup.sh
            grep -q '^build --remote_executor=' .bazelrc.tuist || { echo "::error::$TUIST_URL configured no remote executor"; exit 1; }
          else
            tuist auth login
            tuist bazel setup
          fi

      - name: Set up BuildBuddy
        if: env.PROVIDER == 'buildbuddy'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BUILDBUDDY_IMAGE: ${{ inputs.buildbuddy_image }}
        run: |
          set -euo pipefail
          [ -n "$BUILDBUDDY_API_KEY" ] || { echo "::error::BUILDBUDDY_API_KEY is not configured"; exit 1; }
          umask 077
          # Keep the key out of rc files, argv, profiles and uploaded logs.
          cat > "$RUNNER_TEMP/buildbuddy-credential-helper" <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${BUILDBUDDY_API_KEY:?BuildBuddy credential missing}"
          jq -n '{headers: {"x-buildbuddy-api-key": [env.BUILDBUDDY_API_KEY]}}'
          HELPER
          chmod 700 "$RUNNER_TEMP/buildbuddy-credential-helper"
          # Replace, never append to, any Tuist-generated endpoint configuration.
          cat > .bazelrc.tuist <<EOF
          build --credential_helper=remote.buildbuddy.io=$RUNNER_TEMP/buildbuddy-credential-helper
          build --remote_executor=grpcs://remote.buildbuddy.io
          build --remote_cache=grpcs://remote.buildbuddy.io
          build --remote_cache_compression=true
          build --remote_timeout=15m
          build --noremote_local_fallback
          # A never-used instance name is a fresh CAS scope, so this job's
          # first build starts cold and its second (paired) build warm.
          build --remote_instance_name=tuist-bench-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          build --remote_default_exec_properties=OSFamily=Linux
          build --remote_default_exec_properties=Arch=amd64
          build --remote_default_exec_properties=container-image=$BUILDBUDDY_IMAGE
          build --remote_default_exec_properties=EstimatedCPU=2
          build --remote_default_exec_properties=EstimatedMemory=4294967296
          build --remote_default_exec_properties=network=off
          build --remote_default_exec_properties=dockerUser=1000:1000
          build --remote_default_exec_properties=nonroot-workspace=true
          build --generate_json_trace_profile=yes
          build --noslim_profile
          build --experimental_profile_include_target_label
          build --experimental_profile_include_primary_output
          EOF
          # Kura registers the guest's C++ toolchain under this config; other
          # workloads use the autodetected one, the same on runner and guest.
          if grep -q '^build:tuist-remote-execution ' .bazelrc; then
            echo "build --config=tuist-remote-execution" >> .bazelrc.tuist
          fi

      - name: Record comparison environment
        env:
          BUILDBUDDY_IMAGE: ${{ inputs.buildbuddy_image }}
          NODE_CACHE_STATE: ${{ inputs.node_cache_state || 'unknown' }}
          SAMPLE: ${{ inputs.sample || '1' }}
        run: |
          set -euo pipefail
          jq -n --arg source "$(git rev-parse HEAD)" --arg workflow "$GITHUB_SHA" \
            --arg provider "$PROVIDER" --arg mode "$MODE" --arg command "$COMMAND" \
            --arg bazel "$(bazel --version)" --arg flags "$BAZEL_FLAGS" \
            --arg image "$BUILDBUDDY_IMAGE" --arg cacheState "$NODE_CACHE_STATE" \
            --arg sample "$SAMPLE" --arg runner "$RUNNER_NAME" --arg server "$TUIST_URL" --arg project "$TUIST_PROJECT" \
            --arg tuistJobs "$(sed -n 's/^build --jobs=//p' .bazelrc.tuist | tail -1)" \
            --arg tuistImage "$(sed -n 's/^build --remote_default_exec_properties=tuist-image=//p' .bazelrc.tuist | tail -1)" \
            '{source:$source, workflow:$workflow, provider:$provider, mode:$mode, command:$command,
              bazel:$bazel, flags:$flags, buildbuddyImage:$image, nodeCacheState:$cacheState,
              sample:$sample, coordinator:$runner, server:$server, tuistProject:$project, configuredTuistJobs:$tuistJobs, tuistImage:$tuistImage,
              actionCacheReads:false, diskCache:false,
              buildbuddyResources:"2 CPU / 4294967296 bytes requested; not a fleet capacity guarantee"}' \
            > "$RUNNER_TEMP/environment.json"

      - name: Warm up analysis and repositories
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          # shellcheck disable=SC2086 # BAZEL_FLAGS is a list of flags
          ../.github/scripts/retry-bazel-command.sh bazel build $TARGETS --nobuild \
            $BAZEL_FLAGS --disk_cache= --noremote_accept_cached

      - name: Timed execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          NODE_CACHE_STATE: ${{ inputs.node_cache_state || 'unknown' }}
          SAMPLE: ${{ inputs.sample || '1' }}
          PAIRED: ${{ inputs.paired == false && 'false' || 'true' }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          # The first build runs in the job's CAS scope as it is (cold for a
          # fresh BuildBuddy instance or a never-used Tuist project); the
          # paired one repeats it right away, so its inputs are warm. Action
          # cache reads stay off for both, so every action executes.
          phases=first
          [ "$PAIRED" = true ] && phases="first repeat"
          echo '[]' > "$RUNNER_TEMP/result.json"
          {
            echo "| Workload | Provider | Phase | Node cache | Sample | Wall (s) | Bazel elapsed (s) | Critical path (s) | Processes |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          for phase in $phases; do
            if [ "$phase" = repeat ]; then
              # Drop the first build's outputs, action cache and test results
              # so every action runs again, then redo analysis untimed as the
              # warm-up step did for the first build.
              bazel clean
              # shellcheck disable=SC2086 # BAZEL_FLAGS is a list of flags
              bazel build $TARGETS --nobuild $BAZEL_FLAGS --disk_cache= --noremote_accept_cached
            fi
            start=$(date +%s)
            # shellcheck disable=SC2086 # BAZEL_FLAGS is a list of flags
            bazel "$COMMAND" $TARGETS $BAZEL_FLAGS --disk_cache= --noremote_accept_cached \
              --noremote_local_fallback --profile="$RUNNER_TEMP/profile-$phase.json.gz" 2>&1 | tee "$RUNNER_TEMP/bazel-$phase.log"
            wall=$(( $(date +%s) - start ))
            elapsed=$(sed -n 's/.*INFO: Elapsed time: \([0-9.]*\)s, Critical Path: \([0-9.]*\)s.*/\1 \2/p' "$RUNNER_TEMP/bazel-$phase.log" | tail -n 1)
            processes=$(grep -E 'INFO: [0-9]+ processes?:' "$RUNNER_TEMP/bazel-$phase.log" | tail -n 1 | sed 's/.*INFO: //')
            if [ "$MODE" = remote ]; then
              [[ "$processes" =~ (^|[[:space:],])[1-9][0-9]*[[:space:]]remote[,.] ]] || {
                echo "::error::No executed remote actions in the $phase benchmark summary"; exit 1;
              }
              if [[ "$processes" == *"cache hit"* ]]; then
                echo "::error::Cached actions invalidate the execution comparison"; exit 1
              fi
            fi
            echo "| $WORKLOAD | $PROVIDER | $phase | $NODE_CACHE_STATE | $SAMPLE | $wall | ${elapsed% *} | ${elapsed#* } | $processes |" >>"$GITHUB_STEP_SUMMARY"
            jq --arg workload "$WORKLOAD" --arg phase "$phase" --argjson wall "$wall" --argjson elapsed "${elapsed% *}" \
              --argjson critical "${elapsed#* }" --arg processes "$processes" \
              '. + [{workload:$workload, phase:$phase, wallSeconds:$wall, elapsedSeconds:$elapsed, criticalSeconds:$critical, processes:$processes}]' \
              "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/result.next" && mv "$RUNNER_TEMP/result.next" "$RUNNER_TEMP/result.json"
            echo "::notice title=$WORKLOAD $PROVIDER $COMMAND ($phase, sample $SAMPLE)::wall ${wall}s, elapsed ${elapsed% *}s, critical path ${elapsed#* }s, $processes"
          done

      - name: Summarize the profile
        if: always()
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/profile-first.json.gz" ] || exit 0
          # Bazel 9 no longer exposes analyze-profile. These are aggregate
          # span durations, not additive wall-time or critical-path phases.
          gzip -dc "$RUNNER_TEMP/profile-first.json.gz" | jq '
            [.traceEvents[] | select(.dur != null)] | group_by(.cat) |
            map({category: .[0].cat, spanCount: length,
                 aggregateDurationSeconds: (map(.dur) | add / 1000000)})
          ' > "$RUNNER_TEMP/profile-summary.json"

      - name: Remove generated authentication configuration
        if: always()
        run: rm -f .bazelrc.tuist "$RUNNER_TEMP/buildbuddy-credential-helper"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-execution-benchmark-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/profile-*.json.gz
            ${{ runner.temp }}/bazel-*.log
            ${{ runner.temp }}/profile-summary.json
            ${{ runner.temp }}/environment.json
            ${{ runner.temp }}/result.json
          if-no-files-found: ignore
