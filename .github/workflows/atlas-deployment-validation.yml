name: Atlas Deployment Validation

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: "0.0.0"
      source-sha:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATLAS_TEST_VERSION: ${{ inputs.version }}
      ATLAS_SCREENSHOT_DIR: ${{ github.workspace }}/atlas-deployment-screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm yq jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Test manual release recovery guard
        run: bash .github/scripts/atlas-patch-release.test.sh
      - name: Validate deployment configuration and agent execution boundary
        run: |
          bash infra/helm/atlas/test-agent-boundary.sh
          bash infra/helm/atlas/test-chatgpt-config.sh
          bash infra/helm/atlas/test-connections-config.sh
          bash atlas/deploy/test-sandbox-retention.sh
      - name: Test documentation capture bounds and diagnostics
        # Headless runners lack a desktop session bus; avoid D-Bus discovery delays.
        run: dbus-run-session -- node --test atlas/deploy/capture-docs.test.mjs
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
      - name: Build standalone release image
        run: docker build --file atlas/Dockerfile --build-arg ATLAS_VERSION="$ATLAS_TEST_VERSION" --tag "ghcr.io/tuist/atlas:$ATLAS_TEST_VERSION" .
      - name: Validate Compose and Helm deployments
        run: dbus-run-session -- atlas/deploy/validate.sh
      - name: Upload documentation verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-deployment-screenshots
          path: atlas-deployment-screenshots/
          if-no-files-found: ignore
