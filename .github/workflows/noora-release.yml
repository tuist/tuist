name: Noora Release

# Noora is published independently from the server deployment. The same
# version is released to both package registries before the GitHub release
# advances the noora@ tag.

on:
  push:
    branches:
      - main
    paths:
      - noora/**
      - mise/tasks/release/components.json
      - .github/workflows/noora-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep version calculation and publication serialized. Never cancel a
  # publication after one registry may already have accepted the package.
  group: noora-release
  cancel-in-progress: false

env:
  MISE_VERSION: "2026.5.15"
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}

jobs:
  check:
    name: Check for releasable changes
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.check.outputs.noora-should-release }}
      next-version: ${{ steps.check.outputs.noora-next-version }}
      next-version-number: ${{ steps.check.outputs.noora-next-version-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: check
        run: mise run --skip-tools release:check noora

  release:
    name: Publish Noora
    needs: check
    if: needs.check.outputs.should-release == 'true'
    runs-on: tuist-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise-install
        with:
          version: ${{ env.MISE_VERSION }}
          install: "erlang elixir node aube git-cliff"
          cache: "false"
          working-directory: noora
          github-token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Get release notes
        id: release-notes
        working-directory: noora
        run: |
          LATEST_VERSION=$(git tag -l | grep -E "^noora@[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST_VERSION" ]; then
            git cliff --include-path "noora/**/*" --config cliff.toml --repository "../" 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          else
            git cliff --include-path "noora/**/*" --config cliff.toml --repository "../" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: noora
        run: |
          sed -i 's/version: ".*"/version: "${{ needs.check.outputs.next-version-number }}"/' mix.exs
          npm pkg set version="${{ needs.check.outputs.next-version-number }}"

      - name: Generate changelog
        working-directory: noora
        run: git cliff --include-path "noora/**/*" --config cliff.toml --repository "../" --tag "${{ needs.check.outputs.next-version }}" -o CHANGELOG.md 2>/dev/null

      - name: Install dependencies
        working-directory: noora
        run: |
          mix deps.get
          aube install

      - name: Validate generated files and tests
        working-directory: noora
        run: |
          aube run check:generated
          aube run test -- --run
          mix test

      - name: Validate release artifacts
        working-directory: noora
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mix hex.build

      # npm is attempted first so missing npm credentials cannot leave a new
      # Hex release on its own. npm versions are immutable, while Hex can
      # safely retry the same version with --replace if the second publish
      # or GitHub release creation is interrupted.
      - name: Publish packages
        working-directory: noora
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          npm whoami >/dev/null

          package="$RUNNER_TEMP/tuist-noora-${{ needs.check.outputs.next-version-number }}.tgz"
          local_integrity=$(node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); console.log(`sha512-${crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`);' "$package")

          if published_integrity=$(npm view "@tuist/noora@${{ needs.check.outputs.next-version-number }}" dist.integrity 2>/dev/null); then
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "The published npm package has different contents for this version" >&2
              exit 1
            fi
            echo "@tuist/noora@${{ needs.check.outputs.next-version-number }} is already published with matching contents"
          else
            npm publish "$package" --access public
          fi

          mix hex.publish --yes --replace
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/noora-npmrc
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Noora GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          repository: tuist/tuist
          target_commitish: ${{ github.sha }}
          name: Noora ${{ needs.check.outputs.next-version-number }}
          tag_name: ${{ needs.check.outputs.next-version }}
          body: |
            hex.pm: https://hex.pm/packages/noora/${{ needs.check.outputs.next-version-number }}
            npm: https://www.npmjs.com/package/@tuist/noora/v/${{ needs.check.outputs.next-version-number }}

            ${{ steps.release-notes.outputs.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
