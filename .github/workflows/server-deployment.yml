name: Kura child fixture staging prerequisites
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply or remove only the disposable child-volume StorageClass and TokenReview identity
        type: choice
        options: [apply, remove, smoke]
        default: apply
permissions:
  contents: read
concurrency:
  group: server-deploy-staging-deploy
  cancel-in-progress: false
jobs:
  fixture:
    if: inputs.operation != 'smoke'
    runs-on: tuist-linux
    environment: server-k8s-staging
    timeout-minutes: 10
    env:
      KUBECONFIG: /tmp/kura-child-fixture-kubeconfig
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v4
        with:
          version: 2.31.1
      - name: Load staging deployment identity
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          op document get 'kubeconfig: tuist-staging' --vault tuist-k8s-staging --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Apply or remove exact fixture prerequisites
        run: |
          set -euo pipefail
          kubectl --request-timeout=10s get --raw /version >/dev/null
          case "$OPERATION" in
            apply) kubectl apply -f infra/kura-volumes-csi/thin/borrowed/staging-prerequisites.yaml ;;
            remove)
              count="$(kubectl get pvc -A -o json | jq '[.items[] | select(.spec.storageClassName == "kura-borrowed-qualification")] | length')"
              test "$count" = 0
              kubectl delete -f infra/kura-volumes-csi/thin/borrowed/staging-prerequisites.yaml --ignore-not-found
              ;;
            *) exit 1 ;;
          esac
      - name: Remove temporary deployment credential
        if: always()
        run: rm -f "$KUBECONFIG"

  server-smoke:
    if: inputs.operation == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: borrowed-server-image
          run-id: 40734563091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/server-image
      - name: Boot the exact downloadable release on native amd64
        run: |
          docker load -i /tmp/server-image/kura-borrowed-server.tar
          docker run --rm --entrypoint /app/bin/tuist \
            -e DATABASE_URL=ecto://fixture:fixture@127.0.0.1/fixture \
            -e TUIST_DEPLOY_ENV=stag -e TUIST_HOSTED=1 -e TUIST_S3_ENDPOINT=http://127.0.0.1:9000 \
            kura-borrowed-server:fixture-339fea900c053209b07cb4a21243ee7a253839e6 \
            eval 'IO.puts("FIXTURE_RELEASE_BOOT_OK")'
