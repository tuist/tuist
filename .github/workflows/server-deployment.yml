name: Server Deployment

# Build + deploy the Tuist server to a single Kubernetes environment.
#
# This workflow is the "building block": build → push image → helm
# upgrade. It runs against exactly one environment per invocation, with no
# cascade and no acceptance tests. Use it for:
#   - Ad-hoc staging / canary / production deploys via workflow_dispatch
#     (e.g. re-running a specific SHA on one env).
#   - As a workflow_call target from server-production-deployment.yml,
#     which chains canary → acceptance tests → production on push-to-main.
#
# Image architecture: a single env-agnostic image is built per commit
# (MIX_ENV=prod always). The runtime picks canary/staging/production
# behavior via the TUIST_DEPLOY_ENV env var set by the Helm overlay, and the
# MASTER_KEY ESO secret decrypts the matching priv/secrets/<env>.yml.enc
# file baked into the image. This means the same `sha-<SHA>` image is
# promoted across environments - one build, N deploys.
#
# Environment → cluster wiring is by convention: namespace = `tuist-<env>`
# (except production = `tuist`), values overlay = `values-managed-<env>.yaml`,
# public host = `<env>.tuist.dev` (except production = `tuist.dev`). Adding a
# new environment is just adding the matching values files.
#
# Required secrets:
#   OP_SERVICE_ACCOUNT_TOKEN (per GitHub Environment server-k8s-<env>) -
#     1Password service-account token scoped read-only to the
#     tuist-k8s-<env> vault, where the cluster's kubeconfig is stored
#     as a Document item named `kubeconfig: tuist-<env>`. Each
#     environment's secret value is the SA token for that environment's
#     vault — staging deploys can't read canary/production kubeconfigs.
# App secrets live inside the cluster (MASTER_KEY via ESO, DATABASE_URL /
# ClickHouse / Tigris keys in priv/secrets/<env>.yml.enc baked into the
# image).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - canary
          - production
      commit_sha:
        description: Chart commit to deploy (defaults to the event's SHA). Keep this current and set image_tag to roll back only the server image.
        required: false
      image_tag:
        description: Pre-built image tag to deploy instead of building
        required: false
      staging_platform_revision:
        description: Restore an existing staging platform Helm revision instead of applying this commit's platform chart
        required: false
      kura_controller_image_tag:
        description: Pre-built Kura controller image tag; omit to preserve the live controller during a server-only re-promotion
        required: false
      codebase_search_image_tag:
        description: Pre-built codebase search image tag to deploy
        required: false
      registry_image_tag:
        description: Pre-built Swift registry image tag to deploy instead of building
        required: false
      kura_runtime_image_tag:
        description: Pre-built Kura runtime image tag to deploy
        required: false
      kura_expedite:
        description: Expedite the Kura rollout of this deploy's runtime tag (all-at-once fan-out; for rollbacks to a tag that previously completed)
        required: false
        default: false
        type: boolean
      linux_runner_image_tag:
        description: Pre-built Linux runner image tag to pin (e.g. `sha-7ed4b250bfb5`); wins over the resolved `linux-runner-image@*` semver
        required: false
      macos_runner_image_tag:
        description: Pre-built macOS 26.5 runner image tag to pin (e.g. `macos-26-5-9d343ebe`); wins over the resolved `runner-image@*` semver for that pool
        required: false
      capi_image_tag:
        description: Pre-built CAPI provider image tag to pin (e.g. `05057033`); wins over the resolved `capi-scaleway@*` semver. Use when a chart change adds operator flags before the provider image is released.
        required: false
      runners_controller_image_tag:
        description: Pre-built runners-controller image tag to pin (e.g. `sha-040775324f48`); wins over the resolved `runners-controller@*` semver. Same pre-release-flag use as capi_image_tag.
        required: false
      egress_tree_agent_image_tag:
        description: Pre-built egress-tree-agent image tag to pin (e.g. `sha-537c990cae68`, built by egress-tree-agent-image.yml); wins over the resolved `egress-tree-agent@*` semver. Use to validate an in-flight BPF/HTB change on staging before tagging a release.
        required: false
      xcresult_processor_image_tag:
        description: Pre-built xcresult processor Tart image tag to pin (e.g. `d0d53abc`, built by xcresult-processor-image.yml); wins over the resolved `xcresult-processor-image@*` semver. Use to validate an in-flight processor change on staging before tagging a release.
        required: false
      xcresult_processor_release_digest:
        description: Layer digest (`sha256:...`) of the `tuist-xcresult-processor-release` artifact the processor boots; wins over the release published for the server image tag
        required: false
      install_platform:
        description: Install the platform chart before the server chart
        type: boolean
        default: true
      install_observability:
        description: Install the k8s-monitoring chart before the server chart
        type: boolean
        default: true
      install_tailscale_operator:
        description: Install the tailscale-operator chart before the server chart
        type: boolean
        default: true
  workflow_call:
    inputs:
      staging_platform_revision:
        description: Existing staging platform Helm revision to restore and retain for this deployment
        required: false
        type: string
      environment:
        description: Target environment (staging | canary | production)
        required: true
        type: string
      commit_sha:
        description: Chart commit to deploy (defaults to github.sha)
        required: false
        type: string
      image_tag:
        description: >-
          Pre-built image tag to deploy. When set, the build job is
          skipped and the deploy job uses this tag directly. When unset,
          the workflow builds + pushes an image tagged sha-<commit_sha>.
        required: false
        type: string
      kura_controller_image_tag:
        description: >-
          Pre-built Kura controller image tag. When a pre-built server image
          is supplied without this input, the deploy preserves the currently
          running controller during a server-only re-promotion.
        required: false
        type: string
      codebase_search_image_tag:
        description: >-
          Pre-built codebase search image tag to deploy. When unset during
          a pinned server image deployment, the workflow preserves the
          currently deployed codebase search image.
        required: false
        type: string
      registry_image_tag:
        description: >-
          Pre-built Swift registry image tag to deploy. A normal build uses
          its built registry tag. A pre-built server deployment preserves the
          live registry image when this is unset.
        required: false
        type: string
      kura_runtime_image_tag:
        description: >-
          Pre-built Kura runtime image tag to deploy. When unset, the
          deploy job resolves the latest kura@ canary tag reachable from
          the deployed commit and strips the tag prefix before passing it
          to Helm.
        required: false
        type: string
      kura_expedite:
        description: >-
          Expedite the Kura rollout of this deploy's runtime tag
          (all-at-once fan-out at rollout creation). Always an explicit
          input — never inferred from commit messages or the hotfix
          fast-path. Intended for rollbacks to a tag that previously
          completed a rollout in the environment.
        required: false
        default: false
        type: boolean
      linux_runner_image_tag:
        description: >-
          Pre-built Linux runner image tag to pin (e.g.
          `sha-7ed4b250bfb5`). When unset, the deploy job resolves the
          latest `linux-runner-image@*` semver tag. Useful for
          validating an in-flight runner-image change on staging before
          tagging a release.
        required: false
        type: string
      macos_runner_image_tag:
        description: >-
          Pre-built macOS 26.5 runner image tag to pin (e.g.
          `macos-26-5-9d343ebe`). When unset, the deploy job resolves the
          latest `runner-image@*` semver tag. Useful for validating an
          in-flight runner-image change on staging before tagging a release.
        required: false
        type: string
      capi_image_tag:
        description: >-
          Pre-built CAPI provider image tag to pin (e.g. `05057033`).
          When unset, the deploy job resolves the latest `capi-scaleway@*`
          semver tag. Use when deploying chart changes that add operator
          flags before the provider image is released, so the old binary
          doesn't CrashLoop on an unknown flag and trip the --atomic
          rollback.
        required: false
        type: string
      runners_controller_image_tag:
        description: >-
          Pre-built runners-controller image tag to pin (e.g.
          `sha-040775324f48`). When unset, the deploy job resolves the
          latest `runners-controller@*` semver tag. Same pre-release-flag
          use as capi_image_tag.
        required: false
        type: string
      egress_tree_agent_image_tag:
        description: >-
          Pre-built egress-tree-agent image tag to pin (e.g.
          `sha-537c990cae68`, built by egress-tree-agent-image.yml). When
          unset, the deploy job resolves the latest `egress-tree-agent@*`
          semver tag. Use to validate an in-flight BPF/HTB change on
          staging before tagging a release.
        required: false
        type: string
      xcresult_processor_image_tag:
        description: >-
          Pre-built xcresult processor Tart image tag to pin (e.g.
          `d0d53abc`, built by xcresult-processor-image.yml). When unset,
          the deploy job resolves the latest `xcresult-processor-image@*`
          semver tag. Use to validate an in-flight processor change on
          staging before tagging a release.
        required: false
        type: string
      xcresult_processor_release_digest:
        description: >-
          Layer digest (`sha256:...`) of the `tuist-xcresult-processor-release`
          artifact the xcresult processor boots. The production cascade passes
          the release it built for this commit. When unset, a deploy that
          builds its own image builds and pins the release too, and a deploy
          of a pre-built image pins the release published for its tag, or
          keeps the one the processor runs when that tag has none.
        required: false
        type: string
      install_platform:
        description: >-
          Install the platform chart before the server chart. The production
          cascade turns it off when the chart's inputs are unchanged since
          production's last deploy.
        required: false
        type: boolean
        default: true
      install_observability:
        description: Install the k8s-monitoring chart before the server chart; see install_platform.
        required: false
        type: boolean
        default: true
      install_tailscale_operator:
        description: Install the tailscale-operator chart before the server chart; see install_platform.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/tuist
  REGISTRY_IMAGE_NAME: tuist/registry
  CODEBASE_SEARCH_IMAGE_NAME: tuist/codebase-search
  KURA_CONTROLLER_IMAGE_NAME: tuist/kura-controller
  KURA_VOLUMES_CSI_IMAGE_NAME: tuist/kura-volumes-csi
  EGRESS_TREE_AGENT_IMAGE_NAME: tuist/egress-tree-agent
  KURA_RUNTIME_IMAGE_NAME: tuist/kura
  HELM_CHART_PATH: infra/helm/tuist
  HELM_RELEASE_NAME: tuist
  OBSERVABILITY_CHART_PATH: infra/helm/k8s-monitoring
  OBSERVABILITY_RELEASE_NAME: k8s-monitoring
  OBSERVABILITY_NAMESPACE: observability
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_DEPLOY_GITHUB_TOKEN || github.token }}
  MISE_GITHUB_ATTESTATIONS: 0
  # Skip mise's SLSA provenance verification for github-backend tools
  # only. Installing the repo toolset resolves github-backend tools such
  # as `github:endevco/aube`, and mise's SLSA check builds a malformed release
  # URL for github-backend tools (releases/tags/<owner>/<repo>@<ver>
  # instead of /<ver>) and 404s on cache-cold runners. GitHub artifact
  # attestations still verify. Aqua-backend SLSA stays ON: mise.lock
  # records slsa provenance for aqua tools (e.g. getsops/sops), and
  # disabling it trips mise's downgrade-attack guard.
  MISE_GITHUB_SLSA: false

jobs:
  guard_production_source:
    name: Guard production source
    runs-on: tuist-linux
    timeout-minutes: 5
    steps:
      - name: Require main for production
        run: |
          set -euo pipefail

          if [ "${{ inputs.environment }}" != "production" ]; then
            echo "Non-production deploy; continuing."
            exit 0
          fi

          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from refs/heads/main. Current ref: ${{ github.ref }}"
            exit 1
          fi

          echo "Production deploy is running from refs/heads/main."

  build:
    name: Build + push server
    needs: guard_production_source
    if: needs.guard_production_source.result == 'success' && inputs.image_tag == ''
    # Bigger shape: the server image build (Elixir release compile inside
    # the dind sidecar) OOMs the 2 vCPU / 8 GB default microVM, killing the
    # runner mid-build ("lost communication"). Mirrors server.yml's
    # docker_build job.
    runs-on: tuist-linux-large
    # 60m absorbs a fully cold build (no buildcache hits).
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      codebase_search_image_tag: ${{ steps.tag.outputs.image_tag }}
      registry_image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: false
      - id: tag
        run: echo "image_tag=sha-${DEPLOY_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - id: buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Historical deploy SHAs without the bridge keep the registry-only path.
      - name: Restore production project builds
        id: project-volume
        if: hashFiles('.github/scripts/server-docker-mix-cache.sh') != ''
        continue-on-error: true
        uses: tuist/cache-volume@v1
        with:
          key: server-image-prod-hosted-amd64-projects-v1
          path: ~/.cache/tuist-server-docker-mix
      - name: Prepare the production Mix build context
        id: project-cache
        if: steps.project-volume.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/server-docker-mix-cache.sh prepare
      # Persist the OG-image render output across builds. The /og-cache
      # `--mount=type=cache` is local to the BuildKit builder, so it is empty
      # on every ephemeral runner and Chromium re-renders every OG image
      # (~6 min, on the critical path that gates `mix release`). cache-dance
      # round-trips the mount through actions/cache so unchanged images are
      # skipped via their .cachekey sidecars. The registry cache below only
      # exports layers, never cache-mount contents.
      - name: Restore OG image render cache
        id: og-cache
        uses: actions/cache@v4
        with:
          path: |
            og-cache-marketing
            og-cache-docs
          key: server-og-cache-${{ env.DEPLOY_SHA }}
          restore-keys: |
            server-og-cache-
      - name: Seed OG cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "og-cache-marketing": { "target": "/og-cache/marketing", "id": "og-marketing" },
              "og-cache-docs": { "target": "/og-cache/docs", "id": "og-docs" }
            }
          skip-extraction: ${{ steps.og-cache.outputs.cache-hit }}
      - uses: docker/build-push-action@v6
        name: Build and push server image
        with:
          context: .
          file: ./server/Dockerfile
          target: runner
          build-contexts: ${{ steps.project-cache.outcome == 'success' && steps.project-cache.outputs.context || '' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          # Shared `buildcache:server` ref, kept warm by the push-to-main
          # build in server-production-deployment.yml. `mode=max` exports
          # cache for every stage (deps.compile, builder, og-images).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:server
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:server,mode=max
          # TUIST_VERSION is baked into the image as the value Sentry reports as
          # `release`. The Dockerfile default is `0.0.0`, so without this line
          # every hosted-server event lands in Atlas without a release tag.
          # Reuse the image tag so the Atlas release matches the image the pod
          # runs (`sha-<12chars>`).
          build-args: |
            TUIST_HOSTED=1
            TUIST_VERSION=${{ steps.tag.outputs.image_tag }}
            MIX_ENV=prod
            APT_CACHE_BUST=${{ env.DEPLOY_SHA }}
      - name: Export production project builds
        id: project-export
        if: steps.project-cache.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./server/Dockerfile
          target: mix-cache-export
          provenance: false
          build-contexts: ${{ steps.project-cache.outputs.context }}
          outputs: ${{ steps.project-cache.outputs.export }}
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            TUIST_HOSTED=1
            MIX_ENV=prod
      - name: Retain the production project snapshot
        if: always() && steps.project-cache.outcome == 'success'
        continue-on-error: true
        env:
          TUIST_MIX_CACHE_EXPORTED: ${{ steps.project-export.outcome == 'success' }}
        run: bash .github/scripts/server-docker-mix-cache.sh commit

  # The deploy's other images, each in its own job beside `build` so none of
  # them waits on the server image. Their tags match the server image's.
