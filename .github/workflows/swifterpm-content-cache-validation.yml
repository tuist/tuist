name: SwifterPM content cache validation

on:
  push:
    branches: [codex/swifterpm-content-manifest-cache]

permissions:
  contents: read
  id-token: write

env:
  GITHUB_TOKEN: ${{ github.token }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  TUIST_EE: "1"
  TUIST_ENABLE_CACHING: "false"
  TUIST_DEV_INSTANCE: "1"
  MISE_GITHUB_ATTESTATIONS: "0"
  MISE_LOCKED: "1"

jobs:
  profile:
    name: Profile ${{ matrix.variant }}
    runs-on: tuist-macos-27-0-volumes
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      VALIDATION_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: tuist
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate and set up Tuist
        run: |
          tuist auth login
          tuist setup
      - uses: actions/download-artifact@v4
        if: false
        with:
          name: state-${{ matrix.variant }}
          path: .validation-transfer
          github-token: ${{ github.token }}
          run-id: 38533876876
      - name: Profile real installation
        id: profile
        run: bash .github/scripts/swifterpm-content-cache-validation.sh
      - uses: actions/upload-artifact@v4
        if: steps.profile.outputs.seed == 'true'
        with:
          name: state-${{ matrix.variant }}
          path: .validation-transfer/state.tgz
          include-hidden-files: true
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.variant }}-${{ github.run_attempt }}
          path: .validation-evidence/
          include-hidden-files: true
          retention-days: 14
