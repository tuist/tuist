name: Cache Token Contract

# The server mints cache tokens and Kura verifies them locally, so the claim
# shape, issuer and signing algorithm are a contract between an Elixir codebase
# and a Rust one. Neither suite can catch a drift on its own: the server's tests
# assert what it mints, Kura's assert what it accepts, and both stay green while
# the two drift apart. This runs the halves against each other.

on:
  push:
    branches:
      - main
    paths:
      - server/lib/tuist/cache.ex
      - server/lib/tuist/guardian.ex
      - server/test/tuist/cache_e2e_token_test.exs
      - kura/src/extension/**
      - kura/scripts/cache-token-e2e.sh
      - .github/workflows/cache-token-contract.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - server/lib/tuist/cache.ex
      - server/lib/tuist/guardian.ex
      - server/test/tuist/cache_e2e_token_test.exs
      - kura/src/extension/**
      - kura/scripts/cache-token-e2e.sh
      - .github/workflows/cache-token-contract.yml
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: cache-token-contract-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  MISE_VERSION: "2026.5.15"
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}

jobs:
  contract:
    name: Cache Token Contract
    runs-on: tuist-linux-large
    timeout-minutes: 60
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-server-mix
        with:
          mise-version: ${{ env.MISE_VERSION }}
          mise-install-args: erlang elixir github:ClickHouse/ClickHouse
      - uses: ./.github/actions/mise-install
        with:
          version: ${{ env.MISE_VERSION }}
          install: rust
          working-directory: kura
      - name: Install C/C++ toolchain for -sys crates (rocksdb/aws-lc bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Cache kura build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kura/target
          key: cache-token-contract-cargo-v1-${{ hashFiles('kura/Cargo.lock') }}
          restore-keys: |
            cache-token-contract-cargo-v1-
      - name: Start ClickHouse
        working-directory: server
        run: mise run --no-deps clickhouse:start
      - name: Setup database
        working-directory: server
        run: mise run --no-deps db:reset
      - name: Verify a server-minted token authorizes on a cache node
        run: ./kura/scripts/cache-token-e2e.sh
