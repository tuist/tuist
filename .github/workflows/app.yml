name: App

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
  TUIST_ENABLE_CACHING: ${{ github.event.pull_request.head.repo.fork != true }}
  MISE_GITHUB_ATTESTATIONS: 0
  # Skip mise's SLSA provenance verification for github-backend tools only.
  # The verification resolves the release through
  # api.github.com/repos/<owner>/<repo>/releases/tags/<tag>, which mise.lock
  # cannot replace: the lockfile only supplies the download URL, and mise
  # already prefers that CDN URL over url_api. So this API call is the last
  # one standing on the install path, and it 403s once the token's hourly
  # budget is spent across concurrent runs - failing the install of
  # `github:endevco/aube` and `github:pomerium/cli`. The jobs here install the
  # full merged root toolset (the Xcode build phases and scheme post-actions
  # need it, so the install cannot be scoped), so they always pull both.
  # Aqua-backend SLSA stays ON: mise.lock records slsa provenance for aqua
  # tools (e.g. getsops/sops) and this setting does not touch them. Same
  # setting as server.yml, server-deployment.yml and
  # server-production-deployment.yml.
  MISE_GITHUB_SLSA: 0

concurrency:
  group: app-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-team-membership:
    name: Check Team Membership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      is-team-member: ${{ steps.check.outputs.is-member }}
    steps:
      - name: Check if author is team member
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          HAS_TOKEN: ${{ secrets.TUIST_APP_GITHUB_TOKEN != '' }}
        with:
          github-token: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
          script: |
            // If TUIST_APP_GITHUB_TOKEN is not available (e.g., from a fork), treat as non-member
            if (process.env.HAS_TOKEN !== 'true') {
              console.log(`Running from fork - treating ${context.payload.pull_request.user.login} as non-member`);
              core.setOutput('is-member', 'false');
              return;
            }

            try {
              const { data: membership } = await github.rest.teams.getMembershipForUserInOrg({
                org: 'tuist',
                team_slug: 'engineering',
                username: context.payload.pull_request.user.login
              });
              console.log(`User ${context.payload.pull_request.user.login} is a member of @tuist/engineering`);
              core.setOutput('is-member', 'true');
            } catch (error) {
              if (error.status === 404) {
                console.log(`User ${context.payload.pull_request.user.login} is NOT a member of @tuist/engineering`);
              } else {
                // Don't let a transient GitHub API error (e.g. 403 rate-limit) fail the
                // whole workflow. Fail safe: treat the author as a non-member so the
                // privileged device-build/share steps skip rather than the PR going red.
                console.log(`Could not resolve team membership (${error.status} ${error.message}); treating as non-member`);
              }
              core.setOutput('is-member', 'false');
            }
  app-build:
    name: Build
    runs-on: tuist-macos
    timeout-minutes: 30
    needs: [check-team-membership]
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      github.repository == 'tuist/tuist' &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: ./.github/actions/mise
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: app-macos-workspace-${{ github.job }}
      - name: Update CFBundleVersion
        run: |
          sed -i '' -e "s/CFBundleVersion.*/CFBundleVersion\": \"${{ github.run_number }}\",/g" "app/Project.swift"
      - name: Generate TuistApp
        run: mise x -- tuist generate TuistApp
      - name: Build TuistApp
        run: mise x -- tuist xcodebuild build -scheme TuistApp -destination "generic/platform=iOS Simulator" -workspace Tuist.xcworkspace
      - name: Share TuistApp
        if: |
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && needs.check-team-membership.outputs.is-team-member == 'true')
        run: mise x -- tuist share TuistApp

  app-device-build:
    name: Device Build
    runs-on: tuist-macos
    timeout-minutes: 30
    # Only main's runs enter the main-only apple-signing environment and get its
    # token; pull requests and branch dispatches build without signing secrets.
    environment: ${{ github.ref == 'refs/heads/main' && 'apple-signing' || '' }}
    permissions:
      contents: read
      id-token: write
    if: |
      github.repository == 'tuist/tuist' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: ./.github/actions/mise
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: app-macos-workspace-${{ github.job }}
      - name: Update CFBundleVersion
        run: |
          sed -i '' -e "s/CFBundleVersion.*/CFBundleVersion\": \"${{ github.run_number }}\",/g" "app/Project.swift"
      - name: Generate TuistApp
        run: mise x -- tuist generate TuistApp --configuration Release
      # Signing reads the distribution certificate from the tuist-apple-signing
      # vault through the apple-signing environment's token. Only main's code may
      # run next to it: pull requests, including team members' branches, and
      # dispatches from branches build without signing.
      - name: Bundle iOS app
        if: github.ref == 'refs/heads/main'
        env:
          EXPORT_METHOD: release-testing
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.RELEASE_OP_SERVICE_ACCOUNT_TOKEN }}
        run: mise run app:bundle-ios
      - name: Inspect TuistApp
        if: github.ref == 'refs/heads/main'
        run: mise x -- tuist inspect bundle build/Tuist.ipa
      - name: Share TuistApp
        if: github.ref == 'refs/heads/main'
        run: mise x -- tuist share build/Tuist.ipa
