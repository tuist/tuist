name: Preview Cluster Retirement

# Permanently removes the `tuist-preview` workload cluster that hosted the
# retired pull request and Slack-requested previews. The source manifest
# (infra/k8s/clusters/cluster-preview.yaml) must be removed and merged before
# this workflow runs, so a later management-cluster reconciliation cannot
# recreate the cluster. Delete this workflow once it has run.
#
# DNS: ExternalDNS on the preview cluster owns `*.preview.tuist.dev` (through
# the ingress Service annotation) and every per-preview Ingress host. Releasing
# a load balancer while a record still points at it lets whoever Hetzner gives
# that IP next receive the hostname's traffic, and obtain a certificate for it
# through the HTTP-01 path Cloudflare passes through. So the run first lets
# ExternalDNS withdraw every record, confirms the names no longer resolve, and
# only then releases the load balancers. Check Cloudflare afterwards for any
# hand-made `preview.tuist.dev` record ExternalDNS did not own.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type retire-tuist-preview to permanently delete the preview cluster.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-cluster-retirement
  cancel-in-progress: false

env:
  CLUSTER_NAME: tuist-preview
  CLUSTER_NAMESPACE: org-tuist
  PREVIEW_DOMAIN: preview.tuist.dev

jobs:
  validate:
    name: Validate retirement request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source and intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Preview cluster retirement must run from $DEFAULT_BRANCH. Current ref: $GITHUB_REF"
            exit 1
          fi

          if [ "$CONFIRMATION" != "retire-tuist-preview" ]; then
            echo "::error::Type retire-tuist-preview exactly to confirm permanent cluster deletion."
            exit 1
          fi

          if [ -e infra/k8s/clusters/cluster-preview.yaml ]; then
            echo "::error::Remove infra/k8s/clusters/cluster-preview.yaml in a reviewed change and merge it before retiring the cluster."
            exit 1
          fi

  retire:
    name: Retire preview cluster
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: mgmt-cluster-apply
    timeout-minutes: 90
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      WORKLOAD_KUBECONFIG: ${{ github.workspace }}/.kube/tuist-preview
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v2
      - name: Load management Kubernetes configuration
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-mgmt" --vault tuist-k8s-mgmt --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - id: cluster
        name: Check cluster state
        run: |
          set -euo pipefail

          if ! kubectl -n "$CLUSTER_NAMESPACE" get clusters.cluster.x-k8s.io "$CLUSTER_NAME" >/dev/null 2>&1; then
            echo "Preview cluster $CLUSTER_NAME is already absent."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Load workload Kubernetes configuration
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail

          kubectl -n "$CLUSTER_NAMESPACE" get secret "${CLUSTER_NAME}-kubeconfig" \
            -o jsonpath='{.data.value}' | base64 --decode > "$WORKLOAD_KUBECONFIG"
          chmod 600 "$WORKLOAD_KUBECONFIG"
          KUBECONFIG="$WORKLOAD_KUBECONFIG" kubectl --request-timeout=10s get --raw /version >/dev/null
      - id: hosts
        name: Record preview hostnames
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail

          # Every Ingress host under the preview domain, plus a name only the
          # wildcard answers. These are the names that must stop resolving.
          hosts="$(
            KUBECONFIG="$WORKLOAD_KUBECONFIG" kubectl get ingress -A \
              -o jsonpath='{range .items[*]}{range .spec.rules[*]}{.host}{"\n"}{end}{end}' \
              | grep -E "(^|\.)${PREVIEW_DOMAIN//./\\.}$" | sort -u || true
          )"
          hosts="$(printf '%s\nretirement-check-%s.%s\n' "$hosts" "$GITHUB_RUN_ID" "$PREVIEW_DOMAIN" | sed '/^$/d')"
          echo "$hosts"
          {
            echo "names<<EOF"
            echo "$hosts"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Remove previews and their data
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail
          export KUBECONFIG="$WORKLOAD_KUBECONFIG"

          # KuraInstances first, while the Kura controller can still run their
          # finalizers and garbage-collect what it created in `kura`.
          if kubectl get crd kurainstances.kura.tuist.dev >/dev/null 2>&1; then
            kubectl -n kura delete kurainstances.kura.tuist.dev --all \
              --wait=true --timeout=10m
          fi

          for namespace in $(kubectl get namespaces -l tuist.dev/preview=true -o name); do
            echo "Deleting $namespace"
            kubectl delete "$namespace" --wait=true --timeout=10m
          done
      - name: Withdraw DNS records
        # ExternalDNS still runs and owns these records (policy: sync), so
        # removing their sources makes it delete them. The per-preview Ingresses
        # went with their namespaces; the wildcard comes from the ingress
        # controller Service's hostname annotation.
        if: steps.cluster.outputs.exists == 'true'
        env:
          NAMES: ${{ steps.hosts.outputs.names }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$WORKLOAD_KUBECONFIG"

          services="$(kubectl get services -A \
            -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}')"
          for service in $services; do
            kubectl -n "${service%%/*}" annotate service "${service#*/}" \
              external-dns.alpha.kubernetes.io/hostname-
          done

          deadline=$((SECONDS + 900))
          while :; do
            resolving=""
            for name in $NAMES; do
              if [ -n "$(dig +short @1.1.1.1 "$name" A)$(dig +short @1.1.1.1 "$name" AAAA)" ]; then
                resolving="$resolving $name"
              fi
            done
            if [ -z "$resolving" ]; then
              echo "No preview hostname resolves anymore."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::These names still resolve; delete their Cloudflare records before rerunning:$resolving"
              exit 1
            fi
            echo "Still resolving:$resolving"
            sleep 30
          done
      - name: Release cloud load balancers
        # caph deletes only its own API-server load balancer. The ones behind
        # LoadBalancer Services (ingress-nginx) belong to the Hetzner cloud
        # controller, which deletes each before the Service's cleanup finalizer
        # clears, so they must go while that controller still runs.
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail
          export KUBECONFIG="$WORKLOAD_KUBECONFIG"

          services="$(kubectl get services -A \
            -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}')"
          for service in $services; do
            echo "Deleting LoadBalancer Service $service"
            kubectl -n "${service%%/*}" delete service "${service#*/}" \
              --wait=true --timeout=10m
          done
      - name: Delete the Cluster resource
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail

          kubectl -n "$CLUSTER_NAMESPACE" delete clusters.cluster.x-k8s.io "$CLUSTER_NAME" --wait=false
      - name: Wait for infrastructure teardown
        run: |
          set -euo pipefail

          if [ "${{ steps.cluster.outputs.exists }}" = "true" ]; then
            if ! kubectl -n "$CLUSTER_NAMESPACE" wait \
              --for=delete "clusters.cluster.x-k8s.io/$CLUSTER_NAME" --timeout=45m; then
              echo "::group::Preview cluster teardown diagnostics"
              kubectl -n "$CLUSTER_NAMESPACE" get cluster,kubeadmcontrolplane,machinedeployment,machine \
                -l "cluster.x-k8s.io/cluster-name=$CLUSTER_NAME" -o wide 2>&1 || true
              kubectl -n "$CLUSTER_NAMESPACE" get events \
                --field-selector involvedObject.name="$CLUSTER_NAME" \
                --sort-by=.lastTimestamp 2>&1 | tail -50 || true
              echo "::endgroup::"
              exit 1
            fi
          fi

          remaining_machines="$(
            kubectl -n "$CLUSTER_NAMESPACE" get machines.cluster.x-k8s.io \
              -l "cluster.x-k8s.io/cluster-name=$CLUSTER_NAME" -o name 2>/dev/null || true
          )"
          if [ -n "$remaining_machines" ]; then
            echo "::error::Cluster resource is gone but managed Machines remain:"
            echo "$remaining_machines"
            exit 1
          fi
      - name: Remove the preview scaler identity
        # The deleted preview workflow scaled the preview MachineDeployment
        # through this ServiceAccount (formerly infra/k8s/mgmt/preview-mgmt-rbac.yaml).
        run: |
          set -euo pipefail

          kubectl -n "$CLUSTER_NAMESPACE" delete rolebinding/preview-scaler role/preview-scaler \
            secret/preview-scaler-token serviceaccount/preview-scaler --ignore-not-found
      - name: Summary
        run: |
          {
            echo "## Preview cluster retired"
            echo "- Cluster: \`$CLUSTER_NAME\`"
            echo "- Preview KuraInstances and namespaces were removed before the Cluster resource."
            echo "- ExternalDNS withdrew the \`$PREVIEW_DOMAIN\` records, confirmed unresolvable, before load balancers were released."
            echo "- The Cluster resource, its managed infrastructure, and the \`preview-scaler\` identity are gone."
          } >> "$GITHUB_STEP_SUMMARY"
