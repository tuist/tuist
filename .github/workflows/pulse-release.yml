name: Pulse Release (retired)

# Keep the dispatch URL as a notice, never as a path back to the old runtime.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired — no release published
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The old Pulse runtime is retired. Use GreptimeDB Replacement; no release was published.'
