name: Pulse Canary Release

# Every Pulse change on main publishes a canary prerelease
# (pulse@X.Y.0-canary.N), like kura-release.yml. Canaries are marked as GitHub
# prereleases, never move "Latest", and never push :latest on GHCR.
#
# Stable releases are NOT cut from main. A line is frozen onto a
# releases/pulse-<major>.<minor>.x branch and published as an RC
# (pulse-rc.yml), soaks, then is promoted to stable X.Y.0 (pulse-promote.yml).
# Canary always targets the next unreleased minor: once an RC line is cut,
# main's canary advances to the following minor.
#
# Unlike Kura's, this runs on its own push trigger: nothing deploys the newest
# canary. The clusters run the image pinned in infra/helm/greptimedb/values.yaml.
on:
  push:
    branches: [main]
    paths:
      - pulse/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  # Shared with pulse-rc.yml and pulse-promote.yml so version resolution and
  # tag creation never race.
  group: pulse-publish
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  MISE_GITHUB_ATTESTATIONS: 0

jobs:
  resolve:
    name: Resolve canary version
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      changelog_from: ${{ steps.resolve.outputs.changelog_from }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: resolve
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -qE '^pulse@[0-9]+\.[0-9]+\.0-canary\.[0-9]+$'; then
            echo "HEAD already has a pulse canary tag; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          mise run --no-deps --skip-tools pulse:release:channel-version -- canary

  build-publish:
    name: Build and publish canary
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    uses: ./.github/workflows/pulse-build-publish.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.sha }}
      changelog_from: ${{ needs.resolve.outputs.changelog_from }}
      make_latest: false
      prerelease: true
    secrets: inherit
