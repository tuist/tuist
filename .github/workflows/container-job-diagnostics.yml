name: Container Job Diagnostics

# Temporary diagnostic for the `jobs.<id>.container` gap reported
# after #12713. Branch-scoped push trigger so it never runs on main.

on:
  push:
    branches:
      - claude/linux-container-jobs-aace5c

permissions:
  contents: read

jobs:
  storage:
    runs-on: tuist-linux
    timeout-minutes: 10
    steps:
      - name: What backs the work dir today vs the shared emptyDir
        run: |
          set -x
          cat /proc/mounts
          df -h /home/runner/work /home/runner/actions-runner/_work
      - name: Sequential write, container layer (today's work dir)
        run: |
          mkdir -p /home/runner/work/_bench
          dd if=/dev/zero of=/home/runner/work/_bench/f bs=1M count=2048 conv=fdatasync 2>&1
          rm -rf /home/runner/work/_bench
      - name: Sequential write, shared emptyDir (post-fix work dir)
        run: |
          mkdir -p /home/runner/actions-runner/_work/_bench
          dd if=/dev/zero of=/home/runner/actions-runner/_work/_bench/f bs=1M count=2048 conv=fdatasync 2>&1
          rm -rf /home/runner/actions-runner/_work/_bench
      - name: Many small files, container layer
        run: |
          mkdir -p /home/runner/work/_bench
          time sh -c 'for i in $(seq 1 3000); do echo x > /home/runner/work/_bench/$i; done'
          rm -rf /home/runner/work/_bench
      - name: Many small files, shared emptyDir
        run: |
          mkdir -p /home/runner/actions-runner/_work/_bench
          time sh -c 'for i in $(seq 1 3000); do echo x > /home/runner/actions-runner/_work/_bench/$i; done'
          rm -rf /home/runner/actions-runner/_work/_bench
