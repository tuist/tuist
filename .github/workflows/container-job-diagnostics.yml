name: Container Job Diagnostics

# Temporary diagnostic for the `jobs.<id>.container` gap reported
# after #12713. Branch-scoped push trigger so it never runs on main.

on:
  push:
    branches:
      - claude/linux-container-jobs-aace5c

permissions:
  contents: read

jobs:
  host:
    runs-on: tuist-linux
    timeout-minutes: 10
    steps:
      - name: Runner-side view
        run: |
          set -x
          id
          pwd
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE RUNNER_TEMP=$RUNNER_TEMP RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          ls -la /home/runner/actions-runner/ || true
          ls -la /home/runner/actions-runner/_work/ || true
          ls -la /home/runner/actions-runner/externals/ || true
          grep -E "_work|externals" /proc/mounts || true
      - uses: actions/checkout@v4
      - name: Actions cache after checkout
        run: ls -la /home/runner/actions-runner/_work/_actions/actions/checkout/ || true

  container:
    runs-on: tuist-linux
    timeout-minutes: 15
    container:
      image: ubuntu:22.04
    steps:
      - name: Container-side view before any JS action
        run: |
          set -x
          id
          pwd
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE RUNNER_TEMP=$RUNNER_TEMP RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "=== mounts"
          cat /proc/mounts
          echo "=== / "
          ls -la /
          echo "=== /__w"
          ls -la /__w || true
          echo "=== /__w/_actions"
          find /__w/_actions -maxdepth 4 2>/dev/null | head -40 || true
          echo "=== /__e"
          ls -la /__e || true
          echo "=== /__e/node20/bin"
          ls -la /__e/node20/bin || true
          echo "=== /__t"
          ls -la /__t || true
          echo "=== /__a /__o (legacy names, expected absent)"
          ls -la /__a /__o 2>&1 | head -5 || true
      - name: Checkout inside the container
        uses: actions/checkout@v4
      - name: Post-checkout view
        if: always()
        run: |
          set -x
          find /__w/_actions -maxdepth 4 2>/dev/null | head -40 || true
          ls -la /__w || true
