name: Linux Runner Image

# PR validation + on-demand build of the Tuist Linux runner OCI image
# consumed by `runnersFleetLinux.shapeRunnerImage` in the helm chart.
#
# PR: builds without pushing — catches Dockerfile / shell-syntax
#     breakage before merge.
# workflow_dispatch: builds and pushes a `:sha-<git-sha>` tag so a
#     branch can be validated against a real cluster before merging.
#
# The semver / `:latest` / chart-digest-rewrite flow lives in
# server-production-deployment.yml's `release-linux-runner-image` job — pushed on main.
# This workflow deliberately doesn't touch `:latest` or any semver
# tag; only the release job does.
#
# Mirrors the shape of .github/workflows/runner-image.yml (macOS
# Tart image) minus the PR trigger — Tart builds are expensive
# enough that PR-on-change validation isn't worth it for macOS;
# Linux Docker builds are cheap on hosted runners.

on:
  pull_request:
    paths:
      - infra/linux-runner-image/**
      - .github/actions/setup-docker-builder/**
      - .github/workflows/linux-runner-image.yml
      - .github/workflows/server-production-deployment.yml
      - .github/scripts/linux-runner-image-*
      - .github/scripts/ghcr-manifest-digest*
  workflow_dispatch:
    inputs:
      runner_version:
        description: |
          Override the `RUNNER_VERSION` build-arg in the Dockerfile
          to bump-test a new `actions/runner` release before
          opening the Renovate PR. Leave empty to use the
          Dockerfile's Renovate-tracked default.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/tuist-linux-runner

jobs:
  cache-mounts:
    name: Cache volume bind mounts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/linux-runner-image/go.mod
      - name: Test cache client and mount broker
        working-directory: infra/linux-runner-image
        env:
          GOWORK: "off"
        run: |
          go test -race ./cmd/tuist-cache-volume
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/cache-volume.test" ./cmd/tuist-cache-volume
          docker run --rm --privileged \
            -e TUIST_TEST_BIND_MOUNTS=1 \
            -v "$RUNNER_TEMP/cache-volume.test:/cache-volume.test:ro" \
            ubuntu:22.04 /cache-volume.test -test.v
      - name: Verify Docker layers and cache mounts across jobs
        timeout-minutes: 15
        run: |
          docker run --rm --privileged \
            -e TUIST_TEST_DOCKER_CACHE=1 \
            -e TMPDIR=/var/lib/docker \
            -v "$RUNNER_TEMP/cache-volume.test:/cache-volume.test:ro" \
            --entrypoint sh \
            public.ecr.aws/docker/library/docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac \
            -c 'apk add --no-cache e2fsprogs coreutils >/dev/null && /cache-volume.test -test.v -test.run TestDockerBuildCacheAcrossJobs -test.timeout=14m' \
            2>&1 | tee "$RUNNER_TEMP/docker-build-cache.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-build-cache-evidence
          path: ${{ runner.temp }}/docker-build-cache.log
  build:
    needs: cache-mounts
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Linux rollout gate and layer comparison
        run: |
          bash .github/scripts/linux-runner-image-prepare.test.sh
          bash .github/scripts/ghcr-manifest-digest.test.sh
          node --test infra/linux-runner-image/compare-layers.test.mjs

      - name: Syntax-check runner scripts
        run: |
          bash -n infra/linux-runner-image/dispatch-poll.sh
          bash -n infra/linux-runner-image/run-job.sh
          bash -n infra/linux-runner-image/vitals.sh
          bash -n infra/linux-runner-image/metrics-sampler.sh
          bash -n infra/linux-runner-image/gradle-cache-smoke.sh

      - name: Test GitLab assignment staging
        run: bash infra/linux-runner-image/gitlab-dispatch_test.sh

      - name: Test job-start hook
        run: bash infra/linux-runner-image/run-job_test.sh

      # Runs on the image's own base rather than the CI runner, because
      # the assertions are about how Ubuntu's awk (mawk) formats byte
      # counters. Under gawk or BWK awk they pass no matter what the
      # sampler does. Keep the tag in step with the Dockerfile's final
      # `FROM`.
      - name: Test metrics sampler
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/linux-runner-image:/w" \
            -w /w ubuntu:22.04 bash ./metrics-sampler_test.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/linux-runner-image/gitlab-runner/go.mod

      - name: Test GitLab job executor
        working-directory: infra/linux-runner-image/gitlab-runner
        env:
          GOWORK: "off"
        run: go test -race ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PRs build but don't push; tag with the merge SHA for
            # log clarity. The push: false flag below makes this a
            # build-only validation.
            echo "tags=${IMAGE}:pr-${GIT_SHA}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: push a per-SHA tag for branch
            # validation / bring-up. The release flow owns `:latest`
            # and the semver tags, so we deliberately don't touch
            # `:latest` here.
            echo "tags=${IMAGE}:sha-${GIT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: infra/linux-runner-image
          file: infra/linux-runner-image/Dockerfile
          # Linux runners run on Hetzner Robot bare-metal x86 boxes
          # at v1. arm64 is a future option (Ampere-based SKUs) and
          # can land as an additive `platforms:` entry.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=oci,dest=${{ runner.temp }}/linux-runner-baseline.tar
          tags: ${{ steps.tags.outputs.tags }}
          # Only forwarded when explicitly set via workflow_dispatch
          # input; empty leaves the Dockerfile's `ARG RUNNER_VERSION`
          # default in place (Renovate-managed).
          build-args: |
            ${{ inputs.runner_version && format('RUNNER_VERSION={0}', inputs.runner_version) || '' }}
          # Validation can read the release cache, but never overwrite it.
          cache-from: |
            type=registry,ref=ghcr.io/tuist/tuist-linux-runner:buildcache
            type=gha,scope=linux-runner-image
          cache-to: |
            type=gha,mode=max,scope=linux-runner-image
            type=local,dest=${{ runner.temp }}/linux-runner-cache,mode=max

      - name: Verify a script-only release adds at most 10 MiB
        env:
          BASELINE: ${{ runner.temp }}/linux-runner-baseline.tar
          BUILD_CACHE: ${{ runner.temp }}/linux-runner-cache
          RUNNER_VERSION_OVERRIDE: ${{ inputs.runner_version }}
        run: bash infra/linux-runner-image/verify-layer-reuse.sh "$BASELINE" "$BUILD_CACHE" "$RUNNER_VERSION_OVERRIDE"
