name: Runners Shape Benchmark

# Compares macOS runner shapes on the rack's M5 Pro (ber1-runner-b01, lent to
# staging). A round runs the same cold workloads in one or two guests at once,
# and the rounds run one after another so they never share the host.
#
# The `bench-ber1-*` labels are the dispatch labels of RunnerPools created by
# hand in staging's tuist-runners namespace (label
# tuist.dev/purpose=shape-benchmark), selecting b01's fleet. Production also
# receives tuist/tuist's webhooks, so the labels must be ones no production
# pool or profile resolves; the chart's own `shape-macos-ber1-*` labels are
# not.
#
# Two 8 vCPU guests and a 16 vCPU guest need b01 to advertise 16 CPU / 48 GB.
# For this benchmark its tart-kubelet flags were raised by hand on the host;
# production's operator restores 12 / 28 on its next host-config push.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: >-
          JSON array of rounds, e.g. [{"shape": "8vcpu-19gb", "guests": 2}].
          Empty runs the default rounds.
        required: false
        default: ""
      app_tests:
        description: Also build and test TuistApp on the simulator
        type: boolean
        default: true
  push:
    branches:
      - claude/m5-pro-resource-limits-951e5f
    paths:
      - .github/workflows/runners-shape-benchmark.yml
      - .github/workflows/runners-shape-benchmark-run.yml

permissions:
  contents: read

concurrency:
  group: runners-shape-benchmark
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rounds: ${{ steps.plan.outputs.rounds }}
    steps:
      - id: plan
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          if [ -z "$ROUNDS" ]; then
            ROUNDS='[
              {"shape": "8vcpu-24gb", "guests": 2}
            ]'
          fi
          # Two passes, the second in reverse order, so drift over the night
          # (thermals, the host's caches) does not favour one shape.
          echo "rounds=$(jq -c '[.[] | . + {slots: [range(1; .guests + 1)]}] as $r | [($r[] | . + {pass: 1}), ($r | reverse | .[] | . + {pass: 2})]' <<< "$ROUNDS")" >> "$GITHUB_OUTPUT"

  round:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: ${{ fromJSON(needs.plan.outputs.rounds) }}
    uses: ./.github/workflows/runners-shape-benchmark-run.yml
    with:
      runs_on: bench-ber1-${{ matrix.round.shape }}
      shape: ${{ matrix.round.shape }}
      guests: ${{ matrix.round.guests }}
      pass: ${{ matrix.round.pass }}
      slots: ${{ toJSON(matrix.round.slots) }}
      app_tests: ${{ github.event_name == 'push' || inputs.app_tests }}
    secrets: inherit

  report:
    needs: round
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results
          merge-multiple: true
      - name: Tabulate
        run: |
          {
            echo "| Shape | Guests | Pass | Slot | Guest vCPU / GiB | CLI builds (s) | CLI CPU % | Unit tests build (s) | Unit CPU % / >=90% | TuistApp test (s) | Peak mem GiB |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            jq -rs 'sort_by(.guest_vcpus, .guest_memory_gib, .guests, .pass, .slot)[] | "| \(.shape) | \(.guests) | \(.pass) | \(.slot) | \(.guest_vcpus) / \(.guest_memory_gib) | \(.cli_build_seconds // [] | map(tostring) | join(" / ")) | \(.cli_avg_cpu_percent) | \(.unit_build_seconds) (exit \(.unit_build_exit)) | \(.unit_avg_cpu_percent) / \(.unit_pegged_percent)% | \(.app_test_seconds) (exit \(.app_test_exit)) | \(.peak_memory_gib) |"' results/*.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -s . results/*.json > results.json
      - uses: actions/upload-artifact@v4
        with:
          name: runners-shape-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.json
