name: Runners Shape Benchmark

# Compares macOS runner shapes on the rack's M5 Pro (ber1-runner-b01, lent to
# staging). Each shape runs the same cold workloads, one shape at a time so
# they never share the host.
#
# The `bench-ber1-*` labels are the dispatch labels of RunnerPools created by
# hand in staging's tuist-runners namespace (label
# tuist.dev/purpose=shape-benchmark), selecting b01's fleet. Production also
# receives tuist/tuist's webhooks, so the labels must be ones no production
# pool or profile resolves; the chart's own `shape-macos-ber1-*` labels are
# not.
#
# While b01 advertises 12 CPU / 28 GB, only one guest larger than 6 vCPU /
# 14 GB fits, so every shape runs alone and 6 vCPU / 14 GB also runs as a
# pair, which shows what the second guest costs. Every run records each
# job's wall-clock times and in-guest CPU and memory, and the report job
# tabulates them.

on:
  workflow_dispatch:
    inputs:
      app_tests:
        description: Also build and test TuistApp on the simulator, which is the memory-heavy workload
        type: boolean
        default: true
  push:
    branches:
      - claude/m5-pro-resource-limits-951e5f
    paths:
      - .github/workflows/runners-shape-benchmark.yml
      - .github/workflows/runners-shape-benchmark-run.yml

permissions:
  contents: read

concurrency:
  group: runners-shape-benchmark
  cancel-in-progress: false

jobs:
  shape-6vcpu-14gb:
    if: github.repository == 'tuist/tuist'
    uses: ./.github/workflows/runners-shape-benchmark-run.yml
    with:
      runs_on: bench-ber1-6vcpu-14gb
      shape: 6vcpu-14gb
      slots: "[1]"
      app_tests: ${{ github.event_name == 'push' || inputs.app_tests }}
    secrets: inherit

  shape-8vcpu-19gb:
    needs: shape-6vcpu-14gb
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' }}
    uses: ./.github/workflows/runners-shape-benchmark-run.yml
    with:
      runs_on: bench-ber1-8vcpu-19gb
      shape: 8vcpu-19gb
      slots: "[1]"
      app_tests: ${{ github.event_name == 'push' || inputs.app_tests }}
    secrets: inherit

  shape-8vcpu-24gb:
    needs: shape-8vcpu-19gb
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' }}
    uses: ./.github/workflows/runners-shape-benchmark-run.yml
    with:
      runs_on: bench-ber1-8vcpu-24gb
      shape: 8vcpu-24gb
      slots: "[1]"
      app_tests: ${{ github.event_name == 'push' || inputs.app_tests }}
    secrets: inherit

  shape-6vcpu-24gb:
    needs: shape-8vcpu-24gb
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' }}
    uses: ./.github/workflows/runners-shape-benchmark-run.yml
    with:
      runs_on: bench-ber1-6vcpu-24gb
      shape: 6vcpu-24gb
      slots: "[1]"
      app_tests: ${{ github.event_name == 'push' || inputs.app_tests }}
    secrets: inherit

  shape-6vcpu-14gb-pair:
    needs: shape-6vcpu-24gb
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' }}
    uses: ./.github/workflows/runners-shape-benchmark-run.yml
    with:
      runs_on: bench-ber1-6vcpu-14gb
      shape: 6vcpu-14gb-pair
      slots: "[1, 2]"
      app_tests: ${{ github.event_name == 'push' || inputs.app_tests }}
    secrets: inherit

  report:
    needs: [shape-6vcpu-14gb, shape-8vcpu-19gb, shape-8vcpu-24gb, shape-6vcpu-24gb, shape-6vcpu-14gb-pair]
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results
          merge-multiple: true
      - name: Tabulate
        run: |
          {
            echo "| Shape | Slot | Guest vCPU | Guest GiB | CLI builds (s) | CLI median (s) | TuistApp test (s) | TuistApp exit | Build avg CPU % | Build time at >=90% CPU | Peak mem GiB |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            jq -rs 'sort_by(.shape, .slot)[] | "| \(.shape) | \(.slot) | \(.guest_vcpus) | \(.guest_memory_gib) | \(.cli_build_seconds // [] | map(tostring) | join(" / ")) | \(.cli_build_seconds // [] | sort | if length > 0 then .[length / 2 | floor] else null end) | \(.app_test_seconds) | \(.app_test_exit) | \(.avg_cpu_percent) | \(.pegged_percent)% | \(.peak_memory_gib) |"' results/*.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -s . results/*.json > results.json
      - uses: actions/upload-artifact@v4
        with:
          name: runners-shape-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.json
