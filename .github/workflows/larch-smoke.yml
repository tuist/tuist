# Runs GitHub Actions jobs on the larch rack's Mac minis (rack 2,
# infra/rack-switch-fleet/sites/larch.json) to prove they are working CI
# runners: dispatch, VM start, egress from larch's own block, the rack's cache.
#
# `runs-on: tuist-larch-smoke` reaches the env whose values declare the
# `larch` explicit pool (production), which places runners only on
# tuist-tuist-rack-fleet-larch: larch's minis while its runners are off, so no
# customer job shares them.
#
# Manual dispatch only. No larch mini takes a VM until larch.json's
# power_budget matches its 10 A C13 sockets.
#
# `load_minutes` above 0 also runs one load job per guest slot, as in Alder
# Smoke.
name: Larch Smoke

on:
  workflow_dispatch:
    inputs:
      load_minutes:
        description: Minutes of full CPU load per guest slot (0 runs only the smoke jobs)
        required: false
        default: "0"
      slots:
        description: Guest slots to load (the site's hosts x 2)
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  server:
    name: Find the rack's server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      url: ${{ steps.server.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: server
        run: |
          set -euo pipefail
          environment="$(infra/rack-switch-fleet/fleet.sh --site larch env)"
          case "$environment" in
            production) url=https://tuist.dev;;
            *) url="https://$environment.tuist.dev";;
          esac
          echo "larch is in $environment, served by $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Run on larch hardware
    runs-on: tuist-larch-smoke
    timeout-minutes: 20
    steps:
      - name: Identify the machine this job is running on
        run: |
          echo "runner    : $RUNNER_NAME"
          echo "host      : $(scutil --get LocalHostName 2>/dev/null || hostname)"
          echo "chip      : $(system_profiler SPHardwareDataType | awk -F': ' '/Chip/{print $2}')"
          echo "macOS     : $(sw_vers -productVersion)"
          echo "arch      : $(uname -m)"
          echo "uptime    : $(uptime)"

      # management.edge.wan.egress.prefix in larch.json: 95.130.119.32/28.
      - name: Egress is larch's own block
        run: |
          set -euo pipefail
          ip="$(curl -4 -fsS -m 10 https://api.ipify.org)"
          echo "egress    : $ip"
          case "$ip" in
            95.130.119.*) octet="${ip##*.}";;
            *) echo "::error::$ip is not in 95.130.119.32/28"; exit 1;;
          esac
          [ "$octet" -ge 32 ] && [ "$octet" -le 47 ] || { echo "::error::$ip is not in 95.130.119.32/28"; exit 1; }

      - name: Do actual work
        run: |
          set -euo pipefail
          swift --version
          sum="$(echo 's=0; for(i=0;i<1000000;i++) s+=i*i; s' | bc)"
          test "$sum" = "333332833333500000"
          echo "computed and verified on larch hardware"

  # ber1's minis keep egressing from ber1's block while larch announces its own.
  ber1-egress:
    name: Alder still egresses from its block
    runs-on: tuist-ber1-smoke
    timeout-minutes: 20
    steps:
      - run: |
          set -euo pipefail
          ip="$(curl -4 -fsS -m 10 https://api.ipify.org)"
          echo "egress    : $ip ($RUNNER_NAME)"
          case "$ip" in
            95.130.119.*) octet="${ip##*.}";;
            *) echo "::error::$ip is not in 95.130.119.16/28"; exit 1;;
          esac
          [ "$octet" -ge 16 ] && [ "$octet" -le 31 ] || { echo "::error::$ip is not in 95.130.119.16/28"; exit 1; }

  # The rack's own cache: dispatch hands a larch job the larch-runners
  # endpoint, the gateway on larch-store-a at 10.20.0.11.
  cache:
    name: Pull from the rack's cache
    needs: server
    runs-on: tuist-larch-smoke
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TUIST_URL: ${{ needs.server.outputs.url }}
      RACK_CACHE_ADDRESS: 10.20.0.11
    steps:
      - name: The dispatched endpoint is the rack's cache
        run: |
          set -euo pipefail
          endpoint="${TUIST_CACHE_ENDPOINT:-}"
          [ -n "$endpoint" ] || { echo "::error::dispatch handed this job no cache endpoint"; exit 1; }
          host="${endpoint#https://}"; host="${host%%/*}"
          echo "TUIST_CACHE_ENDPOINT=$endpoint"
          resolved="$(dscacheutil -q host -a name "$host" | awk '/^ip_address:/{print $2; exit}')"
          echo "$host resolves to $resolved"
          [ "$resolved" = "$RACK_CACHE_ADDRESS" ] || { echo "::error::$host is not larch-store-a ($RACK_CACHE_ADDRESS)"; exit 1; }
          code="$(curl -sS -m 10 -o /tmp/up -w '%{http_code}' "${endpoint%/}/up")"
          echo "GET /up -> HTTP $code"
          [ "$code" = 200 ] || { echo "::error::/up returned $code"; exit 1; }
      - name: Round-trip a blob through it
        run: |
          set -euo pipefail
          endpoint="${TUIST_CACHE_ENDPOINT%/}"
          oidc="$(curl -sS -m 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tuist" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
          token="$(curl -sS -m 10 -X POST -H 'content-type: application/json' -d "{\"token\":\"$oidc\"}" "$TUIST_URL/api/auth/oidc/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
          [ -n "$token" ] || { echo "::error::$TUIST_URL minted no token for this repository's OIDC identity"; exit 1; }
          key="larch-smoke-$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d -)"
          query="tenant_id=tuist&namespace_id=tuist"
          head -c 1048576 /dev/urandom > /tmp/blob
          code="$(curl -sS -m 30 -o /tmp/put -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'content-type: application/octet-stream' --data-binary @/tmp/blob "$endpoint/api/cache/cas/$key?$query")"
          echo "POST /api/cache/cas/$key -> HTTP $code"
          case "$code" in 2*) ;; *) echo "::error::write returned $code"; exit 1;; esac
          code="$(curl -sS -m 30 -o /tmp/got -w '%{http_code}' -H "Authorization: Bearer $token" "$endpoint/api/cache/cas/$key?$query")"
          echo "GET /api/cache/cas/$key -> HTTP $code"
          [ "$code" = 200 ] || { echo "::error::read returned $code"; exit 1; }
          cmp /tmp/blob /tmp/got
          echo "read back the 1 MiB blob byte for byte from $endpoint"

  slots:
    name: Plan load slots
    if: inputs.load_minutes != '0'
    runs-on: ubuntu-latest
    outputs:
      slots: ${{ steps.plan.outputs.slots }}
    steps:
      - id: plan
        run: echo "slots=$(seq 1 "$SLOTS" | jq -cs .)" >> "$GITHUB_OUTPUT"
        env:
          SLOTS: ${{ inputs.slots }}

  load:
    name: Load slot ${{ matrix.slot }}
    needs: slots
    runs-on: tuist-larch-smoke
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.slots.outputs.slots) }}
    steps:
      - name: Hash on every vCPU and report throughput per minute
        env:
          LOAD_MINUTES: ${{ inputs.load_minutes }}
        run: |
          set -euo pipefail
          cpus=$(sysctl -n hw.ncpu)
          echo "runner=$RUNNER_NAME cpus=$cpus"
          work=$(mktemp -d)
          for i in $(seq 1 "$cpus"); do
            ( while :; do head -c 268435456 /dev/zero | openssl dgst -sha256 >/dev/null; echo >> "$work/w$i"; done ) &
          done
          total() { cat "$work"/w* 2>/dev/null | wc -l | tr -d ' '; }
          previous=0
          for minute in $(seq 1 "$LOAD_MINUTES"); do
            sleep 60
            now=$(total)
            echo "minute=$minute runner=$RUNNER_NAME gib_per_min=$(( (now - previous) / 4 )) chunks=$((now - previous))"
            previous=$now
          done
          kill $(jobs -p) 2>/dev/null || true
