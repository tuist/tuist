name: Server Mix Cache Seed

# Publishes the server's compiled dependencies to the tuist/server remote cache
# from a cold _build. The test build reuses a warm _build volume, so it only
# uploads dependencies that changed; everything else never reaches the remote
# cache, and read-only consumers (Amp orbs, fresh checkouts) compile from
# source. Keys include MIX_ENV, so dev and test are seeded separately.

on:
  push:
    branches:
      - main
    paths:
      - server/mix.exs
      - server/mix.lock
      - server/config/**
      - tuist_ex/**
      - tuist_common/**
      - mise.toml
      - server/mise.toml
      - .github/workflows/server-mix-cache-seed.yml
      - .github/actions/setup-server-mix/action.yml
  # Re-publish what Kura evicted since the last seed. Present artifacts are
  # restored rather than uploaded again.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tuist-server-mix-cache-seed
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  MISE_TASK_RUN_AUTO_INSTALL: 0
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_GITHUB_SLSA: 0
  # Prints each dependency's cache outcome, so the log shows what was uploaded.
  TUIST_DEBUG: "1"

defaults:
  run:
    working-directory: server

jobs:
  seed:
    name: Seed ${{ matrix.mix-env }} dependencies
    if: github.repository == 'tuist/tuist'
    runs-on: tuist-linux-large
    timeout-minutes: 45
    permissions:
      contents: read
      # The OIDC exchange grants the cache write the seed needs.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        mix-env: [dev, test]
    env:
      MIX_ENV: ${{ matrix.mix-env }}
    steps:
      - uses: actions/checkout@v4
      # Only deps is retained: a _build volume would make every dependency
      # current, and current dependencies are never uploaded.
      - uses: ./.github/actions/setup-server-mix
        with:
          restore-mix-cache: deps
          mise-cache: "false"
      - name: Prefetch CLDR locale data
        run: mise/tasks/cldr/prefetch-locale-data.sh
      - name: Compile with dependency caching
        run: mix compile
