name: Cloudflare Operator Image

# PR validation + ad-hoc image build for cloudflare-operator, the
# Kubernetes controller that reconciles CRDs under cloudflare.tuist.dev
# against the Cloudflare API so that zone-level configuration (rate
# limits today, cache rules / WAF custom rules / AI Crawl Control /
# zone settings as follow-on CRDs) lives in git.
#
# Steady-state image promotion for the operator will follow the same
# pattern as the other infra controllers; today this workflow handles
# PR validation and pre-release iteration via `:sha-<git-sha>` tags.

on:
  push:
    branches:
      - main
    paths:
      - infra/cloudflare-operator/**
      - .github/workflows/cloudflare-operator-image.yml
  pull_request:
    paths:
      - infra/cloudflare-operator/**
      - .github/workflows/cloudflare-operator-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/cloudflare-operator

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/cloudflare-operator/go.mod
          cache-dependency-path: infra/cloudflare-operator/go.sum
      # Install kube-apiserver + etcd binaries so the envtest suite
      # under controllers/envtest_test.go actually runs (it skips
      # when KUBEBUILDER_ASSETS is unset). This exercises CRD
      # admission — CEL rules for immutable zoneId, cf.colo.id
      # requirement, adopt-or-create — which the fake-client tests
      # cannot cover.
      - name: Install envtest binaries
        working-directory: infra/cloudflare-operator
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.32.0 --bin-dir /tmp/envtest -p path)" >> "$GITHUB_ENV"
      - name: Test
        working-directory: infra/cloudflare-operator
        run: go test ./...
      - name: Vet
        working-directory: infra/cloudflare-operator
        run: go vet ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/cloudflare-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=cloudflare-operator
          cache-to: type=gha,mode=max,scope=cloudflare-operator
