name: Cloudflare Operator Image

# PR validation + main-branch image build for cloudflare-operator, the
# Kubernetes controller that reconciles CRDs under cloudflare.tuist.dev
# against the Cloudflare API so that zone-level configuration (rate
# limits and Web Application Firewall custom rules today, with cache rules,
# crawler controls, and zone settings as possible follow-on resources) lives
# in git.
#
# Relevant main merges publish an image followed by an OCI Helm chart
# containing that image's digest. Flux selects chart versions without
# committing image bumps to Git or needing repository-rule bypass access.

on:
  push:
    branches:
      - main
    paths:
      - infra/cloudflare-operator/**
      - infra/helm/cloudflare-operator/**
      - infra/flux/cloudflare-operator/**
      - infra/flux/mgmt/cloudflare-operator.yaml
      - .github/scripts/cloudflare-operator-chart*.sh
      - .github/workflows/cloudflare-operator-image.yml
  pull_request:
    paths:
      - infra/cloudflare-operator/**
      - infra/helm/cloudflare-operator/**
      - infra/flux/cloudflare-operator/**
      - infra/flux/mgmt/cloudflare-operator.yaml
      - .github/scripts/cloudflare-operator-chart*.sh
      - .github/workflows/cloudflare-operator-image.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-operator-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/cloudflare-operator

jobs:
  test:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm yq kubectl"
          cache: "false"
      - name: Validate published chart contents
        run: bash .github/scripts/cloudflare-operator-chart.test.sh
      - name: Render Flux configuration
        run: |
          kubectl kustomize infra/flux/cloudflare-operator > /dev/null
          kubectl kustomize infra/flux/cloudflare-config > /dev/null
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/cloudflare-operator/go.mod
          cache-dependency-path: infra/cloudflare-operator/go.sum
      # Install kube-apiserver + etcd binaries so the envtest suite
      # under controllers/envtest_test.go actually runs (it skips
      # when KUBEBUILDER_ASSETS is unset). This exercises CRD
      # admission — CEL rules for immutable zoneId, cf.colo.id
      # requirement, adopt-or-create — which the fake-client tests
      # cannot cover.
      - name: Install envtest binaries
        working-directory: infra/cloudflare-operator
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.32.0 --bin-dir /tmp/envtest -p path)" >> "$GITHUB_ENV"
      - name: Test
        working-directory: infra/cloudflare-operator
        run: go test ./...
      - name: Vet
        working-directory: infra/cloudflare-operator
        run: go vet ./...

  build:
    needs: test
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: tuist-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm yq"
          cache: "false"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "image_tag=sha-${GIT_SHA}"
            echo "chart_version=0.2.${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: infra/cloudflare-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=cloudflare-operator
          cache-to: type=gha,mode=max,scope=cloudflare-operator
          labels: |
            org.opencontainers.image.source=https://github.com/tuist/tuist
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Package and publish immutable Helm chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          CHART_VERSION: ${{ steps.tags.outputs.chart_version }}
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart"
          bash .github/scripts/cloudflare-operator-chart.sh \
            "$CHART_VERSION" "$IMAGE_TAG" "$IMAGE_DIGEST" "$RUNNER_TEMP/chart"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/cloudflare-operator-$CHART_VERSION.tgz" oci://ghcr.io/tuist/charts
