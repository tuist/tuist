name: Server Cache Benchmarks

on:
  pull_request:
    paths:
      - .github/scripts/server-docker-mix-cache*
      - .github/scripts/server-docker-mix-benchmark.sh
      - .github/scripts/server-elixir-cache-*
      - .github/workflows/server-docker-mix-cache.yml
      - server/Dockerfile
  workflow_dispatch:
    inputs:
      benchmark:
        description: Cache implementation to measure
        type: choice
        options: [docker, elixir-remote]
        default: docker

permissions:
  contents: read

# The benchmark's seed and consumers share a deliberately isolated cache key.
concurrency:
  group: server-docker-mix-cache-${{ github.event_name }}-${{ github.event.pull_request.number || 'benchmark' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test cache lifecycle
    runs-on: tuist-linux
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/server-docker-mix-cache.test.sh
      - run: python3 .github/scripts/server-elixir-cache-benchmark.test.py

  seed:
    name: Seed registry and production project caches
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.repository == 'tuist/tuist' && inputs.benchmark != 'elixir-remote'
    runs-on: tuist-linux-large
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attach the isolated production Mix snapshot
        uses: tuist/cache-volume@v1
        with:
          key: server-image-prod-amd64-mix-benchmark-v1
          path: ~/.cache/tuist-server-docker-mix
      - name: Seed the shared registry cache and production project snapshot
        run: bash .github/scripts/server-docker-mix-benchmark.sh seed

  elixir-remote:
    name: Measure full-server remote dependency cache
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.repository == 'tuist/tuist' && inputs.benchmark == 'elixir-remote'
    runs-on: tuist-linux-large
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      MIX_ENV: dev
      ERL_FLAGS: "+S 4:4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-server-mix
        with:
          restore-mix-cache: "false"
      - name: Fetch the exact committed lock without resolving upgrades
        shell: bash
        run: |
          git show HEAD:server/mix.lock > server/mix.lock
          cd server
          elixir ../.github/scripts/server-elixir-cache-reconcile.exs
          git diff --exit-code -- mix.lock
      - name: Seed and compare cache-disabled and remote-only builds
        run: python3 .github/scripts/server-elixir-cache-benchmark.py
      - name: Record raw results
        if: always()
        shell: bash
        run: |
          {
            echo '## Full-server remote dependency-cache comparison'
            echo 'Fresh builds and pristine locked sources; SDK bootstrap and server compilation included.'
            echo 'Seed is separate. Input keys include this run ID and attempt so reruns cannot reuse a previous seed.'
            echo 'Remote samples start with an empty local artifact store; no Mix snapshot volume is attached.'
            echo 'Four Erlang schedulers; three dependency workers configured, but selected cache misses/bypasses compile serially.'
            echo 'Downloads/source reset are outside the timers. Native download caches remain shared across samples.'
            echo 'RPC read durations exclude local staging; inspect complete process times, coverage and degraded flags.'
            echo 'Seeded-key misses fail the comparison after all samples are recorded. A 50-minute total budget preserves cleanup time.'
            echo '```json'
            if [ -f "$RUNNER_TEMP/elixir-cache-benchmark/samples.json" ]; then
              python3 -m json.tool "$RUNNER_TEMP/elixir-cache-benchmark/samples.json"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elixir-remote-cache-benchmark
          path: |
            ${{ runner.temp }}/elixir-cache-benchmark/*.json
            ${{ runner.temp }}/elixir-cache-benchmark/*.log
          retention-days: 7

  benchmark:
    name: Measure ${{ matrix.variant }}
    needs: seed
    runs-on: tuist-linux-large
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        variant: [before, after]
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TUIST_BENCHMARK_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start foreground measurement
        run: echo "TUIST_BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore the independently published production Mix snapshot
        if: matrix.variant == 'after'
        id: mix-cache
        uses: tuist/cache-volume@v1
        with:
          key: server-image-prod-amd64-mix-benchmark-v1
          path: ~/.cache/tuist-server-docker-mix
      - name: Require an actual cross-job cache restore
        if: matrix.variant == 'after'
        run: |
          test "$CACHE_HIT" = true
          test "$(< "$HOME/.cache/tuist-server-docker-mix/current/.run-id")" = "$GITHUB_RUN_ID"
          bash .github/scripts/server-docker-mix-cache.sh prepare
        env:
          CACHE_HIT: ${{ steps.mix-cache.outputs.cache-hit }}
      - name: Measure the same application source change
        id: measure
        run: bash .github/scripts/server-docker-mix-benchmark.sh measure
      - name: Verify the resulting parser runs as the runtime user
        env:
          IMAGE: ${{ steps.measure.outputs.image }}
        run: |
          docker run --rm --entrypoint /app/bin/tuist \
            --env DATABASE_URL=ecto://tuist:tuist@127.0.0.1/tuist \
            --env TUIST_DEPLOY_ENV=prod \
            --env TUIST_HOSTED=1 \
            --env TUIST_OBJECT_STORAGE_PROVIDER=azure_blob \
            "$IMAGE" eval '
            parser = Application.app_dir(:tuist, "priv/native/xcactivitylog-parser")
            {usage, 2} = System.cmd(parser, [], stderr_to_stdout: true)
            true = String.starts_with?(usage, "usage: xcactivitylog-parser ")
            :benchmark = Tuist.CacheBenchmarkProbe.value()
          '
      - name: Record measured foreground costs
        run: |
          {
            echo '## Controlled application-change benchmark'
            echo 'Same checkout, MIX_ENV=prod, TUIST_HOSTED=1, per-build runtime package refresh and runner size.'
            echo 'Each variant uses the same Dockerfile and shared seeded registry cache on a new runner.'
            echo 'Both include the Swift artifact stage; only after supplies project compilation state.'
            echo 'The after result includes volume restore and compiled-output export, but not asynchronous volume publication.'
            echo 'Inspect publication metadata separately; foreground time alone is not the total cost.'
            echo 'This is one synthetic source-change pair, not a general speedup estimate.'
            echo '```json'
            cat "$RUNNER_TEMP/result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-mix-benchmark-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/build.log
          retention-days: 7
