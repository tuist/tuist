name: Certificate Trust

on:
  pull_request:
    paths:
      - infra/runner-image/cmd/runner-shell-agent/**
      - infra/linux-runner-image/cmd/runner-shell-agent/**
      - infra/runner-image/go.*
      - infra/linux-runner-image/go.*
      - infra/certificate-trust/**
      - go.work
      - infra/**/go.mod
      - kube-impersonator/go.mod
      - infra/linux-runner-image/cmd/tuist-cache-volume/**
      - .github/workflows/certificate-trust.yml
  push:
    branches: [main]
    paths:
      - infra/runner-image/cmd/runner-shell-agent/**
      - infra/linux-runner-image/cmd/runner-shell-agent/**
      - infra/runner-image/go.*
      - infra/linux-runner-image/go.*
      - infra/certificate-trust/**
      - go.work
      - infra/**/go.mod
      - kube-impersonator/go.mod
      - infra/linux-runner-image/cmd/tuist-cache-volume/**
      - .github/workflows/certificate-trust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certificate-trust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: tuist-linux
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      TRUST_EXPECTED_GO_SDK: go1.26.10
    defaults:
      run:
        working-directory: infra/certificate-trust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Race-test both runner shell discovery and WSS clients
        run: |
          go -C ../runner-image test -race -count=1 ./cmd/runner-shell-agent
          go -C ../linux-runner-image test -race -count=1 ./cmd/runner-shell-agent
      - name: Test policy evidence and public store contracts
        run: go test -count=1 ./...
      - name: Race-test cache-volume HTTPS clients and wire controls
        run: go -C ../linux-runner-image test -race -count=1 ./cmd/tuist-cache-volume
      - name: Check shell syntax
        run: bash -n pem-store.sh && bash -n java-store.sh
      - name: Qualify compiler distrust with retained runtime defaults
        run: |
          for baseline in go1.25 go1.23; do
            echo "Qualifying default=$baseline"
            go mod edit -godebug=default="$baseline"
            go run .
          done
