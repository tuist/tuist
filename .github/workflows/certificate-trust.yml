name: Certificate Trust

on:
  pull_request:
    paths:
      - infra/runner-image/cmd/runner-shell-agent/**
      - infra/linux-runner-image/cmd/runner-shell-agent/**
      - infra/runner-image/go.*
      - infra/linux-runner-image/go.*
      - infra/certificate-trust/**
      - infra/runner-image/runner.pkr.hcl
      - infra/xcresult-processor-image/xcresult-processor.pkr.hcl
      - mise/tasks/release/components.json
      - go.work
      - infra/**/go.mod
      - kube-impersonator/go.mod
      - infra/linux-runner-image/cmd/tuist-cache-volume/**
      - .github/workflows/certificate-trust.yml
      - infra/macos-log-shipper/**
      - server/config/runtime.exs
      - server/lib/tuist/application.ex
      - server/lib/tuist/application/certificate_trust.ex
      - server/test/tuist/application/certificate_trust_test.exs
      - server/test/tuist/application/fixtures/**
      - .github/workflows/server-deployment.yml
      - .github/scripts/xcresult-processor-rollout.test.mjs
  push:
    branches: [main]
    paths:
      - infra/runner-image/cmd/runner-shell-agent/**
      - infra/linux-runner-image/cmd/runner-shell-agent/**
      - infra/runner-image/go.*
      - infra/linux-runner-image/go.*
      - infra/certificate-trust/**
      - infra/runner-image/runner.pkr.hcl
      - infra/xcresult-processor-image/xcresult-processor.pkr.hcl
      - mise/tasks/release/components.json
      - go.work
      - infra/**/go.mod
      - kube-impersonator/go.mod
      - infra/linux-runner-image/cmd/tuist-cache-volume/**
      - .github/workflows/certificate-trust.yml
      - infra/macos-log-shipper/**
      - server/config/runtime.exs
      - server/lib/tuist/application.ex
      - server/lib/tuist/application/certificate_trust.ex
      - server/test/tuist/application/certificate_trust_test.exs
      - server/test/tuist/application/fixtures/**
      - .github/workflows/server-deployment.yml
      - .github/scripts/xcresult-processor-rollout.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certificate-trust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcresult-runtime:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: erlang elixir node
      - name: Test processor trust without starting the server or modifying host trust
        working-directory: server
        run: elixir -r lib/tuist/application/certificate_trust.ex -e 'ExUnit.start(); Code.require_file("test/tuist/application/certificate_trust_test.exs")'
      - run: npm ci --ignore-scripts
      - name: Test the canary processor readiness gate without cluster access
        run: node --test .github/scripts/xcresult-processor-rollout.test.mjs
  test:
    # Cache-volume filesystem regressions need user xattrs, absent on fleet /tmp.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      TRUST_EXPECTED_GO_SDK: go1.26.10
    defaults:
      run:
        working-directory: infra/certificate-trust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Race-test both runner shell discovery and WSS clients
        run: |
          go -C ../runner-image test -race -count=1 ./cmd/runner-shell-agent
          go -C ../linux-runner-image test -race -count=1 ./cmd/runner-shell-agent
      - name: Test policy evidence and public store contracts
        run: go test -count=1 ./...
      - name: Race-test cache-volume HTTPS clients and wire controls
        run: go -C ../linux-runner-image test -race -count=1 ./cmd/tuist-cache-volume
      - name: Check shell syntax
        run: bash -n pem-store.sh && bash -n java-store.sh && bash -n macos-guest-trust.sh
      - name: Qualify compiler distrust with retained runtime defaults
        run: |
          for baseline in go1.25 go1.23; do
            echo "Qualifying default=$baseline"
            go mod edit -godebug=default="$baseline"
            go run .
          done
      - name: Race-test standalone log shipper HTTPS clients and wire controls
        run: go -C ../macos-log-shipper test -race -count=1 ./...
      - name: Test static log shipper build configuration
        env:
          CGO_ENABLED: '0'
        run: go -C ../macos-log-shipper test -count=1 ./...
