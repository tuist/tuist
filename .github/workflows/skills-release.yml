name: Skills Release

# Releases the Tuist agent skills (published to tuist/agent-skills). Extracted
# from release.yml: the skills package is independent of the server, so it gets
# its own lane and is never queued behind a server deploy. Its skills@ tag +
# GitHub Release used to be created by release.yml's shared publish-releases
# job; that creation moved here so the tag still advances.

on:
  push:
    branches:
      - main
    paths:
      - skills/**
      - mise/tasks/release/components.json
      - .github/workflows/skills-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize skills publishing through one ref-independent group: it derives
  # the next version from the skills@ tag set and creates a tag, so two runs
  # must never overlap. Queue rather than cancel so an in-flight publish is
  # never torn.
  group: skills-release
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  check:
    name: Check for releasable changes
    if: github.repository == 'tuist/tuist'
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.check.outputs.skills-should-release }}
      next-version: ${{ steps.check.outputs.skills-next-version }}
      next-version-number: ${{ steps.check.outputs.skills-next-version-number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: check
        run: mise run --skip-tools release:check skills

  release:
    name: Release Skills
    needs: check
    if: needs.check.outputs.should-release == 'true'
    runs-on: tuist-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff 1password-cli"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Get release notes
        id: release-notes
        run: |
          # Get the latest skills version tag
          LATEST_VERSION=$(git tag -l | grep -E "^skills@[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST_VERSION" ]; then
            git cliff --include-path "skills/**/*" --config skills/cliff.toml --repository "." 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          else
            git cliff --include-path "skills/**/*" --config skills/cliff.toml --repository "." 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        working-directory: skills
        run: git cliff --include-path "skills/**/*" --config cliff.toml --repository "../" --tag "${{ needs.check.outputs.next-version }}" -o CHANGELOG.md 2>/dev/null

      # Writes only the four distribution repositories; the release below is
      # created in this repository with GITHUB_TOKEN.
      - id: app-token
        uses: ./.github/actions/github-app-token
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          repositories: agent-skills,agent-plugin,cursor-plugin,claude-plugin
          permission-contents: write

      - name: Push to tuist/agent-skills
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ needs.check.outputs.next-version-number }}"
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/tuist/agent-skills.git /tmp/agent-skills
          rm -rf /tmp/agent-skills/skills
          cp -r skills/skills /tmp/agent-skills/skills
          cd /tmp/agent-skills
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release ${VERSION}"
            git tag "${VERSION}"
            git push origin main --tags
          else
            echo "No changes to push"
          fi

      - name: Push to tuist/agent-plugin
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/tuist/agent-plugin.git /tmp/agent-plugin
          rm -rf /tmp/agent-plugin/skills
          cp -r skills/skills /tmp/agent-plugin/skills
          cd /tmp/agent-plugin
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync Tuist skills"
            git push origin main
          else
            echo "No changes to push"
          fi

      - name: Push to tuist/cursor-plugin
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/tuist/cursor-plugin.git /tmp/cursor-plugin
          rm -rf /tmp/cursor-plugin/plugins/tuist/skills
          cp -r skills/skills /tmp/cursor-plugin/plugins/tuist/skills
          cd /tmp/cursor-plugin
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync Tuist skills"
            git push origin main
          else
            echo "No changes to push"
          fi

      - name: Push to tuist/claude-plugin
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/tuist/claude-plugin.git /tmp/claude-plugin
          rm -rf /tmp/claude-plugin/plugins/tuist/skills
          cp -r skills/skills /tmp/claude-plugin/plugins/tuist/skills
          cd /tmp/claude-plugin
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync Tuist skills"
            git push origin main
          else
            echo "No changes to push"
          fi

      - name: Create Skills GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          repository: tuist/tuist
          target_commitish: ${{ github.sha }}
          name: Skills ${{ needs.check.outputs.next-version-number }}
          tag_name: ${{ needs.check.outputs.next-version }}
          body: |
            GitHub: https://github.com/tuist/agent-skills/releases/tag/${{ needs.check.outputs.next-version-number }}

            ${{ steps.release-notes.outputs.RELEASE_NOTES }}
