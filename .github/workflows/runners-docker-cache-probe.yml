name: Runners Docker cache probe

on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
      expected_linux_image:
        type: string
        default: ""
      runner_label:
        type: string
        default: tuist-canary-linux
      environment_name:
        type: string
        default: canary

permissions:
  contents: read

jobs:
  publication-window:
    name: Publication window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This is an allowance, not evidence of publication. The next job must
      # actually reuse the previous job's layers/mutable cache; it never retries
      # a failed assertion. Canary has one Linux host, so no WAN freshness claim.
      - if: inputs.phase != 'cold'
        run: sleep 120
  build:
    name: Build
    needs: publication-window
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/actions/setup-docker-builder
            .github/scripts/docker-build-cache-benchmark.sh
      - name: Require candidate runner and mounted cache
        env:
          EXPECTED_LINUX_IMAGE: ${{ inputs.expected_linux_image }}
          QUALIFICATION_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          if [ "${QUALIFICATION_ENVIRONMENT:-canary}" = production ]; then
            test "${GITHUB_RUN_ATTEMPT:-}" = 1 || {
              echo '::error::Start a fresh qualification run; retrying phases changes their shared experiment key.'
              exit 1
            }
            test -n "$EXPECTED_LINUX_IMAGE"
          fi
          if [ -n "$EXPECTED_LINUX_IMAGE" ]; then
            test "${TUIST_RUNNER_IMAGE:-}" = "$EXPECTED_LINUX_IMAGE" || {
              echo "::error::Acceptance ran on ${TUIST_RUNNER_IMAGE:-unknown}, expected $EXPECTED_LINUX_IMAGE"
              exit 1
            }
          fi
          if ! jq -e '.mounted == true' /home/runner/.tuist-docker.json; then
            echo '::error::Docker cache is not mounted; check pool provisioning, server authorization and the job-start hook.'
            # Only include the local outcome, never tokens or the full manifest.
            jq '{mounted, reason}' /home/runner/.tuist-docker.json || true
            exit 1
          fi
          echo "Runner image: ${TUIST_RUNNER_IMAGE:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Runner: %s\nPod: %s\nSource: %s\n' "${RUNNER_NAME:-unknown}" "${TUIST_CACHE_VOLUME_POD:-unknown}" "${GITHUB_SHA:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-docker-builder
        id: builder
        with:
          cache-key: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify both drivers
        env:
          CACHE_PHASE: ${{ inputs.phase }}
          CACHE_ENVIRONMENT: ${{ inputs.environment_name }}
          BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -euo pipefail
          # Both drivers share one published snapshot. Parallel seed jobs can
          # overwrite whole BuildKit databases, obscuring what this gate tests.
          for driver in docker docker-container; do
            export CACHE_DRIVER="$driver"
            export CACHE_EXPERIMENT="${CACHE_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$driver"
            export CACHE_BUILDER=default
            [ "$driver" != docker-container ] || export CACHE_BUILDER="$BUILDER"
            bash .github/scripts/docker-build-cache-benchmark.sh
            mv "$RUNNER_TEMP/docker-build-cache-results" "$RUNNER_TEMP/docker-cache-$driver"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.environment_name }}-docker-cache-${{ inputs.phase }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docker-cache-*
            ${{ runner.temp }}/docker-build-cache-results
