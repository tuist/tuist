name: Verify community notification setup

on:
  push:
    branches: [codex/community-slack-notifications]
    paths: [.github/workflows/community-notifications-setup.yml]

permissions: {}

jobs:
  verify:
    if: github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify stored membership token
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TUIST_APP_GITHUB_TOKEN }}
          script: |
            for (const team of ['company', 'external']) {
              const members = await github.paginate(github.rest.teams.listMembersInOrg, {
                org: 'tuist', team_slug: team, per_page: 100,
              });
              core.info(`Verified @tuist/${team}: ${members.length} members`);
            }
      - name: Send clearly marked setup test to support
        uses: slackapi/slack-github-action@v2
        with:
          errors: true
          webhook: ${{ secrets.COMMUNITY_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Setup test: community GitHub notifications are connected to #support. Staff-team lookups passed. Automatic notifications will begin after PR #13509 is merged."
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "Community notifications — setup test"
              - type: section
                text:
                  type: plain_text
                  text: "Delivery to #support and GitHub employee/contractor team lookups are working. New community issues and PRs will appear here after PR #13509 is merged. This is a setup test, not a new contribution."
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: View implementation PR
                    url: https://github.com/tuist/tuist/pull/13509
                    action_id: view_community_setup_pr
