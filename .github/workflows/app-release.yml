name: App Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "macOS-only hotfix: qualified full SHA of the merged stable release branch tip"
        required: true
        type: string
      stable_tag:
        description: "Exact macOS stable tag currently advertised by Sparkle (app@X.Y.Z)"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - app/**
      - mise/tasks/app/**
      - cli/Sources/TuistSupport/**
      - cli/Sources/TuistCore/**
      - cli/Sources/TuistServer/**
      - cli/Sources/TuistHTTP/**
      - cli/Sources/TuistAutomation/**
      - cli/Sources/TuistSimulator/**
      - cli/Sources/TuistAndroid/**
      - cli/Sources/TuistLogging/**
      - cli/Sources/XcodeGraph/**
      - cli/Sources/TuistConstants/**
      - cli/Sources/TuistEnvironment/**
      - cli/Sources/TuistConfig/**
      - cli/Sources/TuistAlert/**
      - cli/Sources/TuistThreadSafe/**
      - cli/Sources/TuistOpener/**
      - cli/Sources/TuistUniqueIDGenerator/**
      - cli/Sources/TuistNooraExtension/**

permissions:
  contents: write
  pull-requests: read
  statuses: write
  packages: write

concurrency:
  # Share the legacy main lock with older runs/reruns writing the same tags/feed.
  group: app-release-refs/heads/main
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  TUIST_ENABLE_CACHING: "true"
  MISE_GITHUB_ATTESTATIONS: 0

jobs:
  check-releases:
    name: Check for releasable changes
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      app-should-release: ${{ steps.hotfix.outputs.app-should-release || steps.check.outputs.app-should-release }}
      app-next-version: ${{ steps.hotfix.outputs.app-next-version || steps.check.outputs.app-next-version }}
      app-next-version-number: ${{ steps.hotfix.outputs.app-next-version-number || steps.check.outputs.app-next-version-number }}
      source-sha: ${{ steps.hotfix.outputs.source-sha || github.sha }}
      release-branch: ${{ steps.hotfix.outputs.release-branch }}
      build-number: ${{ steps.hotfix.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: check
        if: github.event_name == 'push'
        run: mise run --skip-tools release:check
      - id: hotfix
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          curl --fail --location --retry 3 -H 'Cache-Control: no-cache' \
            "https://github.com/tuist/tuist/releases/download/appcast/appcast.xml?run=${GITHUB_RUN_ID}" \
            -o "$RUNNER_TEMP/live-appcast.xml"
          python3 .github/scripts/app-hotfix-plan.py -- "$STABLE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/live-appcast.xml" >> "$GITHUB_OUTPUT"

  release-app:
    name: Release App
    needs: check-releases
    if: needs.check-releases.outputs.app-should-release == 'true'
    runs-on: tuist-macos-27-0
    timeout-minutes: 50
    permissions:
      contents: write
      id-token: write
      pull-requests: read
      statuses: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    outputs:
      artifacts-uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-releases.outputs.source-sha }}
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked tuist 1password-cli jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install dependencies
        run: tuist install --force-resolved-versions

      - name: Update version
        working-directory: app
        env:
          HOTFIX_BUILD_NUMBER: ${{ needs.check-releases.outputs.build-number }}
        run: |
          VERSION_NUMBER="${{ needs.check-releases.outputs.app-next-version }}"
          VERSION_NUMBER="${VERSION_NUMBER#app@}"
          sed -i '' -e "s/CFBundleShortVersionString.*/CFBundleShortVersionString\": \"$VERSION_NUMBER\",/g" "Project.swift"
          # Epoch seconds, not a run counter with an offset. The counter has reset
          # twice when the workflow was recreated, and a build number below the newest
          # appcast entry makes generate_appcast file the release as an old update:
          # it writes no entry and moves the DMG into old_updates, out from under the
          # artifact upload, so the release ships without its DMG (app@0.25.5).
          BUILD_NUMBER=${HOTFIX_BUILD_NUMBER:-$(date +%s)}
          sed -i '' -e "s/CFBundleVersion.*/CFBundleVersion\": \"${BUILD_NUMBER}\",/g" "Project.swift"

      - name: Bundle macOS app
        run: mise run --no-deps --skip-tools app:bundle
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Generate Sparkle appcast
        # generate_appcast mutates the directory it reads: archives it considers old
        # are moved into old_updates. Point it at a copy so that decision can never
        # remove the DMG the release is about to upload.
        run: |
          # A stable checkout contains an old snapshot, not necessarily the live feed.
          curl --fail --location --retry 3 -H 'Cache-Control: no-cache' \
            "https://github.com/tuist/tuist/releases/download/appcast/appcast.xml?run=${GITHUB_RUN_ID}" \
            -o app/appcast.xml
          mkdir -p app/build/appcast-input
          cp app/build/artifacts/Tuist.dmg app/build/appcast-input/
          op read "op://tuist/Tuist App Private Sparkle Key/credential" | .build/artifacts/sparkle-project.Sparkle/Sparkle/bin/generate_appcast --link https://github.com/tuist/tuist/releases --download-url-prefix https://github.com/tuist/tuist/releases/download/${{ needs.check-releases.outputs.app-next-version }}/Tuist.dmg -o app/appcast.xml app/build/appcast-input --ed-key-file -

      - name: Validate Sparkle appcast
        env:
          RELEASE_TAG: ${{ needs.check-releases.outputs.app-next-version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, xml.etree.ElementTree as ET
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          tag = os.environ['RELEASE_TAG']
          items = ET.parse('app/appcast.xml').getroot().findall('./channel/item')
          candidates = [item for item in items if item.findtext(ns + 'shortVersionString') == tag.removeprefix('app@')]
          assert len(candidates) == 1, 'Generated feed must advertise exactly one candidate'
          item = candidates[0]
          build = re.search(r'"CFBundleVersion": "([0-9]+)"', pathlib.Path('app/Project.swift').read_text()).group(1)
          assert item.findtext(ns + 'version') == build, 'Feed must match the packaged build'
          assert all(int(build) > int(other.findtext(ns + 'version')) for other in items if other is not item and other.findtext(ns + 'version', '').isdecimal()), 'Candidate must be newer than retained updates'
          version = tuple(map(int, tag.removeprefix('app@').split('.')))
          assert all(version > tuple(map(int, other.findtext(ns + 'shortVersionString').split('.'))) for other in items if other is not item), 'Candidate must not downgrade a newer live version'
          enclosure = item.find('enclosure')
          assert enclosure.get('url') == f'https://github.com/tuist/tuist/releases/download/{tag}/Tuist.dmg'
          assert int(enclosure.get('length')) == pathlib.Path('app/build/artifacts/Tuist.dmg').stat().st_size
          assert enclosure.get(ns + 'edSignature'), 'Missing Sparkle signature'
          PY

      - name: Upload App artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          if-no-files-found: error
          path: |
            app/Project.swift
            app/appcast.xml
            app/build/artifacts/Tuist.dmg
            app/build/artifacts/SHASUMS256.txt
            app/build/artifacts/SHASUMS512.txt
          retention-days: 7

  release-ios:
    name: Release iOS App
    needs: check-releases
    if: github.event_name == 'push' && needs.check-releases.outputs.app-should-release == 'true'
    runs-on: tuist-macos-27-0
    # Matches release-app. `app:upload-ios` archives before it uploads,
    # and `tuist generate` runs with --no-binary-cache, so a cold
    # compilation cache (any runner image roll invalidates it) makes
    # this a full build of the app. 30 minutes fit only while the
    # cache was warm; it cancelled mid-`xcodebuild` on run 31618151811.
    timeout-minutes: 50
    permissions:
      contents: write
      id-token: write
      pull-requests: read
      statuses: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked tuist 1password-cli"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Update version
        working-directory: app
        run: |
          VERSION_NUMBER="${{ needs.check-releases.outputs.app-next-version }}"
          VERSION_NUMBER="${VERSION_NUMBER#app@}"
          sed -i '' -e "s/CFBundleShortVersionString.*/CFBundleShortVersionString\": \"$VERSION_NUMBER\",/g" "Project.swift"
          # App Store Connect rejects a build number that does not exceed the ones
          # already uploaded for the version, so this cannot ride a run counter that
          # resets when the workflow is recreated.
          BUILD_NUMBER=$(date +%s)
          sed -i '' -e "s/CFBundleVersion.*/CFBundleVersion\": \"${BUILD_NUMBER}\",/g" "Project.swift"
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Generate TuistApp
        run: tuist generate TuistApp --no-binary-cache
      - name: Upload iOS App to App Store Connect
        run: mise run --no-deps --skip-tools app:upload-ios
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  release-android:
    name: Release Android App
    needs: check-releases
    if: github.event_name == 'push' && needs.check-releases.outputs.app-should-release == 'true'
    runs-on: tuist-linux
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: read
      statuses: write
      packages: write
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}

      - uses: ./.github/actions/mise
        with:
          install_args: "--locked java gradle 1password-cli tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Authenticate with Tuist
        working-directory: android
        run: tuist auth login

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Update version
        working-directory: android
        run: |
          VERSION_NUMBER="${{ needs.check-releases.outputs.app-next-version }}"
          VERSION_NUMBER="${VERSION_NUMBER#app@}"
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NUMBER\"/" app/build.gradle.kts

      - name: Setup signing and credentials
        run: |
          op document get "Google Play release.keystore binary" --vault tuist --out-file android/release.keystore
          op read "op://tuist/Google Play release.keystore/sirudpicoo6z2b3rmdtfhcj3aa" --out-file android/service-account.json

      - name: Publish to Google Play
        working-directory: android
        run: |
          export ANDROID_KEYSTORE_PASSWORD=$(op read "op://tuist/Google Play release.keystore/password")
          export ANDROID_KEY_ALIAS=tuist
          export ANDROID_KEY_PASSWORD=$(op read "op://tuist/Google Play release.keystore/password")
          ./gradlew publishReleaseBundle

  publish-app:
    name: Publish App release
    needs: [check-releases, release-app, release-ios, release-android]
    if: >-
      always() && !cancelled() && needs.check-releases.result == 'success' &&
      needs.check-releases.outputs.app-should-release == 'true' && needs.release-app.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.release-ios.result == 'success' && needs.release-android.result == 'success'))
    runs-on: tuist-linux
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check-releases.outputs.source-sha }}
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Get release notes
        id: release-notes
        working-directory: app
        env:
          HOTFIX_STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          # Get the latest app version tag
          LATEST_VERSION=${HOTFIX_STABLE_TAG:-$(git tag -l | grep -E "^app@[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)}

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST_VERSION" ]; then
            git cliff --include-path "app/**/*" --include-path "mise/tasks/app/**/*" --config cliff.toml --repository "../" 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          else
            git cliff --include-path "app/**/*" --include-path "mise/tasks/app/**/*" --config cliff.toml --repository "../" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download App artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-artifacts
          path: app
      - name: Verify downloaded checksums
        working-directory: app/build/artifacts
        run: |
          sha256sum --check SHASUMS256.txt
          sha512sum --check SHASUMS512.txt
      - name: Revalidate merged hotfix source and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ needs.check-releases.outputs.source-sha }}
          RELEASE_BRANCH: ${{ needs.check-releases.outputs.release-branch }}
          RELEASE_TAG: ${{ needs.check-releases.outputs.app-next-version }}
        run: |
          git fetch --no-tags origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          if [ "$(git rev-parse --verify "refs/remotes/origin/$RELEASE_BRANCH")" != "$SOURCE_SHA" ]; then
            echo "Stable release branch tip changed; qualify and plan its current merged tip."
            exit 1
          fi
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-app-tag"
          if [ -s "$RUNNER_TEMP/existing-app-tag" ]; then
            echo "Tag already exists; recover its original artifacts instead of replacing them."
            exit 1
          fi
      - name: Create App GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          repository: tuist/tuist
          # Override the action's github.token default for off-main release tags.
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
          # Pin the tag to the commit this run built (see cli-release.yml).
          target_commitish: ${{ needs.check-releases.outputs.source-sha }}
          name: App ${{ needs.check-releases.outputs.app-next-version-number }}
          tag_name: ${{ needs.check-releases.outputs.app-next-version }}
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          fail_on_unmatched_files: true
          files: |
            app/build/artifacts/SHASUMS256.txt
            app/build/artifacts/SHASUMS512.txt
            app/build/artifacts/Tuist.dmg
      - name: Publish Sparkle appcast feed
        # The Sparkle feed (app/appcast.xml, generated by release-app) is
        # served from a stable GitHub Release asset (tag `appcast`) that the
        # macOS app's SUFeedURL points at. softprops overwrites the
        # same-named asset on the `appcast` release each app release;
        # make_latest is off so this housekeeping release never shadows the
        # real "latest".
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: "false"
          repository: tuist/tuist
          name: Sparkle appcast feed
          tag_name: appcast
          body: |
            Sparkle auto-update feed for the Tuist macOS app. The asset on
            this release is the live feed (SUFeedURL); it is overwritten by
            the release pipeline on every app release. Not a product release.
          files: |
            app/appcast.xml
      - name: Trigger Homebrew Cask Update
        run: |
          SHA256=$(cat app/build/artifacts/SHASUMS256.txt | grep Tuist.dmg | awk '{print $1}')
          mise run --no-deps --skip-tools app:release:homebrew-cask --version "${{ needs.check-releases.outputs.app-next-version-number }}" --github-token "${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}" --sha256 "$SHA256"
