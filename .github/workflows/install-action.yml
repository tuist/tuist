name: Install Action

on:
  pull_request:
    paths:
      - .github/actions/install/**
      - .github/workflows/install-action.yml
      - ci/cache-volume/publish.sh
  push:
    branches: [main]
    paths:
      - .github/actions/install/**
      - .github/workflows/install-action.yml
      - ci/cache-volume/publish.sh
  workflow_dispatch:
    inputs:
      version:
        description: Stable standalone version to publish, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: install-action-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        hit: ['true', 'false']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/actions/install/action.test.mjs
      - name: Check shell scripts and distribution publication
        if: matrix.os == 'ubuntu-latest' && matrix.hit == 'true'
        run: |
          shellcheck .github/actions/install/prepare.sh .github/actions/install/install.sh .github/actions/install/scripts/package.sh
          bash ci/cache-volume/publish_test.sh
      - name: Prepare composite fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/install-test-bin" "$GITHUB_WORKSPACE/install-fixture/Tuist"
          echo '// swift-tools-version: 6.0' > install-fixture/Tuist/Package.swift
          echo '{"pins":[]}' > install-fixture/Tuist/Package.resolved
          cat > "$RUNNER_TEMP/install-test-bin/tuist-cache-volume" <<'CLIENT'
          #!/bin/bash
          set -eu
          [[ "$1" == --key && "$2" == install-action-test && "$3" == --path && "$4" == "$GITHUB_WORKSPACE/install-fixture/Tuist/.build" ]]
          mkdir -p "$4"
          printf 'cache-hit=%s\n' "$CLIENT_HIT" >> "$GITHUB_OUTPUT"
          CLIENT
          cat > "$RUNNER_TEMP/install-test-bin/tuist" <<'CLI'
          #!/bin/bash
          set -eu
          if [[ "$1" == version ]]; then echo 4.214.0-canary.36; exit; fi
          [[ "$*" == "install --path $GITHUB_WORKSPACE/install-fixture --force-resolved-versions --scratch-path $GITHUB_WORKSPACE/install-fixture/Tuist/.build --cache-path $GITHUB_WORKSPACE/install-fixture/Tuist/.build/dependency-cache --cached-directory-materialization=symlink" ]]
          [[ -d "$GITHUB_WORKSPACE/install-fixture/Tuist/.build" ]]
          touch "$RUNNER_TEMP/install-executed"
          CLI
          chmod +x "$RUNNER_TEMP/install-test-bin/"*
          echo "$RUNNER_TEMP/install-test-bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/install
        id: install
        env:
          CLIENT_HIT: ${{ matrix.hit }}
        with:
          path: install-fixture
          cache-key: install-action-test
      - name: Verify composite outputs and unconditional installation
        shell: bash
        env:
          CACHE_HIT: ${{ steps.install.outputs.cache-hit }}
          CACHE_PATH: ${{ steps.install.outputs.cache-path }}
          EXPECTED_HIT: ${{ matrix.hit }}
        run: |
          test "$CACHE_HIT" = "$EXPECTED_HIT"
          test "$CACHE_PATH" = "$GITHUB_WORKSPACE/install-fixture/Tuist/.build/dependency-cache"
          test -f "$RUNNER_TEMP/install-executed"
      - run: bash .github/actions/install/scripts/package.sh "$RUNNER_TEMP/install-action"
      - uses: actions/upload-artifact@v4
        with:
          name: install-action-${{ matrix.os }}-${{ matrix.hit }}
          path: ${{ runner.temp }}/install-action/

  release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tuist/install
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
          fetch-depth: 0
          path: distribution
      - run: bash .github/actions/install/scripts/package.sh "$RUNNER_TEMP/install-action"
      - name: Publish immutable version and major alias
        env:
          VERSION: ${{ inputs.version }}
        run: bash ci/cache-volume/publish.sh "$RUNNER_TEMP/install-action" distribution "$VERSION" "$GITHUB_SHA"
