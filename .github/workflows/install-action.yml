name: Install Action

on:
  pull_request:
    paths:
      - .github/actions/install/**
      - .github/workflows/install-action.yml
      - ci/cache-volume/publish.sh
      - mise/tasks/release/check.sh
      - mise/tasks/release/components.json
  push:
    branches: [main]
    paths:
      - .github/actions/install/**
      - .github/workflows/install-action.yml
      - ci/cache-volume/publish.sh
      - mise/tasks/release/check.sh
      - mise/tasks/release/components.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-action-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        hit: ['true', 'false']
        backend: [volume, github]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TEST_CACHE_KEY: install-action-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.hit }}
      EXPECTED_BACKEND: ${{ matrix.backend }}
      EXPECTED_MATERIALIZATION: ${{ matrix.backend == 'volume' && 'symlink' || 'copy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/actions/install/action.test.mjs
      - uses: ./.github/actions/mise
        if: matrix.os == 'ubuntu-latest' && matrix.hit == 'true' && matrix.backend == 'volume'
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
      - name: Check shell scripts and distribution publication
        if: matrix.os == 'ubuntu-latest' && matrix.hit == 'true' && matrix.backend == 'volume'
        run: |
          shellcheck .github/actions/install/prepare.sh .github/actions/install/install.sh .github/actions/install/scripts/*.sh
          bash ci/cache-volume/publish_test.sh
          bash .github/actions/install/scripts/release_test.sh
      - name: Prepare composite fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/install-test-bin" "$GITHUB_WORKSPACE/install-fixture/Tuist"
          echo '// swift-tools-version: 6.0' > install-fixture/Tuist/Package.swift
          echo '{"pins":[]}' > install-fixture/Tuist/Package.resolved
          cat > "$RUNNER_TEMP/install-test-bin/tuist-cache-volume" <<'CLIENT'
          #!/bin/bash
          set -eu
          [[ "$1" == --key && "$2" == "$TEST_CACHE_KEY" && "$3" == --path && "$4" == "$GITHUB_WORKSPACE/install-fixture/Tuist/.build" ]]
          mkdir -p "$4"
          printf 'cache-hit=%s\n' "$CLIENT_HIT" >> "$GITHUB_OUTPUT"
          CLIENT
          cat > "$RUNNER_TEMP/install-test-bin/tuist" <<'CLI'
          #!/bin/bash
          set -eu
          if [[ "$1" == version ]]; then echo 4.214.0-canary.36; exit; fi
          [[ "$*" == "install --path $GITHUB_WORKSPACE/install-fixture --force-resolved-versions --scratch-path $GITHUB_WORKSPACE/install-fixture/Tuist/.build --cache-path $GITHUB_WORKSPACE/install-fixture/Tuist/.build/dependency-cache --cached-directory-materialization=$EXPECTED_MATERIALIZATION" ]]
          if [[ "$EXPECTED_BACKEND" == volume ]]; then
            [[ -d "$GITHUB_WORKSPACE/install-fixture/Tuist/.build" ]]
          fi
          mkdir -p "$GITHUB_WORKSPACE/install-fixture/Tuist/.build"
          touch "$RUNNER_TEMP/install-executed"
          CLI
          if [[ "$EXPECTED_BACKEND" == github ]]; then
            rm "$RUNNER_TEMP/install-test-bin/tuist-cache-volume"
          fi
          chmod +x "$RUNNER_TEMP/install-test-bin/"*
          echo "$RUNNER_TEMP/install-test-bin" >> "$GITHUB_PATH"
      - name: Prepare a GitHub archive hit
        if: matrix.backend == 'github' && matrix.hit == 'true'
        id: archive-plan
        env:
          TUIST_INSTALL_PATH: install-fixture
          TUIST_INSTALL_CACHE_KEY: ${{ env.TEST_CACHE_KEY }}
        run: |
          bash .github/actions/install/prepare.sh
          mkdir -p install-fixture/Tuist/.build
          echo restored > install-fixture/Tuist/.build/archive-marker
      - uses: actions/cache/save@v4
        if: matrix.backend == 'github' && matrix.hit == 'true'
        with:
          path: ${{ steps.archive-plan.outputs.archive-path }}
          key: ${{ steps.archive-plan.outputs.archive-key }}
      - name: Remove the seeded fixture before restoring it
        if: matrix.backend == 'github' && matrix.hit == 'true'
        run: rm -r install-fixture/Tuist/.build
      - uses: ./.github/actions/install
        id: install
        env:
          CLIENT_HIT: ${{ matrix.hit }}
        with:
          path: install-fixture
          cache-key: ${{ env.TEST_CACHE_KEY }}
      - name: Verify composite outputs and unconditional installation
        shell: bash
        env:
          CACHE_HIT: ${{ steps.install.outputs.cache-hit }}
          CACHE_PATH: ${{ steps.install.outputs.cache-path }}
          CACHE_BACKEND: ${{ steps.install.outputs.cache-backend }}
          EXPECTED_HIT: ${{ matrix.hit }}
        run: |
          test "$CACHE_HIT" = "$EXPECTED_HIT"
          test "$CACHE_BACKEND" = "$EXPECTED_BACKEND"
          test "$CACHE_PATH" = "$GITHUB_WORKSPACE/install-fixture/Tuist/.build/dependency-cache"
          test -f "$RUNNER_TEMP/install-executed"
          if [[ "$EXPECTED_BACKEND" == github && "$EXPECTED_HIT" == true ]]; then
            test "$(cat install-fixture/Tuist/.build/archive-marker)" = restored
          fi
      - run: bash .github/actions/install/scripts/package.sh "$RUNNER_TEMP/install-action"
      - uses: actions/upload-artifact@v4
        with:
          name: install-action-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.hit }}
          path: ${{ runner.temp }}/install-action/

  release:
    if: github.event_name != 'pull_request' && github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
      - name: Reject stale release runs
        run: |
          latest=$(git tag -l 'install-action@*' --sort=-version:refname | head -n1)
          if [[ -n "$latest" ]]; then
            git merge-base --is-ancestor "$latest" HEAD
          fi
      - id: check
        run: mise run --skip-tools release:check install-action
      - name: Verify distribution credential access
        if: steps.check.outputs.install-action-should-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/tuist/install --jq '.permissions.push' | grep -qx true
      - uses: actions/checkout@v4
        if: steps.check.outputs.install-action-should-release == 'true'
        with:
          repository: tuist/install
          ref: main
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
          fetch-depth: 0
          path: distribution
      - name: Prepare or recover release
        id: prepare
        if: steps.check.outputs.install-action-should-release == 'true'
        env:
          VERSION: v${{ steps.check.outputs.install-action-next-version-number }}
        run: bash .github/actions/install/scripts/prepare-release.sh "$VERSION" distribution "$RUNNER_TEMP/install-action"
      - name: Publish immutable version and major alias
        if: steps.check.outputs.install-action-should-release == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ steps.prepare.outputs.source-commit }}
        run: bash ci/cache-volume/publish.sh "$RUNNER_TEMP/install-action" distribution "$VERSION" "$SOURCE_COMMIT"
      - name: Record release in the monorepo
        if: steps.check.outputs.install-action-should-release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          target_commitish: ${{ steps.prepare.outputs.source-commit }}
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Install Action ${{ steps.prepare.outputs.version }}
          body: |
            [Tuist install action](https://github.com/tuist/install/tree/${{ steps.prepare.outputs.version }}), published from ${{ steps.prepare.outputs.source-commit }}.

            The distribution includes an immutable version tag and a moving major alias.
      - name: Release changes queued behind recovery
        if: steps.prepare.outputs.source-commit != '' && steps.prepare.outputs.source-commit != github.sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run install-action.yml --ref main
