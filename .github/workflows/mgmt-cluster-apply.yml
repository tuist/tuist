name: Mgmt Cluster Apply

# Auto-applies CAPI manifests (ClusterClass + per-env Cluster CRs) and
# mgmt-cluster workloads (etcd-snapshot CronJob, Tailscale daemon) to
# our self-hosted CAPI mgmt cluster on push to main when the relevant
# paths change. The `hetzner` and `talos` jobs also reconcile the mgmt
# control-plane nodes: their Hetzner servers and resources, joining new
# nodes, and Talos machine config patches (infra/k8s/mgmt/talos/README.md).
#
# Why a workflow instead of Argo CD / Flux: the mgmt cluster has a tiny
# manifest surface (one ClusterClass, four Cluster CRs, and a few mgmt-side
# workloads) — drift detection / continuous reconciliation provided by
# a long-running GitOps controller is overkill at this scale. A
# push-driven CI apply gets us GitOps-style "the repo is the source of
# truth" without the operational overhead of running another controller.
# We can graduate to Argo CD later if the mgmt-cluster surface grows.
#
# Order matters: the ClusterClass is applied before the Cluster CRs
# because the topology controller resolves `topology.classRef.name`
# at admission time. Mgmt-side workloads (etcd-snapshot, tailscale)
# are independent and applied last.
#
# Known limitation: KubeadmControlPlaneTemplate spec is immutable.
# When the ClusterClass changes anything in the KCT, kubectl apply
# fails with "field is immutable, please create new resource instead".
# This workflow surfaces that as a failure — operator must
# `kubectl delete kubeadmcontrolplanetemplate tuist-hcloud-control-plane`
# manually, then re-run this workflow. Intentional: that operation
# also requires deleting + recreating each Cluster CR, which is too
# destructive to automate.
#
# Required secrets (on the mgmt-cluster-apply GitHub Environment):
#   OP_SERVICE_ACCOUNT_TOKEN - 1Password SA scoped read-only to the
#     tuist-k8s-mgmt vault, where the mgmt cluster's kubeconfig is
#     stored as `kubeconfig: tuist-mgmt`.
#
# Required secrets (on the mgmt-hetzner GitHub Environment, used by the
# `hetzner` job only):
#   OP_SERVICE_ACCOUNT_TOKEN - 1Password SA scoped read-only to the
#     tuist-k8s-mgmt-hetzner vault, which holds `hetzner-tuist-mgmt`, the
#     Hetzner Cloud API token for project tuist-mgmt. Nothing else reads
#     that vault, including External Secrets on the mgmt cluster.
#
# Both environments should allow only the main branch; the jobs also
# check `github.ref`, so a workflow_dispatch from another branch applies
# nothing.

on:
  push:
    # Main-only — every other deploy workflow in the repo holds this
    # posture so a feature branch never mutates production state.
    branches: [main]
    paths:
      - 'infra/k8s/clusters/**'
      - 'infra/k8s/mgmt/cluster-autoscaler.yaml'
      - 'infra/k8s/mgmt/etcd-snapshot.yaml'
      - 'infra/k8s/mgmt/capi-webhook-cert-reloader.yaml'
      - 'infra/k8s/mgmt/tailscale.yaml'
      - 'infra/k8s/mgmt/hetzner-robot-controller.yaml'
      - 'infra/k8s/mgmt/observability-namespace.yaml'
      - 'infra/k8s/mgmt/controller-replicas.yaml'
      - 'infra/k8s/mgmt/controller-pdbs.yaml'
      - 'infra/k8s/mgmt/external-secrets-values.yaml'
      - 'infra/k8s/mgmt/talos/hetzner.yaml'
      - 'infra/k8s/mgmt/talos/patches/**'
      - 'infra/k8s/mgmt/talos-patcher.yaml'
      - 'infra/mise/tasks/mgmt/**'
      - 'infra/helm/k8s-monitoring/**'
      - '.github/workflows/mgmt-cluster-apply.yml'
  # Access-path replacements require a qualified manual run.
  workflow_dispatch:
    inputs:
      management_access_qualified:
        description: Independent access, per-node Tailscale identity/KubePrism and patched rollback were qualified
        type: boolean
        default: false
      reset_pulse:
        description: Delete management's Pulse release, its node data and its S3 prefix, then wait for Flux to reinstall it from empty. Loses all of its history.
        type: boolean
        default: false

# Serialize: don't let two pushes apply concurrently and race.
concurrency:
  group: mgmt-cluster-apply
  cancel-in-progress: false

permissions: {}

jobs:
  hetzner:
    name: Hetzner resources
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A separate environment and vault from the kubectl job: the Hetzner
    # token can snapshot, rescue or rebuild the mgmt server outside
    # Kubernetes, so only this job may read it. `op run` hands it to the
    # one command that needs it instead of exporting it to the job.
    environment:
      name: mgmt-hetzner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked hcloud jq yq"
          cache: "false"
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
      - name: Planned changes
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HCLOUD_TOKEN: op://tuist-k8s-mgmt-hetzner/hetzner-tuist-mgmt/credential
        run: op run -- infra/mise/tasks/mgmt/reconcile-hetzner.sh
      - name: Apply
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HCLOUD_TOKEN: op://tuist-k8s-mgmt-hetzner/hetzner-tuist-mgmt/credential
        run: op run -- infra/mise/tasks/mgmt/reconcile-hetzner.sh --apply

  talos:
    name: Talos patches
    # Joining needs the servers the Hetzner job creates, and patches can
    # depend on Hetzner resources (a node's private network interface), so
    # this job runs only after that one succeeded.
    needs: hetzner
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    # Joins the control-plane nodes in infra/k8s/mgmt/talos/hetzner.yaml
    # that are not in the cluster yet, then applies
    # infra/k8s/mgmt/talos/patches/ to every control-plane node, through
    # Jobs inside the mgmt cluster that call the Talos API with a credential
    # Talos mints for namespace mgmt-talos. The Talos API itself stays
    # tailnet-only. A patch that changes the API server restarts it, so the
    # kubectl job waits for this one.
    runs-on: ubuntu-latest
    environment:
      name: mgmt-cluster-apply
    timeout-minutes: 90
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked kubectl jq yq"
          cache: "false"
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
      - name: Load mgmt kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-mgmt" --vault tuist-k8s-mgmt --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Planned changes
        run: infra/mise/tasks/mgmt/reconcile-talos.sh
      - name: Apply
        run: infra/mise/tasks/mgmt/reconcile-talos.sh --apply

  apply:
    name: kubectl apply
    needs: talos
    # Runs after the Talos job whatever its result, never alongside it.
    if: ${{ !cancelled() && github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main' }}
    # The self-hosted tuist-linux runners are customer runner Pods
    # governed by a NetworkPolicy that only allows public egress on
    # ports 80/443. The mgmt apiserver is reached on 6443, so this
    # deploy job needs a GitHub-hosted runner outside that policy.
    runs-on: ubuntu-latest
    environment:
      name: mgmt-cluster-apply
    # `kubectl diff` can be slow against the Cluster API CRDs when many
    # Machines are changing, so leave enough room for the visibility step.
    # Backup verification can wait up to ten minutes per control-plane node.
    timeout-minutes: 65
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked go helm kubectl jq yq"
          cache: "false"
      - name: Check ClusterClass patches keep each other's API server flags and volumes
        # Several opt-in features rewrite the whole apiServer extraArgs or
        # extraVolumes array, so a later patch can silently drop an earlier
        # one's entries and roll every control plane without it. Runs before
        # any credential is loaded or anything is applied.
        run: bash infra/mise/tasks/k8s/lint-clusterclass-patches.sh
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
      - name: Load mgmt kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-mgmt" --vault tuist-k8s-mgmt --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Guard management Tailscale DaemonSet replacement
        id: tailscale
        env:
          ACCESS_QUALIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.management_access_qualified }}
        run: |
          flags=()
          if [[ "$ACCESS_QUALIFIED" == true ]]; then
            flags+=(--acknowledged)
          fi
          status=0
          bash infra/certificate-trust/guard.sh management-tailscale "${flags[@]}" || status=$?
          case "$status" in
            0) echo "apply=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "apply=false" >> "$GITHUB_OUTPUT"
              message="Management Tailscale replacement deferred pending qualification; unrelated management resources will still reconcile. See infra/certificate-trust/management-replacements.md."
              echo "::warning::$message"
              printf '### Management Tailscale replacement deferred\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      - name: Diff (visibility into what's about to change)
        # `kubectl diff` exits non-zero when there's a diff, which is
        # the expected case here, so don't fail the step on that.
        # The actual gate is the apply step below.
        continue-on-error: true
        run: |
          set +e
          echo "::group::ClusterClass diff"
          kubectl diff -f infra/k8s/clusters/clusterclass-tuist.yaml || true
          echo "::endgroup::"
          for f in infra/k8s/clusters/bare-metal*.yaml; do
            [ -e "$f" ] || continue
            echo "::group::$(basename "$f") diff"
            kubectl diff -f "$f" || true
            echo "::endgroup::"
          done
          for f in infra/k8s/clusters/cluster-*.yaml; do
            [ -e "$f" ] || continue
            echo "::group::$(basename "$f") diff"
            kubectl diff -f "$f" || true
            echo "::endgroup::"
          done
          echo "::group::etcd-snapshot.yaml diff"
          kubectl diff -f infra/k8s/mgmt/etcd-snapshot.yaml || true
          echo "::endgroup::"
          echo "::group::tailscale.yaml diff"
          kubectl diff -f infra/k8s/mgmt/tailscale.yaml || true
          echo "::endgroup::"
          echo "::group::hetzner-robot-controller.yaml diff"
          kubectl diff -f infra/k8s/mgmt/hetzner-robot-controller.yaml || true
          echo "::endgroup::"
          echo "::group::cluster-autoscaler.yaml diff"
          kubectl diff -f infra/k8s/mgmt/cluster-autoscaler.yaml || true
          echo "::endgroup::"
          echo "::group::observability-namespace.yaml diff"
          kubectl diff -f infra/k8s/mgmt/observability-namespace.yaml || true
          echo "::endgroup::"
          echo "::group::machinedrainrules.yaml diff"
          kubectl diff -f infra/k8s/clusters/machinedrainrules.yaml || true
          echo "::endgroup::"
      - name: Apply runner drain rules before anything can roll Machines
        # Ordered ahead of the ClusterClass on purpose. The ClusterClass
        # carries the bare-metal rollout strategy, and applying it can
        # start a Machine replacement; without the drain rule already in
        # place that replacement evicts runner Pods and kills in-flight
        # CI jobs.
        run: |
          kubectl apply -f infra/k8s/clusters/machinedrainrules.yaml
      - name: Apply ClusterClass (Cluster CRs reference it)
        run: |
          kubectl apply -f infra/k8s/clusters/clusterclass-tuist.yaml
      - name: Apply bare-metal substrate
        # HetznerBareMetalMachineTemplate + KubeadmConfigTemplate
        # for the shared `bare-metal-worker` MachineDeployment class.
        # Per-cluster HBM claim scoping is via the `bareMetalCluster`
        # ClusterClass variable + the patch in `clusterclass-tuist.yaml`,
        # not by duplicating substrate per env. Applied
        # between ClusterClass and Cluster CRs so the MD-claimed
        # templates exist by the time the topology controller starts
        # reconciling worker Machines.
        #
        # HetznerBareMetalMachineTemplate's spec is immutable by CAPI
        # convention (every infrastructure template across providers
        # works this way — the spec is a definitional snapshot that
        # gets cloned by reference at Machine creation, not mutated in
        # place). When the PR changes the template, plain `kubectl
        # apply` fails with `Invalid value: ... is immutable`. Fall
        # back to delete + apply, which is safe because:
        # (a) deleting an unreferenced template is a no-op for caph
        # (b) existing Machines hold a snapshot of the template's
        #     spec in their own object and aren't affected by the
        #     template going away.
        run: |
          set -o pipefail
          for f in infra/k8s/clusters/bare-metal*.yaml; do
            [ -e "$f" ] || continue
            echo "==> $f"
            if ! kubectl apply -f "$f" 2>&1 | tee /tmp/apply.out; then
              if grep -q 'is immutable' /tmp/apply.out; then
                echo "Immutable spec detected, retrying as delete + apply..."
                kubectl delete -f "$f" --ignore-not-found --wait=true
                kubectl apply -f "$f"
              else
                exit 1
              fi
            fi
          done
      - name: Apply per-env Cluster CRs
        run: |
          for f in infra/k8s/clusters/cluster-*.yaml; do
            [ -e "$f" ] || continue
            echo "==> $f"
            kubectl apply -f "$f"
          done
      - name: Apply mgmt-side workloads
        # These are mgmt-cluster Deployments / CronJobs, not Cluster
        # CRs. Independent of the CAPI manifests above.
        run: |
          kubectl apply -f infra/k8s/mgmt/observability-namespace.yaml
          kubectl apply -f infra/k8s/mgmt/hetzner-robot-controller.yaml
          kubectl apply -f infra/k8s/mgmt/cluster-autoscaler.yaml
          kubectl apply -f infra/k8s/mgmt/etcd-snapshot.yaml
          kubectl apply -f infra/k8s/mgmt/capi-webhook-cert-reloader.yaml
          # Owns only replicas and pod anti-affinity on Deployments that
          # clusterctl installed; see the file header.
          kubectl apply --server-side --field-manager=mgmt-cluster-apply \
            --force-conflicts -f infra/k8s/mgmt/controller-replicas.yaml

          # Retired autoscalers: the regional clusters are gone and staging has
          # no autoscaled node group. kubectl apply does not remove resources
          # that disappear from a manifest.
          kubectl -n org-tuist delete deployment \
            cluster-autoscaler-tuist-kura-us-east \
            cluster-autoscaler-tuist-kura-us-west \
            cluster-autoscaler-tuist-staging \
            --ignore-not-found
      - name: Apply management Tailscale workload
        if: steps.tailscale.outputs.apply == 'true'
        run: |
          # The legacy migration also replaces access, so defer both operations.
          infra/mise/tasks/mgmt/migrate-tailscale.sh
          kubectl apply -f infra/k8s/mgmt/tailscale.yaml
      - name: Install External Secrets
        run: |
          set -euo pipefail
          helm upgrade --install external-secrets external-secrets \
            --repo https://charts.external-secrets.io --version 2.3.0 \
            --namespace external-secrets \
            -f infra/k8s/mgmt/external-secrets-values.yaml \
            --atomic --cleanup-on-fail --wait --timeout 10m
      - name: Protect admission webhooks during node maintenance
        run: |
          kubectl apply -f infra/k8s/mgmt/controller-pdbs.yaml
      - name: Verify etcd snapshots from every control-plane node
        run: infra/mise/tasks/mgmt/verify-etcd-snapshot.sh
      - name: Remove the legacy Elixir Pulse release
        run: |
          set -euo pipefail
          # Flux pruned its Kustomization (flux/pulse-management) but not the
          # release. If Flux's `pulse` HelmRelease got there first it upgraded
          # that release in place to chart tuist-pulse; otherwise remove it here
          # and Flux installs cleanly.
          chart=$(helm status pulse -n observability -o json 2>/dev/null | jq -r '.chart.metadata.name // empty') || chart=
          if [[ "$chart" == pulse ]]; then
            helm uninstall pulse -n observability --wait --timeout 5m
            echo 'Uninstalled the legacy Elixir Pulse release.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          kubectl -n flux-system delete --ignore-not-found \
            helmreleases.helm.toolkit.fluxcd.io/pulse-management helmrepositories.source.toolkit.fluxcd.io/pulse
          [[ -z "$(kubectl -n observability get deployment pulse --ignore-not-found -o name)" ]]
      - name: Bootstrap Pulse pilot authentication without rotating it
        run: |
          set -euo pipefail
          # Pulse (flux/pulse) mounts pulse-auth, its in-cluster admin login,
          # which no vault holds; its pod waits for this Secret on first install.
          umask 077
          passwd="$RUNNER_TEMP/pulse-passwd"
          trap 'rm -f "$passwd" "$passwd.log"' EXIT
          printf 'pilot=%s\n' "$(openssl rand -hex 32)" > "$passwd"
          if ! kubectl -n observability create secret generic pulse-auth --from-file=passwd="$passwd" > "$passwd.log" 2>&1; then
            grep -q 'secrets "pulse-auth" already exists' "$passwd.log"
          fi
      # Dispatch only. Pulse fixes its on-disk names when it creates them, so
      # moving to renamed releases means starting from empty. Requires the
      # pulse HelmRelease to be suspended in git (infra/flux/pulse), so Flux
      # neither upgrades the old data in place nor reinstalls mid-wipe.
      - name: Reset management Pulse to empty
        if: github.event_name == 'workflow_dispatch' && inputs.reset_pulse
        env:
          AWS_CLI_IMAGE: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
        run: |
          set -euo pipefail
          if [[ "$(kubectl -n flux-system get helmreleases.helm.toolkit.fluxcd.io pulse -o jsonpath='{.spec.suspend}')" != true ]]; then
            echo '::error::Suspend the pulse HelmRelease in infra/flux/pulse before resetting it.'
            exit 1
          fi
          trap 'kubectl -n observability delete pod pulse-reset --ignore-not-found --wait=true --timeout=60s > /dev/null || true
            kubectl -n observability delete externalsecret pulse-reset --ignore-not-found --wait=true --timeout=60s > /dev/null || true' EXIT
          kubectl -n observability delete pod pulse-reset --ignore-not-found --wait=true --timeout=60s > /dev/null
          # The wipe needs the release's S3 key. Its references come from the
          # rendered chart, since the release's ExternalSecret goes with it.
          if [[ -z "$(kubectl -n observability get externalsecret pulse-reset --ignore-not-found -o name)" ]]; then
            helm template pulse infra/helm/pulse -n observability \
              -f infra/helm/pulse/values.yaml -f infra/helm/pulse/values-management.yaml |
              yq -o json 'select(.kind == "ExternalSecret" and .metadata.name == "pulse-credentials")' | jq -se '
              select(length == 1) | .[0] |
              select([.spec.data[].secretKey] == ["accessKey", "secretKey"]) |
              {apiVersion, kind, metadata:{name:"pulse-reset", namespace:"observability"}, spec:{
                refreshInterval:"0", secretStoreRef:.spec.secretStoreRef, data:.spec.data,
                target:{name:"pulse-reset", creationPolicy:"Owner", template:{engineVersion:"v2", data:{
                  AWS_ACCESS_KEY_ID:"{{ .accessKey | trim }}", AWS_SECRET_ACCESS_KEY:"{{ .secretKey | trim }}"}}}}}
            ' | kubectl create -f - > /dev/null
          fi
          kubectl -n observability wait --for=condition=Ready externalsecret/pulse-reset --timeout=60s
          helm uninstall pulse -n observability --ignore-not-found --wait --timeout 10m
          # Same node and path as values-management.yaml; management/ is the
          # only prefix this key can reach in production's bucket.
          jq -n --arg image "$AWS_CLI_IMAGE" '
            {apiVersion:"v1",kind:"Pod",metadata:{name:"pulse-reset",namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:1800,automountServiceAccountToken:false,
              nodeSelector:{"kubernetes.io/hostname":"tuist-mgmt"},
              tolerations:[{key:"node-role.kubernetes.io/control-plane",operator:"Exists",effect:"NoSchedule"}],
              volumes:[{name:"data",hostPath:{path:"/var/lib/tuist-pulse",type:"DirectoryOrCreate"}},
                {name:"scratch",emptyDir:{sizeLimit:"64Mi"}}],
              containers:[{name:"reset",image:$image,command:["sh","-ec",
                ("rm -rf /data/* /data/.[!.]* /data/..?*\n" +
                 "test -z \"$(ls -A /data)\"\n" +
                 "aws s3 rm s3://tuist-pulso-production/management/ --recursive --only-show-errors\n" +
                 "left=$(aws s3 ls s3://tuist-pulso-production/management/ --recursive | head -n 1)\n" +
                 "test -z \"$left\"\n" +
                 "echo PASS: emptied /var/lib/tuist-pulse and s3://tuist-pulso-production/management/")],
                securityContext:{runAsUser:0,allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"],add:["DAC_OVERRIDE","FOWNER"]}},
                volumeMounts:[{name:"data",mountPath:"/data"},{name:"scratch",mountPath:"/tmp"}],
                resources:{requests:{cpu:"100m",memory:"128Mi"},limits:{memory:"256Mi"}},
                envFrom:[{secretRef:{name:"pulse-reset"}}],
                env:[{name:"HOME",value:"/tmp"},{name:"AWS_REGION",value:"auto"},
                  {name:"AWS_ENDPOINT_URL",value:"https://t3.storage.dev"}]
              }]}}' | kubectl create -f - > /dev/null
          deadline=$((SECONDS + 1800))
          phase=Pending
          while ((SECONDS < deadline)); do
            phase=$(kubectl --request-timeout=10s -n observability get pod pulse-reset -o jsonpath='{.status.phase}')
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 10
          done
          kubectl -n observability logs pulse-reset | tail -n 20 || true
          [[ "$phase" == Succeeded ]]
          echo 'Reset management Pulse: release, node data and s3://tuist-pulso-production/management/ removed. Unsuspend infra/flux/pulse to reinstall it.' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for Flux to reinstall management Pulse
        if: github.event_name == 'workflow_dispatch' && inputs.reset_pulse
        run: |
          set -euo pipefail
          image="$(sed -n 's/^image: //p' infra/helm/pulse/values.yaml)"
          deadline=$((SECONDS + 1800))
          until [[ "$(kubectl -n observability get statefulset pulse --ignore-not-found -o jsonpath='{.spec.template.spec.containers[0].image}')" == "$image" ]]; do
            if ((SECONDS >= deadline)); then
              echo '::error::Flux did not reinstall Pulse; is the HelmRelease still suspended in git?'
              exit 1
            fi
            sleep 20
          done
          kubectl -n observability rollout status statefulset/pulse --timeout=15m
          kubectl -n flux-system wait --for=condition=Ready helmreleases.helm.toolkit.fluxcd.io/pulse --timeout=15m
          echo "Flux reinstalled management Pulse on $image." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install management-cluster monitoring
        run: |
          set -euo pipefail
          # The collectors write to management's Pulse, and Alloy fails its
          # whole config load when a referenced Secret is missing. Flux's pulse
          # release owns that login; check its ExternalSecret, never the Secret.
          kubectl -n observability get externalsecret pulse-dashboard-auth -o json | jq -e '
            (.spec.target.template.data | has("ingest-username") and has("ingest-password")) and
            any(.status.conditions[]?; .type == "Ready" and .status == "True")' > /dev/null || {
            echo "::error::Management collectors write to Pulse, but its ingest login (pulse-dashboard-auth) is not ready; check infra/flux/pulse."
            exit 1
          }

          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm dependency build infra/helm/k8s-monitoring
          helm upgrade --install k8s-monitoring infra/helm/k8s-monitoring \
            --namespace observability \
            -f infra/helm/k8s-monitoring/values-management.yaml \
            --atomic --cleanup-on-fail --wait --timeout 10m
      - name: Verify converged management state
        env:
          APPLY_TAILSCALE: ${{ steps.tailscale.outputs.apply }}
        run: |
          set -euo pipefail

          release_status="$(helm -n observability status k8s-monitoring -o json | jq -r '.info.status')"
          if [ "$release_status" != "deployed" ]; then
            echo "::error::The management monitoring release is $release_status"
            exit 1
          fi

          kubectl -n observability rollout status deployment/k8s-monitoring-alloy-operator --timeout=2m
          kubectl -n observability rollout status deployment/k8s-monitoring-kube-state-metrics --timeout=2m
          kubectl -n observability wait --for=create daemonset/k8s-monitoring-alloy-control-plane --timeout=2m
          kubectl -n observability wait --for=create daemonset/k8s-monitoring-alloy-metrics --timeout=2m
          kubectl -n observability rollout status daemonset/k8s-monitoring-alloy-control-plane --timeout=2m
          kubectl -n observability rollout status daemonset/k8s-monitoring-alloy-metrics --timeout=2m
          kubectl -n observability rollout status daemonset/k8s-monitoring-node-exporter --timeout=2m

          port_forward_log="$(mktemp)"
          kubectl -n observability port-forward \
            daemonset/k8s-monitoring-alloy-metrics 12345:12345 \
            >"$port_forward_log" 2>&1 &
          port_forward_pid=$!
          cleanup_port_forward() {
            kill "$port_forward_pid" >/dev/null 2>&1 || true
            wait "$port_forward_pid" 2>/dev/null || true
            rm -f "$port_forward_log"
          }
          trap cleanup_port_forward EXIT

          # Read the Pulse writer's queue by its component ID.
          sent_timestamp() {
            curl -fsS http://127.0.0.1:12345/metrics 2>/dev/null |
              awk -v id="component_id=\"prometheus.remote_write.$1\"" \
                'index($0, "prometheus_remote_storage_queue_highest_sent_timestamp_seconds{") == 1 && index($0, id) { print $NF; exit }' ||
              true
          }
          remote_write_ready=false
          for _ in $(seq 1 30); do
            latest_sent_timestamp="$(sent_timestamp pulse_metrics)"
            if [ -n "$latest_sent_timestamp" ] &&
              awk -v sent="$latest_sent_timestamp" -v now="$(date +%s)" \
                'BEGIN { exit !(sent >= now - 120) }'; then
              remote_write_ready=true
              break
            fi
            sleep 5
          done

          if [ "$remote_write_ready" != "true" ]; then
            echo "::error::Management metrics have not been delivered to Pulse in the last two minutes"
            cat "$port_forward_log"
            exit 1
          fi
          cleanup_port_forward
          trap - EXIT

          for deployment in \
            cluster-autoscaler-tuist-kura-us-east \
            cluster-autoscaler-tuist-kura-us-west \
            cluster-autoscaler-tuist-staging; do
            if kubectl -n org-tuist get deployment "$deployment" >/dev/null 2>&1; then
              echo "::error::Retired cluster autoscaler $deployment still exists"
              exit 1
            fi
          done

          assert_no_drift() {
            local diff_output
            local diff_status
            local manifest="$1"

            set +e
            diff_output="$(kubectl diff -f "$manifest" 2>&1)"
            diff_status=$?
            set -e

            case "$diff_status" in
              0)
                return 0
                ;;
              1)
                printf '%s\n' "$diff_output"
                echo "::error::Declarative drift remains for $manifest"
                return 1
                ;;
              *)
                printf '%s\n' "$diff_output"
                echo "::error::Unable to compare live state with $manifest (kubectl exit $diff_status)"
                return "$diff_status"
                ;;
            esac
          }

          assert_no_drift infra/k8s/clusters/machinedrainrules.yaml
          assert_no_drift infra/k8s/clusters/clusterclass-tuist.yaml
          for f in infra/k8s/clusters/bare-metal*.yaml; do
            [ -e "$f" ] || continue
            assert_no_drift "$f"
          done
          for f in infra/k8s/clusters/cluster-*.yaml; do
            [ -e "$f" ] || continue
            assert_no_drift "$f"
          done
          assert_no_drift infra/k8s/mgmt/hetzner-robot-controller.yaml
          assert_no_drift infra/k8s/mgmt/cluster-autoscaler.yaml
          assert_no_drift infra/k8s/mgmt/etcd-snapshot.yaml
          if [[ "$APPLY_TAILSCALE" == true ]]; then
            assert_no_drift infra/k8s/mgmt/tailscale.yaml
          fi
          assert_no_drift infra/k8s/mgmt/observability-namespace.yaml
