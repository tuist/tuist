name: tuist/tuist Tests

# Every `tuist test` run of the tuist/tuist project (the CLI and the app), with
# the binary-cache warm they read and the signal that a commit's coverage is
# complete. Builds, lint and the Linux suite stay in cli.yml and app.yml.
#
# Coverage is on for every run: Tuist.swift's `coverage` option makes
# every job read the binary cache's coverage variant, whose binaries carry coverage counters,
# and the schemes that leave their test action's coverage unset collect it,
# TuistAcceptanceTests included.
#
# - Pull requests: unit, app and acceptance tests run selectively, and once
#   they have finished, whatever their result, `tuist coverage complete` marks
#   the run's commit complete. The server carries the targets selective testing
#   skipped from an earlier run that recorded evidence under the same hash: main's
#   full runs or the pull request's earlier ones (all record per-target
#   coverage evidence). A new push cancels the run in progress, so a superseded
#   commit is never signalled.
# - Pushes to main: unit, app and acceptance tests run selectively, like a
#   pull request, against the nightly full run's checkpoint. `tuist cache`
#   warms the coverage variant first, then the unit and app tests run against
#   that warm, and `tuist coverage complete` follows when both passed and
#   acceptance, which runs alongside the warm, has reported. A run in progress
#   finishes, and only the newest push waits behind it: the pushes in between
#   are never run, and their changes are in the next run's diff.
# - Nightly, off the macOS peak: every test of main's head runs in full
#   (`--no-selective-testing`), so coverage-based selection has a checkpoint
#   at most a day old. The full runs hold two macOS runners for up to two hours.
#
# Nothing in a deploy or release waits on this workflow. The checkout is the
# default one, so every job resolves the same commit: on main the pushed commit,
# on a pull request the run's merge commit (GITHUB_SHA), since the depth-1
# checkout hides its parents and the CLI can't read the head from HEAD^2.
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      # cas-plugin (the Xcode CAS dylib + tuist-cas-proxy) is built and shipped
      # inside the CLI, so its changes must run CLI tests and acceptance.
      - "cas-plugin/**"
      # SwifterPMCore is compiled into the command-line binary through
      # TuistSupport, so its changes must run the command-line test suite.
      - "swifterpm/**"
      # XCResultParser lives with the server's xcresult NIF but is built into
      # the command-line binary from those sources, so its changes must run the
      # command-line test suite.
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "app/**"
      - "*.swift"
      - ".github/workflows/tuist-project-tests.yml"
      - ".github/scripts/tuist-project-tests.test.cjs"
      - "mise/tasks/cli/ee.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      - "cas-plugin/**"
      - "swifterpm/**"
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "app/**"
      - "*.swift"
      - ".github/workflows/tuist-project-tests.yml"
      - ".github/scripts/tuist-project-tests.test.cjs"
      - "mise/tasks/cli/ee.sh"
      - "mise.toml"
      - "mise.lock"
      - "examples/xcode/**"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ github.token }}
  TUIST_ENABLE_CACHING: ${{ github.event.pull_request.head.repo.fork != true }}
  # Forks don't authenticate, so their coverage could never be uploaded; this
  # skips the export too. Any value overrides Tuist.swift, and an empty one reads
  # as off, so non-fork runs set '1' (the default).
  TUIST_COVERAGE_UPLOAD: ${{ github.event.pull_request.head.repo.fork == true && '0' || '1' }}
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1
  TUIST_DEV_INSTANCE: "1"

concurrency:
  group: tuist-project-tests-${{ github.head_ref || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance-scope:
    name: Check CLI acceptance scope
    runs-on: tuist-linux
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # This job needs no enterprise-source or tool-install credentials.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MISE_GITHUB_TOKEN: ""
      TUIST_GITHUB_TOKEN: ""
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test .github/scripts/tuist-project-tests.test.cjs
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            // Main keeps its full coverage baseline. Only a complete,
            // unchanged PR diff containing translations may skip acceptance.
            let required = true;
            if (context.eventName === 'pull_request') {
              try {
                const pull_number = context.payload.pull_request.number;
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo, pull_number, per_page: 100,
                });
                const { data: pull } = await github.rest.pulls.get({
                  ...context.repo, pull_number,
                });
                const translation = path => [
                  /^\.glossia\/.*\.lock$/,
                  /^app\/Resources\/[^/]+\/(?!en\.lproj\/)[^/]+\.lproj\/[^/]+\.strings(dict)?$/,
                  /^server\/priv\/gettext\/(?!en\/)[^/]+\/LC_MESSAGES\/[^/]+\.po$/,
                  /^server\/priv\/docs\/(?!en\/)[^/]+\/.*\.md$/,
                  /^android\/app\/src\/main\/res\/values-[^/]+\/strings\.xml$/,
                ].some(pattern => pattern.test(path));
                required = !(
                  pull.head.sha === context.payload.pull_request.head.sha &&
                  pull.base.sha === context.payload.pull_request.base.sha &&
                  files.length > 0 && files.length === pull.changed_files &&
                  files.every(file => translation(file.filename) &&
                    (!file.previous_filename || translation(file.previous_filename)))
                );
              } catch (error) {
                core.warning(`Could not determine translation-only scope; running CLI acceptance: ${error.message}`);
              }
            }
            core.setOutput('required', String(required));

  cache:
    name: Cache
    runs-on: tuist-macos
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'tuist/tuist' && github.event_name != 'pull_request'
    env:
      TUIST_EE: "1"
    steps:
      # TuistCacheEE is private: a read-only Tuist CI App token checks out
      # this repository and clones the submodule.
      - id: ee-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TUIST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TUIST_CI_APP_PRIVATE_KEY }}
          repositories: tuist,TuistCacheEE
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.ee-token.outputs.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        env:
          TUIST_GITHUB_TOKEN: ${{ steps.ee-token.outputs.token }}
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-cli-cache
      # The whole workspace, the app's targets included, as the coverage variant
      # Tuist.swift's `coverage` option selects.
      - name: Cache
        run: tuist cache
      # A crashed build service prints neither the compilation-cache plugin's
      # errors (cas.log) nor the CLI's session log.
      - name: Upload Tuist logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cache-tuist-logs-${{ github.run_attempt }}
          path: |
            ~/.local/state/tuist/cas.log
            ~/.local/state/tuist/sessions/*/logs.txt
          if-no-files-found: ignore
          retention-days: 7

  # In full nightly, selective otherwise; on main after the warm. A failed warm
  # doesn't stop the run: it builds what the cache lacks from source.
  unit-tests:
    name: Unit Tests
    needs: cache
    runs-on: tuist-macos
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    if: >-
      !cancelled() && github.repository == 'tuist/tuist' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      TUIST_EE: ${{ github.event.pull_request.head.repo.fork != true && '1' || '' }}
      SELECTIVE_TESTING: ${{ github.event_name == 'schedule' && '--no-selective-testing' || '' }}
    steps:
      # TuistCacheEE is private: a read-only Tuist CI App token checks out
      # this repository and clones the submodule. Forks get no secrets and skip both.
      - id: ee-token
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TUIST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TUIST_CI_APP_PRIVATE_KEY }}
          repositories: tuist,TuistCacheEE
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.ee-token.outputs.token || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        if: github.event.pull_request.head.repo.fork != true
        env:
          TUIST_GITHUB_TOKEN: ${{ steps.ee-token.outputs.token }}
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          # SwiftPM 6.4 retains a restored registry version even when the pin changes.
          # Retire the snapshot containing XCLogParser 0.2.49; keep forced installation.
          cache-key: cli-macos-workspace-cli-unit-tests-v2
      - name: Install stable Rust for Cargo reporting fixtures
        uses: ./.github/actions/mise
        env:
          MISE_LOCKED: 0
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
      - name: Verify scheme process integration
        run: |
          tuist generate TuistProcessSchemeIntegration --no-open
          bash cli/Tests/Fixtures/ProcessSchemeIntegration/test.sh
      - name: Install loopback TLS test dependency
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      # Installing Rust unlocked rewrites mise.lock, which doesn't change the
      # measured code but would make the CLI report the run from a dirty
      # checkout and the server leave its coverage out of the commit. Git is
      # told to ignore it, as server.yml does for its coverage shards.
      - name: Ignore lockfile changes for coverage
        run: git update-index --assume-unchanged mise.lock
      # The scheme leaves its test action's coverage unset, so it follows
      # Tuist.swift's `coverage` option. The CLI makes the coverage counters atomic itself
      # (`AtomicCoverageCounters`): tests run in parallel in one process, and plain
      # increments lose counts. The option's `prefixMapping` keeps Xcode's prefix
      # mapping in coverage builds, so the compilation cache replays across
      # runners; the CLI maps the covered paths back.
      - name: Run tests
        run: tuist test TuistUnitTests ${SELECTIVE_TESTING:+"$SELECTIVE_TESTING"} -- -retry-tests-on-failure -test-iterations 4

  # Like unit-tests. The app's dependencies are the same targets with or without
  # TuistCacheEE, so this job runs without it and still hits the warm.
  app-tests:
    name: App Tests
    needs: cache
    runs-on: tuist-macos
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    if: >-
      !cancelled() && github.repository == 'tuist/tuist' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      SELECTIVE_TESTING: ${{ github.event_name == 'schedule' && '--no-selective-testing' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      # Only the CLI, locked: a full install on a cold cache writes checksums
      # into mise.lock, and the run's coverage, reported from a dirty checkout,
      # is left out of the commit.
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist auth login
      - name: Setup Tuist
        if: github.event.pull_request.head.repo.fork != true
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: app-macos-workspace-app-test
      # `-parallel-testing-enabled NO` overrides the scheme's per-target setting, so the Swift
      # Testing suites' `.coverageAttribution` trait records each test on its own: tests that
      # overlap in one process get no evidence. Xcode has no option that serializes Swift Testing
      # while XCTest stays parallel.
      - name: Run tests
        run: tuist test TuistApp ${SELECTIVE_TESTING:+"$SELECTIVE_TESTING"} -- -retry-tests-on-failure -test-iterations 4 -parallel-testing-enabled NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      # Renders the iOS app's SwiftUI previews (tuist/snapshots) and uploads them to Tuist
      # Snapshots, which `tuist test` does by itself in CI. Main's runs are the baseline; on a
      # pull request, changed previews fail this step until they are approved on the
      # `tuist/snapshots (TuistAppSnapshots)` check or in the dashboard.
      - name: Run snapshot tests
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        # Snapshots render at the simulator's screen size, so every run must use the same
        # device: without --device, tuist test takes whichever one it finds first, which
        # differs between runners. This picks the first available iPhone by name.
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("SimRuntime.iOS-")) | .value[].name | select(startswith("iPhone "))] | unique | first')
          echo "Rendering snapshots on: $device"
          tuist test TuistAppSnapshots --platform iOS --device "$device" ${SELECTIVE_TESTING:+"$SELECTIVE_TESTING"} -- CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  acceptance-tests-build:
    name: Build Acceptance Tests
    needs: acceptance-scope
    runs-on: tuist-macos
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    # A failed scope check runs acceptance rather than silently removing it.
    if: >-
      !cancelled() && needs.acceptance-scope.outputs.required != 'false' &&
      github.repository == 'tuist/tuist' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      github.event.pull_request.head.repo.fork != true
    env:
      TUIST_EE: "1"
      SELECTIVE_TESTING: ${{ github.event_name == 'schedule' && '--no-selective-testing' || '' }}
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      # TuistCacheEE is private: a read-only Tuist CI App token checks out
      # this repository and clones the submodule.
      - id: ee-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TUIST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TUIST_CI_APP_PRIVATE_KEY }}
          repositories: tuist,TuistCacheEE
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.ee-token.outputs.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        env:
          TUIST_GITHUB_TOKEN: ${{ steps.ee-token.outputs.token }}
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-cli-acceptance-tests-build
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      # Selection happens here: the shards run the plan this build uploads.
      - name: Build tests
        id: shard
        run: tuist test --build-only --shard-total 2 --shard-granularity suite --shard-reference "$TUIST_ACCEPTANCE_SHARD_REFERENCE" TuistAcceptanceTests ${SELECTIVE_TESTING:+"$SELECTIVE_TESTING"}
        env:
          TUIST_ACCEPTANCE_SHARD_REFERENCE: github-${{ github.run_id }}-${{ github.sha }}

  acceptance-tests:
    name: Acceptance Tests
    runs-on: tuist-macos
    timeout-minutes: 60
    needs: acceptance-tests-build
    permissions:
      contents: read
      id-token: write
    if: toJSON(fromJSON(needs.acceptance-tests-build.outputs.matrix).shard) != '[]'
    env:
      TUIST_EE: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.acceptance-tests-build.outputs.matrix) }}
    steps:
      # TuistCacheEE is private: a read-only Tuist CI App token checks out
      # this repository and clones the submodule.
      - id: ee-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TUIST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TUIST_CI_APP_PRIVATE_KEY }}
          repositories: tuist,TuistCacheEE
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.ee-token.outputs.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        env:
          TUIST_GITHUB_TOKEN: ${{ steps.ee-token.outputs.token }}
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          # Retire the same stale registry snapshot as the unit-test job.
          cache-key: cli-macos-workspace-cli-acceptance-tests-v2
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      # The Xcode compilation-cache acceptance test loads the cas-plugin dylib
      # inside xcodebuild's compilers and routes it to the proxy over a unix
      # socket. Build both from source and hand their paths to the test via the
      # TUIST_CAS_PLUGIN_PATH / TUIST_CAS_PROXY_PATH overrides ResourceLocator
      # honours.
      - uses: ./.github/actions/mise
        env:
          # The rust pin lives in cas-plugin/mise.toml and has no lockfile entry,
          # so this workflow's MISE_LOCKED=1 refuses to install it. Every other
          # workflow that builds the plugin installs this toolchain unlocked.
          MISE_LOCKED: 0
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cas-plugin-rust-${{ runner.os }}
          workspaces: |
            cas-plugin -> target
      - name: Build the cas-plugin
        working-directory: cas-plugin
        env:
          MISE_LOCKED: 0
          # Rust is installed above. Auto-install would also install the root
          # mise.toml's tools and, unlocked, write their missing checksums into
          # mise.lock, so the CLI would report the acceptance run from a dirty
          # checkout and the server would leave its coverage out of the commit.
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        # No GITHUB_ENV export: `xcodebuild test-without-building` runs the test
        # bundle with the environment captured into the xctestrun at build time,
        # so a variable exported here never reaches the test process. The suite
        # resolves both binaries from this path in the source tree instead.
        run: mise run build
      - name: Set up new keychain
        run: |
          TMP_DIRECTORY=$(mktemp -d)
          KEYCHAIN_PATH=$TMP_DIRECTORY/keychain.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
      # Serial, like the app tests, so the Swift Testing suites' `.coverageAttribution` trait
      # records each test on its own. Acceptance tests each shell out to their own nested
      # xcodebuild, so parallel runners also multiplied compiler processes: uncapped on a 6-core
      # runner that reached 78 concurrent swift-frontend processes
      # (https://github.com/tuist/tuist/issues/12512).
      # Like the unit tests: the unlocked Rust install above rewrites mise.lock.
      - name: Ignore lockfile changes for coverage
        run: git update-index --assume-unchanged mise.lock
      - name: Run shard ${{ matrix.shard }}
        run: tuist test --without-building --platform macOS --shard-reference "$TUIST_ACCEPTANCE_SHARD_REFERENCE" TuistAcceptanceTests -- -retry-tests-on-failure -test-iterations 2 -parallel-testing-enabled NO
        env:
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the test process
          # without the prefix, at test time, so they stay out of the xctestrun.
          TEST_RUNNER_TUIST_AUTH_EMAIL: ${{ secrets.TUIST_CANARY_ACCEPTANCE_EMAIL }}
          TEST_RUNNER_TUIST_AUTH_PASSWORD: ${{ secrets.TUIST_CANARY_ACCEPTANCE_PASSWORD }}
          TUIST_SHARD_INDEX: ${{ matrix.shard }}
          TUIST_ACCEPTANCE_SHARD_REFERENCE: github-${{ github.run_id }}-${{ github.sha }}
      # The CLI logs how it fetched the shard's test products at debug level only,
      # so users never see it. Surface it here to compare shard stores and racks.
      - name: Shard fetch timings
        if: always()
        run: grep -h "test products artifact(s)" ~/.local/state/tuist/sessions/*/logs.txt || true

  # Forks don't check out the EE submodule, so the suite that needs the
  # cas-plugin isn't in the scheme there, and they don't authenticate.
  acceptance-tests-fork:
    name: Acceptance Tests (Fork)
    needs: acceptance-scope
    runs-on: tuist-macos
    timeout-minutes: 60
    if: >-
      !cancelled() && needs.acceptance-scope.outputs.required != 'false' &&
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-cli-acceptance-tests-build
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Set up new keychain
        run: |
          TMP_DIRECTORY=$(mktemp -d)
          KEYCHAIN_PATH=$TMP_DIRECTORY/keychain.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
      - name: Run tests
        run: tuist test --platform macOS TuistAcceptanceTests -- -retry-tests-on-failure -test-iterations 2
        env:
          # Forks get no secrets, so the tests that sign in to canary are cancelled.
          TEST_RUNNER_TUIST_ACCEPTANCE_SKIP_CANARY: "1"

  # Compiles the coverage-based test selection acceptance tests without running
  # them: canary doesn't serve the selection endpoints yet, so they can't join
  # TuistAcceptanceTests. A plain build records no test results, selective
  # testing hashes or coverage.
  coverage-selection-acceptance-tests-build:
    name: Build Coverage Selection Acceptance Tests
    needs: acceptance-scope
    runs-on: tuist-macos
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    if: >-
      !cancelled() && needs.acceptance-scope.outputs.required != 'false' &&
      github.repository == 'tuist/tuist' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      github.event.pull_request.head.repo.fork != true
    env:
      TUIST_EE: "1"
    steps:
      # TuistCacheEE is private: a read-only Tuist CI App token checks out
      # this repository and clones the submodule.
      - id: ee-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TUIST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TUIST_CI_APP_PRIVATE_KEY }}
          repositories: tuist,TuistCacheEE
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.ee-token.outputs.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Initialize TuistCacheEE submodule
        env:
          TUIST_GITHUB_TOKEN: ${{ steps.ee-token.outputs.token }}
        run: bash mise/tasks/cli/ee.sh
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        uses: tuist/install@v1
        with:
          cache-key: cli-macos-workspace-cli-acceptance-tests-build
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Build tests
        run: |
          tuist generate TuistCoverageSelectionAcceptanceTests --no-open
          xcodebuild build-for-testing -workspace Tuist.xcworkspace \
            -scheme TuistCoverageSelectionAcceptanceTests -destination platform=macOS

  # Only a complete commit joins the coverage trend, and pull request gates wait
  # for it. On a pull request it follows the unit, app and acceptance tests
  # whatever they concluded (a fork's runs report nothing, so it has nothing to
  # complete); on main only when unit and app passed, after acceptance has
  # reported. A CLI release older than `tuist coverage complete` skips the
  # signal, and the commit stays in progress.
  coverage-complete:
    name: Complete Coverage
    needs: [unit-tests, app-tests, acceptance-tests]
    runs-on: tuist-macos
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    if: >-
      !cancelled() && github.repository == 'tuist/tuist' && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.fork != true) ||
        (github.event_name != 'pull_request' &&
          needs.unit-tests.result == 'success' &&
          needs.app-tests.result == 'success')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Signal that the commit's coverage is complete
        # A release without the command still exits 0 for `--help`, printing
        # the root help instead. The command's usage line comes from its path,
        # not its wording, and never wraps at the command's name.
        run: |
          help=$(tuist coverage complete --help 2>/dev/null || true)
          if grep -qE "^USAGE: tuist coverage complete( |$)" <<< "$help"; then
            tuist coverage complete
          else
            echo "::notice::$(tuist version) has no 'tuist coverage complete'; the commit stays in progress until a release with it is pinned."
          fi
