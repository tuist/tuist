name: Atlas Release

# Cuts a versioned release of the Atlas image and publishes it to GHCR under
# `ghcr.io/tuist/atlas:<version>` + `:latest`, plus an `atlas@X.Y.Z` git tag
# and a GitHub Release. `atlas-deploy.yml` then rolls out the freshly
# published version.

on:
  push:
    branches:
      - main
    paths:
      - atlas/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - mise/tasks/release/components.json
      - .github/workflows/atlas-release.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  # Serialize atlas publishing through one ref-independent group: it derives
  # the next version from the atlas@ tag set and creates a tag, so two runs
  # must never overlap. Queue rather than cancel so an in-flight publish is
  # never torn.
  group: atlas-release
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}

jobs:
  check:
    name: Check for releasable changes
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.check.outputs.atlas-should-release }}
      next-version: ${{ steps.check.outputs.atlas-next-version }}
      next-version-number: ${{ steps.check.outputs.atlas-next-version-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: check
        run: mise run --skip-tools release:check atlas

  release:
    name: Release Atlas
    needs: check
    if: needs.check.outputs.should-release == 'true'
    runs-on: tuist-linux
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Get release notes
        id: release-notes
        working-directory: atlas
        run: |
          LATEST_VERSION=$(git tag -l | grep -E "^atlas@[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST_VERSION" ]; then
            git cliff --include-path "atlas/**/*" --config cliff.toml --repository "../" 2>/dev/null -- ${LATEST_VERSION}..HEAD | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          else
            git cliff --include-path "atlas/**/*" --config cliff.toml --repository "../" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        working-directory: atlas
        run: git cliff --include-path "atlas/**/*" --config cliff.toml --repository "../" --tag "${{ needs.check.outputs.next-version }}" -o CHANGELOG.md 2>/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: atlas
          file: atlas/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            ATLAS_VERSION=${{ needs.check.outputs.next-version-number }}
            MIX_ENV=prod
          tags: |
            ghcr.io/tuist/atlas:${{ needs.check.outputs.next-version-number }}
            ghcr.io/tuist/atlas:latest

      - name: Create Atlas GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          repository: tuist/tuist
          target_commitish: ${{ github.sha }}
          name: Atlas ${{ needs.check.outputs.next-version-number }}
          tag_name: ${{ needs.check.outputs.next-version }}
          body: |
            Docker image: `ghcr.io/tuist/atlas:${{ needs.check.outputs.next-version-number }}`

            ${{ steps.release-notes.outputs.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}
