name: Kura Volumes CSI Image

# PR validation + image build for kura-volumes-csi, the node plugin behind
# the kura-volumes.tuist.dev StorageClass that gives every Kura data PVC its
# own LUKS2 container on the node's /data partition (infra/kura-volumes-csi/).
#
# Deployed images are built by server-deployment.yml and
# server-production-deployment.yml next to the Kura controller, at the same
# `sha-` tag. This workflow validates PRs; a manual dispatch pushes `:sha-<git-sha>`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - infra/kura-volumes-csi/**
      - infra/helm/rack-nodes/**
      - infra/helm/tuist/templates/kura-volumes-csi.yaml
      - .github/workflows/kura-volumes-csi-image.yml
  workflow_dispatch:
    inputs:
      fscrypt_only:
        description: Run only the disposable fscrypt experiment, without publishing images
        type: boolean
        default: false
      fscrypt_profile:
        description: Profile one cache run per layout instead of the repeated benchmark and fio suite
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/kura-volumes-csi

jobs:
  test:
    if: github.repository == 'tuist/tuist' && inputs.fscrypt_only != true && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-volumes-csi/go.mod
          cache-dependency-path: infra/kura-volumes-csi/go.sum
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Test
        working-directory: infra/kura-volumes-csi
        run: go test ./...
      - name: Vet
        working-directory: infra/kura-volumes-csi
        run: go vet ./...

  thin-stack:
    if: github.repository == 'tuist/tuist' && github.event_name == 'workflow_dispatch' && inputs.fscrypt_only != true
    # Device-mapper fault tests need their own disposable VM, never a shared
    # staging host or a container with access to a runner host's block devices.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk-kib: [64, 512]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-volumes-csi/go.mod
          cache-dependency-path: infra/kura-volumes-csi/go.sum
      - name: Install disposable stack prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 cryptsetup xfsprogs thin-provisioning-tools ruby fio
          sudo modprobe dm_thin_pool
          test "$(df --output=avail -B1 /var/tmp | tail -1)" -gt 30000000000
      - name: Qualify the actual CSI driver
        shell: bash
        working-directory: infra/kura-volumes-csi
        run: |
          go test -c -o /tmp/kura-thin-driver.test ./internal/driver
          sudo env KURA_THIN_DISPOSABLE_VM=1 KURA_THIN_CHUNK_KIB=${{ matrix.chunk-kib }} /tmp/kura-thin-driver.test -test.run '^TestThinRealStack$' -test.v -test.timeout 15m | tee /tmp/kura-thin-driver.log
      - name: Qualify reclamation and the quota counterexample
        run: |
          sudo env KURA_THIN_DISPOSABLE_VM=1 KURA_THIN_CHUNK_KIB=${{ matrix.chunk-kib }} ruby infra/kura-volumes-csi/thin/stack_test.rb > /tmp/kura-thin-stack.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thin-stack-${{ matrix.chunk-kib }}
          path: |
            /tmp/kura-thin-driver.log
            /tmp/kura-thin-stack.json

  fscrypt-experiment:
    if: github.repository == 'tuist/tuist' && github.event_name == 'workflow_dispatch'
    # Independent storage-primitive experiment; no deployed driver change.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-volumes-csi/go.mod
          cache-dependency-path: infra/kura-volumes-csi/go.sum
      - name: Build bounded cache benchmark
        working-directory: infra/kura-volumes-csi
        run: go build -o /tmp/kura-fscrypt-cache-bench ./cmd/cache-bench
      - name: Check out the pinned sharing policy for compatibility qualification
        uses: actions/checkout@v4
        with:
          ref: 34956ca681a3dc0dc257ee5b4d0d65814bd5f23d
          path: sharing-reference
          sparse-checkout: infra/kura-controller
          persist-credentials: false
      - name: Build the adapter proof against unchanged sharing policy
        run: |
          cp infra/kura-volumes-csi/fscrypt/allocator_test.go.fixture sharing-reference/infra/kura-controller/internal/diskallocator/fscrypt_probe_test.go
          cd sharing-reference/infra/kura-controller
          GOWORK=off go test -c -o /tmp/kura-fscrypt-allocator.test ./internal/diskallocator
      - name: Install disposable VM prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby build-essential e2fsprogs quota xfsprogs lvm2 cryptsetup thin-provisioning-tools fio
          if ! sudo modprobe quota_v2; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe quota_v2
          fi
          sudo modprobe dm_thin_pool
          git clone https://github.com/google/fscryptctl /tmp/fscryptctl
          git -C /tmp/fscryptctl checkout --detach 361a040c0f50c2440d51347b5eb48482ae1a41b7
          make -C /tmp/fscryptctl fscryptctl
          sudo install /tmp/fscryptctl/fscryptctl /usr/local/bin/fscryptctl
      - name: Qualify encrypted shared filesystem and compare layouts
        env:
          FSCRYPT_PROFILE: ${{ inputs.fscrypt_profile }}
        run: |
          profile_tool=""
          if [ "$FSCRYPT_PROFILE" = "true" ]; then
            sudo apt-get install -y linux-tools-generic
            profile_tool=$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)
            test -x "$profile_tool"
            sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
          fi
          # The unprivileged runner intentionally owns the report artifact.
          # shellcheck disable=SC2024
          sudo env KURA_FSCRYPT_PERF="$profile_tool" KURA_FSCRYPT_DISPOSABLE_VM=1 KURA_FSCRYPT_CACHE_BENCH=/tmp/kura-fscrypt-cache-bench KURA_FSCRYPT_ALLOCATOR_TEST=/tmp/kura-fscrypt-allocator.test ruby infra/kura-volumes-csi/fscrypt/stack_test.rb > /tmp/kura-fscrypt-stack.json
      - name: Preserve disposable VM kernel diagnostics
        if: failure()
        run: sudo dmesg | tail -100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fscrypt-experiment
          path: /tmp/kura-fscrypt-stack.json

  # Builds on every run (a Dockerfile broken on a PR must not surface only
  # after merge on main); pushes to ghcr only outside pull_request events,
  # which also keeps fork PRs away from the registry.
  build:
    needs: [test, thin-stack]
    # The VM qualification is dispatch-only; a PR still builds its image.
    # A failed or cancelled qualification must never publish a candidate.
    if: always() && github.repository == 'tuist/tuist' && needs.test.result == 'success' && (needs.thin-stack.result == 'success' || needs.thin-stack.result == 'skipped')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          echo "version=sha-${GIT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/kura-volumes-csi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kura-volumes-csi
          cache-to: type=gha,mode=max,scope=kura-volumes-csi
