name: macOS Xcode bundle measure

# Throwaway experiment (branch exp/xcode-bundle-tahoe-27 only): boots fresh
# clones of the single-Xcode 27-0 image and the three-Xcode bundle with
# different idle warm-ups, samples the VM memory on the host, and runs infra/macos-xcode-image/experiments/measure.sh.

on:
  push:
    branches: [exp/xcode-bundle-tahoe-27]
    paths:
      - .github/workflows/macos-xcode-bundle-measure.yml
      - infra/macos-xcode-image/experiments/measure.sh
      - infra/macos-xcode-image/experiments/measure.pkr.hcl

concurrency:
  group: macos-xcode-bundle-measure
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  REPO: ghcr.io/tuist/macos-tahoe-xcode

jobs:
  measure:
    runs-on: [self-hosted, macos, bare-metal, vm-image-builder]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Packer
        working-directory: infra/macos-xcode-image/experiments
        run: packer init -upgrade measure.pkr.hcl

      - name: Pull both images
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: tuist-bot
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in 27-0 exp-bundle-27-0-27-1-27-2; do
            t0=$(date +%s); tart pull "$REPO:$tag"
            echo "BUNDLE-EXP pull $tag s: $(( $(date +%s) - t0 ))"
          done

      - name: Measure
        working-directory: infra/macos-xcode-image/experiments
        run: |
          set -uo pipefail
          # Host-side sampler: every 5 s, the memory of the VM's
          # Virtualization process (guest RAM it has touched) and of tart.
          (
            while true; do
              for pid in $(pgrep -f 'com.apple.Virtualization.VirtualMachine' || true); do
                rss=$(ps -o rss= -p "$pid" 2>/dev/null | tr -d ' ')
                fp=$(footprint "$pid" 2>/dev/null | awk '/Footprint:/ {print $2, $3; exit}')
                echo "BUNDLE-EXP HOSTMEM pid $pid rss_mb $(( ${rss:-0} / 1024 )) footprint ${fp:-n/a}"
              done
              sleep 5
            done
          ) &
          sampler=$!
          for c in single:27-0:none single:27-0:all bundle:exp-bundle-27-0-27-1-27-2:one bundle:exp-bundle-27-0-27-1-27-2:all; do
            IFS=: read -r label tag warm <<<"$c"
            tart delete exp-measure 2>/dev/null || true
            echo "BUNDLE-EXP CASE $label warm=$warm begin"
            env -u GITHUB_TOKEN packer build \
              -var "base_image=$REPO:$tag" -var output_image=exp-measure \
              -var "warm=$warm" -var "image_label=$label" measure.pkr.hcl \
              || echo "BUNDLE-EXP [$label warm=$warm] packer failed"
            echo "BUNDLE-EXP CASE $label warm=$warm end"
          done
          kill "$sampler" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: tart delete exp-measure 2>/dev/null || true
