name: macOS Xcode bundle measure

# Throwaway experiment (branch exp/xcode-bundle-tahoe-27 only): boots fresh
# clones of the single-Xcode 27-0 image and the three-Xcode bundle, cold and
# after a warm-up, and runs infra/macos-xcode-image/experiments/measure.sh.

on:
  push:
    branches: [exp/xcode-bundle-tahoe-27]
    paths:
      - .github/workflows/macos-xcode-bundle-measure.yml
      - infra/macos-xcode-image/experiments/measure.sh
      - infra/macos-xcode-image/experiments/measure.pkr.hcl

concurrency:
  group: macos-xcode-bundle-measure
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  REPO: ghcr.io/tuist/macos-tahoe-xcode

jobs:
  measure:
    runs-on: [self-hosted, macos, bare-metal, vm-image-builder]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Packer
        working-directory: infra/macos-xcode-image/experiments
        run: packer init -upgrade measure.pkr.hcl

      - name: Pull both images
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: tuist-bot
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in 27-0 exp-bundle-27-0-27-1-27-2; do
            t0=$(date +%s); tart pull "$REPO:$tag"
            echo "BUNDLE-EXP pull $tag s: $(( $(date +%s) - t0 ))"
          done

      - name: Measure
        working-directory: infra/macos-xcode-image/experiments
        run: |
          set -uo pipefail
          for img in single:27-0 bundle:exp-bundle-27-0-27-1-27-2; do
            for mode in cold warm; do
              tart delete exp-measure 2>/dev/null || true
              env -u GITHUB_TOKEN packer build \
                -var "base_image=$REPO:${img#*:}" -var output_image=exp-measure \
                -var "mode=$mode" -var "image_label=${img%%:*}" measure.pkr.hcl \
                || echo "BUNDLE-EXP [${img%%:*} $mode] packer failed"
            done
          done

      - name: Cleanup
        if: always()
        run: tart delete exp-measure 2>/dev/null || true
