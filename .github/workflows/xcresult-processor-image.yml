name: Xcresult Processor Image

# On-demand build of the Tart VM image that hosts the Tuist xcresult
# processor on macOS. Invoke via `gh workflow run
# xcresult-processor-image.yml --ref <branch>` when probing image
# contents or smoke-testing a Packer change before merging; pin the
# result on a deploy with server-deployment.yml's
# `xcresult_processor_image_tag` input.
#
# The push-on-main flow lives in server-production-deployment.yml's
# release-xcresult-processor-image job, which produces the versioned tags
# (`:<version>` + `:latest`) the deploy resolves. This workflow's
# `:<git-sha>` tag is dispatch-only.
#
# Builds on top of `ghcr.io/tuist/macos-tahoe-xcode:<xcode-version-dashes>`
# (built by `infra/macos-xcode-image`). Xcode lives in the base: the NIF
# shells out to `/usr/bin/xcrun xcresulttool`, which only ships in full
# Xcode. This build adds Tailscale, the boot scripts and the launchd unit
# on top. The server release is not in the image; the guest downloads it
# at boot. Runs on a bare-metal vm-image-builder host because Tart needs a
# live GUI session for Virtualization.framework.

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: "Xcode version of the base macos-tahoe-xcode image to build against (e.g. 26.5, 26.4.1). Must already be published."
        required: true

concurrency:
  group: xcresult-processor-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, macos, bare-metal, vm-image-builder]
    timeout-minutes: 150
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Log in BEFORE Packer build so Tart's clone of the
      # macos-tahoe-xcode base authenticates. The registry is
      # tailnet-only and every image on it needs a credential, for
      # reads as well as writes.
      - name: Log in to GHCR (crane)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login --username tuist-bot --password-stdin ghcr.io

      - name: Initialize Packer
        working-directory: infra/xcresult-processor-image
        run: packer init -upgrade xcresult-processor.pkr.hcl

      - uses: ./.github/actions/reclaim-tart-disk

      - name: Build image
        working-directory: infra/xcresult-processor-image
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/tuist/macos-tahoe-xcode:${XCODE_VERSION//./-}"
          echo "Base image: ${BASE_IMAGE}"
          env -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN packer build \
            -var "base_image=${BASE_IMAGE}" \
            -var "output_image=tuist-xcresult-processor" \
            xcresult-processor.pkr.hcl

      - name: Resolve image tag
        id: image-tag
        run: |
          set -euo pipefail
          echo "value=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Push image to GHCR
        timeout-minutes: 90
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: tuist-bot
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # The production workflow owns semantic-version and latest tags.
        # This on-demand workflow publishes only its commit tag.
        #
        # `concurrency` matches the release job's override of the action's
        # default of 4: this image pushes alone rather than as one leg of the
        # runner-image matrix, so it has the whole rate-limit budget to
        # itself. Keeping the two in step means a dispatch run measures what
        # the release path will do.
        uses: ./.github/actions/tart-push
        with:
          local-name: tuist-xcresult-processor
          concurrency: "8"
          remote-names: ghcr.io/tuist/tuist-xcresult-processor:${{ steps.image-tag.outputs.value }}

      - name: Cleanup
        if: always()
        run: |
          tart delete tuist-xcresult-processor 2>/dev/null || true
