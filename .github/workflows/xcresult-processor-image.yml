name: Xcresult Processor Image

# On-demand build of the Tart VM image that hosts the Tuist xcresult
# processor on macOS. Invoke via `gh workflow run
# xcresult-processor-image.yml --ref <branch>` when probing image
# contents or smoke-testing a Packer change before merging.
#
# The push-on-main flow lives in server-production-deployment.yml's
# release-xcresult-processor job — that's the path that produces
# versioned tags (`:<version>` + `:latest`) and rewrites the
# xcresultProcessor image tag in `values-managed-common.yaml`. This
# workflow's `:<git-sha>` tag is dispatch-only and not consumed by
# the chart.
#
# Builds on top of `ghcr.io/tuist/macos-tahoe-xcode:<xcode-version-dashes>`
# (built by `infra/macos-xcode-image`). Xcode lives in the base —
# the NIF shells out to `/usr/bin/xcrun xcresulttool`, which only
# ships in full Xcode (not the Command Line Tools). This build just
# adds the Erlang release and launchd unit on top.
#
# Two stages on the same self-hosted bare-metal Mac mini (the same
# vm-image-builder host #10264 introduces — Tart needs a live GUI session
# for Virtualization.framework, so this can't run on hosted GitHub runners):
#
#   1. Build the Erlang release with the xcresult NIF, package as a tarball.
#   2. Bake the tarball into a Tart image via Packer + push to GHCR.

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: "Xcode version of the base macos-tahoe-xcode image to build against (e.g. 26.5, 26.4.1). Must already be published."
        required: true

concurrency:
  group: xcresult-processor-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, macos, bare-metal, vm-image-builder]
    timeout-minutes: 150
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      MISE_VERSION: "2026.5.15"
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "erlang elixir"
          working_directory: server

      # `actions/checkout` runs `git clean -ffdx` on this host's persistent
      # workspace, which deletes `server/deps`, `server/_build` and both NIF
      # `.build` directories, so every run compiled the two Swift NIFs and the
      # whole Elixir dependency tree cold. Pointing the caches outside the
      # workspace puts them out of the clean's reach.
      #
      # Keyed by runner name because a runner process runs one job at a time:
      # two jobs landing on the same host (this one and the release job in
      # `server-production-deployment.yml`) can then never share a cache and
      # cannot race on the release directory.
      - name: Point build caches outside the workspace
        run: |
          set -euo pipefail
          cache_root="${HOME}/.cache/tuist-ci/server-macos-release/${RUNNER_NAME// /_}"
          mkdir -p "${cache_root}/nif"
          {
            echo "MIX_BUILD_ROOT=${cache_root}/mix-build"
            echo "MIX_DEPS_PATH=${cache_root}/mix-deps"
            echo "TUIST_NIF_BUILD_ROOT=${cache_root}/nif"
          } >> "$GITHUB_ENV"

      # 1. Build the macOS Erlang release. Includes both the xcresult NIF
      # (used by xcresult-processor mode) and the xcactivitylog NIF
      # (used by build-processor mode). Both are macOS-only and both
      # have `@on_load` that crashes the BEAM at boot if the .so is
      # missing in a prod build — the xcresult-processor mode doesn't
      # *call* xcactivitylog_nif but the Module still gets loaded
      # eagerly, so the .so has to be present either way.
      - name: Build server release for macOS
        id: release
        working-directory: server
        run: |
          set -euo pipefail
          RELEASE_DIR="${MIX_BUILD_ROOT}/prod/rel/tuist"
          MIX_ENV=prod mix deps.get --only prod
          # `mix release` doesn't invoke the per-NIF build.sh scripts;
          # run them explicitly so the .so / .dylib land in priv/native
          # before the release tarball is assembled.
          ./native/xcresult_nif/build.sh
          ./native/xcactivitylog_nif/build.sh
          # The build root persists across runs. That is mostly fine, except
          # that mix's mtime-based incremental compile occasionally keeps a
          # stale .beam after a rebase. `--force` recompiles every .ex
          # regardless; the BEAM build is fast enough (~30s) that the safety
          # is worth more than the saved time.
          MIX_ENV=prod mix compile --force --warnings-as-errors
          # `mix release --overwrite` writes over the release directory
          # without emptying it first, so a file dropped since the previous
          # release would survive in a persistent build root and get baked
          # into the image.
          rm -rf "$RELEASE_DIR"
          MIX_ENV=prod mix release tuist --overwrite
          echo "dir=${RELEASE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Package release tarball
        run: |
          set -euo pipefail
          tar -czf /tmp/release.tar.gz -C "${{ steps.release.outputs.dir }}" .
          ls -lh /tmp/release.tar.gz

      # Log in BEFORE Packer build so Tart's clone of the
      # macos-tahoe-xcode base authenticates. The registry is
      # tailnet-only and every image on it needs a credential, for
      # reads as well as writes.
      - name: Log in to GHCR (crane)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login --username tuist-bot --password-stdin ghcr.io

      # 2. Bake the tarball into a Tart image.
      - name: Initialize Packer
        working-directory: infra/xcresult-processor-image
        run: packer init -upgrade xcresult-processor.pkr.hcl

      - uses: ./.github/actions/reclaim-tart-disk

      - name: Build image
        working-directory: infra/xcresult-processor-image
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/tuist/macos-tahoe-xcode:${XCODE_VERSION//./-}"
          echo "Base image: ${BASE_IMAGE}"
          env -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN packer build \
            -var "base_image=${BASE_IMAGE}" \
            -var "output_image=tuist-xcresult-processor" \
            -var "release_tarball=/tmp/release.tar.gz" \
            xcresult-processor.pkr.hcl

      - name: Resolve image tag
        id: image-tag
        run: |
          set -euo pipefail
          echo "value=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Push image to GHCR
        timeout-minutes: 90
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: tuist-bot
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # The production workflow owns semantic-version and latest tags.
        # This on-demand workflow publishes only its commit tag.
        #
        # `concurrency` matches the release job's override of the action's
        # default of 4: this image pushes alone rather than as one leg of the
        # runner-image matrix, so it has the whole rate-limit budget to
        # itself. Keeping the two in step means a dispatch run measures what
        # the release path will do.
        uses: ./.github/actions/tart-push
        with:
          local-name: tuist-xcresult-processor
          concurrency: "8"
          remote-names: ghcr.io/tuist/tuist-xcresult-processor:${{ steps.image-tag.outputs.value }}

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/release.tar.gz
          tart delete tuist-xcresult-processor 2>/dev/null || true
