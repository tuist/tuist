name: Server Acceptance Tests

# TuistServerAcceptanceTests exercises a running Tuist server end to end,
# against the deployed canary. server-production-deployment.yml runs it before
# promoting to production, and that workflow only runs on push to main, so
# without this the tests would first execute against a live promotion.
#
# cli.yml does not cover them: it runs them inside TuistAcceptanceTests, whose
# job has been skipping because selective testing returns an empty shard matrix.
#
# Triggers are narrow because this is a full macOS acceptance run. Project.swift
# is included so a change to the production deploy plan's composition is
# exercised too, and workflow_dispatch is there to run the suite on demand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - cli/Tests/TuistServerAcceptanceTests/**
      - Project.swift
      - Tuist/ProjectDescriptionHelpers/Module.swift
      - .github/workflows/server-acceptance-tests.yml
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1

concurrency:
  group: server-acceptance-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  server-acceptance-tests:
    name: Server Acceptance Tests
    runs-on: tuist-macos
    timeout-minutes: 45
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: ./.github/actions/mise
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Test
        run: |
          tuist test TuistServerAcceptanceTests --no-selective-testing -- \
            -retry-tests-on-failure -test-iterations 2
