name: Atlas Native

on:
  push:
    branches: [main]
    paths: [atlas-native/**]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [atlas-native/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-native-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_GITHUB_ATTESTATIONS: "0"
  MISE_AUTO_INSTALL: "0"

defaults:
  run:
    working-directory: atlas-native

jobs:
  lint-rust:
    name: Lint Rust
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise-install
        with:
          working-directory: atlas-native
          install: rust
      - run: mise exec -- rustup component add clippy rustfmt
      - run: mise run lint:rust

  lint-swift:
    name: Lint Swift
    if: github.event.pull_request.draft != true
    runs-on: tuist-macos-27-0
    timeout-minutes: 10
    env:
      ONCE_CACHE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise-install
        with:
          working-directory: atlas-native
          install: swiftlint github:tuist/once
      - run: mise run lint:swift

  lint-kotlin:
    name: Lint Kotlin
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise-install
        with:
          working-directory: atlas-native
          install: java github:ktlint/ktlint
      - run: mise run lint:kotlin

  build:
    name: Build (${{ matrix.platform }})
    if: github.event.pull_request.draft != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: tuist-macos-27-0
          - platform: cli
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/atlas-native
        with:
          platform: ${{ matrix.platform }}
          operation: build
          authenticated: ${{ github.repository == 'tuist/tuist' }}

  build-fork:
    name: Build fork (${{ matrix.platform }})
    if: github.event.pull_request.draft != true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: tuist-macos-27-0
          - platform: cli
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/atlas-native
        with:
          platform: ${{ matrix.platform }}
          operation: build

  test:
    name: Test (${{ matrix.platform }})
    if: github.event.pull_request.draft != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: core
            runner: ubuntu-24.04
          - platform: ios
            runner: tuist-macos-27-0
          - platform: cli
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/atlas-native
        with:
          platform: ${{ matrix.platform }}
          operation: test
          authenticated: ${{ github.repository == 'tuist/tuist' }}

  test-fork:
    name: Test fork (${{ matrix.platform }})
    if: github.event.pull_request.draft != true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: core
            runner: ubuntu-24.04
          - platform: ios
            runner: tuist-macos-27-0
          - platform: cli
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/atlas-native
        with:
          platform: ${{ matrix.platform }}
          operation: test

  previews:
    name: Publish internal previews
    needs: [build, test, lint-rust, lint-swift, lint-kotlin]
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: tuist-macos-27-0
    timeout-minutes: 15
    environment: atlas-mobile-previews
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-mobile-android
          path: atlas-native/delivery/android
      - uses: actions/download-artifact@v4
        with:
          name: atlas-mobile-ios
          path: atlas-native/delivery/ios
      - uses: ./.github/actions/mise-install
        with:
          working-directory: atlas-native
          install: tuist
      - name: Authenticate with Tuist
        run: mise exec -- tuist auth login
      - name: Publish Android preview
        run: |
          mise exec -- tuist share delivery/android/AtlasAndroid.apk --track nightly
          mise exec -- tuist inspect bundle delivery/android/AtlasAndroid.apk
      - name: Publish iOS simulator preview
        run: |
          ditto -x -k delivery/ios/Atlas-ios-simulator.zip delivery/ios
          device=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; print(next(d["udid"] for runtime,group in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in group if d["isAvailable"]))')
          xcrun simctl boot "$device" || xcrun simctl bootstatus "$device" -b
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" delivery/ios/Atlas.app
          xcrun simctl launch "$device" dev.tuist.atlas
          mise exec -- tuist share delivery/ios/Atlas.app --track nightly
          mise exec -- tuist inspect bundle delivery/ios/Atlas.app
      - name: Link to previews
        run: echo 'Internal builds are available in [tuist/atlas-mobile](https://tuist.dev/tuist/atlas-mobile/previews).' >> "$GITHUB_STEP_SUMMARY"
