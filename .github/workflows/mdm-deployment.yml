name: MDM Deployment

# Deploys the self-hosted Apple MDM stack (infra/helm/mdm) to the
# staging cluster. Staging-only for now: the fleet MDM graduates to a
# production hostname only after the BER1 prototype gauntlet passes
# (see infra/mdm/README.md).

on:
  push:
    branches:
      - main
    paths:
      - infra/mdm/**
      - infra/helm/mdm/**
      - .github/workflows/mdm-deployment.yml
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (defaults to github.sha)
        required: false
      image_tag:
        description: Pre-built image tag to deploy instead of building
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: mdm-deploy-staging
  cancel-in-progress: false

env:
  MISE_VERSION: "2026.5.15"
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_DEPLOY_GITHUB_TOKEN || github.token }}
  REGISTRY: ghcr.io
  HELM_CHART_PATH: infra/helm/mdm
  HELM_RELEASE_NAME: mdm
  NAMESPACE: mdm
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  test:
    name: Test enroller
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/mdm/enroller/go.mod
          cache-dependency-path: infra/mdm/enroller/go.sum
      - name: Test
        working-directory: infra/mdm/enroller
        run: go test ./...
      - name: Vet
        working-directory: infra/mdm/enroller
        run: go vet ./...

  build:
    name: Build and push MDM images
    if: inputs.image_tag == ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: false
          persist-credentials: false
      - id: tag
        run: echo "image_tag=sha-${DEPLOY_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        name: Build and push mdm-enroller image
        with:
          context: ./infra/mdm/enroller
          push: true
          tags: |
            ${{ env.REGISTRY }}/tuist/mdm-enroller:${{ steps.tag.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        name: Build and push scepserver image
        with:
          context: ./infra/mdm/scep
          push: true
          tags: |
            ${{ env.REGISTRY }}/tuist/scepserver:${{ steps.tag.outputs.image_tag }}

  deploy:
    name: Deploy staging
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: server-k8s-staging
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "--locked helm kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v2
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-staging" \
            --vault "tuist-k8s-staging" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability
        run: |
          set -euo pipefail
          API="$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Reaching apiserver at $API"
          kubectl --request-timeout=10s get --raw /version >/dev/null
      - name: Resolve image tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          BUILT_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_TAG:-}" ]; then
            IMAGE_TAG="$INPUT_IMAGE_TAG"
          else
            IMAGE_TAG="$BUILT_IMAGE_TAG"
          fi

          if [ -z "$IMAGE_TAG" ]; then
            echo "No image tag available to deploy."
            exit 1
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Deploying image tag $IMAGE_TAG"
      - name: helm upgrade --install
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$HELM_CHART_PATH/values-staging.yaml" \
            --set images.enroller.tag="$IMAGE_TAG" \
            --set images.scep.tag="$IMAGE_TAG" \
            --atomic --timeout 15m --wait
      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "::group::helm history"
          helm history "$HELM_RELEASE_NAME" -n "$NAMESPACE" --max 10 || true
          echo "::endgroup::"
          echo "::group::workload resources"
          kubectl -n "$NAMESPACE" get deploy,svc,ingress,pvc,externalsecret,cluster.postgresql.cnpg.io,pods -o wide || true
          echo "::endgroup::"
          echo "::group::pods"
          kubectl -n "$NAMESPACE" describe pods || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp 2>&1 | tail -100 || true
          echo "::endgroup::"
