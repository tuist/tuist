name: Pulse Deployment (retired)

# Retain the old caller interface without granting it deployment access.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Retired input; no version will be deployed
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  retired:
    name: Retired — no runtime deployed
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The old Pulse runtime is retired. Use GreptimeDB Replacement; no deployment was performed.'
