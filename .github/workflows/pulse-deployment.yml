name: Pulse Deployment

on:
  pull_request:
    paths:
      - infra/helm/pulse/**
      - infra/helm/pulse-grafana/**
      - .github/workflows/pulse-deployment.yml
      - .github/scripts/pulse-*
      - .github/scripts/pulse-readiness*
      # The readiness test also pins each environment's Pulse reader account.
      - infra/helm/tuist/values-managed-*.yaml
      - infra/helm/tuist/templates/server-config-external-secrets.yaml
      - .github/workflows/server-deployment.yml
      - infra/helm/k8s-monitoring/values-staging.yaml
      - infra/helm/k8s-monitoring/values-canary.yaml
      - infra/helm/k8s-monitoring/values-production.yaml
      - .github/scripts/openobserve-capacity.mjs
      - .github/scripts/openobserve-storage-check.sh
      - .github/scripts/openobserve-preflight.test.mjs
  push:
    branches: [main]
    paths:
      - infra/helm/pulse/**
      - infra/helm/pulse-grafana/**
      - .github/workflows/pulse-deployment.yml
      - .github/scripts/pulse-*
      - .github/scripts/pulse-readiness*
      # The readiness test also pins each environment's Pulse reader account.
      - infra/helm/tuist/values-managed-*.yaml
      - infra/helm/tuist/templates/server-config-external-secrets.yaml
      - .github/workflows/server-deployment.yml
      - infra/helm/k8s-monitoring/values-staging.yaml
      - infra/helm/k8s-monitoring/values-canary.yaml
      - infra/helm/k8s-monitoring/values-production.yaml
      - .github/scripts/openobserve-capacity.mjs
      - .github/scripts/openobserve-storage-check.sh
      - .github/scripts/openobserve-preflight.test.mjs
  workflow_dispatch:
    inputs:
      environment:
        description: Managed target (canary/production install the private backend only)
        required: true
        type: choice
        options: [staging, canary, production]
      dashboard:
        description: Enable readonly dashboard and write-only ingestion identities
        type: boolean
        default: false
      verify_telemetry:
        description: Require recent real collector telemetry in Pulse (requires dashboard)
        type: boolean
        default: false
      inspect_readers:
        description: Staging only. Also report non-secret account enrollment and serving images during backend qualification
        type: boolean
        default: false
      reset:
        description: Delete this environment's Pulse release, volumes and S3 data, then install it from empty. Loses all Pulse history.
        type: boolean
        default: false
  # pulse-production-deployment.yml's continuous deploy legs.
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      dashboard:
        type: boolean
        default: false
      verify_telemetry:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm jq yq node"
          cache: "false"
      # The newest Pulse canary this commit contains, the way Kura's deploy legs
      # resolve kura@ canaries (server-deployment.yml). Commits without one keep
      # the chart's pinned image. Validation runs the image the deploy job
      # installs, so tests of new Pulse behavior pass once its canary exists.
      - id: resolve
        run: |
          set -euo pipefail
          version="$(git tag --list 'pulse@*' --merged HEAD \
            | sed 's|^pulse@||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$' \
            | sort -V | tail -n1 || true)"
          if [[ -z "$version" ]]; then
            echo "image=$(yq '.image' infra/helm/pulse/values.yaml)" >> "$GITHUB_OUTPUT"
            echo "No pulse@ canary in ${GITHUB_SHA}; using the chart's pinned image." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "image=ghcr.io/tuist/pulse:${version}" >> "$GITHUB_OUTPUT"
          echo "Using ghcr.io/tuist/pulse:${version}, the newest canary in ${GITHUB_SHA}." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate backend and shared prerequisites
        run: |
          set -euo pipefail
          bash infra/helm/pulse/test-managed.sh
          helm lint infra/helm/pulse-grafana -n observability
          helm template pulse-grafana-staging infra/helm/pulse-grafana -n observability > /dev/null
          python3 -m venv "$RUNNER_TEMP/pulse-grafana-tests"
          "$RUNNER_TEMP/pulse-grafana-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/pulse-grafana-tests/bin/python" infra/helm/pulse-grafana/test_chart.py
          bash -n .github/scripts/pulse-datanode-rollout.sh
          bash -n .github/scripts/pulse-probe.sh
          bash -n .github/scripts/pulse-metric-split.sh
          bash -n .github/scripts/pulse-gc-flip.sh
          node --check .github/scripts/pulse-smoke.mjs
          node --check .github/scripts/pulse-live-smoke.mjs
          node --test .github/scripts/openobserve-preflight.test.mjs
          node --test .github/scripts/pulse-storage.test.mjs
          node --test .github/scripts/pulse-live-smoke.test.mjs
          node --test .github/scripts/pulse-readiness.test.mjs
          helm repo add grafana https://grafana.github.io/helm-charts
          helm dependency build infra/helm/k8s-monitoring
          bash .github/scripts/pulse-collectors.test.sh
          mkdir -p "$RUNNER_TEMP/pulse-chart"
          helm package infra/helm/pulse --destination "$RUNNER_TEMP/pulse-chart"
      - name: Run the Sentry errors and Symptoms inputs pipelines in the pinned Pulse release
        run: |
          set -euo pipefail
          printf 'pilot=ci\n' > "$RUNNER_TEMP/pulse-users"
          chmod 644 "$RUNNER_TEMP/pulse-users"
          docker run -d --name pulse -p 127.0.0.1:4000:4000 -v "$RUNNER_TEMP/pulse-users:/users:ro" \
            "${{ steps.resolve.outputs.image }}" \
            standalone start --http-addr 0.0.0.0:4000 --user-provider=static_user_provider:file:/users
          for _ in $(seq 60); do
            curl -fsS -u pilot:ci 'http://127.0.0.1:4000/v1/sql?sql=SELECT%201' > /dev/null 2>&1 && break
            sleep 2
          done
          PULSE_URL=http://127.0.0.1:4000 PULSE_AUTH=pilot:ci node infra/helm/pulse/test-sentry-errors.mjs
          PULSE_URL=http://127.0.0.1:4000 PULSE_AUTH=pilot:ci node infra/helm/pulse/test-symptoms-inputs.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One cascade run calls this workflow once per environment.
          name: pulse-chart-${{ inputs.environment || github.event_name }}
          path: ${{ runner.temp }}/pulse-chart/*.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: inputs.environment && github.ref == 'refs/heads/main' && github.repository == 'tuist/tuist'
    needs: validate
    runs-on: tuist-linux
    timeout-minutes: 60
    environment:
      name: server-k8s-${{ inputs.environment }}
    concurrency:
      group: server-deploy-${{ inputs.environment }}-observability
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DASHBOARD_ENABLED: ${{ inputs.dashboard }}
      KUBECONFIG: ${{ github.workspace }}/.kube/pulse-config
      STORAGE_POD: pulse-storage-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_POD: pulse-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      # The chart arguments every render and upgrade below shares.
      PULSE_CHART_ARGS: ${{ inputs.environment == 'production' && '-f infra/helm/pulse/values-production.yaml ' || '' }}--set environment=${{ inputs.environment }},storage.bucket=tuist-pulso-${{ inputs.environment }},dashboard.enabled=${{ inputs.dashboard }}${{ format(',image={0}', needs.validate.outputs.image) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl jq yq node"
          cache: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pulse-chart-${{ inputs.environment }}
          path: ${{ runner.temp }}/pulse-deploy
      - name: Render qualified chart
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/pulse-deploy"
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          # The reader inspection reads staging's namespace and account only.
          if [[ "$DEPLOY_ENV" != staging && '${{ inputs.inspect_readers }}' == true ]]; then
            echo '::error::inspect_readers is staging-only.'
            exit 1
          fi
          if [[ '${{ inputs.verify_telemetry }}' == true && "$DASHBOARD_ENABLED" != true ]]; then
            echo '::error::Telemetry verification reads with the dashboard identity.'
            exit 1
          fi
          read -ra chart_args <<< "$PULSE_CHART_ARGS"
          helm template pulse "$dir/tuist-pulse-0.1.0.tgz" -n observability "${chart_args[@]}" > "$dir/rendered.yaml"
          yq ea -o=json -I=0 '.' "$dir/rendered.yaml" | jq -s 'map(select(. != null))' > "$dir/resources.json"
          # Staging and canary may still run the standalone backend; it moves to
          # the cluster with both running side by side (see the install step).
          if [[ "$DEPLOY_ENV" != production ]]; then
            helm template pulse "$dir/tuist-pulse-0.1.0.tgz" -n observability "${chart_args[@]}" \
              --set migration.standalone=serving | yq ea -o=json -I=0 '.' | jq -s 'map(select(. != null))' > "$dir/migration.json"
          fi
      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
      - name: Load selected deployment identity in CI only
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          case "$DEPLOY_ENV" in staging|canary|production) ;; *) exit 1 ;; esac
          op document get "kubeconfig: tuist-$DEPLOY_ENV" --vault "tuist-k8s-$DEPLOY_ENV" --output "$KUBECONFIG"
      - name: Inspect staging reader identity without changing enrollment
        if: inputs.inspect_readers
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENV" == staging ]]
          kubectl -n tuist-staging get deployments -l app.kubernetes.io/component=server \
            -o custom-columns=NAME:.metadata.name,IMAGES:.spec.template.spec.containers[*].image
          pod=$(kubectl -n tuist-staging get pods -l app.kubernetes.io/component=server -o json | jq -er '
            [.items[] | select(.metadata.deletionTimestamp == null and
              any(.status.conditions[]?; .type == "Ready" and .status == "True"))][0].metadata.name')
          # Capture runtime chatter/errors privately; print only typed IDs and
          # booleans. Even a credential-bearing endpoint must not reach logs.
          umask 077
          inspection="$RUNNER_TEMP/pulse-deploy/reader-inspection"
          if ! kubectl -n tuist-staging exec "$pod" -c server -- /app/bin/tuist rpc '
            account = Tuist.Accounts.get_account_by_handle("tuist") || raise "staging tuist account missing"
            config = Application.get_env(:tuist, :pulse, [])
            IO.puts("STAGING_READER_INSPECTION=" <> Jason.encode!(%{
              account_id: account.id,
              enrolled_account_id: Keyword.get(config, :account_id),
              pulse_reader_available: Code.ensure_loaded?(Tuist.Pulse) and function_exported?(Tuist.Pulse, :query, 4),
              expected_endpoint: Keyword.get(config, :base_url) == "http://pulse.observability.svc.cluster.local:4000",
              pulse_flag: FunWithFlags.enabled?(:pulse, for: account)
            }))' > "$inspection.out" 2> "$inspection.err"; then
            echo '::error::Staging reader inspection failed; raw runtime output is withheld.'
            exit 1
          fi
          sed -n 's/^STAGING_READER_INSPECTION=//p' "$inspection.out" | jq -es '
            select(length == 1) | .[0] |
            select((.account_id | type) == "number" and
              (.enrolled_account_id == null or (.enrolled_account_id | type) == "number") and
              ([.pulse_reader_available,
                .expected_endpoint, .pulse_flag] | all(type == "boolean"))) |
            {account_id, enrolled_account_id, pulse_reader_available,
              expected_endpoint, pulse_flag}'
          rm -f "$inspection.out" "$inspection.err"
          helm history pulse -n observability -o json | jq '[.[] | {revision, chart, status}]'
      - name: Check prerequisites, ownership and capacity before creating backend resources
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          kubectl --request-timeout=10s get --raw /version > /dev/null
          kubectl get namespace observability > /dev/null
          kubectl get storageclass hcloud-volumes > /dev/null
          kubectl wait --for=condition=Ready clustersecretstore/onepassword --timeout=60s
          # Collectors authenticate with the dashboard Secret's ingest identity.
          if [[ "$DASHBOARD_ENABLED" != true ]] &&
            kubectl -n observability get externalsecret pulse-dashboard-auth > /dev/null 2>&1; then
            echo '::error::Cannot remove the identities collectors and readers use.'
            exit 1
          fi
          # Pulse reads only X-Pulse-* headers; collectors deployed before they
          # sent them lose every log and trace pipeline. Deploy the server first.
          if kubectl -n observability get configmaps -o json | jq -e '
            any(.items[] | select(.metadata.name | startswith("k8s-monitoring")) | (.data // {})[];
              test("pulse\\.observability") and (test("X-Pulse-DB-Name") | not))' > /dev/null; then
            echo '::error::Live collectors write to Pulse without X-Pulse-* headers; deploy the server to this environment first.'
            exit 1
          fi
          # A standalone backend stays up next to the new cluster until readers
          # move; the side-by-side render covers both.
          planned="$dir/resources.json"
          if [[ -n "$(kubectl -n observability get statefulset pulse --ignore-not-found -o name)" ]]; then
            if [[ ! -f "$dir/migration.json" ]]; then
              echo '::error::Only staging and canary migrate from a standalone backend.'
              exit 1
            fi
            planned="$dir/migration.json"
            echo 'MIGRATE_STANDALONE=true' >> "$GITHUB_ENV"
          fi
          jq -r '.[] | [.kind, .metadata.name] | @tsv' "$planned" > "$dir/resources.tsv"
          while IFS=$'\t' read -r kind name; do
            case "$kind" in ConfigMap|Service|StatefulSet|Deployment|PodDisruptionBudget|ExternalSecret|NetworkPolicy|CiliumNetworkPolicy) ;; *) exit 1 ;; esac
            existing=$(kubectl -n observability get "$kind" "$name" --ignore-not-found \
              -o 'jsonpath={.metadata.name}{"\t"}{.metadata.annotations.meta\.helm\.sh/release-name}{"\t"}{.metadata.annotations.meta\.helm\.sh/release-namespace}{"\t"}{.metadata.labels.app\.kubernetes\.io/managed-by}')
            if [[ -n "$existing" && "$existing" != "$(printf '%s\tpulse\tobservability\tHelm' "$name")" ]]; then
              echo "::error::Pulse resource ownership conflict: $kind/$name"
              exit 1
            fi
          done < "$dir/resources.tsv"
          kubectl -n observability get externalsecrets -o json | jq -e '
            all(.items[]; (.spec.target.name // .metadata.name) != "pulse-credentials" or
              .metadata.name == "pulse-credentials") and
            all(.items[]; (.spec.target.name // .metadata.name) != "pulse-dashboard-auth" or
              .metadata.name == "pulse-dashboard-auth") and
            all(.items[]; (.spec.target.name // .metadata.name) != "pulse-auth")' > /dev/null
          kubectl get nodes -l node.cluster.x-k8s.io/pool=general -o json > "$dir/nodes.json"
          kubectl get pods -A -o json > "$dir/pods.json"
          # An upgrade replaces this release's running pods: count them once.
          export CAPACITY_NAMESPACE=observability
          # The minutes-long side-by-side phase only has to fit now.
          if [[ "$planned" != "$dir/resources.json" ]]; then
            node .github/scripts/openobserve-capacity.mjs "$dir/nodes.json" "$dir/pods.json" "$planned"
          fi
          # The cluster must stay schedulable after losing any one node.
          CAPACITY_TOLERATE_NODE_LOSS=1 \
            node .github/scripts/openobserve-capacity.mjs "$dir/nodes.json" "$dir/pods.json" "$dir/resources.json"
          rm -f "$dir/nodes.json" "$dir/pods.json"
      - name: Verify shared S3 lifecycle, privacy and isolated prefix access
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          # The probe gets its own run-scoped copy of the chart's storage keys.
          # It must work before the first install, when pulse-credentials is missing.
          jq -e --arg name "$STORAGE_POD" '
            [.[] | select(.kind == "ExternalSecret" and .metadata.name == "pulse-credentials")] |
            select(length == 1) | .[0] |
            select([.spec.data[].secretKey] == ["accessKey", "secretKey"]) |
            {apiVersion, kind, metadata:{name:$name, namespace:"observability"}, spec:{
              refreshInterval:"0", secretStoreRef:.spec.secretStoreRef, data:.spec.data,
              target:{name:$name, creationPolicy:"Owner", template:{engineVersion:"v2", data:{
                AWS_ACCESS_KEY_ID:"{{ .accessKey | trim }}", AWS_SECRET_ACCESS_KEY:"{{ .secretKey | trim }}"}}}}}
          ' "$dir/resources.json" > "$dir/storage-credentials.json"
          kubectl create -f "$dir/storage-credentials.json" > /dev/null
          kubectl -n observability wait --for=condition=Ready "externalsecret/$STORAGE_POD" --timeout=60s
          jq -n --arg name "$STORAGE_POD" --arg run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$DEPLOY_ENV" --arg environment "$DEPLOY_ENV" \
            --rawfile script .github/scripts/pulse-storage-check.sh '
            {apiVersion:"v1",kind:"Pod",metadata:{name:$name,namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:300,automountServiceAccountToken:false,
              nodeSelector:{"node.cluster.x-k8s.io/pool":"general"},
              securityContext:{runAsNonRoot:true,runAsUser:65532,fsGroup:65532,seccompProfile:{type:"RuntimeDefault"}},
              volumes:[{name:"scratch",emptyDir:{sizeLimit:"1Mi"}}],
              containers:[{name:"probe",image:"curlimages/curl:8.12.1",command:["sh","-c",$script],
                securityContext:{allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"]}},
                volumeMounts:[{name:"scratch",mountPath:"/tmp"}],
                resources:{requests:{cpu:"25m",memory:"32Mi"},limits:{memory:"64Mi"}},
                envFrom:[{secretRef:{name:$name}}],
                env:[{name:"DEPLOY_ENV",value:$environment},{name:"STORAGE_PREFIX",value:"pulse"},
                  {name:"CHECK_RUN",value:$run}]
              }]}}
          ' > "$RUNNER_TEMP/pulse-deploy/storage.json"
          kubectl create -f "$RUNNER_TEMP/pulse-deploy/storage.json" > /dev/null
          deadline=$((SECONDS + 300))
          phase=Pending
          while ((SECONDS < deadline)); do
            phase=$(kubectl --request-timeout=10s -n observability get pod "$STORAGE_POD" -o jsonpath='{.status.phase}')
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 5
          done
          # Only our credential-safe prerequisite output, not application logs.
          kubectl -n observability logs "$STORAGE_POD" || true
          [[ "$phase" == Succeeded ]]
          kubectl -n observability delete pod "$STORAGE_POD" --wait=true --timeout=30s > /dev/null
          kubectl -n observability delete externalsecret "$STORAGE_POD" --wait=true --timeout=30s > /dev/null
      # Dispatch only. Pulse fixes each region's WAL topic and on-disk names at
      # creation, so moving them means starting from empty. Collectors buffer
      # and retry while the release is gone; the identities (pulse-auth and the
      # ExternalSecrets' 1Password items) survive and are reused.
      - name: Reset the backend to empty
        if: inputs.reset
        env:
          AWS_CLI_IMAGE: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          if [[ -n "$(kubectl -n observability get statefulset pulse --ignore-not-found -o name)" ]]; then
            echo '::error::Reset only replaces the cluster topology, not a standalone backend.'
            exit 1
          fi
          helm uninstall pulse -n observability --ignore-not-found --wait --timeout 10m
          kubectl -n observability delete pvc -l app.kubernetes.io/instance=pulse --wait=true --timeout=5m
          name="$STORAGE_POD-reset"
          jq --arg name "$name" '.metadata.name = $name | .spec.target.name = $name' \
            "$dir/storage-credentials.json" | kubectl create -f - > /dev/null
          kubectl -n observability wait --for=condition=Ready "externalsecret/$name" --timeout=60s
          # Only this environment's root: management shares production's
          # bucket under management/.
          jq -n --arg name "$name" --arg image "$AWS_CLI_IMAGE" --arg bucket "tuist-pulso-$DEPLOY_ENV" '
            {apiVersion:"v1",kind:"Pod",metadata:{name:$name,namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:1800,automountServiceAccountToken:false,
              nodeSelector:{"node.cluster.x-k8s.io/pool":"general"},
              securityContext:{runAsNonRoot:true,runAsUser:65532,fsGroup:65532,seccompProfile:{type:"RuntimeDefault"}},
              volumes:[{name:"scratch",emptyDir:{sizeLimit:"64Mi"}}],
              containers:[{name:"reset",image:$image,command:["sh","-ec",
                ("aws s3 rm s3://" + $bucket + "/pulse/ --recursive --only-show-errors\n" +
                 "left=$(aws s3 ls s3://" + $bucket + "/pulse/ --recursive | head -n 1)\n" +
                 "test -z \"$left\"\n" +
                 "echo PASS: emptied s3://" + $bucket + "/pulse/")],
                securityContext:{allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"]}},
                volumeMounts:[{name:"scratch",mountPath:"/tmp"}],
                resources:{requests:{cpu:"100m",memory:"128Mi"},limits:{memory:"256Mi"}},
                envFrom:[{secretRef:{name:$name}}],
                env:[{name:"HOME",value:"/tmp"},{name:"AWS_REGION",value:"auto"},
                  {name:"AWS_ENDPOINT_URL",value:"https://t3.storage.dev"}]
              }]}}' | kubectl create -f - > /dev/null
          deadline=$((SECONDS + 1800))
          phase=Pending
          while ((SECONDS < deadline)); do
            phase=$(kubectl --request-timeout=10s -n observability get pod "$name" -o jsonpath='{.status.phase}')
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 10
          done
          kubectl -n observability logs "$name" | tail -n 20 || true
          kubectl -n observability delete pod "$name" --wait=true --timeout=30s > /dev/null
          kubectl -n observability delete externalsecret "$name" --wait=true --timeout=30s > /dev/null
          [[ "$phase" == Succeeded ]]
          echo "Reset Pulse in $DEPLOY_ENV: release, volumes and s3://tuist-pulso-$DEPLOY_ENV/pulse/ removed." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bootstrap pilot authentication without rotating an existing identity
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/pulse-deploy"
          printf 'pilot=%s\n' "$(openssl rand -hex 32)" > "$dir/passwd"
          if ! kubectl -n observability create secret generic pulse-auth --from-file=passwd="$dir/passwd" > "$dir/auth.log" 2>&1; then
            grep -q 'secrets "pulse-auth" already exists' "$dir/auth.log"
          fi
          rm -f "$dir/passwd" "$dir/auth.log"
      - name: Prepare the smoke probe
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          jq -n --arg name "$SMOKE_POD" --arg run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$DEPLOY_ENV" --arg dashboard "$DASHBOARD_ENABLED" --arg environment "$DEPLOY_ENV" \
            --rawfile script .github/scripts/pulse-smoke.mjs '
            {apiVersion:"v1",kind:"Pod",metadata:{name:$name,namespace:"observability"},spec:{
              restartPolicy:"Never",activeDeadlineSeconds:180,automountServiceAccountToken:false,
              nodeSelector:{"node.cluster.x-k8s.io/pool":"general"},
              securityContext:{runAsNonRoot:true,runAsUser:1000,fsGroup:1000,seccompProfile:{type:"RuntimeDefault"}},
              volumes:([{name:"auth",secret:{secretName:"pulse-auth",defaultMode:288}}] +
                if $dashboard == "true" then [{name:"dashboard",secret:{secretName:"pulse-dashboard-auth",defaultMode:288}}] else [] end),
              containers:[{name:"probe",image:"node:22.14.0-alpine3.21",command:["node","--input-type=module","-e",$script],
                securityContext:{allowPrivilegeEscalation:false,readOnlyRootFilesystem:true,capabilities:{drop:["ALL"]}},
                volumeMounts:([{name:"auth",mountPath:"/auth",readOnly:true}] +
                  if $dashboard == "true" then [{name:"dashboard",mountPath:"/dashboard",readOnly:true}] else [] end),
                resources:{requests:{cpu:"25m",memory:"32Mi"},limits:{memory:"128Mi"}},
                env:[{name:"PULSE_URL",value:"http://pulse.observability:4000"},{name:"DEPLOY_ENV",value:$environment},
                  {name:"SMOKE_RUN",value:$run},{name:"PULSE_AUTH_FILE",value:"/auth/passwd"}] +
                  if $dashboard == "true" then [{name:"PULSE_DASHBOARD_AUTH_FILE",value:"/dashboard/passwd"}] else [] end
              }]}}
          ' > "$dir/native.json"
          jq --rawfile pipeline infra/helm/pulse/loki-otlp.yaml \
            --rawfile errors_table infra/helm/pulse/errors.sql \
            --rawfile errors_pipeline infra/helm/pulse/sentry-errors.yaml \
            --rawfile error_issues infra/helm/pulse/error-issues.sql \
            --rawfile sessions_table infra/helm/pulse/sessions.sql \
            --rawfile symptoms infra/helm/pulse/symptoms.sql \
            '.spec.containers[0].env += [{name:"PULSE_LOKI_PIPELINE",value:$pipeline},
              {name:"PULSE_ERRORS_TABLE",value:$errors_table},{name:"PULSE_ERRORS_PIPELINE",value:$errors_pipeline},
              {name:"PULSE_ERROR_ISSUES",value:$error_issues},{name:"PULSE_SESSIONS_TABLE",value:$sessions_table},
              {name:"PULSE_SYMPTOMS_SQL",value:$symptoms}]' \
            "$dir/native.json" > "$dir/smoke.json"
      - name: Install private backend, retaining state on failure
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          read -ra chart_args <<< "$PULSE_CHART_ARGS"
          upgrade() {
            # pulse-datanode-rollout.sh patches the datanode partition; after an
            # interrupted drain the chart must take it back, and the script resumes.
            if ! helm upgrade --install pulse "$dir/tuist-pulse-0.1.0.tgz" "${chart_args[@]}" "$@" \
              -n observability --force-conflicts --timeout 20m --wait > "$dir/helm.log" 2>&1; then
              # Helm's error line names the failing step, not rendered values.
              grep -m1 '^Error' "$dir/helm.log" || true
              echo '::error::Pulse rollout failed; state retained for diagnosis.'
              exit 1
            fi
          }
          if [[ "${MIGRATE_STANDALONE:-}" != true ]]; then
            # A GC switch stops the frontends while metasrv and every datanode
            # restart on it; a rerun resumes an interrupted switch.
            if [[ "$(bash .github/scripts/pulse-gc-flip.sh needed "$dir/resources.json")" == true ]]; then
              bash .github/scripts/pulse-gc-flip.sh begin
              upgrade --set cluster.frontend.stopped=true
              bash .github/scripts/pulse-gc-flip.sh finish
            fi
            upgrade
          else
            # 1. Start the cluster beside the standalone pod, which keeps serving
            # Service `pulse`. The chart keeps that pod's template unchanged.
            standalone() { kubectl -n observability get pod pulse-0 -o jsonpath='{.metadata.uid}/{.status.containerStatuses[0].restartCount}'; }
            before=$(standalone)
            upgrade --set migration.standalone=serving
            if [[ "$(standalone)" != "$before" ]]; then
              echo '::error::The standalone pod restarted while it still served readers.'
              exit 1
            fi
            kubectl -n observability wait --for=condition=Ready externalsecret/pulse-credentials --timeout=60s
            # 2. Qualify the frontends through their own Service before readers move.
            probe="$SMOKE_POD-cluster"
            jq --arg name "$probe" --arg run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$DEPLOY_ENV-cluster" '
              .metadata.name = $name |
              .spec.containers[0].env |= map(
                if .name == "PULSE_URL" then .value = "http://pulse-frontend.observability:4000"
                elif .name == "SMOKE_RUN" then .value = $run else . end)' "$dir/smoke.json" > "$dir/cluster-smoke.json"
            kubectl create -f "$dir/cluster-smoke.json" > /dev/null
            kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$probe" --timeout=180s ||
              { kubectl -n observability logs "$probe" || true; exit 1; }
            kubectl -n observability logs "$probe"
            kubectl -n observability delete pod "$probe" --wait=true --timeout=30s > /dev/null
            # 3. Move Service `pulse` to the frontends. Standalone stays until the
            # cluster passes the checks below; a failure moves readers back.
            echo 'MIGRATION_PHASE=draining' >> "$GITHUB_ENV"
            upgrade --set migration.standalone=draining
            kubectl -n observability get endpointslices -l kubernetes.io/service-name=pulse -o json | jq -e '
              [.items[].endpoints[]] | length >= 2 and
              all(.[]; .targetRef.name | startswith("pulse-frontend-"))' > /dev/null
            # A Service only routes new connections: collectors keep writing to the
            # standalone pod over their keep-alive connections. Restarting it makes
            # every client reconnect through the Service; the StatefulSet recreates
            # it on the same volume for the rollback below.
            kubectl -n observability delete pod pulse-0 --wait=true --timeout=120s
            echo "Moved Service pulse from the standalone pod to the cluster frontends." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Spread regions over the datanodes before they restart: region
          # failover never moves regions back, and every restart below keeps
          # the placement it finds.
          bash .github/scripts/pulse-datanode-rollout.sh rebalance
          # Held datanodes do not restart with the upgrade; this restarts them
          # one at a time with their regions moved away first.
          bash .github/scripts/pulse-datanode-rollout.sh
          kubectl -n observability wait --for=condition=Ready externalsecret/pulse-credentials --timeout=60s
          if [[ "$DASHBOARD_ENABLED" == true ]]; then
            kubectl -n observability wait --for=condition=Ready externalsecret/pulse-dashboard-auth --timeout=60s
          fi
      - name: Require OTLP metrics, error logs and traces, then reread after restart without rewriting
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          kubectl create -f "$dir/smoke.json" > /dev/null
          kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=180s ||
            { kubectl -n observability logs "$SMOKE_POD" || true; exit 1; }
          kubectl -n observability logs "$SMOKE_POD"
          kubectl -n observability delete pod "$SMOKE_POD" --wait=true --timeout=30s > /dev/null
          # Reread after restarting every stateful process that held the data.
          if kubectl -n observability get statefulset pulse-datanode > /dev/null 2>&1; then
            workloads=(statefulset/pulse-datanode deployment/pulse-frontend)
          else
            workloads=(statefulset/pulse)
          fi
          for workload in "${workloads[@]}"; do
            kubectl -n observability rollout restart "$workload"
            if [[ "$workload" == statefulset/pulse-datanode ]]; then
              bash .github/scripts/pulse-datanode-rollout.sh
            fi
            kubectl -n observability rollout status "$workload" --timeout=600s
          done
          jq '.spec.containers[0].env += [{name:"SMOKE_READ_ONLY",value:"true"}]' "$dir/smoke.json" > "$dir/read.json"
          kubectl create -f "$dir/read.json" > /dev/null
          kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=180s ||
            { kubectl -n observability logs "$SMOKE_POD" || true; exit 1; }
          kubectl -n observability logs "$SMOKE_POD"
      - name: Verify recent real collector telemetry
        if: inputs.verify_telemetry
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          kubectl -n observability delete pod "$SMOKE_POD" --wait=true --timeout=30s > /dev/null
          jq --rawfile script .github/scripts/pulse-live-smoke.mjs \
            '.spec.activeDeadlineSeconds = 360 | .spec.containers[0].command = ["node","--input-type=module","-e",$script]' \
            "$dir/smoke.json" > "$dir/live-smoke.json"
          kubectl create -f "$dir/live-smoke.json" > /dev/null
          kubectl -n observability wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=360s ||
            { kubectl -n observability logs "$SMOKE_POD" || true; exit 1; }
          kubectl -n observability logs "$SMOKE_POD"
      - name: Remove the standalone backend after the cluster qualified
        if: env.MIGRATE_STANDALONE == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          read -ra chart_args <<< "$PULSE_CHART_ARGS"
          echo 'MIGRATION_PHASE=retiring' >> "$GITHUB_ENV"
          if ! helm upgrade pulse "$dir/tuist-pulse-0.1.0.tgz" "${chart_args[@]}" \
            -n observability --force-conflicts --timeout 20m --wait > "$dir/helm.log" 2>&1; then
            grep -m1 '^Error' "$dir/helm.log" || true
            echo '::error::Removing the standalone backend failed; readers stay on the cluster.'
            exit 1
          fi
          kubectl -n observability wait --for=delete pod/pulse-0 --timeout=120s
          [[ -z "$(kubectl -n observability get statefulset pulse --ignore-not-found -o name)" ]]
          # Helm never deletes a StatefulSet's claims; the old WAL volume stays.
          kubectl -n observability get pvc data-pulse-0 -o name
          echo 'Removed the standalone StatefulSet; kept its volume claim data-pulse-0.' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Move readers back to the standalone backend
        if: failure() && env.MIGRATION_PHASE == 'draining'
        run: |
          set -euo pipefail
          # The previous revision is the side-by-side one, with Service `pulse`
          # on the standalone pod, which kept running throughout.
          helm rollback pulse -n observability --wait --timeout 10m
          kubectl -n observability get endpointslices -l kubernetes.io/service-name=pulse -o json | jq -e '
            [.items[].endpoints[] | .targetRef.name] == ["pulse-0"]' > /dev/null
          echo '::warning::Readers are back on the standalone backend; the cluster is retained for diagnosis.'
      - name: Install private staging Grafana after backend qualification
        if: inputs.dashboard && inputs.environment == 'staging'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pulse-deploy"
          helm template pulse-grafana-staging infra/helm/pulse-grafana -n observability > "$dir/grafana.yaml"
          yq ea -o=json -I=0 '.' "$dir/grafana.yaml" | jq -s 'map(select(. != null))' > "$dir/grafana.json"
          kubectl get nodes -l node.cluster.x-k8s.io/pool=general -o json > "$dir/nodes.json"
          kubectl get pods -A -o json > "$dir/pods.json"
          node .github/scripts/openobserve-capacity.mjs "$dir/nodes.json" "$dir/pods.json" "$dir/grafana.json"
          rm -f "$dir/nodes.json" "$dir/pods.json"
          helm upgrade --install pulse-grafana-staging infra/helm/pulse-grafana \
            -n observability --wait --timeout 5m
      - name: Sanitized failure diagnostics
        if: failure()
        run: |
          kubectl -n observability get pods -l app.kubernetes.io/instance=pulse \
            -o custom-columns=NAME:.metadata.name,PHASE:.status.phase --no-headers || true
      - name: Remove disposable probes and CI-local files only
        if: always()
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/pulse-deploy"; rm -f "$KUBECONFIG"' EXIT
          if [[ -f "$KUBECONFIG" ]]; then
            kubectl -n observability delete pod "$SMOKE_POD" "$SMOKE_POD-cluster" "$STORAGE_POD" --ignore-not-found --wait=true --timeout=30s
            kubectl -n observability delete pod "$STORAGE_POD-reset" --ignore-not-found --wait=true --timeout=30s
            kubectl -n observability delete pod "pulse-rollout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --ignore-not-found --wait=true --timeout=30s
            kubectl -n observability delete externalsecret "$STORAGE_POD" "$STORAGE_POD-reset" --ignore-not-found --wait=true --timeout=30s
          fi
