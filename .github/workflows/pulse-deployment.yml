name: Pulse Deployment

# Control code always comes from main. Rollbacks consume the released chart,
# image digest and managed overlay from the same immutable source commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published Pulse version to deploy or roll back to (for example 1.39.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        description: "Exact source commit published by the calling release workflow"
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: pulse-deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Verify published Pulse release
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: tuist-linux
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}
      image-digest: ${{ steps.resolve.outputs.image-digest }}
      chart-sha256: ${{ steps.resolve.outputs.chart-sha256 }}
      overlay-sha256: ${{ steps.resolve.outputs.overlay-sha256 }}
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_ACTOR: ${{ github.actor }}
    steps:
      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm jq yq oras"
          cache: "false"
          github_token: ${{ github.token }}
      - name: Resolve and verify release artifacts
        id: resolve
        run: |
          set -euo pipefail
          tag="pulse@$VERSION"
          dir="$RUNNER_TEMP/pulse-release"
          mkdir -p "$dir/assets" "$dir/deploy"
          gh release view "$tag" --repo tuist/tuist --json tagName,isDraft,isPrerelease \
            | jq -e --arg tag "$tag" '.tagName == $tag and .isDraft == false and .isPrerelease == false' >/dev/null
          gh release download "$tag" --repo tuist/tuist --dir "$dir/assets" \
            --pattern pulse-release.json --pattern "pulse-$VERSION.tgz"
          manifest="$dir/assets/pulse-release.json"
          jq -e --arg tag "$tag" --arg version "$VERSION" \
            '.tag == $tag and .version == $version and
             (.source_sha | test("^[0-9a-f]{40}$")) and
             (.image_digest | test("^sha256:[0-9a-f]{64}$")) and
             (.chart_sha256 | test("^[0-9a-f]{64}$"))' "$manifest" >/dev/null
          source_sha=$(jq -r .source_sha "$manifest")
          image_digest=$(jq -r .image_digest "$manifest")
          chart_sha256=$(jq -r .chart_sha256 "$manifest")
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then [[ "$source_sha" == "$EXPECTED_SOURCE_SHA" ]]; fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$source_sha" ]]
          mix_version=$(git show "$source_sha:pulse/mix.exs" \
            | sed -nE 's/^[[:space:]]*version: "([^"]+)",?$/\1/p')
          [[ "$mix_version" == "$VERSION" ]]
          git show "$source_sha:infra/helm/pulse/Chart.yaml" \
            | yq -o=json | jq -e --arg version "$VERSION" \
              '.name == "pulse" and .version == $version and .appVersion == $version' >/dev/null
          # Do not execute scripts/actions from the historical release tree.
          git show "$source_sha:infra/helm/pulse/values-managed-production.yaml" \
            > "$dir/deploy/values-managed-production.yaml"
          echo "$chart_sha256  $dir/assets/pulse-$VERSION.tgz" | sha256sum -c -
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm pull oci://ghcr.io/tuist/charts/pulse --version "$VERSION" --destination "$dir/deploy"
          echo "$chart_sha256  $dir/deploy/pulse-$VERSION.tgz" | sha256sum -c -
          helm show chart "$dir/deploy/pulse-$VERSION.tgz" \
            | yq -o=json | jq -e --arg version "$VERSION" \
              '.name == "pulse" and .version == $version and .appVersion == $version' >/dev/null
          published_digest=$(oras manifest fetch --descriptor "ghcr.io/tuist/pulse:$VERSION" | jq -r .digest)
          [[ "$published_digest" == "$image_digest" ]]
          overlay_sha256=$(sha256sum "$dir/deploy/values-managed-production.yaml" | cut -d' ' -f1)
          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "source-sha=$source_sha"
            echo "image-digest=$image_digest"
            echo "chart-sha256=$chart_sha256"
            echo "overlay-sha256=$overlay_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Retain verified deployment inputs
        uses: actions/upload-artifact@v4
        with:
          name: pulse-deployment-inputs
          path: ${{ runner.temp }}/pulse-release/deploy/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Pulse to Tuist production
    needs: resolve
    runs-on: tuist-linux
    timeout-minutes: 35
    environment:
      name: server-k8s-production
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
      IMAGE_DIGEST: ${{ needs.resolve.outputs.image-digest }}
      CHART_SHA256: ${{ needs.resolve.outputs.chart-sha256 }}
      OVERLAY_SHA256: ${{ needs.resolve.outputs.overlay-sha256 }}
      KUBECONFIG: ${{ github.workspace }}/.kube/pulse-config
      NAMESPACE: pulse
      HELM_RELEASE_NAME: pulse
      SMOKE_POD: pulse-readiness-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl jq"
          cache: "false"
          github_token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pulse-deployment-inputs
          path: ${{ runner.temp }}/pulse-deploy
      - name: Recheck immutable deployment inputs
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$SOURCE_SHA" ]]
          echo "$CHART_SHA256  $RUNNER_TEMP/pulse-deploy/pulse-$VERSION.tgz" | sha256sum -c -
          echo "$OVERLAY_SHA256  $RUNNER_TEMP/pulse-deploy/values-managed-production.yaml" | sha256sum -c -
      - uses: 1password/install-cli-action@v4
      - name: Load deployment kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-production" \
            --vault "tuist-k8s-production" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability
        run: kubectl --request-timeout=10s get --raw /version >/dev/null
      - name: Install published chart and exact image
        run: |
          set -euo pipefail
          # This archive was pulled from the versioned OCI chart and verified
          # against its release checksum. Pin the image digest as well as tag.
          # Keep Helm output private: errors can contain rendered secret wiring.
          if ! helm upgrade --install "$HELM_RELEASE_NAME" "$RUNNER_TEMP/pulse-deploy/pulse-$VERSION.tgz" \
            --values "$RUNNER_TEMP/pulse-deploy/values-managed-production.yaml" \
            --namespace "$NAMESPACE" --create-namespace \
            --set-string image.repository=ghcr.io/tuist/pulse --set-string "image.tag=$VERSION@$IMAGE_DIGEST" \
            --rollback-on-failure --timeout 15m --wait > "$RUNNER_TEMP/pulse-helm.log" 2>&1; then
            echo '::error::Pulse Helm deployment failed; inspect the sanitized rollout status below.'
            exit 1
          fi
      - name: Verify ExternalSecret synchronization
        run: kubectl -n "$NAMESPACE" wait --for=condition=Ready externalsecret/pulse-app --timeout=5m
      - name: Verify combined workload rollout
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deployment/pulse --timeout=5m
          kubectl -n "$NAMESPACE" get deployment pulse -o json \
            | jq -e --arg image "ghcr.io/tuist/pulse:$VERSION@$IMAGE_DIGEST" \
              '.spec.replicas == 1 and ([.spec.template.spec.containers[].image] == [$image])' >/dev/null
          kubectl -n "$NAMESPACE" get service pulse -o json \
            | jq -e '.spec.type == "ClusterIP" and ((.spec.externalIPs // []) | length == 0)' >/dev/null
      - name: Verify private in-cluster readiness
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" run "$SMOKE_POD" --restart=Never --image=curlimages/curl:8.12.1 \
            --overrides='{"spec":{"nodeSelector":{"node.cluster.x-k8s.io/pool":"general"}}}' \
            --command -- curl --fail --silent --show-error --max-time 30 --output /dev/null http://pulse:4000/readyz
          kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$SMOKE_POD" --timeout=2m
      - name: Sanitized failure diagnostics
        if: failure()
        run: |
          # No Secret reads, rendered manifests, describe output, application
          # logs, event messages or Helm descriptions in public CI logs.
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/instance=pulse \
            -o custom-columns=NAME:.metadata.name,PHASE:.status.phase --no-headers || true
          kubectl -n "$NAMESPACE" get deployment pulse \
            -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas || true
          kubectl -n "$NAMESPACE" get externalsecret pulse-app \
            -o custom-columns=NAME:.metadata.name,READY:'.status.conditions[?(@.type=="Ready")].status' || true
          kubectl -n "$NAMESPACE" get events --field-selector type=Warning \
            -o custom-columns=REASON:.reason,KIND:.involvedObject.kind --no-headers | tail -20 || true
      - name: Remove readiness probe and local credentials
        if: always()
        run: |
          set -euo pipefail
          trap 'rm -f "$KUBECONFIG" "$RUNNER_TEMP/pulse-helm.log"' EXIT
          if [[ -f "$KUBECONFIG" ]]; then
            kubectl -n "$NAMESPACE" delete pod "$SMOKE_POD" --ignore-not-found --wait=true --timeout=30s
          fi
