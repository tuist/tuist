name: Android

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - cli/Sources/TuistServer/OpenAPI/server.yml
      - .github/workflows/android.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - android/**
      - cli/Sources/TuistServer/OpenAPI/server.yml
      - .github/workflows/android.yml
  merge_group:

concurrency:
  group: android-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1

defaults:
  run:
    working-directory: android

jobs:
  test:
    name: Test
    runs-on: tuist-linux-large
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    if: |
      github.repository == 'tuist/tuist' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
      - name: Authenticate with Tuist
        run: tuist auth login
      # settings.gradle.kts turns coverage on, so the unit tests report it to tuist/android.
      - id: test
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest
      # Tells the server the commit's coverage is all in once the run reported,
      # failing tests included. A failed signal leaves the commit in progress
      # without turning the run red.
      - name: Signal that the commit's coverage is complete
        if: success() || steps.test.outcome == 'failure'
        continue-on-error: true
        run: ./gradlew tuistCoverageComplete

  test-fork:
    name: Test Fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebugAndroidTest

  build:
    name: Build
    runs-on: tuist-linux-large
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    if: |
      github.repository == 'tuist/tuist' &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
      - name: Authenticate with Tuist
        run: tuist auth login
      - run: ./gradlew assembleDebug
      - name: Share
        run: tuist share app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect bundle
        run: tuist inspect bundle app/build/outputs/apk/debug/app-debug.apk

  build-fork:
    name: Build Fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
