name: Coverage

# Gathers code coverage from full test runs on main, so the coverage trend has
# complete runs to plot: Xcode coverage for the CLI and the app (project
# tuist/tuist), and Mix coverage for the server (project tuist/server, which
# dogfoods `mix tuist.test --cover`). Each half runs only when a commit
# touched what it measures, and each signals its own project's commit
# complete.
#
# Xcode: pull request runs use selective testing and the module cache, which
# leave tests unrun and product code uninstrumented, so their coverage is
# partial and stays out of the trend. The test targets link
# TestCoverageAttribution, so each run also records which files every test
# executed, and the last job tells the server the commit's runs are all in.
#
# Mix: the server's suite runs sharded like server.yml's, against the current
# ClickHouse only, with retries so a flaky test cannot leave the commit
# incomplete; retries never carry --cover, so the coverage is the first pass.
# --export-coverage makes Mix's own coverage step export its data instead of
# failing the job under its 90% threshold.
#
# Nothing depends on this workflow: it only runs after changes land on main, it
# is not a required check, no deploy or release workflow waits on it, and
# notify-failure.yml does not list it.
#
# Dispatched with a `sha`, it collects an earlier commit on main instead, to
# backfill commits that had no run, Xcode and server alike; the server half
# only runs for commits whose tuist_ex reports coverage. Dispatch one at a
# time: each holds two macOS runners for up to two hours. The commit's sources
# are tested with this workflow's tools, because an older pin of the CLI may
# not upload coverage at all, but its .xcode-version is its own, so commits
# before the move to Xcode 27 (f834b57656) cannot run on this image.
on:
  push:
    branches:
      - main
    paths:
      - "cli/TuistCacheEE"
      - "cli/TuistCacheEE/**"
      - "cli/Sources/**"
      - "cli/Tests/**"
      - "cli/Templates/**"
      - "cas-plugin/**"
      - "swifterpm/**"
      - "server/native/xcresult_nif/Sources/XCResultParser/**"
      - "app/**"
      - "*.swift"
      - ".github/workflows/coverage.yml"
      - "mise.toml"
      - "mise.lock"
      - "Tuist/**"
      - ".xcode-version"
      - ".swiftpm/**"
      - "Package.swift"
      - "Package.resolved"
      - "server/**"
      - "tuist_ex/**"
      - "tuist_common/**"
      - ".github/actions/setup-server-mix/**"
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on main to collect coverage for, instead of main's head
        required: false
        type: string

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TUIST_ENABLE_CACHING: true
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_GITHUB_SLSA: 0
  # Xcode code coverage is in early access behind this client flag.
  TUIST_FEATURE_FLAG_COVERAGE: "1"
  # Collects per-test evidence from the linked TestCoverageAttribution package.
  TUIST_COVERAGE_EVIDENCE: "1"

# The Xcode jobs run one at a time on main: a run in progress finishes so its
# coverage lands; commits merged meanwhile queue behind it, and GitHub keeps
# only the newest. A backfill gets a group of its own, or each one dispatched
# would cancel the one queued before it. The groups are per job rather than
# for the whole workflow, so a commit whose Xcode jobs are dropped from the
# queue still gets its server coverage, which needs no queue: its jobs are
# Linux ones and every commit measures in parallel.
jobs:
  # The commit to collect. A backfilled one must be on main: the CLI labels the
  # run with the branch it was dispatched from, so a commit from anywhere else
  # would be reported as main's.
  commit:
    name: Resolve Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'tuist/tuist'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      xcode: ${{ steps.changes.outputs.xcode }}
      server: ${{ steps.changes.outputs.server }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch a backfill from main, so its runs are labelled with main."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Which halves the commit concerns. A push compares with the commit
      # before it, and anything the comparison cannot answer (a new branch, a
      # push of more files than it lists, an API error) runs both. A backfill
      # runs both, the server half only where the commit's tuist_ex can report
      # coverage.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          xcode=true
          server=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename'); then
              if [ "$(wc -l <<< "$files")" -lt 300 ]; then
                shared='^(\.github/workflows/coverage\.yml|mise\.toml|mise\.lock)$'
                grep -qE "$shared|^(cli/(TuistCacheEE|Sources|Tests|Templates)|cas-plugin/|swifterpm/|server/native/xcresult_nif/Sources/XCResultParser/|app/|Tuist/|\.swiftpm/|[^/]+\.swift$|\.xcode-version$|Package\.(swift|resolved)$)" <<< "$files" || xcode=false
                grep -qE "$shared|^(server/|tuist_ex/|tuist_common/|\.github/actions/setup-server-mix/)" <<< "$files" || server=false
              fi
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && \
            ! gh api "repos/$GITHUB_REPOSITORY/contents/tuist_ex/lib/mix/tasks/tuist.coverage.complete.ex?ref=$SHA" --silent 2>/dev/null; then
            echo "::notice::$SHA predates Mix coverage in tuist_ex; its server coverage is not collected."
            server=false
          fi
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

  cli-unit-tests:
    name: CLI Unit Tests
    needs: commit
    runs-on: tuist-macos-27-0
    timeout-minutes: 120
    if: github.repository == 'tuist/tuist' && needs.commit.outputs.xcode == 'true'
    concurrency:
      group: coverage-cli-${{ inputs.sha || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
      TUIST_EE: "1"
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - name: Use this workflow's tools
        if: needs.commit.outputs.sha != github.sha
        # main's mise.toml and mise.lock, and the scripts mise.toml sources, over
        # the older commit's, hidden from git: a run on a dirty checkout keeps
        # its coverage off the commit. The scripts matter: an older
        # cache_ee_env.sh turns the compilation cache back on.
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - name: Initialize TuistCacheEE submodule
        run: bash mise/tasks/cli/ee.sh
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.swift') }}-
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      # Every test runs, and every target is built from sources: selective
      # testing would skip tests and cached binaries carry no coverage.
      # Counters are bumped atomically: tests run in parallel in one process,
      # and plain increments lose counts, which xccov turns into negative,
      # wrapped region counts and lines reported covered that never ran.
      - name: Run tests with coverage
        run: tuist test TuistUnitTests --no-selective-testing --no-binary-cache -- -retry-tests-on-failure -test-iterations 4 -enableCodeCoverage YES 'OTHER_SWIFT_FLAGS=$(inherited) -Xllvm -instrprof-atomic-counter-update-all'

  app-tests:
    name: App Tests
    needs: commit
    runs-on: tuist-macos-27-0
    timeout-minutes: 60
    if: github.repository == 'tuist/tuist' && needs.commit.outputs.xcode == 'true'
    concurrency:
      group: coverage-app-${{ inputs.sha || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - name: Use this workflow's tools
        if: needs.commit.outputs.sha != github.sha
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-app-${{ hashFiles('Package.resolved', 'Package.swift') }}
      # Only the CLI, locked, as the other jobs install it. A full install on a
      # cold cache writes checksums into mise.lock for tools locked without
      # them (erlang, elixir), so the CLI reports the run from a dirty
      # checkout, whose coverage the server leaves out of the commit.
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      # Atomic counters for the same reason as the CLI's run.
      - name: Run tests with coverage
        run: tuist test TuistApp --no-selective-testing --no-binary-cache -- -retry-tests-on-failure -test-iterations 4 -enableCodeCoverage YES 'OTHER_SWIFT_FLAGS=$(inherited) -Xllvm -instrprof-atomic-counter-update-all' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # Only a complete commit joins the coverage trend. A CLI release older than
  # `tuist coverage complete` skips the signal, and the commit stays in progress.
  complete:
    name: Complete Coverage
    needs: [commit, cli-unit-tests, app-tests]
    runs-on: tuist-macos-27-0
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist' && needs.commit.outputs.xcode == 'true'
    concurrency:
      group: coverage-complete-${{ inputs.sha || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - name: Use this workflow's tools
        if: needs.commit.outputs.sha != github.sha
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Signal that the commit's coverage is complete
        # A release without the command still exits 0 for `--help`, printing
        # the root help instead. The command's usage line comes from its path,
        # not its wording, and never wraps at the command's name.
        run: |
          help=$(tuist coverage complete --help 2>/dev/null || true)
          if grep -qE "^USAGE: tuist coverage complete( |$)" <<< "$help"; then
            tuist coverage complete
          else
            echo "::notice::$(tuist version) has no 'tuist coverage complete'; the commit stays in progress until a release with it is pinned."
          fi

  server-build:
    name: Build Server Test Shards
    needs: commit
    runs-on: tuist-linux-large
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist' && needs.commit.outputs.server == 'true'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      TUIST_DEV_ALL_LOCALES: "1"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      reference: ${{ steps.plan.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: ./.github/actions/setup-server-mix
        with:
          restore-mix-cache: "false"
      - name: Restore CLDR locale cache
        uses: actions/cache@v4
        with:
          path: server/_build/cldr/locales
          key: cldr-locales-v1-${{ hashFiles('server/mix.lock') }}
          restore-keys: |
            cldr-locales-v1-
      - name: Prefetch CLDR locale data
        run: mise/tasks/cldr/prefetch-locale-data.sh
      - name: Authenticate with Tuist
        run: mix 'do' deps.compile tuist_ex + tuist.login
      - name: Build and plan shards
        id: plan
        run: |
          mix tuist.test.build --shard-total 4
          echo "reference=$TUIST_SHARD_REFERENCE" >> "$GITHUB_OUTPUT"
        env:
          TUIST_SHARD_REFERENCE: github-${{ github.run_id }}-${{ github.run_attempt }}-coverage-server

  server-tests:
    name: Server Tests
    needs: [commit, server-build]
    runs-on: tuist-linux-large
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.server-build.outputs.matrix) }}
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      TUIST_DEV_ALL_LOCALES: "1"
      TUIST_SHARD_REFERENCE: ${{ needs.server-build.outputs.reference }}
      TUIST_SHARD_INDEX: ${{ matrix.shard }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: ./.github/actions/setup-server-mix
        with:
          mise-install-args: erlang elixir github:ClickHouse/ClickHouse
          restore-mix-cache: "false"
      - name: Start ClickHouse
        run: mise run --no-deps clickhouse:start
      - name: Authenticate and download the test build
        run: mix 'do' deps.compile tuist_ex + tuist.login + tuist.test --prepare-only
      - name: Setup database
        run: mise run --no-deps db:reset
      # A run from a dirty checkout measured code that is not the commit's,
      # so the server leaves its coverage out of the commit. Installing Erlang
      # and Elixir on a cold cache writes their checksums into mise.lock, and
      # `mix deps.get` can rewrite mix.lock; neither changes the server's own
      # code, which is all the coverage measures, so both are put back.
      # Anything else that changed fails here, saying what.
      - name: Check the checkout is clean
        run: |
          git checkout -- ../mise.lock mix.lock
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The checkout changed before the tests ran, so its coverage would be discarded."
            exit 1
          fi
      - name: Run shard ${{ matrix.shard }} with coverage
        run: mix tuist.test --no-download --scheme clickhouse-current --retries 2 --cover --export-coverage shard-${{ matrix.shard }}

  # The server's commit is complete once its shards reported, whatever the
  # Xcode half does: completion is per project.
  complete-server:
    name: Complete Server Coverage
    needs: [commit, server-tests]
    runs-on: tuist-linux
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: ./.github/actions/setup-server-mix
        with:
          restore-mix-cache: "false"
      - name: Signal that the commit's coverage is complete
        run: mix 'do' deps.compile tuist_ex + tuist.login + tuist.coverage.complete
