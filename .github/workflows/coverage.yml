name: Coverage

# Gathers Xcode code coverage from full test runs on main, so the coverage
# trend has complete runs to plot. It runs after each push run of cli.yml on
# main succeeds, at that run's commit (`workflow_run.head_sha`), so the commit's
# own `tuist cache` warm is in place: the runs here read the binary cache's
# coverage variant (TUIST_COVERAGE_ENABLED in mise.toml), whose binaries carry
# coverage counters and record their files under a placeholder the export
# resolves, so a cached target is measured like one built from source. Which
# commits get here is cli.yml's `push` path filter; this workflow has none.
# The test targets link TestCoverageAttribution, so each run also records which
# files every test executed, and the last job tells the server the commit's
# runs are all in. These are the only runs that collect Xcode coverage: every
# other `tuist test` job (pull requests, cli.yml and app.yml on main, the
# deploy acceptance tests) passes `-enableCodeCoverage NO` and keeps selective
# testing, so it reports `coverage_enabled: false` and the server ignores what
# it skipped.
#
# Nothing depends on this workflow: it only runs after changes land on main, it
# is not a required check, no deploy or release workflow waits on it, and
# notify-failure.yml does not list it. A cli.yml run that failed or was
# cancelled triggers nothing, and its commit stays "Not measured".
#
# Dispatched with a `sha`, it collects an earlier commit on main instead, to
# backfill commits that had no run. Dispatch one at a time: each holds two
# macOS runners for up to two hours. A backfilled commit's sources are tested
# with this workflow's tools, because an older pin of the CLI may not upload
# coverage at all, but its .xcode-version is its own, so commits before the
# move to Xcode 27 (f834b57656) cannot run on this image. A commit cli.yml
# triggered is tested with its own tools, the ones its warm used.
on:
  workflow_run:
    workflows:
      - CLI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on main to collect coverage for, instead of main's head
        required: false
        type: string

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TUIST_ENABLE_CACHING: true
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_GITHUB_SLSA: 0
  # Collects per-test evidence from the linked TestCoverageAttribution package.
  TUIST_COVERAGE_EVIDENCE: "1"

# One run at a time for the commits cli.yml triggers. A run in progress
# finishes so its coverage lands; the newest commit merged meanwhile waits
# behind it, and GitHub cancels any older one still pending, so that commit
# stays "Not measured" on the server. Dispatches stay out of that group, each in
# one of its own (keyed by the commit, or main's head when no `sha` is given),
# so a backfill neither replaces a queued commit nor is replaced by one; it can
# run alongside the queue's run.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'coverage-main' || format('coverage-dispatch-{0}', inputs.sha || github.sha) }}
  cancel-in-progress: false

jobs:
  # The commit to collect: the one cli.yml just passed on main, or a dispatch's.
  # cli.yml runs on pull requests and on pushes from anywhere, so a
  # `workflow_run` run goes on only for a push to this repository's main that
  # succeeded. A backfilled commit must be on main: the CLI labels the run with
  # the branch it was dispatched from, so a commit from anywhere else would be
  # reported as main's. A `workflow_run` run is labelled with main, the default
  # branch it runs on.
  commit:
    name: Resolve Commit
    runs-on: tuist-linux
    timeout-minutes: 5
    if: >-
      github.repository == 'tuist/tuist' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$RUN_SHA" ]; then
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SHA" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch a backfill from main, so its runs are labelled with main."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  cli-unit-tests:
    name: CLI Unit Tests
    needs: commit
    runs-on: tuist-macos-27-0
    timeout-minutes: 120
    if: github.repository == 'tuist/tuist'
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
      TUIST_EE: "1"
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Use this workflow's tools
        if: github.event_name == 'workflow_dispatch' && needs.commit.outputs.sha != github.sha
        # main's mise.toml and mise.lock, and the scripts mise.toml sources, over
        # the older commit's, hidden from git: a run on a dirty checkout keeps
        # its coverage off the commit. The scripts matter: an older
        # cache_ee_env.sh turns the compilation cache back on.
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - name: Initialize TuistCacheEE submodule
        run: bash mise/tasks/cli/ee.sh
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.swift') }}-
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Install stable Rust for Cargo reporting fixtures
        uses: ./.github/actions/mise
        env:
          MISE_LOCKED: 0
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
      # Every test runs: selective testing would skip tests. Repository targets
      # come from the coverage variant of the binary cache, which this commit's
      # own cli.yml run warmed before triggering this one; a backfill reads what
      # main's warms still hold and builds the rest from source. The coverage
      # settings come from mise.toml's [env]: the schemes leave their test
      # action's coverage unset and follow TUIST_COVERAGE_ENABLED, which CLIs
      # before tuist/tuist#14404 ignore (a commit pinning one collects no
      # coverage, and `tuist coverage complete` leaves it pending). The CLI
      # makes the coverage counters atomic itself (`AtomicCoverageCounters`):
      # tests run in parallel in one process, and plain increments lose counts.
      # TUIST_COVERAGE_PREFIX_MAPPING keeps Xcode's prefix mapping in coverage
      # builds, so the compilation cache replays across runners; the CLI maps the
      # covered paths back (llvm-cov export plus each target's
      # compilation-prefix-map.json).
      - name: Run tests with coverage
        run: tuist test TuistUnitTests --no-selective-testing -- -retry-tests-on-failure -test-iterations 4

  app-tests:
    name: App Tests
    needs: commit
    runs-on: tuist-macos-27-0
    timeout-minutes: 60
    if: github.repository == 'tuist/tuist'
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Use this workflow's tools
        if: github.event_name == 'workflow_dispatch' && needs.commit.outputs.sha != github.sha
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-app-${{ hashFiles('Package.resolved', 'Package.swift') }}
      # Only the CLI, locked, as the other jobs install it. A full install on a
      # cold cache writes checksums into mise.lock for tools locked without
      # them (erlang, elixir), so the CLI reports the run from a dirty
      # checkout, whose coverage the server leaves out of the commit.
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Run tests with coverage
        run: tuist test TuistApp --no-selective-testing -- -retry-tests-on-failure -test-iterations 4 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # Only a complete commit joins the coverage trend. A CLI release older than
  # `tuist coverage complete` skips the signal, and the commit stays in progress.
  complete:
    name: Complete Coverage
    needs: [commit, cli-unit-tests, app-tests]
    runs-on: tuist-macos-27-0
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist'
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Use this workflow's tools
        if: github.event_name == 'workflow_dispatch' && needs.commit.outputs.sha != github.sha
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Signal that the commit's coverage is complete
        # A release without the command still exits 0 for `--help`, printing
        # the root help instead. The command's usage line comes from its path,
        # not its wording, and never wraps at the command's name.
        run: |
          help=$(tuist coverage complete --help 2>/dev/null || true)
          if grep -qE "^USAGE: tuist coverage complete( |$)" <<< "$help"; then
            tuist coverage complete
          else
            echo "::notice::$(tuist version) has no 'tuist coverage complete'; the commit stays in progress until a release with it is pinned."
          fi
