name: docs.tuist.dev redirects

# docs.tuist.dev is the former VitePress docs site (Cloudflare Pages project
# tuist-docs). It now forwards every path to tuist.dev/docs, where the server
# resolves locales and legacy paths (Tuist.Docs.Redirects).

on:
  push:
    branches:
      - main
    paths:
      - infra/docs-tuist-dev/**
      - .github/workflows/docs-tuist-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-tuist-dev
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Deploy
    runs-on: tuist-linux
    timeout-minutes: 10
    if: github.repository == 'tuist/tuist'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/mise
        with:
          install_args: "node@20.12.0 npm:wrangler@4.30.0"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
      - name: Deploy to Cloudflare Pages
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://tuist/Cloudflare/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://tuist/Cloudflare/CLOUDFLARE_ACCOUNT_ID
        run: >-
          mise exec node@20.12.0 npm:wrangler@4.30.0 -- op run --
          wrangler pages deploy --commit-hash ${{ github.sha }} --branch main
          --project-name tuist-docs infra/docs-tuist-dev
