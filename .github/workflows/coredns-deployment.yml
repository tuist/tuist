name: CoreDNS Deployment

# Reconcile CoreDNS after management-cluster applies and every hour.
# kubeadm can rewrite the CoreDNS add-on during Kubernetes upgrades, so
# the schedule restores the repository-owned Corefile after the cluster
# converges instead of relying only on the initial topology apply.

on:
  push:
    branches:
      - main
    paths:
      - infra/k8s/mgmt/bootstrap/coredns-config.yaml
  workflow_run:
    workflows:
      - Mgmt Cluster Apply
    types:
      - completed
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coredns-deployment
  cancel-in-progress: false

jobs:
  canary:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)
    uses: ./.github/workflows/coredns-environment-deployment.yml
    with:
      environment: canary
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  staging:
    needs: canary
    uses: ./.github/workflows/coredns-environment-deployment.yml
    with:
      environment: staging
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/coredns-environment-deployment.yml
    with:
      environment: production
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
