name: Actions Cache GitHub Fallback

# Temporary staging check, never merged: a key saved only on GitHub restores
# through the mirror (the agent asks GitHub on a miss), and a key saved
# through the mirror restores from the mirror.

on:
  push:
    branches: [benchmark/actions-cache-fallback]

jobs:
  seed:
    runs-on: tuist-staging-linux
    env:
      TUIST_ACTIONS_CACHE: "false"
    outputs:
      sum: ${{ steps.make.outputs.sum }}
    steps:
      - id: make
        run: |
          mkdir -p seeded && head -c 50000000 /dev/urandom > seeded/data
          echo "sum=$(sha256sum seeded/data | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: seeded
          key: fallback-${{ github.run_id }}-github

  through-mirror:
    needs: seed
    runs-on: tuist-staging-linux
    outputs:
      sum: ${{ steps.make.outputs.sum }}
    steps:
      - name: Cache backend
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`results service: ${new URL(process.env.ACTIONS_RESULTS_URL).origin}`)
      - name: Restore the key only GitHub holds
        uses: actions/cache/restore@v4
        with:
          path: seeded
          key: fallback-${{ github.run_id }}-github
          fail-on-cache-miss: true
      - run: test "$(sha256sum seeded/data | cut -d' ' -f1)" = "${{ needs.seed.outputs.sum }}"
      - id: make
        run: |
          mkdir -p mirrored && head -c 50000000 /dev/urandom > mirrored/data
          echo "sum=$(sha256sum mirrored/data | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: mirrored
          key: fallback-${{ github.run_id }}-mirror

  from-mirror:
    needs: through-mirror
    runs-on: tuist-staging-linux
    steps:
      - name: Cache backend
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`results service: ${new URL(process.env.ACTIONS_RESULTS_URL).origin}`)
      # The entry commits once the agent's copy to the store lands.
      - run: sleep 30
      - name: Restore the key only the mirror holds
        uses: actions/cache/restore@v4
        with:
          path: mirrored
          key: fallback-${{ github.run_id }}-mirror
          fail-on-cache-miss: true
      - run: test "$(sha256sum mirrored/data | cut -d' ' -f1)" = "${{ needs.through-mirror.outputs.sum }}"
