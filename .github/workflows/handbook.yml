name: Handbook

on:
  push:
    branches:
      - main
    paths:
      - handbook/**
      - .github/workflows/handbook.yml
      - handbook/aube-lock.yaml
      - handbook/package.json
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - handbook/**
      - .github/workflows/handbook.yml
      - handbook/aube-lock.yaml
      - handbook/package.json
  merge_group:

concurrency:
  group: handbook-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Aube Cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: aube-cache
        with:
          path: |
            ~/.local/share/aube
            ~/.cache/aube
          key: aube-${{ hashFiles('handbook/aube-lock.yaml') }}
      - uses: ./.github/actions/mise
        with:
          working_directory: handbook
      - name: Build handbook
        working-directory: handbook
        run: mise run build
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
        if: github.ref == 'refs/heads/main'
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://tuist/Cloudflare/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://tuist/Cloudflare/CLOUDFLARE_ACCOUNT_ID
          NODE_OPTIONS: --max-old-space-size=8192
        working-directory: handbook
        run: op run -- mise run deploy
