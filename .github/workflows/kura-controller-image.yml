name: Kura Controller Image

on:
  push:
    branches: [main]
    paths:
      - infra/kura-controller/**
      - .github/workflows/kura-controller-image.yml
  pull_request:
    paths:
      - infra/kura-controller/**
      - .github/workflows/kura-controller-image.yml
  workflow_dispatch:
    inputs:
      staging_validation:
        description: Install the controller in the isolated kura-spec98 staging namespace
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/kura-controller

jobs:
  format:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-controller/go.mod
          cache-dependency-path: infra/kura-controller/go.sum
      - name: Check formatting
        working-directory: infra/kura-controller
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  test:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-controller/go.mod
          cache-dependency-path: infra/kura-controller/go.sum
      - name: Test
        working-directory: infra/kura-controller
        run: go test ./...
      - name: Vet
        working-directory: infra/kura-controller
        run: go vet ./...

  build:
    needs: test
    if: github.repository == 'tuist/tuist' && github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/kura-controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=kura-controller
          cache-to: type=gha,mode=max,scope=kura-controller

  staging-validation:
    needs: [format, test, build]
    if: github.repository == 'tuist/tuist' && github.event_name == 'workflow_dispatch' && inputs.staging_validation
    runs-on: tuist-linux
    environment: server-k8s-staging
    concurrency:
      group: kura-spec98-staging-validation
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl"
          cache: "false"
      - uses: 1password/install-cli-action@v4
        with:
          version: 2.31.1
      - name: Load staging deployment identity
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-staging" --vault tuist-k8s-staging --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Install isolated validation controller
        run: bash infra/kura-controller/test/staging/install.sh "sha-${GITHUB_SHA::12}"
      - name: Remove deployment credentials
        if: always()
        run: rm -f "$KUBECONFIG"
