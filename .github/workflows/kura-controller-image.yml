name: Kura Controller Image

on:
  push:
    branches: [main]
    paths:
      - infra/kura-controller/**
      - .github/workflows/kura-controller-image.yml
  pull_request:
    paths:
      - infra/kura-controller/**
      - .github/workflows/kura-controller-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/kura-controller

jobs:
  format:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-controller/go.mod
          cache-dependency-path: infra/kura-controller/go.sum
      - name: Check formatting
        working-directory: infra/kura-controller
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  test:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/kura-controller/go.mod
          cache-dependency-path: infra/kura-controller/go.sum
      - name: Test
        working-directory: infra/kura-controller
        run: go test ./...
      - name: Vet
        working-directory: infra/kura-controller
        run: go vet ./...

  build:
    needs: test
    if: github.repository == 'tuist/tuist' && github.event_name != 'pull_request'
    runs-on: tuist-linux
    strategy:
      matrix:
        include:
          - image: tuist/kura-controller
            dockerfile: infra/kura-controller/Dockerfile
            cache: kura-controller
          - image: tuist/kura-disk-agent
            dockerfile: infra/kura-controller/Dockerfile.disk-agent
            cache: kura-disk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
