# Temporary: does the macOS 27 share bug depend on the guest's point release?
#
# APFS images whose file sits on the VM's virtio-fs share lose writes on
# Golden Gate 27.2 guests (golden-gate-volume-e2e). This boots plain Cirrus
# vanilla guests with Tart on one bare-metal builder, shares a host directory
# the way tart-kubelet shares a cache volume, and runs the same write check
# on every macOS 27 point release we can get:
#   27.0      Cirrus vanilla 27.0
#   27.2      Cirrus vanilla 27.2, the control, running next to every other guest
#   27.2.1    installed from Apple's restore image
#   27.3 b2   installed from Apple's restore image
# Two guests run at once (the most a Mac may run), both writing, and a second
# round puts each guest under memory pressure, which makes the loss likelier.
# Runs only for a pushed commit whose message contains [run].
name: Golden Gate point releases

on:
  push:
    branches: [golden-gate-point-releases]

permissions:
  contents: read

jobs:
  points:
    if: contains(github.event.head_commit.message, '[run]')
    # runner-image-builder-1 is rg4h9-2kjgf: macOS 27.0 like the rack hosts, and the disk to spare.
    runs-on: [self-hosted, macos, bare-metal, runner-image-builder-1]
    timeout-minutes: 200
    env:
      VANILLA: ghcr.io/cirruslabs/macos-golden-gate-vanilla
      WORK: /tmp/gg-points
      # Apple's restore images for VMs (VirtualMac2,1): 27.2.1 (26B131) and
      # 27.3 beta 2 (26C5047e). Run 46028196227 already compared 27.0 with 27.2.
      IPSW_2721: https://updates.cdn-apple.com/2026FallFCS/c202a724-db7e-4d56-917b-110aa0226507/UniversalMac_27.2.1_26B131_Restore.ipsw
      IPSW_273B2: https://updates.cdn-apple.com/2026FallSeed/39fd8acf-0beb-48be-b6eb-4889c1fc3872/UniversalMac_27.3_26C5047e_Restore.ipsw
    steps:
      - uses: actions/checkout@v4
      - name: Host
        run: |
          sw_vers; tart --version; sysctl -n hw.memsize hw.ncpu
          df -h /; tart list
          free=$(df -g / | awk 'NR==2 { print $4 }')
          # At most two vanilla images and two clones exist at once, about
          # 100 GB, all deleted by the last step.
          if [ "$free" -lt 130 ]; then echo "::error::only ${free} GB free"; exit 1; fi
          rm -rf "$WORK"; mkdir -p "$WORK"; touch /tmp/gg-points-start
      # As in macos-xcode-image.yml: the builder's cached ghcr.io credentials
      # don't authorize ghcr.io/cirruslabs/* pulls.
      - name: Pull the vanilla guests
        run: |
          set -euo pipefail
          tart logout ghcr.io || true
          for helper in docker-credential-osxkeychain docker-credential-desktop; do
            if command -v "$helper" >/dev/null 2>&1; then
              printf 'ghcr.io' | "$helper" erase || true
              printf 'https://ghcr.io' | "$helper" erase || true
            fi
          done
          # The runner keeps an inline ghcr.io login in ~/.docker/config.json,
          # which Tart reads from the user's home whatever HOME says and which
          # cannot read Cirrus's public images. Hide that one entry while
          # pulling; the trap and the Clean up step put the file back.
          cfg="$HOME/.docker/config.json"
          if [ -f "$cfg" ] && jq -e '.auths["ghcr.io"]' "$cfg" >/dev/null; then
            cp -p "$cfg" "$WORK/docker-config.json"
            trap 'cp -p "$WORK/docker-config.json" "$cfg" && rm -f "$WORK/docker-config.json"' EXIT
            jq 'del(.auths["ghcr.io"])' "$WORK/docker-config.json" > "$cfg"
          fi
          tart pull "$VANILLA:27.2"
      - name: Run the point releases
        run: |
          set -uo pipefail
          sh=.github/golden-gate-point-releases
          . "$sh/host.sh"
          # UDIF retest: two 27.2 guests, each round interleaving the
          # production sparseimage (control) with read-write UDIF images.
          export FORMATS="sparse udrw udrw-share"
          boot c272 "$VANILLA:27.2" || exit 1
          boot d272 "$VANILLA:27.2" || exit 1
          for rep in 1 2 3 4 5; do pair c272 d272 "$rep"; done
          retire d272
          exit 0
      - name: Results
        if: always()
        run: grep -hE '^(RESULT|TIMING)' "$WORK"/*.log | sort || true
      - name: Clean up
        if: always()
        shell: bash {0}
        run: |
          [ -f "$WORK/docker-config.json" ] && cp -p "$WORK/docker-config.json" "$HOME/.docker/config.json"
          for vm in c272 d272; do tart stop "$vm" 2>/dev/null; tart delete "$vm" 2>/dev/null; done
          tart delete "$VANILLA:27.2" 2>/dev/null
          # Only the restore images this job downloaded.
          [ -f /tmp/gg-points-start ] && find "${TART_HOME:-$HOME/.tart}/cache/IPSWs" -type f -newer /tmp/gg-points-start -print -delete 2>/dev/null
          rm -f /tmp/gg-points-start
          rm -rf "$WORK"; df -h /; true
