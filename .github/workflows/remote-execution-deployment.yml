name: Remote Execution Deployment

# Installs or upgrades the opt-in remote-execution release (execution
# gateways and Firecracker workers) into an environment's sandbox namespace.
# The production deploy cascade calls it after the server and runners
# controller are deployed; it can also be dispatched by hand. It does nothing
# while the environment's values file says `enabled: false`. Accounts pin the
# template tag in their settings (see infra/sandbox-image/remote-execution.md).
# Workers roll out OnDelete and the deploy rolls them itself. Where the
# environment's values enable `workers.vmm.inPlaceUpgrades`, every environment
# rolls them with .github/scripts/sandboxd-upgrade.sh: a daemon image or
# configuration change restarts only the daemon container and the VMs stay in
# vmm; any other change (the template tag, the vmm image) replaces the worker
# once it holds no VM, or after five minutes. Elsewhere `replace_workers` (the
# canary leg of the cascade) replaces the workers not on the new spec, and
# workers stay stale until an operator replaces them.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, canary, production]
      commit_sha:
        description: Commit to build images from (defaults to the dispatched ref)
        required: false
        type: string
      template_image_tag:
        description: Published sandbox template and gateway tag; omit to build from the commit
        required: false
        type: string
      sandboxd_image_tag:
        description: Published sandboxd tag; omit to build from the commit
        required: false
        type: string
      replace_workers:
        description: Replace workers not on the new spec without in-place upgrades (fails their running actions; not production)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      commit_sha:
        required: false
        type: string
      template_image_tag:
        required: false
        type: string
      sandboxd_image_tag:
        required: false
        type: string
      replace_workers:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: remote-execution-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  HELM_CHART_PATH: infra/helm/remote-execution
  HELM_RELEASE_NAME: remote-execution
  NAMESPACE: tuist-sandboxes
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  guard:
    name: Guard production source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.enabled.outputs.enabled }}
    steps:
      - name: Require main for production
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys must run from refs/heads/main. Current ref: ${{ github.ref }}"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          sparse-checkout: infra/helm/remote-execution
      # The environment's values file is the switch: a release it disables
      # is neither built nor installed, so the cascade can always call this.
      - name: Read enabled from the environment values
        id: enabled
        run: |
          set -euo pipefail
          enabled=$(yq '.enabled // false' "$HELM_CHART_PATH/values-managed-${{ inputs.environment }}.yaml")
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "remote execution enabled in ${{ inputs.environment }}: $enabled"

  build-template:
    name: Publish sandbox template and gateway
    needs: guard
    if: needs.guard.outputs.enabled == 'true' && inputs.template_image_tag == ''
    uses: ./.github/workflows/sandbox-image.yml
    with:
      commit_sha: ${{ inputs.commit_sha || github.sha }}

  build-sandboxd:
    name: Publish sandboxd
    needs: guard
    if: needs.guard.outputs.enabled == 'true' && inputs.sandboxd_image_tag == ''
    uses: ./.github/workflows/sandboxd-image.yml
    with:
      commit_sha: ${{ inputs.commit_sha || github.sha }}

  deploy:
    name: Deploy ${{ inputs.environment }}
    needs: [guard, build-template, build-sandboxd]
    if: always() && needs.guard.result == 'success' && needs.guard.outputs.enabled == 'true' && (needs.build-template.result == 'success' || needs.build-template.result == 'skipped') && (needs.build-sandboxd.result == 'success' || needs.build-sandboxd.result == 'skipped')
    runs-on: ubuntu-latest
    # Allow time for the gateway rollout, rollback, rolling workers (each
    # replacement may wait five minutes for its worker to drain) and DNS
    # publication.
    timeout-minutes: 120
    environment:
      name: server-k8s-${{ inputs.environment }}
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      TEMPLATE_IMAGE_TAG: ${{ inputs.template_image_tag || needs.build-template.outputs.image_tag }}
      SANDBOXD_IMAGE_TAG: ${{ inputs.sandboxd_image_tag || needs.build-sandboxd.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked helm kubectl"
          cache: "false"
      - name: Validate image tags
        run: |
          set -euo pipefail
          for tag in "$TEMPLATE_IMAGE_TAG" "$SANDBOXD_IMAGE_TAG"; do
            if [[ ! "$tag" =~ ^sha-[a-f0-9]{12,40}$ ]]; then
              echo "::error::Image tags must be immutable sha-<commit> tags, got '$tag'"
              exit 1
            fi
          done
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-${{ inputs.environment }}" \
            --vault "tuist-k8s-${{ inputs.environment }}" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Verify cluster reachability
        run: kubectl --request-timeout=10s get --raw /version >/dev/null
      - name: Require the sandbox namespace
        # The server release owns the namespace and its policies.
        run: kubectl get namespace "$NAMESPACE" >/dev/null
      # The deploy below takes back fields changed outside Helm, such as a
      # `kubectl set image` on the workers; name them so the run shows what
      # it reverts.
      - name: Report fields changed outside Helm
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" get deploy,ds --show-managed-fields -o json | jq -r --arg release "$HELM_RELEASE_NAME" '
            .items[]
            | select(.metadata.annotations["meta.helm.sh/release-name"] == $release)
            | (.kind + "/" + .metadata.name) as $object
            | .metadata.managedFields[]?
            | select(.manager != "helm" and .manager != "kube-controller-manager")
            | "::warning::\($object) has fields set by \(.manager) at \(.time); this deploy takes back the ones the chart renders"'
      - name: Read the workers' upgrade mode
        run: |
          set -euo pipefail
          in_place=$(yq ea '. as $i ireduce ({}; . * $i) | (.workers.vmm.enabled and .workers.vmm.inPlaceUpgrades) // false' \
            "$HELM_CHART_PATH/values.yaml" "$HELM_CHART_PATH/values-managed-${{ inputs.environment }}.yaml")
          echo "WORKERS_IN_PLACE=$in_place" >> "$GITHUB_ENV"
          echo "in-place worker upgrades in ${{ inputs.environment }}: $in_place"
      - name: helm upgrade --install
        # Helm 4's watcher waits for updated workers even with OnDelete.
        # Legacy waits for the gateway but leaves worker replacement to a drain.
        # --force-conflicts: Helm applies server-side, so a field another
        # manager changed (a manual `kubectl set image` on the workers) fails
        # the apply with an ownership conflict, the automatic rollback fails
        # the same way, and every later deploy stays wedged. The chart is the
        # source of truth for what it renders, so Helm takes those fields
        # back; rollout and readiness failures still fail the deploy.
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$NAMESPACE" \
            -f "$HELM_CHART_PATH/values-managed-${{ inputs.environment }}.yaml" \
            --set gateway.tag="$TEMPLATE_IMAGE_TAG" \
            --set workers.templateTag="$TEMPLATE_IMAGE_TAG" \
            --set workers.tag="$SANDBOXD_IMAGE_TAG" \
            --force-conflicts \
            --atomic --timeout 20m --wait=legacy
      # The chart's vmm container holds the VMs while the daemon container
      # restarts (infra/sandboxd/AGENTS.md, "Process model"). Pods whose only
      # difference is the daemon's image or configuration are upgraded in
      # place; an action executing at that moment fails and Bazel retries it,
      # the worker's other VMs survive. Any other difference replaces the
      # worker once it has held no VM for three reads, or after five minutes.
      - name: Roll workers
        if: env.WORKERS_IN_PLACE == 'true'
        env:
          SANDBOXD_UPGRADE_REPLACE_IDLE_SECONDS: "300"
        run: |
          set -euo pipefail
          bash .github/scripts/sandboxd-upgrade.sh "$NAMESPACE" "$HELM_RELEASE_NAME-workers"
          # Replaced workers build the template; an upgraded daemon lists the
          # shapes it finds ready at startup.
          for pod in $(kubectl -n "$NAMESPACE" get pods -l "app=$HELM_RELEASE_NAME-workers" -o jsonpath='{.items[*].metadata.name}'); do
            bash .github/scripts/remote-execution-worker-templates.sh "$NAMESPACE" "$pod" "$TEMPLATE_IMAGE_TAG"
          done
      # OnDelete leaves running workers on the old images. Replace them one at
      # a time and wait for the new sandboxd to build the bazel template, so a
      # broken image fails here instead of in production. Their in-flight
      # actions fail and Bazel retries them; production never takes this path.
      - name: Replace workers not on the new spec
        if: env.WORKERS_IN_PLACE != 'true' && inputs.replace_workers && inputs.environment != 'production'
        run: |
          set -euo pipefail
          want_image="$(yq '.workers.image // "ghcr.io/tuist/sandboxd"' "$HELM_CHART_PATH/values.yaml"):$SANDBOXD_IMAGE_TAG"
          stale=$(kubectl -n "$NAMESPACE" get pods -l "app=$HELM_RELEASE_NAME-workers" -o json | jq -r \
            --arg image "$want_image" --arg tag "$TEMPLATE_IMAGE_TAG" '
            .items[]
            | select(.spec.containers[0].image != $image
                or ([.spec.containers[0].env[] | select(.name == "TEMPLATE_TAG") | .value][0] != $tag))
            | .metadata.name + " " + .spec.nodeName')
          [ -n "$stale" ] || { echo "Every worker already runs $want_image with template $TEMPLATE_IMAGE_TAG"; exit 0; }
          while read -r pod node; do
            echo "Replacing $pod on $node"
            kubectl -n "$NAMESPACE" delete pod "$pod" --wait=true --timeout=120s
            new=""
            for _ in $(seq 1 60); do
              new=$(kubectl -n "$NAMESPACE" get pods -l "app=$HELM_RELEASE_NAME-workers" \
                --field-selector "spec.nodeName=$node" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
              [ -n "$new" ] && [ "$new" != "$pod" ] && break
              sleep 5
            done
            [ -n "$new" ] && [ "$new" != "$pod" ] || { echo "::error::No replacement worker on $node"; exit 1; }
            kubectl -n "$NAMESPACE" wait --for=condition=Ready "pod/$new" --timeout=10m
            bash .github/scripts/remote-execution-worker-templates.sh "$NAMESPACE" "$new" "$TEMPLATE_IMAGE_TAG"
          done <<< "$stale"
      # platform-external-dns publishes the gateway Ingress host to Cloudflare
      # (DNS-only) within about a minute of the Ingress existing.
      - name: Wait for the gateway's DNS record
        run: |
          set -euo pipefail
          host=$(yq '.gateway.ingress.host // ""' "$HELM_CHART_PATH/values-managed-${{ inputs.environment }}.yaml")
          [ -n "$host" ] || exit 0
          for _ in $(seq 1 30); do
            if [ -n "$(dig +short "$host" @1.1.1.1)" ]; then
              echo "$host resolves to $(dig +short "$host" @1.1.1.1 | tr '\n' ' ')"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$host has no DNS record five minutes after the deploy; check platform-external-dns"
          exit 1
      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          helm history "$HELM_RELEASE_NAME" -n "$NAMESPACE" --max 10
          kubectl -n "$NAMESPACE" get deploy,ds,svc,ingress,pods -l tuist.dev/remote-execution=true -o wide
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -60
