name: Runners Cache Reuse E2E

# Reproduces how macOS custom cache volumes behave across consecutive runs of
# one repository: a seed job, sequential jobs a few minutes apart, concurrent
# jobs, and a final job. Five volumes reserve about what a large iOS project
# does (one large plus four default-capacity volumes):
#   large, build  change every run (compilation cache, .build)
#   grow          saved near-empty by the seed, GROW_GB in every later job
#   static, tiny  never change once written (tool caches, gems)
# The report job fails, when strict, on any of:
#   E1 a sequential or final job did not restore every volume
#   E2 a concurrent job could not attach a volume
#   E3 the final job did not restore grow at its full size
#   E4 a later job did not restore static or tiny
#   E5 a later job's cached checkout was unavailable
#   E6 TUIST_CACHE_ENDPOINT did not resolve
# A run where GitHub had not reported a runner's job in time is inconclusive
# and never fails: without that report no volume or checkout is authorized.
# Dispatch from a branch other than the default branch to also check that a
# checkout cache starts there. Server-side detail (host per use, generations):
#   select * from runner_cache_volume_uses where workflow_run_id = <run id>

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: macOS runner label (tuist-staging-macos, tuist-canary-macos or a production profile)
        type: string
        default: tuist-staging-macos
      key_prefix:
        description: Volume key prefix; use a fresh one to start from empty volumes
        type: string
        default: e2e-reuse-v1
      gap_seconds:
        description: Seconds between sequential jobs
        type: string
        default: "180"
      large_size:
        description: Capacity of the large volume (above 20gb needs runner_custom_volume_sizes)
        type: string
        default: 30gb
      fill_gb:
        description: GB of incompressible data in the large and build volumes
        type: string
        default: "6"
      grow_gb:
        description: GB the grow volume holds after the seed
        type: string
        default: "3"
      strict:
        description: Fail the run when an expectation is not met
        type: boolean
        default: true
  push:
    branches:
      - claude/qonto-runner-issues-16e553
    paths:
      - .github/workflows/runners-cache-reuse-e2e.yml
      - .github/workflows/runners-cache-reuse-e2e-probe.yml
      - .github/runners-cache-reuse-e2e.trigger

permissions:
  contents: read

concurrency:
  group: runners-cache-reuse-e2e-${{ inputs.runner_label || 'push' }}-${{ inputs.key_prefix || github.sha }}
  cancel-in-progress: false

jobs:
  config:
    if: github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.config.outputs.runner_label }}
      key_prefix: ${{ steps.config.outputs.key_prefix }}
      gap_seconds: ${{ steps.config.outputs.gap_seconds }}
      large_size: ${{ steps.config.outputs.large_size }}
      fill_gb: ${{ steps.config.outputs.fill_gb }}
      grow_gb: ${{ steps.config.outputs.grow_gb }}
    steps:
      - id: config
        env:
          EVENT: ${{ github.event_name }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          KEY_PREFIX: ${{ inputs.key_prefix }}
          GAP_SECONDS: ${{ inputs.gap_seconds }}
          LARGE_SIZE: ${{ inputs.large_size }}
          FILL_GB: ${{ inputs.fill_gb }}
          GROW_GB: ${{ inputs.grow_gb }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            RUNNER_LABEL=tuist-macos-27-0
            KEY_PREFIX="e2e-reuse-prod-${GITHUB_SHA:0:8}"
            GAP_SECONDS=180
            LARGE_SIZE=20gb
            FILL_GB=6
            GROW_GB=3
          fi
          {
            echo "runner_label=$RUNNER_LABEL"
            echo "key_prefix=$KEY_PREFIX"
            echo "gap_seconds=$GAP_SECONDS"
            echo "large_size=$LARGE_SIZE"
            echo "fill_gb=$FILL_GB"
            echo "grow_gb=$GROW_GB"
          } | tee -a "$GITHUB_OUTPUT"

  seed:
    needs: config
    uses: ./.github/workflows/runners-cache-reuse-e2e-probe.yml
    with:
      runner_label: ${{ needs.config.outputs.runner_label }}
      key_prefix: ${{ needs.config.outputs.key_prefix }}
      phase: seed
      index: "0"
      large_size: ${{ needs.config.outputs.large_size }}
      fill_gb: ${{ needs.config.outputs.fill_gb }}
      grow_gb: ${{ needs.config.outputs.grow_gb }}

  wait-1:
    needs: [config, seed]
    runs-on: ubuntu-latest
    steps:
      - run: sleep "${{ needs.config.outputs.gap_seconds }}"
  sequential-1:
    needs: [config, wait-1]
    uses: ./.github/workflows/runners-cache-reuse-e2e-probe.yml
    with:
      runner_label: ${{ needs.config.outputs.runner_label }}
      key_prefix: ${{ needs.config.outputs.key_prefix }}
      phase: sequential
      index: "1"
      large_size: ${{ needs.config.outputs.large_size }}
      fill_gb: ${{ needs.config.outputs.fill_gb }}
      grow_gb: ${{ needs.config.outputs.grow_gb }}

  wait-2:
    needs: [config, sequential-1]
    runs-on: ubuntu-latest
    steps:
      - run: sleep "${{ needs.config.outputs.gap_seconds }}"
  sequential-2:
    needs: [config, wait-2]
    uses: ./.github/workflows/runners-cache-reuse-e2e-probe.yml
    with:
      runner_label: ${{ needs.config.outputs.runner_label }}
      key_prefix: ${{ needs.config.outputs.key_prefix }}
      phase: sequential
      index: "2"
      large_size: ${{ needs.config.outputs.large_size }}
      fill_gb: ${{ needs.config.outputs.fill_gb }}
      grow_gb: ${{ needs.config.outputs.grow_gb }}

  wait-3:
    needs: [config, sequential-2]
    runs-on: ubuntu-latest
    steps:
      - run: sleep "${{ needs.config.outputs.gap_seconds }}"
  sequential-3:
    needs: [config, wait-3]
    uses: ./.github/workflows/runners-cache-reuse-e2e-probe.yml
    with:
      runner_label: ${{ needs.config.outputs.runner_label }}
      key_prefix: ${{ needs.config.outputs.key_prefix }}
      phase: sequential
      index: "3"
      large_size: ${{ needs.config.outputs.large_size }}
      fill_gb: ${{ needs.config.outputs.fill_gb }}
      grow_gb: ${{ needs.config.outputs.grow_gb }}

  wait-4:
    needs: [config, sequential-3]
    runs-on: ubuntu-latest
    steps:
      - run: sleep "${{ needs.config.outputs.gap_seconds }}"
  concurrent:
    needs: [config, wait-4]
    strategy:
      fail-fast: false
      matrix:
        index: ["1", "2"]
    uses: ./.github/workflows/runners-cache-reuse-e2e-probe.yml
    with:
      runner_label: ${{ needs.config.outputs.runner_label }}
      key_prefix: ${{ needs.config.outputs.key_prefix }}
      phase: concurrent
      index: ${{ matrix.index }}
      large_size: ${{ needs.config.outputs.large_size }}
      fill_gb: ${{ needs.config.outputs.fill_gb }}
      grow_gb: ${{ needs.config.outputs.grow_gb }}

  wait-5:
    needs: [config, concurrent]
    if: always() && needs.concurrent.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - run: sleep "${{ needs.config.outputs.gap_seconds }}"
  final:
    needs: [config, wait-5]
    uses: ./.github/workflows/runners-cache-reuse-e2e-probe.yml
    with:
      runner_label: ${{ needs.config.outputs.runner_label }}
      key_prefix: ${{ needs.config.outputs.key_prefix }}
      phase: final
      index: "0"
      large_size: ${{ needs.config.outputs.large_size }}
      fill_gb: ${{ needs.config.outputs.fill_gb }}
      grow_gb: ${{ needs.config.outputs.grow_gb }}

  report:
    needs: [config, seed, sequential-1, sequential-2, sequential-3, concurrent, final]
    if: always() && github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: results
      - name: Report and check expectations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GROW_GB: ${{ needs.config.outputs.grow_gb }}
          STRICT: ${{ github.event_name == 'push' || inputs.strict }}
        run: |
          set -euo pipefail
          cat results/*/e2e.jsonl > all.jsonl 2>/dev/null || : > all.jsonl

          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name | test("probe")) | "\(.id)\t\(.name)"' > jobs.tsv
          : > checkouts.tsv
          : > warnings.tsv
          : > unavailable.tsv
          while IFS=$'\t' read -r id name; do
            gh api "repos/$REPO/actions/jobs/$id/logs" > "log-$id.txt" 2>/dev/null || continue
            checkout=$(grep -o 'Tuist cached checkout: [^\r]*' "log-$id.txt" | head -1 | sed 's/Tuist cached checkout: //' || true)
            printf '%s\t%s\n' "$name" "${checkout:-none}" >> checkouts.tsv
            grep -o 'Cache volume unavailable: [^\r]*' "log-$id.txt" | sed "s|^|$name\t|" >> warnings.tsv || true
            # The job-local fallback can sit on its own disk, so the client's
            # warning, not the probe's mount check, decides unavailability.
            job=$(echo "$name" | sed -E 's# / probe$##; s#^(seed|final)$#\1-0#; s#^concurrent \(([0-9]+)\)$#concurrent-\1#')
            awk -v job="$job" '
              match($0, /id=[a-z]+\.attach/) { step = substr($0, RSTART + 3, RLENGTH - 10) }
              /Cache volume unavailable: / && step != "" { print job "\t" step }
            ' "log-$id.txt" >> unavailable.tsv
          done < jobs.tsv
          while IFS=$'\t' read -r job volume; do
            jq -c --arg job "$job" --arg volume "$volume" \
              'if (.phase + "-" + .index) == $job and .volume == $volume then .state = "unavailable" else . end' all.jsonl > all.next
            mv all.next all.jsonl
          done < unavailable.tsv

          {
            echo "## Cache reuse e2e (run $RUN_ID)"
            echo
            echo "| Job | Runner | large | build | grow | static | tiny | Endpoint |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
            jq -rs 'group_by(.phase + "-" + .index) | .[] |
              (map({(.volume): (.state + (if .state == "restored" then " (\(.restored_mb) MB)" else "" end))}) | add) as $v |
              "| \(.[0].phase)-\(.[0].index) | \(.[0].runner) | \($v.large) | \($v.build) | \($v.grow) | \($v.static) | \($v.tiny) | \(.[0].endpoint) |"' all.jsonl
            echo
            echo "### Cached checkout"
            echo
            echo "| Job | Status |"
            echo "| --- | --- |"
            sed 's/\t/ | /; s/^/| /; s/$/ |/' checkouts.tsv
            echo
            echo "### Unavailable volumes"
            echo
            if [ -s warnings.tsv ]; then sed 's/\t/: /; s/^/- /' warnings.tsv; else echo "None"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          failures=()
          later='select(.phase != "seed")'
          n=$(jq -s "[.[] | select(.phase == \"sequential\" or .phase == \"final\") | select(.state != \"restored\")] | length" all.jsonl)
          [ "$n" -eq 0 ] || failures+=("E1: $n volume uses in sequential or final jobs did not restore")
          n=$(jq -s '[.[] | select(.phase == "concurrent" and .state == "unavailable")] | length' all.jsonl)
          [ "$n" -eq 0 ] || failures+=("E2: $n volume uses in concurrent jobs could not attach")
          ok=$(jq -s --argjson gb "$GROW_GB" '[.[] | select(.phase == "final" and .volume == "grow" and .state == "restored" and .restored_mb >= ($gb * 900))] | length' all.jsonl)
          [ "$ok" -eq 1 ] || failures+=("E3: the final job did not restore grow at ${GROW_GB} GB")
          n=$(jq -s "[.[] | $later | select(.volume == \"static\" or .volume == \"tiny\") | select(.state != \"restored\")] | length" all.jsonl)
          [ "$n" -eq 0 ] || failures+=("E4: $n uses of never-changing volumes did not restore")
          n=$(grep -v -E '^[^\t]*seed' checkouts.tsv | grep -c -E $'\t(unavailable|none)' || true)
          [ "$n" -eq 0 ] || failures+=("E5: $n later jobs had no cached checkout")
          n=$(jq -s '[.[] | select(.endpoint | startswith("unresolvable"))] | length' all.jsonl)
          [ "$n" -eq 0 ] || failures+=("E6: TUIST_CACHE_ENDPOINT did not resolve in $n volume uses")
          missing=$(( 7 * 5 - $(wc -l < all.jsonl) ))
          [ "$missing" -le 0 ] || failures+=("$missing volume results are missing (a probe job failed or never ran)")

          # Volumes are only authorized once GitHub reports which job a runner runs,
          # so late webhooks make every volume unavailable whatever the cache does.
          pending=$(grep -c 'GitHub had not yet reported which job' warnings.tsv || true)
          denied=$(grep -v -E '^[^\t]*seed' checkouts.tsv | grep -c $'\tunavailable (denied)' || true)
          inconclusive=false
          if [ "$pending" -gt 0 ] || [ "$denied" -gt 0 ]; then inconclusive=true; fi

          {
            echo
            echo "### Expectations"
            echo
            if [ "$inconclusive" = true ]; then
              echo "**Inconclusive:** $pending volume attaches and $denied checkouts were refused because GitHub had not yet reported the runner's job. Check https://www.githubstatus.com for webhook delays and rerun with a fresh key prefix."
              echo
            fi
            if [ "${#failures[@]}" -eq 0 ]; then echo "All met"; else printf -- '- %s\n' "${failures[@]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${failures[@]}"
          if [ "$inconclusive" = true ]; then
            echo "::warning::Inconclusive: GitHub had not reported the runner's job in time ($pending volume attaches, $denied checkouts)"
            exit 0
          fi
          if [ "${#failures[@]}" -gt 0 ] && [ "$STRICT" = true ]; then exit 1; fi
