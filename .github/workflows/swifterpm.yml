name: SwifterPM

on:
  push:
    branches:
      - main
    paths:
      - "swifterpm/**"
      - ".github/workflows/swifterpm.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "swifterpm/**"
      - ".github/workflows/swifterpm.yml"

permissions:
  contents: read

concurrency:
  group: swifterpm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: tuist-macos-27-0
    timeout-minutes: 30
    if: github.repository == 'tuist/tuist'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "bazel"
          working_directory: swifterpm
          cache: "false"
          github_token: ${{ github.token }}
      - name: Test
        working-directory: swifterpm
        run: mise run test:unit

  e2e:
    name: E2E
    runs-on: tuist-macos-27-0
    timeout-minutes: 45
    if: github.repository == 'tuist/tuist'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "bazel buck2 jq shellspec"
          working_directory: swifterpm
          cache: "false"
          github_token: ${{ github.token }}
      - name: E2E
        working-directory: swifterpm
        run: mise run test:e2e
