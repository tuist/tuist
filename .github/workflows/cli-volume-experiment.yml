name: CLI volume experiment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cli-volume-experiment.yml

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
  TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
  TUIST_EE: '1'
  TUIST_ENABLE_CACHING: 'true'
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_LOCKED: 1
  TUIST_DEV_INSTANCE: '1'

jobs:
  dependencies:
    if: github.repository == 'tuist/tuist' && github.event.pull_request.number == 14070 && github.event.pull_request.head.repo.fork == false
    runs-on: tuist-macos-27-0-volumes
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - name: Initialize TuistCacheEE submodule
        run: bash mise/tasks/cli/ee.sh
      - name: Attach CLI workspace volume
        id: workspace
        uses: tuist/cache-volume@v1
        with:
          key: cli-pr14070-build-20261013-v1
          path: .build
          commit: 'true'
      - name: Attach SwifterPM source volume
        id: sources
        uses: tuist/cache-volume@v1
        with:
          key: cli-pr14070-swifterpm-20261013-v1
          path: ~/.cache/swifterpm
          commit: 'true'
      - name: Verify mounts and retained dependencies
        env:
          WORKSPACE_HIT: ${{ steps.workspace.outputs.cache-hit }}
          SOURCES_HIT: ${{ steps.sources.outputs.cache-hit }}
        run: |
          set -euo pipefail
          for target in .build "$HOME/.cache/swifterpm"; do
            test -L "$target"
            device=$(df -P "$target" | awk 'NR == 2 { print $1 }')
            [[ "$device" == /dev/disk* ]]
            test "$(diskutil info -plist "$device" | plutil -extract FilesystemType raw -)" = apfs
            echo "$target: $device (APFS)"
          done
          echo "Workspace hit: $WORKSPACE_HIT; source hit: $SOURCES_HIT"
          if [[ "$WORKSPACE_HIT" == true || "$SOURCES_HIT" == true ]]; then
            test "$WORKSPACE_HIT" = true
            test "$SOURCES_HIT" = true
            cmp .build/.volume-experiment-writer "$HOME/.cache/swifterpm/.volume-experiment-writer"
            echo "Retained writer: $(cat .build/.volume-experiment-writer)"
            test -s .build/workspace-state.json
            shasum -a 256 -c .build/.volume-experiment-manifests.sha256 > "$RUNNER_TEMP/workspace-verified.txt"
            (cd "$HOME/.cache/swifterpm" && shasum -a 256 -c .volume-experiment-sources.sha256) > "$RUNNER_TEMP/sources-verified.txt"
            echo "Verified $(wc -l < "$RUNNER_TEMP/workspace-verified.txt") workspace and $(wc -l < "$RUNNER_TEMP/sources-verified.txt") source files"
          fi
          shasum -a 256 Package.resolved > "$RUNNER_TEMP/lockfile.sha256"
      - uses: ./.github/actions/mise
        with:
          install_args: 'tuist swiftlint swiftformat'
          cache: 'false'
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: |
          set -euo pipefail
          tuist version
          xcodebuild -version
          /usr/bin/ruby .github/scripts/cli-volume-diagnostics.rb before
          /usr/bin/time -p tuist install --force-resolved-versions \
            --cache-path "$HOME/.cache/swifterpm" \
            --cached-directory-materialization=symlink 2>&1 | tee "$RUNNER_TEMP/install.log"
          shasum -a 256 -c "$RUNNER_TEMP/lockfile.sha256"
          /usr/bin/ruby .github/scripts/cli-volume-diagnostics.rb after-first
          /usr/bin/time -p tuist install --force-resolved-versions \
            --cache-path "$HOME/.cache/swifterpm" \
            --cached-directory-materialization=symlink 2>&1 | tee "$RUNNER_TEMP/repeat-install.log"
          /usr/bin/ruby .github/scripts/cli-volume-diagnostics.rb after-repeat
          shasum -a 256 -c "$RUNNER_TEMP/lockfile.sha256"
      - name: Record retained dependencies and timing
        env:
          WORKSPACE_HIT: ${{ steps.workspace.outputs.cache-hit }}
          SOURCES_HIT: ${{ steps.sources.outputs.cache-hit }}
        run: |
          set -euo pipefail
          find -L .build -type f -name 'Package*.swift' -print0 > "$RUNNER_TEMP/workspace-manifests"
          test -s "$RUNNER_TEMP/workspace-manifests"
          xargs -0 shasum -a 256 < "$RUNNER_TEMP/workspace-manifests" > .build/.volume-experiment-manifests.sha256
          (
            cd "$HOME/.cache/swifterpm"
            find sources -type f \( -name 'Package*.swift' -o -name .swifterpm-registry-checksum \) -print0 > "$RUNNER_TEMP/source-manifests"
            test -s "$RUNNER_TEMP/source-manifests"
            xargs -0 shasum -a 256 < "$RUNNER_TEMP/source-manifests" > .volume-experiment-sources.sha256
          )
          printf '%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .build/.volume-experiment-writer
          cp .build/.volume-experiment-writer "$HOME/.cache/swifterpm/.volume-experiment-writer"
          {
            echo "### CLI dependency volume experiment"
            echo "Runner: $RUNNER_NAME"
            echo "Writer: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo "Workspace hit: $WORKSPACE_HIT; source hit: $SOURCES_HIT"
            echo "Install seconds: $(awk '$1 == "real" {print $2}' "$RUNNER_TEMP/install.log")"
            echo "Same-VM diagnostic repeat seconds: $(awk '$1 == "real" {print $2}' "$RUNNER_TEMP/repeat-install.log")"
            echo "Workspace manifests: $(wc -l < .build/.volume-experiment-manifests.sha256)"
            echo "Source manifests/checksums: $(wc -l < "$HOME/.cache/swifterpm/.volume-experiment-sources.sha256")"
            du -sh .build/ "$HOME/.cache/swifterpm/"
          } | tee -a "$GITHUB_STEP_SUMMARY"
