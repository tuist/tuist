name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Replaces default setup, which cannot supersede runs on rapid pushes. On main,
# a newer pending run still replaces an older pending one.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'tuist/tuist' && github.event.pull_request.user.login != 'glossia[bot]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: tuist-linux
          - language: go
            build-mode: autobuild
            runner: tuist-linux
          - language: java-kotlin
            build-mode: none
            runner: tuist-linux
          - language: javascript-typescript
            build-mode: none
            runner: tuist-linux
          - language: python
            build-mode: none
            runner: tuist-linux
          - language: rust
            build-mode: none
            runner: tuist-linux-large
          - language: swift
            build-mode: manual
            runner: tuist-macos-27-0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: ./.github/actions/mise
        with:
          install_args: "rust"
          working_directory: kura

      - name: Install Tuist
        if: matrix.language == 'swift'
        uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"

      - name: Authenticate with Tuist
        if: matrix.language == 'swift' && github.event.pull_request.head.repo.fork != true
        run: tuist auth login

      - name: Setup Tuist
        if: matrix.language == 'swift' && github.event.pull_request.head.repo.fork != true
        run: tuist setup

      - name: Resolve Swift packages
        if: matrix.language == 'swift'
        run: |
          tuist install --force-resolved-versions
          swift package resolve --replace-scm-with-registry

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true

      - name: Resolve build environment
        id: resolve-environment
        if: matrix.language == 'go'
        uses: github/codeql-action/resolve-environment@v4
        with:
          language: go

      - name: Setup Go
        if: matrix.language == 'go' && fromJSON(steps.resolve-environment.outputs.environment).configuration.go.version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ fromJSON(steps.resolve-environment.outputs.environment).configuration.go.version }}
          cache: false

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      # CodeQL extracts Swift by tracing a clean build, so .build is never restored from cache.
      - name: Build Swift
        if: matrix.language == 'swift'
        run: swift build --configuration debug --replace-scm-with-registry --force-resolved-versions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
