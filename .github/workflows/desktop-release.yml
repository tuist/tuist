name: Desktop release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current main SHA, with workspace and lockfile already versioned'
        type: string
        required: true
permissions:
  contents: read
env:
  MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/mise.toml
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  guard:
    if: github.repository == 'tuist/tuist' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: guard
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPROVED: ${{ vars.DESKTOP_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          test "$APPROVED" = true
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  native:
    needs: guard
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      ONCE_CACHE_PROVIDER: local
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            desktop
            app/Fixtures/Navigation
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Prefer MSVC tools in every Bash process
        if: runner.os == 'Windows'
        run: |
          cat > "$RUNNER_TEMP/desktop-bash-env.sh" <<'EOF'
          # Git Bash otherwise places its GNU link.exe ahead of MSVC's linker.
          msvc_bin="$(cygpath -u "${VCToolsInstallDir:?}bin/Hostx64/x64")"
          test -x "$msvc_bin/link.exe" || exit 1
          export PATH="$msvc_bin:$PATH"
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/desktop-bash-env.sh" >> "$GITHUB_ENV"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libwayland-dev libvulkan-dev libssl-dev libglib2.0-dev libgtk-3-dev libfuse2
      - name: Linux signature verification tool
        if: runner.os == 'Linux'
        run: |
          bash distribution/install-minisign.sh "$RUNNER_TEMP/minisign-bin"
          echo "$RUNNER_TEMP/minisign-bin" >> "$GITHUB_PATH"
      - name: Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis minisign -y --no-progress
      - uses: jdx/mise-action@v2
        with:
          working_directory: desktop
          cache: false
      - name: Install pinned packager tool
        run: cargo install --locked cargo-packager --version '=0.11.7'
      - name: Script tests
        run: for test in distribution/test_*.sh; do bash "$test"; done
      - name: Provision approved Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX: ${{ secrets.DESKTOP_WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_PFX_PASSWORD }}
          APPROVED_THUMBPRINT: ${{ vars.DESKTOP_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:PFX -or !$env:PFX_PASSWORD -or !$env:APPROVED_THUMBPRINT) { throw 'Provision approved Windows signing access' }
          $path = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
            $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
            if ($cert.Thumbprint -ne $env:APPROVED_THUMBPRINT -or !$cert.HasPrivateKey) { throw 'Unapproved Windows signing certificate' }
          } finally { Remove-Item $path -Force -ErrorAction SilentlyContinue }
      - name: Isolated native Once build, test, package and verify signatures
        env:
          DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY_PASSWORD }}
          DESKTOP_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.DESKTOP_WINDOWS_CERTIFICATE_THUMBPRINT }}
          DESKTOP_WINDOWS_TIMESTAMP_URL: ${{ vars.DESKTOP_WINDOWS_TIMESTAMP_URL }}
        run: mise exec -- bash distribution/release.sh build --release --output "$RUNNER_TEMP/desktop-package"
      - name: Install and uninstall smoke
        run: bash distribution/smoke.sh "$RUNNER_TEMP/desktop-package"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-signed-${{ runner.os }}
          path: ${{ runner.temp }}/desktop-package/assets/*
          if-no-files-found: error
      - name: Remove imported signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          APPROVED_THUMBPRINT: ${{ vars.DESKTOP_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if ($env:APPROVED_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            Remove-Item "Cert:\CurrentUser\My\$env:APPROVED_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
  publish:
    needs: [guard, native]
    environment: desktop-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          working_directory: desktop
          install_args: jq@1.8.1 yq@4.52.5
          cache: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install signature verification tool
        run: |
          bash desktop/distribution/install-minisign.sh "$RUNNER_TEMP/minisign-bin"
          echo "$RUNNER_TEMP/minisign-bin" >> "$GITHUB_PATH"
      - run: cargo install --locked cargo-packager --version '=0.11.7'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-signed-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop-assets
      - name: Authenticate feed and publish immutable payloads before mutable feed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.guard.outputs.sha }}
          DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          bash desktop/distribution/release.sh feed --assets "$RUNNER_TEMP/desktop-assets" --output "$RUNNER_TEMP/desktop-feed/latest.json"
          bash desktop/distribution/publish.sh --assets "$RUNNER_TEMP/desktop-assets" --feed "$RUNNER_TEMP/desktop-feed" --sha "$SOURCE_SHA"
