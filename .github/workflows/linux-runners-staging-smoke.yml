name: Linux Shard Storage Staging Qualification
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: shard-storage-staging-qualification
  cancel-in-progress: false
env:
  TUIST_URL: https://staging.tuist.dev
  TUIST_PROJECT: tuist/shard-storage-e2e
  MIX_ENV: test
  TUIST_SHARD_REFERENCE: shard-e2e-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  build:
    runs-on: tuist-staging-linux
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Prepare fixture
        run: |
          test -n "$TUIST_CACHE_SIGNING_GRANT"
          bash .github/scripts/shard-storage-fixture.sh
          cd shard-fixture
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix tuist.login
      - name: Build and upload test shards
        working-directory: shard-fixture
        run: mix tuist.test.build --shard-total 2
      - name: Compare storage backends
        working-directory: shard-fixture
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/shard-storage-results
        run: mix run ../.github/scripts/shard-storage-benchmark.exs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-storage-transfers
          path: ${{ runner.temp }}/shard-storage-results/*.jsonl
  test:
    needs: build
    runs-on: tuist-staging-linux
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      matrix:
        shard: [0, 1]
    env:
      TUIST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Prepare clean consumer
        run: |
          test -n "$TUIST_CACHE_SIGNING_GRANT"
          bash .github/scripts/shard-storage-fixture.sh
          cd shard-fixture
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile tuist_ex --include-children
          mix tuist.login
      - name: Download and run assigned tests without compilation
        working-directory: shard-fixture
        run: |
          mix do deps.loadpaths --no-compile --no-deps-check + tuist.test --prepare-only
          mix do deps.loadpaths --no-compile --no-deps-check + tuist.test --no-download --no-compile
