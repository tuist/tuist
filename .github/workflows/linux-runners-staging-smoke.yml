name: Linux Runners Staging Smoke Test

# Manual smoke test for the staging Runner Profile dispatch path.
# Requires a profile on the staging account whose rendered label is
# `tuist-staging-linux` — the canonical setup is a profile named
# `staging-linux` (4 vCPU / 16 GB, Linux). Create it at
# `staging.tuist.dev/<account>/runners/profiles` before running.
#
# Validates, end-to-end:
#   1. workflow_job: queued webhook reaches the staging server.
#   2. `Tuist.Runners.Dispatch.resolve_dispatch_target` matches the
#      `staging-linux` profile, resolves to its shape's RunnerPool
#      (`tuist-tuist-runner-pool-linux-4vcpu-16gb`), and enqueues with
#      `requested_dispatch_label = "tuist-staging-linux"`.
#   3. A polling Pod in that pool claims the JIT (stamped with the
#      original label so GitHub binds), registers, runs the job inside
#      a kata microVM on the bare-metal node.
#   4. After completion the Pod terminates, kubelet observes the exit,
#      the RunnerPoolReconciler reaps the Pod + sibling SA, and the
#      autoscaler's next tick re-evaluates desired replicas.
#
# Manual-trigger only — we don't want every push to burn elastic
# capacity.

on:
  workflow_dispatch:
    inputs:
      nested_kvm:
        description: Run only the Android Managed Device and Macrobenchmark check on the KVM pool
        type: boolean
        default: false
      gradle_cache:
        description: Run only the Gradle container cache check
        type: boolean
        default: false
      compare_regional_cache:
        description: With gradle_cache, compare the existing EU-West cache with a remote region
        type: boolean
        default: false
      measure_request_latency:
        description: With gradle_cache, measure regional HTTP health, metadata, and tiny-read latency
        type: boolean
        default: false
      hold_seconds:
        description: With gradle_cache, pause after upload for a bounded cache restart drill (0-900)
        type: string
        default: '0'
      compile_project:
        description: With gradle_cache, compile and remotely restore the real Tuist Gradle plugin sources
        type: boolean
        default: false
      wan_cache_endpoint:
        description: Explicit public-region Service for the controlled comparison
        type: string
        default: http://kura-tuist-ca-east-1.kura.svc.cluster.local:4000
      stable_cache_dns:
        description: With gradle_cache, validate the spec95 public stable endpoint using the temporary staging fixture token
        type: boolean
        default: false
      runner_label:
        description: Runner profile for the Gradle cache check
        type: string
        default: tuist-staging-linux
      server_url:
        description: Tuist server for the runner profile and project
        type: string
        default: https://staging.tuist.dev
      project:
        description: Existing Gradle project authorized for this repository's OIDC token
        type: string
        default: tuist/tuist

# Smoke runs a public curl + a few uname-style assertions; never
# reads or mutates repo state, so GITHUB_TOKEN needs zero scopes.
permissions: {}

jobs:
  smoke:
    if: ${{ !inputs.gradle_cache && !inputs.nested_kvm }}
    # Single-label form. `tuist-staging-linux` is the pool's unique
    # dispatch label and is sufficient to pick a runner — no need
    # to also list `self-hosted` (which is advertised on the runner
    # but isn't an authorization boundary).
    runs-on: tuist-staging-linux
    timeout-minutes: 10
    steps:
      - name: Show environment
        run: |
          set -euo pipefail
          echo "Hostname:    $(hostname)"
          echo "Kernel:      $(uname -a)"
          echo "Distro:      $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -3)"
          echo "Architecture: $(uname -m)"
          echo "CPU info:    $(grep -m1 'model name' /proc/cpuinfo | sed 's/^[^:]*: //')"
          echo "Memory:      $(grep MemTotal /proc/meminfo)"
          echo "Container?  : $(grep -E 'docker|containerd|kubepods' /proc/1/cgroup 2>/dev/null | head -1 || echo unknown)"

      - name: Public reachability check
        run: |
          set -euo pipefail
          # Public GH should be reachable (the runner already
          # registered, so this had better work). The Pod-side
          # NetworkPolicy in the runners namespace gates Pod
          # egress to "HTTPS to public internet + DNS"; this
          # check exercises that path. Cluster-internal endpoints
          # (apiserver, in-cluster services) are deliberately
          # NOT reachable from the runner — same posture as the
          # macOS Tart VM, just enforced by NetworkPolicy
          # instead of vmnet isolation.
          curl -fsSL -o /dev/null -w "github.com → HTTP %{http_code}\n" https://github.com

      - name: Cluster-internal egress should be denied
        run: |
          set -euo pipefail
          # NetworkPolicy in templates/runners-namespace.yaml lists
          # cluster Pod/Service CIDRs under `exceptCIDRs`. From a
          # runner Pod, dialing those CIDRs MUST fail (DNS or
          # connection). This is the negative gate the macOS smoke
          # couldn't enforce (Tart VMs bypass CNI); Linux Pods
          # honor it.
          # 10.128.0.10 = staging kube-dns Service ClusterIP (per
          # cluster-staging.yaml's serviceCIDR + standard
          # kube-system/kube-dns assignment). Connection attempt
          # should time out, not return data.
          if curl --max-time 5 -fsSL -o /dev/null "http://10.128.0.10:53"; then
            echo "ERROR: kube-dns Service was reachable from the runner Pod — NetworkPolicy egress block is wrong"
            exit 1
          fi
          echo "Cluster-internal egress correctly denied."

      # GitHub-hosted runners set ImageOS, and setup actions read it to
      # pick a prebuilt binary; erlef/setup-beam fails outright without it.
      - name: ImageOS reaches steps
        run: |
          set -euo pipefail
          echo "ImageOS: ${ImageOS:-<unset>}"
          [ -n "${ImageOS:-}" ] || { echo "::error::ImageOS is not set in the step environment"; exit 1; }
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

  # Job containers exercise a path plain `run:` steps never touch:
  # the runner hands dockerd the work directory, `externals` and the
  # `_temp` / `_actions` / `_tool` trees under it, and dockerd
  # resolves every one of those in the dind sidecar's namespace. A
  # volume mounted at the wrong path on the sidecar side leaves them
  # empty and only shows up here — the `smoke` job above keeps
  # passing either way.
  container-smoke:
    if: ${{ !inputs.gradle_cache && !inputs.nested_kvm }}
    runs-on: tuist-staging-linux
    timeout-minutes: 15
    # The only job here that reads repo state: `actions/checkout`
    # is the JS action that exercises the externals + actions trees.
    permissions:
      contents: read
    # Inside a job container the default shell is `sh -e {0}`, and
    # ubuntu:22.04's /bin/sh is dash, which rejects the `set -euo
    # pipefail` every step below opens with ("Illegal option -o
    # pipefail", exit 2). Without this the job dies on its first step
    # and never reaches the checkout it exists to exercise.
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:22.04
    steps:
      # Runs from /__w/_temp/<id>.sh, so it fails outright when the
      # work directory isn't shared with the sidecar.
      - name: Step script is reachable inside the container
        run: |
          set -euo pipefail
          echo "Running inside: $(cat /etc/os-release | head -1)"
          test -d /__w || { echo "ERROR: /__w missing"; exit 1; }
          test -x /__e/node20/bin/node || test -x /__e/node24/bin/node \
            || { echo "ERROR: no node runtime staged at /__e"; exit 1; }

      # A JS action: executed as `/__e/node2x/bin/node
      # /__w/_actions/...`, so it covers the externals staging and
      # the actions tree in one step.
      - uses: actions/checkout@v4

      - name: Checkout landed in the workspace
        run: |
          set -euo pipefail
          # The action's own bundle under _actions is what came back
          # empty when the sidecar mounted the work directory at the
          # wrong path; assert it before the workspace it produced.
          test -f /__w/_actions/actions/checkout/v4/dist/index.js \
            || { echo "ERROR: checkout bundle missing from the actions tree"; exit 1; }
          test -f "$GITHUB_WORKSPACE/README.md"
          echo "Workspace: $GITHUB_WORKSPACE"

      # /github/home and /github/workflow are separate bind mounts
      # off _temp; the runner reads GITHUB_ENV back out of them.
      - name: Environment files round-trip
        run: echo "SMOKE_VALUE=ok" >> "$GITHUB_ENV"
      - name: Environment files round-trip check
        run: |
          set -euo pipefail
          test "${SMOKE_VALUE:-}" = "ok" || { echo "ERROR: GITHUB_ENV did not round-trip"; exit 1; }

  # virtiofsd holds a host descriptor for every inode the guest caches, so its
  # file budget caps how many files a job can keep on the rootfs and volumes.
  # Kata's default is about one million; past it opens fail with EMFILE no
  # matter what the process rlimit says. Runner hosts raise it (see
  # kata_virtiofs.go in infra/cluster-api-provider-tuist); this keeps more files
  # than the default allows and fails on a host still running with it.
  file-budget:
    if: ${{ !inputs.gradle_cache && !inputs.nested_kvm }}
    runs-on: tuist-staging-linux
    timeout-minutes: 15
    steps:
      - name: Keep 1.2 million files on the rootfs
        run: |
          set -euo pipefail
          mkdir -p ~/file-budget && cd ~/file-budget
          for d in $(seq 1 120); do
            mkdir "$d"
            if ! (cd "$d" && seq 1 10000 | xargs touch); then
              echo "::error::Creating files failed after $(( (d - 1) * 10000 )): the host still runs virtiofsd with Kata's default file budget"
              exit 1
            fi
          done
          echo "Kept 1.2 million files without exhausting virtiofsd's file budget."

  gradle-cache:
    if: ${{ inputs.gradle_cache && !inputs.nested_kvm }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ (inputs.compare_regional_cache || inputs.compile_project || inputs.hold_seconds != '0') && 45 || inputs.stable_cache_dns && 30 || 15 }}
    container:
      image: eclipse-temurin:21-jdk-jammy
    defaults:
      run:
        shell: bash
    env:
      TUIST_URL: ${{ inputs.server_url }}
      SMOKE_PROJECT: ${{ inputs.project }}
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_GITHUB_ATTESTATIONS: 0
      MISE_LOCKED: 1
      TUIST_TOKEN: ${{ inputs.stable_cache_dns && secrets.SPEC95_STAGING_CACHE_TOKEN || '' }}
      BENCH_WAN_ENDPOINT: ${{ inputs.wan_cache_endpoint }}
      SMOKE_HOLD_SECONDS: ${{ inputs.hold_seconds }}
    steps:
      - name: Validate stable DNS fixture scope
        if: ${{ inputs.stable_cache_dns }}
        run: |
          set -euo pipefail
          test "$TUIST_URL" = https://staging.tuist.dev
          test "$SMOKE_PROJECT" = kura-spec95-e2e/probe
          : "${TUIST_TOKEN:?Temporary staging fixture token is missing}"
      - name: Verify runner endpoint reaches the job container
        if: ${{ !inputs.stable_cache_dns }}
        run: |
          set -euo pipefail
          : "${TUIST_CACHE_ENDPOINT:?Runner cache endpoint was not forwarded to the container}"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "${TUIST_CACHE_ENDPOINT%/}/up"

      - name: Install fixture tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git jq
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: tuist
          cache: "false"
          working_directory: .
      - name: Authenticate with Tuist
        if: ${{ !inputs.stable_cache_dns }}
        run: tuist auth login
      - name: Verify a remote upload followed by a remote hit
        if: ${{ !inputs.stable_cache_dns && !inputs.compare_regional_cache && !inputs.measure_request_latency && !inputs.compile_project }}
        run: bash infra/linux-runner-image/gradle-cache-smoke.sh
      - name: Compile and restore the real Gradle plugin
        if: ${{ inputs.compile_project }}
        run: bash infra/linux-runner-image/gradle-real-cache-smoke.sh
      - name: Measure local-region and remote request latency
        id: latency
        if: ${{ inputs.measure_request_latency }}
        run: |
          test "$TUIST_URL" = https://staging.tuist.dev
          test '${{ inputs.stable_cache_dns }}' = false
          node_bin=/__e/node24/bin/node
          test -x "$node_bin" || node_bin=/__e/node20/bin/node
          "$node_bin" infra/linux-runner-image/kura-request-latency.mjs
      - name: Compare existing regional Gradle caches
        id: benchmark
        if: ${{ inputs.compare_regional_cache }}
        run: |
          test "$TUIST_URL" = https://staging.tuist.dev
          test '${{ inputs.stable_cache_dns }}' = false
          bash infra/linux-runner-image/gradle-regional-benchmark.sh
      - name: Soak the public stable cache endpoint
        if: ${{ inputs.stable_cache_dns }}
        run: bash infra/cache-dns/staging-ci-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-container-cache-logs
          path: |
            ${{ runner.temp }}/gradle-cache-smoke/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.compare_regional_cache && steps.benchmark.outputs.logs != '' }}
        with:
          name: gradle-regional-benchmark-logs
          path: |
            ${{ steps.benchmark.outputs.logs }}/*.log
            ${{ steps.benchmark.outputs.logs }}/*.csv
            ${{ steps.benchmark.outputs.logs }}/environment.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.measure_request_latency && steps.latency.outputs.logs != '' }}
        with:
          name: kura-request-latency
          path: ${{ steps.latency.outputs.logs }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.compile_project }}
        with:
          name: gradle-real-cache-smoke
          path: /__w/_temp/gradle-real-cache-smoke/*.log
          if-no-files-found: error

  nested-kvm:
    if: ${{ inputs.nested_kvm }}
    permissions:
      contents: read
    runs-on: tuist-staging-linux-kvm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 \
            libxrender1 libpulse0 libnss3 libxkbcommon-x11-0 libxcb-cursor0 \
            libasound2 libglu1-mesa
      - name: Verify unprivileged nested KVM acceleration
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          id
          uname -a
          grep -m1 'model name' /proc/cpuinfo
          ls -l /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator'
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Run the API 34 x86_64 instrumented test
        working-directory: infra/kata-kvm-kernel/android-smoke
        run: gradle --no-daemon --stacktrace :app:pixel6DebugAndroidTest
      - name: Measure 15 cold starts with Macrobenchmark
        working-directory: infra/kata-kvm-kernel/android-smoke
        run: gradle --no-daemon --stacktrace :benchmark:pixel6BenchmarkAndroidTest
      - name: Require executed tests and benchmark samples
        working-directory: infra/kata-kvm-kernel/android-smoke
        run: |
          set -euo pipefail
          grep -R 'testcase.*runsInsideTheAndroidGuest' app/build/outputs/androidTest-results/
          grep -R 'testcase.*coldStartup' benchmark/build/outputs/androidTest-results/
          find benchmark/build/outputs -name '*benchmarkData.json' -print -exec cat {} \;
          test -n "$(find benchmark/build/outputs -name '*benchmarkData.json' -print -quit)"
      - name: Save Android test reports and benchmark traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-kvm-android-results
          path: |
            infra/kata-kvm-kernel/android-smoke/**/build/reports/androidTests/
            infra/kata-kvm-kernel/android-smoke/**/build/outputs/androidTest-results/
            infra/kata-kvm-kernel/android-smoke/**/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
