name: Linux Runner Gradle Cache Smoke Test

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner profile with the image being validated
        type: string
        default: tuist-linux
      server_url:
        description: Tuist server for the runner profile and project
        type: string
        default: https://tuist.dev
      project:
        description: Existing Gradle project authorized for this repository's OIDC token
        type: string
        default: tuist/gradle-plugin

permissions:
  contents: read
  id-token: write

jobs:
  cache:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 15
    container:
      image: eclipse-temurin:21-jdk-jammy
    defaults:
      run:
        shell: bash
    env:
      TUIST_URL: ${{ inputs.server_url }}
      SMOKE_PROJECT: ${{ inputs.project }}
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_GITHUB_ATTESTATIONS: 0
      MISE_LOCKED: 1
    steps:
      - name: Verify runner endpoint reaches the job container
        run: |
          set -euo pipefail
          : "${TUIST_CACHE_ENDPOINT:?Runner cache endpoint was not forwarded to the container}"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "${TUIST_CACHE_ENDPOINT%/}/up"

      - name: Install git for the fixture repository
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: tuist
          cache: "false"
          working_directory: .
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Verify a remote upload followed by a remote hit
        run: bash infra/linux-runner-image/gradle-cache-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-container-cache-logs
          path: ${{ runner.temp }}/gradle-cache-smoke/*.log
          if-no-files-found: ignore
