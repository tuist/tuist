name: Runner Image Release

# Releases the macOS runner images (`ghcr.io/tuist/tuist-runner:macos-<xcode>-<semver>`)
# off the server deploy path. A release rebuilds only the profiles that need
# it (see .github/scripts/runner-image-release-plan.sh), re-tags the rest,
# tags `runner-image@<semver>`, and dispatches Server Production Deployment
# so the fleet rolls through the canary cascade.
#
# Dispatch with no inputs to reconcile after a macos-tahoe-xcode base moves;
# macos-xcode-image.yml does this for bases of active profiles.

on:
  push:
    branches:
      - main
    paths:
      - infra/runner-image/**
      - infra/linux-runner-image/cmd/tuist-cache-volume/**
      - .github/actions/build-runner-image-binaries/**
      - .github/scripts/runner-image-release-plan.sh
      - .github/workflows/runner-image-release.yml
  pull_request:
    paths:
      - infra/runner-image/**
      - .github/workflows/runner-image-release.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('runner-image-tests-{0}', github.event.pull_request.number) || 'runner-image-release' }}
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}

jobs:
  test-tcc-report:
    name: Test Finder diagnostics
    if: github.repository == 'tuist/tuist'
    runs-on: tuist-linux
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash infra/runner-image/tcc-report_test.sh
      - run: bash infra/runner-image/runner-caches_test.sh

  plan:
    name: Plan runner image release
    needs: test-tcc-report
    if: github.repository == 'tuist/tuist' && github.event_name != 'pull_request'
    runs-on: tuist-linux
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "0"
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      build-count: ${{ steps.plan.outputs.build-count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      carry: ${{ steps.plan.outputs.carry }}
      stacked-build-count: ${{ steps.plan.outputs.stacked-build-count }}
      stacked-matrix: ${{ steps.plan.outputs.stacked-matrix }}
      stacked-carry: ${{ steps.plan.outputs.stacked-carry }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq oras"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: check
        run: mise run --skip-tools release:check runner-image
      - name: Log in to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username tuist-bot --password-stdin
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_RELEASE: ${{ steps.check.outputs.runner-image-should-release }}
          NEXT_VERSION_NUMBER: ${{ steps.check.outputs.runner-image-next-version-number }}
        run: .github/scripts/runner-image-release-plan.sh

  build:
    name: Build runner image (Xcode ${{ matrix.xcode }})
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.build-count != '0'
    runs-on: [self-hosted, macos, bare-metal, vm-image-builder]
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TART_REGISTRY_HOSTNAME: ghcr.io
      TART_REGISTRY_USERNAME: tuist-bot
      TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (crane)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login --username tuist-bot --password-stdin ghcr.io

      - name: Initialize Packer
        working-directory: infra/runner-image
        run: packer init -upgrade runner.pkr.hcl

      - uses: ./.github/actions/reclaim-tart-disk

      - uses: ./.github/actions/build-runner-image-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build profile
        id: build
        working-directory: infra/runner-image
        env:
          XCODE: ${{ matrix.xcode }}
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          PROFILE="macos-${XCODE//./-}"
          echo "Building profile ${PROFILE} from base ${BASE_IMAGE}"
          env -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN packer build \
            -var "base_image=${BASE_IMAGE}" \
            -var "output_image=tuist-runner" \
            runner.pkr.hcl
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"

      # packer-plugin-tart sometimes drops `nvram.bin` from the built bundle,
      # which fails `tart push` after the disk upload.
      - name: Restore nvram.bin if missing
        env:
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          BUNDLE="$HOME/.tart/vms/tuist-runner"
          ls -la "$BUNDLE"
          if [ ! -f "$BUNDLE/nvram.bin" ]; then
            echo "nvram.bin missing, restoring from ${BASE_IMAGE}"
            tart delete nvram-restore 2>/dev/null || true
            tart clone "$BASE_IMAGE" nvram-restore
            cp "$HOME/.tart/vms/nvram-restore/nvram.bin" "$BUNDLE/nvram.bin"
            tart delete nvram-restore
          fi

      - name: Push profile to GHCR
        timeout-minutes: 90
        uses: ./.github/actions/tart-push
        with:
          local-name: tuist-runner
          remote-names: |
            ghcr.io/tuist/tuist-runner:${{ steps.build.outputs.profile }}-${{ needs.plan.outputs.version }}
            ghcr.io/tuist/tuist-runner:${{ steps.build.outputs.profile }}

      - name: Cleanup
        if: always()
        run: tart delete tuist-runner 2>/dev/null || true

  # The same runner layer as a stacked image: an overlay on the base, which
  # rack hosts keep once in Tart's content store, so a release on an unchanged
  # base costs them the overlay instead of the changed half of the disk. Only
  # macOS 27 can create one, so it builds on the `macos-27` builder.
  build-stacked:
    name: Build stacked runner image (Xcode ${{ matrix.xcode }})
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.stacked-build-count != '0'
    runs-on: [self-hosted, macos, bare-metal, macos-27]
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.stacked-matrix) }}
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TART_REGISTRY_HOSTNAME: ghcr.io
      TART_REGISTRY_USERNAME: tuist-bot
      TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (crane)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login --username tuist-bot --password-stdin ghcr.io

      - name: Initialize Packer
        working-directory: infra/runner-image
        run: packer init -upgrade runner.pkr.hcl

      - uses: ./.github/actions/reclaim-tart-disk

      - uses: ./.github/actions/build-runner-image-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build profile
        id: build
        working-directory: infra/runner-image
        env:
          XCODE: ${{ matrix.xcode }}
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          PROFILE="macos-${XCODE//./-}"
          echo "Building stacked profile ${PROFILE} on base ${BASE_IMAGE}"
          export PATH="$PWD/stacked-tart:$PATH"
          env -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN packer build \
            -var "base_image=${BASE_IMAGE}" \
            -var "output_image=tuist-runner" \
            -var "stacked=true" \
            runner.pkr.hcl
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"

      - name: Restore nvram.bin if missing
        env:
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          BUNDLE="$HOME/.tart/vms/tuist-runner"
          ls -la "$BUNDLE"
          if [ ! -f "$BUNDLE/nvram.bin" ]; then
            echo "nvram.bin missing, restoring from ${BASE_IMAGE}"
            tart delete nvram-restore 2>/dev/null || true
            tart clone "$BASE_IMAGE" nvram-restore
            cp "$HOME/.tart/vms/nvram-restore/nvram.bin" "$BUNDLE/nvram.bin"
            tart delete nvram-restore
          fi

      - name: Push profile to GHCR
        timeout-minutes: 90
        uses: ./.github/actions/tart-push
        with:
          local-name: tuist-runner
          remote-names: |
            ghcr.io/tuist/tuist-runner:${{ steps.build.outputs.profile }}-${{ needs.plan.outputs.version }}-stacked
            ghcr.io/tuist/tuist-runner:${{ steps.build.outputs.profile }}-stacked

      - name: Cleanup
        if: always()
        run: tart delete tuist-runner 2>/dev/null || true

  carry:
    name: Re-tag unchanged runner images
    needs: plan
    if: needs.plan.outputs.release == 'true' && (needs.plan.outputs.carry != '[]' || needs.plan.outputs.stacked-carry != '[]')
    runs-on: tuist-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked jq oras"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Re-tag the previous release's images
        env:
          CARRY: ${{ needs.plan.outputs.carry }}
          STACKED_CARRY: ${{ needs.plan.outputs.stacked-carry }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username tuist-bot --password-stdin
          for xcode in $(jq -r '.[]' <<< "$CARRY"); do
            profile="macos-${xcode//./-}"
            oras tag "ghcr.io/tuist/tuist-runner:${profile}-${PREVIOUS}" "${profile}-${VERSION}"
          done
          for xcode in $(jq -r '.[]' <<< "$STACKED_CARRY"); do
            profile="macos-${xcode//./-}"
            oras tag "ghcr.io/tuist/tuist-runner:${profile}-${PREVIOUS}-stacked" "${profile}-${VERSION}-stacked"
          done

  release:
    name: Release runner image
    needs: [plan, build, build-stacked, carry]
    if: >-
      always() &&
      needs.plan.outputs.release == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.build.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.build-stacked.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.carry.result)
    runs-on: tuist-linux
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Verify every profile is published
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          missing=0
          for xcode in $(jq -r '.[]' infra/runner-image/profiles.json); do
            for image_tag in "macos-${xcode//./-}-${VERSION}" "macos-${xcode//./-}-${VERSION}-stacked"; do
              if ! .github/scripts/ghcr-image-published.sh tuist/tuist-runner "$image_tag"; then
                echo "::error::ghcr.io/tuist/tuist-runner:${image_tag} is not published"
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Prepare release
        id: notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MANIFEST: ${{ needs.plan.outputs.manifest }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          jq . <<< "$MANIFEST" > build-manifest.json
          LATEST_VERSION=$(git tag -l | grep -E "^runner-image@[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
          {
            echo "body<<EOF"
            echo "Active runner image tags:"
            jq -r --arg v "$VERSION" --argjson built "$(jq '[.include[].xcode]' <<< "$MATRIX")" \
              '.[] | "- `ghcr.io/tuist/tuist-runner:macos-\(.xcode | gsub("\\."; "-"))-\($v)` and `-stacked` (\(if (.xcode | IN($built[])) then "rebuilt" else "unchanged" end) on `\(.base_digest)`)"' \
              build-manifest.json
            echo
            git cliff --include-path "infra/runner-image/**/*" --config infra/runner-image/cliff.toml --repository "." 2>/dev/null -- "${LATEST_VERSION}..HEAD" \
              | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create runner-image GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          repository: tuist/tuist
          target_commitish: ${{ github.sha }}
          name: Runner Image ${{ needs.plan.outputs.version }}
          tag_name: runner-image@${{ needs.plan.outputs.version }}
          files: build-manifest.json
          body: ${{ steps.notes.outputs.body }}
          # The workflow token cannot tag a commit whose workflow files differ
          # from main's, which a release that outlasts later merges hits. The
          # action reads only this input, not GITHUB_TOKEN from env.
          token: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN }}

  # Names this release's images to each cluster's macOS hosts before the deploy
  # below moves the RunnerPools to them. tart-kubelet pulls the next image of
  # each pool a host serves in the background (infra/tart-kubelet/AGENTS.md),
  # so the first job of a new image on a host does not wait 6 to 7 minutes for
  # the pull. A deploy reaches production about 20 minutes after it is
  # dispatched. Best effort: a failure here leaves the pulls to the Pods.
  announce:
    name: Announce upcoming runner images (${{ matrix.environment }})
    needs: [plan, release]
    if: always() && needs.release.result == 'success'
    runs-on: tuist-linux
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [canary, production]
    environment:
      name: server-k8s-${{ matrix.environment }}
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked kubectl jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - uses: 1password/install-cli-action@v4
        with:
          version: 2.31.1
      - name: Load kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          op document get "kubeconfig: tuist-${{ matrix.environment }}" \
            --vault "tuist-k8s-${{ matrix.environment }}" --output "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
      - name: Write the upcoming runner images ConfigMap
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        # Keys are `<xcode>.<variant>`, as tart-kubelet looks them up from a
        # RunnerPool's `tuist.dev/xcode-version` and
        # `tuist.dev/runner-image-variant` labels; values are the image by the
        # digest the deploy will resolve for the same tag.
        run: |
          set -euo pipefail
          namespace="$(kubectl get runnerpools.tuist.dev -A -l tuist.dev/runner-image-variant \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | head -n1)"
          if [ -z "$namespace" ]; then
            echo "No RunnerPool follows the runner image catalog in ${{ matrix.environment }}."
            exit 0
          fi
          args=()
          for xcode in $(jq -r '.[]' infra/runner-image/profiles.json); do
            tag="macos-${xcode//./-}-${VERSION}"
            standalone="$(.github/scripts/ghcr-manifest-digest.sh tuist/tuist-runner "$tag")"
            stacked="$(.github/scripts/ghcr-manifest-digest.sh tuist/tuist-runner "${tag}-stacked")"
            args+=(--from-literal "${xcode}.standalone=ghcr.io/tuist/tuist-runner@${standalone}")
            args+=(--from-literal "${xcode}.stacked=ghcr.io/tuist/tuist-runner@${stacked}")
          done
          kubectl create configmap tuist-upcoming-runner-images --namespace "$namespace" "${args[@]}" \
            --dry-run=client -o yaml |
            kubectl label --local -f - tuist.dev/upcoming-runner-images=true -o yaml |
            kubectl annotate --local -f - "tuist.dev/runner-image-release=${VERSION}" -o yaml |
            kubectl apply --server-side --field-manager=runner-image-release --force-conflicts -f -

  deploy:
    name: Deploy runner image
    needs: [release, announce]
    # The implicit success() also requires release's own skipped needs (the
    # re-tag job) to have succeeded, which would skip every deploy of a
    # release that rebuilt all profiles. A failed announcement only leaves
    # the pulls to the Pods.
    if: always() && needs.release.result == 'success'
    runs-on: tuist-linux
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Server Production Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run server-production-deployment.yml --repo "${{ github.repository }}" --ref main
