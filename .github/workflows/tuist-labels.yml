name: Tuist Labels

on:
  push:
    branches: [main]
    paths:
      - tools/tuist-labels/**
      - .github/workflows/tuist-labels.yml
  pull_request:
    paths:
      - tools/tuist-labels/**
      - .github/workflows/tuist-labels.yml
  merge_group:

permissions:
  contents: read

concurrency:
  group: tuist-labels-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/tuist-labels

jobs:
  test:
    name: Test and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: make test
      - run: GOWORK=off go vet ./...
      - run: test -z "$(gofmt -l cmd)"
      - run: make dist
