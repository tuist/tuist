name: CLI Headless Cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cli/Sources/TuistLaunchctl/**"
      - "cli/Sources/TuistKit/Services/Setup/SetupCacheCommandService.swift"
      - "cli/Sources/TuistKit/Services/Setup/CacheSocketService.swift"
      - "cli/Sources/TuistKit/Services/Teardown/TeardownCacheCommandService.swift"
      - "mise/tasks/cli/cache-headless-e2e.sh"
      - ".github/workflows/cli-cache-headless.yml"

permissions:
  contents: read

concurrency:
  group: cli-cache-headless-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  headless-cache:
    name: Headless Xcode cache end-to-end
    if: github.event.pull_request.head.repo.fork != true
    runs-on: tuist-macos
    timeout-minutes: 45
    env:
      MISE_GITHUB_ATTESTATIONS: 0
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.swift') }}-
      - uses: ./.github/actions/mise
        with:
          install_args: tuist
          cache: "false"
      - name: Build the CLI from this revision
        run: |
          tuist install --force-resolved-versions
          tuist generate tuist ProjectDescription --no-open
          xcodebuild build -workspace Tuist.xcworkspace -scheme tuist \
            -derivedDataPath "$RUNNER_TEMP/headless-cli-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILATION_CACHE_ENABLE_CACHING=NO > "$RUNNER_TEMP/headless-cli-build.log" 2>&1
      - name: Verify setup and remote cache hits without a GUI session
        run: |
          bash mise/tasks/cli/cache-headless-e2e.sh \
            "$RUNNER_TEMP/headless-cli-build/Build/Products/Debug/tuist" \
            "$RUNNER_TEMP/headless-cache-e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-cache-e2e
          path: |
            ${{ runner.temp }}/headless-cli-build.log
            ${{ runner.temp }}/headless-cache-e2e/*.log
          retention-days: 7
