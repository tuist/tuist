# Temporary, never merged: validates layered block cache volumes on staging's
# Golden Gate (macOS 27) runners. Two jobs share one volume key: the first
# writes it cold, the second must find the first's data (kept as a layer) and
# build warm. Each checksums the volume after a cache purge, the step that
# corrupted share-backed images on macOS 27.2.
name: Golden Gate block volume e2e

on:
  push:
    branches: [golden-gate-block-e2e]
  workflow_dispatch:

permissions:
  contents: read

env:
  VOLUME_KEY: golden-gate-block-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  run:
    name: run ${{ matrix.round }}
    if: ${{ contains(github.event.head_commit.message, '[e2e]') }}
    runs-on: tuist-staging-golden-gate
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        round: [1, 2]
    steps:
      - name: Report the guest
        run: |
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Build from a clone on the guest's own disk, so only the volume under
      # test holds anything a cache volume could have corrupted.
      - name: Fresh clone on the root disk
        run: |
          git clone -q --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}" "$HOME/src"
          echo "MISE_TRUSTED_CONFIG_PATHS=${MISE_TRUSTED_CONFIG_PATHS:-}:$HOME/src" >> "$GITHUB_ENV"
      - name: Build tuist-cache-volume from this branch
        working-directory: /Users/runner/src/infra/linux-runner-image
        run: mise x go@1.26.10 -- go build -o /tmp/tcv ./cmd/tuist-cache-volume
      - name: Attach the block volume
        run: |
          set -euo pipefail
          mkdir -p "$HOME/e2e" && cd "$HOME/e2e"
          /tmp/tcv --key "$VOLUME_KEY" --path ./vol | tee /tmp/attach.out
          root="$(cd ./vol && pwd -P)"
          echo "VOL=$root" >> "$GITHUB_ENV"
          echo "volume root: $root"
          # The volume must be a disk of its own, not an image on the share.
          dev="$(df "$root" | awk 'NR==2 {print $1}')"
          diskutil info "$dev" | grep -E "Device Location|Protocol|Volume Name|Mount Point|File System Personality|Disk Size"
          diskutil info "$dev" | grep -q "USB" || { echo "::error::$root is not on a USB disk"; exit 1; }
          mount | grep "My Shared Files" | grep -F "$root" && { echo "::error::volume is on the share"; exit 1; } || true
      - name: What the volume holds at mount
        run: |
          root="$(dirname "$VOL")"; scope="$(basename "$root")"
          echo "inventory at mount: $(cat "/Users/runner/.tuist-custom-cache/.$scope.inventory" 2>/dev/null | tr '\n' ' ')"
          ls -la "$root" "$VOL" | head -40
          df -k "$root"
          diskutil apfs list "$(df "$root" | awk 'NR==2 {print $1}')" 2>&1 | grep -E "Capacity In Use|Volume Name|Snapshot" | head
          ls -la "/Volumes/My Shared Files/custom-cache/$scope" || true
      - name: Check what the previous run left
        if: matrix.round == 2
        run: |
          set -euo pipefail
          test -f "$VOL/manifest.sha256" || { echo "::error::round 1's data is missing: the volume is cold"; exit 1; }
          (cd "$VOL" && shasum -a 256 -c --quiet manifest.sha256) && echo "round 1's $(wc -l < "$VOL/manifest.sha256") files intact"
      - uses: ./.github/actions/mise-install
        with:
          install: "erlang elixir"
          working-directory: server
      - name: Build the xcresult NIF on the volume
        working-directory: /Users/runner/src/server
        env:
          TUIST_NIF_BUILD_ROOT: ${{ env.VOL }}/nif
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./native/xcresult_nif/build.sh
          echo "::notice::round ${{ matrix.round }} built in $(( $(date +%s) - start )) s"
      - name: Write random files, purge, verify everything
        run: |
          set -euo pipefail
          mkdir -p "$VOL/random-${{ matrix.round }}"
          for i in $(seq 1 400); do head -c $(( (RANDOM % 512 + 1) * 1024 )) /dev/urandom > "$VOL/random-${{ matrix.round }}/$i.bin"; done
          (cd "$VOL" && find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 shasum -a 256 > manifest.sha256)
          sync && sudo purge
          (cd "$VOL" && shasum -a 256 -c --quiet manifest.sha256) && echo "$(wc -l < "$VOL/manifest.sha256") files intact after purge"
      - name: Detach the volume
        run: |
          set -euo pipefail
          root="$(dirname "$VOL")"; scope="$(basename "$root")"
          df -k "$root"; ls -la "$root"
          /tmp/tcv --detach-all
          mount | grep -F "$root" && echo "::error::still mounted" || echo "unmounted"
          ls -la "/Volumes/My Shared Files/custom-cache/$scope"
          cat "/Volumes/My Shared Files/custom-cache/$scope/.usage"; echo
