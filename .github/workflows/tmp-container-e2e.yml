name: TMP Container E2E

on:
  push:
    branches:
      - claude/android-docker-workflows-e2e-3abe26

permissions: {}

jobs:
  container-smoke:
    runs-on: tuist-linux-large
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner-shared trees are visible inside the container
        run: |
          set -euo pipefail
          echo "Running inside: $(head -1 /etc/os-release)"
          test -d /__w || { echo "ERROR: /__w missing"; exit 1; }
          echo "--- /__w ---"; ls -la /__w
          echo "--- /__e ---"; ls -la /__e
          test -x /__e/node20/bin/node || test -x /__e/node24/bin/node \
            || { echo "ERROR: no node runtime staged at /__e"; exit 1; }
          echo "--- /github ---"; ls -la /github

      - uses: actions/checkout@v4

      - name: Actions tree was populated and checkout landed
        run: |
          set -euo pipefail
          echo "--- /__w/_actions ---"; ls -R /__w/_actions | head -20
          test -f /__w/_actions/actions/checkout/v4/dist/index.js \
            || { echo "ERROR: checkout dist/index.js missing (the reported failure)"; exit 1; }
          test -f "$GITHUB_WORKSPACE/README.md"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls "$GITHUB_WORKSPACE" | head

      - name: Environment files round-trip
        run: echo "SMOKE_VALUE=ok" >> "$GITHUB_ENV"

      - name: Environment files round-trip check
        run: |
          set -euo pipefail
          test "${SMOKE_VALUE:-}" = "ok" || { echo "ERROR: GITHUB_ENV did not round-trip"; exit 1; }
          echo "GITHUB_ENV round-tripped"
