name: TMP Container E2E

on:
  push:
    branches:
      - claude/android-docker-workflows-e2e-3abe26

permissions: {}

jobs:
  container-smoke:
    runs-on: tuist-linux-large
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ubuntu:22.04
    steps:
      - name: Step script is reachable inside the container
        run: |
          set -euo pipefail
          echo "Running inside: $(head -1 /etc/os-release)"
          test -d /__w || { echo "ERROR: /__w missing"; exit 1; }
          ls -la /__e || true
          test -x /__e/node20/bin/node || test -x /__e/node24/bin/node \
            || { echo "ERROR: no node runtime staged at /__e"; exit 1; }

      - uses: actions/checkout@v4

      - name: Checkout landed in the workspace
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/README.md"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls "$GITHUB_WORKSPACE" | head

      - name: Environment files round-trip
        run: echo "SMOKE_VALUE=ok" >> "$GITHUB_ENV"

      - name: Environment files round-trip check
        run: |
          set -euo pipefail
          test "${SMOKE_VALUE:-}" = "ok" || { echo "ERROR: GITHUB_ENV did not round-trip"; exit 1; }
          echo "GITHUB_ENV round-tripped"

  docker-run-bind-mount:
    runs-on: tuist-linux-large
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker run -v bind mount sees the workspace
        run: |
          set -euo pipefail
          echo hello > "$GITHUB_WORKSPACE/tmp-bind-probe.txt"
          out=$(docker run --rm -v "$GITHUB_WORKSPACE:/mnt" ubuntu:22.04 cat /mnt/tmp-bind-probe.txt)
          test "$out" = "hello" || { echo "ERROR: bind mount empty, got '$out'"; exit 1; }
          echo "bind mount OK"
