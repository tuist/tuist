name: Runner Egress Gateway Image

# PR validation + ad-hoc image build for runner-egress-gateway, the WireGuard
# gateway that relays Mac runner host traffic to the internet from a dedicated
# egress address.
#
# Steady-state image promotion is owned by server-production-deployment.yml; this workflow only
# handles pre-release iteration via `:sha-<git-sha>` tags.

on:
  push:
    branches:
      - main
    paths:
      - infra/runner-egress-gateway/**
      - .github/workflows/runner-egress-gateway-image.yml
  pull_request:
    paths:
      - infra/runner-egress-gateway/**
      - .github/workflows/runner-egress-gateway-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/tuist-runner-egress-gateway

jobs:
  test:
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/runner-egress-gateway/go.mod
          cache-dependency-path: infra/runner-egress-gateway/go.sum
      - name: Test
        working-directory: infra/runner-egress-gateway
        run: go test ./...
      - name: Vet
        working-directory: infra/runner-egress-gateway
        run: go vet ./...

  build:
    needs: test
    if: github.repository == 'tuist/tuist' && github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            # latest tracks main only; a branch workflow_dispatch (pre-merge
            # staging builds) must not repoint it.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/runner-egress-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=runner-egress-gateway
          cache-to: type=gha,mode=max,scope=runner-egress-gateway
