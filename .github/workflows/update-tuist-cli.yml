# Bumps the `tuist` dev-tooling pin in mise.toml to the latest CLI release
# (including canary prereleases) and regenerates mise.lock in the SAME commit,
# along with the Tuist CLI the sandbox image (infra/sandbox-image/Dockerfile)
# installs.
#
# Renovate can't own this: its custom regex manager bumps mise.toml but can't
# write mise.lock (the six per-platform checksums need fetching, not regex), and
# its native mise manager's lock update is an unsafe execution the hosted Mend
# app refuses to run (https://github.com/renovatebot/renovate/discussions/43562).
# mise does both files atomically, so a small scheduled workflow is simpler than
# Renovate-bumps-then-a-second-workflow-repairs, and CI passes on the first run.
name: Update Tuist CLI

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tuist-cli
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  update:
    name: Update Tuist CLI
    if: github.repository == 'tuist/tuist'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(grep -E '^[[:space:]]*tuist = "' mise.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # Bare semver tags only (X.Y.Z / X.Y.Z-canary.N); component tags like
          # server@1.2.3 or runner-image@… are filtered out. semver-max keeps a
          # released X.Y.Z above its own prereleases, matching "latest including canary".
          versions=$(gh api 'repos/tuist/tuist/releases?per_page=100' \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || true)
          if [ -z "$versions" ]; then echo "No release versions found" >&2; exit 1; fi
          latest=$(printf '%s\n' $versions | xargs npx --yes semver@7 | tail -n1)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bumping tuist $current -> $latest"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on latest ($current)"
          fi
      - name: Bump mise.toml
        if: steps.resolve.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s|^([[:space:]]*tuist = \")[^\"]+(\")|\1${VERSION}\2|" mise.toml
          grep -E '^[[:space:]]*tuist = "' mise.toml
      - name: Bump the sandbox image's Tuist CLI
        if: steps.resolve.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sha=$(curl -fsSL --retry 3 "https://github.com/tuist/tuist/releases/download/${VERSION}/SHASUMS256.txt" \
            | awk '$2 ~ /(^|\/)tuist-linux-x86_64\.tar\.gz$/ { print $1 }')
          if [ -z "$sha" ]; then echo "No tuist-linux-x86_64.tar.gz checksum in ${VERSION}" >&2; exit 1; fi
          sed -i -E -e "s|^ARG TUIST_VERSION=.*|ARG TUIST_VERSION=${VERSION}|" \
            -e "s|^ARG TUIST_SHA256=.*|ARG TUIST_SHA256=${sha}|" infra/sandbox-image/Dockerfile
          grep -E '^ARG TUIST_(VERSION|SHA256)=' infra/sandbox-image/Dockerfile
      - uses: ./.github/actions/mise
        if: steps.resolve.outputs.changed == 'true'
        with:
          # Installing tuist unlocked rewrites its mise.lock entry across all
          # platforms (checksums come from the release SHASUMS, so one host
          # covers macOS and Linux).
          install_args: "tuist 1password-cli"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Load GitHub App credentials from 1Password
        id: app-credentials
        if: steps.resolve.outputs.changed == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          # Not GITHUB_ENV: its values are printed unmasked in every later step's
          # env. add-mask matches single lines, so each PEM line is masked.
          key="$(op read 'op://tuist/Tuist Automation GitHub App/private-key')"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$key"
          {
            echo "app-id=$(op read 'op://tuist/Tuist Automation GitHub App/app-id')"
            echo "private-key<<__OP_PEM__"
            printf '%s\n' "$key"
            echo "__OP_PEM__"
          } >> "$GITHUB_OUTPUT"
      - name: Mint a GitHub App token
        id: app-token
        if: steps.resolve.outputs.changed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ steps.app-credentials.outputs.app-id }}
          private-key: ${{ steps.app-credentials.outputs.private-key }}
      - name: Open pull request
        id: pr
        if: steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # A GitHub App installation token, not GITHUB_TOKEN (whose pushes don't
          # trigger checks) and not a tuistit PAT (whose account-wide REST limit is
          # drained by deployments, so PR creation here failed every run). The App
          # has its own rate-limit pool and its commits/PRs do trigger checks.
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/update-tuist-cli
          delete-branch: true
          commit-message: "chore(cli): update Tuist CLI to ${{ steps.resolve.outputs.version }}"
          title: "chore(cli): update Tuist CLI to ${{ steps.resolve.outputs.version }}"
          body: |
            Bumps the `tuist` dev-tooling pin in `mise.toml` to `${{ steps.resolve.outputs.version }}` (latest release, including canary prereleases) with `mise.lock` regenerated in the same commit so CI's `MISE_LOCKED=1` install resolves, and the sandbox image's Tuist CLI to the same release.

            Opened by the `update-tuist-cli` workflow.
          add-paths: |
            mise.toml
            mise.lock
            infra/sandbox-image/Dockerfile
          committer: "github-actions <github-actions@github.com>"
          author: "github-actions <github-actions@github.com>"
      - name: Enable auto-merge
        if: steps.resolve.outputs.changed == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}" || true
