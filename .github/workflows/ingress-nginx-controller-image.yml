name: ingress-nginx Controller Image

# Builds the ingress-nginx controller our platform charts run, from the
# chainguard-forks/ingress-nginx revision pinned below. Upstream retired the
# project; the fork keeps backporting nginx CVE fixes as patches in
# images/nginx/rootfs/patches.
#
# The fork's NGINX_BASE file still names upstream's unpatched
# registry.k8s.io/ingress-nginx/nginx:v2.2.8, so building the controller
# Dockerfile as-is would ship none of those patches. This workflow builds the
# nginx base from images/nginx/rootfs first and the controller on top of it.
#
# Tags are immutable: a run whose tag already exists reuses that image instead
# of rebuilding it. Move to a newer fork release by changing FORK_REF and the
# versions together. amd64 only: every node that runs an ingress-nginx
# controller is amd64.

on:
  push:
    paths:
      - .github/workflows/ingress-nginx-controller-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ingress-nginx-controller-image
  cancel-in-progress: false

env:
  FORK_REPOSITORY: chainguard-forks/ingress-nginx
  FORK_TAG: controller-v1.15.15
  FORK_REF: 1045ec1be710a1fad0a7f9d72c6275a06f8b0388
  CONTROLLER_VERSION: v1.15.15
  NGINX_BASE_VERSION: v2.2.25
  NGINX_VERSION: 1.27.1
  CONTROLLER_IMAGE: ghcr.io/tuist/ingress-nginx-controller
  NGINX_IMAGE: ghcr.io/tuist/ingress-nginx-nginx

jobs:
  build:
    if: github.repository == 'tuist/tuist'
    runs-on: tuist-linux-large
    timeout-minutes: 180
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPOSITORY }}
          ref: ${{ env.FORK_REF }}
          path: ingress-nginx
          persist-credentials: false

      - name: Verify the pinned fork revision
        working-directory: ingress-nginx
        run: |
          tagged="$(git ls-remote "https://github.com/$FORK_REPOSITORY" "refs/tags/$FORK_TAG^{}" "refs/tags/$FORK_TAG" | awk 'NR==1 || /\^\{\}$/ {sha=$1} END {print sha}')"
          [ "$tagged" = "$FORK_REF" ] || { echo "$FORK_TAG is $tagged, not the pinned $FORK_REF"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$FORK_REF" ]
          [ "$(cat images/nginx/TAG)" = "$NGINX_BASE_VERSION" ] || { echo "images/nginx/TAG is $(cat images/nginx/TAG)"; exit 1; }
          grep -qx "export NGINX_VERSION=$NGINX_VERSION" images/nginx/rootfs/build.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short="${FORK_REF::12}"
          nginx="${NGINX_IMAGE}:${NGINX_BASE_VERSION}-${short}"
          controller="${CONTROLLER_IMAGE}:${CONTROLLER_VERSION}-${short}"
          exists() { docker buildx imagetools inspect "$1" >/dev/null 2>&1 && echo true || echo false; }
          {
            echo "nginx=$nginx"
            echo "controller=$controller"
            echo "nginx_exists=$(exists "$nginx")"
            echo "controller_exists=$(exists "$controller")"
          } >> "$GITHUB_OUTPUT"

      - name: Build the patched nginx base
        if: steps.tags.outputs.controller_exists != 'true' && steps.tags.outputs.nginx_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ingress-nginx/images/nginx/rootfs
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.nginx }}

      - name: Resolve the nginx base digest
        id: base
        if: steps.tags.outputs.controller_exists != 'true'
        env:
          NGINX_TAG: ${{ steps.tags.outputs.nginx }}
        run: echo "digest=$(docker buildx imagetools inspect "$NGINX_TAG" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.tags.outputs.controller_exists != 'true'
        with:
          go-version-file: ingress-nginx/GOLANG_VERSION
          cache: false

      - name: Build the controller binaries
        if: steps.tags.outputs.controller_exists != 'true'
        working-directory: ingress-nginx
        env:
          PKG: k8s.io/ingress-nginx
          ARCH: amd64
          TAG: ${{ env.CONTROLLER_VERSION }}
          COMMIT_SHA: ${{ env.FORK_REF }}
          REPO_INFO: https://github.com/${{ env.FORK_REPOSITORY }}
          # The fork is checked out inside the runner workspace, where the
          # tuist repository's go.work would otherwise take over the build.
          GOWORK: "off"
        # The script is marked #!/bin/sh but uses bash's `set -o pipefail`.
        run: bash build/build.sh

      - name: Build the controller
        if: steps.tags.outputs.controller_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ingress-nginx/rootfs
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.nginx }}@${{ steps.base.outputs.digest }}
            TARGETARCH=amd64
            VERSION=${{ env.CONTROLLER_VERSION }}
            COMMIT_SHA=${{ env.FORK_REF }}
            BUILD_ID=${{ github.run_id }}
          tags: ${{ steps.tags.outputs.controller }}

      # The chart runs the controller as uid 101, gid 82 and expects the Lua
      # the v1.13+ template loads from files.
      - name: Check the controller image
        env:
          IMAGE: ${{ steps.tags.outputs.controller }}
        run: |
          docker pull --quiet "$IMAGE"
          docker run --rm --entrypoint /nginx-ingress-controller "$IMAGE" --version
          docker run --rm --entrypoint nginx "$IMAGE" -v 2>&1 | grep -F "nginx/$NGINX_VERSION"
          [ "$(docker run --rm --entrypoint id "$IMAGE" -u):$(docker run --rm --entrypoint id "$IMAGE" -g)" = "101:82" ]
          docker run --rm --entrypoint test "$IMAGE" -f /etc/nginx/lua/ngx_conf_init_worker.lua
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          {
            echo "### ingress-nginx controller"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Digest: \`$digest\`"
            echo "- Source: $FORK_REPOSITORY@$FORK_REF ($FORK_TAG), nginx base $NGINX_BASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=ingress-nginx controller::$IMAGE@$digest"
