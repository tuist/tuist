name: PR Legacy Cache Credential Probe (disposable)

on:
  pull_request:
    paths:
      - .github/workflows/pr-legacy-cache-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER: https://canary.tuist.dev
      CACHE: https://cache-eu-central-canary.tuist.dev
      TUIST_AUTH_EMAIL: tuistrocks@tuist.dev
      TUIST_AUTH_PASSWORD: tuistrocks
    steps:
      - name: Probe the legacy cache node with every credential a CLI can send
        run: |
          set -uo pipefail
          hash=0123456789abcdef0123456789abcdef

          login() {
            curl -sS -X POST "$SERVER/api/auth" -H 'content-type: application/json' \
              -d "{\"email\":\"$TUIST_AUTH_EMAIL\",\"password\":\"$TUIST_AUTH_PASSWORD\"}" | jq -r .access_token
          }

          claims() {
            local payload
            payload="$(printf '%s' "$1" | cut -d. -f2 | tr '_-' '/+')"
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            printf '%s' "$payload" | base64 -d 2>/dev/null |
              jq -c '{typ, type, scopes, projects: (.projects | length? // null), grants: .cache_grants, payment_required: .cache_payment_required}' 2>/dev/null ||
              echo "(not a JWT)"
          }

          cache_token() {
            curl -sS -X POST "$SERVER/api/cache/token?full_handle=$2" -H "Authorization: Bearer $1" \
              -H 'x-tuist-cli-version: 4.207.0' | jq -r '.token // ("ERROR " + tostring)'
          }

          probe() {
            local label="$1" token="$2" project="$3" method="${4:-GET}" status body
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' -X "$method" \
              -H "Authorization: Bearer $token" -H 'x-tuist-cli-version: 4.207.0' \
              "$CACHE/api/cache/module/$hash?account_handle=tuist&project_handle=$project&hash=$hash&name=Framework.zip&cache_category=builds")"
            printf '%-62s %s %s %s\n' "$label" "$method" "$status" "$(head -c 120 "$body")"
          }

          before="$(login)"
          handle="bc-probe-$(cat /proc/sys/kernel/random/uuid | tr -d '-' | cut -c1-10)"
          project_id="$(curl -sS -X POST "$SERVER/api/projects" -H "Authorization: Bearer $before" -H 'content-type: application/json' \
            -d "{\"full_handle\":\"tuist/$handle\",\"build_system\":\"xcode\"}" | jq -r .id)"
          echo "throwaway project tuist/$handle (id $project_id)"
          after="$(login)"

          project_token="$(curl -sS -X POST "$SERVER/api/projects/tuist/$handle/tokens" -H "Authorization: Bearer $after" | jq -r '.token // ("ERROR " + tostring)')"
          account_token_name="probe-$handle"
          account_token="$(curl -sS -X POST "$SERVER/api/accounts/tuist/tokens" -H "Authorization: Bearer $after" -H 'content-type: application/json' \
            -d "{\"name\":\"$account_token_name\",\"scopes\":[\"project:cache:read\",\"project:cache:write\"]}" | jq -r '.token // ("ERROR " + tostring)')"

          echo "== claims"
          echo "user access token minted before the project: $(claims "$before")"
          echo "user access token minted after the project:  $(claims "$after")"
          user_ct="$(cache_token "$before" "tuist/$handle")"
          echo "user cache token scoped to the project:       $(claims "$user_ct")"
          user_ct_case="$(cache_token "$before" "Tuist/$handle")"
          echo "user cache token, scope in another case:      $(claims "$user_ct_case")"
          user_ct_unscoped="$(curl -sS -X POST "$SERVER/api/cache/token" -H "Authorization: Bearer $before" | jq -r '.token // ("ERROR " + tostring)')"
          echo "user cache token, no scope:                   $(claims "$user_ct_unscoped")"
          echo "project token:                                $(claims "$project_token")"
          project_ct="$(cache_token "$project_token" "tuist/$handle")"
          echo "project cache token:                          $(claims "$project_ct")"
          echo "account token:                                $(claims "$account_token")"
          account_ct="$(cache_token "$account_token" "tuist/$handle")"
          echo "account cache token:                          $(claims "$account_ct")"

          echo "== legacy node answers (404 = authorized miss, 403 = refused)"
          probe "user access token minted before the project" "$before" "$handle"
          probe "user access token minted after the project" "$after" "$handle"
          probe "user cache token scoped to the project" "$user_ct" "$handle"
          probe "user cache token, scope in another case" "$user_ct_case" "$handle"
          probe "user cache token, no scope" "$user_ct_unscoped" "$handle"
          probe "project token" "$project_token" "$handle"
          probe "project cache token" "$project_ct" "$handle"
          probe "account token" "$account_token" "$handle"
          probe "account cache token" "$account_ct" "$handle"
          probe "user cache token scoped to the project, other project" "$user_ct" "tuist"

          echo "== cleanup"
          curl -sS -o /dev/null -w 'delete account token %{http_code}\n' -X DELETE "$SERVER/api/accounts/tuist/tokens/$account_token_name" -H "Authorization: Bearer $after"
          curl -sS -o /dev/null -w 'delete project %{http_code}\n' -X DELETE "$SERVER/api/projects/$project_id" -H "Authorization: Bearer $after"
