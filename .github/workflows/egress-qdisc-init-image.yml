name: Egress Qdisc Init Image

on:
  push:
    branches: [main]
    paths:
      - infra/egress-qdisc-init/**
      - .github/workflows/egress-qdisc-init-image.yml
  pull_request:
    paths:
      - infra/egress-qdisc-init/**
      - .github/workflows/egress-qdisc-init-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/egress-qdisc-init

jobs:
  lint:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck entrypoint
        run: |
          docker run --rm -v "$PWD/infra/egress-qdisc-init:/mnt" koalaman/shellcheck:stable /mnt/entrypoint.sh

  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/egress-qdisc-init/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=egress-qdisc-init
          cache-to: type=gha,mode=max,scope=egress-qdisc-init
