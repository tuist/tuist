name: TEMP Kura helper-container path

# TEMPORARY. Delete once it has reported.
#
# Exercises the local-path provisioner's quota hook against a REAL XFS
# filesystem with real xfs_quota, rather than the stubs used locally.
#
# It exists because the stubs validated a model of xfs_quota rather than
# xfs_quota. Review caught one instance of that: `project -c` prints a
# "Processed N ... paths" footer whether or not anything is wrong, the filter
# dropped only the leading line, and setup would have exited 1 on every volume
# of every working box. The same class of risk sits unexercised in `limit -p`,
# the `report -p -N -b` column parsing, the `state -p` grep, and
# `project -s` / `-C`.
#
# The hook is extracted from the RENDERED chart, not from a copy, so this tests
# the bytes that actually ship.

on:
  # Branch-scoped push, because workflow_dispatch only resolves workflows that
  # already exist on the default branch. Goes away with the rest of this file.
  push:
    branches: [claude/kura-per-account-storage-quotas]
  workflow_dispatch: {}

jobs:
  quota-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xfsprogs and helm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create a real XFS filesystem with project quotas at /data
        run: |
          set -euxo pipefail
          # Non-sparse: a sparse image would let the inner filesystem believe in
          # space the outer one does not have, which is its own failure mode.
          sudo truncate -s 2G /xfs.img
          sudo mkfs.xfs -q /xfs.img
          sudo mkdir -p /data
          sudo mount -o loop,prjquota /xfs.img /data
          findmnt -no FSTYPE,OPTIONS /data
          sudo xfs_quota -x -c "state -p" /data

      - name: Extract the hook exactly as the chart renders it
        run: |
          set -euxo pipefail
          helm template t infra/helm/tuist \
            --set capi.enabled=true --set kuraFleet.enabled=true \
            --set server.license.key=dummy \
            -s templates/kura-fleet-storage.yaml > /tmp/rendered.yaml
          yq 'select(.kind=="ConfigMap") | .data.setup' /tmp/rendered.yaml \
            | sed -n "/^PROGRAM=\$(cat <<'TUIST_QUOTA_EOF'\$/,/^TUIST_QUOTA_EOF\$/p" \
            | sed '1d;$d' > /tmp/program.sh
          test -s /tmp/program.sh
          echo "--- extracted $(wc -l < /tmp/program.sh) lines ---"

      - name: Extract the rendered setup hook VERBATIM, nsenter wrapper included
        run: |
          set -euxo pipefail
          yq 'select(.kind=="ConfigMap") | .data.setup' /tmp/rendered.yaml > /tmp/setup.sh
          echo "--- the hook, as the helper container runs it ---"
          grep -n "nsenter" /tmp/setup.sh

      - name: Run it inside a BusyBox container exactly as the helper Pod does
        run: |
          set -euxo pipefail
          # The production shape: BusyBox image, host PID namespace so `nsenter
          # --target 1` addresses the node's init, privileged for the
          # CAP_SYS_ADMIN quotactl needs, and the provisioner root bind-mounted
          # in the way local-path mounts the PV's parent directory.
          #
          # This is the claim under test: BusyBox has neither findmnt nor
          # xfs_quota, so if entering the mount namespace did NOT move the
          # process root, the hook would fail at its first findmnt.
          sudo mkdir -p /data/vol
          docker run --rm --privileged --pid=host \
            -v /data:/data \
            -v /tmp/setup.sh:/script/setup:ro \
            -e VOL_DIR=/data/vol/pvc-container_kura_acct \
            -e VOL_SIZE_BYTES=$((16 * 1024 * 1024)) \
            busybox sh /script/setup

          echo "--- did the ceiling actually land, seen from the host? ---"
          sudo cat /etc/projects
          id=$(sudo grep ":/data/vol/pvc-container_kura_acct$" /etc/projects | cut -d: -f1)
          hard=$(sudo xfs_quota -x -c "report -p -N -b" /data | awk -v p="#$id" '$1==p {print $4}')
          [ "$hard" = "16384" ] || { echo "FAIL: hard limit is '$hard' KiB, want 16384"; exit 1; }
          echo "PASS: the container path applied a real ceiling of ${hard} KiB"

          if sudo dd if=/dev/zero of=/data/vol/pvc-container_kura_acct/blob bs=1M count=64 2>/tmp/dd.err; then
            echo "FAIL: quota not enforced"; exit 1
          fi
          grep -qiE "no space left|disk quota exceeded" /tmp/dd.err || {
            echo "FAIL: wrong error:"; cat /tmp/dd.err; exit 1; }
          echo "PASS: write past the ceiling refused"

      - name: Tear down
        if: always()
        run: |
          sudo umount /data 2>/dev/null || true
          sudo rm -f /xfs.img
