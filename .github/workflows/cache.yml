name: Cache

on:
  push:
    branches:
      - main
    paths:
      - cache/**
      - tuist_common/**
      - .github/workflows/cache.yml
      - .github/scripts/cache-volumes/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - cache/**
      - tuist_common/**
      - .github/workflows/cache.yml
      - .github/scripts/cache-volumes/**
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: cache-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cache

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_CEILING_PATHS: ${{ github.workspace }}

jobs:
  mix-cache-setup:
    name: Mix cache setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/cache-volumes/mix_test.sh
        working-directory: ${{ github.workspace }}
  format:
    name: Format
    runs-on: tuist-linux
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "erlang elixir ruby"
          working_directory: cache
      - uses: tuist/cache-volume@v1
        id: mix-volume
        with:
          key: ci-cache-${{ github.job }}-v1
          path: ${{ runner.temp }}/mix-cache
      - name: Configure Mix cache directories
        env:
          MIX_VOLUME_HIT: ${{ steps.mix-volume.outputs.cache-hit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cache-volumes/mix.sh"
      - name: Install dependencies
        run: mise run --skip-tools install
      - name: Check format
        run: mise run --skip-tools format --check

  credo:
    name: Credo
    runs-on: tuist-linux
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "erlang elixir ruby"
          working_directory: cache
      - uses: tuist/cache-volume@v1
        id: mix-volume
        with:
          key: ci-cache-${{ github.job }}-v1
          path: ${{ runner.temp }}/mix-cache
      - name: Configure Mix cache directories
        env:
          MIX_VOLUME_HIT: ${{ steps.mix-volume.outputs.cache-hit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cache-volumes/mix.sh"
      - name: Install dependencies
        run: mise run --skip-tools install
      - name: Run Credo
        run: mise run --skip-tools credo

  test:
    name: Test
    runs-on: tuist-linux
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "erlang elixir ruby"
          working_directory: cache
      - uses: tuist/cache-volume@v1
        id: mix-volume
        with:
          key: ci-cache-${{ github.job }}-v1
          path: ${{ runner.temp }}/mix-cache
      - name: Configure Mix cache directories
        env:
          MIX_VOLUME_HIT: ${{ steps.mix-volume.outputs.cache-hit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cache-volumes/mix.sh"
      - name: Install dependencies
        run: mise run --skip-tools install
      - name: Run tests
        run: mise run --skip-tools test

  compile-prod:
    name: Compile (prod)
    runs-on: tuist-linux
    timeout-minutes: 15
    if: github.repository == 'tuist/tuist' && (github.event.pull_request.draft == false || github.event_name != 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mise
        with:
          install_args: "erlang elixir ruby"
          working_directory: cache
      - uses: tuist/cache-volume@v1
        id: mix-volume
        with:
          key: ci-cache-${{ github.job }}-v1
          path: ${{ runner.temp }}/mix-cache
      - name: Configure Mix cache directories
        env:
          MIX_VOLUME_HIT: ${{ steps.mix-volume.outputs.cache-hit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cache-volumes/mix.sh"
      - name: Install dependencies
        run: mise run --skip-tools install
      - name: Compile with MIX_ENV=prod
        run: MIX_ENV=prod mix compile --warnings-as-errors

  docker-compose:
    name: Docker Compose
    runs-on: tuist-linux
    timeout-minutes: 5
    if: github.repository == 'tuist/tuist'
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
