name: Linux Build Cache Benchmark

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner profile; use the same profile for every comparison phase
        type: string
        default: tuist-linux-large
      remote_cache:
        description: Enable Kura remote caching; run cold to seed it before baseline and warm comparisons
        type: boolean
        default: false
      workload:
        description: Workload to measure
        type: choice
        options: [all, kura, registry]
        default: all
      cache_key:
        description: Unique experiment key; reuse for cold and warm runs
        required: true
        type: string
      phase:
        description: Run baseline, cold, then warm after publication
        type: choice
        options: [baseline, cold, warm]
        required: true

permissions:
  contents: read

env:
  # Reviewed main commit, fixed across all phases and never dispatch-selected.
  SOURCE_SHA: 92ad9c2d908ca7c2aa12aa1f9559f86e9992f894
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_CEILING_PATHS: ${{ github.workspace }}
  # The benchmark excludes parent mise configs; select the CLI pinned by SOURCE_SHA explicitly.
  MISE_TUIST_VERSION: 4.211.0-canary.21

concurrency:
  group: build-cache-benchmark-${{ inputs.cache_key }}
  cancel-in-progress: false

jobs:
  benchmark:
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.workload }} / ${{ inputs.phase }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(inputs.workload == 'kura' && '["kura"]' || inputs.workload == 'registry' && '["registry"]' || '["kura", "registry"]') }}
    env:
      PHASE: ${{ inputs.phase }}
      WORKLOAD: ${{ matrix.workload }}
      REMOTE_CACHE: ${{ inputs.remote_cache && matrix.workload == 'kura' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuist/tuist
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      # Use the reviewed cache configuration with the fixed benchmark source.
      # Keeping them separate allows benchmarking on runners-benchmark before merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .benchmark
          sparse-checkout: kura/.bazelrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use the reviewed Bazel configuration
        if: matrix.workload == 'kura'
        run: cp .benchmark/kura/.bazelrc kura/.bazelrc
      - uses: ./.github/actions/mise
        with:
          install_args: ${{ matrix.workload == 'kura' && (inputs.remote_cache && 'rust bazel tuist' || 'rust bazel') || 'erlang elixir' }}
          working_directory: ${{ matrix.workload }}
      - name: Configure and require the remote cache
        if: inputs.remote_cache && matrix.workload == 'kura'
        working-directory: kura
        env:
          BENCHMARK_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BENCHMARK_REPOSITORY" = tuist/runners-benchmark ]; then
            # This repository already has OIDC access to the benchmark project.
            printf 'project = "tuist/mastodon"\n' > tuist.toml
          fi
          tuist auth login
          tuist bazel setup
          grep -q '^build --remote_cache=.' .bazelrc.tuist
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config
      - name: Start attachment timer
        run: |
          if [ "$WORKLOAD" = kura ]; then
            echo "CACHE_PATH=$HOME/.cache/tuist/bazel" >> "$GITHUB_ENV"
            echo 'SECOND_CACHE=' >> "$GITHUB_ENV"
          else
            echo "CACHE_PATH=$GITHUB_WORKSPACE/registry/deps" >> "$GITHUB_ENV"
            echo "SECOND_CACHE=$GITHUB_WORKSPACE/registry/_build" >> "$GITHUB_ENV"
          fi
          echo "CACHE_START=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: tuist/cache-volume@v1
        if: inputs.phase != 'baseline'
        id: volume
        with:
          key: benchmark-${{ inputs.cache_key }}-${{ matrix.workload }}
          path: ${{ env.CACHE_PATH }}
      - uses: tuist/cache-volume@v1
        if: inputs.phase != 'baseline' && matrix.workload == 'registry'
        id: build-volume
        with:
          key: benchmark-${{ inputs.cache_key }}-registry-build
          path: registry/_build
      - name: Verify mounted cache and source
        env:
          CACHE_HIT: ${{ steps.volume.outputs.cache-hit }}
          BUILD_CACHE_HIT: ${{ steps.build-volume.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "CACHE_MS=$(( ($(date +%s%N) - CACHE_START) / 1000000 ))" >> "$GITHUB_ENV"
          expected=false
          if [ "$PHASE" = warm ]; then expected=true; fi
          if [ "$PHASE" != baseline ]; then
            test "$CACHE_HIT" = "$expected"
            if [ "$WORKLOAD" = registry ]; then test "$BUILD_CACHE_HIT" = "$expected"; fi
          fi
          for path in "$CACHE_PATH" "$SECOND_CACHE"; do
            [ -n "$path" ] || continue
            test ! -L "$path"
            if [ "$PHASE" = baseline ]; then
              if mountpoint -q "$path"; then exit 1; fi
            else
              mountpoint -q "$path"
              if [ "$PHASE" = warm ]; then
                test "$(cat "$path/.benchmark-source")" = "$SOURCE_SHA"
              else
                test ! -e "$path/.benchmark-source"
              fi
              printf '%s' "$SOURCE_SHA" > "$path/.benchmark-source"
            fi
          done
      - name: Build and measure
        working-directory: ${{ matrix.workload }}
        env:
          MIX_ENV: prod
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          if [ "$WORKLOAD" = kura ]; then
            args=()
            if [ "$REMOTE_CACHE" = true ] && [ "$PHASE" = baseline ]; then
              args+=(--disk_cache=)
            fi
            ../.github/scripts/retry-bazel-command.sh bazel build //:kura "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"
            test -x bazel-bin/kura
            remote_hits=$(grep -Eo '[0-9]+ remote cache hit' "$RUNNER_TEMP/bazel-build.log" | tail -1 | cut -d' ' -f1 || true)
            disk_hits=$(grep -Eo '[0-9]+ disk cache hit' "$RUNNER_TEMP/bazel-build.log" | tail -1 | cut -d' ' -f1 || true)
            echo "REMOTE_HITS=${remote_hits:-0}" >> "$GITHUB_ENV"
            echo "DISK_HITS=${disk_hits:-0}" >> "$GITHUB_ENV"
            if [ "$REMOTE_CACHE" = true ] && [ "$PHASE" = baseline ]; then
              test "${remote_hits:-0}" -gt 0
            fi
          else
            mix local.hex --force
            mix local.rebar --force
            mix deps.get
            mix compile --warnings-as-errors
            test -s _build/prod/lib/tuist_registry/ebin/tuist_registry.app
            for link in _build/prod/lib/*/priv _build/prod/lib/*/include; do
              if [ -L "$link" ]; then test -e "$link"; fi
            done
          fi
          echo "WORKLOAD_MS=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_ENV"
      - name: Record measurement
        env:
          CACHE_HIT: ${{ steps.volume.outputs.cache-hit }}
          RUNNER_PROFILE: ${{ inputs.runner_label }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-cache-results"
          bytes=$(du -sb "$CACHE_PATH" | cut -f1)
          if [ -n "$SECOND_CACHE" ]; then bytes=$((bytes + $(du -sb "$SECOND_CACHE" | cut -f1))); fi
          jq -n --arg source "$SOURCE_SHA" --arg phase "$PHASE" --arg workload "$WORKLOAD" --arg profile "$RUNNER_PROFILE" \
            --arg hit "$CACHE_HIT" --argjson cache_ms "$CACHE_MS" --argjson workload_ms "$WORKLOAD_MS" \
            --argjson bytes "$bytes" --argjson remote_cache "$REMOTE_CACHE" \
            --argjson remote_hits "${REMOTE_HITS:-0}" --argjson disk_hits "${DISK_HITS:-0}" \
            '{source:$source, profile:$profile, phase:$phase, workload:$workload, hit:$hit, cache_ms:$cache_ms, workload_ms:$workload_ms, bytes:$bytes,
              remote_cache:$remote_cache, remote_hits:$remote_hits, disk_hits:$disk_hits}' \
            > "$RUNNER_TEMP/build-cache-results/$WORKLOAD-$PHASE.json"
          {
            echo '| Workload | Phase | Attachment (ms) | Build (ms) | Cache hit |'
            echo '| --- | --- | ---: | ---: | --- |'
            echo "| $WORKLOAD | $PHASE | $CACHE_MS | $WORKLOAD_MS | $CACHE_HIT |"
            echo
            echo "Source: $SOURCE_SHA. Profile: $RUNNER_PROFILE. Remote cache enabled: $REMOTE_CACHE."
            echo "Remote action hits: ${REMOTE_HITS:-0}; local disk hits: ${DISK_HITS:-0}."
            echo 'With remote caching enabled, seed with the cold phase first; baseline measures remote-only with empty local state.'
            echo 'Timing excludes checkout, tools, native prerequisite installation, queueing and post-job publication.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build-cache-${{ matrix.workload }}-${{ inputs.phase }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-cache-results/*.json
