name: L10n

on:
  push:
    branches:
      - main
    paths:
      - "translate.exs"
      - "server/priv/gettext/*.pot"
      - "L10N.md"
      - "server/L10N.md"
      - "server/L10N/**"
      - "server/priv/docs/L10N.md"
      - "server/priv/docs/L10N/**"
      - "server/priv/docs/en/guides/install-tuist.md"
      - "server/priv/docs/en/guides/features/cache.md"

permissions:
  contents: write
  pull-requests: write

# Runs queue instead of cancelling: a cancelled run has already paid for the
# model calls it made, and cancelling it threw that spend away.
concurrency:
  group: l10n-translations
  cancel-in-progress: false

env:
  MISE_VERSION: "2026.5.15"
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  translate:
    name: Translate
    runs-on: tuist-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "elixir erlang"
          cache: "true"
      - name: Install server dependencies
        working-directory: server
        run: mix deps.get
      - name: Run translations
        env:
          HIVE_INFERENCE_API_KEY: ${{ secrets.HIVE_INFERENCE_API_KEY }}
        run: elixir translate.exs --model "hive:Translator"
      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git diff --name-only -- '*.po' '.l10n/' 'server/priv/docs/**/*.md') ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TUISTIT_TOKEN || github.token }}
          commit-message: "chore(server): update translations"
          branch: l10n/update-translations
          title: "chore(server): update translations"
          body: |
            Automated translation update triggered by changes to `.pot` files or `L10N.md` context.

            Merge this promptly. The `.l10n/*.lock` files only advance when this
            lands, and every run made against stale locks re-translates entries
            that are already done.
          add-paths: |
            .l10n/**
            server/priv/gettext/**/*.po
            server/priv/docs/**/*.md
          committer: "tuistit <tuistit@users.noreply.github.com>"
          author: "tuistit <tuistit@users.noreply.github.com>"
