name: Sandbox Template Image

# PR validation + on-demand build of the sandbox guest template image
# (infra/sandbox-image/): the Firecracker kernel + rootfs that the sandboxd
# DaemonSet's init container copies onto each node, consumed by
# `sandboxes.templateImage` in the helm chart.
#
# PR: builds without pushing.
# workflow_dispatch: builds and pushes a `:sha-<git-sha>` tag; pin it in
#     `sandboxes.templateImage.tag` of the env values file.
#
# Mirrors .github/workflows/linux-runner-image.yml.

on:
  pull_request:
    paths:
      - infra/sandbox-image/**
      - .github/workflows/sandbox-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/tuist-sandbox-template

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/sandbox-image/go.mod
          cache-dependency-path: infra/sandbox-image/go.sum
      - name: Test
        working-directory: infra/sandbox-image
        run: go test ./...
      - name: Vet
        working-directory: infra/sandbox-image
        run: go vet ./...

  build:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    needs: test
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${IMAGE}:pr-${GIT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:sha-${GIT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: infra/sandbox-image
          file: infra/sandbox-image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=sandbox-image
          cache-to: type=gha,mode=max,scope=sandbox-image
