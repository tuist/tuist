name: Kura Runtime Image

# Builds and pushes an ad-hoc Kura runtime image (`ghcr.io/tuist/kura`) from a
# specific commit, so a feature branch can be deployed to staging before it is
# merged and the push-to-main `release-kura-docker` job cuts a `kura@` release.
#
# The binary is compiled with Bazel (`mise run compile`; opt via kura/.bazelrc),
# reusing the Tuist remote cache like the rest of Kura CI, then baked into
# Dockerfile.release — the same prebuilt-binary assembly the release pipeline uses.
# This dispatch build is amd64-only (the Hetzner managed-region and staging runner
# nodes are amd64). Pair it with a `Server Deployment` dispatch: pass the printed
# `sha-<sha>` tag as `kura_runtime_image_tag` and the same commit as `commit_sha`.
#
# The default dispatch is build-only qualification. Publication requires an
# explicitly authorized qualification_only=false dispatch; it is never a side
# effect of collecting resource evidence.
#
# A matching stub registers this workflow_dispatch trigger on the default branch
# (GitHub requires that before the workflow can be dispatched against any ref);
# dispatching against this branch runs the real build below.

on:
  workflow_dispatch:
    inputs:
      qualification_only:
        description: Build-only Linux tests, release assembly and ABBA resource evidence (no publication)
        type: boolean
        default: true
      resource_repetitions:
        description: Complete ABBA blocks on the same host (build-only qualification)
        type: choice
        options: ['1', '2', '3']
        default: '1'

permissions:
  contents: read
  packages: write
  id-token: write

defaults:
  run:
    working-directory: kura

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuist/kura

jobs:
  qualify:
    name: Linux build-only resource evidence
    if: inputs.qualification_only
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mise
        with:
          install_args: bazel node
          working_directory: kura
          env: false
      - name: Check workload and measurement contracts
        run: mise exec -- node --test test/e2e/provider-topology/{compare,corpus,metric-schema,summarize}.test.mjs
      - name: Install the native C/C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config
      - uses: docker/setup-buildx-action@v3
      - name: Build and exercise baseline and candidate on the same host
        env:
          KURA_QUALIFICATION_OUTPUT: ${{ runner.temp }}/kura-trust-evidence
          KURA_TRUST_RESOURCE_REPETITIONS: ${{ inputs.resource_repetitions || '1' }}
        run: bash test/e2e/certificate-trust/qualify-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kura-build-only-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          # Never upload whole resource directories: they contain private test keys.
          path: |
            ${{ runner.temp }}/kura-trust-evidence/SOURCE
            ${{ runner.temp }}/kura-trust-evidence/*.txt
            ${{ runner.temp }}/kura-trust-evidence/*.json
            ${{ runner.temp }}/kura-trust-evidence/*.xml
            ${{ runner.temp }}/kura-trust-evidence/before-*/result.json
            ${{ runner.temp }}/kura-trust-evidence/before-*/summary.json
            ${{ runner.temp }}/kura-trust-evidence/before-*/*.prom
            ${{ runner.temp }}/kura-trust-evidence/after-*/result.json
            ${{ runner.temp }}/kura-trust-evidence/after-*/summary.json
            ${{ runner.temp }}/kura-trust-evidence/after-*/*.prom
  build-and-push:
    name: Build and push (amd64)
    if: ${{ !inputs.qualification_only }}
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
    runs-on: tuist-linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/mise
        with:
          install_args: "rust bazel tuist"
          working_directory: kura

      - name: Install C/C++ toolchain for -sys crates (rocksdb/aws-lc bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config
      # Remote cache is best-effort: auth/setup is continue-on-error and `.bazelrc` try-imports
      # `.bazelrc.tuist`, so if it fails the build runs cold locally rather than blocking.
      - name: Set up the Tuist remote cache
        run: |
          tuist auth login
          tuist bazel setup
        continue-on-error: true
      - name: Warn when the Tuist remote cache is unavailable
        if: ${{ hashFiles('kura/.bazelrc.tuist') == '' }}
        run: echo "::warning::Tuist remote cache unavailable (.bazelrc.tuist not written); building cold against the local cache."

      - name: Build the Kura binary with Bazel
        run: |
          mise run --skip-tools compile
          mkdir -p bin/amd64
          cp bazel-bin/kura bin/amd64/kura
          chmod +x bin/amd64/kura

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./kura
          file: ./kura/Dockerfile.release
          build-contexts: certificate-trust=./infra/certificate-trust
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=kura-runtime
          cache-to: type=gha,mode=max,scope=kura-runtime

      - name: Print deploy hint
        run: |
          echo "Pushed ${REGISTRY}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          echo "Deploy with: Server Deployment (staging) commit_sha=${GITHUB_SHA} kura_runtime_image_tag=${{ steps.tag.outputs.tag }}"
