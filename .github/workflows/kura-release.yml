name: Kura Canary Release

# Every Kura-touching commit to main publishes a canary prerelease
# (kura@X.Y.0-canary.N). Canaries are the bleeding edge: marked as a GitHub
# prerelease, never moved to "Latest", and never push :latest on GHCR, so
# self-hosted operators pinning `ghcr.io/tuist/kura:<semver>` or `:latest`
# never pick them up unless they opt in explicitly.
#
# Stable releases are NOT cut from main. A line is frozen onto a
# releases/kura-<major>.<minor>.x branch and published as an RC
# (kura-rc.yml), soaks, then is promoted to stable X.Y.0 (kura-promote.yml).
# Canary always targets the next unreleased minor: once an RC line is cut,
# main's canary advances to the following minor.
#
# Hosted environments run these canaries: server-deployment.yml pins the
# newest `kura@` canary in the deployed commit, and the `deploy` job below
# dispatches the server deploy cascade once a canary is published, so a
# Kura change reaches hosted production like a server change does. The
# RC/stable train only serves self-hosted operators.
on:
  push:
    branches:
      - main
    paths:
      - kura/**
      - mise/tasks/kura/**
      - mise/tasks/release/components.json
      - .github/workflows/kura-release.yml
      - .github/workflows/kura-rc.yml
      - .github/workflows/kura-promote.yml
      - .github/workflows/kura-build-publish.yml

permissions:
  contents: write
  pull-requests: read
  statuses: write
  packages: write
  id-token: write

concurrency:
  # Serialize all Kura publishing (canaries, RCs, promotions) through one
  # ref-independent group. They all derive the next version from the tag set
  # and create tags, so they must never run concurrently. Queue rather than
  # cancel so each release publishes atomically. kura-rc.yml and
  # kura-promote.yml share this group.
  group: kura-publish
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  GITHUB_TOKEN: ${{ secrets.TUIST_RELEASE_GITHUB_TOKEN || github.token }}
  MISE_GITHUB_ATTESTATIONS: 0

jobs:
  resolve:
    name: Resolve canary version
    if: github.repository == 'tuist/tuist'
    runs-on: tuist-linux
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changelog_from: ${{ steps.resolve.outputs.changelog_from }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mise
        with:
          install_args: "--locked git-cliff jq"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - id: resolve
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -qE '^kura@[0-9]+\.[0-9]+\.0-canary\.[0-9]+$'; then
            echo "HEAD already has a kura canary tag; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          mise run --no-deps --skip-tools kura:release:channel-version -- canary

  build-publish:
    name: Build and publish canary
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    uses: ./.github/workflows/kura-build-publish.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ github.sha }}
      changelog_from: ${{ needs.resolve.outputs.changelog_from }}
      make_latest: false
      prerelease: true
    secrets: inherit

  deploy:
    name: Deploy canary to hosted environments
    needs: build-publish
    runs-on: tuist-linux
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Server Production Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run server-production-deployment.yml --repo "${{ github.repository }}" --ref main
