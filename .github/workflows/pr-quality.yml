name: Pull request quality

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.repository == 'tuist/tuist' && !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Execute only trusted base code. Fetch contributor commits as data, never check them out.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install evaluator dependencies
        run: npm ci --ignore-scripts --prefix .github/scripts/pr-quality
      - uses: 1password/install-cli-action@v2
        if: vars.PR_QUALITY_INFERENCE_BASE_URL == ''
      # Resolve the key in its own step so the evaluator never sees the repo-wide service-account token.
      - name: Load Jev key from 1Password
        if: vars.PR_QUALITY_INFERENCE_BASE_URL == ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          JEV_API_KEY=$(op read 'op://tuist/JEV_API_KEY/password')
          echo "::add-mask::$JEV_API_KEY"
          echo "JEV_API_KEY=$JEV_API_KEY" >> "$GITHUB_ENV"
      - name: Load Atlas profile token
        if: vars.PR_QUALITY_INFERENCE_BASE_URL != ''
        env:
          ATLAS_PROFILE_TOKEN: ${{ secrets.PR_QUALITY_INFERENCE_TOKEN }}
          ATLAS_PROFILE_MODEL: ${{ vars.PR_QUALITY_INFERENCE_MODEL }}
        run: |
          if [ -z "$ATLAS_PROFILE_TOKEN" ] || [ -z "$ATLAS_PROFILE_MODEL" ]; then
            echo "::error::Configure PR_QUALITY_INFERENCE_TOKEN and PR_QUALITY_INFERENCE_MODEL for the Atlas relay."
            exit 1
          fi
          echo "::add-mask::$ATLAS_PROFILE_TOKEN"
          echo "JEV_API_KEY=$ATLAS_PROFILE_TOKEN" >> "$GITHUB_ENV"
      - name: Evaluate and publish quality findings
        env:
          GH_TOKEN: ${{ github.token }}
          JEV_BASE_URL: ${{ vars.PR_QUALITY_INFERENCE_BASE_URL || 'https://api.typesafe.ai' }}
          JEV_MODEL: ${{ vars.PR_QUALITY_INFERENCE_MODEL || 'jev-latest' }}
        run: node .github/scripts/pr-quality/run.mjs --post
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-${{ github.event.pull_request.number }}
          path: |
            pr-quality.json
            pr-quality-error.json
            pr-quality.md
          if-no-files-found: ignore
          retention-days: 14
