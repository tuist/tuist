name: Atlas

# Bench branch only: compares cold and warm Struo builds of
# atlas/mix_application_test, local against Tuist remote execution in
# production, the way run 44296966109 did for Once candidates 9 and 10.

on:
  workflow_dispatch:
    inputs:
      struo_version:
        description: Published Struo release to measure
        default: "2.19.0"
      struo_sha256:
        description: SHA-256 of its x86_64 Linux archive
        default: 0d3bd2d809afaffd8d9f087a58740c8f43e83ba7783cf63a8c99401e95c3b02a
      candidate_ref:
        description: Optional tuist/struo ref built from source and measured as an extra remote mode
        default: ""

permissions:
  contents: read

jobs:
  candidate:
    name: Build Struo candidate
    if: inputs.candidate_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tuist/struo
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2-dev protobuf-compiler pkg-config
          cargo build --release --locked -p struo
          mkdir -p dist && cp target/release/struo dist/
          git rev-parse HEAD > dist/commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: struo-candidate
          path: dist

  benchmark:
    name: Struo production benchmark
    needs: [candidate]
    if: ${{ !cancelled() && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      STRUO_CACHE_PROVIDER: production
      MIX_HOME: /opt/mix
      MIX_REBAR3: /opt/mix/rebar3
      MIX_ENV: test
      ERL_FLAGS: '+S 4:4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned coordinator toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 libssl-dev libncurses6 libtinfo6 cmake pkg-config build-essential
          docker build --target elixir-toolchain -t struo-elixir-toolchain -f infra/sandbox-image/Dockerfile infra/sandbox-image
          container=$(docker create struo-elixir-toolchain true)
          trap 'docker rm "$container"' EXIT
          sudo docker cp "$container:/opt/." /opt/
          sudo chown -R "$(id -u):$(id -g)" /opt/mix
          echo /opt/erlang/bin >> "$GITHUB_PATH"
          echo /opt/elixir/bin >> "$GITHUB_PATH"
      - name: Install the published release
        env:
          VERSION: ${{ inputs.struo_version }}
          CHECKSUM: ${{ inputs.struo_sha256 }}
        run: |
          archive="struo-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fLsS --retry 3 "https://github.com/tuist/struo/releases/download/$VERSION/$archive" -o "$RUNNER_TEMP/$archive"
          echo "$CHECKSUM  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/struo-bin-release"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/struo-bin-release"
          bin=$(dirname "$(find "$RUNNER_TEMP/struo-bin-release" -type f -name struo | head -1)")
          echo "RELEASE_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/struo" --version
      - uses: actions/download-artifact@v7
        if: inputs.candidate_ref != ''
        with:
          name: struo-candidate
          path: ${{ runner.temp }}/struo-bin-candidate
      - name: Prepare the candidate
        if: inputs.candidate_ref != ''
        run: |
          chmod +x "$RUNNER_TEMP/struo-bin-candidate/struo"
          echo "CANDIDATE_BIN=$RUNNER_TEMP/struo-bin-candidate" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/struo-bin-candidate/struo" --version
      - name: Configure production execution for tuist/atlas
        run: |
          # No execution_image: since 2.19.0 the client follows the image the
          # service advertises.
          cat >> struo.toml <<'EOF'

          [infrastructures.production]
          kind = "tuist"
          account = "tuist"
          project = "atlas"

          [infrastructure.execution]
          provider = "production"

          [infrastructure.execution.properties.elixir]
          schema_version = 1
          os = "linux"
          arch = "x86_64"
          elixir_bin = "/opt/elixir/bin"
          erlang_bin = "/opt/erlang/bin"
          mix_home = "/opt/mix"
          rebar3 = "/opt/mix/rebar3"
          EOF
          mkdir -p "$RUNNER_TEMP/struo-evidence"
          cp struo.toml "$RUNNER_TEMP/struo-evidence/struo.toml"
          nproc | tee "$RUNNER_TEMP/struo-evidence/coordinator-cpus.txt"
          free -b > "$RUNNER_TEMP/struo-evidence/coordinator-memory.txt"
          "$RELEASE_BIN/struo" auth login --provider production --no-browser
      - name: Materialize locked dependency sources
        working-directory: atlas
        run: mix deps.get --check-locked
      - name: Exercise remote execution and remote-cache reuse
        run: |
          set -euo pipefail
          coordinator_path="$PATH"
          extra=""
          if [ -n "${CANDIDATE_BIN:-}" ]; then extra="remote-candidate"; fi
          # Each mode builds cold, then warm from the remote cache, on this
          # runner; modes rotate so no mode always runs first.
          for trial in 1 2 3; do
            case "$trial" in
              1) modes="local remote $extra" ;;
              2) modes="remote $extra local" ;;
              3) modes="$extra local remote" ;;
            esac
            for mode in $modes; do
              bin="$RELEASE_BIN"
              remote_flags=(--remote --compute production)
              case "$mode" in
                local) remote_flags=() ;;
                remote-candidate) bin="$CANDIDATE_BIN" ;;
              esac
              export PATH="$bin:$coordinator_path"
              token="struo-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$trial-$mode"
              evidence="$RUNNER_TEMP/struo-evidence/$mode/trial-$trial"
              mkdir -p "$evidence"
              struo --version | tee "$evidence/version.txt"
              for phase in cold warm; do
                rm -rf .struo
                export XDG_CACHE_HOME="$RUNNER_TEMP/struo-cache-$mode-$trial-$phase"
                export XDG_STATE_HOME="$evidence/$phase-state"
                /usr/bin/time -f '%e' -o "$evidence/$phase-wall-seconds.txt" \
                  struo -vv build "${remote_flags[@]}" --config "token=$token" atlas/mix_application_test \
                  2>&1 | tee "$evidence/$phase.log"
                struo --format json cache stats > "$evidence/$phase-cache-stats.json"
                find .struo/out -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/$phase-files.txt"
                find .struo/out -type l -printf '%p -> %l\n' | sort > "$evidence/$phase-links.txt"
                test -s "$evidence/$phase-files.txt"
              done
              if [ "$mode" = local ]; then
                # Local compile digests are not stable across runs, so the
                # warm local build recompiles and its outputs are not compared.
                if grep -q 'remote action completed' "$evidence/cold.log"; then
                  echo 'The local baseline dispatched worker actions' >&2
                  exit 1
                fi
              else
                diff -u "$evidence/cold-files.txt" "$evidence/warm-files.txt"
                diff -u "$evidence/cold-links.txt" "$evidence/warm-links.txt"
                grep -q 'remote action completed' "$evidence/cold.log"
              fi
              if grep -q 'remote execution response' "$evidence/warm.log"; then
                echo 'Warm restoration unexpectedly dispatched worker actions' >&2
                exit 1
              fi
            done
          done
      - name: Summarize
        if: always()
        run: |
          cd "$RUNNER_TEMP/struo-evidence"
          for f in */trial-*/*-wall-seconds.txt; do echo "$f $(cat "$f")"; done | tee summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: struo-production-evidence
          path: ${{ runner.temp }}/struo-evidence
