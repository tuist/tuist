name: Atlas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - atlas/**
      - condukt/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
      - .github/workflows/atlas-deployment-validation.yml
      - once.toml
      # Grouping cases shared with Pulse's sentry_errors pipeline.
      - infra/helm/pulse/sentry-errors-cases.json
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - atlas/**
      - condukt/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
      - .github/workflows/atlas-deployment-validation.yml
      - once.toml
      # Grouping cases shared with Pulse's sentry_errors pipeline.
      - infra/helm/pulse/sentry-errors-cases.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

defaults:
  run:
    working-directory: atlas

jobs:
  staging-remote-execution:
    name: Once staging qualification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      TUIST_URL: https://staging.tuist.dev
      ONCE_CACHE_PROVIDER: staging
      MIX_HOME: /opt/mix
      MIX_REBAR3: /opt/mix/rebar3
      ERL_FLAGS: '+S 4:4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned coordinator toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 libssl-dev libncurses6 libtinfo6 cmake pkg-config build-essential
          docker build --target elixir-toolchain -t once-elixir-toolchain -f infra/sandbox-image/Dockerfile infra/sandbox-image
          container=$(docker create once-elixir-toolchain true)
          trap 'docker rm "$container"' EXIT
          sudo docker cp "$container:/opt/." /opt/
          sudo chown -R "$(id -u):$(id -g)" /opt/mix
          echo /opt/erlang/bin >> "$GITHUB_PATH"
          echo /opt/elixir/bin >> "$GITHUB_PATH"
      - name: Install the published candidate
        run: |
          archive=once-0.82.6-once-re.4-x86_64-unknown-linux-gnu.tar.gz
          curl -fLsS --retry 3 "https://github.com/tuist/once/releases/download/0.82.6-once-re.4/$archive" -o "$RUNNER_TEMP/$archive"
          echo "eeb386e3c99754d9dafbd1a1499b02b0927fdc5a8a1c66476b3c4e6956ab18e8  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/once-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/once-bin"
          echo "$RUNNER_TEMP/once-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/once-bin/once" --version
      - name: Configure staging without production credentials
        run: |
          cat >> once.toml <<'EOF'

          [infrastructures.staging]
          kind = "tuist"
          account = "tuist"
          project = "kura"
          url = "https://staging.tuist.dev"
          execution_image = "sha-4f5b165bf63c"

          [infrastructure.execution]
          provider = "staging"

          [infrastructure.execution.properties.elixir]
          schema_version = 1
          environment = "sha-4f5b165bf63c"
          os = "linux"
          arch = "x86_64"
          elixir_bin = "/opt/elixir/bin"
          erlang_bin = "/opt/erlang/bin"
          mix_home = "/opt/mix"
          rebar3 = "/opt/mix/rebar3"
          EOF
          mkdir -p "$RUNNER_TEMP/once-evidence"
          cp once.toml "$RUNNER_TEMP/once-evidence/once.toml"
          nproc | tee "$RUNNER_TEMP/once-evidence/coordinator-cpus.txt"
          free -b > "$RUNNER_TEMP/once-evidence/coordinator-memory.txt"
          once auth login --provider staging --no-browser
      - name: Materialize locked dependency sources
        working-directory: atlas
        run: mix deps.get --check-locked
      - name: Exercise remote execution and remote-cache reuse
        run: |
          set -euo pipefail
          token="once-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for phase in cold warm; do
            rm -rf .once
            export XDG_CACHE_HOME="$RUNNER_TEMP/once-cache-$phase"
            export XDG_STATE_HOME="$RUNNER_TEMP/once-evidence/$phase-state"
            /usr/bin/time -f '%e' -o "$RUNNER_TEMP/once-evidence/$phase-wall-seconds.txt" \
              once -vv build --remote --compute staging --config "token=$token" atlas/mix_application_test \
              2>&1 | tee "$RUNNER_TEMP/once-evidence/$phase.log"
            once --format json cache stats > "$RUNNER_TEMP/once-evidence/$phase-cache-stats.json"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: once-staging-evidence
          path: ${{ runner.temp }}/once-evidence

  automation-contracts:
    name: Automation compatibility
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir
          working-directory: atlas
      - name: Preserve published behavior contracts
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git rev-parse --verify "$CONTRACT_BASE_SHA^{commit}"
          previous="$(mktemp)"
          trap 'rm -f "$previous"' EXIT
          path="atlas/priv/automation/contracts/v1.json"
          if git cat-file -e "$CONTRACT_BASE_SHA:$path"; then
            git show "$CONTRACT_BASE_SHA:$path" > "$previous"
          else
            printf '{"operations":[]}' > "$previous"
          fi
          elixir scripts/check_automation_contracts.exs "$previous"

  deployment:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/atlas-deployment-validation.yml

  # Build, lint, and test run through Once, which derives the graph from
  # atlas/mix.exs and shares results through the tuist/atlas project. Forks
  # can't mint an OIDC token, so they fall back to the local cache.
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch'
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      - name: Build
        working-directory: .
        run: once build atlas/mix_application_test
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist' || 'local' }}

      # Once persists the compiler's stderr as a build output, so this also
      # catches warnings replayed from a cached compilation. Lines from mise's
      # tool shims land there too and are not compiler warnings.
      - name: Fail on compiler warnings
        working-directory: .
        run: |
          warnings=$(grep -v -E '^(mise |hint: .*mise)' .once/out/atlas/mix_application_test/mix-project-warnings.log || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi

  format:
    name: Format
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      # Runs `mix deps.unlock --check-unused` and `mix format --check-formatted`.
      - name: Lint
        working-directory: .
        run: once run atlas/mix_lint
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist' || 'local' }}

  credo:
    name: Credo
    runs-on: tuist-linux
    needs: build
    defaults:
      run:
        working-directory: atlas

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node
          working-directory: atlas

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix credo

  test:
    name: Test
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - name: Install document and label rendering tools
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils libvips-tools fonts-dejavu-core

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      # Discovered Mix tests run on every invocation and keep the project's
      # `test` alias, so the database is created and migrated as before.
      - name: Test
        id: tests
        working-directory: .
        run: once test atlas/mix_tests
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist' || 'local' }}

      - name: Upload test logs
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-test-logs
          include-hidden-files: true
          path: .once/out/atlas/mix_tests/test/

  # Builds atlas/Dockerfile through Once. Instructions are cached individually
  # in the tuist/atlas-oci project, separate from the Mix build. Publishing
  # still happens in atlas-release.yml.
  image:
    name: Image
    if: github.event_name != 'workflow_dispatch'
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        working-directory: atlas
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      - name: Build image
        run: once build atlas_image
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist-oci' || 'local' }}

  inbox-worker:
    name: Inbox Worker
    if: github.event_name != 'workflow_dispatch'
    runs-on: tuist-linux
    defaults:
      run:
        working-directory: atlas/workers/inbox

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: node
          working-directory: atlas/workers/inbox

      # aube is pinned in atlas/mise.toml at a version newer than the
      # root mise.lock's aube entry, so `mise install --locked` refuses
      # it. Install it unlocked; the aube-lock.yaml pins the JS
      # dependency graph, which is what actually matters here.
      - name: Install aube
        working-directory: atlas
        run: mise install aube

      - name: Restore Aube cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/aube
            ~/.cache/aube
          key: aube-${{ hashFiles('atlas/workers/inbox/aube-lock.yaml') }}

      - run: aube ci

      - run: aube run check

      - run: aube test
