name: Atlas

on:
  push:
    branches: [main]
    paths:
      - atlas/**
      - condukt/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
      - .github/workflows/atlas-deployment-validation.yml
      - struo.toml
      # Grouping cases shared with Pulse's sentry_errors pipeline.
      - infra/helm/pulse/sentry-errors-cases.json
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - atlas/**
      - condukt/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
      - .github/workflows/atlas-deployment-validation.yml
      - struo.toml
      # Grouping cases shared with Pulse's sentry_errors pipeline.
      - infra/helm/pulse/sentry-errors-cases.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

defaults:
  run:
    working-directory: atlas

jobs:
  automation-contracts:
    name: Automation compatibility
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir
          working-directory: atlas
      - name: Preserve published behavior contracts
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git rev-parse --verify "$CONTRACT_BASE_SHA^{commit}"
          previous="$(mktemp)"
          trap 'rm -f "$previous"' EXIT
          path="atlas/priv/automation/contracts/v1.json"
          if git cat-file -e "$CONTRACT_BASE_SHA:$path"; then
            git show "$CONTRACT_BASE_SHA:$path" > "$previous"
          else
            printf '{"operations":[]}' > "$previous"
          fi
          elixir scripts/check_automation_contracts.exs "$previous"

  deployment:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/atlas-deployment-validation.yml

  # Build, lint, and test run through Struo, which derives the graph from
  # atlas/mix.exs and shares results through the tuist/atlas project. Forks
  # can't mint an OIDC token, so they fall back to the local cache.
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch'
    runs-on: tuist-linux-large
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/struo
          working-directory: atlas

      # The Linux Struo binary links against ALSA for its sound cues.
      - name: Install Struo runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Struo runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Struo on PATH
        run: dirname "$(mise which struo)" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Struo cache
        id: struo-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: struo auth login --provider tuist --no-browser

      - name: Build
        working-directory: .
        run: struo build atlas/mix_application_test
        env:
          STRUO_CACHE_PROVIDER: ${{ steps.struo-auth.outcome == 'success' && 'tuist' || 'local' }}

      # Struo persists the compiler's stderr as a build output, so this also
      # catches warnings replayed from a cached compilation. Lines from mise's
      # tool shims land there too and are not compiler warnings.
      - name: Fail on compiler warnings
        working-directory: .
        run: |
          warnings=$(grep -v -E '^(mise |hint: .*mise)' .struo/out/atlas/mix_application_test/mix-project-warnings.log || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi

  format:
    name: Format
    runs-on: tuist-linux-large
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/struo
          working-directory: atlas

      # The Linux Struo binary links against ALSA for its sound cues.
      - name: Install Struo runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Struo runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Struo on PATH
        run: dirname "$(mise which struo)" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Struo cache
        id: struo-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: struo auth login --provider tuist --no-browser

      # Runs `mix deps.unlock --check-unused` and `mix format --check-formatted`.
      - name: Lint
        working-directory: .
        run: struo run atlas/mix_lint
        env:
          STRUO_CACHE_PROVIDER: ${{ steps.struo-auth.outcome == 'success' && 'tuist' || 'local' }}

  credo:
    name: Credo
    runs-on: tuist-linux
    needs: build
    defaults:
      run:
        working-directory: atlas

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node
          working-directory: atlas

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix credo

  test:
    name: Test
    runs-on: tuist-linux-large
    needs: build
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/struo
          working-directory: atlas

      # The Linux Struo binary links against ALSA for its sound cues.
      - name: Install Struo runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Struo runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Struo on PATH
        run: dirname "$(mise which struo)" >> "$GITHUB_PATH"

      - name: Install document and label rendering tools
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils libvips-tools fonts-dejavu-core

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Struo cache
        id: struo-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: struo auth login --provider tuist --no-browser

      # Discovered Mix tests run on every invocation and keep the project's
      # `test` alias, so the database is created and migrated as before.
      - name: Test
        id: tests
        working-directory: .
        run: struo test atlas/mix_tests
        env:
          STRUO_CACHE_PROVIDER: ${{ steps.struo-auth.outcome == 'success' && 'tuist' || 'local' }}

      - name: Upload test logs
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-test-logs
          include-hidden-files: true
          path: .struo/out/atlas/mix_tests/test/

  # Builds atlas/Dockerfile through Struo. Instructions are cached individually
  # in the tuist/atlas-oci project, separate from the Mix build. Publishing
  # still happens in atlas-release.yml.
  image:
    name: Image
    if: github.event_name != 'workflow_dispatch'
    runs-on: tuist-linux-large
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: github:tuist/struo
          working-directory: atlas

      # The Linux Struo binary links against ALSA for its sound cues.
      - name: Install Struo runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Struo runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Struo on PATH
        working-directory: atlas
        run: dirname "$(mise which struo)" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate the Struo cache
        id: struo-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: struo auth login --provider tuist --no-browser

      - name: Build image
        run: struo build atlas_image
        env:
          STRUO_CACHE_PROVIDER: ${{ steps.struo-auth.outcome == 'success' && 'tuist-oci' || 'local' }}

  inbox-worker:
    name: Inbox Worker
    if: github.event_name != 'workflow_dispatch'
    runs-on: tuist-linux
    defaults:
      run:
        working-directory: atlas/workers/inbox

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: node
          working-directory: atlas/workers/inbox

      # aube is pinned in atlas/mise.toml at a version newer than the
      # root mise.lock's aube entry, so `mise install --locked` refuses
      # it. Install it unlocked; the aube-lock.yaml pins the JS
      # dependency graph, which is what actually matters here.
      - name: Install aube
        working-directory: atlas
        run: mise install aube

      - name: Restore Aube cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/aube
            ~/.cache/aube
          key: aube-${{ hashFiles('atlas/workers/inbox/aube-lock.yaml') }}

      - run: aube ci

      - run: aube run check

      - run: aube test

  # Manual proof that a released Struo client builds Atlas on Tuist remote
  # execution without pinning the worker image.
  struo-remote-execution-proof:
    name: Struo remote execution proof
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    env:
      STRUO_VERSION: "2.3.1"
      STRUO_CACHE_PROVIDER: tuist
      MIX_HOME: /opt/mix
      MIX_REBAR3: /opt/mix/rebar3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the coordinator Elixir toolchain from the worker image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 libncurses6 libtinfo6
          docker build --target elixir-toolchain -t struo-elixir-toolchain -f infra/sandbox-image/Dockerfile infra/sandbox-image
          container=$(docker create struo-elixir-toolchain true)
          trap 'docker rm "$container"' EXIT
          sudo docker cp "$container:/opt/." /opt/
          sudo chown -R "$(id -u):$(id -g)" /opt/mix
          echo /opt/erlang/bin >> "$GITHUB_PATH"
          echo /opt/elixir/bin >> "$GITHUB_PATH"
      - name: Install the released Struo client
        run: |
          archive="struo-$STRUO_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/tuist/struo/releases/download/$STRUO_VERSION"
          curl -fLsS --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fLsS --retry 3 "$base/$archive.sha256" -o "$RUNNER_TEMP/$archive.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$archive.sha256")
          mkdir -p "$RUNNER_TEMP/struo-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/struo-bin"
          bin=$(dirname "$(find "$RUNNER_TEMP/struo-bin" -type f -name struo | head -n1)")
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/struo" --version
      - name: Configure remote execution without pinning the worker image
        run: |
          cat >> struo.toml <<'EOF'

          [infrastructure.execution]
          provider = "tuist"

          [infrastructure.execution.properties.elixir]
          schema_version = 1
          os = "linux"
          arch = "x86_64"
          elixir_bin = "/opt/elixir/bin"
          erlang_bin = "/opt/erlang/bin"
          mix_home = "/opt/mix"
          rebar3 = "/opt/mix/rebar3"
          EOF
          ! grep -q execution_image struo.toml
          mkdir -p "$RUNNER_TEMP/evidence"
          cp struo.toml "$RUNNER_TEMP/evidence/struo.toml"
          struo --version | tee "$RUNNER_TEMP/evidence/version.txt"
          struo auth login --provider tuist --no-browser
      - name: Materialize locked dependency sources
        working-directory: atlas
        run: mix deps.get --check-locked
      - name: Build on remote execution, then restore from another coordinator
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          token="struo-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run() {
            phase="$1"; shift
            rm -rf .struo
            export XDG_DATA_HOME="$RUNNER_TEMP/data" HOME="$RUNNER_TEMP/home-$phase" XDG_CACHE_HOME="$RUNNER_TEMP/cache-$phase" XDG_STATE_HOME="$evidence/$phase-state"
            mkdir -p "$HOME"
            /usr/bin/time -f '%e' -o "$evidence/$phase-wall-seconds.txt" \
              struo -vv build "$@" --config "token=$token-$phase_group" atlas/mix_application_test 2>&1 | tee "$evidence/$phase.log"
            find .struo/out -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/$phase-files.txt"
            find .struo/out -type l -printf '%p -> %l\n' | sort > "$evidence/$phase-links.txt"
            test -s "$evidence/$phase-files.txt"
          }
          # Remote: cold build on workers, then a warm build that must restore
          # every action from the cache with no worker calls.
          phase_group=remote
          run remote-cold --remote
          grep -q 'remote action completed' "$evidence/remote-cold.log"
          grep 'resolved Tuist execution image' "$evidence/remote-cold.log" | head -n1
          run remote-warm --remote
          if grep -q 'remote execution response' "$evidence/remote-warm.log"; then
            echo 'Warm restoration dispatched worker actions' >&2; exit 1
          fi
          diff -u "$evidence/remote-cold-files.txt" "$evidence/remote-warm-files.txt"
          diff -u "$evidence/remote-cold-links.txt" "$evidence/remote-warm-links.txt"
          # Local: a different HOME and cache directory must reuse the first
          # coordinator's local results.
          phase_group=local
          run local-cold
          run local-warm
          # Strip terminal colors so the structured cache fields match.
          sed 's/\x1b\[[0-9;]*m//g' "$evidence/local-warm.log" > "$evidence/local-warm.plain.log"
          misses=$(grep -c 'cache="miss"' "$evidence/local-warm.plain.log" || true)
          hits=$(grep -c 'cache="hit"' "$evidence/local-warm.plain.log" || true)
          echo "local warm: $hits action hits, $misses misses" | tee "$evidence/local-warm-cache.txt"
          test "$hits" -gt 0
          if [ "$misses" -ne 0 ]; then
            echo 'Local warm build missed the cache from another HOME:' >&2
            grep 'cache="miss"' "$evidence/local-warm.plain.log" | grep -oE 'identifier=[^ ]+' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: struo-remote-execution-proof
          path: ${{ runner.temp }}/evidence
