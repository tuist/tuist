name: Atlas

on:
  push:
    branches: [main]
    paths:
      - atlas/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
      - .github/workflows/atlas-deployment-validation.yml
      - once.toml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - atlas/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
      - .github/workflows/atlas-deployment-validation.yml
      - once.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

defaults:
  run:
    working-directory: atlas

jobs:
  deployment:
    uses: ./.github/workflows/atlas-deployment-validation.yml

  # Build, lint, and test run through Once, which derives the graph from
  # atlas/mix.exs and shares results through the tuist/atlas project. Forks
  # can't mint an OIDC token, so they fall back to the local cache.
  build:
    name: Build
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      - name: Build
        working-directory: .
        run: once build atlas/mix_application_test
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist' || 'local' }}

      # Once persists the compiler's stderr as a build output, so this also
      # catches warnings replayed from a cached compilation. Lines from mise's
      # tool shims land there too and are not compiler warnings.
      - name: Fail on compiler warnings
        working-directory: .
        run: |
          warnings=$(grep -v -E '^(mise |hint: .*mise)' .once/out/atlas/mix_application_test/mix-project-warnings.log || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi

  format:
    name: Format
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      # Runs `mix deps.unlock --check-unused` and `mix format --check-formatted`.
      - name: Lint
        working-directory: .
        run: once run atlas/mix_lint
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist' || 'local' }}

  credo:
    name: Credo
    runs-on: tuist-linux
    needs: build
    defaults:
      run:
        working-directory: atlas

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node
          working-directory: atlas

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix credo

  test:
    name: Test
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: erlang elixir node github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - name: Install PDF text extraction tools
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Materialize locked dependency sources
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      # Discovered Mix tests run on every invocation and keep the project's
      # `test` alias, so the database is created and migrated as before.
      - name: Test
        id: tests
        working-directory: .
        run: once test atlas/mix_tests
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist' || 'local' }}

      - name: Upload test logs
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-test-logs
          include-hidden-files: true
          path: .once/out/atlas/mix_tests/test/

  # Builds atlas/Dockerfile through Once. Instructions are cached individually
  # in the tuist/atlas-oci project, separate from the Mix build. Publishing
  # still happens in atlas-release.yml.
  image:
    name: Image
    # The Once Linux binary needs glibc 2.39, newer than the Ubuntu
    # 22.04 image behind tuist-linux. Move back once Once targets an older glibc.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: github:tuist/once
          working-directory: atlas

      # The Linux Once binary links against ALSA for its sound cues.
      - name: Install Once runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Once runs from the repository root, where the workspace manifest lives,
      # but the tool is pinned in atlas/mise.toml.
      - name: Put Once on PATH
        working-directory: atlas
        run: dirname "$(mise which once)" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate the Once cache
        id: once-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: once auth login --provider tuist --no-browser

      - name: Build image
        run: once build atlas_image
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-auth.outcome == 'success' && 'tuist-oci' || 'local' }}

  inbox-worker:
    name: Inbox Worker
    runs-on: tuist-linux
    defaults:
      run:
        working-directory: atlas/workers/inbox

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/mise-install
        with:
          install: node
          working-directory: atlas/workers/inbox

      # aube is pinned in atlas/mise.toml at a version newer than the
      # root mise.lock's aube entry, so `mise install --locked` refuses
      # it. Install it unlocked; the aube-lock.yaml pins the JS
      # dependency graph, which is what actually matters here.
      - name: Install aube
        working-directory: atlas
        run: mise install aube

      - name: Restore Aube cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/aube
            ~/.cache/aube
          key: aube-${{ hashFiles('atlas/workers/inbox/aube-lock.yaml') }}

      - run: aube ci

      - run: aube run check

      - run: aube test
