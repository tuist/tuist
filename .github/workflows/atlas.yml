name: Atlas

on:
  push:
    branches: [main]
    paths:
      - atlas/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - atlas/**
      - infra/helm/atlas/**
      - infra/k8s/atlas/**
      - .github/workflows/atlas.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

defaults:
  run:
    working-directory: atlas

jobs:
  build:
    name: Build
    runs-on: tuist-linux
    defaults:
      run:
        working-directory: atlas

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir node"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

  format:
    name: Format
    runs-on: tuist-linux
    needs: build
    defaults:
      run:
        working-directory: atlas

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir node"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: tuist-linux
    needs: build
    defaults:
      run:
        working-directory: atlas

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir node"

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix credo

  test:
    name: Test
    runs-on: tuist-linux
    needs: build
    defaults:
      run:
        working-directory: atlas

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir node"

      - name: Install PDF text extraction tools
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: atlas/deps
          key: deps-${{ runner.os }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: atlas/_build
          key: build-${{ runner.os }}-${{ env.MIX_ENV }}-${{ hashFiles('atlas/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      - run: mix test

  inbox-worker:
    name: Inbox Worker
    runs-on: tuist-linux
    defaults:
      run:
        working-directory: atlas/workers/inbox

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: "node aube"

      - name: Restore Aube cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/aube
            ~/.cache/aube
          key: aube-${{ hashFiles('atlas/workers/inbox/aube-lock.yaml') }}

      - run: aube ci

      - run: aube run check

      - run: aube test
