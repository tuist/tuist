name: macOS Xcode bundle experiment

# Throwaway experiment (branch exp/xcode-bundle-tahoe-27 only): builds a Tahoe
# image holding Xcode 27.0, 27.1 and 27.2 by adding one Xcode at a time on top
# of macos-tahoe-xcode:27-0, pushes each step to an `exp-bundle-*` tag of that
# repository (no profile, release or pool names these tags), and measures size,
# layer reuse, pull time, boot time, xcode-select cost and first simulator boot.
# Every measurement line starts with BUNDLE-EXP.

on:
  push:
    branches: [exp/xcode-bundle-tahoe-27]
    paths: [.github/workflows/macos-xcode-bundle-experiment.yml]

concurrency:
  group: macos-xcode-bundle-experiment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REPO: ghcr.io/tuist/macos-tahoe-xcode
  BASE_TAG: "27-0"
  TAG_A: exp-bundle-27-0-27-1
  TAG_B: exp-bundle-27-0-27-1-27-2

jobs:
  bundle:
    runs-on: [self-hosted, macos, bare-metal, vm-image-builder]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - name: Pull Xcode .xips from mirror
        id: xips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username tuist-bot --password-stdin
          for v in 27.1 27.2; do
            d="${RUNNER_TEMP}/xip-${v}"; rm -rf "$d"; mkdir -p "$d"
            oras pull "ghcr.io/tuist/xcode-xips:${v}" --output "$d"
            echo "x${v//./_}=$(ls "$d"/*.xip | head -n1)" >> "$GITHUB_OUTPUT"
          done

      - name: Initialize Packer
        working-directory: infra/macos-xcode-image/experiments
        run: |
          packer init -upgrade bundle.pkr.hcl
          packer init -upgrade measure.pkr.hcl

      - uses: ./.github/actions/reclaim-tart-disk
        with:
          keep: |
            ghcr.io/tuist/macos-tahoe-xcode:27-0

      - name: Baseline boot of the single-Xcode image
        run: |
          set -euo pipefail
          t0=$(date +%s); tart pull "$REPO:$BASE_TAG"; echo "BUNDLE-EXP pull (cache-warm or cold) 27-0 s: $(( $(date +%s) - t0 ))"
          t0=$(date +%s); tart clone "$REPO:$BASE_TAG" exp-boot-base; echo "BUNDLE-EXP clone 27-0 s: $(( $(date +%s) - t0 ))"
          t0=$(date +%s); tart run --no-graphics exp-boot-base & pid=$!
          tart ip --wait 600 exp-boot-base >/dev/null
          echo "BUNDLE-EXP boot to IP 27-0 s: $(( $(date +%s) - t0 ))"
          tart stop exp-boot-base || kill $pid || true
          wait $pid || true
          tart delete exp-boot-base || true

      - name: Add Xcode 27.1
        working-directory: infra/macos-xcode-image/experiments
        run: |
          set -euo pipefail
          t0=$(date +%s)
          env -u GITHUB_TOKEN packer build -var "base_image=$REPO:$BASE_TAG" -var output_image=exp-bundle-a \
            -var "xcode_xip_path=${{ steps.xips.outputs.x27_1 }}" -var xcode_version=27.1 bundle.pkr.hcl
          echo "BUNDLE-EXP build add 27.1 s: $(( $(date +%s) - t0 ))"

      - name: Add Xcode 27.2
        working-directory: infra/macos-xcode-image/experiments
        run: |
          set -euo pipefail
          t0=$(date +%s)
          env -u GITHUB_TOKEN packer build -var base_image=exp-bundle-a -var output_image=exp-bundle-b \
            -var "xcode_xip_path=${{ steps.xips.outputs.x27_2 }}" -var xcode_version=27.2 bundle.pkr.hcl
          echo "BUNDLE-EXP build add 27.2 s: $(( $(date +%s) - t0 ))"

      - name: Boot and measure the bundle
        working-directory: infra/macos-xcode-image/experiments
        run: |
          set -euo pipefail
          t0=$(date +%s); tart clone exp-bundle-b exp-boot-bundle; echo "BUNDLE-EXP clone bundle s: $(( $(date +%s) - t0 ))"
          t0=$(date +%s); tart run --no-graphics exp-boot-bundle & pid=$!
          tart ip --wait 600 exp-boot-bundle >/dev/null
          echo "BUNDLE-EXP boot to IP bundle s: $(( $(date +%s) - t0 ))"
          tart stop exp-boot-bundle || kill $pid || true
          wait $pid || true
          tart delete exp-boot-bundle || true
          env -u GITHUB_TOKEN packer build -var base_image=exp-bundle-b -var output_image=exp-measure measure.pkr.hcl
          tart delete exp-measure || true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login --username tuist-bot --password-stdin ghcr.io

      - name: Push two-Xcode step
        timeout-minutes: 150
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: tuist-bot
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/tart-push
        with:
          local-name: exp-bundle-a
          remote-names: ghcr.io/tuist/macos-tahoe-xcode:exp-bundle-27-0-27-1

      - name: Push three-Xcode bundle
        timeout-minutes: 150
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: tuist-bot
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/tart-push
        with:
          local-name: exp-bundle-b
          remote-names: ghcr.io/tuist/macos-tahoe-xcode:exp-bundle-27-0-27-1-27-2

      - name: Sizes and layer reuse
        run: |
          set -euo pipefail
          for t in "$BASE_TAG" "$TAG_A" "$TAG_B"; do
            crane manifest "$REPO:$t" | jq -r '.layers[] | "\(.digest) \(.size)"' | sort -u > "${RUNNER_TEMP}/L_$t"
            echo "BUNDLE-EXP $t compressed GB: $(awk '{s+=$2} END {printf "%.1f", s/1e9}' "${RUNNER_TEMP}/L_$t")"
          done
          shared() { join "${RUNNER_TEMP}/L_$1" "${RUNNER_TEMP}/L_$2" | awk '{s+=$2} END {printf "%.1f", s/1e9}'; }
          echo "BUNDLE-EXP $BASE_TAG -> $TAG_A shared GB: $(shared "$BASE_TAG" "$TAG_A")"
          echo "BUNDLE-EXP $TAG_A -> $TAG_B shared GB: $(shared "$TAG_A" "$TAG_B")"

      - name: Cold pull of the bundle from GHCR
        run: |
          set -euo pipefail
          tart delete exp-bundle-a || true
          tart delete exp-bundle-b || true
          export TART_HOME="${RUNNER_TEMP}/tart-cold"
          rm -rf "$TART_HOME"; mkdir -p "$TART_HOME"
          t0=$(date +%s); tart pull "$REPO:$TAG_B"; echo "BUNDLE-EXP cold pull bundle from GHCR s: $(( $(date +%s) - t0 ))"
          echo "BUNDLE-EXP bundle on-host GB: $(du -sk "$TART_HOME" | awk '{printf "%.1f", $1/1e6}')"
          rm -rf "$TART_HOME"

      - name: Cleanup
        if: always()
        run: |
          for vm in exp-bundle-a exp-bundle-b exp-boot-base exp-boot-bundle exp-measure; do tart delete "$vm" 2>/dev/null || true; done
          rm -rf "${RUNNER_TEMP}/tart-cold" "${RUNNER_TEMP}"/xip-*
