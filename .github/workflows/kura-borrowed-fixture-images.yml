name: Kura borrowed-volume fixture images

# Explicitly dispatched qualification artifacts only. No deploy, release tag,
# latest tag or shared build-cache write is performed by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  server:
    runs-on: tuist-linux-large
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: runner
          push: false
          tags: kura-borrowed-server:fixture-${{ github.sha }}
          outputs: type=docker,dest=/tmp/kura-borrowed-server.tar
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/tuist/tuist-buildcache:server
          build-args: |
            TUIST_HOSTED=1
            TUIST_VERSION=borrowed-fixture-${{ github.sha }}
            MIX_ENV=prod
      - uses: actions/upload-artifact@v4
        with:
          name: borrowed-server-image
          path: /tmp/kura-borrowed-server.tar
          compression-level: 0
          retention-days: 3
  csi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/kura-volumes-csi/Dockerfile
          push: false
          tags: kura-borrowed-csi:fixture-${{ github.sha }}
          outputs: type=docker,dest=/tmp/kura-borrowed-csi.tar
          build-args: |
            GO_VERSION=1.26
            VERSION=borrowed-fixture-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: borrowed-csi-image
          path: /tmp/kura-borrowed-csi.tar
          compression-level: 0
          retention-days: 3
