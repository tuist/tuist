name: Tuist Coverage

# Xcode code coverage of the tuist/tuist project (the CLI and the app). It runs
# when a run of cli.yml (`CLI`) or app.yml (`App`) finishes, and acts once every
# run of the two at that commit has finished, whatever their conclusion:
#
# - A push to main: full runs (`--no-selective-testing`) of TuistUnitTests and
#   TuistApp at the commit, then `tuist coverage complete`. They read the binary
#   cache's coverage variant (TUIST_COVERAGE_ENABLED in mise.toml), which the
#   commit's own cli.yml run just warmed (a commit cli.yml's path filter skips
#   reads the last warm); its binaries carry coverage counters and record their
#   files under a placeholder the export resolves, so a cached target is
#   measured like one built from source. The test targets link
#   TestCoverageAttribution, so each run also records which files every test
#   executed. Only the first attempt of a run triggers this: rerunning a flaky
#   job doesn't start another full run.
# - A pull request: only `tuist coverage complete` for its head commit, which
#   the pull request's selective runs measured. What they skipped is carried
#   from main's full runs. Only the pull request's current head is signalled,
#   and never a draft's, whose runs skip the tests.
#
# cli.yml's and app.yml's selective runs upload coverage too, and the server
# takes what a full run of the scheme at the commit executed out of their skips
# (tuist/tuist#14484). Fork pull requests are skipped: their runs don't
# authenticate, so they report nothing.
#
# `workflow_run` always runs this file as it is on main, so changes to it take
# effect once merged. Nothing depends on this workflow: it is not a required
# check, no deploy or release workflow waits on it, and notify-failure.yml does
# not list it.
#
# Dispatched with a `sha`, it collects an earlier commit on main instead, to
# backfill commits that had no run. Dispatch one at a time: each holds two
# macOS runners for up to two hours. A backfilled commit's sources are tested
# with this workflow's tools, because an older pin of the CLI may not upload
# coverage at all, but its .xcode-version is its own, so commits before the
# move to Xcode 27 (f834b57656) cannot run on this image. A commit measured
# after its runs is tested with its own tools, the ones its warm used.
on:
  workflow_run:
    workflows:
      - CLI
      - App
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on main to collect coverage for, instead of main's head
        required: false
        type: string

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TUIST_ENABLE_CACHING: true
  MISE_GITHUB_ATTESTATIONS: 0
  MISE_GITHUB_SLSA: 0
  # Collects per-test evidence from the linked TestCoverageAttribution package.
  TUIST_COVERAGE_EVIDENCE: "1"

# Main: one run at a time. A run in progress finishes so its coverage lands;
# the newest trigger waits behind it, and GitHub cancels any older one still
# pending, so that commit stays "Not measured" on the server.
# Pull requests: one group per branch that cancels the run in progress, since
# only the newest commit matters there.
# Dispatches: a group each (keyed by the commit, or main's head when no `sha` is
# given), so a backfill neither replaces a queued commit nor is replaced by one.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
      && format('tuist-coverage-dispatch-{0}', inputs.sha || github.sha)
      || (github.event.workflow_run.event == 'pull_request'
        && format('tuist-coverage-pr-{0}', github.event.workflow_run.head_branch)
        || 'tuist-coverage-main') }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  # Whether this trigger acts, on which commit, and how (`mode`: `main` or
  # `pr`; empty to skip). CLI and App each trigger this workflow when they
  # finish, so only the last of the commit's runs to finish acts, and two
  # finishing together still start one run: the one GitHub last updated wins.
  # A backfilled commit must be on main: the CLI labels the run with the branch
  # it was dispatched from, so a commit from anywhere else would be reported as
  # main's. A `workflow_run` run is labelled with main, the default branch it
  # runs on, and a pull request's commit by the `complete` job's checkout.
  gate:
    name: Resolve Commit
    runs-on: tuist-linux
    timeout-minutes: 5
    if: github.repository == 'tuist/tuist'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          skip() {
            echo "::notice::$1"
            exit 0
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$SHA" ]; then
              sha=$GITHUB_SHA
            else
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Dispatch a backfill from main, so its runs are labelled with main."
                exit 1
              fi
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha)
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq .status)
              if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
                echo "::error::$sha is not on main."
                exit 1
              fi
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "mode=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            skip "$HEAD_REPOSITORY is a fork, whose runs report nothing."
          fi
          case "$RUN_EVENT" in
            push)
              if [ "$HEAD_BRANCH" != "main" ]; then
                skip "Pushes to $HEAD_BRANCH aren't measured."
              fi
              if [ "$RUN_ATTEMPT" != "1" ]; then
                skip "Attempt $RUN_ATTEMPT of $RUN_NAME doesn't measure $HEAD_SHA again."
              fi
              mode="main"
              ;;
            pull_request)
              state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq "
                [.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\")]
                | if length == 0 then \"stale\" elif all(.[]; .draft) then \"draft\" else \"ready\" end")
              case "$state" in
                stale) skip "$HEAD_SHA is no open pull request's head." ;;
                draft) skip "$HEAD_SHA is a draft's head, whose runs skip the tests." ;;
              esac
              mode="pr"
              ;;
            *)
              skip "$RUN_EVENT runs aren't measured."
              ;;
          esac

          # The newest run of each workflow at the commit; older ones (a
          # reopened pull request, a draft marked ready) were superseded.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=$RUN_EVENT&per_page=100" --jq '
            [.workflow_runs[] | select(.path == ".github/workflows/cli.yml" or .path == ".github/workflows/app.yml")]
            | group_by(.path) | map(max_by(.id))
            | if any(.[]; .status != "completed") then "running" else (max_by([.updated_at, .id]) | .id | tostring) end')
          if [ "$last" = "running" ]; then
            skip "Another of $HEAD_SHA's runs is still going; the last to finish acts."
          fi
          if [ "$last" != "$RUN_ID" ]; then
            skip "Run $last of $HEAD_SHA finished last and acts instead."
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  cli-unit-tests:
    name: CLI Unit Tests
    needs: gate
    runs-on: tuist-macos-27-0
    timeout-minutes: 120
    if: needs.gate.outputs.mode == 'main'
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      TUIST_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN }}
      TUIST_EE: "1"
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Use this workflow's tools
        if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.sha != github.sha
        # main's mise.toml and mise.lock, and the scripts mise.toml sources, over
        # the older commit's, hidden from git: a run on a dirty checkout keeps
        # its coverage off the commit. The scripts matter: an older
        # cache_ee_env.sh turns the compilation cache back on.
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - name: Initialize TuistCacheEE submodule
        run: bash mise/tasks/cli/ee.sh
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-cli-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Package.swift') }}-
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Install stable Rust for Cargo reporting fixtures
        uses: ./.github/actions/mise
        env:
          MISE_LOCKED: 0
        with:
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
          install_args: rust
          working_directory: cas-plugin
          cache: "false"
      # Every test runs: selective testing would skip tests. Repository targets
      # come from the coverage variant of the binary cache, which this commit's
      # own cli.yml run warmed before triggering this one; a backfill reads what
      # main's warms still hold and builds the rest from source. The coverage
      # settings come from mise.toml's [env]: the schemes leave their test
      # action's coverage unset and follow TUIST_COVERAGE_ENABLED, which CLIs
      # before tuist/tuist#14404 ignore (a commit pinning one collects no
      # coverage, and `tuist coverage complete` leaves it pending). The CLI
      # makes the coverage counters atomic itself (`AtomicCoverageCounters`):
      # tests run in parallel in one process, and plain increments lose counts.
      # TUIST_COVERAGE_PREFIX_MAPPING keeps Xcode's prefix mapping in coverage
      # builds, so the compilation cache replays across runners; the CLI maps the
      # covered paths back (llvm-cov export plus each target's
      # compilation-prefix-map.json).
      - name: Run tests with coverage
        run: tuist test TuistUnitTests --no-selective-testing -- -retry-tests-on-failure -test-iterations 4

  app-tests:
    name: App Tests
    needs: gate
    runs-on: tuist-macos-27-0
    timeout-minutes: 60
    if: needs.gate.outputs.mode == 'main'
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Use this workflow's tools
        if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.sha != github.sha
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - name: Skip Xcode Macro Fingerprint Validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Skip Xcode Package Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-app-${{ hashFiles('Package.resolved', 'Package.swift') }}
      # Only the CLI, locked, as the other jobs install it. A full install on a
      # cold cache writes checksums into mise.lock for tools locked without
      # them (erlang, elixir), so the CLI reports the run from a dirty
      # checkout, whose coverage the server leaves out of the commit.
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Setup Tuist
        run: tuist setup
      - name: Install Tuist dependencies
        run: tuist install --force-resolved-versions
      - name: Run tests with coverage
        run: tuist test TuistApp --no-selective-testing -- -retry-tests-on-failure -test-iterations 4 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # Only a complete commit joins the coverage trend. On main it follows the
  # full runs, and only when both passed; on a pull request it runs alone. The
  # checkout is the commit, so the CLI signals that commit (`HEAD`), not the
  # one `workflow_run` sets GITHUB_SHA to (main's head). A CLI release older
  # than `tuist coverage complete` skips the signal, and the commit stays in
  # progress.
  complete:
    name: Complete Coverage
    needs: [gate, cli-unit-tests, app-tests]
    runs-on: tuist-macos-27-0
    timeout-minutes: 15
    if: >-
      !cancelled() && (
        needs.gate.outputs.mode == 'pr' || (
          needs.gate.outputs.mode == 'main' &&
          needs.cli-unit-tests.result == 'success' &&
          needs.app-tests.result == 'success'
        )
      )
    permissions:
      contents: read
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.TUIST_CLI_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: tuist/xcode-cache@v1
      - uses: tuist/module-cache@v1
      - name: Use this workflow's tools
        if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.sha != github.sha
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          files="mise.toml mise.lock mise/utilities/cache_ee_env.sh mise/utilities/dev_instance_env.sh"
          for file in $files; do git show "$GITHUB_SHA:$file" > "$file"; done
          # shellcheck disable=SC2086
          git update-index --skip-worktree $files
      - uses: ./.github/actions/mise
        with:
          install_args: "tuist"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Signal that the commit's coverage is complete
        # A release without the command still exits 0 for `--help`, printing
        # the root help instead. The command's usage line comes from its path,
        # not its wording, and never wraps at the command's name.
        run: |
          help=$(tuist coverage complete --help 2>/dev/null || true)
          if grep -qE "^USAGE: tuist coverage complete( |$)" <<< "$help"; then
            tuist coverage complete
          else
            echo "::notice::$(tuist version) has no 'tuist coverage complete'; the commit stays in progress until a release with it is pinned."
          fi
