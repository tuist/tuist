[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version -%}
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
{% set title = commit.remote.pr_title | default(value=commit.message) -%}
{% set parts = title | split(pat=": ") -%}
{% if parts | length > 1 -%}
- {{ parts | slice(start=1) | join(sep=": ") }}
{% else -%}
- {{ title }}
{% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat\\([^)]*\\bcondukt\\b[^)]*\\)", group = "Features" },
  { message = "^fix\\([^)]*\\bcondukt\\b[^)]*\\)", group = "Bug Fixes" },
  { message = "^(docs?|perf|refactor|style|test)\\([^)]*\\bcondukt\\b[^)]*\\)", group = "Changes" },
  { message = ".*", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^condukt@[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
initial_tag = "1.15.0"
