[settings]
# Resolve every tool through mise.lock so CI and a laptop
# get the same build, not just the same version range.
lockfile = true

[tools]
erlang = "28.3.1"
elixir = "1.20.5"
git-cliff = "2.12.0"
rust = "1.91"
# Kubernetes sandbox smoke-test tooling.
helm = "4.2.4"
kubectl = "1.34.6"
jq = "1.8.1"
