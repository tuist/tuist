# Independent Once workspace for the Linux and Windows desktop app. Cargo stays
# authoritative for the gpui dependency graph; Once derives and caches each
# locked crate separately.
[workspace]
include = ["once.toml"]
exclude = ["**/Cargo.toml"]

[infrastructure.cache]
provider = "tuist"

[infrastructures.tuist]
kind = "tuist"
account = "tuist"
# The `desktop` handle is reserved on Tuist.
project = "desktop-app"

[[target]]
name = "TuistDesktop"
kind = "cargo_workspace"
srcs = ["Cargo.toml", "Cargo.lock", "*/Cargo.toml", "crates/*/Cargo.toml", "app/src/**/*.rs", "app/resources/**/*", "crates/*/src/**/*.rs", "crates/*/src/**/*.txt"]

[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "app/Cargo.toml", "crates/*/Cargo.toml"]

[target.attrs.build_script_sources."gpui_apple@0.1.0"]
"../gpui/src/scene.rs" = "gpui@0.2.2/src/scene.rs"
"../gpui/src/geometry.rs" = "gpui@0.2.2/src/geometry.rs"
"../gpui/src/color.rs" = "gpui@0.2.2/src/color.rs"
"../gpui/src/window.rs" = "gpui@0.2.2/src/window.rs"
"../gpui/src/platform.rs" = "gpui@0.2.2/src/platform.rs"
