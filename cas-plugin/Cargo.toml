[package]
name = "tuist-cas-plugin"
version = "0.1.0"
edition = "2021"

[lib]
name = "tuist_cas_plugin"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tuist-cas-proxy"
path = "src/bin/tuist-cas-proxy.rs"

[dependencies]
libloading = "0.8"
zstd = "0.13"
# The sources registry is written by `tuist setup cache` (Swift) and read here,
# so it is JSON rather than a format each side hand-rolls and can drift on.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0"
libc = "0.2"
bazel-remote-apis = "0.27.0"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "=0.103.16", features = ["ring"] }
rustls-native-certs = "0.8"

# Already in the tree via tonic; direct deps only so the retry classifier can
# downcast a Status source chain to the transport error types (see
# `transport_caused` in src/reapi.rs).
h2 = "0.4"
hyper = "1"
prost = "0.14.1"
sha2 = "0.10"
fastcdc = "3.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "time"] }
# Analytics parity with the Swift `CASAnalyticsDatabase`: the proxy writes
# cas_analytics.db, read by the server's xcactivitylog NIF. `bundled` compiles
# SQLite in, so the universal build has no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# Formats `created_at` in the exact SQLite.swift `Date` text the shared
# cas_analytics.db uses; `macros` gives a compile-time-checked format string.
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
rustls-pemfile = "2"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
opt-level = 2
lto = "thin"
