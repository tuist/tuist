[tools]
rust = { version = "1.94.1", profile = "default", components = "clippy,rustfmt" }
tuist = "4.214.0"

[tasks.build]
description = "Build the release cas-plugin dylib and tuist-cas-proxy binary for the host arch"
run = "tuist cargo build --locked --release --lib --bin tuist-cas-proxy"

[tasks.test]
description = "Run the cas-plugin tests with Tuist build and test reporting"
run = "tuist cargo test --locked"
